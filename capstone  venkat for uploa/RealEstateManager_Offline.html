/* ---- js/facility.js ---- */
/* Module 2: Facility — cost centres (Makani), service / expense codes, payment vouchers, service requests. */
'use strict';

const Fac = {
  tab: 'vouchers',
  render() {
    const t = this.tab;
    return '<div class="tabs">' + [['vouchers', 'Payment vouchers'], ['requests', 'Service requests'], ['codes', 'Service & expense codes'], ['cc', 'Cost centre summary']].map(([k, l]) => '<a class="' + (t === k ? 'on' : '') + '" onclick="Fac.tab=\'' + k + '\';App.render()">' + l + '</a>').join('') + '</div>' +
      (t === 'vouchers' ? this.renderVouchers() : t === 'requests' ? this.renderRequests() : t === 'codes' ? this.renderCodes() : this.renderCC());
  },
  canPost() { return isRole('Accountant'); },

  /* ---------- codes ---------- */
  renderCodes() {
    const w = can('codes');
    const rows = k => col('codes').filter(c => c.kind === k).sort((a, b) => a.code.localeCompare(b.code)).map(c => [esc(c.code), esc(c.name), esc(c.group || ''), esc(Ledger.code('EXP:' + c.code)), c.active === false ? pill('Inactive') : pill('Active', 'ok'),
      w && !c.system ? '<button class="btn sec sm" onclick="Fac.editCode(\'' + c.id + '\')">Edit</button>' : (c.system ? '<span class="small muted">system</span>' : '')]);
    return '<div class="card"><h2>Direct service codes (charged to a Makani cost centre)</h2>' + table(['Code', 'Service', 'Group', 'Ledger', 'Status', ''], rows('direct')) +
      '<h3>Common expenses (fixed costs, not unit specific)</h3>' + table(['Code', 'Expense', 'Group', 'Ledger', 'Status', ''], rows('common')) +
      (w ? '<div class="btns"><button class="btn" onclick="Fac.editCode()">+ Add new code / expense</button></div>' : '') + '</div>';
  },
  editCode(id) {
    const c = id ? byId('codes', id) : {};
    openModal(id ? 'Edit code' : 'New service / expense code', '<div class="grid">' + field('Code (letters)', 'code', c.code, { req: true, readonly: !!id }) + field('Name', 'name', c.name, { req: true }) +
      field('Type', 'kind', c.kind || 'direct', { options: [{ v: 'direct', l: 'Direct – allocated to a Makani' }, { v: 'common', l: 'Common – fixed / general expense' }], blank: false }) +
      field('Group', 'group', c.group, { ph: 'Maintenance, Government, Fixed cost…' }) + field('Active', 'active', c.active !== false, { type: 'checkbox' }) + '</div>', [{ label: 'Cancel', cls: 'sec' }, { label: 'Save', onClick: async mb => {
      const f = readForm(mb); requireFields(f, [['code', 'Code'], ['name', 'Name']]); f.code = f.code.toUpperCase().replace(/[^A-Z0-9]/g, '');
      if (!id && byId('codes', f.code)) throw new Error('Code already exists');
      await commit([put('codes', Object.assign({}, c, f, { id: c.id || f.code }), id ? 'Code updated' : 'Code created')]); App.render(); } }]);
  },
  codeOptions(kind) { return col('codes').filter(c => c.active !== false && (!kind || c.kind === kind) && c.code !== 'INT' && c.code !== 'MGMT').map(c => ({ v: c.code, l: c.code + ' – ' + c.name })); },

  /* ---------- payment vouchers ---------- */
  renderVouchers() {
    const list = col('vouchers').slice().sort((a, b) => (b.date + b.no).localeCompare(a.date + a.no));
    return '<div class="card"><h2>Payment vouchers</h2><p class="muted small">Payments to suppliers, posted by the Accountant to the Makani cost centre or a common expense. Above ' + fmt(cashLimit()) + ' only cheque / bank transfer with supplier banking details.</p>' +
      table(['PV no.', 'Date', 'Payee', 'Cost centre', 'Code', 'Description', 'Amount#', 'VAT#', 'Total#', 'Mode', 'Status', ''], list.map(v => [esc(v.no), fmtDate(v.date), esc(v.supplierId ? partyName(byId('suppliers', v.supplierId)) : v.payee),
        esc(v.allocation === 'direct' ? v.makani : 'Common'), esc(v.code), esc(v.description), fmt(v.amount), fmtBlank(v.vat), fmt(v.total), esc(v.mode + (v.chequeNo ? ' #' + v.chequeNo : '')), statusPill(v.status) + (v.jvNo ? '<div class="small muted">' + esc(v.jvNo) + '</div>' : ''),
        (v.status === 'Draft' && this.canPost() ? '<button class="btn sec sm" onclick="Fac.editVoucher(\'' + v.id + '\')">Edit</button> <button class="btn sm" onclick="safe(()=>Fac.post(\'' + v.id + '\'))">Post</button>' : '') + ' <button class="btn sec sm" onclick="Fac.printVoucher(\'' + v.id + '\')">Print</button>']), { empty: 'No payment vouchers yet.' }) +
      (this.canPost() ? '<div class="btns"><button class="btn" onclick="Fac.editVoucher()">+ New payment voucher</button></div>' : '<p class="small muted">Only the Accountant can create, edit and post payment vouchers.</p>') + '</div>';
  },
  voucherForm(v) {
    const sup = col('suppliers').map(s => ({ v: s.id, l: partyName(s) + ' (' + s.category + ')' }));
    const alloc = v.allocation || 'direct';
    return '<div class="grid">' + field('PV no.', 'no', v.no || nextNo('vouchers', 'no', 'PV-', 4), { readonly: true }) + field('Date', 'date', v.date || today(), { type: 'date', req: true }) +
      field('Supplier', 'supplierId', v.supplierId, { options: sup, blank: '— none (salary / government payee) —' }) + field('Payee name (if no supplier)', 'payee', v.payee) +
      field('Allocation', 'allocation', alloc, { options: [{ v: 'direct', l: 'Direct – Makani cost centre' }, { v: 'common', l: 'Common expense' }], blank: false, onchange: 'Fac.allocChange(this)' }) +
      field('Makani (cost centre)', 'makani', v.makani, { options: col('properties').map(p => ({ v: p.makani, l: propLabel(p.makani) })) }) +
      field('Service / expense code', 'code', v.code, { options: this.codeOptions(alloc), req: true }) + field('Linked service request', 'serviceRequestId', v.serviceRequestId, { options: col('serviceRequests').filter(r => r.status !== 'Closed' || r.id === v.serviceRequestId).map(r => ({ v: r.id, l: r.no + ' · ' + r.makani + ' · ' + r.category })) }) +
      field('Description', 'description', v.description, { req: true, wide: true }) +
      field('Amount excl. VAT (AED)', 'amount', v.amount, { type: 'number', req: true }) + field('VAT ' + vatRate() + '% recoverable (supplier VAT invoice)', 'vatApplicable', v.vatApplicable, { type: 'checkbox' }) +
      field('Supplier invoice no.', 'invoiceNo', v.invoiceNo) + field('Paid from bank', 'bankId', v.bankId || (col('banks')[0] || {}).id, { options: bankOptions(), blank: false }) +
      field('Payment mode', 'mode', v.mode || 'Cheque', { options: ['Cheque', 'Bank transfer', 'Cash'], blank: false }) + field('Cheque / transfer no.', 'chequeNo', v.chequeNo) + field('Cheque date', 'chequeDate', v.chequeDate, { type: 'date' }) +
      fileField('Invoice / supporting documents', 'docs', v.docs) + '</div>';
  },
  allocChange(sel) { const c = sel.closest('.grid').querySelector('[data-f="code"]'); c.innerHTML = '<option value="">— select —</option>' + this.codeOptions(sel.value).map(o => '<option value="' + o.v + '">' + esc(o.l) + '</option>').join(''); },
  readVoucher(f, v) {
    requireFields(f, [['date', 'Date'], ['code', 'Code'], ['description', 'Description'], ['amount', 'Amount']]);
    if (f.allocation === 'direct' && !f.makani) throw new Error('Select the Makani cost centre for a direct expense.');
    if (!f.supplierId && !f.payee) throw new Error('Select a supplier or enter the payee name.');
    if (!(num(f.amount) > 0)) throw new Error('Amount must be positive');
    const vat = f.vatApplicable ? r2(num(f.amount) * vatRate() / 100) : 0;
    return Object.assign({}, v, f, { makani: f.allocation === 'direct' ? f.makani : '', amount: r2(f.amount), vat, total: r2(num(f.amount) + vat), status: v.status || 'Draft' });
  },
  editVoucher(id, preset) {
    const v = id ? byId('vouchers', id) : (preset || {});
    openModal(id ? 'Edit voucher ' + v.no : 'New payment voucher', this.voucherForm(v), [{ label: 'Cancel', cls: 'sec' },
      { label: 'Save draft', cls: 'sec', onClick: async mb => { const n = this.readVoucher(readForm(mb), v); if (!id) n.no = nextNo('vouchers', 'no', 'PV-', 4); await commit([put('vouchers', n, id ? 'Voucher edited' : 'Voucher created')]); toast('Saved ' + n.no); App.render(); } },
      { label: 'Save & post', onClick: async mb => { const n = this.readVoucher(readForm(mb), v); if (!id) n.no = nextNo('vouchers', 'no', 'PV-', 4); n.id = n.id || uid(); await this.post(null, n); } }], { width: 1000 });
  },
  async post(id, doc) {
    if (!this.canPost()) throw new Error('Only the Accountant can post payment vouchers.');
    const v = doc || byId('vouchers', id);
    const sup = v.supplierId ? byId('suppliers', v.supplierId) : null;
    if (sup) AML.requireCleared(sup, 'supplier');
    checkPaymentRule(v.total, v.mode, sup ? (sup.bankName && (sup.iban || sup.accountNo)) : !!v.chequeNo, 'Payment');
    if (Ledger.bankBalance(v.bankId) < v.total) throw new Error('Insufficient bank balance: ' + fmt(Ledger.bankBalance(v.bankId)) + ' available, ' + fmt(v.total) + ' needed.');
    const lines = [{ account: 'EXP:' + v.code, makani: v.makani || '', dr: v.amount, memo: v.description }];
    if (v.vat) lines.push({ account: 'VATIN', dr: v.vat });
    lines.push({ account: 'BANK:' + v.bankId, cr: v.total });
    const jv = Ledger.jv({ date: v.date, source: 'payment voucher', ref: v.no, narration: v.no + ' ' + (sup ? partyName(sup) : v.payee) + ' – ' + v.description, lines });
    const ops = [put('journal', jv), put('vouchers', Object.assign({}, v, { status: 'Posted', jvNo: jv.no, postedBy: S.me.name, postedAt: today() }), 'Voucher posted')];
    if (v.serviceRequestId) { const sr = byId('serviceRequests', v.serviceRequestId); if (sr) ops.push(put('serviceRequests', Object.assign({}, sr, { voucherNo: v.no, status: sr.status === 'Open' ? 'In progress' : sr.status }), 'Voucher linked to request')); }
    await commit(ops, 'Payment voucher posting'); closeModal(); toast('Posted ' + v.no + ' → ' + jv.no); App.render();
  },
  printVoucher(id) {
    const v = byId('vouchers', id); const c = company() || {}; const sup = byId('suppliers', v.supplierId);
    const w = window.open('', '_blank'); if (!w) return toast('Allow pop-ups to print', true);
    w.document.write('<html><head><title>' + esc(v.no) + '</title><style>body{font:13px Segoe UI,Arial;padding:30px}table{width:100%;border-collapse:collapse}td,th{border:1px solid #999;padding:6px;text-align:left}.sig{display:flex;gap:60px;margin-top:60px}.sig div{border-top:1px solid #333;width:180px;padding-top:4px}</style></head><body>' +
      '<h2>' + esc(c.approvedName || '') + '</h2><h3>PAYMENT VOUCHER ' + esc(v.no) + '</h3><table>' +
      [['Date', fmtDate(v.date)], ['Paid to', esc(sup ? partyName(sup) : v.payee)], ['Cost centre', esc(v.makani || 'Common')], ['Code', esc(v.code + ' – ' + Ledger.name('EXP:' + v.code))], ['Description', esc(v.description)], ['Amount', fmt(v.amount)], ['VAT', fmt(v.vat)], ['Total', '<b>' + fmt(v.total) + '</b>'], ['Mode', esc(v.mode + ' ' + (v.chequeNo || '') + ' ' + fmtDate(v.chequeDate))], ['Status', esc(v.status + ' ' + (v.jvNo || ''))]].map(r => '<tr><th>' + r[0] + '</th><td>' + r[1] + '</td></tr>').join('') +
      '</table><div class="sig"><div>Prepared by (Accountant)</div><div>Approved by</div><div>Received by</div></div><script>print()<\/script></body></html>');
    w.document.close();
  },

  /* ---------- service requests ---------- */
  renderRequests() {
    const list = col('serviceRequests').slice().sort((a, b) => (b.date || '').localeCompare(a.date || ''));
    const staff = !isRole('Tenant');
    return '<div class="card"><h2>Service requests</h2>' + table(['No.', 'Date', 'Makani', 'Tenant', 'Category', 'Description', 'Priority', 'Status', 'Voucher', ''], list.map(r => [esc(r.no), fmtDate(r.date), esc(r.makani), esc(partyName(byId('tenants', r.tenantId))), esc(r.category), esc(r.description) + (r.emailSent ? '<div class="small muted">✉ emailed ' + fmtDate(r.emailSent) + '</div>' : ''), esc(r.priority), statusPill(r.status), esc(r.voucherNo || ''),
      staff ? '<button class="btn sec sm" onclick="Fac.updateRequest(\'' + r.id + '\')">Update</button>' + (this.canPost() && !r.voucherNo ? ' <button class="btn sm" onclick="Fac.voucherFromRequest(\'' + r.id + '\')">Create voucher</button>' : '') : '']), { empty: 'No service requests.' }) + '</div>';
  },
  updateRequest(id) {
    const r = byId('serviceRequests', id);
    openModal('Service request ' + r.no, '<p>' + esc(r.description) + '</p><div class="grid">' + field('Status', 'status', r.status, { options: ['Open', 'In progress', 'Closed'], blank: false }) + field('Assigned to / supplier', 'assignedTo', r.assignedTo) + field('Facility notes', 'notes', r.notes, { type: 'textarea', wide: true }) + '</div>',
      [{ label: 'Cancel', cls: 'sec' }, { label: 'Save', onClick: async mb => { await commit([put('serviceRequests', Object.assign({}, r, readForm(mb)), 'Service request updated')]); App.render(); } }]);
  },
  voucherFromRequest(id) {
    const r = byId('serviceRequests', id); const code = col('codes').find(c => c.name === r.category || c.code === r.categoryCode);
    this.editVoucher(null, { allocation: 'direct', makani: r.makani, code: code ? code.code : '', serviceRequestId: r.id, description: r.no + ': ' + r.description });
  },

  /* ---------- cost centre summary ---------- */
  renderCC() {
    const y = Reports.year; const pl = Ledger.pnl(y + '-01-01', y + '-12-31');
    const codes = Array.from(new Set(pl.units.flatMap(u => Object.keys(u.direct)))).sort();
    return '<div class="card"><h2>Cost centre summary ' + Reports.yearPicker() + '</h2>' + table(['Makani', 'Income (excl. VAT)#'].concat(codes.map(c => c + '#')).concat(['Direct cost#', 'Contribution#']),
      pl.units.map(u => [esc(u.makani), fmt(u.income)].concat(codes.map(c => fmtBlank(u.direct[c]))).concat([fmt(u.totalDirect), fmt(u.profit)])), { empty: 'No postings for this year.' }) +
      '<h3>Common expenses</h3>' + table(['Code', 'Expense', 'Amount#'], Object.entries(pl.common).map(([k, v]) => [esc(k), esc(Ledger.name('EXP:' + k)), fmt(v)]), { empty: 'None' }) + '</div>';
  },
};

/* ---- js/tenant.js ---- */
/* Module 3: Tenant — tenants (KYC), Ejari-style tenancy contracts, CFO approval, PDC cheques, deposits, tenant portal. */
'use strict';

const Ten = {
  tab: 'contracts',
  render() {
    if (isRole('Tenant')) return Portal.render();
    const t = this.tab;
    return '<div class="tabs">' + [['contracts', 'Tenancy contracts'], ['tenants', 'Tenants (KYC)'], ['cheques', 'Post-dated cheques']].map(([k, l]) => '<a class="' + (t === k ? 'on' : '') + '" onclick="Ten.tab=\'' + k + '\';App.render()">' + l + '</a>').join('') + '</div>' +
      (t === 'contracts' ? this.renderContracts() : t === 'tenants' ? this.renderTenants() : this.renderCheques());
  },

  /* ---------- tenants ---------- */
  renderTenants() {
    const w = can('tenants');
    return '<div class="card"><h2>Tenants</h2>' + table(['Name', 'Type', 'ID / License', 'Nationality', 'Contact', 'AML risk', 'Balance#', ''], col('tenants').map(t => {
      const a = AML.latest(t.id); return [esc(partyName(t)) + (t.viaCompany ? '<div class="small muted">via ' + esc(t.viaCompanyName) + '</div>' : ''), esc(t.partyType), esc(t.partyType === 'Company' ? t.licenseNo : (t.eidNo || t.passportNo)), esc(t.nationality || ''), esc([t.mobile, t.email].filter(Boolean).join(' · ')),
        a ? statusPill(a.rating) + ' ' + statusPill(a.result) : pill('Not screened', 'bad'), fmt(Ledger.balance('TEN:' + t.id)),
        (w ? '<button class="btn sec sm" onclick="Ten.editTenant(\'' + t.id + '\')">Edit</button> ' : '') + (can('aml') ? '<button class="btn sm" onclick="AML.screen(\'tenant\',\'' + t.id + '\')">AML screen</button>' : '')];
    }), { empty: 'No tenants yet.' }) + (w ? '<div class="btns"><button class="btn" onclick="Ten.editTenant()">+ Add tenant</button></div>' : '') + '</div>';
  },
  editTenant(id) {
    const t = id ? byId('tenants', id) : { partyType: 'Individual' };
    openModal(id ? 'Edit tenant' : 'Add tenant', Party.form(t, 'tenant'), [{ label: 'Cancel', cls: 'sec' }, { label: 'Save', onClick: async mb => {
      const n = Party.read(readForm(mb), t, 'tenant'); await commit([put('tenants', n, id ? 'Tenant updated' : 'Tenant created')]); toast('Saved'); App.render(); } }], { width: 1150, onOpen: mb => Party.toggle(mb) });
  },

  /* ---------- contracts ---------- */
  renderContracts() {
    const list = col('contracts').slice().sort((a, b) => b.no.localeCompare(a.no));
    return '<div class="card"><h2>Tenancy contracts</h2><p class="muted small">Fields follow the Ejari unified tenancy contract. Default period is one year. Rent above ' + fmt(cashLimit()) + ' only by cheque. VAT ' + vatRate() + '% on rent and service charges.</p>' +
      table(['Contract', 'Makani', 'Tenant', 'Period', 'Annual rent#', 'Total incl. VAT#', 'Deposit#', 'Index check', 'Status', ''], list.map(c => {
        const p = col('properties').find(x => x.makani === c.makani); const chk = RentIdx.check(p, c.annualRent);
        return [esc(c.no), esc(c.makani), esc(partyName(byId('tenants', c.tenantId))), fmtDate(c.startDate) + ' → ' + fmtDate(c.endDate), fmt(c.annualRent), fmt(this.totals(c).total), fmt(c.securityDeposit),
          chk.found ? (chk.alert ? pill(chk.diffPct + '% vs index', 'bad') : pill((chk.diffPct >= 0 ? '+' : '') + chk.diffPct + '%', 'ok')) : pill('no index'), statusPill(c.status),
          '<button class="btn sec sm" onclick="Ten.view(\'' + c.id + '\')">Open</button>' + (['Draft', 'Rejected'].includes(c.status) && can('contracts') && !isRole('Tenant') ? ' <button class="btn sec sm" onclick="Ten.editContract(\'' + c.id + '\')">Edit</button>' : '')];
      }), { empty: 'No contracts yet.' }) + (can('contracts') ? '<div class="btns"><button class="btn" onclick="Ten.editContract()">+ New tenancy contract</button></div>' : '') + '</div>';
  },
  totals(c) {
    const rent = r2(num(c.annualRent) * monthsBetween(c.startDate, c.endDate) / 12);
    const serv = num(c.serviceCharges), ejari = num(c.ejariFee);
    const vat = r2((rent + serv) * vatRate() / 100);
    return { rent, serv, ejari, vat, total: r2(rent + serv + vat + ejari) };
  },
  contractForm(c) {
    const props = col('properties').map(p => ({ v: p.makani, l: propLabel(p.makani) + ' · ' + p.unitType + (Prop.occupancy(p.makani) && Prop.occupancy(p.makani).id !== c.id ? ' (rented)' : '') }));
    const tenants = col('tenants').map(t => ({ v: t.id, l: partyName(t) + ' · ' + t.partyType }));
    const start = c.startDate || today();
    return '<h3>Lessor (from company profile)</h3><div class="small muted">' + esc((company() || {}).approvedName || '') + ' · License ' + esc((company() || {}).licenseNo || '') + ' · ' + esc((company() || {}).authority || '') + '</div>' +
      '<h3>Property & tenant</h3><div class="grid">' + field('Contract no.', 'no', c.no || nextNo('contracts', 'no', 'TC-', 4), { readonly: true }) + field('Property (Makani)', 'makani', c.makani, { options: props, req: true, onchange: 'Ten.recalc()' }) +
      field('Tenant', 'tenantId', c.tenantId, { options: tenants, req: true, hint: 'Add tenants under the Tenants (KYC) tab first' }) +
      field('Property usage', 'usage', c.usage || 'Residential', { options: ['Residential', 'Commercial', 'Industrial'], blank: false }) + field('Ejari contract no. (after registration)', 'ejariNo', c.ejariNo) + '</div>' +
      '<h3>Contract period & value</h3><div class="grid">' + field('Start date', 'startDate', start, { type: 'date', req: true, onchange: 'Ten.recalc(true)' }) + field('End date (default 1 year)', 'endDate', c.endDate || yearEnd(start), { type: 'date', req: true, oninput: 'Ten.recalc()' }) +
      field('Annual rent excl. VAT (AED)', 'annualRent', c.annualRent, { type: 'number', req: true, oninput: 'Ten.recalc()' }) + field('Service charges excl. VAT (AED)', 'serviceCharges', c.serviceCharges, { type: 'number', oninput: 'Ten.recalc()' }) +
      field('Ejari fee (AED)', 'ejariFee', c.ejariFee, { type: 'number', oninput: 'Ten.recalc()' }) + field('Security deposit (AED)', 'securityDeposit', c.securityDeposit, { type: 'number' }) +
      field('Mode of payment', 'paymentMode', c.paymentMode || 'Cheque', { options: ['Cheque', 'Bank transfer', 'Cash'], blank: false, onchange: 'Ten.recalc()' }) + field('Number of cheques', 'chequeCount', c.chequeCount || 4, { type: 'number', min: 1 }) +
      '</div><div id="tc-calc" class="alert info"></div><div id="tc-index"></div>' +
      '<h3>Post-dated cheques <button type="button" class="btn sec sm" onclick="Ten.genCheques()">Generate schedule</button></h3><div class="tw"><table class="t" id="tc-cheques"><tr><th>Cheque no.</th><th>Cheque date</th><th>Amount (AED)</th><th>Drawn on bank</th><th></th></tr>' +
      (c.cheques || []).map(q => this.chequeRow(q)).join('') + '</table></div><button type="button" class="btn sec sm" style="margin-top:6px" onclick="Ten.addCheque()">+ Add cheque</button>' +
      '<h3>Additional terms</h3><div class="grid">' + field('Terms & conditions (one per line)', 'terms', c.terms || 'The tenant shall pay DEWA and chiller charges directly.\nNo sub-leasing without written consent of the landlord.\nRenewal subject to RERA rental increase calculator.', { type: 'textarea', wide: true }) +
      fileField('Contract attachments', 'docs', c.docs) + '</div>';
  },
  chequeRow(q) {
    q = q || {};
    return '<tr data-cheque="' + esc(q.id || uid()) + '" data-status="' + esc(q.status || 'Pending') + '" data-extra="' + esc(JSON.stringify({ depositedTo: q.depositedTo, depositDate: q.depositDate, jvNo: q.jvNo })) + '"><td><input data-q="no" value="' + esc(q.no || '') + '"></td><td><input type="date" data-q="date" value="' + esc(q.date || '') + '"></td><td><input type="number" data-q="amount" value="' + esc(q.amount || '') + '"></td><td><input data-q="bank" value="' + esc(q.bank || '') + '"></td><td>' +
      (q.status && q.status !== 'Pending' ? statusPill(q.status) : '<button type="button" class="btn sec sm" onclick="this.closest(\'tr\').remove()">✕</button>') + '</td></tr>';
  },
  addCheque() { const t = $('#tc-cheques'); const tb = document.createElement('tbody'); tb.innerHTML = this.chequeRow({}); t.appendChild(tb.firstElementChild); },
  readCheques() {
    return $$('#tc-cheques tr[data-cheque]').map(tr => {
      const o = { id: tr.dataset.cheque, status: tr.dataset.status }; Object.assign(o, JSON.parse(tr.dataset.extra || '{}'));
      $$('[data-q]', tr).forEach(el => { o[el.dataset.q] = el.dataset.q === 'amount' ? num(el.value) : el.value.trim(); }); return o;
    }).filter(q => q.no || q.amount);
  },
  genCheques() {
    const mb = $('.modal-bg:last-child .mb'); const f = readForm(mb); const n = Math.max(1, num(f.chequeCount) || 1);
    const tot = this.totals(f).total; const months = monthsBetween(f.startDate, f.endDate); const each = r2(tot / n);
    const tenant = byId('tenants', f.tenantId) || {};
    $$('#tc-cheques tr[data-cheque]').forEach(tr => { if (tr.dataset.status === 'Pending') tr.remove(); });
    for (let i = 0; i < n; i++) { const amt = i === n - 1 ? r2(tot - each * (n - 1)) : each; const tb = document.createElement('tbody'); tb.innerHTML = this.chequeRow({ date: addMonths(f.startDate, Math.floor(i * months / n)), amount: amt, bank: tenant.bankName || '' }); $('#tc-cheques').appendChild(tb.firstElementChild); }
    this.recalc();
  },
  recalc(startChanged) {
    const mb = $('.modal-bg:last-child .mb'); if (!mb || !$('#tc-calc', mb)) return;
    if (startChanged) { const s = $('[data-f="startDate"]', mb).value; $('[data-f="endDate"]', mb).value = yearEnd(s); }
    const f = readForm(mb); const t = this.totals(f); const chq = sum(this.readCheques(), q => q.amount);
    $('#tc-calc', mb).innerHTML = 'Period: <b>' + monthsBetween(f.startDate, f.endDate) + ' months</b> · Rent for period ' + fmt(t.rent) + ' · Service charges ' + fmt(t.serv) + ' · VAT ' + vatRate() + '% ' + fmt(t.vat) + ' · Ejari ' + fmt(t.ejari) + ' · <b>Total ' + fmt(t.total) + '</b> · Cheques entered ' + fmt(chq) +
      (num(f.annualRent) > cashLimit() && f.paymentMode !== 'Cheque' ? '<div class="alert red">Rent above ' + fmt(cashLimit()) + ' must be paid by cheque only.</div>' : '');
    const p = col('properties').find(x => x.makani === f.makani);
    $('#tc-index', mb).innerHTML = p && num(f.annualRent) ? RentIdx.panel(p, f.annualRent) : '';
  },
  readContract(f, c) {
    requireFields(f, [['makani', 'Property'], ['tenantId', 'Tenant'], ['startDate', 'Start date'], ['endDate', 'End date'], ['annualRent', 'Annual rent']]);
    if (f.endDate <= f.startDate) throw new Error('End date must be after the start date');
    const cheques = this.readCheques();
    const tenant = byId('tenants', f.tenantId);
    if (num(f.annualRent) > cashLimit()) {
      if (f.paymentMode !== 'Cheque') throw new Error('Rent above ' + fmt(cashLimit()) + ' must be paid by cheque only (AML rule).');
      if (!cheques.length) throw new Error('Enter the post-dated cheques (number, date, amount).');
      if (cheques.some(q => !q.no || !q.date || !q.amount)) throw new Error('Every cheque needs a number, date and amount.');
      if (!tenant.bankName || !(tenant.iban || tenant.accountNo)) throw new Error('Rent above ' + fmt(cashLimit()) + ': update the tenant\'s banking details (bank name and account/IBAN) first.');
    }
    const clash = col('contracts').find(x => x.id !== c.id && x.makani === f.makani && ['Approved', 'Pending CFO'].includes(x.status) && x.startDate <= f.endDate && x.endDate >= f.startDate);
    if (clash) throw new Error('Unit ' + f.makani + ' already has contract ' + clash.no + ' (' + clash.status + ') overlapping this period.');
    const n = Object.assign({}, c, f, { cheques, status: c.status && c.status !== 'Rejected' ? c.status : 'Draft' });
    n.contractValue = this.totals(n).rent;
    return n;
  },
  editContract(id) {
    if (!col('tenants').length || !col('properties').length) return toast('Add at least one property and one tenant first.', true);
    const c = id ? byId('contracts', id) : {};
    openModal(id ? 'Edit contract ' + c.no : 'New tenancy contract', this.contractForm(c), [{ label: 'Cancel', cls: 'sec' },
      { label: 'Save draft', cls: 'sec', onClick: async mb => { const n = this.readContract(readForm(mb), c); if (!id) n.no = nextNo('contracts', 'no', 'TC-', 4); await commit([put('contracts', n, id ? 'Contract edited' : 'Contract created')]); toast('Saved ' + n.no); App.render(); } },
      { label: 'Submit to CFO for approval', onClick: async mb => { const n = this.readContract(readForm(mb), c); if (!id) n.no = nextNo('contracts', 'no', 'TC-', 4); n.status = 'Pending CFO'; n.submittedBy = S.me.name; await commit([put('contracts', n, 'Contract submitted for CFO approval')]); toast(n.no + ' sent to CFO'); App.render(); } }],
    { width: 1100, onOpen: () => this.recalc() });
  },
  view(id) {
    const c = byId('contracts', id); const p = col('properties').find(x => x.makani === c.makani); const t = byId('tenants', c.tenantId); const tt = this.totals(c);
    const isCFO = isRole('CFO'); const a = AML.latest(c.tenantId);
    const btns = [{ label: 'Close', cls: 'sec' }, { label: 'Print contract', cls: 'sec', onClick: () => { this.print(id); return false; } }];
    if (c.status === 'Pending CFO' && isCFO) {
      btns.push({ label: 'Reject', cls: 'danger', onClick: async () => { const why = prompt('Reason for rejection?') || ''; await commit([put('contracts', Object.assign({}, c, { status: 'Rejected', rejectReason: why, approvedBy: S.me.name }), 'Contract rejected by CFO')]); App.render(); } });
      btns.push({ label: 'Approve & issue contract', onClick: () => this.approve(id) });
    }
    if (c.status === 'Draft' && can('contracts')) btns.push({ label: 'Submit to CFO', onClick: async () => { await commit([put('contracts', Object.assign({}, c, { status: 'Pending CFO', submittedBy: S.me.name }), 'Contract submitted for CFO approval')]); App.render(); } });
    if (c.status === 'Approved' && can('journal') && !c.depositRefunded && num(c.securityDeposit)) btns.push({ label: 'Refund security deposit', cls: 'warn', onClick: () => this.refund(id) });
    if (c.status === 'Approved' && isRole('CEO', 'CFO')) btns.push({ label: 'Terminate', cls: 'danger', onClick: () => this.terminate(id) });
    openModal('Contract ' + c.no + ' · ' + c.status, (c.status === 'Pending CFO' ? '<div class="card" style="background:#fbfcfd"><h2>CFO reference window: market rental index</h2>' + RentIdx.panel(p, c.annualRent) +
      (a ? '<div class="small">Tenant AML: ' + statusPill(a.result) + ' risk ' + statusPill(a.rating) + ' (' + esc(a.no) + ', ' + fmtDate(a.date) + ')</div>' : '<div class="alert red">Tenant has no AML screening — approval is blocked until screened.</div>') + '</div>' : '') +
      table(['Field', 'Value'], [['Property', esc(propLabel(c.makani)) + ' · ' + esc(p ? p.unitType + ' · ' + p.sqft + ' sq ft · ' + p.area : '') + ' · DEWA ' + esc(p ? p.dewa || '-' : '')], ['Tenant', esc(partyName(t)) + (t && t.viaCompany ? ' (via ' + esc(t.viaCompanyName) + ')' : '')],
        ['Period', fmtDate(c.startDate) + ' → ' + fmtDate(c.endDate) + ' (' + monthsBetween(c.startDate, c.endDate) + ' months)'], ['Annual rent (excl. VAT)', fmt(c.annualRent)], ['Rent for period', fmt(tt.rent)], ['Service charges', fmt(tt.serv)], ['VAT ' + vatRate() + '%', fmt(tt.vat)], ['Ejari fee', fmt(tt.ejari)], ['Total receivable', '<b>' + fmt(tt.total) + '</b>'],
        ['Security deposit', fmt(c.securityDeposit) + (c.depositRefunded ? ' · refunded ' + fmtDate(c.depositRefunded) : '')], ['Payment', esc(c.paymentMode) + ' · ' + (c.cheques || []).length + ' cheque(s)'], ['Ejari no.', esc(c.ejariNo || '-')], ['Approved', esc(c.approvedBy || '-') + ' ' + fmtDate(c.approvedAt) + (c.jvNos ? ' · ' + esc(c.jvNos.join(', ')) : '')],
        ['Terms', esc(c.terms || '').replace(/\n/g, '<br>')], ['Attachments', filesView(c.docs)]]) +
      '<h3>Cheques</h3>' + table(['No.', 'Date', 'Amount#', 'Bank', 'Status', ''], (c.cheques || []).map(q => [esc(q.no), fmtDate(q.date), fmt(q.amount), esc(q.bank), statusPill(q.status || 'Pending') + (q.jvNo ? ' <span class="small muted">' + esc(q.jvNo) + '</span>' : ''),
        c.status === 'Approved' && (q.status || 'Pending') === 'Pending' && can('journal') ? '<button class="btn sm" onclick="safe(()=>Ten.depositCheque(\'' + c.id + '\',\'' + q.id + '\'))">Deposit in bank</button> <button class="btn sm danger" onclick="safe(()=>Ten.bounce(\'' + c.id + '\',\'' + q.id + '\'))">Bounced</button>' : '']), { empty: 'No cheques' }), btns, { width: 1000 });
  },
  async approve(id) {
    if (!isRole('CFO')) throw new Error('Only the CFO can approve the agreed rent.');
    const c = byId('contracts', id); const t = byId('tenants', c.tenantId); const p = col('properties').find(x => x.makani === c.makani);
    AML.requireCleared(t, 'tenant');
    const chk = RentIdx.check(p, c.annualRent);
    if (chk.alert && !(await confirmBox('Red alert: rent below index', '<div class="alert red">Agreed rent is ' + Math.abs(chk.diffPct) + '% below the rental index (' + fmt(chk.expected) + ').</div>Approve anyway? This is recorded in the audit trail.'))) return false;
    const tt = this.totals(c); const vatOut = tt.vat; const date = c.startDate <= today() ? c.startDate : today();
    const j1 = Ledger.jv({ date, source: 'rental contract', ref: c.no, narration: 'Rental income ' + c.no + ' ' + c.makani + ' – ' + partyName(t), lines: [
      { account: 'TEN:' + t.id, makani: c.makani, dr: tt.total }, { account: 'INC:RENT', makani: c.makani, cr: tt.rent }, { account: 'INC:SERV', makani: c.makani, cr: tt.serv },
      { account: 'INC:EJARI', makani: c.makani, cr: tt.ejari }, { account: 'VATOUT', makani: c.makani, cr: vatOut }] });
    const ops = [put('journal', j1)]; const jvNos = [j1.no];
    if (num(c.securityDeposit)) {
      const j2 = Ledger.jv({ date, source: 'security deposit', ref: c.no, narration: 'Security deposit ' + c.no + ' – ' + partyName(t), lines: [{ account: 'SECDEP', makani: c.makani, dr: c.securityDeposit }, { account: 'TEN:' + t.id, makani: c.makani, cr: c.securityDeposit }] }, [j1]);
      ops.push(put('journal', j2)); jvNos.push(j2.no);
    }
    ops.push(put('contracts', Object.assign({}, c, { status: 'Approved', approvedBy: S.me.name, approvedAt: today(), indexCheck: chk.found ? { expected: chk.expected, diffPct: chk.diffPct, alert: chk.alert } : null, jvNos }), 'Contract approved by CFO & rental income posted'));
    await commit(ops, 'Contract approval'); closeModal(); toast(c.no + ' approved · ' + jvNos.join(', ')); App.render(); this.print(id);
    return false;
  },
  depositCheque(cid, qid) {
    const c = byId('contracts', cid); const q = c.cheques.find(x => x.id === qid);
    openModal('Deposit cheque ' + q.no, '<p>Cheque ' + esc(q.no) + ' dated ' + fmtDate(q.date) + ' for <b>' + fmt(q.amount) + '</b>.</p><div class="grid">' + field('Deposited into', 'bankId', (col('banks')[0] || {}).id, { options: bankOptions(), blank: false }) + field('Deposit date', 'date', q.date > today() ? today() : q.date, { type: 'date' }) + '</div><div class="alert info">Entry: Dr Bank / Cr Tenant ' + fmt(q.amount) + '</div>',
      [{ label: 'Cancel', cls: 'sec' }, { label: 'Post deposit', onClick: async mb => {
        const f = readForm(mb); const t = byId('tenants', c.tenantId);
        const jv = Ledger.jv({ date: f.date, source: 'cheque deposit', ref: c.no + ' / ' + q.no, narration: 'Cheque ' + q.no + ' deposited – ' + partyName(t), lines: [{ account: 'BANK:' + f.bankId, dr: q.amount }, { account: 'TEN:' + t.id, makani: c.makani, cr: q.amount }] });
        const cheques = c.cheques.map(x => x.id === qid ? Object.assign({}, x, { status: 'Deposited', depositedTo: f.bankId, depositDate: f.date, jvNo: jv.no }) : x);
        await commit([put('journal', jv), put('contracts', Object.assign({}, c, { cheques }), 'Cheque ' + q.no + ' deposited')]); closeModal(); toast('Posted ' + jv.no); App.render(); this.view(cid);
      } }]);
  },
  async bounce(cid, qid) {
    const c = byId('contracts', cid); if (!(await confirmBox('Mark cheque bounced', 'Mark this cheque as bounced? No entry is posted; the tenant balance stays outstanding.'))) return;
    await commit([put('contracts', Object.assign({}, c, { cheques: c.cheques.map(x => x.id === qid ? Object.assign({}, x, { status: 'Bounced' }) : x) }), 'Cheque bounced')]); closeModal(); App.render(); this.view(cid);
  },
  async refund(id) {
    const c = byId('contracts', id); const t = byId('tenants', c.tenantId);
    if (!(await confirmBox('Refund security deposit', 'Entry: Dr Tenant / Cr Security deposit ' + fmt(c.securityDeposit)))) return false;
    const jv = Ledger.jv({ date: today(), source: 'deposit refund', ref: c.no, narration: 'Security deposit refund ' + c.no + ' – ' + partyName(t), lines: [{ account: 'TEN:' + t.id, makani: c.makani, dr: c.securityDeposit }, { account: 'SECDEP', makani: c.makani, cr: c.securityDeposit }] });
    await commit([put('journal', jv), put('contracts', Object.assign({}, c, { depositRefunded: today(), refundJv: jv.no }), 'Security deposit refunded')]); toast('Posted ' + jv.no); App.render();
  },
  async terminate(id) {
    const c = byId('contracts', id); const d = prompt('Termination date (YYYY-MM-DD)?', today()); if (!d) return false;
    await commit([put('contracts', Object.assign({}, c, { status: 'Terminated', terminatedOn: d, endDate: d < c.endDate ? d : c.endDate }), 'Contract terminated')]); App.render();
  },
  print(id) {
    const c = byId('contracts', id); const p = col('properties').find(x => x.makani === c.makani) || {}; const t = byId('tenants', c.tenantId) || {}; const co = company() || {}; const tt = this.totals(c);
    const w = window.open('', '_blank'); if (!w) return toast('Allow pop-ups to print the contract', true);
    const row = (a, b) => '<tr><th>' + a + '</th><td>' + b + '</td></tr>';
    w.document.write('<html><head><title>' + esc(c.no) + '</title><style>body{font:12.5px Segoe UI,Arial;padding:28px;max-width:900px;margin:auto}h1{font-size:18px;text-align:center}h2{font-size:14px;background:#0f5c4d;color:#fff;padding:5px 8px}table{width:100%;border-collapse:collapse;margin-bottom:8px}td,th{border:1px solid #aaa;padding:5px;text-align:left;vertical-align:top}th{width:32%;background:#f3f5f7}.sig{display:flex;justify-content:space-between;margin-top:60px}.sig div{border-top:1px solid #333;width:40%;padding-top:4px}.draft{color:#c0362c;font-weight:bold;text-align:center}</style></head><body>' +
      '<h1>TENANCY CONTRACT ' + esc(c.no) + '</h1>' + (c.status !== 'Approved' ? '<p class="draft">DRAFT – NOT APPROVED</p>' : '') +

/* ---------------------------------------------------------------- AML */
const AML = {
  tab: 'suppliers',
  render() {
    const t = this.tab;
    return '<div class="tabs">' + [['suppliers', 'Suppliers'], ['register', 'Screening register'], ['matrix', 'Risk matrix'], ['lists', 'Sanction lists']].map(([k, l]) => '<a class="' + (t === k ? 'on' : '') + '" onclick="AML.tab=\'' + k + '\';App.render()">' + l + '</a>').join('') + '</div>' +
      (t === 'suppliers' ? this.renderSuppliers() : t === 'register' ? this.renderRegister() : t === 'matrix' ? this.renderMatrix() : this.renderLists());
  },
  party(kind, id) { return byId(kind === 'tenant' ? 'tenants' : 'suppliers', id); },
  latest(partyId) { return col('aml').filter(a => a.partyId === partyId).sort((a, b) => (b.date + b.no).localeCompare(a.date + a.no))[0]; },
  requireCleared(p, kind) {
    if (!p) throw new Error('Party not found');
    const a = this.latest(p.id); const nm = partyName(p);
    if (!a) throw new Error('AML screening is required for ' + kind + ' "' + nm + '" before any transaction (AML → Screening).');
    if (a.result === 'Confirmed match' || a.rating === 'Prohibited') throw new Error('BLOCKED: "' + nm + '" has a confirmed sanctions match. Do not transact; report to the FIU via goAML.');
    if (a.result === 'Potential match') throw new Error('"' + nm + '" has an unresolved potential sanctions match. Resolve the screening first.');
    if (a.rating === 'High' && a.status !== 'Approved') throw new Error('"' + nm + '" is HIGH risk: enhanced due diligence must be approved by the CFO/CEO first.');
    if (a.nextReview && a.nextReview < today()) throw new Error('AML review for "' + nm + '" was due on ' + fmtDate(a.nextReview) + '. Re-screen first.');
  },
  renderSuppliers() {
    const w = can('suppliers');
    return '<div class="card"><h2>Suppliers</h2><p class="muted small">Property sellers / developers (Property module), service providers (Facility module) and property owners for managed units.</p>' +
      table(['Name', 'Category', 'Type', 'License / ID', 'Expiry', 'Bank', 'AML risk', 'Next review', ''], col('suppliers').map(s => { const a = this.latest(s.id); const exp = s.partyType === 'Company' ? s.licenseExpiry : (s.eidExpiry || s.passportExpiry);
        return [esc(partyName(s)), esc(s.category), esc(s.partyType), esc(s.partyType === 'Company' ? s.licenseNo : (s.eidNo || s.passportNo)), fmtDate(exp) + (exp && exp < today() ? ' ' + pill('expired', 'bad') : ''), s.bankName ? esc(s.bankName) : pill('missing', 'warn'),
          a ? statusPill(a.rating) + ' ' + statusPill(a.result) + (a.rating === 'High' ? ' ' + statusPill(a.status === 'Approved' ? 'Approved' : 'Pending') : '') : pill('Not screened', 'bad'), a ? fmtDate(a.nextReview) : '',
          (w ? '<button class="btn sec sm" onclick="AML.editSupplier(\'' + s.id + '\')">Edit</button> ' : '') + (can('aml') ? '<button class="btn sm" onclick="AML.screen(\'supplier\',\'' + s.id + '\')">Screen</button>' : '')]; }), { empty: 'No suppliers yet.' }) +
      (w ? '<div class="btns"><button class="btn" onclick="AML.editSupplier()">+ Add supplier</button></div>' : '') + '</div>';
  },
  editSupplier(id) {
    const s = id ? byId('suppliers', id) : { partyType: 'Company' };
    openModal(id ? 'Edit supplier' : 'Add supplier', Party.form(s, 'supplier'), [{ label: 'Cancel', cls: 'sec' }, { label: 'Save', onClick: async mb => {
      const n = Party.read(readForm(mb), s, 'supplier'); await commit([put('suppliers', n, id ? 'Supplier updated' : 'Supplier created')]); toast('Saved'); App.render(); } }], { width: 1150, onOpen: mb => Party.toggle(mb) });
  },

  /* ---------- name matching ---------- */
  norm(s) { return String(s || '').normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase().replace(/[^a-z0-9؀-ۿ ]+/g, ' ').replace(/\s+/g, ' ').trim(); },
  match(name) {
    const a = this.norm(name); const at = a.split(' ').filter(x => x.length > 1); const hits = [];
    if (!at.length) return hits;
    col('sanctions').forEach(list => (list.names || []).forEach(n => {
      const b = this.norm(n); if (!b) return;
      let score = 0;
      if (a === b) score = 1;
      else { const bt = b.split(' ').filter(x => x.length > 1); const common = at.filter(x => bt.includes(x)).length; score = common >= Math.min(2, at.length, bt.length) ? common / Math.max(at.length, bt.length) : 0; }
      if (score >= 0.66) hits.push({ list: list.id, matched: n, score: Math.round(score * 100) });
    }));
    return hits.sort((x, y) => y.score - x.score).slice(0, 25);
  },
  txValue(kind, id) {
    if (kind === 'tenant') return sum(col('contracts').filter(c => c.tenantId === id && c.status !== 'Rejected'), c => c.annualRent);
    return r2(sum(col('vouchers').filter(v => v.supplierId === id), v => v.total) + sum(col('propPayments').filter(x => x.supplierId === id), x => x.amount));
  },
  suggest(kind, p, result) {
    const people = Party.people(p); const hr = (settings().highRiskCountries || []).map(x => x.toLowerCase());
    const val = this.txValue(kind, p.id);
    const exp = Party.expiries(p).filter(Boolean); const soon = addDays(today(), 30);
    const missingDocs = p.partyType === 'Company' ? !(p.licenseDocs || []).length : !((p.eidDocs || []).length || (p.passportDocs || []).length);
    const cash = kind === 'tenant' ? col('contracts').some(c => c.tenantId === p.id && c.paymentMode === 'Cash') : col('vouchers').some(v => v.supplierId === p.id && v.mode === 'Cash');
    return {
      sanctions: result === 'Clear' ? 1 : 3,
      pep: people.some(x => x.pep === 'Yes') ? 3 : 1,
      country: people.some(x => x.nationality && hr.includes(String(x.nationality).toLowerCase())) ? 3 : 1,

      '<h3>3. Risk matrix</h3><div class="tw"><table class="t" id="rm">' + '<tr><th>Risk factor</th><th>1 – Low</th><th>2 – Medium</th><th>3 – High</th></tr>' +
      RISK_FACTORS.map(([k, label, opts]) => '<tr><td>' + esc(label) + '</td>' + [1, 2, 3].map(v => '<td><label class="switch"><input type="radio" name="rf_' + k + '" value="' + v + '"' + (sg[k] === v ? ' checked' : '') + ' onchange="AML.recalc()"' + (k === 'sanctions' ? ' disabled' : '') + '> ' + esc(opts[v - 1]) + '</label></td>').join('') + '</tr>').join('') +
      '</table></div><div id="rm-out" style="margin-top:8px"></div><div class="grid">' + field('Notes / EDD performed', 'notes', '', { type: 'textarea', wide: true }) + fileField('Evidence (screenshots of list searches, EDD documents)', 'evidence', []) + '</div>';
    openModal('AML screening & risk assessment', html, [{ label: 'Cancel', cls: 'sec' }, { label: 'Save screening', onClick: mb => this.saveScreening(mb, kind, p, people, lists) }], { width: 1150, onOpen: () => this.recalc() });
  },
  readMatrix(mb) {
    const f = readForm(mb); const sc = {};
    RISK_FACTORS.forEach(([k]) => { const r = $('input[name="rf_' + k + '"]:checked', mb); sc[k] = r ? num(r.value) : 1; });
    sc.sanctions = f.result === 'Clear' ? 1 : 3;
    $$('input[name="rf_sanctions"]', mb).forEach(r => { r.checked = num(r.value) === sc.sanctions; });
    const total = Object.values(sc).reduce((s, v) => s + v, 0);
    return { f, sc, total, rr: this.rate(total, f.result) };
  },
  recalc() {
    const mb = $('.modal-bg:last-child .mb'); if (!mb || !$('#rm-out', mb)) return;
    const { total, rr } = this.readMatrix(mb);
    $('#rm-out', mb).innerHTML = '<div class="alert ' + (rr.rating === 'Low' ? 'ok' : rr.rating === 'Medium' ? 'warn' : 'red') + '">Total score <b>' + total + '</b> / 24 → Risk rating <b>' + rr.rating + '</b>' +
      (rr.rating === 'Prohibited' ? ' – do not transact; freeze and report via goAML to the UAE FIU.' : ' · Review every ' + rr.months + ' months' + (rr.rating === 'High' ? ' · Enhanced due diligence and CFO/CEO approval required.' : '')) + '</div>';
  },
  async saveScreening(mb, kind, p, people, lists) {
    const { f, sc, total, rr } = this.readMatrix(mb);
    const unchecked = lists.filter(({ l, doc }) => !doc && !f['manual_' + l.id]).map(({ l }) => l.id);
    if (unchecked.length) throw new Error('Lists not loaded and not checked manually: ' + unchecked.join(', ') + '. Load them (Sanction lists tab) or tick "checked manually".');
    const hadHits = people.some(x => this.match(x.name).length);
    if (hadHits && f.result === 'Clear' && !f.justification) throw new Error('Enter the justification for clearing the potential match(es).');
    const doc = { no: nextNo('aml', 'no', 'AML-', 4), date: today(), partyKind: kind, partyId: p.id, partyName: partyName(p), names: people.map(x => ({ name: x.name, role: x.role, hits: this.match(x.name) })),
      lists: lists.map(({ l, doc: d }) => ({ id: l.id, loaded: !!d, count: d ? (d.names || []).length : 0, listDate: d ? d.loadedAt : '', manual: !!f['manual_' + l.id] })),
      result: f.result, justification: f.justification, factors: sc, totalScore: total, rating: rr.rating, nextReview: rr.months ? addMonths(today(), rr.months) : '',
      status: rr.rating === 'High' ? 'Pending approval' : 'Completed', notes: f.notes, evidence: f.evidence, screenedBy: S.me.name };
    await commit([put('aml', doc, 'AML screening ' + doc.result + ' / ' + doc.rating)]); toast('Screening saved: ' + rr.rating + ' risk'); App.render();

  renderRegister() {

      table(['List', 'Loaded', 'Names', 'List date', 'Manual check'], a.lists.map(l => [l.id, l.loaded ? 'yes' : 'no', l.count, fmtTs(l.listDate), l.manual ? 'yes' : ''])) +
      table(['Factor', 'Score'], RISK_FACTORS.map(([k, label, opts]) => [esc(label), a.factors[k] + ' – ' + esc(opts[a.factors[k] - 1])]).concat([['<b>Total</b>', '<b>' + a.totalScore + ' → ' + a.rating + '</b>']])) +
      '<p>Result: ' + statusPill(a.result) + ' ' + esc(a.justification || '') + '</p><p>' + esc(a.notes || '') + '</p>' + filesView(a.evidence), null, { width: 900 });

  async approve(id) { const a = byId('aml', id); if (!(await confirmBox('Approve enhanced due diligence', 'Approve the business relationship with HIGH risk party ' + esc(a.partyName) + '?'))) return; await commit([put('aml', Object.assign({}, a, { status: 'Approved', approvedBy: S.me.name, approvedAt: today() }), 'High-risk EDD approved')]); App.render(); },
  renderMatrix() {

    return '<div class="card"><h2>Risk matrix</h2><p class="muted small">Eight factors scored 1 (low) to 3 (high). Total 8–11 Low (review 24 months), 12–16 Medium (12 months), 17–24 High (6 months, EDD + senior approval). A confirmed sanctions match is Prohibited.</p>' +
      table(['Factor', '1 – Low', '2 – Medium', '3 – High'], RISK_FACTORS.map(([, l, o]) => [esc(l)].concat(o.map(esc)))) + '</div>' +
      '<div class="card"><h2>Assigned risk per supplier and tenant</h2>' + table(['Party', 'Kind'].concat(RISK_FACTORS.map(f => f[1].split(' ')[0] + '#')).concat(['Total#', 'Rating', 'Next review']), parties.map(([k, p]) => { const a = this.latest(p.id);
        return [esc(partyName(p)), k].concat(RISK_FACTORS.map(([f]) => a ? a.factors[f] : '')).concat([a ? a.totalScore : '', a ? statusPill(a.rating) : pill('Not screened', 'bad'), a ? fmtDate(a.nextReview) : '']); }), { empty: 'No parties.' }) + '</div>';

  /* ---------- sanction lists ---------- */
  listUrl(l) { return (settings().sanctionUrls || {})[l.id] || l.url; },
  renderLists() {
    const w = can('sanctions');
    return '<div class="card"><h2>Sanction lists</h2><p class="muted small">Load each list from its official source before screening. Server version can download directly; otherwise import the downloaded file (UN XML, OFAC sdn.csv, UK ConList.csv, EU XML, or a CSV/TXT with one name per line).</p>' +
      table(['List', 'Official source', 'Names', 'Loaded', ''], SANCTION_LISTS.map(l => { const d = byId('sanctions', l.id); return [esc(l.name), '<a href="' + esc(this.listUrl(l)) + '" target="_blank" rel="noopener" class="small">' + esc(this.listUrl(l)) + '</a>', d ? (d.names || []).length.toLocaleString('en-US') : pill('not loaded', 'warn'), d ? fmtTs(d.loadedAt) + '<div class="small muted">' + esc(d.source || '') + '</div>' : '',
        w ? '<button class="btn sm" onclick="safe(()=>AML.importList(\'' + l.id + '\'))">Import file</button>' + (S.mode === 'server' ? ' <button class="btn sec sm" onclick="safe(()=>AML.downloadList(\'' + l.id + '\'))">Download now</button>' : '') + (d ? ' <button class="btn sec sm" onclick="safe(()=>AML.clearList(\'' + l.id + '\'))">Clear</button>' : '') : '']; })) + '</div>';
  },
  parseNames(text, kind) {
    const names = [];
    if (text.trim().startsWith('<')) {
      const x = new DOMParser().parseFromString(text, 'application/xml');
      $$('INDIVIDUAL, ENTITY', x).forEach(el => { const parts = ['FIRST_NAME', 'SECOND_NAME', 'THIRD_NAME', 'FOURTH_NAME'].map(t => { const c = el.getElementsByTagName(t)[0]; return c ? c.textContent.trim() : ''; }).filter(Boolean); if (parts.length) names.push(parts.join(' ')); $$('ALIAS_NAME', el).forEach(a => a.textContent.trim() && names.push(a.textContent.trim())); });
      Array.from(x.getElementsByTagName('*')).forEach(el => { const wn = el.getAttribute && el.getAttribute('wholeName'); if (wn) names.push(wn); if (/^(wholeName|fullName|Name6)$/.test(el.localName) && el.textContent.trim()) names.push(el.textContent.trim()); });
    } else {
      const rows = text.split(/\r?\n/).map(r => this.csvRow(r));
      if (kind === 'ofac') rows.forEach(r => { if (r[1] && r[1] !== '-0-') names.push(r[1]); });
      else if (kind === 'uk') { const hi = rows.findIndex(r => r.includes('Name 6')); const h = rows[hi] || []; rows.slice(hi + 1).forEach(r => { const n = ['Name 1', 'Name 2', 'Name 3', 'Name 4', 'Name 5', 'Name 6'].map(k => r[h.indexOf(k)] || '').filter(Boolean).join(' '); if (n) names.push(n); }); }
      else rows.forEach(r => { if (r[0] && r[0].trim()) names.push(r[0].trim()); });
    }
    const seen = new Set(); return names.filter(n => { const k = n.toLowerCase(); if (seen.has(k)) return false; seen.add(k); return true; });
  },
  csvRow(line) { const out = []; let cur = '', q = false; for (let i = 0; i < line.length; i++) { const ch = line[i]; if (q) { if (ch === '"' && line[i + 1] === '"') { cur += '"'; i++; } else if (ch === '"') q = false; else cur += ch; } else if (ch === '"') q = true; else if (ch === ',') { out.push(cur.trim()); cur = ''; } else cur += ch; } out.push(cur.trim()); return out; },
  async storeList(id, names, source) {
    if (!names.length) throw new Error('No names found in that file.');
    await commit([put('sanctions', { id, list: id, names, count: names.length, source, loadedAt: new Date().toISOString().slice(0, 19) }, 'Sanction list ' + id + ' loaded (' + names.length + ' names)')]); toast(id + ': ' + names.length + ' names loaded'); App.render();
  },
  async importList(id) {
    const l = SANCTION_LISTS.find(x => x.id === id); const file = await pickFile('.xml,.csv,.txt'); if (!file) return;
    const names = this.parseNames(await readFileText(file), l.kind); await this.storeList(id, names, 'file: ' + file.name);
  },
  async downloadList(id) {
    const l = SANCTION_LISTS.find(x => x.id === id); toast('Downloading ' + id + '…');
    const r = await API.fetchList(this.listUrl(l), l.kind); await this.storeList(id, r.names, this.listUrl(l));
  },
  async clearList(id) { if (await confirmBox('Clear list', 'Remove the loaded ' + id + ' list?')) { await commit([del('sanctions', id, 'Sanction list cleared')]); App.render(); } },
};

const Wizard = {

      case 2: body = table(['Makani', 'Ejari fee#', 'Service charges#'], pl.units.filter(u => u.ejari || u.serv).map(u => [esc(propLabel(u.makani)), fmt(u.ejari), fmt(u.serv)]).concat([{ cls: 'tot', cells: ['Total', fmt(sum(pl.units, u => u.ejari)), fmt(sum(pl.units, u => u.serv))] }])); break;
      case 3: body = '<p class="muted">Costs posted through payment vouchers and management fees to each Makani cost centre.</p>' + table(['Makani', 'Code', 'Service', 'Amount#'], pl.units.flatMap(u => Object.entries(u.direct).map(([k, v]) => [esc(u.makani), esc(k), esc(Ledger.name('EXP:' + k)), fmt(v)]))
        .concat([{ cls: 'tot', cells: ['Total', '', '', fmt(pl.direct)] }])); break;
      case 4: body = '<p class="muted">Common expenses (fixed costs): admin staff cost, electricity, office expenses, travel and other general expenses — posted amounts below. Add further expenses for this P&L if needed.</p>' +
        table(['Code', 'Expense', 'Posted#'], ['SAL', 'ELC', 'OFF', 'TRV', 'GEN'].concat(Object.keys(pl.common).filter(k => !['SAL', 'ELC', 'OFF', 'TRV', 'GEN'].includes(k))).map(k => [esc(k), esc(Ledger.name('EXP:' + k)), fmt(pl.common[k] || 0)])) +
        '<h3>Additional expenses for this P&L (not posted to the ledger)</h3><div class="tw"><table class="t" id="wx"><tr><th>Expense</th><th>Amount (AED)</th><th></th></tr>' + W.extra.map(e => this.extraRow(e)).join('') + '</table></div>' +
        '<div class="btns"><button class="btn sec sm" type="button" onclick="document.getElementById(\'wx\').insertAdjacentHTML(\'beforeend\', Wizard.extraRow({}))">+ Add expense line</button>' + (can('codes') ? '<button class="btn sec sm" type="button" onclick="Fac.editCode()">+ Create new expense code</button>' : '') + '</div>'; break;
      case 5: body = Reports.plTable(pl, W.extra) + '<h3>Unit-wise</h3>' + Reports.unitTable(pl); break;
    }
    return '<div class="card"><h2>P&L wizard · ' + esc(W.title) + '</h2><div class="steps">' + this.steps.map((s, i) => '<span class="' + (i === W.step ? 'on' : i < W.step ? 'done' : '') + '">' + (i + 1) + '. ' + esc(s) + '</span>').join('') + '</div><div id="wz">' + body + '</div>' +

  },
  extraRow(e) { return '<tr><td><input data-x="name" value="' + esc(e.name || '') + '"></td><td><input type="number" data-x="amount" value="' + esc(e.amount || '') + '"></td><td><button class="btn sec sm" type="button" onclick="this.closest(\'tr\').remove()">✕</button></td></tr>'; },
  move(d) {

  async save() {

  view(id) {
    const r = byId('pnlReports', id);

  },
  async finalise(id) { const r = byId('pnlReports', id); await commit([put('pnlReports', Object.assign({}, r, { status: 'Final', finalisedBy: S.me.name }), 'P&L report status changed to Final')]); App.render(); },
};

      '<button class="btn sec" onclick="Audit.export()">Export CSV</button></div>' +
      table(['When', 'User', 'Role', 'Action', 'Module', 'Record', 'Changes (field: from → to)'], list.map(r => [fmtTs(r.ts), esc(r.user), esc(r.role), esc(r.action), esc(r.col), '<span class="small">' + esc(r.docId) + '</span>',
        (r.changes || []).slice(0, 12).map(c => '<div class="small"><b>' + esc(c.field) + '</b>: <span class="muted">' + esc(String(c.from).slice(0, 120)) + '</span> → ' + esc(String(c.to).slice(0, 120)) + '</div>').join('') + ((r.changes || []).length > 12 ? '<div class="small muted">+' + (r.changes.length - 12) + ' more</div>' : '')]), { empty: 'No audit entries.' });
  },
  export() {
    const rows = [['Timestamp', 'User', 'Role', 'Action', 'Module', 'Record', 'Field', 'From', 'To']];
    this.rows.forEach(r => { if (!(r.changes || []).length) rows.push([r.ts, r.user, r.role, r.action, r.col, r.docId, '', '', '']); (r.changes || []).forEach(c => rows.push([r.ts, r.user, r.role, r.action, r.col, r.docId, c.field, c.from, c.to])); });
    downloadText('audit_trail_' + today() + '.csv', '﻿' + toCSV(rows), 'text/csv');
  },
};

const Settings = {
  defaults() { return { id: 'main', vatRate: VAT_DEFAULT, cashLimit: CASH_LIMIT_DEFAULT, rentIndexUrls: { Dubai: 'https://dubailand.gov.ae/en/eservices/rental-index/' }, sanctionUrls: {}, highRiskCountries: FATF_DEFAULT.slice() }; },
  render() {
    const s = Object.assign(this.defaults(), settings()); const w = can('settings');
    return '<div class="card"><h2>Rules & reference sources</h2><div class="grid">' + field('VAT rate on rent & service charges (%)', 'vatRate', s.vatRate, { type: 'number', readonly: !w }) + field('Cash / cheque threshold (AED)', 'cashLimit', s.cashLimit, { type: 'number', readonly: !w, hint: 'Above this only cheque / bank transfer with banking details' }) + '</div>' +
      '<h3>Rental index reference site per emirate</h3><div class="grid">' + EMIRATES.map(e => field(e, 'ri_' + e, (s.rentIndexUrls || {})[e] || '', { readonly: !w, ph: e === 'Dubai' ? 'https://dubailand.gov.ae/…' : 'URL of the index for ' + e })).join('') + '</div>' +
      '<h3>Sanction list sources</h3><div class="grid">' + SANCTION_LISTS.map(l => field(l.name, 'sl_' + l.id, (s.sanctionUrls || {})[l.id] || l.url, { readonly: !w })).join('') + '</div>' +
      '<h3>High-risk jurisdictions (FATF lists – update when FATF publishes changes)</h3>' + field('One country per line', 'hr', (s.highRiskCountries || []).join('\n'), { type: 'textarea', readonly: !w }) +
      (w ? '<div class="btns"><button class="btn" onclick="safe(()=>Settings.save())">Save settings</button></div>' : '') + '</div>' +
      '<div class="card"><h2>Sample data (testing & demo)</h2><p class="muted small">The app ships empty. Load the separate <code>sample_data.json</code> file for a demo; every sample record is tagged and can be deleted in one click. Sample users: Fatima Al Zarooni (CFO), Rahul Menon (Accountant), Omar Haddad (Agent), John Smith (Tenant) – passwords follow the default rule.</p>' +
      '<div class="btns">' + (isRole('CEO', 'CFO') ? (S.mode === 'server' ? '<button class="btn" onclick="safe(()=>Settings.loadSample(false))">Load bundled sample data</button>' : '') + '<button class="btn sec" onclick="safe(()=>Settings.loadSample(true))">Load sample data from file…</button><button class="btn danger" onclick="safe(()=>Settings.deleteSample())">Delete all sample data</button>' : '<span class="muted">Only CEO / CFO can load or delete sample data.</span>') +
      (S.mode === 'server' ? '<a class="btn sec" href="sample_data.json" download>Download sample_data.json</a>' : '') + '</div></div>' +
      '<div class="card"><h2>Backup</h2><div class="btns"><button class="btn sec" onclick="Settings.backup()">Export all data (JSON)</button>' + (S.mode === 'offline' && isRole('CEO') ? '<button class="btn sec" onclick="safe(()=>Settings.restore())">Restore offline backup…</button>' : '') + '</div>' +
      '<p class="small muted">Mode: <b>' + (S.mode === 'server' ? 'Server (SQLite database)' : 'Offline standalone (browser storage on this computer)') + '</b></p></div>';
  },
  async save() {
    const root = $('.content'); const f = readForm(root); const s = Object.assign(this.defaults(), settings());
    const n = Object.assign({}, s, { vatRate: num(f.vatRate), cashLimit: num(f.cashLimit), rentIndexUrls: {}, sanctionUrls: {}, highRiskCountries: String(f.hr || '').split('\n').map(x => x.trim()).filter(Boolean) });
    EMIRATES.forEach(e => { if (f['ri_' + e]) n.rentIndexUrls[e] = f['ri_' + e]; });
    SANCTION_LISTS.forEach(l => { if (f['sl_' + l.id] && f['sl_' + l.id] !== l.url) n.sanctionUrls[l.id] = f['sl_' + l.id]; });
    await commit([put('settings', n, 'Settings changed')]); toast('Settings saved'); App.render();
  },
  async loadSample(fromFile) {
    let payload = null;
    if (fromFile) { const file = await pickFile('.json'); if (!file) return; payload = JSON.parse(await readFileText(file)); if (!payload.data) throw new Error('This is not a sample data file.'); }
    if (company() && !(await confirmBox('Company already set up', 'Sample company, its opening entry and records with existing IDs will be skipped. Continue?'))) return;
    const r = await API.sampleLoad(payload); await refresh(); toast('Sample data loaded: ' + r.added + ' records' + (r.skipped ? ', ' + r.skipped + ' skipped' : '')); location.hash = '#dashboard'; App.render();
  },
  async deleteSample() {
    if (!(await confirmBox('Delete sample data', 'Permanently delete every record and user that came from the sample data file, and any record linked to sample records (e.g. entries posted against the sample bank or tenants)? Your other records are kept.'))) return;
    const r = await API.sampleDelete(); await refresh(); toast(r.deleted + ' sample records deleted'); App.render();
  },
  backup() {
    const text = S.mode === 'offline' ? OfflineAPI.exportAll() : JSON.stringify({ exported: new Date().toISOString(), data: S.data }, null, 1);
    downloadText('real_estate_backup_' + today() + '.json', text, 'application/json');
  },
  async restore() {
    const file = await pickFile('.json'); if (!file) return;
    if (!(await confirmBox('Restore backup', 'This replaces ALL offline data in this browser with the backup file.'))) return;
    OfflineAPI.importAll(await readFileText(file)); location.reload();
  },
};

/* ---- js/main.js ---- */
/* App shell: login, role-based navigation, routing, boot. */
'use strict';

const ROUTES = {
  dashboard: { title: 'Dashboard', group: 'Overview', roles: ROLES, view: () => Dash.render() },
  company: { title: 'Company', group: 'Overview', roles: ['CEO', 'CFO', 'Accountant', 'Agent'], view: () => Company.render() },
  banks: { title: 'Banks & loans', group: 'Overview', roles: ['CEO', 'CFO', 'Accountant'], view: () => Banks.render() },
  property: { title: 'Property module', group: 'Modules', roles: ['CEO', 'CFO', 'Accountant', 'Agent'], view: () => Prop.render() },
  facility: { title: 'Facility module', group: 'Modules', roles: ['CEO', 'CFO', 'Accountant', 'Agent'], view: () => Fac.render() },
  tenant: { title: 'Tenant module', group: 'Modules', roles: ['CEO', 'CFO', 'Accountant', 'Agent'], view: () => Ten.render() },
  aml: { title: 'AML screening', group: 'Modules', roles: ['CEO', 'CFO', 'Accountant', 'Agent'], view: () => AML.render() },
  myunit: { title: 'My unit & requests', group: 'Tenant', roles: ['Tenant'], view: () => Portal.render() },
  accounts: { title: 'Accounts & reports', group: 'Finance', roles: ['CEO', 'CFO', 'Accountant'], view: () => Reports.render() },
  wizard: { title: 'P&L wizard', group: 'Finance', roles: ['CEO', 'CFO', 'Accountant'], view: () => Wizard.render() },
  audit: { title: 'Audit trail', group: 'Admin', roles: ['CEO', 'CFO', 'Accountant'], view: () => Audit.render() },
  users: { title: 'Users & roles', group: 'Admin', roles: ['CEO', 'CFO'], view: () => Users.render() },
  settings: { title: 'Settings & sample data', group: 'Admin', roles: ['CEO', 'CFO', 'Accountant', 'Agent'], view: () => Settings.render() },
};

const App = {
  route() { const r = (location.hash || '#dashboard').slice(1).split('?')[0]; return ROUTES[r] ? r : 'dashboard'; },
  render() {
    const root = $('#app');
    if (!S.me) { root.innerHTML = this.loginHtml(); this.afterLogin(); return; }
    let r = this.route(); if (!ROUTES[r].roles.includes(S.me.role)) r = S.me.role === 'Tenant' ? 'myunit' : 'dashboard';
    const needsSetup = !company() && S.me.role !== 'Tenant' && r !== 'settings';
    const groups = {};
    Object.entries(ROUTES).filter(([, v]) => v.roles.includes(S.me.role)).forEach(([k, v]) => { (groups[v.group] = groups[v.group] || []).push([k, v]); });
    const nav = Object.entries(groups).map(([g, items]) => '<div class="grp">' + esc(g) + '</div>' + items.map(([k, v]) => '<a href="#' + k + '" class="' + (k === r ? 'on' : '') + '" onclick="App.closeMenu()">' + esc(v.title) + '</a>').join('')).join('');
    const c = company();
    let content;
    try { content = needsSetup ? Company.renderSetup() : ROUTES[r].view(); }
    catch (e) { console.error(e); content = '<div class="alert red">Error: ' + esc(e.message) + '</div>'; }
    if (S.mode === 'offline' && OfflineAPI.memOnly) content = '<div class="alert warn">This browser blocks local storage for this file, so data is kept only until the tab closes. Use Settings → Backup to export, or open the file directly in Chrome / Edge.</div>' + content;
    root.innerHTML = '<div class="layout"><aside class="side" id="side"><div class="logo">' + esc(c ? c.approvedName : 'Real Estate Manager') + '<small>RERA · UAE · ' + (S.mode === 'offline' ? 'offline edition' : 'server edition') + '</small></div><nav>' + nav + '</nav>' +
      '<div class="who">Signed in as <b>' + esc(S.me.name) + '</b><br>' + esc(S.me.role) + (S.me.defaultPw ? ' · <span style="color:#ffd27a">default password</span>' : '') +
      '<div class="btns" style="margin-top:8px"><button class="btn sec sm" onclick="App.switchUser()">Switch user</button><button class="btn sec sm" onclick="App.changePw()">Password</button></div></div></aside>' +
      '<main class="main"><div class="top"><button class="btn sec sm menu-btn" onclick="$(\'#side\').classList.toggle(\'open\')">☰</button><h1>' + esc(needsSetup ? 'Company setup' : ROUTES[r].title) + '</h1><span class="small muted">' + fmtDate(today()) + '</span></div><div class="content">' + content + '</div></main></div>';
    if (needsSetup) Company.afterRender();
  },
  closeMenu() { const s = $('#side'); if (s) s.classList.remove('open'); },
  loginHtml() {
    const b = S.boot;
    const head = '<div class="login"><div class="card"><h1>Real Estate Manager</h1><p class="muted small">Property · Facility · Tenant · AML — UAE / RERA' + (S.mode === 'offline' ? ' · offline edition (data stays in this browser)' : '') + '</p>';
    if (!b.hasUsers) return head + '<h3>First-time setup</h3><p class="small">The app ships empty. Create the first user (CEO). Default password will be <b>123 + first four letters of the name</b>.</p>' +
      '<label class="f"><span>Your name</span><input id="fu-name" autofocus></label><div class="btns"><button class="btn" onclick="safe(()=>App.firstUser())">Create CEO user & continue</button></div></div></div>';
    return head + '<label class="f"><span>Pick your name</span><select id="lg-name">' + b.users.map(u => '<option value="' + esc(u.name) + '"' + (u.name === b.lastName ? ' selected' : '') + '>' + esc(u.name) + ' — ' + esc(u.role) + '</option>').join('') + '</select></label>' +
      '<label class="f" style="margin-top:10px"><span>Password</span><input id="lg-pw" type="password" placeholder="default: 123 + first 4 letters of name"></label><div class="btns"><button class="btn" id="lg-btn" onclick="safe(()=>App.login())">Log in</button></div></div></div>';
  },
  afterLogin() { const pw = $('#lg-pw'); if (pw) { pw.focus(); pw.addEventListener('keydown', e => { if (e.key === 'Enter') safe(() => App.login()); }); } const fu = $('#fu-name'); if (fu) fu.addEventListener('keydown', e => { if (e.key === 'Enter') safe(() => App.firstUser()); }); },
  async firstUser() {
    const name = $('#fu-name').value.trim(); if (!/[A-Za-z]/.test(name)) throw new Error('Enter a name');
    const r = await API.setupFirst(name); toast('CEO created. Your default password is ' + r.defaultPassword);
    await refresh(); location.hash = '#company'; this.render();
  },
  async login() {
    const name = $('#lg-name').value; await API.login(name, $('#lg-pw').value);
    try { localStorage.setItem('rem_last_user', name); } catch (e) { /* ignore */ }
    await refresh(); this.render();
    if (S.me.defaultPw) toast('You are using the default password. Change it via "Password" in the sidebar.');
  },
  async switchUser() { await safe(() => API.logout()); S.me = null; S.data = {}; await this.boot(); },
  changePw() {
    openModal('Change password', '<div class="grid">' + field('Current password', 'old', '', { type: 'password' }) + field('New password (min 6)', 'nw', '', { type: 'password' }) + field('Repeat new password', 'nw2', '', { type: 'password' }) + '</div>',
      [{ label: 'Cancel', cls: 'sec' }, { label: 'Change', onClick: async mb => { const f = readForm(mb); if (f.nw !== f.nw2) throw new Error('New passwords do not match'); await API.password(f.old, f.nw); await refresh(); toast('Password changed'); App.render(); } }], { width: 480 });
  },
  async boot() {
    try {
      S.boot = await API.bootstrap();
      try { S.boot.lastName = localStorage.getItem('rem_last_user'); } catch (e) { /* ignore */ }
      if (S.boot.me) { await refresh(); } else { S.me = null; }
    } catch (e) {
      console.error(e);
      $('#app').innerHTML = '<div class="login"><div class="card"><h1>Cannot reach the server</h1><p>' + esc(e.message) + '</p><p class="small muted">Start it with <code>python app.py</code> and reload this page.</p></div></div>';
      return;
    }
    this.render();
  },
};

window.addEventListener('hashchange', () => { if (S.me) App.render(); });
document.addEventListener('DOMContentLoaded', () => App.boot());

</script>
