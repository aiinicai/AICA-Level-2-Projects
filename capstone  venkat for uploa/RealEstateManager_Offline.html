<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Real Estate Manager (Offline)</title>
<style>
:root{
  --bg:#f4f6f9;--panel:#ffffff;--ink:#1d2433;--muted:#667085;--line:#e3e7ee;
  --brand:#0f5c4d;--brand-2:#13806b;--brand-soft:#e5f3ef;--danger:#c0362c;--danger-soft:#fdecea;
  --warn:#b26a00;--warn-soft:#fff4e0;--ok:#1b7f3b;--ok-soft:#e7f6ec;--info-soft:#e8f0fe;
  --radius:10px;--shadow:0 1px 2px rgba(16,24,40,.06),0 1px 3px rgba(16,24,40,.08);
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 "Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif}
a{color:var(--brand-2)}
.boot{padding:40px;text-align:center;color:var(--muted)}
.layout{display:flex;min-height:100vh}
.side{width:236px;background:#0d2b26;color:#cfe3dd;flex-shrink:0;display:flex;flex-direction:column}
.side .logo{padding:18px 18px 10px;font-weight:700;color:#fff;font-size:16px;letter-spacing:.2px}
.side .logo small{display:block;font-weight:400;color:#8fb3a9;font-size:11px;margin-top:2px}
.side nav{padding:6px 8px;overflow:auto;flex:1}
.side .grp{font-size:10.5px;text-transform:uppercase;letter-spacing:.8px;color:#6f978c;margin:12px 10px 4px}
.side a{display:block;padding:7px 10px;border-radius:7px;color:#cfe3dd;text-decoration:none;font-size:13.5px}
.side a:hover{background:#163e37;color:#fff}
.side a.on{background:var(--brand-2);color:#fff}
.side .who{padding:12px 16px;border-top:1px solid #1d443c;font-size:12.5px}
.side .who b{color:#fff}
.main{flex:1;min-width:0;display:flex;flex-direction:column}
.top{display:flex;align-items:center;gap:10px;padding:12px 22px;background:var(--panel);border-bottom:1px solid var(--line)}
.top h1{font-size:18px;margin:0;flex:1}
.menu-btn{display:none}
.content{padding:20px 22px 60px;max-width:1400px;width:100%}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:16px 18px;margin-bottom:16px}
.card h2{font-size:15px;margin:0 0 12px}
.card h3{font-size:13.5px;margin:16px 0 8px;color:var(--brand)}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:flex-end}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px 14px}
.grid.g3{grid-template-columns:repeat(auto-fill,minmax(280px,1fr))}
label.f{display:flex;flex-direction:column;font-size:12px;color:var(--muted);gap:3px}
label.f.req>span::after{content:" *";color:var(--danger)}
input,select,textarea{font:inherit;color:var(--ink);padding:7px 9px;border:1px solid #cfd5df;border-radius:7px;background:#fff;width:100%}
input:focus,select:focus,textarea:focus{outline:2px solid #9fd6c8;border-color:var(--brand-2)}
input[readonly]{background:#f3f5f8}
textarea{min-height:64px;resize:vertical}
.btn{font:inherit;border:1px solid var(--brand-2);background:var(--brand-2);color:#fff;padding:7px 13px;border-radius:7px;cursor:pointer;white-space:nowrap}
.btn:hover{background:var(--brand)}
.btn.sec{background:#fff;color:var(--brand)}
.btn.sec:hover{background:var(--brand-soft)}
.btn.danger{background:var(--danger);border-color:var(--danger)}
.btn.warn{background:var(--warn);border-color:var(--warn)}
.btn.sm{padding:3px 8px;font-size:12px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btns{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
table.t{width:100%;border-collapse:collapse;font-size:13px}
table.t th,table.t td{padding:7px 8px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
table.t th{background:#f7f9fb;font-weight:600;color:#475467;font-size:12px;position:sticky;top:0}
table.t td.n,table.t th.n{text-align:right;white-space:nowrap}
table.t tr.tot td{font-weight:700;border-top:2px solid #98a2b3;background:#fafbfc}
table.t tr.sub td{font-weight:600;background:#f7f9fb}
.tw{overflow:auto;max-width:100%}
.pill{display:inline-block;padding:1px 8px;border-radius:20px;font-size:11.5px;font-weight:600;background:#eef1f5;color:#475467}
.pill.ok{background:var(--ok-soft);color:var(--ok)}.pill.bad{background:var(--danger-soft);color:var(--danger)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}.pill.info{background:var(--info-soft);color:#1d4ed8}
.alert{padding:10px 12px;border-radius:8px;margin:8px 0;font-size:13px;border:1px solid}
.alert.red{background:var(--danger-soft);color:#8a1f17;border-color:#f3b8b2;font-weight:600}
.alert.warn{background:var(--warn-soft);color:#7a4a00;border-color:#f1d29a}
.alert.ok{background:var(--ok-soft);color:#14532d;border-color:#b7e2c4}
.alert.info{background:var(--info-soft);color:#1e3a8a;border-color:#c7d7fb}
.kpis{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:12px;margin-bottom:16px}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:12px 14px;box-shadow:var(--shadow)}
.kpi .l{font-size:12px;color:var(--muted)}.kpi .v{font-size:20px;font-weight:700;margin-top:2px}
.muted{color:var(--muted)}.small{font-size:12px}.right{text-align:right}.nowrap{white-space:nowrap}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:14px;flex-wrap:wrap}
.tabs a{padding:8px 12px;text-decoration:none;color:var(--muted);border-bottom:2px solid transparent;cursor:pointer}
.tabs a.on{color:var(--brand);border-color:var(--brand-2);font-weight:600}
.steps{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
.steps span{padding:5px 10px;border-radius:20px;background:#eef1f5;color:var(--muted);font-size:12px}
.steps span.on{background:var(--brand-2);color:#fff}.steps span.done{background:var(--brand-soft);color:var(--brand)}
.modal-bg{position:fixed;inset:0;background:rgba(16,24,40,.45);display:flex;align-items:flex-start;justify-content:center;z-index:50;overflow:auto;padding:30px 12px}
.modal{background:#fff;border-radius:12px;max-width:980px;width:100%;box-shadow:0 20px 50px rgba(0,0,0,.25)}
.modal .mh{display:flex;align-items:center;padding:14px 18px;border-bottom:1px solid var(--line)}
.modal .mh h3{margin:0;flex:1;font-size:16px}
.modal .mb{padding:16px 18px}
.modal .mf{padding:12px 18px;border-top:1px solid var(--line);display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
.x{background:none;border:0;font-size:22px;cursor:pointer;color:var(--muted)}
#toast{position:fixed;bottom:18px;right:18px;z-index:99;display:flex;flex-direction:column;gap:6px}
#toast div{background:#1d2433;color:#fff;padding:10px 14px;border-radius:8px;box-shadow:var(--shadow);max-width:380px}
#toast div.err{background:var(--danger)}
.login{max-width:440px;margin:7vh auto;padding:0 16px}
.login .card{padding:24px}
.login h1{font-size:20px;margin:0 0 4px}
.switch{position:relative;display:inline-flex;align-items:center;gap:8px;cursor:pointer;font-size:13px}
.switch input{width:auto}
.people td input,.people td select{min-width:110px}
.doclist a{margin-right:10px}
.ledger-dr{color:#0b5394}.ledger-cr{color:#7a1f1f}
.sig{display:flex;gap:40px;margin-top:40px}.sig div{border-top:1px solid #333;padding-top:4px;min-width:200px;font-size:12px}
.print-area h2{text-align:center}
@media (max-width:860px){
  .side{position:fixed;left:-250px;top:0;bottom:0;z-index:40;transition:left .2s}
  .side.open{left:0}
  .menu-btn{display:inline-block}
  .content{padding:14px 16px 60px}
  .top{padding:10px 16px}
}
@media print{
  .side,.top,.btns,.btn,.tabs,.noprint{display:none!important}
  .card{box-shadow:none;border:0}
  body{background:#fff}
}

</style>
</head>
<body>
<div id="app"><div class="boot">Loading…</div></div>
<div id="modal-root"></div>
<div id="toast"></div>
<script>window.OFFLINE_MODE = true;</script>
<script>
/* ---- js/core.js ---- */
/* Core: helpers, data adapters (server / offline), UI primitives. */
'use strict';

const ROLES = ['CEO', 'CFO', 'Accountant', 'Agent', 'Tenant'];
const CASH_LIMIT_DEFAULT = 55000;
const VAT_DEFAULT = 5;
const WRITE_PERMS = {
  company: ['CEO', 'CFO'], shareChanges: ['CEO', 'CFO', 'Accountant'], banks: ['CEO', 'CFO', 'Accountant'],
  loans: ['CEO', 'CFO', 'Accountant'], properties: ['CEO', 'CFO', 'Agent', 'Accountant'],
  propPayments: ['CEO', 'CFO', 'Accountant'], suppliers: ['CEO', 'CFO', 'Agent', 'Accountant'],
  tenants: ['CEO', 'CFO', 'Agent', 'Accountant'], aml: ['CEO', 'CFO', 'Agent', 'Accountant'],
  sanctions: ['CEO', 'CFO', 'Agent', 'Accountant'], contracts: ['CEO', 'CFO', 'Agent', 'Accountant'],
  codes: ['CEO', 'CFO', 'Accountant'], vouchers: ['CEO', 'CFO', 'Accountant'], journal: ['CEO', 'CFO', 'Accountant'],
  serviceRequests: ['CEO', 'CFO', 'Agent', 'Accountant', 'Tenant'], settings: ['CEO', 'CFO'],
  rentIndex: ['CEO', 'CFO', 'Agent'], pnlReports: ['CEO', 'CFO', 'Accountant'],
};
const COLLECTIONS = Object.keys(WRITE_PERMS);

/* ------------------------------------------------------------ helpers */
const $ = (sel, root) => (root || document).querySelector(sel);
const $$ = (sel, root) => Array.from((root || document).querySelectorAll(sel));
function esc(s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}
function num(v) { const n = parseFloat(String(v == null ? '' : v).replace(/[^0-9.\-]/g, '')); return isNaN(n) ? 0 : n; }
function r2(n) { return Math.round((Number(n) || 0) * 100) / 100; }
function fmt(n) {
  const v = Math.round(Number(n) || 0);
  return 'AED ' + (v < 0 ? '-' : '') + Math.abs(v).toLocaleString('en-US');
}
function fmtBlank(n) { return Math.abs(Number(n) || 0) < 0.005 ? '' : fmt(n); }
function today() { const d = new Date(); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); }
function isoDate(d) { return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); }
function addMonths(date, m) { const d = new Date(date + 'T00:00:00'); d.setMonth(d.getMonth() + m); return isoDate(d); }
function addDays(date, n) { const d = new Date(date + 'T00:00:00'); d.setDate(d.getDate() + n); return isoDate(d); }
function yearEnd(start) { return start ? addDays(addMonths(start, 12), -1) : ''; }
function monthsBetween(a, b) { if (!a || !b) return 12; const d1 = new Date(a + 'T00:00:00'), d2 = new Date(addDays(b, 1) + 'T00:00:00'); return Math.max(1, Math.round(((d2 - d1) / 86400000) / 30.4167)); }
function fmtDate(d) { if (!d) return ''; const p = String(d).slice(0, 10).split('-'); return p.length === 3 ? p[2] + '/' + p[1] + '/' + p[0] : d; }
function fmtTs(ts) { if (!ts) return ''; return String(ts).replace('T', ' ').slice(0, 19); }
function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 8); }
function clone(o) { return JSON.parse(JSON.stringify(o)); }
function defaultPassword(name) { return '123' + String(name || '').replace(/[^A-Za-z]/g, '').slice(0, 4).toLowerCase(); }
function sum(arr, f) { return r2(arr.reduce((s, x) => s + (f ? num(f(x)) : num(x)), 0)); }

/* ------------------------------------------------------------ state */
const S = { mode: 'server', me: null, data: {}, boot: {} };
function col(name) { return S.data[name] || []; }
function byId(name, id) { return col(name).find(d => d.id === id); }
function settings() { return byId('settings', 'main') || {}; }
function company() { return byId('company', 'main'); }
function can(colName) { return S.me && (WRITE_PERMS[colName] || []).includes(S.me.role); }
function isRole(...roles) { return S.me && roles.includes(S.me.role); }
function cashLimit() { return num(settings().cashLimit) || CASH_LIMIT_DEFAULT; }
function vatRate() { const v = settings().vatRate; return v === undefined || v === '' ? VAT_DEFAULT : num(v); }

function nextNo(colName, field, prefix, width, extra) {
  let max = 0;
  const re = new RegExp('^' + prefix + '(\\d+)$');
  col(colName).concat(extra || []).forEach(d => { const m = re.exec(String(d[field] || '')); if (m) max = Math.max(max, parseInt(m[1], 10)); });
  return prefix + String(max + 1).padStart(width || 4, '0');
}

/* ------------------------------------------------------------ server adapter */
const ServerAPI = {
  async req(method, url, body) {
    const opt = { method, credentials: 'same-origin', headers: {} };
    if (body !== undefined) { opt.headers['Content-Type'] = 'application/json'; opt.body = JSON.stringify(body); }
    const r = await fetch(url, opt);
    let j = {};
    try { j = await r.json(); } catch (e) { /* not json */ }
    if (!r.ok) { const err = new Error(j.error || ('Request failed (HTTP ' + r.status + ')')); err.status = r.status; err.body = j; throw err; }
    return j;
  },
  bootstrap() { return this.req('GET', 'api/bootstrap'); },
  setupFirst(name) { return this.req('POST', 'api/setup-first-user', { name }); },
  login(name, password) { return this.req('POST', 'api/login', { name, password }); },
  logout() { return this.req('POST', 'api/logout', {}); },
  password(oldPw, newPw) { return this.req('POST', 'api/password', { old: oldPw, new: newPw }); },
  users() { return this.req('GET', 'api/users').then(j => j.users); },
  createUser(u) { return this.req('POST', 'api/users', u); },
  updateUser(id, u) { return this.req('PUT', 'api/users/' + encodeURIComponent(id), u); },
  loadAll() { return this.req('GET', 'api/data'); },
  batch(ops, action) { return this.req('POST', 'api/batch', { ops, action }); },
  audit() { return this.req('GET', 'api/audit').then(j => j.audit); },
  async upload(file) {
    const fd = new FormData(); fd.append('file', file);
    const r = await fetch('api/upload', { method: 'POST', body: fd, credentials: 'same-origin' });
    const j = await r.json().catch(() => ({}));
    if (!r.ok) throw new Error(j.error || 'Upload failed');
    return j.file;
  },
  fileUrl(f) { return f.url || ('api/file/' + f.id); },
  sampleLoad(payload) { return this.req('POST', 'api/sample/load', payload || {}); },
  sampleDelete() { return this.req('POST', 'api/sample/delete', {}); },
  fetchList(url, kind) { return this.req('POST', 'api/fetch-list', { url, kind }); },
  email(msg) { return this.req('POST', 'api/email', msg); },
  rentalIndex(params) { return this.req('GET', 'api/rental-index?' + new URLSearchParams(params)); },
};

/* ------------------------------------------------------------ offline adapter (localStorage) */
const OfflineAPI = {
  KEY: 'rem_offline_db_v1',
  db: null,
  load() {
    if (this.db) return this.db;
    let raw = null;
    try { raw = localStorage.getItem(this.KEY); } catch (e) { raw = null; this.memOnly = true; }
    this.db = raw ? JSON.parse(raw) : { users: [], docs: {}, audit: [], files: {}, session: null, seq: 0 };
    COLLECTIONS.forEach(c => { this.db.docs[c] = this.db.docs[c] || {}; });
    return this.db;
  },
  memOnly: false,
  persist() {
    if (this.memOnly) return; /* browser storage blocked: keep data in memory, user can Export a backup */
    try { localStorage.setItem(this.KEY, JSON.stringify(this.db)); }
    catch (e) { throw new Error('Browser storage is full or blocked (' + e.message + '). Remove large uploads or use the server version.'); }
  },
  hash(s) { let h1 = 0x811c9dc5, h2 = 0x1b873593; const str = 'rem$' + s; for (let i = 0; i < str.length; i++) { const c = str.charCodeAt(i); h1 = Math.imul(h1 ^ c, 16777619); h2 = Math.imul(h2 ^ c, 2246822507); } return (h1 >>> 0).toString(16) + (h2 >>> 0).toString(16); },
  me() { const db = this.load(); return db.users.find(u => u.id === db.session && u.active); },
  pub(u) { return { id: u.id, name: u.name, role: u.role, email: u.email || '', tenantId: u.tenantId || '', defaultPw: !!u.defaultPw, active: !!u.active, sample: !!u.sample }; },
  audit_(action, colName, docId, changes, user) {
    const db = this.load(); user = user || this.me();
    db.seq = (db.seq || 0) + 1;
    db.audit.push({ seq: db.seq, ts: new Date().toISOString().slice(0, 19), user: user ? user.name : 'system', role: user ? user.role : '', action, col: colName, docId, changes });
  },
  async bootstrap() { const db = this.load(); const me = this.me(); return { mode: 'offline', hasUsers: db.users.length > 0, users: db.users.filter(u => u.active).map(u => ({ name: u.name, role: u.role })), me: me ? this.pub(me) : null }; },
  async setupFirst(name) {
    const db = this.load(); if (db.users.length) throw new Error('Users already exist');
    const u = { id: uid(), name: name.trim(), role: 'CEO', pw: this.hash(defaultPassword(name)), defaultPw: true, active: true };
    db.users.push(u); db.session = u.id; this.audit_('First user (CEO) created', 'users', u.id, [{ field: 'name', from: '', to: u.name }], u); this.persist();
    return { me: this.pub(u), defaultPassword: defaultPassword(name) };
  },
  async login(name, password) {
    const db = this.load(); const u = db.users.find(x => x.active && x.name.toLowerCase() === String(name).trim().toLowerCase());
    if (!u || !(u.pw === this.hash(password) || (u.defaultPw && u.pw === this.hash(String(password).toLowerCase())))) throw new Error('Invalid name or password');
    db.session = u.id; this.audit_('Login', 'users', u.id, [], u); this.persist(); return { me: this.pub(u) };
  },
  async logout() { const db = this.load(); const u = this.me(); if (u) this.audit_('Logout / switch user', 'users', u.id, [], u); db.session = null; this.persist(); return { ok: true }; },
  async password(oldPw, newPw) {
    const u = this.me(); if (!u) throw new Error('Not logged in');
    if (newPw.length < 6) throw new Error('Password must be at least 6 characters');
    if (!(u.pw === this.hash(oldPw) || (u.defaultPw && u.pw === this.hash(oldPw.toLowerCase())))) throw new Error('Current password is wrong');
    u.pw = this.hash(newPw); u.defaultPw = false; this.audit_('Password changed', 'users', u.id, [{ field: 'password', from: '***', to: '***' }]); this.persist(); return { ok: true };
  },
  async users() { return this.load().users.map(u => this.pub(u)); },
  async createUser(b) {
    const me = this.me(); if (!me || me.role !== 'CEO') throw new Error('Only the CEO can create users');
    const db = this.load(); if (db.users.some(u => u.name.toLowerCase() === b.name.trim().toLowerCase())) throw new Error('A user with this name already exists');
    const u = { id: uid(), name: b.name.trim(), role: b.role, email: b.email || '', tenantId: b.tenantId || '', pw: this.hash(defaultPassword(b.name)), defaultPw: true, active: true };
    db.users.push(u); this.audit_('User created', 'users', u.id, [{ field: 'name', from: '', to: u.name }, { field: 'role', from: '', to: u.role }]); this.persist();
    return { user: this.pub(u), defaultPassword: defaultPassword(u.name) };
  },
  async updateUser(id, b) {
    const me = this.me(); if (!me || me.role !== 'CEO') throw new Error('Only the CEO can edit users');
    const u = this.load().users.find(x => x.id === id); if (!u) throw new Error('Not found');
    if (id === me.id && ((b.role && b.role !== 'CEO') || b.active === false)) throw new Error('You cannot demote or deactivate yourself');
    const old = this.pub(u);
    ['role', 'email', 'tenantId', 'active'].forEach(k => { if (k in b) u[k] = b[k]; });
    if (b.resetPassword) { u.pw = this.hash(defaultPassword(u.name)); u.defaultPw = true; }
    this.audit_('User updated', 'users', id, diffObj(old, this.pub(u))); this.persist(); return { user: this.pub(u) };
  },
  async loadAll() {
    const db = this.load(); const me = this.me(); if (!me) { const e = new Error('Not logged in'); e.status = 401; throw e; }
    const out = {};
    let tid = '', makanis = new Set();
    if (me.role === 'Tenant') { tid = me.tenantId; Object.values(db.docs.contracts).forEach(c => { if (tid && c.tenantId === tid) makanis.add(c.makani); }); }
    COLLECTIONS.forEach(c => {
      out[c] = Object.values(db.docs[c]).filter(d => {
        if (me.role !== 'Tenant') return true;
        if (['company', 'codes', 'settings'].includes(c)) return true;
        if (c === 'properties') return makanis.has(d.makani);
        if (c === 'contracts' || c === 'serviceRequests') return tid && d.tenantId === tid;
        if (c === 'tenants') return d.id === tid;
        return false;
      }).map(clone);
    });
    return { data: out, me: this.pub(me) };
  },
  async batch(ops, action) {
    const me = this.me(); if (!me) throw new Error('Not logged in');
    const db = this.load(); const snapshot = JSON.stringify(db.docs); const auditLen = db.audit.length; const seq = db.seq;
    const results = [];
    try {
      ops.forEach(op => {
        const c = op.col; if (!WRITE_PERMS[c]) throw new Error('Unknown collection ' + c);
        if (!WRITE_PERMS[c].includes(me.role)) throw new Error('Role ' + me.role + ' cannot modify ' + c);
        const act = op.action || action || '';
        if (op.op === 'del') {
          const old = db.docs[c][op.id]; if (!old) { results.push(null); return; }
          if (me.role === 'Tenant' && old.tenantId !== me.tenantId) throw new Error('Not your record');
          delete db.docs[c][op.id]; this.audit_(act || 'Deleted', c, op.id, diffObj(old, {})); results.push(null); return;
        }
        const doc = clone(op.doc || {}); doc.id = doc.id || op.id || uid();
        const old = db.docs[c][doc.id];
        if (me.role === 'Tenant' && (doc.tenantId !== me.tenantId || (old && old.tenantId !== me.tenantId))) throw new Error('Tenants can only create/edit their own service requests');
        const ts = new Date().toISOString().slice(0, 19);
        doc._updatedBy = me.name; doc._updatedAt = ts;
        doc._createdBy = old ? old._createdBy : me.name; doc._createdAt = old ? old._createdAt : ts;
        if (old && old._sample) doc._sample = true;
        db.docs[c][doc.id] = doc;
        const ch = diffObj(old, doc);
        if (ch.length || !old) this.audit_(act || (old ? 'Updated' : 'Created'), c, doc.id, ch);
        results.push(doc);
      });
      this.persist();
    } catch (e) { db.docs = JSON.parse(snapshot); db.audit.length = auditLen; db.seq = seq; throw e; }
    return { results };
  },
  async audit() { return this.load().audit.slice().reverse(); },
  upload(file) {
    return new Promise((resolve, reject) => {
      if (file.size > 1.5 * 1024 * 1024) { reject(new Error('Offline mode stores files in the browser: max 1.5 MB per file. Use the server version for larger documents.')); return; }
      const rd = new FileReader();
      rd.onload = () => {
        const db = this.load(); const id = uid();
        db.files[id] = { name: file.name, type: file.type, data: rd.result, by: (this.me() || {}).name, ts: new Date().toISOString() };
        this.audit_('File uploaded', 'files', id, [{ field: 'name', from: '', to: file.name }]);
        try { this.persist(); } catch (e) { delete db.files[id]; reject(e); return; }
        resolve({ id, name: file.name, size: file.size, offline: true });
      };
      rd.onerror = () => reject(new Error('Could not read file'));
      rd.readAsDataURL(file);
    });
  },
  fileUrl(f) { const x = this.load().files[f.id]; return x ? x.data : '#'; },
  async sampleLoad(payload) {
    if (!payload || !payload.data) throw new Error('Choose the sample_data.json file to load.');

    const db = this.load(); const companyExists = !!db.docs.company.main; let added = 0, skipped = 0;
    Object.entries(payload.data).forEach(([c, docs]) => {
      if (!db.docs[c]) return;
      docs.forEach(d => {
        if (companyExists && (c === 'company' || (c === 'journal' && d.source === 'opening'))) { skipped++; return; }
        if (db.docs[c][d.id]) { skipped++; return; }
        db.docs[c][d.id] = Object.assign(clone(d), { _sample: true, _createdBy: d._createdBy || 'sample data' }); added++;
      });
    });
    (payload.users || []).forEach(u => {
      if (db.users.some(x => x.name.toLowerCase() === u.name.toLowerCase())) return;
      db.users.push({ id: u.id || uid(), name: u.name, role: u.role, email: u.email || '', tenantId: u.tenantId || '', pw: this.hash(defaultPassword(u.name)), defaultPw: true, active: true, sample: true }); added++;
    });
    this.audit_('Sample data loaded', 'sample', '', [{ field: 'records', from: '', to: String(added) }]); this.persist();
    return { added, skipped };
  },
  async sampleDelete() {
    const db = this.load(); const me = this.me(); let n = 0;
    /* Sample records, plus records entered during a demo that point at sample ids ("smp-..."). */
    COLLECTIONS.forEach(c => Object.keys(db.docs[c]).forEach(id => { const d = db.docs[c][id]; const j = JSON.stringify(d); if (d._sample || j.includes('"smp-') || j.includes(':smp-')) { delete db.docs[c][id]; n++; } }));
    const before = db.users.length; db.users = db.users.filter(u => !u.sample || u.id === me.id); n += before - db.users.length;
    this.audit_('Sample data deleted', 'sample', '', [{ field: 'records', from: String(n), to: '0' }]); this.persist(); return { deleted: n };
  },
  async fetchList() { throw new Error('Downloading sanction lists needs the server version (browsers block cross-site downloads). In offline mode, import the list file instead.'); },
  async email() { const e = new Error('No email server in offline mode'); e.body = { fallback: 'mailto' }; throw e; },
  async rentalIndex() { throw new Error('Rental index API proxy is only available in the server version.'); },

};

function diffObj(a, b) {
  a = a || {}; b = b || {};
  const keys = Array.from(new Set(Object.keys(a).concat(Object.keys(b)))).sort();
  const out = [];
  keys.forEach(k => {
    if (k[0] === '_') return;
    const x = JSON.stringify(a[k] === undefined ? null : a[k]), y = JSON.stringify(b[k] === undefined ? null : b[k]);
    if (x !== y) out.push({ field: k, from: shortVal(a[k]), to: shortVal(b[k]) });
  });
  return out;
}
function shortVal(v) { if (v == null) return ''; const s = typeof v === 'object' ? JSON.stringify(v) : String(v); return s.length > 400 ? s.slice(0, 400) + '...' : s; }

let modalStack = [];
function openModal(title, body, buttons, o) {
  o = o || {};
  const bg = document.createElement('div'); bg.className = 'modal-bg';
  bg.innerHTML = '<div class="modal" style="' + (o.width ? 'max-width:' + o.width + 'px' : '') + '"><div class="mh"><h3>' + esc(title) + '</h3><button class="x" type="button">×</button></div><div class="mb">' + body + '</div><div class="mf"></div></div>';
  const mf = $('.mf', bg);
  (buttons || [{ label: 'Close', cls: 'sec' }]).forEach(b => {
    const btn = document.createElement('button'); btn.type = 'button'; btn.className = 'btn ' + (b.cls || ''); btn.textContent = b.label;
    btn.onclick = async () => {
      if (!b.onClick) { closeModal(); return; }
      btn.disabled = true;
      try { const r = await b.onClick($('.mb', bg)); if (r !== false) closeModal(); }
      catch (e) { console.error(e); toast(e.message || String(e), true); }
      finally { btn.disabled = false; }
    };
    mf.appendChild(btn);
  });
  $('.x', bg).onclick = () => closeModal();
  $('#modal-root').appendChild(bg); modalStack.push(bg);
  if (o.onOpen) o.onOpen($('.mb', bg));
  return $('.mb', bg);
}

  bankBalance(bankId, upto) { return this.balance('BANK:' + bankId, upto); },
  totalBank() { return sum(col('banks'), b => this.bankBalance(b.id)); },
  /* Build a journal voucher doc. Lines: [{account, makani, dr, cr, memo}] */
  jv(opts, offset) {
    const lines = (opts.lines || []).filter(l => num(l.dr) || num(l.cr)).map(l => ({ account: l.account, makani: l.makani || '', dr: r2(l.dr), cr: r2(l.cr), memo: l.memo || '' }));
    const dr = sum(lines, l => l.dr), cr = sum(lines, l => l.cr);
    if (Math.abs(dr - cr) > 0.009) throw new Error('Journal does not balance: Dr ' + dr + ' / Cr ' + cr);
    if (!lines.length) throw new Error('Journal has no amounts');
    const pending = (offset || []).map(o => ({ no: o.no }));
    return { id: uid(), no: nextNo('journal', 'no', 'JV-', 5, pending), date: opts.date || today(), source: opts.source || 'manual', ref: opts.ref || '', narration: opts.narration || '', lines, postedBy: S.me ? S.me.name : '' };
  },
  trialBalance(asAt, from) {
    const map = {};
    this.lines({ to: asAt, from }).forEach(l => { map[l.account] = r2((map[l.account] || 0) + num(l.dr) - num(l.cr)); });
    return Object.keys(map).sort((a, b) => this.code(a).localeCompare(this.code(b))).map(k => ({
      key: k, code: this.code(k), name: this.name(k), type: this.type(k), dr: map[k] > 0 ? map[k] : 0, cr: map[k] < 0 ? -map[k] : 0,
    })).filter(r => r.dr || r.cr);
  },
  /* Unit-wise P&L for a period. */
  pnl(from, to) {
    const units = {}, common = {};
    const u = m => (units[m] = units[m] || { makani: m, rent: 0, serv: 0, ejari: 0, otherInc: 0, direct: {}, totalDirect: 0 });
    this.lines({ from, to }).forEach(l => {
      const t = this.type(l.account); const net = num(l.cr) - num(l.dr);
      if (t === 'Income') {
        const x = u(l.makani || 'UNALLOCATED'); const k = l.account.split(':')[1];
        if (k === 'RENT') x.rent += net; else if (k === 'SERV') x.serv += net; else if (k === 'EJARI') x.ejari += net; else x.otherInc += net;
      } else if (t === 'Expense') {
        const code = l.account.split(':')[1]; const c = byId('codes', code); const amt = -net;
        if (l.makani && !(c && c.kind === 'common')) { const x = u(l.makani); x.direct[code] = r2((x.direct[code] || 0) + amt); x.totalDirect = r2(x.totalDirect + amt); }
        else common[code] = r2((common[code] || 0) + amt);
      }
    });
    const rows = Object.values(units).sort((a, b) => a.makani.localeCompare(b.makani)).map(x => {
      x.rent = r2(x.rent); x.serv = r2(x.serv); x.ejari = r2(x.ejari); x.otherInc = r2(x.otherInc);
      x.income = r2(x.rent + x.serv + x.ejari + x.otherInc); x.profit = r2(x.income - x.totalDirect); return x;
    });
    const income = sum(rows, r => r.income), direct = sum(rows, r => r.totalDirect), commonTotal = sum(Object.values(common));
    return { units: rows, common, income, direct, contribution: r2(income - direct), commonTotal, net: r2(income - direct - commonTotal) };
  },
  profitUpTo(asAt) { return this.pnl('', asAt).net; },
  balanceSheet(asAt) {
    const tb = this.trialBalance(asAt);
    const assets = tb.filter(r => r.type === 'Asset').map(r => ({ name: r.name, code: r.code, amt: r2(r.dr - r.cr) }));
    const liab = tb.filter(r => r.type === 'Liability').map(r => ({ name: r.name, code: r.code, amt: r2(r.cr - r.dr) }));
    const eq = tb.filter(r => r.type === 'Equity').map(r => ({ name: r.name, code: r.code, amt: r2(r.cr - r.dr) }));
    const profit = this.profitUpTo(asAt);
    eq.push({ name: 'Retained earnings / profit for the period', code: '3900', amt: profit });
    const ta = sum(assets, a => a.amt), tl = sum(liab, a => a.amt), te = sum(eq, a => a.amt);
    return { assets, liab, eq, ta, tl, te, diff: r2(ta - tl - te) };
  },
};

function partyName(p) {
  if (!p) return '';
  if (p.partyType === 'Company') return p.companyName || p.name || '';
  return p.fullName || p.name || '';
}
function propLabel(m) { const p = col('properties').find(x => x.makani === m); return p ? m + ' · ' + (p.flatNo || '') + ' ' + (p.building || '') : m; }
function bankOptions() { return col('banks').filter(b => b.active !== false).map(b => ({ v: b.id, l: b.code + ' · ' + b.bankName + ' ' + b.accountNo + ' (' + fmt(Ledger.bankBalance(b.id)) + ')' })); }

/* ---- js/company.js ---- */
/* Company setup (first screen), shareholding changes, bank accounts, bank loans. */
'use strict';

const SHARE_CAPITAL = 1000000;
const EMIRATES = ['Dubai', 'Abu Dhabi', 'Sharjah', 'Ajman', 'Umm Al Quwain', 'Ras Al Khaimah', 'Fujairah'];

const Company = {
  W: null,
  steps: ['Trade license', 'Shareholders', 'UBOs', 'Directors & signatories', 'Documents', 'First bank account'],

  licenseFields(c) {
    c = c || {};
    return '<div class="grid">' +
      field('Approved company name (as per trade license)', 'approvedName', c.approvedName, { req: true, wide: true }) +
      field('Trade name (Arabic, optional)', 'tradeNameAr', c.tradeNameAr) +
      field('Trade license number', 'licenseNo', c.licenseNo, { req: true }) +
      field('License type', 'licenseType', c.licenseType || 'Commercial', { options: ['Commercial', 'Professional', 'Industrial', 'Tourism'] }) +
      field('Legal form', 'legalForm', 'Limited Liability Company (LLC)', { readonly: true }) +
      field('Registered as', 'jurisdiction', c.jurisdiction, { req: true, options: ['Mainland', 'Free Zone'] }) +
      field('Licensing authority (e.g. DET Dubai, DMCC, IFZA)', 'authority', c.authority, { req: true }) +
      field('Emirate', 'emirate', c.emirate || 'Dubai', { options: EMIRATES, blank: false }) +
      field('Registered area / community', 'area', c.area, { req: true }) +
      field('Office / unit no.', 'unitNo', c.unitNo) + field('Building', 'building', c.building) + field('Street', 'street', c.street) +
      field('P.O. Box', 'poBox', c.poBox) + field('Makani no. of office (optional)', 'officeMakani', c.officeMakani) +
      field('License issue date', 'issueDate', c.issueDate, { type: 'date', req: true }) +
      field('License expiry date', 'expiryDate', c.expiryDate, { type: 'date', req: true }) +
      field('Chamber / registration no.', 'registrationNo', c.registrationNo) +
      field('RERA office registration no. (ORN)', 'reraOrn', c.reraOrn) +
      field('VAT TRN', 'trn', c.trn) +
      field('Phone', 'phone', c.phone) + field('Email', 'email', c.email, { type: 'email' }) +
      field('Facility / maintenance email (receives tenant service emails)', 'facilityEmail', c.facilityEmail, { type: 'email' }) +
      field('Licensed activities', 'activities', c.activities, { type: 'textarea', wide: true }) + '</div>';
  },

  /* ---------- first-run wizard ---------- */
  renderSetup() {
    if (!this.W) this.W = { step: 0, d: { shareholders: [], ubos: [], directors: [], signatories: [] } };
    const W = this.W, d = W.d;
    let body = '';
    if (!isRole('CEO', 'CFO')) return '<div class="card"><h2>Company setup pending</h2><p>The CEO or CFO must first enter the company details as per the UAE trade license.</p></div>';
    switch (W.step) {
      case 0: body = '<p class="muted">Enter the details exactly as they appear on the UAE trade license.</p>' + this.licenseFields(d); break;
      case 1: body = '<div class="alert info">Share capital: <b>' + fmt(SHARE_CAPITAL) + '</b>, allocated by the % share of each shareholder. Total must equal 100%.</div>' +
        peopleEditor('shareholders', 'shareholder', d.shareholders) + '<div id="capsplit" class="small muted" style="margin-top:8px"></div>'; break;
      case 2: body = '<p class="muted">Ultimate Beneficial Owners (UBO) as per Cabinet Decision No. 58 of 2020 — natural persons owning/controlling 25% or more. Leave empty if the shareholders themselves are the UBOs.</p>' + peopleEditor('ubos', 'ubo', d.ubos, { noBlank: true }); break;
      case 3: body = '<h3>Directors / managers</h3>' + peopleEditor('directors', 'director', d.directors) + '<h3>Authorised signatories</h3>' + peopleEditor('signatories', 'signatory', d.signatories); break;
      case 4: body = '<div class="grid">' + fileField('Trade license copy (current year)', 'licenseDocs', d.licenseDocs, { req: true }) +
        fileField('Share certificate(s)', 'shareCertDocs', d.shareCertDocs) + fileField('Memorandum of Association (MOA) / Articles of Association', 'moaDocs', d.moaDocs) +
        fileField('Other documents (Ejari of office, RERA certificate, VAT certificate…)', 'otherDocs', d.otherDocs) + '</div>'; break;
      case 5: body = '<p class="muted">The first bank account receives the share capital. Opening entry: <b>Dr Bank ' + fmt(SHARE_CAPITAL) + ' / Cr Share capital ' + fmt(SHARE_CAPITAL) + '</b>.</p>' + Banks.fields(d.bank || {}) ; break;
    }
    return '<div class="card"><h2>Real estate management company details</h2>' +
      '<div class="steps">' + this.steps.map((s, i) => '<span class="' + (i === W.step ? 'on' : i < W.step ? 'done' : '') + '">' + (i + 1) + '. ' + esc(s) + '</span>').join('') + '</div>' +
      '<div id="wiz">' + body + '</div><div class="btns">' + (W.step > 0 ? '<button class="btn sec" onclick="Company.wizBack()">◀ Back</button>' : '') +
      (W.step < 5 ? '<button class="btn" onclick="Company.wizNext()">Next ▶</button>' : '<button class="btn" onclick="safe(()=>Company.wizFinish())">Save company & post opening entry</button>') +
      '</div></div>' + (W.step === 0 ? '<div class="card"><h2>Demo?</h2><p class="muted">For testing you can load the separate sample data file instead (Settings → Sample data). It can be deleted afterwards.</p><a class="btn sec" href="#settings">Go to sample data</a></div>' : '');
  },
  afterRender() {
    if (this.W && this.W.step === 1) {
      const upd = () => { const sh = readPeople($('table[data-people="shareholders"]')); const tot = sum(sh, s => s.pct); $('#capsplit').innerHTML = 'Total: <b>' + tot + '%</b> · ' + sh.map(s => esc(s.name) + ': ' + fmt(SHARE_CAPITAL * num(s.pct) / 100)).join(' · '); };
      $('#wiz').addEventListener('input', upd); upd();
    }
  },
  collectStep() {
    const f = readForm($('#wiz')); const W = this.W;
    switch (W.step) {
      case 0: requireFields(f, [['approvedName', 'Approved name'], ['licenseNo', 'License number'], ['jurisdiction', 'Mainland / Free Zone'], ['authority', 'Licensing authority'], ['area', 'Area'], ['issueDate', 'Issue date'], ['expiryDate', 'Expiry date']]); break;
      case 1: { if (f.shareholders.length < 2) throw new Error('An LLC with multiple shareholders: enter at least two shareholders.');
        const tot = sum(f.shareholders, s => s.pct); if (Math.abs(tot - 100) > 0.001) throw new Error('Shareholding must total 100% (now ' + tot + '%).');
        f.shareholders.forEach(s => { if (!s.nationality || !s.idNo) throw new Error('Nationality and ID number are required for ' + s.name); }); break; }
      case 3: if (!f.directors.length) throw new Error('Enter at least one director / manager.'); if (!f.signatories.length) throw new Error('Enter at least one authorised signatory.'); break;
      case 4: if (!f.licenseDocs.length) throw new Error('Upload the trade license copy.'); break;
      case 5: { const b = Banks.read(f); f.bank = b; delete f.code; break; }
    }
    if (W.step !== 5) Object.assign(W.d, f);
    return f;
  },
  wizNext() { safe(() => { this.collectStep(); this.W.step++; App.render(); }); },
  wizBack() { try { const f = readForm($('#wiz')); if (this.W.step === 5) this.W.d.bank = f; else Object.assign(this.W.d, f); } catch (e) { /* ignore */ } this.W.step--; App.render(); },
  async wizFinish() {
    const f = this.collectStep(); const d = this.W.d; const b = f.bank;
    const comp = Object.assign({ id: 'main', legalForm: 'LLC', shareCapital: SHARE_CAPITAL, licenseRenewals: [{ id: uid(), issueDate: d.issueDate, expiryDate: d.expiryDate, docs: d.licenseDocs }] }, d);
    delete comp.bank;
    comp.shareholders = d.shareholders.map(s => Object.assign({}, s, { capital: r2(SHARE_CAPITAL * num(s.pct) / 100) }));
    b.id = uid(); b.isPrimary = true; b.active = true;
    const jv = Ledger.jv({ date: d.issueDate <= today() ? d.issueDate : today(), source: 'opening', ref: 'Share capital', narration: 'Opening entry: share capital paid into ' + b.bankName,
      lines: [{ account: 'BANK:' + b.id, dr: SHARE_CAPITAL }, { account: 'CAPITAL', cr: SHARE_CAPITAL }] });
    const ops = [put('company', comp, 'Company created (setup wizard)'), put('banks', b, 'First bank account created'), put('journal', jv, 'Opening entry posted')];
    if (!col('codes').length) defaultCodeDocs().forEach(c => ops.push(put('codes', c, 'Default facility code')));
    if (!byId('settings', 'main')) ops.push(put('settings', Settings.defaults(), 'Default settings'));
    await commit(ops, 'Company setup');
    this.W = null; toast('Company saved. Opening entry ' + jv.no + ' posted.'); location.hash = '#dashboard'; App.render();
  },

  /* ---------- company profile page ---------- */
  render() {
    const c = company(); if (!c) return this.renderSetup();
    const canEdit = isRole('CEO', 'CFO');
    const pend = col('shareChanges').filter(x => x.status === 'Pending CFO');
    const exp = c.expiryDate && c.expiryDate < today();
    return (exp ? '<div class="alert red">Trade license expired on ' + fmtDate(c.expiryDate) + '. Upload the yearly renewal.</div>' : '') +
      '<div class="card"><h2>' + esc(c.approvedName) + ' ' + pill(c.jurisdiction, 'info') + ' ' + pill('LLC') + '</h2>' +
      table(['Field', 'Value'], [
        ['Trade license no.', esc(c.licenseNo) + ' (' + esc(c.licenseType || '') + ')'], ['Licensing authority', esc(c.authority)],
        ['Registered area', esc([c.unitNo, c.building, c.street, c.area, c.emirate].filter(Boolean).join(', ')) + (c.poBox ? ' · P.O. Box ' + esc(c.poBox) : '')],
        ['License validity', fmtDate(c.issueDate) + ' → ' + fmtDate(c.expiryDate)], ['RERA ORN / VAT TRN', esc(c.reraOrn || '-') + ' / ' + esc(c.trn || '-')],
        ['Contact', esc([c.phone, c.email].filter(Boolean).join(' · '))], ['Facility email', esc(c.facilityEmail || '-')], ['Share capital', fmt(c.shareCapital || SHARE_CAPITAL)],
        ['Activities', esc(c.activities || '')],
      ]) + (canEdit ? '<div class="btns"><button class="btn sec" onclick="Company.edit()">Edit company details</button><button class="btn sec" onclick="Company.renewal()">Add yearly license renewal</button></div>' : '') + '</div>' +
      '<div class="card"><h2>Shareholders</h2>' + table(['Name', 'Nationality', 'ID', '% Share#', 'Capital#', 'PEP', 'ID document'],
        (c.shareholders || []).map(s => [esc(s.name), esc(s.nationality), esc((s.idType || '') + ' ' + (s.idNo || '')), num(s.pct) + '%', fmt(SHARE_CAPITAL * num(s.pct) / 100), esc(s.pep || 'No'), filesView(s.docs)])) +
      '<div class="btns">' + (can('shareChanges') ? '<button class="btn sec" onclick="Company.shareChange()">Add / modify / delete shareholding (after trade license revision)</button>' : '') + '</div>' +
      (pend.length ? '<h3>Pending CFO approval</h3>' + this.changeTable(pend) : '') +
      (col('shareChanges').filter(x => x.status !== 'Pending CFO').length ? '<h3>History</h3>' + this.changeTable(col('shareChanges').filter(x => x.status !== 'Pending CFO')) : '') + '</div>' +
      '<div class="card"><h2>UBOs</h2>' + peopleView(c.ubos, 'ubo') + '<h3>Directors / managers</h3>' + peopleView(c.directors, 'director') + '<h3>Authorised signatories</h3>' + peopleView(c.signatories, 'signatory') + '</div>' +
      '<div class="card"><h2>Company documents</h2>' + table(['Document', 'Files'], [['Trade license (current)', filesView(c.licenseDocs)], ['Share certificates', filesView(c.shareCertDocs)], ['MOA / Articles of Association', filesView(c.moaDocs)], ['Other', filesView(c.otherDocs)]]) +
      '<h3>Yearly trade license renewals</h3>' + table(['Issue', 'Expiry', 'Files'], (c.licenseRenewals || []).map(r => [fmtDate(r.issueDate), fmtDate(r.expiryDate), filesView(r.docs)])) + '</div>';
  },
  changeTable(rows) {
    return table(['Ref', 'Requested', 'By', 'Change', 'Revised license', 'Status', ''], rows.map(x => [esc(x.no), fmtDate(x.date), esc(x._createdBy || ''),
      x.after.map(s => esc(s.name) + ' ' + num(s.pct) + '%').join(', ') + '<div class="small muted">was: ' + x.before.map(s => esc(s.name) + ' ' + num(s.pct) + '%').join(', ') + '</div>',
      filesView(x.licenseDocs), statusPill(x.status) + (x.approvedBy ? '<div class="small muted">' + esc(x.approvedBy) + '</div>' : ''),
      x.status === 'Pending CFO' && isRole('CFO') ? '<button class="btn sm" onclick="safe(()=>Company.decide(\'' + x.id + '\',true))">Approve</button> <button class="btn sm danger" onclick="safe(()=>Company.decide(\'' + x.id + '\',false))">Reject</button>' : '']));
  },
  edit() {
    const c = company();
    openModal('Edit company details', this.licenseFields(c) + '<h3>UBOs</h3>' + peopleEditor('ubos', 'ubo', c.ubos, { noBlank: true }) + '<h3>Directors</h3>' + peopleEditor('directors', 'director', c.directors) +
      '<h3>Authorised signatories</h3>' + peopleEditor('signatories', 'signatory', c.signatories) + '<h3>Documents</h3><div class="grid">' + fileField('Trade license (current)', 'licenseDocs', c.licenseDocs) +
      fileField('Share certificates', 'shareCertDocs', c.shareCertDocs) + fileField('MOA / AoA', 'moaDocs', c.moaDocs) + fileField('Other', 'otherDocs', c.otherDocs) + '</div>' +
      '<p class="small muted">Shareholding can only be changed through the shareholding change request (CFO approval).</p>',
      [{ label: 'Cancel', cls: 'sec' }, { label: 'Save', onClick: async mb => {
        const f = readForm(mb); requireFields(f, [['approvedName', 'Approved name'], ['licenseNo', 'License number']]);
        delete f.legalForm; await commit([put('company', Object.assign({}, c, f), 'Company details edited')]); toast('Saved'); App.render(); } }]);
  },
  renewal() {
    const c = company();
    openModal('Yearly trade license renewal', '<div class="grid">' + field('New issue date', 'issueDate', '', { type: 'date', req: true }) + field('New expiry date', 'expiryDate', '', { type: 'date', req: true }) +
      fileField('Renewed trade license copy', 'docs', [], { req: true }) + '</div>', [{ label: 'Cancel', cls: 'sec' }, { label: 'Save renewal', onClick: async mb => {
      const f = readForm(mb); requireFields(f, [['issueDate', 'Issue date'], ['expiryDate', 'Expiry date'], ['docs', 'License copy']]);
      const n = Object.assign({}, c, { issueDate: f.issueDate, expiryDate: f.expiryDate, licenseDocs: f.docs, licenseRenewals: (c.licenseRenewals || []).concat([{ id: uid(), issueDate: f.issueDate, expiryDate: f.expiryDate, docs: f.docs }]) });
      await commit([put('company', n, 'Trade license renewed')]); toast('Renewal saved'); App.render(); } }]);
  },
  shareChange() {
    const c = company();
    openModal('Shareholding change (requires revised trade license + CFO approval)', '<div class="alert warn">Use this only when the shareholding has been revised in the trade license / amended MOA. Add, modify or delete rows below.</div>' +
      peopleEditor('after', 'shareholder', clone(c.shareholders || [])) + '<div class="grid" style="margin-top:10px">' + field('Effective date', 'date', today(), { type: 'date', req: true }) +
      field('Reason / notes', 'notes', '', { type: 'textarea' }) + fileField('Revised trade license / amended MOA', 'licenseDocs', [], { req: true }) + '</div>' +
      '<label class="switch" style="margin-top:10px"><input type="checkbox" data-f="confirm"> I confirm this shareholding is as per the revised trade license.</label>',
      [{ label: 'Cancel', cls: 'sec' }, { label: 'Submit for CFO approval', onClick: async mb => {
        const f = readForm(mb);
        if (!f.confirm) throw new Error('Tick the confirmation box.');
        if (!f.licenseDocs.length) throw new Error('Upload the revised trade license.');
        const tot = sum(f.after, s => s.pct); if (Math.abs(tot - 100) > 0.001) throw new Error('Shareholding must total 100% (now ' + tot + '%).');
        const doc = { no: nextNo('shareChanges', 'no', 'SHC-', 3), date: f.date, notes: f.notes, before: c.shareholders || [], after: f.after, licenseDocs: f.licenseDocs, status: 'Pending CFO', confirmed: true };
        await commit([put('shareChanges', doc, 'Shareholding change requested')]); toast('Submitted to CFO'); App.render(); } }], { width: 1100 });
  },
  async decide(id, approve) {
    const x = byId('shareChanges', id); const c = company();
    if (!(await confirmBox(approve ? 'Approve shareholding change' : 'Reject change', approve ? 'The company shareholders will be replaced with the revised list.' : 'The request will be rejected.'))) return;
    const ops = [put('shareChanges', Object.assign({}, x, { status: approve ? 'Approved' : 'Rejected', approvedBy: S.me.name, approvedAt: today() }), approve ? 'Shareholding change approved by CFO' : 'Shareholding change rejected')];
    if (approve) ops.push(put('company', Object.assign({}, c, { shareholders: x.after.map(s => Object.assign({}, s, { capital: r2(SHARE_CAPITAL * num(s.pct) / 100) })) }), 'Shareholders updated (' + x.no + ')'));
    await commit(ops); toast(approve ? 'Approved' : 'Rejected'); App.render();
  },
};

/* ---------------------------------------------------------------- banks & loans */
const Banks = {
  tab: 'banks',
  fields(b) {
    return '<div class="grid">' + field('Bank code', 'code', b.code || nextNo('banks', 'code', 'BNK', 2), { req: true }) + field('Bank name', 'bankName', b.bankName, { req: true }) +
      field('Branch', 'branch', b.branch) + field('Account name', 'accountName', b.accountName || (company() || {}).approvedName) + field('Account number', 'accountNo', b.accountNo, { req: true }) +
      field('IBAN', 'iban', b.iban, { ph: 'AE..' }) + field('SWIFT / BIC', 'swift', b.swift) + field('Account type', 'accountType', b.accountType || 'Current', { options: ['Current', 'Call', 'Escrow (RERA)', 'Savings'], blank: false }) +
      fileField('Bank documents (account opening letter / IBAN certificate)', 'docs', b.docs) + '</div>';
  },
  read(f) { requireFields(f, [['code', 'Bank code'], ['bankName', 'Bank name'], ['accountNo', 'Account number']]); return { code: f.code, bankName: f.bankName, branch: f.branch, accountName: f.accountName, accountNo: f.accountNo, iban: f.iban, swift: f.swift, accountType: f.accountType, docs: f.docs || [] }; },
  render() {
    const t = this.tab;
    return '<div class="tabs"><a class="' + (t === 'banks' ? 'on' : '') + '" onclick="Banks.tab=\'banks\';App.render()">Bank accounts</a><a class="' + (t === 'loans' ? 'on' : '') + '" onclick="Banks.tab=\'loans\';App.render()">Bank loans</a><a class="' + (t === 'sh' ? 'on' : '') + '" onclick="Banks.tab=\'sh\';App.render()">Shareholder loans</a></div>' +
      (t === 'banks' ? this.renderBanks() : t === 'loans' ? Loans.render() : this.renderSh());
  },
  renderBanks() {
    const w = can('banks');

const Loans = {
  schedule(l) {
    const P = num(l.principal), n = num(l.tenure) || 48, r = num(l.rate) / 1200;
    const emi = r ? P * r / (1 - Math.pow(1 + r, -n)) : P / n;
    const rows = []; let bal = P;
    for (let i = 1; i <= n; i++) {
      const interest = r2(bal * r); let principal = r2(emi - interest); if (i === n) principal = r2(bal);
      bal = r2(bal - principal); rows.push({ n: i, date: addMonths(l.startDate || today(), i - 1), principal, interest, emi: r2(principal + interest), balance: bal });
    }
    return rows;
  },
  render() {
    const w = can('loans');
    return '<div class="card"><h2>Bank loans</h2><p class="muted small">Created automatically from a property purchase shortfall, repaid in 48 instalments by default.</p>' +
      table(['Code', 'Bank', 'Property', 'Principal#', 'Rate', 'Tenure', 'EMI#', 'Paid', 'Outstanding#', 'Docs', ''], col('loans').map(l => {
        const paid = (l.paid || []).length; return [esc(l.code), esc(l.bankName) + '<div class="small muted">' + esc(l.loanAccountNo || '') + '</div>', esc(l.makani || ''), fmt(l.principal), num(l.rate) + '%', (l.tenure || 48) + ' m', fmt(this.schedule(l)[0] ? this.schedule(l)[0].emi : 0), paid + '/' + (l.tenure || 48),
          fmt(-Ledger.balance('LOAN:' + l.id)), filesView(l.docs), '<button class="btn sec sm" onclick="Loans.view(\'' + l.id + '\')">Schedule</button>' + (w ? ' <button class="btn sec sm" onclick="Loans.edit(\'' + l.id + '\')">Edit</button>' : '')];
      }), { empty: 'No bank loans.' }) + '</div>';
  },
  fields(l) {
    return '<div class="grid">' + field('Loan / bank code', 'code', l.code || nextNo('loans', 'code', 'LN', 3), { req: true }) + field('Bank name', 'bankName', l.bankName, { req: true }) + field('Branch', 'branch', l.branch) +
      field('Loan account no.', 'loanAccountNo', l.loanAccountNo) + field('Principal (AED)', 'principal', l.principal, { type: 'number', req: true, readonly: !!l.lockedPrincipal }) + field('Interest rate (% p.a.)', 'rate', l.rate, { type: 'number', step: '0.01', req: true }) +
      field('Instalments (months)', 'tenure', l.tenure || 48, { type: 'number' }) + field('First instalment date', 'startDate', l.startDate || addMonths(today(), 1), { type: 'date' }) +
      field('Repayment from bank account', 'repayBank', l.repayBank, { options: bankOptions() }) + fileField('Loan documents (PDF: offer letter, agreement, mortgage)', 'docs', l.docs) + '</div>';
  },
  read(f) { requireFields(f, [['code', 'Code'], ['bankName', 'Bank'], ['principal', 'Principal'], ['rate', 'Rate']]); return f; },
  edit(id) {
    const l = byId('loans', id);
    openModal('Edit bank loan', this.fields(Object.assign({ lockedPrincipal: true }, l)), [{ label: 'Cancel', cls: 'sec' }, { label: 'Save', onClick: async mb => {
      const f = this.read(readForm(mb)); f.principal = l.principal; await commit([put('loans', Object.assign({}, l, f), 'Bank loan updated')]); toast('Saved'); App.render(); } }]);
  },
  view(id) {
    const l = byId('loans', id); const paid = (l.paid || []).map(p => p.n);
    openModal('Repayment schedule · ' + l.code, table(['#', 'Date', 'Principal#', 'Interest#', 'EMI#', 'Balance#', ''], this.schedule(l).map(r => [r.n, fmtDate(r.date), fmt(r.principal), fmt(r.interest), fmt(r.emi), fmt(r.balance),
      paid.includes(r.n) ? pill('Paid', 'ok') : (can('journal') && r.n === (paid.length ? Math.max(...paid) + 1 : 1) ? '<button class="btn sm" onclick="safe(()=>Loans.pay(\'' + l.id + '\',' + r.n + '))">Pay</button>' : '')])), null, { width: 900 });
  },
  async pay(id, n) {
    const l = byId('loans', id); const r = this.schedule(l)[n - 1]; const bank = l.repayBank || (col('banks')[0] || {}).id;
    if (!bank) throw new Error('No bank account');
    if (Ledger.bankBalance(bank) < r.emi) throw new Error('Insufficient bank balance for EMI ' + fmt(r.emi));
    if (!(await confirmBox('Pay instalment ' + n, 'Dr Bank loan ' + fmt(r.principal) + ' · Dr Interest ' + fmt(r.interest) + ' · Cr Bank ' + fmt(r.emi)))) return;
    const jv = Ledger.jv({ date: r.date <= today() ? r.date : today(), source: 'loan repayment', ref: l.code + ' #' + n, narration: 'Loan instalment ' + n + ' - ' + l.bankName,
      lines: [{ account: 'LOAN:' + l.id, dr: r.principal }, { account: 'EXP:INT', makani: '', dr: r.interest }, { account: 'BANK:' + bank, cr: r.emi }] });
    await commit([put('journal', jv), put('loans', Object.assign({}, l, { paid: (l.paid || []).concat([{ n, date: jv.date, jv: jv.no, principal: r.principal, interest: r.interest }]) }), 'Loan instalment ' + n + ' paid')], 'Loan repayment');
    closeModal(); toast('Instalment posted: ' + jv.no); App.render(); this.view(id);
  },
};

'use strict';

const UNIT_TYPES = { Residential: ['Studio', '1BHK', '2BHK'], Commercial: ['Office space'] };

const RentIdx = {
  url(emirate) { const s = settings(); return (s.rentIndexUrls || {})[emirate || 'Dubai'] || s.rentIndexUrl || 'https://dubailand.gov.ae/en/eservices/rental-index/'; },
  lookup(p) {
    if (!p) return null;
    const e = col('rentIndex').filter(r => (r.emirate || 'Dubai') === (p.emirate || 'Dubai') && String(r.area || '').toLowerCase() === String(p.area || '').toLowerCase() && r.unitType === p.unitType)
      .sort((a, b) => String(b.asOf || '').localeCompare(String(a.asOf || '')))[0];
    if (!e) return null;
    const expected = e.basis === 'sqft' ? r2(num(e.avgRent) * num(p.sqft)) : num(e.avgRent);
    return { entry: e, expected, min: e.basis === 'sqft' ? r2(num(e.minRent) * num(p.sqft)) : num(e.minRent), max: e.basis === 'sqft' ? r2(num(e.maxRent) * num(p.sqft)) : num(e.maxRent) };
  },
  check(p, rent) {
    const lk = this.lookup(p); if (!lk || !lk.expected) return { found: false };
    const diffPct = r2((num(rent) - lk.expected) / lk.expected * 100);
    return { found: true, expected: lk.expected, min: lk.min, max: lk.max, diffPct, alert: num(rent) < lk.expected * 0.8, entry: lk.entry };
  },
  /* Reference window shown to the CFO before approving a contract. */
  panel(p, rent) {
    const c = this.check(p, rent);
    const link = '<a href="' + esc(this.url(p && p.emirate)) + '" target="_blank" rel="noopener">Open current market index (' + esc(this.url(p && p.emirate)) + ') ↗</a>';
    if (!c.found) return '<div class="alert warn">No rental index entry recorded for ' + esc(p ? p.area + ' / ' + p.unitType : '-') + '. Check the market index before approving: ' + link + '<br>Add the reference value under Property → Rental index.</div>';
    return (c.alert ? '<div class="alert red">⚠ RED ALERT: agreed rent ' + fmt(rent) + ' is ' + Math.abs(c.diffPct) + '% BELOW the rental index (' + fmt(c.expected) + '). More than 20% below index.</div>' : '<div class="alert ok">Agreed rent ' + fmt(rent) + ' vs index ' + fmt(c.expected) + ' (' + (c.diffPct >= 0 ? '+' : '') + c.diffPct + '%). Within tolerance.</div>') +
      '<div class="small muted">Index: ' + esc(c.entry.area) + ' · ' + esc(c.entry.unitType) + ' · range ' + fmt(c.min) + ' – ' + fmt(c.max) + ' · as of ' + fmtDate(c.entry.asOf) + ' · source ' + esc(c.entry.source || '') + '<br>' + link + '</div>';
  },
};

      const bal = f.bankId ? Math.max(0, Ledger.bankBalance(f.bankId)) : 0; const price = num(f.price);
      const fb = $('[data-f="fromBank"]', mb); if (!manualBank) fb.value = price ? Math.min(bal, price) : '';
      const fromBank = Math.min(num(fb.value), price); const short = r2(price - fromBank);
      $('#pp-short', mb).innerHTML = price ? '<div class="small">Bank balance available: <b>' + fmt(bal) + '</b> · Shortfall: <b>' + fmt(short) + '</b></div>' : '';
      $('#pp-fund', mb).style.display = short > 0 ? '' : 'none';
      $('#pp-loan', mb).style.display = f.funding === 'Bank loan' ? '' : 'none';
      const lp = $('#pp-loan [data-f="principal"]', mb); if (lp) { lp.value = short; lp.readOnly = true; }
      const m = f.makani || 'Makani';
      $('#pp-entry', mb).innerHTML = price ? '<b>Entry:</b> Dr Property asset ' + esc(m) + ' ' + fmt(price) + ' · Cr Bank ' + fmt(fromBank) + (short > 0 ? ' · Cr ' + (f.funding === 'Bank loan' ? 'Bank loan' : 'Loan from shareholder') + ' ' + fmt(short) : '') : 'Enter the purchase price.';
    } else {
      $('#pp-entry', mb).innerHTML = '<b>Entry:</b> Dr Management fee (' + esc(f.makani || 'Makani') + ') ' + fmt(f.feeAmount) + ' · Cr Bank ' + fmt(f.feeAmount);
    }
  },
  async postPayment(mb) {
    const f = readForm(mb); if (!f.makani) throw new Error('Select the property');
    const p = col('properties').find(x => x.makani === f.makani);
    const ops = []; let jv, doc;
    if (f.type === 'Purchase') {
      const price = num(f.price); if (!(price > 0)) throw new Error('Enter the purchase price');
      if (p.acquisition !== 'Owned') throw new Error('This unit is marked as managed, not owned.');
      if (!f.sellerId) throw new Error('Select the seller / developer');
      const seller = byId('suppliers', f.sellerId); AML.requireCleared(seller, 'supplier');
      const fromBank = r2(Math.min(num(f.fromBank), price)); const short = r2(price - fromBank);
      if (fromBank > Ledger.bankBalance(f.bankId) + 0.001) throw new Error('Amount from bank exceeds bank balance');
      checkPaymentRule(price, f.mode, seller.bankName && (seller.iban || seller.accountNo), 'Property purchase');
      const lines = [{ account: 'PROP:' + f.makani, makani: f.makani, dr: price }];
      if (fromBank) lines.push({ account: 'BANK:' + f.bankId, cr: fromBank });
      let loanDoc = null;
      if (short > 0) {
        if (f.funding === 'Bank loan') {
          loanDoc = Object.assign(Loans.read(Object.assign({}, f, { principal: short })), { id: uid(), principal: short, makani: f.makani, status: 'Active', paid: [], repayBank: f.repayBank || f.bankId });
          ['type', 'makani', 'date', 'sellerId', 'price', 'bankId', 'fromBank', 'funding', 'shareholder', 'ownerId', 'feeAmount', 'feeBank', 'mode', 'chequeNo', 'chequeDate'].forEach(k => delete loanDoc[k]);
          loanDoc.makani = f.makani; loanDoc.docs = readForm($('#pp-loan', mb)).docs;
          lines.push({ account: 'LOAN:' + loanDoc.id, cr: short }); ops.push(put('loans', loanDoc, 'Bank loan created for ' + f.makani));
        } else {
          if (!f.shareholder) throw new Error('Select the shareholder contributing the shortfall');
          lines.push({ account: 'SHLOAN:' + f.shareholder, cr: short });
        }
      }
      jv = Ledger.jv({ date: f.date, source: 'property purchase', ref: f.makani, narration: 'Purchase of ' + f.makani + ' from ' + partyName(seller), lines });
      doc = { no: nextNo('propPayments', 'no', 'PP-', 4), type: 'Purchase', makani: f.makani, supplierId: f.sellerId, amount: price, fromBank, shortfall: short, funding: short ? f.funding : '', loanId: loanDoc ? loanDoc.id : '', shareholder: short && f.funding !== 'Bank loan' ? f.shareholder : '', bankId: f.bankId, date: f.date, mode: f.mode, chequeNo: f.chequeNo, chequeDate: f.chequeDate, docs: f.docs, jvNo: jv.no };
      ops.push(put('properties', Object.assign({}, p, { purchasePrice: price, purchaseDate: f.date, sellerId: f.sellerId }), 'Purchase recorded'));
    } else {
      const amt = num(f.feeAmount); if (!(amt > 0)) throw new Error('Enter the management fee amount');
      if (!f.ownerId) throw new Error('Select the property owner');
      const owner = byId('suppliers', f.ownerId); AML.requireCleared(owner, 'supplier');
      checkPaymentRule(amt, f.mode, owner.bankName && (owner.iban || owner.accountNo), 'Management fee');
      if (Ledger.bankBalance(f.feeBank) < amt) throw new Error('Insufficient bank balance (' + fmt(Ledger.bankBalance(f.feeBank)) + ')');
      jv = Ledger.jv({ date: f.date, source: 'management fee', ref: f.makani, narration: 'Management fee to ' + partyName(owner) + ' for ' + f.makani, lines: [{ account: 'EXP:MGMT', makani: f.makani, dr: amt }, { account: 'BANK:' + f.feeBank, cr: amt }] });
      doc = { no: nextNo('propPayments', 'no', 'PP-', 4), type: 'Management fee', makani: f.makani, supplierId: f.ownerId, amount: amt, bankId: f.feeBank, date: f.date, mode: f.mode, chequeNo: f.chequeNo, chequeDate: f.chequeDate, docs: f.docs, jvNo: jv.no };
    }
    ops.push(put('journal', jv), put('propPayments', doc, doc.type + ' payment posted'));
    await commit(ops, 'Property payment'); toast('Posted ' + jv.no); App.render();
  },

      [{ label: 'Close', cls: 'sec' }, { label: 'Fetch', onClick: async mb => { const r = await API.rentalIndex(readForm(mb)); $('#ri-out', mb).textContent = JSON.stringify(r.result, null, 2); return false; } }]);
