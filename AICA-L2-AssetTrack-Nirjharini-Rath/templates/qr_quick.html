<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{{ asset.asset_tag }} — {{ asset.name }}</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #f1f5f9; color: #0f172a; padding: 16px; }
    .wrap { max-width: 460px; margin: 0 auto; }
    .card { background: #fff; border-radius: 14px; border: 1px solid #e2e8f0; padding: 18px; margin-bottom: 12px; }
    .btn { width: 100%; min-height: 46px; border-radius: 10px; border: none; font-size: 15px; font-weight: 700; cursor: pointer; margin-top: 10px; }
    .btn-ok { background: #16a34a; color: #fff; }
    .btn-err { background: #dc2626; color: #fff; }
    textarea { width: 100%; padding: 10px; border: 1px solid #cbd5e1; border-radius: 8px; margin-top: 10px; font-family: inherit; }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="card" style="text-align:center;font-size:20px;font-weight:800;color:#1e3a5f;letter-spacing:-0.01em;">AssetTrack</div>
    <div class="card">
      <div style="font-family:monospace;font-weight:800;color:#1e3a5f;">{{ asset.asset_tag }}</div>
      <h1 style="font-size:20px;margin:4px 0 8px;">{{ asset.name }}</h1>
      <div style="font-size:13.5px;color:#475569;">Location: {{ asset.location }} · Category: {{ asset.category }}</div>
      <div style="margin-top:8px;font-weight:700;" id="stText">Status: {{ asset.status }}</div>
    </div>
    <div class="card">
      <button class="btn btn-ok" onclick="setStatus('OPERATIONAL')">✅ Mark Operational</button>
      <textarea id="issueNote" rows="2" placeholder="Optional issue description to add to Maintenance Log..."></textarea>
      <button class="btn btn-err" onclick="setStatus('NEEDS_REPAIR')">🚨 Flag Needs Repair</button>
      <div id="msg" style="margin-top:10px;font-size:13.5px;font-weight:600;"></div>
    </div>
    <div style="text-align:center;font-size:13px;"><a href="/" style="color:#1e3a5f;font-weight:600;text-decoration:none;">Open Dashboard →</a></div>
  </div>
  <script>
    const TAG = {{ asset.asset_tag | tojson }};
    async function setStatus(st) {
      const fd = new FormData();
      fd.append("status", st);
      fd.append("issue_note", document.getElementById("issueNote").value || "");
      const res = await fetch(`/api/q/${encodeURIComponent(TAG)}/status`, { method: "POST", body: fd });
      if (res.ok) {
        document.getElementById("stText").textContent = "Status: " + st;
        document.getElementById("msg").textContent = "Updated successfully.";
      }
    }
  </script>
</body>
</html>
