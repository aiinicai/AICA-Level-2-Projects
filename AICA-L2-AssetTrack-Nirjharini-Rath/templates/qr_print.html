<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Print QR Stickers — AssetTrack</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #f1f5f9; color: #0f172a; padding: 20px; }
    .toolbar { max-width: 1000px; margin: 0 auto 20px; background: #fff; border: 1px solid #e2e8f0; border-radius: 12px; padding: 14px 18px; display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
    .btn { padding: 9px 14px; border-radius: 8px; border: 1px solid #cbd5e1; background: #fff; color: #0f172a; font-weight: 600; font-size: 13px; cursor: pointer; text-decoration: none; }
    .btn-primary { background: #1e3a5f; color: #fff; border-color: #1e3a5f; }
    .grid { max-width: 1000px; margin: 0 auto; display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; }
    .sticker { background: #fff; border: 1.5px dashed #94a3b8; border-radius: 10px; padding: 12px; display: flex; align-items: center; gap: 12px; break-inside: avoid; }
    .qr-box { width: 92px; height: 92px; flex-shrink: 0; }
    .qr-box svg { width: 100%; height: 100%; display: block; }
    .sticker-brand { font-size: 10px; font-weight: 800; letter-spacing: 0.08em; text-transform: uppercase; color: #1e3a5f; margin-bottom: 2px; }
    .tag { font-family: monospace; font-size: 14px; font-weight: 800; color: #1e3a5f; }
    .name { font-size: 12.5px; font-weight: 700; }
    .loc { font-size: 11px; color: #475569; margin-top: 2px; }
    @media print { body { background: #fff; padding: 0; } .toolbar { display: none !important; } }
  </style>
</head>
<body>
  <div class="toolbar">
    <div style="display:flex;align-items:center;gap:12px;">
      <div style="background:#1e3a5f;color:#fff;font-weight:800;font-size:15px;padding:7px 12px;border-radius:8px;">AssetTrack</div>
      <div><h1 style="font-size:17px;">Printable Asset QR Stickers</h1><p style="font-size:12px;color:#64748b;">{{ stickers|length }} sticker(s)</p></div>
    </div>
    <div style="display:flex;gap:8px;">
      <a class="btn" href="/">← Back</a>
      <button class="btn btn-primary" onclick="window.print()">🖨️ Print</button>
    </div>
  </div>
  <div class="grid">
    {% for s in stickers %}
    <div class="sticker">
      <div class="qr-box">{{ s.svg | safe }}</div>
      <div>
        <div class="sticker-brand">AssetTrack</div>
        <div class="tag">{{ s.asset_tag }}</div>
        <div class="name">{{ s.name }}</div>
        <div class="loc">{{ s.location }}</div>
      </div>
    </div>
    {% endfor %}
  </div>
</body>
</html>
