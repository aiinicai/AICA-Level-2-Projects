<!DOCTYPE html>
<html>
<head>

    .card { background: white; padding: 40px; border-radius: 10px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); text-align: center;}
    button { padding: 10px 20px; font-size: 16px; cursor: pointer; margin-top: 20px;}
  </style>
</head>
<body>
  <div class="card">
    <h2>Website Locked</h2>
    <p>Please authenticate to access this page.</p>

  </div>
  <script src="auth.js"></script>
</body>
</html>
