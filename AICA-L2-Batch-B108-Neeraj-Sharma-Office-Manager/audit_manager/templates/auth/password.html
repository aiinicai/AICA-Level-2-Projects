{% extends "base.html" %}{% from "_macros.html" import csrf %}{% block title %}My account{% endblock %}{% block content %}
<h1 class="page mb-3">My account</h1><div style="max-width:460px">
<form method="post" action="{{ url_for('auth.set_theme') }}" class="card-box p-3 mb-3" id="theme">{{ csrf() }}<h2 class="h6 fw-bold"><i class="bi bi-palette me-1"></i>Colour theme</h2>
<div class="d-flex flex-wrap gap-2">{% for k, v in themes.items() %}<button name="theme" value="{{ k }}" class="btn btn-sm {{ 'btn-primary' if theme == k else 'btn-outline-secondary' }}">{{ v }}</button>{% endfor %}</div>
<div class="small text-muted mt-2">The theme is saved for your own login only.</div></form>
<form method="post" class="card-box p-3">{{ csrf() }}<h2 class="h6 fw-bold"><i class="bi bi-key me-1"></i>Change password</h2>
<div class="mb-2"><label class="form-label small fw-semibold">Current password</label><input type="password" name="current" class="form-control" required></div>
<div class="mb-2"><label class="form-label small fw-semibold">New password (8+ characters)</label><input type="password" name="new" class="form-control" required minlength="8"></div>
<div class="mb-3"><label class="form-label small fw-semibold">Repeat new password</label><input type="password" name="new2" class="form-control" required></div>
<button class="btn btn-primary">Change password</button></form></div>{% endblock %}
