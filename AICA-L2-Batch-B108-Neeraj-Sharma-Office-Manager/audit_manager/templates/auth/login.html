{% extends "base.html" %}{% from "_macros.html" import csrf %}{% block title %}Sign in{% endblock %}{% block content %}
<div class="card-box p-4"><h1 class="page mb-1"><i class="bi bi-journal-check me-1"></i>Office Manager</h1>
<p class="text-muted small">{{ firm_name }}</p>
<form method="post">{{ csrf() }}
<div class="mb-2"><label class="form-label small fw-semibold">Email</label><input type="email" name="email" class="form-control" required autofocus></div>

<button class="btn btn-primary w-100">Sign in</button></form></div>{% endblock %}
