{% extends "base.html" %}{% from "_macros.html" import csrf %}{% block title %}First-time setup{% endblock %}{% block content %}
<div class="card-box p-4"><h1 class="page mb-1">Welcome to Office Manager</h1>
<p class="text-muted small">Create your firm and the first administrator account. You can add the logo and CA details later in Settings.</p>
<form method="post">{{ csrf() }}
<div class="mb-2"><label class="form-label small fw-semibold">Firm name</label><input name="firm_name" class="form-control" required></div>
<div class="mb-2"><label class="form-label small fw-semibold">Your name</label><input name="name" class="form-control" required></div>
<div class="mb-2"><label class="form-label small fw-semibold">Your email (used to sign in)</label><input type="email" name="email" class="form-control" required></div>
<div class="row g-2 mb-3"><div class="col"><label class="form-label small fw-semibold">Password (8+ characters)</label><input type="password" name="password" class="form-control" required minlength="8"></div>
<div class="col"><label class="form-label small fw-semibold">Repeat password</label><input type="password" name="password2" class="form-control" required></div></div>
<button class="btn btn-primary w-100">Create account</button></form></div>{% endblock %}
