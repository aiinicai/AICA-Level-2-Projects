<form method="get" class="card-box p-2 mb-3 row g-2 mx-0 align-items-center">
<div class="col-md-4"><select name="client_id" class="form-select form-select-sm"><option value="">All clients</option>{% for c in clients %}<option value="{{ c.id }}" {{ 'selected' if client_id == c.id }}>{{ c.name }}</option>{% endfor %}</select></div>
<div class="col-md-3"><select name="status" class="form-select form-select-sm">{% set sc = g.status_counts or {} %}<option value="">All statuses ({{ sc.get('all', 0) }})</option><option value="overdue" {{ 'selected' if status == 'overdue' }}>Overdue, not filed ({{ sc.get('overdue', 0) }})</option>{% for k, v in statuses.items() %}<option value="{{ k }}" {{ 'selected' if status == k }}>{{ v }} ({{ sc.get(k, 0) }})</option>{% endfor %}</select></div>
<div class="col-md-3"><button class="btn btn-sm btn-primary">Filter</button> <a class="btn btn-sm btn-outline-secondary" href="{{ request.path }}">Reset</a></div></form>
