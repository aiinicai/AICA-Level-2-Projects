<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Sync Screen Recorder</title>
<style>
  body {
    width: 260px;
    font-family: -apple-system, Segoe UI, Roboto, Arial, sans-serif;
    padding: 14px;
    background: #1c1c1e;
    color: #f2f2f2;
  }
  h1 {
    font-size: 15px;
    margin: 0 0 12px;
    display: flex;
    align-items: center;
    gap: 6px;
  }
  h1 .dot {
    width: 10px;
    height: 10px;
    border-radius: 50%;
    background: #e02f2f;
    display: inline-block;
  }
  .opt {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 8px 0;
    border-bottom: 1px solid #2e2e30;
    font-size: 13px;
  }
  .opt:last-of-type { border-bottom: none; }
  .opt input { width: 16px; height: 16px; }
  button {
    width: 100%;
    margin-top: 14px;
    padding: 10px;
    border: none;
    border-radius: 8px;
    background: #e02f2f;
    color: white;
    font-weight: 600;
    font-size: 13px;
    cursor: pointer;
  }
  button:disabled {
    background: #555;
    cursor: not-allowed;
  }
  .hint {
    font-size: 11px;
    color: #9a9a9c;
    margin-top: 10px;
    line-height: 1.4;
  }
</style>
</head>
<body>
  <h1><span class="dot"></span> Sync Screen Recorder</h1>

  <div class="opt">
    <input type="checkbox" id="optScreen" checked>
    <label for="optScreen">Screen</label>
  </div>
  <div class="opt">
    <input type="checkbox" id="optMic">
    <label for="optMic">Microphone</label>
  </div>
  <div class="opt">
    <input type="checkbox" id="optCamera">
    <label for="optCamera">Camera</label>
  </div>

  <button id="startBtn">Start Recording</button>

  <div class="hint">
    Pick any combination of the three. All selected sources are captured on one shared clock so they stay in sync in the final recording.
  </div>

  <script src="popup.js"></script>
</body>
</html>
