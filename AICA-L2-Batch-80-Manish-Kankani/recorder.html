<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Sync Screen Recorder</title>
<style id="recorderStyles">
  body {
    margin: 0;
    font-family: -apple-system, Segoe UI, Roboto, Arial, sans-serif;
    background: #111214;
    color: #f2f2f2;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 24px;
    box-sizing: border-box;
  }
  h1 {
    font-size: 18px;
    margin: 0 0 4px;
  }
  #panel {
    display: flex;
    flex-direction: column;
    align-items: center;
    width: 100%;
  }
  .status {
    font-size: 13px;
    color: #9a9a9c;
    margin-bottom: 16px;
    text-align: center;
  }
  .status.recording { color: #e02f2f; font-weight: 600; }
  #stage {
    position: relative;
    background: #000;
    border-radius: 10px;
    overflow: hidden;
    max-width: 100%;
  }
  canvas {
    display: block;
    max-width: 90vw;
    max-height: 60vh;
    background: #000;
  }
  video { display: none; }
  .controls {
    margin-top: 18px;
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 10px;
  }
  button {
    padding: 10px 18px;
    border: none;
    border-radius: 8px;
    font-weight: 600;
    font-size: 13px;
    cursor: pointer;
  }
  #stopBtn {
    background: #e02f2f;
    color: white;
  }
  #stopBtn:disabled {
    background: #555;
    cursor: not-allowed;
  }
  #popoutBtn {
    background: #3a3a3d;
    color: white;
  }
  #popoutBtn:disabled {
    background: #333;
    color: #777;
    cursor: not-allowed;
  }
  #popoutBtn.active {
    background: #2f7de0;
  }
  #downloadBtn {
    background: #2f7de0;
    color: white;
    text-decoration: none;
    display: none;
    padding: 10px 18px;
    border-radius: 8px;
    font-weight: 600;
    font-size: 13px;
  }
  .timer {
    font-variant-numeric: tabular-nums;
    font-size: 13px;
    color: #9a9a9c;
    margin-top: 6px;
  }
  .error {
    color: #ff6b6b;
    font-size: 12px;
    margin-top: 12px;
    max-width: 480px;
    text-align: center;
  }
  .hint {
    font-size: 11px;
    color: #77c785;
    margin-top: 10px;
    max-width: 480px;
    text-align: center;
  }
</style>
</head>
<body>
  <h1>Sync Screen Recorder</h1>

  <!-- Everything in #panel gets moved as one unit into the floating
       Picture-in-Picture window when "Pop Out" is used, so recording stays
       visible (and controllable) no matter what app/window/desktop you
       switch to. -->
  <div id="panel">
    <div class="status" id="status">Requesting permissions…</div>

    <div id="stage">
      <canvas id="canvas" width="1280" height="720"></canvas>
    </div>
    <div class="timer" id="timer">00:00</div>

    <div class="controls">
      <button id="popoutBtn" disabled>Pop Out (keep visible everywhere)</button>
      <button id="stopBtn" disabled>Stop Recording</button>
      <a id="downloadBtn" download="recording.webm">Download Recording</a>
    </div>

    <div class="hint" id="hint"></div>
    <div class="error" id="error"></div>
  </div>

  <video id="screenVideo" autoplay muted playsinline></video>
  <video id="cameraVideo" autoplay muted playsinline></video>

  <script src="recorder.js"></script>
</body>
</html>
