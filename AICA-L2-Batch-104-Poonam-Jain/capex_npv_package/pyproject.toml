[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "capex-npv"
version = "1.0.0"
description = "10-year Capex investment appraisal: NPV, IRR, Payback, Profitability Index, sensitivity analysis, CLI and dashboard."
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "pandas>=1.5",
    "numpy>=1.23",
    "matplotlib>=3.6",
    "streamlit>=1.30",
    "plotly>=5.15",
    "customtkinter>=5.2",
]

[project.scripts]
capex-npv-cli = "capex_npv.cli:main"
capex-npv-dashboard = "capex_npv.launch_dashboard:main"
capex-npv-desktop = "capex_npv.desktop_app:main"

[tool.setuptools.packages.find]
include = ["capex_npv*"]
