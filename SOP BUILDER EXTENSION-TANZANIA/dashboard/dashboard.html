<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SOP Editor & Dashboard - SOP Maker</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="dashboard.css">
  <!-- Local html2pdf engine -->
  <script src="../lib/html2pdf.bundle.min.js"></script>
</head>
<body>
  <!-- Header Navbar -->
  <nav class="navbar">
    <div class="nav-brand">
      <span class="logo-dot"></span>
      <h2>SOP Maker Dashboard</h2>
    </div>
    <div class="nav-actions">
      <button id="add-section-btn" class="nav-btn secondary-btn">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="currentColor"><path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z"/></svg>
        <span>Add Section Note</span>
      </button>
      
      <button id="import-btn" class="nav-btn secondary-btn">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="currentColor"><path d="M19.35 10.04C18.67 6.59 15.64 4 12 4 9.11 4 6.6 5.64 5.35 8.04 2.34 8.36 0 10.91 0 14c0 3.31 2.69 6 6 6h13c2.76 0 5-2.24 5-5 0-2.64-2.05-4.78-4.65-4.96zM14 13v4h-4v-4H7l5-5 5 5h-3z"/></svg>
        <span>Import JSON</span>
      </button>
      <input type="file" id="json-input" accept=".json" style="display: none;">

      <button id="export-json-btn" class="nav-btn secondary-btn">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="currentColor"><path d="M19.35 10.04C18.67 6.59 15.64 4 12 4 9.11 4 6.6 5.64 5.35 8.04 2.34 8.36 0 10.91 0 14c0 3.31 2.69 6 6 6h13c2.76 0 5-2.24 5-5 0-2.64-2.05-4.78-4.65-4.96zM17 13l-5 5-5-5h3V9h4v4h3z"/></svg>
        <span>Export JSON</span>
      </button>

      <button id="export-pdf-btn" class="nav-btn primary-btn">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="currentColor"><path d="M20 2H8c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2zm-8.5 7.5c0 .83-.67 1.5-1.5 1.5H9v2H7.5V7H10c.83 0 1.5.67 1.5 1.5v1zm5 2c0 .83-.67 1.5-1.5 1.5h-2.5V7H15c.83 0 1.5.67 1.5 1.5v3zm4-3H19v1h1.5V11H19v2h-1.5V7h3v1.5zM9 10v-1.5h1V10H9zm5.5 2v-3.5h1V12h-1zM4 6H2v14c0 1.1.9 2 2 2h14v-2H4V6z"/></svg>
        <span>Save SOP as PDF</span>
      </button>
    </div>
  </nav>

  <!-- Main Container -->
  <div class="dashboard-container" id="sop-document-container">
    <!-- Export PDF Wrapper (we print this block) -->
    <div id="sop-print-area">
      <!-- Cover / Header Section -->
      <section class="sop-header-card">
        <div class="header-editor-inputs">
          <input type="text" id="sop-title-display" class="editable-title-input" value="Standard Operating Procedure">
          <textarea id="sop-desc-display" class="editable-desc-textarea" rows="2" placeholder="Describe the purpose or outline of this procedure..."></textarea>
          
          <div class="sop-meta-grid">
            <div class="meta-field">
              <label>Created By</label>
              <input type="text" id="sop-creator-display" class="editable-meta-input" value="SOP Builder User">
            </div>
            <div class="meta-field">
              <label>Date Generated</label>
              <input type="text" id="sop-date-display" class="editable-meta-input" value="2026-08-09">
            </div>
            <div class="meta-field">
              <label>Total Steps</label>
              <span id="sop-steps-count" class="meta-text-val">0 Steps</span>
            </div>
          </div>
        </div>
      </section>

      <!-- Steps & Notes list -->
      <main id="sop-steps-list" class="sop-steps-container">
        <!-- Steps and Section Notes will be dynamically loaded here -->
        <div class="empty-state" id="empty-state">
          <svg viewBox="0 0 24 24" width="48" height="48" fill="currentColor"><path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm-2 10H7v-2h10v2z"/></svg>
          <h3>No Steps Recorded Yet</h3>
          <p>Start a recording from the extension popup to capture steps, or import a saved JSON session.</p>
        </div>
      </main>
    </div>
  </div>

  <!-- Lightbox Modal -->
  <div id="lightbox" class="lightbox-modal">
    <span class="lightbox-close" id="lightbox-close-btn">&times;</span>
    <img class="lightbox-content" id="lightbox-img">
    <div id="lightbox-caption" class="lightbox-caption"></div>
  </div>

  <script src="dashboard.js"></script>
</body>
</html>
