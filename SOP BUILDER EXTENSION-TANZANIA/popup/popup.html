<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SOP Maker - Action Recorder</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="popup-container">
    <!-- Header -->
    <header class="header">
      <div class="logo-wrapper">
        <span class="logo-dot"></span>
        <h1>SOP Maker</h1>
      </div>
      <p class="tagline">Auto Screen & Action Recorder</p>
    </header>

    <!-- Main controls -->
    <main class="main-content">
      <!-- Status Card -->
      <div class="status-card" id="status-card">
        <div class="status-indicator">
          <span class="status-dot" id="state-dot"></span>
          <span class="status-text" id="state-txt">Idle</span>
        </div>
        <div class="stats-grid">
          <div class="stat-box">
            <span class="stat-val" id="steps-cnt">0</span>
            <span class="stat-label">Steps</span>
          </div>
          <div class="stat-box">
            <span class="stat-val" id="timer-val">00:00</span>
            <span class="stat-label">Duration</span>
          </div>
        </div>
      </div>

      <!-- Action Buttons -->
      <div class="action-section">
        <button id="primary-btn" class="btn primary-btn btn-start">
          <svg class="btn-icon" viewBox="0 0 24 24" width="18" height="18" fill="currentColor"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-2 14.5v-9l6 4.5-6 4.5z"/></svg>
          <span id="primary-btn-txt">Start Recording</span>
        </button>

        <div class="secondary-actions" id="secondary-actions" style="display: none;">
          <button id="pause-btn" class="btn secondary-btn">
            <svg class="btn-icon" viewBox="0 0 24 24" width="16" height="16" fill="currentColor"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>
            <span id="pause-btn-txt">Pause</span>
          </button>
          <button id="stop-btn" class="btn danger-btn">
            <svg class="btn-icon" viewBox="0 0 24 24" width="16" height="16" fill="currentColor"><path d="M6 6h12v12H6V6z"/></svg>
            <span>Stop & Edit</span>
          </button>
        </div>
      </div>

      <!-- Form Inputs -->
      <div class="settings-section" id="settings-section">
        <h3>SOP Metadata</h3>
        <div class="form-group">
          <label for="doc-title">Document Title</label>
          <input type="text" id="doc-title" placeholder="e.g. Standard Operating Procedure" value="Standard Operating Procedure">
        </div>
        <div class="form-group">
          <label for="doc-creator">Author / Creator</label>
          <input type="text" id="doc-creator" placeholder="e.g. John Doe" value="SOP Builder User">
        </div>
      </div>
    </main>

    <!-- Footer -->
    <footer class="footer">
      <button id="dashboard-btn" class="dashboard-link-btn">
        <svg viewBox="0 0 24 24" width="14" height="14" fill="currentColor" style="margin-right: 6px;"><path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm-5 14H7v-2h7v2zm3-4H7v-2h10v2zm0-4H7V7h10v2z"/></svg>
        Open SOP Dashboard
      </button>
    </footer>
  </div>
  <script src="popup.js"></script>
</body>
</html>
