<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0B1F3A">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Lead and Meeting Tracker | Sample Advisory Private Limited</title>
<style>
:root{
  --paper:#F6F4EF; --card:#FFFFFF; --ink:#13213A; --ink2:#4B5669; --ink3:#8A93A2; --line:#E4DFD4; --line2:#F0EDE6;
  --navy:#0B1F3A; --navy2:#16325A; --navy3:#22416E; --gold:#B8985A; --gold2:#F4EDDD; --goldInk:#7A5B1E;
  --brand:#0B1F3A; --brand2:#F4EDDD; --brandInk:#6B4F17;
  --red:#B23A30; --redBg:#FBEAE7; --amber:#A66A00; --amberBg:#FFF2D9; --blue:#2A5E9E; --blueBg:#E8EFF9;
  --green:#1D7447; --greenBg:#E3F3E9; --grey:#667384; --greyBg:#EEF0F3; --violet:#6546A3; --violetBg:#EFEAF8;
  --serif:"Book Antiqua","Palatino Linotype",Palatino,"Iowan Old Style",Georgia,serif;
  --sans:"Segoe UI Variable Text","Segoe UI",system-ui,-apple-system,Roboto,"Helvetica Neue",Arial,sans-serif;
  --r:12px; --r2:16px;
  --sh1:0 1px 2px rgba(11,31,58,.05);
  --sh2:0 1px 2px rgba(11,31,58,.04),0 10px 28px -14px rgba(11,31,58,.18);
  --sh3:0 20px 50px -18px rgba(11,31,58,.35);
}
*{box-sizing:border-box}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--paper);color:var(--ink);font:14px/1.5 var(--sans);-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--navy2);text-decoration-color:rgba(22,50,90,.35);text-underline-offset:2px}
.num{font-variant-numeric:tabular-nums}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px;border-radius:6px}
::selection{background:var(--gold2)}
::-webkit-scrollbar{width:10px;height:10px}::-webkit-scrollbar-thumb{background:#D5CFC2;border-radius:10px;border:2px solid var(--paper)}::-webkit-scrollbar-track{background:transparent}

/* shell */
.shell{display:grid;grid-template-columns:252px 1fr;min-height:100vh}
aside{background:linear-gradient(180deg,var(--navy) 0%,#0E2748 100%);color:#DCE3EE;padding:22px 16px 18px;position:sticky;top:0;height:100vh;overflow:auto;display:flex;flex-direction:column}
.brandmark{display:flex;align-items:center;gap:11px}
.brandmark img{width:42px;height:42px;border-radius:10px;background:#fff;object-fit:contain;padding:3px;flex:none;box-shadow:0 0 0 1px rgba(184,152,90,.5)}
.firm{font-family:var(--serif);font-size:15.5px;line-height:1.2;color:#fff;font-weight:600;letter-spacing:.005em}
.site{font-size:11.5px;color:var(--gold);margin-top:3px;letter-spacing:.02em}
.appname{margin:20px 0 16px;padding:12px 13px;border-radius:12px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.09);color:#fff;font-weight:600;font-size:13.5px}
.appname small{display:block;font-weight:400;color:#AFBCD0;margin-top:3px;font-size:11.5px;line-height:1.35}
#driveState{color:var(--gold)!important}
nav{display:grid;gap:2px}
nav button{display:flex;align-items:center;gap:11px;width:100%;padding:9px 11px;border:0;background:none;border-radius:9px;cursor:pointer;text-align:left;color:#C3CDDC;font-weight:500;font-size:13.5px;position:relative;transition:background .15s,color .15s}
nav button svg{width:18px;height:18px;flex:none;opacity:.85}
nav button:hover{background:rgba(255,255,255,.07);color:#fff}
nav button.on{background:rgba(184,152,90,.16);color:#fff}
nav button.on::before{content:"";position:absolute;left:-16px;top:8px;bottom:8px;width:3px;border-radius:0 3px 3px 0;background:var(--gold)}
nav button.on svg{color:var(--gold);opacity:1}
nav .badge{margin-left:auto;background:var(--red);color:#fff;font-size:11px;padding:1px 7px;border-radius:10px;font-weight:700}
nav .navsec{font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:#7F8DA5;margin:14px 11px 4px}
.asof{margin-top:auto;padding-top:14px;border-top:1px solid rgba(255,255,255,.1);font-size:12px;color:#AFBCD0}
.asof b{color:#fff;font-weight:600}
.asof input{width:100%;margin-top:6px;padding:7px 9px;border:1px solid rgba(255,255,255,.15);border-radius:8px;background:rgba(255,255,255,.06);color:#fff;color-scheme:dark}
.asof button{margin-top:6px;width:100%;padding:7px 9px;border:1px solid rgba(255,255,255,.15);background:transparent;border-radius:8px;cursor:pointer;font-size:12px;color:#DCE3EE}
.asof button:hover{background:rgba(255,255,255,.08)}
#installBtn{background:var(--gold)!important;border-color:var(--gold)!important;color:var(--navy)!important}
main{min-width:0}

/* filter bar */
.fbar{position:sticky;top:0;z-index:20;background:rgba(246,244,239,.9);backdrop-filter:saturate(1.4) blur(10px);border-bottom:1px solid var(--line);padding:12px 28px}
.frow{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.search{flex:1 1 280px;position:relative}
.search input{width:100%;padding:10px 12px 10px 38px;border:1px solid var(--line);border-radius:10px;background:#fff;box-shadow:var(--sh1);transition:border-color .15s,box-shadow .15s}
.search input:focus{outline:0;border-color:var(--gold);box-shadow:0 0 0 3px rgba(184,152,90,.18)}
.search svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);width:17px;height:17px;color:var(--ink3)}
.fbar select,.fbar input[type=date]{padding:9px 10px;border:1px solid var(--line);border-radius:10px;background:#fff;max-width:190px;font-size:13px;box-shadow:var(--sh1);cursor:pointer}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:9px 14px;border:1px solid var(--line);border-radius:10px;background:#fff;cursor:pointer;font-size:13px;font-weight:600;white-space:nowrap;color:var(--ink);box-shadow:var(--sh1);transition:border-color .15s,background .15s,transform .05s}
.btn:hover{border-color:#C9C1B0;background:#FDFCFA}
.btn:active{transform:translateY(1px)}
.btn[disabled]{opacity:.45;cursor:default}
a.btn{text-decoration:none;color:inherit}a.btn.primary{color:#fff}
.btn.primary{background:var(--navy);color:#fff;border-color:var(--navy)}
.btn.primary:hover{background:var(--navy2);border-color:var(--navy2)}
.btn.gold{background:var(--gold);color:var(--navy);border-color:var(--gold)}
.btn.gold:hover{background:#C6A769;border-color:#C6A769}
.btn.ghost{background:transparent;box-shadow:none;border-color:transparent;color:var(--navy2)}
.btn.ghost:hover{background:var(--line2)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.chips:empty{display:none}
.chip{display:inline-flex;align-items:center;gap:6px;padding:3px 6px 3px 11px;border-radius:14px;background:var(--navy);color:#fff;font-size:12px}
.chip button{border:0;background:rgba(255,255,255,.18);color:#fff;border-radius:50%;width:18px;height:18px;cursor:pointer;line-height:1;padding:0}
.more{display:none}
.fbar.open .more{display:flex}
.fmeta{font-size:12px;color:var(--ink3);margin-left:auto}

.view{padding:26px 28px 70px;display:none;max-width:1560px}
.view.on{display:block;animation:rise .25s ease}
@keyframes rise{from{opacity:.4;transform:translateY(4px)}to{opacity:1;transform:none}}
h1{font-family:var(--serif);font-weight:600;font-size:30px;margin:0 0 4px;letter-spacing:-.01em;color:var(--navy)}
h2{font-family:var(--serif);font-weight:600;font-size:20px;margin:0;color:var(--navy)}
.eyebrow{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--gold);font-weight:700;margin-bottom:6px}
.lede{color:var(--ink2);margin:0 0 22px;max-width:780px}
.sub{color:var(--ink3);font-size:12px}

/* today hero */
.hero{display:grid;grid-template-columns:1.35fr 1fr 1fr 1fr;gap:0;background:#fff;border:1px solid var(--line);border-radius:var(--r2);overflow:hidden;margin-bottom:22px;box-shadow:var(--sh2)}
.hero > div{padding:20px 22px;border-left:1px solid var(--line);cursor:pointer;transition:background .15s}
.hero > div:first-child{border-left:0;cursor:default;background:linear-gradient(135deg,var(--navy) 0%,var(--navy2) 100%);color:#fff;position:relative}
.hero > div:first-child::after{content:"";position:absolute;right:18px;top:18px;width:34px;height:2px;background:var(--gold)}
.hero .big{font-family:var(--serif);font-size:44px;line-height:1;font-weight:600}
.hero .lab{font-size:13px;margin-top:8px;color:var(--ink2)}
.hero > div:first-child .lab{color:#B9C6D8}
.hero .date{font-family:var(--serif);font-size:25px;line-height:1.15;color:#fff}
.hero > div:hover:not(:first-child){background:#FBF9F4}
.t-red{color:var(--red)} .t-amber{color:var(--amber)} .t-blue{color:var(--blue)} .t-green{color:var(--green)}

/* kpis */
.kgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:12px;margin-bottom:26px}
.kpi{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;cursor:pointer;position:relative;box-shadow:var(--sh1);transition:border-color .15s,box-shadow .15s,transform .15s}
.kpi:hover{border-color:#D2C7AF;box-shadow:var(--sh2);transform:translateY(-1px)}
.kpi .v{font-family:var(--serif);font-size:27px;font-weight:600;letter-spacing:-.01em;color:var(--navy);line-height:1.1}
.kpi .l{font-size:12.5px;color:var(--ink);margin-top:4px;font-weight:600}
.kpi .d{font-size:11.5px;color:var(--ink3);margin-top:6px;line-height:1.35}
.kpi.na .v{color:var(--ink3);font-size:16px;font-weight:500;padding:6px 0 2px;font-family:var(--sans)}
.kgroup{font-size:11px;letter-spacing:.12em;text-transform:uppercase;font-weight:700;color:var(--goldInk);margin:0 0 10px}

/* panels */
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.panel{background:#fff;border:1px solid var(--line);border-radius:var(--r2);padding:18px 18px 16px;min-width:0;box-shadow:var(--sh1)}
.panel.wide{grid-column:1/-1}
.phead{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-bottom:12px}
.phead h3{margin:0;font-size:15px;font-weight:600;font-family:var(--serif);color:var(--navy)}
.phead .sub{text-align:right}
.chart svg{display:block;width:100%;height:auto;overflow:visible}
.chart .bar{cursor:pointer;transition:opacity .15s}
.chart .bar:hover{opacity:.78}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12px;color:var(--ink2);margin-top:8px}
.legend span{display:inline-flex;align-items:center;gap:6px;cursor:pointer}
.legend i{width:10px;height:10px;border-radius:3px;display:inline-block}
.tip{position:fixed;pointer-events:none;background:var(--navy);color:#fff;padding:7px 10px;border-radius:8px;font-size:12px;z-index:100;display:none;max-width:280px;box-shadow:var(--sh3)}

/* status pills */
.pill{display:inline-flex;align-items:center;gap:5px;padding:2px 9px;border-radius:12px;font-size:11.5px;font-weight:600;white-space:nowrap;line-height:1.6}
.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.p-red{background:var(--redBg);color:var(--red)} .p-amber{background:var(--amberBg);color:var(--amber)}
.p-blue{background:var(--blueBg);color:var(--blue)} .p-green{background:var(--greenBg);color:var(--green)}
.p-grey{background:var(--greyBg);color:var(--grey)} .p-violet{background:var(--violetBg);color:var(--violet)}
.p-brand{background:var(--gold2);color:var(--brandInk)}
.p-navy{background:var(--navy);color:#fff}

/* tables */
.tbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:12px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:#fff;box-shadow:var(--sh1);flex-wrap:wrap}
.seg button{border:0;background:none;padding:8px 12px;cursor:pointer;font-size:12.5px;border-left:1px solid var(--line);font-weight:500}
.seg button:first-child{border-left:0}
.seg button:hover{background:#FBF9F4}
.seg button.on{background:var(--navy);color:#fff}
.seg button .n{opacity:.65;margin-left:5px}
.twrap{background:#fff;border:1px solid var(--line);border-radius:var(--r2);overflow:auto;box-shadow:var(--sh1);max-height:calc(100vh - 250px)}
table{border-collapse:separate;border-spacing:0;width:100%;font-size:13px}
.lt{min-width:1650px}.lt td:first-child{min-width:240px}.lt td:nth-child(2){min-width:170px}.lt td.note{min-width:260px}
.mt{min-width:1100px}.mt td.note{min-width:300px}
th{position:sticky;top:0;z-index:1;background:#FAF8F3;text-align:left;font-weight:700;color:var(--ink2);font-size:11.5px;letter-spacing:.03em;text-transform:uppercase;padding:10px 12px;border-bottom:1px solid var(--line);white-space:nowrap;cursor:pointer;user-select:none}
th .ar{opacity:.35;margin-left:4px}
th.sorted{color:var(--navy)}
th.sorted .ar{opacity:1;color:var(--gold)}
td{padding:11px 12px;border-bottom:1px solid var(--line2);vertical-align:top}
tr.row{cursor:pointer}
tr.row:hover td{background:#FBF9F4}
tr.row:hover td:first-child{box-shadow:inset 3px 0 0 var(--gold)}
td .t{font-weight:600;color:var(--navy)}
td .s{font-size:12px;color:var(--ink3)}
td.note{max-width:320px;color:var(--ink2)}
.clip{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.pager{display:flex;align-items:center;gap:8px;justify-content:flex-end;padding:10px 12px;font-size:12.5px;color:var(--ink2);position:sticky;left:0}
.empty{padding:34px;text-align:center;color:var(--ink3)}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px}
.mark{font-size:10.5px;padding:1px 6px;border-radius:5px;background:var(--violetBg);color:var(--violet);font-weight:700;margin-left:6px;white-space:nowrap}
.mark.stage{background:var(--gold2);color:var(--brandInk)}

/* action lists */
.acols{display:grid;grid-template-columns:repeat(auto-fit,minmax(350px,1fr));gap:16px}
.alist{background:#fff;border:1px solid var(--line);border-radius:var(--r2);overflow:hidden;box-shadow:var(--sh1)}
.alist header{padding:13px 16px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px}
.alist header h3{margin:0;font-size:14.5px;font-family:var(--serif);font-weight:600;color:var(--navy)}
.alist header .c{margin-left:auto;font-weight:600;font-size:22px;font-family:var(--serif)}
.alist .bd{border-top:4px solid var(--grey)}
.aitem{padding:11px 16px;border-bottom:1px solid var(--line2);cursor:pointer;display:grid;grid-template-columns:1fr auto;gap:2px 10px;transition:background .12s}
.aitem:hover{background:#FBF9F4}
.aitem .t{font-weight:600;color:var(--navy)}
.aitem .n{grid-column:1/-1;font-size:12.5px;color:var(--ink2)}
.aitem .m{font-size:12px;color:var(--ink3);text-align:right;white-space:nowrap}
.alist .more{display:block;padding:10px 16px;font-size:12.5px;color:var(--navy2);cursor:pointer;background:none;border:0;width:100%;text-align:left;font-weight:600}

/* meetings */
.mcal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:5px}
.mcal .dh{font-size:11px;color:var(--ink3);text-align:center;padding-bottom:4px;text-transform:uppercase;letter-spacing:.08em}
.mcal .dc{min-width:0;overflow:hidden;min-height:70px;border:1px solid var(--line2);border-radius:8px;padding:5px;font-size:11px;background:#fff;cursor:default}
.mcal .dc.out{background:transparent;border-color:transparent}
.mcal .dc.today{border-color:var(--gold);box-shadow:inset 0 0 0 1px var(--gold)}
.mcal .dc .dn{color:var(--ink3);font-weight:700}
.mcal .ev{display:block;margin-top:2px;padding:1px 5px;border-radius:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer}
.calnav{display:flex;align-items:center;gap:8px}
.event{display:grid;grid-template-columns:auto 1fr;gap:14px;align-items:start}
.event .when{font-family:var(--serif);text-align:center;border:1px solid var(--line);border-radius:10px;padding:8px 12px;background:#FBF9F4}
.event .when b{display:block;font-size:26px;line-height:1;color:var(--navy)}
.rsvp{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}

/* investors */
.icards{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px}
.icard{background:#fff;border:1px solid var(--line);border-radius:var(--r2);padding:16px;cursor:pointer;box-shadow:var(--sh1);transition:border-color .15s,box-shadow .15s,transform .15s}
.icard:hover{border-color:#D2C7AF;box-shadow:var(--sh2);transform:translateY(-1px)}
.icard .nm{font-weight:600;font-family:var(--serif);font-size:15.5px;color:var(--navy)}
.icard .co{color:var(--ink2);font-size:13px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:5px 14px;font-size:13px;margin-top:10px}
.kv dt{color:var(--ink3)} .kv dd{margin:0}

/* insights */
.ins{display:grid;gap:12px}
.insight{background:#fff;border:1px solid var(--line);border-left:4px solid var(--gold);border-radius:10px;padding:14px 16px;box-shadow:var(--sh1)}
.insight.warn{border-left-color:var(--amber)} .insight.bad{border-left-color:var(--red)} .insight.good{border-left-color:var(--green)}
.insight h4{margin:0 0 4px;font-size:14.5px;font-family:var(--serif);color:var(--navy)}
.insight p{margin:0;color:var(--ink2)}
.insight .lk{color:var(--navy2);cursor:pointer;font-weight:700;font-size:12.5px;margin-top:6px;display:inline-block}

/* notes */
.notes h3{font-size:16px;margin:24px 0 8px;font-family:var(--serif);color:var(--navy)}
.notes table{background:#fff;border:1px solid var(--line);border-radius:10px}
.notes td,.notes th{position:static;cursor:default;text-transform:none;letter-spacing:0}
.notes p,.notes li{color:var(--ink2);max-width:880px}

/* drawer */
.scrim{position:fixed;inset:0;background:rgba(11,31,58,.42);backdrop-filter:blur(2px);z-index:50;display:none}
.drawer{position:fixed;top:0;right:0;height:100%;width:min(660px,100%);background:#fff;z-index:60;transform:translateX(100%);transition:transform .26s cubic-bezier(.2,.8,.2,1);display:flex;flex-direction:column;box-shadow:var(--sh3)}
.drawer.on{transform:none}
.drawer header{padding:calc(20px + env(safe-area-inset-top,0px)) 24px 16px;border-bottom:1px solid var(--line);background:linear-gradient(180deg,#FBF9F4,#fff)}
.drawer .x{float:right;border:1px solid var(--line);background:#fff;border-radius:10px;width:36px;height:36px;cursor:pointer;font-size:18px;color:var(--ink2)}
.drawer .x:hover{background:var(--line2)}
.drawer .bd{padding:18px 24px calc(34px + env(safe-area-inset-bottom,0px));overflow:auto}
.drawer h2{font-size:24px;margin-right:48px}
.dsec{margin-top:20px}
.dsec h4{margin:0 0 9px;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--goldInk)}
.tl{list-style:none;margin:0;padding:0;border-left:2px solid var(--line);margin-left:6px}
.tl li{position:relative;padding:0 0 12px 17px;font-size:13px}
.tl li::before{content:"";position:absolute;left:-6px;top:5px;width:10px;height:10px;border-radius:50%;background:#fff;border:2px solid var(--ink3)}
.tl li.sub::before{border-color:var(--navy2);background:var(--navy2)}
.tl li.local::before{border-color:var(--gold);background:var(--gold)}
.tl .dt{font-size:11.5px;color:var(--ink3);font-weight:700}
.tl li.fill{color:var(--ink3)}
.edit{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.edit label{font-size:12px;color:var(--ink2);display:grid;gap:5px;font-weight:600}
.edit select,.edit input,.edit textarea{padding:9px 10px;border:1px solid var(--line);border-radius:9px;background:#fff;font:inherit;font-weight:400;width:100%;transition:border-color .15s,box-shadow .15s}
.edit select:focus,.edit input:focus,.edit textarea:focus{outline:0;border-color:var(--gold);box-shadow:0 0 0 3px rgba(184,152,90,.18)}
.edit textarea{grid-column:1/-1;min-height:70px;resize:vertical}
.edit .hint{grid-column:1/-1;font-size:12px;color:var(--ink3);font-weight:400;margin:-2px 0 2px}
.toast{position:fixed;bottom:calc(24px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:var(--navy);color:#fff;padding:11px 16px;border-radius:10px;z-index:90;display:none;font-size:13px;box-shadow:var(--sh3);border-left:3px solid var(--gold);max-width:min(560px,90vw)}
.mobnav{display:none}

/* deal pipeline */
.pstrip{display:grid;grid-template-columns:repeat(5,1fr);gap:0;background:#fff;border:1px solid var(--line);border-radius:var(--r2);overflow:hidden;margin-bottom:18px;box-shadow:var(--sh1)}
.pstrip > div{padding:14px 18px;border-left:1px solid var(--line);position:relative}
.pstrip > div:first-child{border-left:0}
.pstrip .big{font-family:var(--serif);font-size:30px;font-weight:600;color:var(--navy);line-height:1}
.pstrip .lab{font-size:12px;color:var(--ink2);margin-top:6px;font-weight:600}
.pstrip .bar{position:absolute;left:0;right:0;bottom:0;height:3px;background:var(--gold);transform-origin:left}
.board{display:grid;grid-template-columns:repeat(5,minmax(196px,1fr));gap:14px;overflow-x:auto;padding-bottom:6px}
.bcol{background:#EFEBE2;border-radius:var(--r2);padding:10px;min-height:220px;display:flex;flex-direction:column;gap:10px}
.bcol > header{display:flex;align-items:center;gap:8px;padding:4px 4px 2px}
.bcol > header h3{margin:0;font-family:var(--serif);font-size:15px;color:var(--navy);font-weight:600}
.bcol > header .n{margin-left:auto;background:#fff;border-radius:10px;padding:0 8px;font-size:12px;font-weight:700;color:var(--ink2)}
.bcol > header .step{width:22px;height:22px;border-radius:50%;background:var(--navy);color:var(--gold);display:grid;place-items:center;font-size:11.5px;font-weight:700;font-family:var(--serif)}
.bcol .hintc{font-size:11.5px;color:var(--ink3);padding:0 4px;margin-top:-4px}
.dcard{background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px 13px;cursor:pointer;box-shadow:var(--sh1);transition:box-shadow .15s,transform .15s,border-color .15s}
.dcard:hover{box-shadow:var(--sh2);transform:translateY(-1px);border-color:#D2C7AF}
.dcard .code{font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--goldInk);font-weight:700}
.dcard .nm{font-family:var(--serif);font-size:15px;font-weight:600;color:var(--navy);margin:2px 0 6px;line-height:1.25}
.dcard .meta{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:12px;color:var(--ink3)}
.dcard .prog{height:5px;background:var(--line2);border-radius:5px;margin-top:9px;overflow:hidden}
.dcard .prog i{display:block;height:100%;background:linear-gradient(90deg,var(--gold),#D4B77A);border-radius:5px}
.dcard .acts{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap}
.dcard .acts .btn{padding:6px 10px;font-size:12px}
.bempty{border:1.5px dashed #D8D0BF;border-radius:12px;padding:18px 12px;text-align:center;color:var(--ink3);font-size:12.5px}
.ready{margin-top:24px}
.ready .aitem{grid-template-columns:1fr auto auto;align-items:center}

/* stage stepper in the lead drawer */
.stepper{display:flex;gap:4px;margin:4px 0 12px}
.stepper span{flex:1;height:6px;border-radius:4px;background:var(--line2)}
.stepper span.done{background:var(--navy2)}
.stepper span.cur{background:var(--gold)}
.dealbox{border:1px solid var(--line);border-radius:14px;padding:14px 16px;background:linear-gradient(180deg,#FBF9F4,#fff)}
.dealbox .row1{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.dealbox .code{font-family:var(--serif);font-size:18px;font-weight:600;color:var(--navy)}
.dealbox .links{display:flex;gap:14px;flex-wrap:wrap;font-size:12.5px;margin-top:6px}
.dealbox .acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}

/* settings */
.setgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.okline{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--green);font-weight:600}
.okline.no{color:var(--amber)}

@media (max-width:1180px){.grid3{grid-template-columns:1fr 1fr}.hero{grid-template-columns:1fr 1fr}.hero > div:nth-child(3){border-left:0}.hero > div:nth-child(n+3){border-top:1px solid var(--line)}.pstrip{grid-template-columns:repeat(3,1fr)}.pstrip > div:nth-child(4){border-left:0}.pstrip > div:nth-child(n+4){border-top:1px solid var(--line)}}
@media (max-width:860px){
  .shell{grid-template-columns:1fr}
  aside{position:static;height:auto;border-right:0;padding:14px 16px}
  aside nav,.appname{display:none}
  .asof{margin-top:10px;padding-top:10px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
  .asof input,.asof button{width:auto;margin-top:0}
  .mobnav{display:flex;overflow-x:auto;gap:6px;padding:8px 16px;background:#fff;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:30}
  .mobnav button{border:1px solid var(--line);background:#fff;border-radius:16px;padding:6px 12px;white-space:nowrap;font-size:13px}
  .mobnav button.on{background:var(--navy);color:#fff;border-color:var(--navy)}
  .fbar{position:static;padding:10px 16px}
  .view{padding:16px}
  .grid2,.grid3,.setgrid{grid-template-columns:1fr}
  .hero .big{font-size:34px}
  .edit{grid-template-columns:1fr}
  .pstrip{grid-template-columns:1fr 1fr}
  .board{grid-template-columns:repeat(5,minmax(250px,82vw))}
  .twrap{max-height:none}
}
/* sign in gate (protected web build only) */
body.locked .shell,body.locked .drawer,body.locked .scrim{display:none!important}
#mfGate{position:fixed;inset:0;z-index:300;background:radial-gradient(1200px 600px at 20% 0%,#22416E 0%,#0B1F3A 55%,#081628 100%);place-items:center;padding:20px;overflow:auto}
#mfGate .gcard{background:#fff;border-radius:18px;padding:34px 32px 26px;width:min(420px,100%);box-shadow:0 30px 80px -20px rgba(0,0,0,.55);border-top:4px solid var(--gold)}
#mfGate .gbrand{display:flex;align-items:center;gap:12px;margin-bottom:18px}
#mfGate .gbrand img{width:46px;height:46px;border-radius:10px;object-fit:contain;box-shadow:0 0 0 1px rgba(184,152,90,.5)}
#mfGate .gfirm{font-family:var(--serif);font-size:15px;font-weight:600;color:var(--navy);line-height:1.2}
#mfGate .gsite{font-size:11.5px;color:var(--gold)}
#mfGate h1{font-size:26px;margin:4px 0 2px}
#mfGate .gsub{color:var(--ink2);margin:0 0 18px;font-size:13.5px}
#mfGate form{display:grid;gap:12px}
#mfGate label{display:grid;gap:5px;font-size:12px;font-weight:600;color:var(--ink2)}
#mfGate input{padding:11px 12px;border:1px solid var(--line);border-radius:10px;font:inherit;font-weight:400}
#mfGate input:focus{outline:0;border-color:var(--gold);box-shadow:0 0 0 3px rgba(184,152,90,.2)}
#mfGate .btn{padding:12px 14px;font-size:14px;margin-top:4px}
#mfGate .gerr{color:var(--red);font-size:12.5px;min-height:18px}
#mfGate .gfoot{font-size:11.5px;color:var(--ink3);margin:16px 0 0;border-top:1px solid var(--line2);padding-top:12px}
.who{margin-top:14px;padding:10px 11px;border-radius:10px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.09);font-size:12px;color:#C3CDDC}
.who b{color:#fff;font-weight:600}
.who .acts{display:flex;gap:6px;margin-top:8px}
.who button{flex:1;padding:6px 8px;border:1px solid rgba(255,255,255,.15);background:transparent;border-radius:8px;color:#DCE3EE;font-size:11.5px;cursor:pointer}
.who button:hover{background:rgba(255,255,255,.08)}
.ut td{vertical-align:middle}
.ut .acts{display:flex;gap:6px;flex-wrap:wrap}
.ut .acts .btn{padding:6px 10px;font-size:12px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
@media print{aside,.fbar,.mobnav{display:none}.shell{grid-template-columns:1fr}}
</style>
</head>

<script>

const cr=n=>n==null?'':(Math.round(n*10)/10).toLocaleString('en-IN')+' Cr';

const askCr=s=>{if(!s||!/cr/i.test(s))return null;const n=(s.split('(')[0].match(/\d+(\.\d+)?/g)||[]).map(Number);return n.length?Math.max(...n):null};

const IT=id=>BY.get(+id);

    x.legal=e.legal||null;x.mou=e.mou||null;
    const lastLocal=x.localNotes.length?x.localNotes[x.localNotes.length-1]:null;
    let localNewer=false;
    if(lastLocal&&(!x.lastUpdate||lastLocal.d>=x.lastUpdate)){x.lastUpdate=lastLocal.d;x.lastNote=lastLocal.t;x.lastSubstantive=lastLocal.d;x.lastSubstantiveNote=lastLocal.t;localNewer=true}
    let base=e.status||x.status;
    x.edited=!x.isNew&&!!(e.status||e.priority||e.owner||e.follow||e.details||(e.notes&&e.notes.length));
    const ref=x.lastSubstantive||x.lastUpdate||x.created||x.dateShared;
    x.idle=ref?days(A,ref):null;
    if(base==='Open') base=(x.idle!=null&&x.idle>STALE)?'Stalled':'Active';
    x.st=base;
    const open=(x.st==='Active'||x.st==='Stalled'||x.st==='Not started');
    let due=e.follow||(!localNewer&&x.nextAction&&x.nextAction.due)||null;
    if(!due&&x.sheetFollowOverdue&&open&&!localNewer) due=x.nextFollow;
    x.due=open?due:null;
    let fu;

    else if(x.due){const dd=days(x.due,A); fu=dd<0?'Overdue':dd===0?'Due today':dd<=7?'Next 7 days':'Later'}

    x.action=localNewer?lastLocal.t:(x.nextAction?x.nextAction.text:(e.follow?'Follow up (date set in dashboard)':(open?'No next step recorded':'')));
    return x;
  });
  BY=new Map(ITEMS.map(x=>[x.id,x]));
  const kc=count(ITEMS,x=>x.dealKey);ITEMS.forEach(x=>x.dupCount=kc.get(x.dealKey));

/* ---------- filtering ---------- */
function passItem(x,skip){
  const s=ST;
  if(s.ids&&!s.ids.includes(x.id))return false;
  if(s.q){const qs=s.q.toLowerCase().split(/\s+/).filter(Boolean); if(!qs.every(q=>x.hay.includes(q)))return false}
  if(skip!=='status'&&s.status&&x.st!==s.status)return false;
  if(skip!=='follow'&&s.follow&&x.fu!==s.follow)return false;
  if(skip!=='owner'&&s.owner&&x.ownerEff!==s.owner)return false;
  if(skip!=='source'&&s.source&&x.associate!==s.source)return false;
  if(skip!=='sector'&&s.sector&&(x.sector||'(Blank)')!==s.sector)return false;
  if(s.instr&&(x.instrument||'(Blank)')!==s.instr)return false;
  if(skip!=='mile'&&s.mile&&x.mile!==s.mile)return false;
  if(s.prio&&x.priority!==s.prio)return false;
  const dv=x[s.basis];
  if(s.from&&(!dv||dv<s.from))return false;
  if(s.to&&(!dv||dv>s.to))return false;
  return true;
}
const FI=skip=>ITEMS.filter(x=>passItem(x,skip));
function FM(){const ok=new Set(FI().map(x=>x.id));
  const anyF=ST.q||ST.status||ST.follow||ST.owner||ST.source||ST.sector||ST.instr||ST.mile||ST.prio||ST.ids;
  return MEETS.filter(m=>(m.ids.some(i=>ok.has(i))||(!m.ids.length&&!anyF))&&(!ST.from||ST.basis!=='lastUpdate'||m.date>=ST.from)&&(!ST.to||ST.basis!=='lastUpdate'||m.date<=ST.to))}

function donut(data,opt){ // data [{k,v,c}]

    const pt=(a,rr)=>[cx+rr*Math.cos(a),cy+rr*Math.sin(a)];
    const [x0,y0]=pt(a0,R),[x1,y1]=pt(Math.min(a1,a0+2*Math.PI-1e-4),R),[x2,y2]=pt(Math.min(a1,a0+2*Math.PI-1e-4),r),[x3,y3]=pt(a0,r);

  return `<div style="display:flex;gap:16px;align-items:center;flex-wrap:wrap"><svg viewBox="0 0 180 180" style="width:170px;flex:none">${p}<text x="90" y="88" text-anchor="middle" style="font:600 26px var(--serif);fill:var(--ink)">${opt.center??tot}</text><text x="90" y="106" text-anchor="middle" style="font:11px var(--sans);fill:var(--ink3)">${esc(opt.label||'')}</text></svg>

}

function vbars(labels,series,opt={}){ // series [{k,c,vals}] stacked
  const W=opt.W||560,H=opt.h||200,pl=30,pb=34,pt=10,n=labels.length,bw=(W-pl-10)/n;
  const tot=labels.map((_,i)=>series.reduce((a,s)=>a+s.vals[i],0)),max=Math.max(1,...tot),stp=[1,2,5,10,20,25,50,100].find(v=>v*4>=max)||Math.ceil(max/4),nice=stp*4;

/* ---------- INSIGHTS ---------- */
function renderInsights(){
  const it=FI(),me=FM(),K=kpis(it,me),A=ST.asof;
  const open=it.filter(x=>x.st==='Active'||x.st==='Stalled');
  const out=[];
  const add=(cls,h,p,act,lbl)=>out.push({cls,h,p,act,lbl});
  if(open.length){const s=open.filter(x=>x.st==='Stalled');add(s.length/open.length>.4?'bad':'warn',`${Math.round(s.length/open.length*100)}% of open opportunities have gone quiet`,`${s.length} of ${open.length} open threads have had no substantive update for more than ${STALE} days. The longest idle is ${esc(s.sort((a,b)=>b.idle-a.idle)[0]?.title||'')} at ${s[0]?.idle||0} days.`,{status:'Stalled'},'Review stalled threads')}
  let tot=0,fil=0;it.forEach(x=>x.logs.forEach(l=>{tot++;if(isFiller(l.t))fil++}));
  if(tot)add('warn','Much of the log records no movement',`${fil} of ${tot} dated entries (${Math.round(fil/tot*100)}%) read “no updates”, “WIP”, “pending” and similar. Repeated entries hide which threads are genuinely progressing; a short reason plus a next date would sharpen follow ups.`);
  const rec=it.flatMap(x=>x.logs.filter(l=>!isFiller(l.t))).map(l=>l.d);
  const w1=rec.filter(d=>days(A,d)>=0&&days(A,d)<14).length,w2=rec.filter(d=>days(A,d)>=14&&days(A,d)<28).length;
  add(w1>=w2?'good':'warn','Recent momentum',`${w1} substantive notes in the 14 days before ${fmt(A)} against ${w2} in the 14 days before that.`);
  const src=[...count(open,x=>x.associate).entries()].sort((a,b)=>b[1]-a[1]);
  if(src.length){const [s,n]=src[0];const ss=open.filter(x=>x.associate===s);add('', `${esc(s)} is the largest source of open work`,`${n} open threads, ${ss.filter(x=>x.st==='Stalled').length} of them stalled. ${src.length} associates have at least one open thread.`,{source:s},'Open this associate')}
  const dup=Object.entries(it.reduce((m,x)=>{(m[x.dealKey]=m[x.dealKey]||[]).push(x);return m},{})).filter(([k,a])=>a.length>2).sort((a,b)=>b[1].length-a[1].length);
  if(dup.length){const [k,a]=dup[0];add('',`${esc(k)} is shopped to the most parties`,`${a.length} threads across ${new Set(a.map(x=>x.counterparty||x.associate)).size} counterparties; ${a.filter(x=>x.st==='Active'||x.st==='Stalled').length} still open, ${a.filter(x=>x.st==='Dropped').length} dropped. Other multi party companies: ${dup.slice(1,5).map(([k,a])=>esc(k)+' ('+a.length+')').join(', ')}.`,{ids:a.map(x=>x.id),idsLabel:'Company: '+k},'See all threads')}
  const un=open.filter(x=>x.ownerEff==='Unassigned').length;
  if(open.length)add(un/open.length>.5?'bad':'warn','Ownership is unclear on most open threads',`${un} of ${open.length} open threads carry no PC, DS, VR initials in their notes. Assigning an owner in the tracker makes the follow up list actionable.`,{owner:'Unassigned'},'Show unassigned');
  if(K.mDone||K.mReq)add(K.mReq>K.mDone?'warn':'good',K.mReq>K.mDone?'Meeting requests outnumber completed meetings':'Meetings are being completed',`${K.mDone} meetings recorded as done, ${K.mReq} requests still open, ${K.mNol} planned meetings with no recorded outcome. Converting requests into dated slots is the clearest lever.`,null,null);
  const oldReq=me.filter(m=>m.ms==='Requested').sort((a,b)=>b.age-a.age)[0];
  if(oldReq)add('warn','Oldest open meeting request',`${esc(oldReq.title)}: “${esc(oldReq.text)}”, first logged ${fmt(oldReq.logDate)} (${oldReq.age} days ago).`,{ids:oldReq.ids,idsLabel:oldReq.title},'Open thread');
  const hv=open.filter(x=>x.fundAskCr>=40);
  if(hv.length){const u=[...new Map(hv.map(x=>[x.dealKey,x])).values()];add('', 'Large tickets in the open pipeline',`${u.length} open companies ask ₹40 Cr plus: ${u.map(x=>esc(x.dealKey)+' ('+esc(x.fundAsk)+', '+x.st.toLowerCase()+')').join('; ')}.`,{ids:hv.map(x=>x.id),idsLabel:'Fund ask ₹40 Cr plus'},'Open these')}
  add(K.conv?'good':'', 'Conversions so far',`${K.conv} converted (${it.filter(x=>x.st==='Converted').map(x=>esc(x.title)).join(', ')||'none'}), ${K.drop} dropped plus closed elsewhere. ${K.win!=null?'Win rate on decided items is '+K.win+'%.':''} Common drop reasons in notes: promoter concerns, low bandwidth, size mismatch, not interested.`,{status:'Converted'},'View converted');
  const inst=[...count(open.filter(x=>x.instrument),x=>x.instrument).entries()].sort((a,b)=>b[1]-a[1]);
  if(inst.length)add('','What the open pipeline is raising',`By stated instrument: ${inst.map(([k,n])=>esc(k)+' '+n).join(', ')}. ${open.filter(x=>!x.instrument).length} open threads do not state an instrument.`);
  const od=it.filter(x=>x.fu==='Overdue');
  if(od.length)add('bad','Overdue commitments',`${od.map(x=>esc(x.title)+' (due '+fmtS(x.due)+')').join('; ')}.`,{follow:'Overdue'},'Open overdue');
  const v=$('#v-insights');
  v.innerHTML=`<h1>Insights</h1><p class="lede">Observations computed from the rows in the current filter and the as of date. They update as you filter.</p><div class="ins">${out.map((o,i)=>`<div class="insight ${o.cls}"><h4>${o.h}</h4><p>${o.p}</p>${o.act?`<span class="lk" data-i="${i}" tabindex="0">${o.lbl}</span>`:''}</div>`).join('')}</div>`;
  v.querySelectorAll('.lk').forEach(el=>el.onclick=()=>setF(out[+el.dataset.i].act,'leads'));
}

const pad=n=>String(n).padStart(2,'0');
function evTimes(m){
  const d=m.date.replace(/-/g,'');
  if(!m.time){const e=new Date(pd(m.date).getTime()+864e5);return {allDay:true,start:d,end:iso(e).replace(/-/g,'')}}
  const [h,mi]=m.time.split(':').map(Number);const s=new Date(pd(m.date).getTime()+(h*60+mi)*6e4),e=new Date(s.getTime()+(m.duration||60)*6e4);
  const f=t=>iso(t).replace(/-/g,'')+'T'+pad(t.getHours())+pad(t.getMinutes())+'00';return {allDay:false,start:f(s),end:f(e)};
}
const evTitle=m=>(m.titleFree||m.title)+(m.associate?' | '+m.associate:'');
const evDetails=m=>[m.text,m.outcome?'Outcome: '+m.outcome:'',m.associate?'Associate: '+m.associate:'','Sample Advisory Private Limited, www.example.com'].filter(Boolean).join('\n');
function gcalURL(m){const t=evTimes(m);const p=new URLSearchParams({action:'TEMPLATE',text:evTitle(m),dates:t.start+'/'+t.end,details:evDetails(m)});

/* =====================================================================
   GOOGLE DRIVE SYNC
   Each device writes only its own journal file (journal_<user>_<device>.json)
   into one shared Drive folder. Every device reads all journals and rebuilds the
   same state: last change wins for each field, notes plus records are merged,
   nothing is overwritten across devices. Changes made offline wait locally.
   ===================================================================== */
const G_SCOPES='https://www.googleapis.com/auth/drive openid email';
const DRV='https://www.googleapis.com/drive/v3/files',UPL='https://www.googleapis.com/upload/drive/v3/files',ALLD='supportsAllDrives=true';
const uid=()=>Date.now()*10+Math.floor(Math.random()*10);
const clone=o=>JSON.parse(JSON.stringify(o));
const SYNC={on:false,folderId:null,folderName:'',user:'',dev:null,j:null,cache:{},base:null,running:false,lastSync:null,err:'',token:null,exp:0,clientId:'',timer:null,
  cfgKey:'df_drive_cfg',jKey:f=>'df_drive_j_'+f,cKey:f=>'df_drive_c_'+f};
function syncCfgLoad(){try{return JSON.parse(localStorage.getItem(SYNC.cfgKey)||'null')}catch(e){return null}}
function syncCfgSave(){localStorage.setItem(SYNC.cfgKey,JSON.stringify({folderId:SYNC.folderId,folderName:SYNC.folderName,user:SYNC.user,dev:SYNC.dev,clientId:SYNC.clientId,on:SYNC.on}))}
function syncSaveLocal(){try{localStorage.setItem(SYNC.jKey(SYNC.folderId),JSON.stringify(SYNC.j));localStorage.setItem(SYNC.cKey(SYNC.folderId),JSON.stringify(SYNC.cache))}catch(e){toast('Device storage is full; sync data could not be cached')}}
const pendingOps=()=>SYNC.j?SYNC.j.ops.filter(o=>o.s>(SYNC.j.pushed||0)).length:0;

/* ---------- transport ---------- */
function loadGIS(){return new Promise((res,rej)=>{if(window.google&&google.accounts&&google.accounts.oauth2)return res();
  const s=document.createElement('script');s.src='https://accounts.google.com/gsi/client';s.async=true;s.onload=()=>res();s.onerror=()=>rej(new Error('Google sign in could not load; check the internet connection'));document.head.appendChild(s)})}
async function webSignIn(interactive){
  if(!SYNC.clientId)throw new Error('The Google OAuth client ID is not set');
  await loadGIS();
  return new Promise((res,rej)=>{
    const tc=google.accounts.oauth2.initTokenClient({client_id:SYNC.clientId,scope:G_SCOPES,hint:SYNC.user||undefined,
      callback:r=>{if(r.error)return rej(new Error(r.error_description||r.error));SYNC.token=r.access_token;SYNC.exp=Date.now()+(r.expires_in-120)*1000;res()},
      error_callback:e=>rej(new Error(e&&e.type==='popup_closed'?'The Google window was closed':'Google sign in was blocked; allow popups for this site'))});
    tc.requestAccessToken({prompt:interactive?'select_account':''});
  });
}
class NeedAuth extends Error{constructor(){super('Sign in to Google again to continue syncing');this.needAuth=true}}
async function gFetch(method,url,{headers={},body}={}){
  if(HOST.mode==='desktop'){const r=await dfAPI.googleFetch({method,url,headers,body});if(r.status===401)throw new NeedAuth();return r}
  if(!SYNC.token||Date.now()>SYNC.exp)throw new NeedAuth();
  const r=await fetch(url,{method,headers:Object.assign({},headers,{Authorization:'Bearer '+SYNC.token}),body});
  if(r.status===401){SYNC.token=null;throw new NeedAuth()}
  return {status:r.status,text:await r.text()};
}
async function gJSON(method,url,opt){const r=await gFetch(method,url,opt);if(r.status>=300){let m='HTTP '+r.status;try{const j=JSON.parse(r.text);m=(j.error&&j.error.message)||m}catch(e){}const e=new Error(m);e.status=r.status;throw e}return r.text?JSON.parse(r.text):{}}

/* ---------- diff: STORE changes to operations ---------- */
function noteId(n){if(!n.nid){let h=0;const s=(n.d||'')+'|'+(n.t||'');for(let i=0;i<s.length;i++)h=(h*31+s.charCodeAt(i))|0;n.nid='h'+(h>>>0).toString(36)}return n.nid}
function diffStore(b,c){
  const ops=[],J=JSON.stringify;
  const byId=(arr,k)=>new Map((arr||[]).map(x=>[String(x[k]),x]));
  const recs=(t,bk,ck,key)=>{const B=byId(bk,key),C=byId(ck,key);
    C.forEach((v,id)=>{if(!B.has(id)||J(B.get(id))!==J(v))ops.push({t,id,v:clone(v)})});
    B.forEach((v,id)=>{if(!C.has(id))ops.push({t,id,v:null})})};
  recs('lead',b.newItems,c.newItems,'id');recs('meet',b.newMeetings,c.newMeetings,'i');recs('inv',b.newInvestors,c.newInvestors,'id');
  const ids=new Set([...Object.keys(b.edits||{}),...Object.keys(c.edits||{})]);
  ids.forEach(id=>{const be=(b.edits||{})[id]||{},ce=(c.edits||{})[id]||{};
    ['status','priority','owner','follow','details','stage','stageAt','codeName','driveFolder','dataProgress','checklist','merchantBanker','mandate','legal','mou'].forEach(f=>{if(J(be[f]??null)!==J(ce[f]??null))ops.push({t:'edit',id,f,v:ce[f]??null})});
    const bn=new Map((be.notes||[]).map(n=>[noteId(n),n]));
    (ce.notes||[]).forEach(n=>{const k=noteId(n);if(!n.by)n.by=SYNC.user;if(!bn.has(k))ops.push({t:'note',id,v:clone(n)});else bn.delete(k)});
    bn.forEach((n,k)=>ops.push({t:'noteDel',id,nid:k}))});
  const mk=new Set([...Object.keys(b.meetEdits||{}),...Object.keys(c.meetEdits||{})]);
  mk.forEach(k=>{const bv=(b.meetEdits||{})[k],cv=(c.meetEdits||{})[k];if(J(bv??null)!==J(cv??null))ops.push({t:'meetEdit',id:k,v:cv??null})});
  return ops;
}
/* ---------- merge: all journals to one STORE ---------- */
function materialize(journals){
  const all=[];journals.forEach(j=>(j.ops||[]).forEach(o=>all.push(o)));
  all.sort((a,b)=>a.at-b.at||(a.dev<b.dev?-1:a.dev>b.dev?1:0)||a.s-b.s);
  const L=new Map(),M=new Map(),I=new Map(),E={},N={},ME={};
  for(const o of all){
    if(o.t==='lead')o.v?L.set(String(o.id),o.v):L.delete(String(o.id));
    else if(o.t==='meet')o.v?M.set(String(o.id),o.v):M.delete(String(o.id));
    else if(o.t==='inv')o.v?I.set(String(o.id),o.v):I.delete(String(o.id));
    else if(o.t==='edit'){const e=E[o.id]=E[o.id]||{};if(o.v===null)delete e[o.f];else e[o.f]=o.v}
    else if(o.t==='note'){(N[o.id]=N[o.id]||new Map()).set(noteId(o.v),Object.assign({},o.v,{at:o.v.at||o.at}))}
    else if(o.t==='noteDel'){if(N[o.id])N[o.id].delete(o.nid)}
    else if(o.t==='meetEdit'){if(o.v===null)delete ME[o.id];else ME[o.id]=o.v}
  }
  Object.entries(N).forEach(([id,m])=>{if(!m.size)return;const e=E[id]=E[id]||{};e.notes=[...m.values()].sort((a,b)=>(a.d||'').localeCompare(b.d||'')||(a.at||0)-(b.at||0))});
  Object.keys(E).forEach(id=>{if(!Object.keys(E[id]).length)delete E[id]});
  return normStore({edits:E,newItems:[...L.values()],newMeetings:[...M.values()],newInvestors:[...I.values()],meetEdits:ME});
}
function allJournals(){return [SYNC.j,...Object.values(SYNC.cache)].filter(Boolean)}

/* ---------- lifecycle ---------- */
function syncRecord(){
  if(!SYNC.on)return;
  const ops=diffStore(SYNC.base,STORE);
  if(!ops.length)return;
  const now=Date.now();ops.forEach(o=>{o.at=now;o.dev=SYNC.dev;o.by=SYNC.user;o.s=++SYNC.j.seq;SYNC.j.ops.push(o)});
  SYNC.base=clone(STORE);syncSaveLocal();syncBadge();
  clearTimeout(SYNC.timer);SYNC.timer=setTimeout(syncRun,1500);
}
function syncApplyRemote(){
  const s=materialize(allJournals());
  STORE=s;EDITS=STORE.edits;SYNC.base=clone(STORE);
  persistStore({fromSync:true});derive();buildFilters();render();
}
async function syncRun(opts={}){
  if(!SYNC.on||SYNC.running)return;
  if(!navigator.onLine){SYNC.err='offline';syncBadge();return}
  SYNC.running=true;syncBadge();
  try{
    // push own journal
    if(pendingOps()||!SYNC.j.fileId){
      const upTo=SYNC.j.seq,body=JSON.stringify({v:1,user:SYNC.user,dev:SYNC.dev,ops:SYNC.j.ops});
      if(!SYNC.j.fileId){
        const bd='mfb'+Date.now(),meta={name:`journal_${(SYNC.user||'user').split('@')[0]}_${SYNC.dev}.json`,parents:[SYNC.folderId],mimeType:'application/json',description:'Sample Advisory Lead and Meeting Tracker change journal for one device. Do not edit.'};
        const mp=`--${bd}\r\nContent-Type: application/json; charset=UTF-8\r\n\r\n${JSON.stringify(meta)}\r\n--${bd}\r\nContent-Type: application/json\r\n\r\n${body}\r\n--${bd}--`;
        const f=await gJSON('POST',`${UPL}?uploadType=multipart&${ALLD}&fields=id`,{headers:{'Content-Type':'multipart/related; boundary='+bd},body:mp});
        SYNC.j.fileId=f.id;
      } else {
        try{await gJSON('PATCH',`${UPL}/${SYNC.j.fileId}?uploadType=media&${ALLD}`,{headers:{'Content-Type':'application/json'},body})}
        catch(e){if(e.status===404){SYNC.j.fileId=null;SYNC.running=false;return syncRun(opts)}throw e}
      }
      SYNC.j.pushed=upTo;syncSaveLocal();
    }
    // pull other journals
    const q=encodeURIComponent(`'${SYNC.folderId}' in parents and trashed=false and name contains 'journal_'`);
    let files=[],pt='';
    do{const r=await gJSON('GET',`${DRV}?q=${q}&fields=nextPageToken,files(id,name,version,modifiedTime)&pageSize=200&${ALLD}&includeItemsFromAllDrives=true${pt?'&pageToken='+pt:''}`);files=files.concat(r.files||[]);pt=r.nextPageToken}while(pt);
    let changed=false;const seen=new Set();
    for(const f of files){
      if(f.id===SYNC.j.fileId)continue;seen.add(f.id);
      const c=SYNC.cache[f.id];
      if(c&&c.version===f.version)continue;
      const r=await gFetch('GET',`${DRV}/${f.id}?alt=media&${ALLD}`);
      if(r.status>=300)continue;
      try{const j=JSON.parse(r.text);SYNC.cache[f.id]={version:f.version,name:f.name,user:j.user,dev:j.dev,ops:j.ops||[],modified:f.modifiedTime};changed=true}catch(e){}
    }
    Object.keys(SYNC.cache).forEach(id=>{if(!seen.has(id)){delete SYNC.cache[id];changed=true}});
    syncSaveLocal();
    if(changed||opts.force)syncApplyRemote();
    SYNC.lastSync=new Date();SYNC.err='';
  }catch(e){SYNC.err=e.needAuth?'auth':e.message;if(!e.needAuth&&opts.loud)toast('Drive sync: '+e.message)}
  finally{SYNC.running=false;syncBadge()}
}
function syncBadge(){
  const el=$('#driveState');if(!el)return;
  if(!SYNC.on){el.style.display='none';return}
  el.style.display='block';const p=pendingOps();
  let t,c='var(--brandInk)';
  if(SYNC.err==='auth'){t='Drive sync paused: click to sign in'+(p?`, ${p} change${p>1?'s':''} waiting`:'');c='var(--red)'}
  else if(SYNC.err==='offline'){t='Offline'+(p?`, ${p} change${p>1?'s':''} waiting`:', up to date locally');c='var(--amber)'}
  else if(SYNC.running)t='Drive sync: syncing';
  else if(SYNC.err){t='Drive sync error: '+SYNC.err;c='var(--red)'}
  else if(p)t=`Drive sync: ${p} change${p>1?'s':''} waiting`;
  else t='Drive sync: up to date'+(SYNC.lastSync?' at '+SYNC.lastSync.toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'}):'');
  el.textContent=t;el.style.color=c;
}
async function syncResumeAuth(){
  if(SYNC.authing)return;SYNC.authing=true;
  try{if(HOST.mode!=='desktop')await webSignIn(false);SYNC.err='';syncRun({loud:true})}
  catch(e){toast(e.message)}
  finally{SYNC.authing=false}
}
async function syncStart({folderLink,clientId}){
  const m=String(folderLink||'').match(/folders\/([\w-]+)/)||String(folderLink||'').match(/[?&]id=([\w-]+)/)||String(folderLink||'').match(/^([\w-]{15,})$/);
  if(!m)throw new Error('Paste the full Google Drive folder link');
  const folderId=m[1];

const MB_RE=/merchant|lead manager|brlm|capital market|investment bank/i, MB_ASSOC_RE=/merchant|\bmb\b|brlm|lead manager/i;
function bankers(){
  const out=[];
  INVESTORS.forEach((c,i)=>{if(c.mb||MB_RE.test([c.type,c.name,c.company].join(' ')))out.push({key:'i'+i,label:bankerFields(c).mbName,saved:!!c.mb,fields:bankerFields(c),inv:c,connected:c.connected||''})});
  // associates recorded as merchant bankers in the Associates sheet, until their firm details are saved
  const assoc=new Map();ITEMS.filter(x=>MB_ASSOC_RE.test(x.associateType||'')).forEach(x=>{if(!assoc.has(x.associate))assoc.set(x.associate,x)});
  assoc.forEach((x,name)=>{if(out.some(o=>o.connected===name))return;
    out.push({key:'a'+name,label:name+' (associate, '+x.associateType+')',saved:false,associate:name,fields:{mbName:'',sebiReg:'',mbCin:'',mbAct:'2013',mbAddress:'',mbSignatory:name,mbDesignation:'',mbEmail:''}})});
  return out.sort((a,b)=>(b.saved-a.saved)||a.label.localeCompare(b.label));
}

function tempPassword(){const cs='ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnopqrstuvwxyz23456789';const r=crypto.getRandomValues(new Uint32Array(12));return [...r].map(n=>cs[n%cs.length]).join('')}
async function saveUsers(users,msg){

}

  v.innerHTML=`<div class="eyebrow">Security</div><div style="display:flex;gap:10px;align-items:flex-start"><h1 style="flex:1">Users and access</h1><button class="btn primary" id="uAdd">+ Add user</button></div>
  <p class="lede">Everyone signs in with their own username and password. Client data in this tracker stays encrypted until a valid sign in. <b>Admins</b> manage users plus automation settings; <b>users</b> work on leads, meetings plus documents.</p>
  ${AUTO.hasSecret?'':'<div class="insight warn" style="margin-bottom:14px"><h4>Save the automation settings first</h4><p>User changes are stored through n8n with the tracker secret. Open Reports and export, Automation, enter the secret and save; then add users here.</p></div>'}
  <div class="twrap"><table class="ut"><thead><tr><th>User</th><th>Role</th><th>Status</th><th>Last change</th><th style="text-align:right">Actions</th></tr></thead><tbody>
  ${users.map(u=>`<tr><td><div class="t">${esc(u.name||u.u)}</div><div class="s">${esc(u.u)}${u.u===SESSION.u?' · you':''}</div></td>
   <td>${pill(u.role==='admin'?'Admin':'User',u.role==='admin'?'p-navy':'p-blue')}</td>
   <td>${u.disabled?pill('Disabled','p-grey'):u.mustChange?pill('Must set password','p-amber'):pill('Active','p-green')}</td>
   <td class="s">${u.updated?esc(new Date(u.updated).toLocaleString('en-IN',{dateStyle:'medium',timeStyle:'short'})):''}</td>
   <td><div class="acts" style="justify-content:flex-end">

    <button class="btn" data-ua="role" data-u="${esc(u.u)}">${u.role==='admin'?'Make user':'Make admin'}</button>
    ${u.u===SESSION.u?'':`<button class="btn" data-ua="toggle" data-u="${esc(u.u)}">${u.disabled?'Enable':'Disable'}</button><button class="btn" data-ua="remove" data-u="${esc(u.u)}">Remove</button>`}
   </div></td></tr>`).join('')}</tbody></table></div>
  <p class="sub" style="margin-top:10px">Removing or disabling someone stops their sign in at once on every browser that can reach n8n. Anyone who kept an old copy of the page could still open that copy with their old password, so for a departing employee also ask the website team to publish a freshly protected tracker, and remove their access to the shared Drive folder.</p>`;
  $('#uAdd').onclick=()=>userForm();
  v.querySelectorAll('[data-ua]').forEach(b=>b.onclick=async()=>{
    const all=SESSION.users(),u=all.find(x=>x.u===b.dataset.u);if(!u)return;
    const a=b.dataset.ua;
    if(a==='reset')return userForm(u);
    if(a==='role'){if(u.u===SESSION.u&&u.role==='admin'&&!confirm('Remove your own admin rights? You will lose access to this page.'))return;
      await saveUsers(all.map(x=>x.u===u.u?Object.assign({},x,{role:x.role==='admin'?'user':'admin',updated:new Date().toISOString()}):x),'Role changed for '+u.u)}
    if(a==='toggle')await saveUsers(all.map(x=>x.u===u.u?Object.assign({},x,{disabled:!x.disabled,updated:new Date().toISOString()}):x),(u.disabled?'Enabled ':'Disabled ')+u.u);
    if(a==='remove'&&confirm('Remove '+(u.name||u.u)+'? They will no longer be able to sign in.'))await saveUsers(all.filter(x=>x.u!==u.u),'Removed '+u.u);
  });
}
function userForm(u){
  const isReset=!!u,tmp=tempPassword();
  openDrawer(`<div class="eyebrow">Users and access</div><h2>${isReset?'Reset password':'Add a user'}</h2>${isReset?`<div class="sub">${esc(u.name||u.u)} (${esc(u.u)})</div>`:''}`,
  `<div class="edit">
   ${isReset?'':fld('Username *',inp('nuUser','','placeholder="e.g. arao" autocapitalize="none"'))+fld('Full name *',inp('nuName','','placeholder="e.g. Asha Rao"'))+fld('Role',`<select id="nuRole"><option value="user">User</option><option value="admin">Admin</option></select>`,1)}
   ${fld('Temporary password *',inp('nuPass',tmp,'autocomplete="off"'),1)}
   <div class="hint">Share the temporary password privately (in person or by phone, not in the same message as the web address). At first sign in they must choose their own password of at least 10 characters.</div>
   <button class="btn primary" id="nuSave">${isReset?'Reset password':'Add user'}</button><button class="btn" id="nuCancel">Cancel</button></div>`);
  $('#nuCancel').onclick=closeDrawer;
  $('#nuSave').onclick=async()=>{
    const v=id=>($(id)||{value:''}).value.trim(),pass=v('#nuPass');
    if(pass.length<10){toast('Use at least 10 characters');return}
    const all=SESSION.users();
    let rec;
    if(isReset)rec=await DFCrypto.makeUser({u:u.u,name:u.name,role:u.role,password:pass,dekRaw:SESSION.dekRaw,mustChange:true,disabled:u.disabled});
    else{const un=v('#nuUser').toLowerCase().replace(/\s+/g,'');
      if(!/^[a-z0-9._-]{2,40}$/.test(un)){toast('Username: 2 to 40 letters, digits, dot, dash or underscore');return}
      if(all.some(x=>x.u===un)){toast('That username already exists');return}
      if(!v('#nuName')){toast('Enter the full name');return}
      rec=await DFCrypto.makeUser({u:un,name:v('#nuName'),role:v('#nuRole'),password:pass,dekRaw:SESSION.dekRaw,mustChange:true})}
    const b=$('#nuSave');b.disabled=true;b.textContent='Saving';
    const ok=await saveUsers(isReset?all.map(x=>x.u===u.u?rec:x):[...all,rec],isReset?'Password reset for '+u.u:'Added '+rec.u);
    if(ok){closeDrawer();go('users')}else{b.disabled=false;b.textContent=isReset?'Reset password':'Add user'}
  };
}
function changePasswordForm(){
  openDrawer(`<div class="eyebrow">Your account</div><h2>Change password</h2><div class="sub">${esc(SESSION.name)} (${esc(SESSION.u)})</div>`,
  `<div class="edit">${fld('Current password',inp('cpOld','','type="password" autocomplete="current-password"'),1)}${fld('New password, at least 10 characters',inp('cpNew','','type="password" autocomplete="new-password"'))}${fld('Repeat new password',inp('cpNew2','','type="password" autocomplete="new-password"'))}
   <button class="btn primary" id="cpSave">Change password</button></div>`);
  $('#cpSave').onclick=async()=>{
    const o=$('#cpOld').value,n=$('#cpNew').value;
    if(n.length<10){toast('Use at least 10 characters');return}
    if(n!==$('#cpNew2').value){toast('The new passwords do not match');return}
    const all=SESSION.users(),me=all.find(x=>x.u===SESSION.u);

    const rec=await DFCrypto.makeUser({u:me.u,name:me.name,role:me.role,password:n,dekRaw:SESSION.dekRaw});
    try{await SESSION.save(all.map(x=>x.u===me.u?rec:x));closeDrawer();toast('Password changed')}catch(e){toast('Not saved: '+e.message)}
  };
}

<script id="gate-js">
/* Sign in gate. Only active in the protected website build (tools/protect.js), where the
   tracker's code plus data are one AES-256-GCM block (#data-enc) and each user holds the
   data key wrapped with a key derived from their own password (PBKDF2 SHA-256). Nothing is
   readable before a valid sign in; unprotected copies (desktop app) skip this entirely. */
(function(){
  "use strict";
  const encEl=document.getElementById('data-enc');
  if(!encEl)return;
  const S=crypto.subtle,te=new TextEncoder(),td=new TextDecoder(),$g=id=>document.getElementById(id);
  const b64=buf=>{const b=new Uint8Array(buf);let s='';for(let i=0;i<b.length;i+=0x8000)s+=String.fromCharCode.apply(null,b.subarray(i,i+0x8000));return btoa(s)};
  const unb64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
  const ITER=600000;
  async function kek(pass,salt,it){const base=await S.importKey('raw',te.encode(pass),'PBKDF2',false,['deriveKey']);
    return S.deriveKey({name:'PBKDF2',salt,iterations:it,hash:'SHA-256'},base,{name:'AES-GCM',length:256},false,['encrypt','decrypt'])}
  const aesKey=raw=>S.importKey('raw',raw,'AES-GCM',false,['encrypt','decrypt']);
  async function enc(key,u8){const iv=crypto.getRandomValues(new Uint8Array(12));return {iv:b64(iv),ct:b64(await S.encrypt({name:'AES-GCM',iv},key,u8))}}
  async function dec(key,o){return new Uint8Array(await S.decrypt({name:'AES-GCM',iv:unb64(o.iv)},key,unb64(o.ct)))}
  async function makeUser(o){const salt=crypto.getRandomValues(new Uint8Array(16));const w=await enc(await kek(o.password,salt,ITER),o.dekRaw);
    return {u:String(o.u).trim().toLowerCase(),name:o.name||o.u,role:o.role==='admin'?'admin':'user',it:ITER,salt:b64(salt),iv:w.iv,wk:w.ct,mustChange:!!o.mustChange,disabled:!!o.disabled,updated:new Date().toISOString()}}
  async function unwrap(rec,pass){return dec(await kek(pass,unb64(rec.salt),rec.it||ITER),{iv:rec.iv,ct:rec.wk})}
  window.DFCrypto={b64,unb64,aesKey,enc,dec,makeUser,unwrap,
    encJSON:(key,obj)=>enc(key,te.encode(JSON.stringify(obj))),decJSON:async(key,o)=>JSON.parse(td.decode(await dec(key,o)))};

  document.body.classList.add('locked');
  const G=$g('mfGate');G.style.display='grid';
  try{const A=JSON.parse($g('assets').textContent);if(A.logo)$g('gLogo').src='data:image/jpeg;base64,'+A.logo}catch(e){}
  const boot=JSON.parse($g('users-boot').textContent);
  const api=String(boot.api||'').replace(/\/+$/,'');
  let LIST={users:boot.users||[],cfg:null,src:'built in'};
  const CACHE='df_users_cache';

  async function loadList(){
    try{const c=JSON.parse(localStorage.getItem(CACHE)||'null');if(c&&Array.isArray(c.users)&&c.users.length)LIST=Object.assign(c,{src:'saved on this device'})}catch(e){}
    try{const ctl=new AbortController();const t=setTimeout(()=>ctl.abort(),8000);
      const r=await fetch(api+'/webhook/df-users',{cache:'no-store',signal:ctl.signal});clearTimeout(t);
      if(r.ok){const j=await r.json();if(j&&Array.isArray(j.users)&&j.users.length){LIST={users:j.users,cfg:j.cfg||null,src:'server'};try{localStorage.setItem(CACHE,JSON.stringify(LIST))}catch(e){}}}
    }catch(e){}
  }
  const err=m=>{$g('gErr').textContent=m||''};
  const btn=$g('gBtn');
  const busy=(on,label)=>{btn.disabled=on;btn.textContent=label};

  async function unlock(dekRaw,rec){
    const key=await aesKey(dekRaw);
    const payload=JSON.parse(td.decode(await dec(key,JSON.parse(encEl.textContent))));
    let cfg=null;if(LIST.cfg){try{cfg=await window.DFCrypto.decJSON(key,LIST.cfg)}catch(e){}}
    window.__MF_DATA=JSON.parse(payload.data);
    const M=window.DF_SESSION={u:rec.u,name:rec.name||rec.u,role:rec.role,key,dekRaw,api,cfg,
      users:()=>LIST.users.slice(),
      async save(users){
        const c=M.cfg||{};if(!c.secret)throw new Error('Save the automation secret first (Reports and export, Automation)');
        const r=await fetch(api+'/webhook/df-users-save',{method:'POST',headers:{'Content-Type':'application/json',[c.headerName||'X-Sample Advisory-Secret']:c.secret},body:JSON.stringify({v:1,users,cfg:LIST.cfg,savedBy:M.u})});
        if(!r.ok){const t=await r.text().catch(()=>'');throw new Error('n8n answered '+r.status+(t?': '+t.slice(0,160):''))}
        LIST.users=users;LIST.src='server';try{localStorage.setItem(CACHE,JSON.stringify(LIST))}catch(e){}
      },
      async saveCfg(cfgObj){LIST.cfg=await window.DFCrypto.encJSON(key,cfgObj);M.cfg=cfgObj;return M.save(LIST.users)},
      signOut(){try{sessionStorage.removeItem('df_sess')}catch(e){}location.reload()}
    };
    try{sessionStorage.setItem('df_sess',JSON.stringify({u:rec.u,dek:b64(dekRaw)}))}catch(e){}
    G.style.display='none';document.body.classList.remove('locked');
    const s=document.createElement('script');s.textContent=payload.app;document.body.appendChild(s);
  }

  let pendingChange=null;
  $g('gForm').addEventListener('submit',async e=>{
    e.preventDefault();err('');
    const u=$g('gUser').value.trim().toLowerCase(),p=$g('gPass').value;
    if(pendingChange){
      const n1=$g('gNew1').value,n2=$g('gNew2').value;
      if(n1.length<10)return err('Use at least 10 characters for the new password');
      if(n1!==n2)return err('The two new passwords do not match');
      if(n1===p)return err('Choose a password different from the temporary one');
      busy(true,'Saving');
      const {rec,dek}=pendingChange;
      const nrec=await window.DFCrypto.makeUser({u:rec.u,name:rec.name,role:rec.role,password:n1,dekRaw:dek});
      const users=LIST.users.map(x=>x.u===rec.u?nrec:x);
      await unlock(dek,nrec);
      try{await window.DF_SESSION.save(users)}catch(ex){LIST.users=users;window.DF_PENDING_SAVE='Your new password is not saved to the server yet: '+ex.message}
      return;
    }
    busy(true,'Checking');
    const rec=LIST.users.find(x=>x.u===u&&!x.disabled);
    let dek=null;
    if(rec){try{dek=await unwrap(rec,p)}catch(ex){}}
    if(!dek){await new Promise(r=>setTimeout(r,700));busy(false,'Sign in');return err('Incorrect username or password')}
    if(rec.mustChange){pendingChange={rec,dek};$g('gNew').style.display='grid';$g('gMsg').textContent='Welcome, '+(rec.name||rec.u)+'. Set your own password to continue.';
      $g('gUser').readOnly=true;$g('gPass').readOnly=true;busy(false,'Set password and continue');$g('gNew1').focus();return}
    busy(true,'Opening');
    try{await unlock(dek,rec)}catch(ex){busy(false,'Sign in');err('This copy of the tracker could not be opened: '+ex.message)}
  });

  (async()=>{
    busy(true,'Loading');
    await loadList();
    try{const s=JSON.parse(sessionStorage.getItem('df_sess')||'null');
      if(s){const rec=LIST.users.find(x=>x.u===s.u&&!x.disabled);if(rec&&!rec.mustChange){await unlock(unb64(s.dek),rec);return}sessionStorage.removeItem('df_sess')}}catch(e){try{sessionStorage.removeItem('df_sess')}catch(x){}}
    busy(false,'Sign in');$g('gUser').focus();
  })();
})();
</script>
