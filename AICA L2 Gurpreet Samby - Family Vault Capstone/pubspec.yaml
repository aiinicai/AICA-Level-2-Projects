name: family_vault
description: "Family Vault - a secure, offline-first, zero-knowledge password manager for Android and Windows."
publish_to: "none"

# version+build. The build number is bumped by CI for release tags.
version: 0.5.0+5

environment:
  # Raised from >=3.4.0 when sodium was added: the resolved lockfile reports a
  # floor of 3.13.0, so the old constraint promised support this project does
  # not have.
  sdk: ">=3.13.0 <4.0.0"

# Dependencies are added one per commit and confirmed green in CI before the
# next, because this project is authored in an environment that cannot resolve
# or compile them. See docs/decisions-and-risks.md, decision D-002.
dependencies:
  flutter:
    sdk: flutter

  # Annotations only (@immutable). Maintained by the Dart team.
  meta: ^1.15.0

  # HMAC-SHA1/256/512 for the RFC 6238 authenticator. Maintained by the Dart
  # team. TOTP itself is not cryptography - it is a counter and a truncation
  # around an HMAC - but the HMAC is, so it comes from a library.
  crypto: ^3.0.0

  # Where to put the vault file on each platform. First-party Flutter plugin.
  path_provider: ^2.1.0

  # libsodium bindings: Argon2id and XChaCha20-Poly1305.
  # Argon2id lives in libsodium's "sumo" interface, reached through
  # package:sodium/sodium_sumo.dart. Version verified by CI run 42620302996 on
  # both Android and Windows. See decision D-003.
  sodium: ^4.1.2+1

  # Open and save dialogs, for backup files. First-party Flutter plugin.
  # Android implements openFile and getDirectoryPath but NOT getSaveLocation,
  # verified by reading the resolved package in CI run 42790776305, which is
  # why saving on Android goes through the share sheet instead.
  file_selector: ^1.1.0

  # The Android share sheet, the only way to hand a file to another app there.
  # Version 13 moved from Share.shareXFiles to SharePlus.instance.share, so
  # the constraint is deliberately not relaxed below it.
  share_plus: ^13.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ">=4.0.0 <8.0.0"

flutter:
  uses-material-design: true
