<style>
/* ===================== TOKENS ===================== */
:root{
  --bg:#F5F7F8;
  --surface:#FFFFFF;
  --surface-2:#EEF1F3;
  --border:#DBE1E6;
  --text:#132433;
  --text-dim:#5B6B78;
  --primary:#0E3856;
  --primary-2:#124C74;
  --accent:#0F8B8D;
  --accent-2:#0C6F70;
  --success:#1E7E45;
  --success-bg:#E6F4EA;
  --danger:#B3261E;
  --danger-bg:#FBEAE9;
  --info:#8A5A00;
  --info-bg:#FCF1DC;
  --shadow: 0 1px 2px rgba(19,36,51,0.06), 0 2px 8px rgba(19,36,51,0.05);
  --radius:10px;
  --font-ui:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  --font-num:'IBM Plex Mono',ui-monospace,SFMono-Regular,Menlo,monospace;
}
[data-theme="dark"]{
  --bg:#0B1420;
  --surface:#101B2A;
  --surface-2:#16233470;
  --surface-2:#16243570;
  --border:#233346;
  --text:#E7EEF3;
  --text-dim:#93A5B6;
  --primary:#1C4F73;
  --primary-2:#2A6690;
  --accent:#2CB5B4;
  --accent-2:#1F8F8E;
  --success:#3FBE72;
  --success-bg:#123522;
  --danger:#F0665F;
  --danger-bg:#3A1917;
  --info:#E0B04A;
  --info-bg:#3A2E11;
  --shadow: 0 1px 2px rgba(0,0,0,0.4), 0 4px 14px rgba(0,0,0,0.35);
}
@import url('fonts/local-fonts.css');
*{box-sizing:border-box;}
html,body{margin:0;padding:0;height:100%;}
body{
  font-family:var(--font-ui);
  background:var(--bg);
  color:var(--text);
  font-size:14px;
  -webkit-font-smoothing:antialiased;
}
button{font-family:inherit;cursor:pointer;}
input,select,textarea{font-family:inherit;font-size:14px;color:var(--text);background:var(--surface);border:1px solid var(--border);border-radius:6px;padding:8px 10px;}
input:focus,select:focus,textarea:focus{outline:2px solid var(--accent);outline-offset:1px;}
input[type=number]::-webkit-outer-spin-button,
input[type=number]::-webkit-inner-spin-button{-webkit-appearance:none;margin:0;}
input[type=number]{-moz-appearance:textfield;appearance:textfield;}
table{border-collapse:collapse;width:100%;}
.num{font-family:var(--font-num);font-variant-numeric:tabular-nums;}
a{color:var(--accent-2);}

/* ===================== LAYOUT ===================== */
#app{display:flex;min-height:100vh;}
#sidebar{
  width:230px;flex-shrink:0;background:var(--primary);
  color:#fff;display:flex;flex-direction:column;
  position:sticky;top:0;height:100vh;overflow-y:auto;
}
#sidebar .brand{padding:20px 18px 14px;border-bottom:1px solid rgba(255,255,255,0.12);}
#sidebar .brand .name{font-weight:700;font-size:16px;letter-spacing:0.2px;}
#sidebar .brand .sub{font-size:11px;opacity:0.65;margin-top:2px;}
#navlist{list-style:none;margin:0;padding:8px;flex:1;}
#navlist .navgroup{font-size:10px;text-transform:uppercase;letter-spacing:0.08em;opacity:0.55;padding:14px 12px 4px;}
#navlist li a{
  display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:8px;
  color:rgba(255,255,255,0.82);text-decoration:none;font-size:13px;font-weight:500;
  margin-bottom:2px;
}
#navlist li a:hover{background:rgba(255,255,255,0.08);color:#fff;}
#navlist li a.active{background:var(--accent);color:#04201f;font-weight:600;}
#sidebar .icon{width:18px;text-align:center;font-size:14px;}

#main-wrap{flex:1;min-width:0;display:flex;flex-direction:column;}
#topbar{
  background:var(--surface);border-bottom:1px solid var(--border);
  padding:10px 22px;display:flex;align-items:center;gap:14px;position:sticky;top:0;z-index:20;
  box-shadow:var(--shadow);
}
#topbar .page-title{font-weight:700;font-size:17px;margin-right:auto;}
#topbar .date-field label{font-size:11px;color:var(--text-dim);display:block;}
#menuBtn{display:none;background:none;border:none;color:var(--text);font-size:20px;}
#content{padding:22px;max-width:1400px;width:100%;margin:0 auto;}

.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);padding:18px;margin-bottom:18px;}
.card h2{margin:0 0 14px;font-size:15px;font-weight:700;color:var(--primary-2);display:flex;align-items:center;gap:8px;}
[data-theme="dark"] .card h2{color:var(--accent);}
.card h3{font-size:13px;font-weight:600;margin:0 0 8px;color:var(--text-dim);}
.grid{display:grid;gap:14px;}
.grid.cols-2{grid-template-columns:repeat(2,1fr);}
.grid.cols-3{grid-template-columns:repeat(3,1fr);}
.grid.cols-4{grid-template-columns:repeat(4,1fr);}
.grid.cols-5{grid-template-columns:repeat(5,1fr);}
@media(max-width:1000px){.grid.cols-4,.grid.cols-5,.grid.cols-3{grid-template-columns:repeat(2,1fr);}}
@media(max-width:600px){.grid.cols-2,.grid.cols-3,.grid.cols-4,.grid.cols-5{grid-template-columns:1fr;}}

.field label{display:block;font-size:11px;color:var(--text-dim);margin-bottom:4px;font-weight:600;letter-spacing:.02em;text-transform:uppercase;}
.field input,.field select{width:100%;}
.btn{background:var(--primary);color:#fff;border:none;border-radius:7px;padding:9px 16px;font-weight:600;font-size:13px;}
.btn:hover{background:var(--primary-2);}
.btn.accent{background:var(--accent);color:#022;}
.btn.accent:hover{background:var(--accent-2);color:#fff;}
.btn.danger{background:var(--danger);color:#fff;}
.btn.ghost{background:transparent;border:1px solid var(--border);color:var(--text);}
.btn.small{padding:5px 10px;font-size:12px;border-radius:6px;}
.btn:disabled{opacity:.5;cursor:not-allowed;}
.row-actions{display:flex;gap:6px;}

table.data th{
  text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.04em;color:var(--text-dim);
  background:var(--surface-2);padding:9px 10px;border-bottom:1px solid var(--border);position:sticky;top:0;
}
table.data th.right{text-align:right;}
table.data th.center{text-align:center;}
table.data td{padding:8px 10px;border-bottom:1px solid var(--border);font-size:13px;}
table.data tr:last-child td{border-bottom:none;}
table.data tfoot td{font-weight:700;background:var(--surface-2);border-top:2px solid var(--border);}
.table-wrap{overflow-x:auto;max-height:60vh;overflow-y:auto;border-radius:8px;border:1px solid var(--border);}
.table-wrap table.data th{top:0;}

.badge{display:inline-block;padding:2px 8px;border-radius:20px;font-size:11px;font-weight:700;}
.badge.pos{background:var(--success-bg);color:var(--success);}
.badge.neg{background:var(--danger-bg);color:var(--danger);}
.badge.info{background:var(--info-bg);color:var(--info);}

.kpi{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:16px;box-shadow:var(--shadow);}
.kpi .lbl{font-size:11px;color:var(--text-dim);text-transform:uppercase;letter-spacing:.05em;font-weight:600;}
.kpi .val{font-family:var(--font-num);font-size:22px;font-weight:600;margin-top:6px;}
.kpi .sub{font-size:11px;color:var(--text-dim);margin-top:4px;}

.pill-toggle{display:inline-flex;background:var(--surface-2);border-radius:20px;padding:3px;}
.pill-toggle button{border:none;background:transparent;padding:6px 14px;border-radius:20px;font-size:12px;font-weight:600;color:var(--text-dim);}
.pill-toggle button.active{background:var(--primary);color:#fff;}

.modal-overlay{position:fixed;inset:0;background:rgba(10,20,30,0.55);display:flex;align-items:center;justify-content:center;z-index:100;padding:20px;}
.modal{background:var(--surface);border-radius:14px;max-width:640px;width:100%;max-height:90vh;overflow-y:auto;padding:26px;box-shadow:0 12px 40px rgba(0,0,0,0.3);}
.modal h2{margin-top:0;}
.wizard-steps{display:flex;gap:6px;margin-bottom:18px;}
.wizard-steps div{flex:1;height:4px;border-radius:3px;background:var(--surface-2);}
.wizard-steps div.done{background:var(--accent);}

.toast{position:fixed;bottom:20px;right:20px;background:var(--primary);color:#fff;padding:12px 18px;border-radius:8px;box-shadow:var(--shadow);z-index:200;font-size:13px;font-weight:600;animation:fadein .2s ease;}
@keyframes fadein{from{opacity:0;transform:translateY(8px);}to{opacity:1;transform:translateY(0);}}

.helptext{font-size:12px;color:var(--text-dim);margin-top:-6px;margin-bottom:10px;}
.divider{height:1px;background:var(--border);margin:16px 0;}
.flex{display:flex;align-items:center;}
.flex.gap{gap:10px;}
.flex.between{justify-content:space-between;}
.mt{margin-top:14px;}
.center{text-align:center;}
.right{text-align:right;}
.small-note{font-size:11px;color:var(--text-dim);}
input[type=checkbox]{width:auto;}
.checkline{display:flex;align-items:center;gap:8px;padding:6px 0;}
.tag-product{display:inline-block;padding:1px 7px;border-radius:5px;font-size:11px;background:var(--surface-2);color:var(--text-dim);font-weight:600;}

.print-header{display:none;}
.invoice-box{position:relative;overflow:hidden;border:1px solid #ccc;border-radius:8px;padding:20px;background:#fff;color:#111;}
.invoice-content{position:relative;z-index:1;color:#111;background:#fff;}
.invoice-content,.invoice-content *{color:#111!important;}
.invoice-content table{width:100%;}
.invoice-content table.data th{border:1px solid #999;padding:3px 6px;background:#dde3e8!important;color:#111!important;font-size:11.5px;}
.invoice-content table.data td{border:1px solid #999;padding:3px 6px;background:#fff!important;color:#111!important;font-size:11.5px;line-height:1.25;}
.invoice-content .small-note,.invoice-content .helptext{color:#444!important;}
.invoice-content .badge{color:#111!important;background:#dde3e8!important;}
.invoice-content .table-wrap{max-height:none;overflow:visible;border-radius:0;border:none;}
.invoice-content .mt{margin-top:8px;}
.invoice-content hr.invoice-hr{margin:6px 0;}
.invoice-hr{border:none;border-top:1px solid #999;margin:10px 0;}
@media print{
  .invoice-box{border:1px solid #000;}
}
@media print{
  #sidebar,#topbar,.no-print{display:none!important;}
  #content{padding:0;max-width:none;}
  body{background:#fff;}
  .card{box-shadow:none;border:1px solid #000;}
  .print-header{display:flex!important;align-items:center;justify-content:space-between;border-bottom:2px solid #000;padding-bottom:8px;margin-bottom:14px;}
  .print-header img{max-height:44px;max-width:140px;}
  .print-header-side{display:flex;align-items:center;gap:8px;font-size:11px;font-weight:700;min-width:140px;}
  .print-header-center{font-size:15px;font-weight:700;text-align:center;flex:1;}
}

@media(max-width:860px){
  #sidebar{position:fixed;left:0;top:0;height:100vh;transform:translateX(-100%);transition:transform .2s;z-index:99;}
  #sidebar.open{transform:translateX(0);}
  #menuBtn{display:block;}
  #content{padding:14px;}
}
</style>

<body>
<div id="app">
  <aside id="sidebar">
    <div class="brand">
      <div id="companyLogoWrap" style="display:none;margin-bottom:8px;"><img id="companyLogoImg" style="max-height:36px;max-width:100%;border-radius:4px;background:#fff;padding:2px;"></div>
      <div class="name">⛽ FuelDesk</div>
      <div class="sub" id="brandSub">Petrol Pump Manager</div>
    </div>
    <ul id="navlist"></ul>
    <div style="padding:12px 18px;font-size:10px;opacity:.5;">v1.0 · Local Data Only</div>
  </aside>
  <div id="main-wrap">
    <div id="topbar">
      <button id="menuBtn">☰</button>
      <div class="page-title" id="pageTitle">Dashboard</div>
      <div class="date-field">
        <label>Working Date</label>
        <input type="date" id="globalDate">
      </div>
      <button class="btn ghost small" id="themeToggle">🌓</button>
      <div id="dealerLogoWrap" style="display:none;"><img id="dealerLogoImg" style="max-height:34px;max-width:110px;border-radius:4px;"></div>
    </div>
    <div id="content"></div>
  </div>
</div>
<div id="modalRoot"></div>
<script>
/* =====================================================================
   PETROL PUMP DAILY MANAGEMENT — single file app
   ===================================================================== */

/* ---------------------- Persistence layer ---------------------- */
const LS_KEYS = ['settings','products','nozzles','customers','banks','bowsers','dailyEntries','receipts','expenses','payments','deposits'];
let DB = {};

/* ---------------------- Python bridge (desktop build) ---------------------- */
/* window.__PP_BOOT_DATA__ is injected by the Python host BEFORE this page's
   scripts run, containing the full DB object read from SQLite. pyBridge is
   used only for writes (save/remove) — reads happen once at boot via the
   injected object, so the rest of the app's synchronous logic is unchanged. */
let pyBridge = null;
if (typeof qt !== 'undefined' && qt.webChannelTransport) {
  new QWebChannel(qt.webChannelTransport, function(channel){
    pyBridge = channel.objects.bridge;
  });
}

function defaultDB(){
  return {
    settings: { setupDone:false, month:null, year:null, theme:'light', companyName:'', openingCash:0, startDate:null,
      companyAddress:'', companyPhone:'', companyEmail:'', companyGST:'', companyVAT:'',
      bankName:'', bankAccountNo:'', bankIFSC:'', signatureImage:'' },
    products: [],
    nozzles: [],
    customers: [],
    banks: [],
    bowsers: [],
    dailyEntries: {},
    receipts: {},
    expenses: {},
    payments: {},
    deposits: {}
  };
}

function loadDB(){
  const d = defaultDB();
  const boot = (typeof window.__PP_BOOT_DATA__ !== 'undefined' && window.__PP_BOOT_DATA__) ? window.__PP_BOOT_DATA__ : {};
  LS_KEYS.forEach(k=>{
    if(boot[k]!==undefined) d[k] = boot[k];
  });
  DB = d;
  bumpDateIndexVersion();
  migrateDB();
}
function migrateDB(){
  // nozzles: add active-window fields for meter-change tracking
  (DB.nozzles||[]).forEach(n=>{
    if(n.createdDate===undefined) n.createdDate = null;
    if(n.deactivatedDate===undefined) n.deactivatedDate = null;
    if(n.active===undefined) n.active = true;
  });
  // customers: migrate single vehicleNo -> vehicles[] array; ensure discount rate field
  (DB.customers||[]).forEach(c=>{
    if(!Array.isArray(c.vehicles)){
      c.vehicles = c.vehicleNo ? [c.vehicleNo] : [];
    }
    if(c.discountType===undefined) c.discountType = 'pct'; // 'pct' (% of sale amount) or 'perLitre' (₹ per litre)
    if(c.isDigitalPaymentMethod===undefined) c.isDigitalPaymentMethod = false;
    if(c.discountRate===undefined) c.discountRate = (c.discountRatePct!==undefined) ? (Number(c.discountRatePct)||0) : 0;
    delete c.discountRatePct;
    // Billing / Tax Invoice details
    if(c.address===undefined) c.address = '';
    if(c.pan===undefined) c.pan = '';
    if(c.gstNumber===undefined) c.gstNumber = '';
    if(c.vatNumber===undefined) c.vatNumber = '';
    if(c.contactPerson===undefined) c.contactPerson = '';
    if(c.contactNumber===undefined) c.contactNumber = '';
    if(c.billingPeriodicity===undefined) c.billingPeriodicity = 'monthly'; // daily|weekly|10days|15days|monthly
    if(c.billingName===undefined) c.billingName = ''; // optional override name shown on Tax Invoice only
    if(c.tdsApplicable===undefined) c.tdsApplicable = false;
    if(c.tdsRate===undefined) c.tdsRate = 0.10; // percent, applied to total credit sale net of discount
  });
  // Company / billing master details (for the Tax Invoice header, footer & bank details)
  if(DB.settings.companyAddress===undefined) DB.settings.companyAddress = '';
  if(DB.settings.companyPhone===undefined) DB.settings.companyPhone = '';
  if(DB.settings.companyEmail===undefined) DB.settings.companyEmail = '';
  if(DB.settings.companyGST===undefined) DB.settings.companyGST = '';
  if(DB.settings.companyVAT===undefined) DB.settings.companyVAT = '';
  if(DB.settings.bankName===undefined) DB.settings.bankName = '';
  if(DB.settings.bankAccountNo===undefined) DB.settings.bankAccountNo = '';
  if(DB.settings.bankIFSC===undefined) DB.settings.bankIFSC = '';
  if(DB.settings.signatureImage===undefined) DB.settings.signatureImage = '';
  // Bank Master
  if(!Array.isArray(DB.banks)) DB.banks = [];
  // Bowser Master
  if(!Array.isArray(DB.bowsers)) DB.bowsers = [];
  function ensureBankId(name){
    const nm = (name||'').trim();
    if(!nm) return '';
    let b = DB.banks.find(x=>x.name.toLowerCase()===nm.toLowerCase());
    if(!b){ b = {id:uid(), name:nm}; DB.banks.push(b); }
    return b.id;
  }
  // expense categories: user-extensible list of heads, stored in settings
  if(!Array.isArray(DB.settings.expenseCategories) || !DB.settings.expenseCategories.length){
    DB.settings.expenseCategories = ['Salary','Electricity','Freight','Maintenance','Stationery','Tea Expenses','Discount','Miscellaneous'];
  }
  if(!DB.settings.expenseCategories.includes('Discount')){
    DB.settings.expenseCategories.push('Discount');
  }
  // expenses: ensure customerId field exists (used only for the 'Discount' category)
  Object.keys(DB.expenses||{}).forEach(dateStr=>{
    DB.expenses[dateStr] = (DB.expenses[dateStr]||[]).map(ex=>{
      if(ex.customerId===undefined) ex.customerId = '';
      return ex;
    });
  });
  // receipt income heads & cash sub-modes: user-extensible lists
  if(!Array.isArray(DB.settings.receiptHeads) || !DB.settings.receiptHeads.length){
    DB.settings.receiptHeads = ['Previous Dues Collected','Miscellaneous Income','Digital Settlement Received','Other Receipt'];
  }
  if(!Array.isArray(DB.settings.cashSubModes) || !DB.settings.cashSubModes.length){
    DB.settings.cashSubModes = ['Cash','Card','Fleet Card'];
  }
  // migrate legacy receipt entries (old shape: {type,customerId,particular,amount,remarks}) to new shape
  Object.keys(DB.receipts||{}).forEach(dateStr=>{
    DB.receipts[dateStr] = (DB.receipts[dateStr]||[]).map(r=>{
      if(!r.mode){
        const legacyLabels = {previous_dues:'Previous Dues Collected', misc_income:'Miscellaneous Income', digital_settlement:'Digital Settlement Received', other:'Other Receipt'};
        r = {
          type: legacyLabels[r.type] || r.type || 'Other Receipt',
          payerName: r.particular || '',
          customerId: r.customerId || '',
          amount: r.amount || 0,
          mode: 'cash',
          subMode: 'Cash',
          bank: '',
          remarks: r.remarks || ''
        };
      }
      // legacy combined "bank" mode (Bank/Digital direct) is kept as mode 'bank' under the new 4-way split
      if(r.bankId===undefined) r.bankId = r.bank ? ensureBankId(r.bank) : '';
      delete r.bank;
      return r;
    });
  });
  // migrate deposits: free-text bank name -> bankId reference
  Object.keys(DB.deposits||{}).forEach(dateStr=>{
    DB.deposits[dateStr] = (DB.deposits[dateStr]||[]).map(dep=>{
      if(dep.bankId===undefined) dep.bankId = dep.bank ? ensureBankId(dep.bank) : '';
      delete dep.bank;
      return dep;
    });
  });
  // migrate payments: ensure bankId field exists
  Object.keys(DB.payments||{}).forEach(dateStr=>{
    DB.payments[dateStr] = (DB.payments[dateStr]||[]).map(p=>{
      if(p.bankId===undefined) p.bankId = '';
      if(p.party===undefined) p.party = '';
      return p;
    });
  });
  // Lubricant sales: quantitative (item-wise qty/rate) detail replaced by a single day total,
  // captured on the Testing & Dip Recon. page. Sum any legacy itemised entries into that total.
  Object.keys(DB.dailyEntries||{}).forEach(dateStr=>{
    const e = DB.dailyEntries[dateStr];
    if(Array.isArray(e.lube)){
      const sum = e.lube.reduce((s,l)=>s+(Number(l.amount)||0),0);
      e.lubeSalesAmount = (Number(e.lubeSalesAmount)||0) + sum;
      delete e.lube;
    }
    if(e.lubeSalesAmount===undefined) e.lubeSalesAmount = 0;
    if(!Array.isArray(e.bowserPurchase)) e.bowserPurchase = [];
    if(!Array.isArray(e.bowserSale)) e.bowserSale = [];
    if(!e.bowserDip || typeof e.bowserDip!=='object') e.bowserDip = {};
  });
  (DB.bowsers||[]).forEach(b=>{
    if(b.openingStockQty===undefined) b.openingStockQty = 0;
  });
  // Keep customers and expense categories alphabetically sorted at the source, so every list,
  // dropdown, and report throughout the app is sorted automatically.
  if(Array.isArray(DB.customers)) DB.customers.sort((a,b)=>(a.name||'').localeCompare(b.name||''));
  if(Array.isArray(DB.settings.expenseCategories)) DB.settings.expenseCategories.sort((a,b)=>a.localeCompare(b));
}
function saveKey(k){
  if(pyBridge){ pyBridge.save_key(k, JSON.stringify(DB[k])); }
}
function saveAll(){ LS_KEYS.forEach(saveKey); }

/* ---------------------- Utilities ---------------------- */
function uid(){ return Math.random().toString(36).slice(2,10)+Date.now().toString(36).slice(-4); }
function fmt(n){
  n = Number(n)||0;
  return n.toLocaleString('en-IN',{minimumFractionDigits:2,maximumFractionDigits:2});
}
function fmtQty(n){
  n = Number(n)||0;
  return n.toLocaleString('en-IN',{minimumFractionDigits:2,maximumFractionDigits:2});
}
// Converts a rupee amount to words using the Indian numbering system (Crore/Lakh/Thousand),
// e.g. 123456.75 -> "One Lakh Twenty Three Thousand Four Hundred Fifty Six Rupees and Seventy Five Paise Only"
function periodicityLabel(v){
  return {daily:'Daily', weekly:'Weekly', '10days':'10 Days', '15days':'15 Days', monthly:'Monthly'}[v] || 'Monthly';
}
function amountInWords(num){
  const ones = ['','One','Two','Three','Four','Five','Six','Seven','Eight','Nine','Ten','Eleven','Twelve','Thirteen','Fourteen','Fifteen','Sixteen','Seventeen','Eighteen','Nineteen'];
  const tens = ['','','Twenty','Thirty','Forty','Fifty','Sixty','Seventy','Eighty','Ninety'];
  function twoDigits(n){
    if(n<20) return ones[n];
    return tens[Math.floor(n/10)] + (n%10? ' '+ones[n%10] : '');
  }
  function threeDigits(n){
    if(n<100) return twoDigits(n);
    return ones[Math.floor(n/100)]+' Hundred'+(n%100? ' '+twoDigits(n%100) : '');
  }
  function inWords(n){
    if(n===0) return 'Zero';
    let parts = [];
    const crore = Math.floor(n/10000000); n%=10000000;
    const lakh = Math.floor(n/100000); n%=100000;
    const thousand = Math.floor(n/1000); n%=1000;
    const hundred = n;
    if(crore) parts.push(threeDigits(crore)+' Crore');
    if(lakh) parts.push(threeDigits(lakh)+' Lakh');
    if(thousand) parts.push(threeDigits(thousand)+' Thousand');
    if(hundred) parts.push(threeDigits(hundred));
    return parts.join(' ');
  }
  num = Number(num)||0;
  const rupees = Math.floor(num);
  const paise = Math.round((num-rupees)*100);
  let out = inWords(rupees)+' Rupees';
  if(paise>0) out += ' and '+inWords(paise)+' Paise';
  return out+' Only';
}

/* ---------------------- Date-chain helpers (carry-forward) ---------------------- */
// ---- Date-index cache ----
// sortedEntryDates()/allEntryDates() used to rebuild + re-sort their arrays from scratch on
// EVERY call. Since getOpeningStock/getOpeningMeter/getSellingPrice each call prevEntryDate()
// (which calls sortedEntryDates()) and some of them recurse backwards through prior days when
// no dip/price was entered that day, a single report that walks a full year of days can trigger
// this thousands of times — turning an O(n log n) sort into an O(n^2 log n) blowup as history
// grows. Fixed by caching the sorted result behind a version counter that's only bumped at the
// handful of places a new date-key actually gets added to one of the five collections; every
// other call is then just a cheap integer comparison, not a rebuild.
let _dateIndexVersion = 0;
function bumpDateIndexVersion(){ _dateIndexVersion++; }
let _sortedEntryDatesCache = null, _sortedEntryDatesCacheVer = -1;
function sortedEntryDates(){
  if(_sortedEntryDatesCache && _sortedEntryDatesCacheVer===_dateIndexVersion) return _sortedEntryDatesCache;
  _sortedEntryDatesCache = Object.keys(DB.dailyEntries).sort();
  _sortedEntryDatesCacheVer = _dateIndexVersion;
  return _sortedEntryDatesCache;
}
let _allEntryDatesCache = null, _allEntryDatesCacheVer = -1;
function allEntryDates(){
  if(_allEntryDatesCache && _allEntryDatesCacheVer===_dateIndexVersion) return _allEntryDatesCache;
  const set = new Set();
  ['dailyEntries','receipts','expenses','payments','deposits'].forEach(k=>{
    Object.keys(DB[k]||{}).forEach(d=>set.add(d));
  });
  _allEntryDatesCache = Array.from(set).sort();
  _allEntryDatesCacheVer = _dateIndexVersion;
  return _allEntryDatesCache;
}
function prevEntryDate(dateStr){
  const dates = sortedEntryDates().filter(d=>d < dateStr);
  return dates.length? dates[dates.length-1] : null;
}
// Finds the most recent date that actually has recorded activity — distinct from simply
// taking the last key in DB.dailyEntries, since ensureEntry() lazily creates an empty shell
// for any date the user merely navigates to (e.g. via the date picker), even if nothing was
// ever saved for it. Used to default the app to "where the user left off" on open, rather
// than an arbitrary fixed date.
function lastDateWithData(){
  const dates = sortedEntryDates();
  for(let i=dates.length-1;i>=0;i--){
    const e = DB.dailyEntries[dates[i]];
    if(!e) continue;
    const hasMeter = e.meters && Object.values(e.meters).some(m=>m && (m.closing!=null || m.opening!=null));
    const hasPurchases = e.purchases && e.purchases.length>0;
    const hasCredit = e.credit && e.credit.length>0;
    const hasBowserPurchase = e.bowserPurchase && e.bowserPurchase.length>0;
    const hasBowserSale = e.bowserSale && e.bowserSale.length>0;
    const hasLube = e.lubeSalesAmount && e.lubeSalesAmount!==0;
    const hasPrice = e.price && Object.keys(e.price).length>0;
    const hasTesting = e.testing && Object.values(e.testing).some(v=>v);
    const hasDip = e.dip && Object.keys(e.dip).length>0;
    if(hasMeter||hasPurchases||hasCredit||hasBowserPurchase||hasBowserSale||hasLube||hasPrice||hasTesting||hasDip){
      return dates[i];
    }
  }
  // Nothing meaningful in dailyEntries — check the other date-keyed collections too, in
  // case cash receipts/expenses/payments/deposits exist for a day with no fuel activity.
  const other = allEntryDates();
  for(let i=other.length-1;i>=0;i--){
    const d = other[i];
    if((DB.receipts[d]&&DB.receipts[d].length) || (DB.expenses[d]&&DB.expenses[d].length) ||
       (DB.payments[d]&&DB.payments[d].length) || (DB.deposits[d]&&DB.deposits[d].length)){
      return d;
    }
  }
  return null;
}
function ensureEntry(dateStr){
  if(!DB.dailyEntries[dateStr]){
    DB.dailyEntries[dateStr] = { purchases:[], meters:{}, testing:{}, dip:{}, price:{}, priceSlabs:{}, lubeSalesAmount:0, credit:[], bowserPurchase:[], bowserSale:[], bowserDip:{}, openingCashOverride:null };
    bumpDateIndexVersion();
  }
  const e = DB.dailyEntries[dateStr];
  if(!e.purchases) e.purchases=[];
  if(!e.meters) e.meters={};
  if(!e.testing) e.testing={};
  if(!e.dip) e.dip={};
  if(!e.price) e.price={};
  if(!e.priceSlabs) e.priceSlabs={};
  if(e.lubeSalesAmount===undefined) e.lubeSalesAmount=0;
  if(!e.credit) e.credit=[];
  if(!e.bowserPurchase) e.bowserPurchase=[];
  if(!e.bowserSale) e.bowserSale=[];
  if(!e.bowserDip) e.bowserDip={};
  return e;
}

function getOpeningMeter(nozzleId, dateStr){
  const pd = prevEntryDate(dateStr);

    const pe = getEntry(pd);
    if(pe && pe.meters && pe.meters[nozzleId] && pe.meters[nozzleId].closing != null){
      return Number(pe.meters[nozzleId].closing);

}

function getSellingPrice(pid, dateStr){

  if(!e) return 0;
  const direct = (e.credit||[]).filter(c=>c.customerId===customerId).reduce((s,c)=>s+(Number(c.qty)||0),0);
  const bowser = (e.bowserSale||[]).filter(b=>b.mode==='credit' && b.customerId===customerId).reduce((s,b)=>s+(Number(b.qty)||0),0);
  return direct + bowser;
}
// Pump Credit = direct Credit Sales page entries only (excludes Bowser-to-Party credit).
function customerPumpCreditForDay(customerId, dateStr){
  const e = getEntry(dateStr);
  if(!e) return 0;
  return (e.credit||[]).filter(c=>c.customerId===customerId).reduce((s,c)=>s+(Number(c.amount)||0),0);
}
// Bowser Credit = Bowser-to-Party credit sales only (amount and litres), excludes Pump Credit.
function customerBowserCreditForDay(customerId, dateStr){
  const e = getEntry(dateStr);
  if(!e) return 0;
  return (e.bowserSale||[]).filter(b=>b.mode==='credit' && b.customerId===customerId).reduce((s,b)=>s+(Number(b.amount)||0),0);
}
function customerBowserCreditQtyForDay(customerId, dateStr){
  const e = getEntry(dateStr);
  if(!e) return 0;
  return (e.bowserSale||[]).filter(b=>b.mode==='credit' && b.customerId===customerId).reduce((s,b)=>s+(Number(b.qty)||0),0);
}
function customerReceiptsForDay(customerId, dateStr){
  return (DB.receipts[dateStr]||[]).filter(r=>r.customerId===customerId).reduce((s,r)=>s+(Number(r.amount)||0),0);
}
// Distinct mode/sub-mode labels used across a customer's receipts that day (joined for display).
function customerReceiptModesForDay(customerId, dateStr){
  const list = (DB.receipts[dateStr]||[]).filter(r=>r.customerId===customerId);
  const labels = list.map(r=> r.mode==='cash' ? (r.subMode||'Cash') : (r.bankId? bankName(r.bankId) : (RECEIPT_MODE_LABEL[r.mode]||r.mode)));
  return Array.from(new Set(labels)).join(', ');
}
function discountLabel(cust){
  if(!cust) return '';
  return cust.discountType==='perLitre' ? ('₹'+fmt(cust.discountRate||0)+'/L') : ((cust.discountRate||0)+'% of sale');
}
function autoDiscountForCustomer(customerId, dateStr){
  const cust = DB.customers.find(c=>c.id===customerId);
  if(!cust || !(Number(cust.discountRate)>0)) return 0;
  if(cust.discountType==='perLitre'){
    const qty = customerCreditQtyForDay(customerId, dateStr);
    return Math.round(qty * Number(cust.discountRate) * 100)/100;
  }
  const sale = customerCreditSalesForDay(customerId, dateStr);
  return Math.round(sale * (Number(cust.discountRate)/100) * 100)/100;
}
function autoDiscountRows(dateStr){
  return DB.customers.filter(c=>Number(c.discountRate)>0).map(c=>({
    customerId: c.id,
    amount: autoDiscountForCustomer(c.id, dateStr)
  })).filter(r=>r.amount>0);
}
function autoDiscountTotal(dateStr){
  return autoDiscountRows(dateStr).reduce((s,r)=>s+r.amount,0);
}
function manualDiscountTotal(dateStr){
  const list = DB.expenses[dateStr]||[];
  return list.filter(ex=>ex.category==='Discount').reduce((s,ex)=>s+(Number(ex.amount)||0),0);
}
function discountTotal(dateStr){
  return manualDiscountTotal(dateStr) + autoDiscountTotal(dateStr);
}
// TDS: mirrors Discount's checkbox+rate mechanism. Applied to the day's TOTAL credit sales to
// this customer (Pump Credit + Bowser Credit combined) net of that day's auto-Discount — verified
// against real ledger data: e.g. Bowser Credit 285766.21 with Discount 1453.99 auto-calculated at
// 0.10% gives TDS = (285766.21-1453.99) x 0.10% = 284.31222 exactly. Using Pump Credit alone would
// wrongly give zero TDS for any customer whose credit sales are entirely via Bowser.
function tdsLabel(cust){
  if(!cust) return '';
  return (cust.tdsRate||0)+'% of Credit Sale (net of Discount)';
}
function autoTDSForCustomer(customerId, dateStr){
  const cust = DB.customers.find(c=>c.id===customerId);
  if(!cust || !cust.tdsApplicable || !(Number(cust.tdsRate)>0)) return 0;
  const totalCredit = customerCreditSalesForDay(customerId, dateStr); // Pump + Bowser combined
  const discount = autoDiscountForCustomer(customerId, dateStr);
  const netBase = Math.max(0, totalCredit - discount);
  return Math.round(netBase * (Number(cust.tdsRate)/100) * 100)/100;
}
function autoTDSRows(dateStr){
  return DB.customers.filter(c=>c.tdsApplicable && Number(c.tdsRate)>0).map(c=>({
    customerId: c.id,
    amount: autoTDSForCustomer(c.id, dateStr)
  })).filter(r=>r.amount>0);
}
function autoTDSTotal(dateStr){
  return autoTDSRows(dateStr).reduce((s,r)=>s+r.amount,0);
}
function expensesTotal(dateStr){
  const list = DB.expenses[dateStr]||[];
  const manual = list.reduce((s,r)=>s+(Number(r.amount)||0),0);
  return manual + autoDiscountTotal(dateStr);
}
// Expenses that actually reduce cash-in-hand — excludes Discount (manual or auto), since a
// discount is a book adjustment against the customer's account, not a cash payment.
function cashExpensesTotal(dateStr){
  const list = DB.expenses[dateStr]||[];
  return list.filter(r=>r.category!=='Discount').reduce((s,r)=>s+(Number(r.amount)||0),0);
}
function paymentsTotal(dateStr){
  const list = DB.payments[dateStr]||[];
  return list.reduce((s,r)=>s+(Number(r.amount)||0),0);
}
function depositsTotal(dateStr){
  const list = DB.deposits[dateStr]||[];
  return list.reduce((s,r)=>s+(Number(r.amount)||0),0);
}
// Fuel dispensed for testing/calibration is not sold, so its value (at the day's selling price)
// is treated as a cash expense — it reduces cash-in-hand the same way a paid expense would.
function testingCashExpense(dateStr){
  return fuelProducts().reduce((s,p)=>s+testingQty(p.id,dateStr)*getSellingPrice(p.id,dateStr),0);
}
function getOpeningCash(dateStr){
  const e = getEntry(dateStr);
  if(e && e.openingCashOverride!=null) return Number(e.openingCashOverride);
  const pd = prevEntryDate(dateStr);
  if(pd) return closingCash(pd);
  return Number(DB.settings.openingCash)||0;
}
function totalCashAvailable(dateStr){
  return getOpeningCash(dateStr) + cashSalesAmount(dateStr) + receiptsCashTotal(dateStr) + bowserSaleCashAmount(dateStr);
}
function closingCash(dateStr){
  return totalCashAvailable(dateStr) - cashExpensesTotal(dateStr) - paymentsTotal(dateStr) - depositsTotal(dateStr) - testingCashExpense(dateStr);
}

function daysInMonthArr(mk){
  const [y,m] = mk.split('-').map(Number);
  const last = new Date(y, m, 0).getDate();
  const out = [];
  for(let d=1; d<=last; d++){
    out.push(mk+'-'+String(d).padStart(2,'0'));
  }
  return out;
}
// Returns the 12 month-keys (April first, March last) of the Indian fiscal year containing mk.
function fiscalYearMonths(mk){
  const [y,m] = mk.split('-').map(Number);
  const fyStartYear = m>=4 ? y : y-1;
  const months = [];
  for(let i=0;i<12;i++){
    let yy = fyStartYear, mm = 4+i;
    if(mm>12){ mm -= 12; yy += 1; }
    months.push(yy+'-'+String(mm).padStart(2,'0'));
  }
  return months;
}
function customerOpeningBalanceOn(custId, dateStr){
  const rows = customerLedger(custId).filter(r=>r.date && r.date < dateStr);
  const cust = DB.customers.find(c=>c.id===custId);
  return rows.length? rows[rows.length-1].balance : (cust? Number(cust.openingBalance)||0 : 0);
}

/* customer ledger */
function customerLedger(customerId){
  // returns chronological list of {date, particulars, invoice, invoicePaid, discount, tds, paymentRecd, balance}
  const rows = [];
  const cust = DB.customers.find(c=>c.id===customerId);
  let balance = cust? Number(cust.openingBalance)||0 : 0;
  if(cust && cust.openingBalance){
    rows.push({date: DB.settings.startDate||'', particulars:'Opening Balance', invoice:'', invoicePaid:'', discount:'', tds:'', paymentRecd:'', balance});
  }
  const dates = allEntryDates();
  dates.forEach(d=>{
    const e = getEntry(d);
    // Gather this date's credit-sale-type entries (Pump + Bowser) in order — the day's auto
    // Discount and TDS get attached to the LAST such entry, so the running balance stays
    // correct even when the customer has several sales on the same day.
    const saleEntries = [];
    if(e){
      (e.credit||[]).filter(c=>c.customerId===customerId).forEach(c=>{
        saleEntries.push({particulars:'Credit Sale - '+(productById(c.productId)?.name||''), invoice:c.invoice||'', amount:Number(c.amount)||0});
      });
      (e.bowserSale||[]).filter(b=>b.mode==='credit' && b.customerId===customerId).forEach(b=>{
        saleEntries.push({particulars:'Bowser Credit Sale - '+(bowserName(b.bowserId)||''), invoice:b.remarks||'', amount:Number(b.amount)||0});
      });
    }
    const dayAutoDiscount = autoDiscountForCustomer(customerId, d);
    const dayAutoTds = autoTDSForCustomer(customerId, d);
    saleEntries.forEach((se,i)=>{
      const isLast = i===saleEntries.length-1;
      const disc = isLast? dayAutoDiscount : 0;
      const tds = isLast? dayAutoTds : 0;
      balance += se.amount - disc - tds;
      rows.push({date:d, particulars:se.particulars, invoice:se.invoice, invoicePaid:se.amount, discount:disc||'', tds:tds||'', paymentRecd:'', balance});
    });
    // Manual Discount expense entries aren't tied to a specific sale, so they get their own row.
    (DB.expenses[d]||[]).filter(ex=>ex.category==='Discount' && ex.customerId===customerId).forEach(ex=>{
      balance -= Number(ex.amount)||0;
      rows.push({date:d, particulars:'Discount Given'+(ex.remarks?(' - '+ex.remarks):''), invoice:'', invoicePaid:'', discount:Number(ex.amount)||0, tds:'', paymentRecd:'', balance});
    });
    (DB.receipts[d]||[]).filter(r=>r.customerId===customerId).forEach(r=>{
      balance -= Number(r.amount)||0;
      rows.push({date:d, particulars:'Payment Received - '+(r.payerName||r.type||''), invoice:'', invoicePaid:'', discount:'', tds:'', paymentRecd:Number(r.amount)||0, balance});
    });
  });
  return rows;
}
function customerOutstanding(customerId){
  const rows = customerLedger(customerId);
  return rows.length? rows[rows.length-1].balance : (DB.customers.find(c=>c.id===customerId)?.openingBalance||0);
}

RENDERERS.dip = function(){
  const d = currentDate;
  const e = ensureEntry(d);
  return `
  <div class="card">
    <h2>Testing Litres & Dip Stock Reconciliation — ${fmtDateHuman(d)}</h2>
    <div class="table-wrap"><table class="data">
      <thead><tr><th>Product</th><th class="right">Opening Stock</th><th class="right">Purchases</th><th class="right">Meter Sale</th><th class="right">Testing (L)</th><th class="right">Expected Stock</th><th class="right">Actual Dip</th><th class="right">Variance</th><th>Status</th></tr></thead>
      <tbody>
      ${fuelProducts().map(p=>{
        const opening = getOpeningStock(p.id,d);
        const purch = purchaseQty(p.id,d);
        const sale = productMeterSale(p.id,d);
        const test = e.testing[p.id]!=null? e.testing[p.id] : 0;
        const expected = opening+purch-sale-test;
        const dip = e.dip[p.id]!=null? e.dip[p.id]:'';
        const variance = dip!==''? Number(dip)-expected : null;
        return `<tr>
          <td>${esc(p.name)}</td>
          <td class="right num">${fmtQty(opening)}</td>
          <td class="right num">${fmtQty(purch)}</td>
          <td class="right num">${fmtQty(sale)}</td>
          <td class="right"><input type="number" step="0.01" style="width:90px;text-align:right" value="${test}" data-testing="${p.id}"></td>
          <td class="right num">${fmtQty(expected)}</td>
          <td class="right"><input type="number" step="0.01" style="width:100px;text-align:right" value="${dip}" data-dip="${p.id}"></td>
          <td class="right num" style="color:${variance==null?'inherit':(variance<0?'var(--danger)':variance>0?'var(--success)':'inherit')}">${variance!=null?fmtQty(variance):'—'}</td>
          <td>${variance==null?'':(variance<0?'<span class="badge neg">Shortage</span>':variance>0?'<span class="badge pos">Excess</span>':'<span class="badge info">Matched</span>')}</td>
        </tr>`;
      }).join('')}
      </tbody>
    </table></div>
  </div>
  <div class="card">

  </div>
  ${DB.bowsers.length ? `
  <div class="card">
    <h2>Bowser Stock Dip — ${fmtDateHuman(d)}</h2>
    <p class="helptext">Physical HSD quantity remaining in each bowser today (optional). Leave blank to rely on the expected (calculated) quantity.</p>

      <thead><tr><th>Bowser</th><th class="right">Opening (L)</th><th class="right">Purchase (L)</th><th class="right">Sale (L)</th><th class="right">Expected (L)</th><th class="right">Actual Dip (L)</th><th class="right">Variance</th></tr></thead>
      <tbody>
      ${DB.bowsers.map(b=>{
        const opening = bowserOpeningStock(b.id,d);
        const purch = bowserPurchaseQty(b.id,d);
        const sale = bowserSaleQty(b.id,d);
        const expected = bowserExpectedStock(b.id,d);

          <td>${esc(b.name)}</td>
          <td class="right num">${fmtQty(opening)}</td>
          <td class="right num">${fmtQty(purch)}</td>
          <td class="right num">${fmtQty(sale)}</td>
          <td class="right num">${fmtQty(expected)}</td>

function recomputeLastSlabQty(entry, pid, dateStr){
  const arr = entry.priceSlabs[pid];
  if(!arr || arr.length<2) return;
  const total = productMeterSale(pid, dateStr);
  let sum=0;
  for(let i=0;i<arr.length-1;i++) sum += Number(arr[i].qty)||0;
  arr[arr.length-1].qty = Math.max(0, total-sum);
}

/* ================= MONTHLY SUMMARY ================= */
function monthKey(dateStr){ return dateStr.slice(0,7); }
function monthLabel(mk){
  const [y,m] = mk.split('-').map(Number);
  return new Date(y, m-1, 1).toLocaleDateString('en-IN',{month:'long',year:'numeric'});
}
function availableMonthKeys(){
  const set = new Set();
  ['dailyEntries','receipts','expenses','payments','deposits'].forEach(k=>{
    Object.keys(DB[k]||{}).forEach(d=>set.add(monthKey(d)));
  });
  return Array.from(set).sort();
}
function buildMonthlyBackup(mk){
  const pick = (obj)=>{
    const out = {};
    Object.keys(obj||{}).forEach(d=>{ if(monthKey(d)===mk) out[d]=obj[d]; });
    return out;
  };
  return {
    _backupType: 'monthly',
    _month: mk,
    _monthLabel: monthLabel(mk),
    _company: DB.settings.companyName||'',
    _exportedAt: new Date().toISOString(),
    settings: DB.settings,
    products: DB.products,
    nozzles: DB.nozzles,
    customers: DB.customers,
    banks: DB.banks,
    bowsers: DB.bowsers,
    dailyEntries: pick(DB.dailyEntries),
    receipts: pick(DB.receipts),
    expenses: pick(DB.expenses),
    payments: pick(DB.payments),
    deposits: pick(DB.deposits)
  };
}
// Shared restore logic for both a full backup and a monthly backup, used by both the
// Backup & Restore page and the first-run Welcome screen's "Import Backup" option.
// opts: { skipConfirm, firstRun, onDone(success) }
function restoreBackupFile(file, opts){
  opts = opts || {};
  const reader = new FileReader();
  reader.onload = ()=> applyBackupJSON(reader.result, opts);
  reader.readAsText(file);
}
// Core restore logic, shared by file-based import (Backup & Restore page and the
// first-run Welcome screen) — both just need to get the raw backup JSON text to this function.
function applyBackupJSON(jsonText, opts){
  opts = opts || {};
  let data;
  try{ data = JSON.parse(jsonText); }
  catch(e){ toast('Invalid backup data'); if(opts.onDone) opts.onDone(false); return; }
  if(data._backupType==='monthly'){
    const label = data._monthLabel || data._month || 'this month';
    if(!opts.skipConfirm && !confirmDialog('This is a monthly backup for '+label+'. It will fill in (overwrite) transactions for that month only — other months and your master data (Customers, Products, Banks, Bowsers) are left untouched. Continue?')){
      if(opts.onDone) opts.onDone(false); return;
    }
    Object.assign(DB.dailyEntries, data.dailyEntries||{});
    Object.assign(DB.receipts, data.receipts||{});
    Object.assign(DB.expenses, data.expenses||{});
    Object.assign(DB.payments, data.payments||{});
    Object.assign(DB.deposits, data.deposits||{});
    bumpDateIndexVersion();
    if(opts.firstRun){
      // fresh install has no master data yet — bring those in too, from the backup's snapshot
      ['settings','products','nozzles','customers','banks','bowsers'].forEach(k=>{ if(data[k]!==undefined) DB[k]=data[k]; });
      DB.settings.setupDone = true;
    }
    migrateDB();
    saveAll();
    toast('Monthly backup restored — '+label);
    if(opts.onDone) opts.onDone(true);
  } else {
    if(!opts.skipConfirm && !confirmDialog('This will overwrite ALL existing data on this device. Continue?')){
      if(opts.onDone) opts.onDone(false); return;
    }
    LS_KEYS.forEach(k=>{ if(data[k]!==undefined) DB[k]=data[k]; });
    bumpDateIndexVersion();
    if(opts.firstRun) DB.settings.setupDone = true;
    migrateDB();
    saveAll();
    toast('Backup restored');
    if(opts.onDone) opts.onDone(true);
  }
}

/* ================= MONTHLY RECEIPTS, PAYMENTS & EXPENSES REPORT ================= */
// Receipts are pivoted by Customer Master (fixed columns, same fixed-column style as Expense heads).
// Receipts not linked to any customer (e.g. Miscellaneous Income) fall into a trailing
// "Other / No Customer" column so the columns always reconcile to the Total.
function receiptCustomerColumns(){
  const cols = DB.customers.map(c=>({key:c.id, label:c.name}));
  cols.push({key:'__other__', label:'Other / No Customer'});
  return cols;
}
function receiptAmountByCustomer(dateStr, mode, colKey){
  const list = (DB.receipts[dateStr]||[]).filter(r=> mode==='cash' ? r.mode==='cash' : r.mode!=='cash');
  const filtered = colKey==='__other__' ? list.filter(r=>!r.customerId) : list.filter(r=>r.customerId===colKey);
  return filtered.reduce((s,r)=>s+(Number(r.amount)||0),0);
}
RENDERERS.rpereport = function(){
  const d = currentDate;
  const mk = monthKey(d);
  const dates = sortedEntryDates().filter(x=>monthKey(x)===mk);
  const custCols = receiptCustomerColumns();
  const payList = dates.flatMap(dt=>(DB.payments[dt]||[]));
  const payCols = Array.from(new Set(payList.map(paymentPartyLabel))).map(p=>({key:p, label:p}));
  const expCols = (DB.settings.expenseCategories || []).map(c=>({key:c, label:c}));

  function pivotTable(title, helptext, dates, columns, amountFn, rowTotalFn){
    if(!dates.length || !columns.length){
      return `<div class="card"><h3>${title}</h3>${helptext?`<p class="helptext">${helptext}</p>`:''}<p class="small-note">No entries this month.</p></div>`;
    }
    return `
  <div class="card">
    <h3>${title}</h3>
    ${helptext?`<p class="helptext">${helptext}</p>`:''}
    <div class="table-wrap"><table class="data">
      <thead><tr><th>Date</th>${columns.map(col=>`<th class="right">${esc(col.label)}</th>`).join('')}<th class="right">Total</th></tr></thead>
      <tbody>
      ${dates.map(x=>`<tr><td>${fmtDateHuman(x)}</td>${columns.map(col=>`<td class="right num">${fmt(amountFn(x,col.key))}</td>`).join('')}<td class="right num">${fmt(rowTotalFn(x))}</td></tr>`).join('')}
      </tbody>
      <tfoot><tr style="font-weight:700;"><td>Total</td>${columns.map(col=>`<td class="right num">${fmt(dates.reduce((s,x)=>s+amountFn(x,col.key),0))}</td>`).join('')}<td class="right num">${fmt(dates.reduce((s,x)=>s+rowTotalFn(x),0))}</td></tr></tfoot>
    </table></div>
  </div>`;
  }

  return `
  <div class="card no-print flex between">
    <h2 style="margin:0;">Monthly Receipts, Payments & Expenses — ${new Date(d+'T00:00:00').toLocaleDateString('en-IN',{month:'long',year:'numeric'})}</h2>
    <div class="flex gap"><button class="btn ghost small" onclick="window.print()">🖨 Print</button>
    <button class="btn accent small" id="exportRPEBtn">Export to Excel</button></div>
  </div>
  ${pivotTable(
    'Cash Receipts — Date-wise, Customer-wise',
    '',
    dates, custCols,
    (x,key)=>receiptAmountByCustomer(x,'cash',key),
    (x)=>receiptsModeTotal(x,'cash')
  )}
  ${pivotTable(
    'Non-Cash Receipts (Bank / Digital / IOCL) — Date-wise, Customer-wise',
    '',
    dates, custCols,
    (x,key)=>receiptAmountByCustomer(x,'noncash',key),
    (x)=>receiptsBankTotal(x)
  )}
  ${pivotTable(
    'Payments — Date-wise, Party-wise',
    '',
    dates, payCols,
    (x,key)=>(DB.payments[x]||[]).filter(pm=>paymentPartyLabel(pm)===key).reduce((s,pm)=>s+(Number(pm.amount)||0),0),
    (x)=>paymentsTotal(x)
  )}
  ${pivotTable(
    'Expenses — Date-wise',
    'The "Discount" column includes both manually-booked Discount expenses and the auto-calculated discount on customers with a standing Discount Rate.',
    dates, expCols,
    (x,key)=>{
      const manual = (DB.expenses[x]||[]).filter(e=>e.category===key).reduce((s,e)=>s+(Number(e.amount)||0),0);
      return key==='Discount' ? manual+autoDiscountTotal(x) : manual;
    },
    (x)=>expensesTotal(x)
  )}`;
};

function renderPartyBill(custId, billNo, billDate, from, to, billingMode, showSummary){
  const cust = DB.customers.find(c=>c.id===custId);
  if(!cust) return '<div class="card"><p class="small-note">Select a party to generate an invoice.</p></div>';
  const dates = sortedEntryDates().filter(x=>(!from||x>=from) && (!to||x<=to));
  let rows = [];
  dates.forEach(dt=>{
    const e = getEntry(dt);
    (e.credit||[]).filter(c=>c.customerId===custId).forEach(c=>{
      rows.push({date:dt, invoice:c.invoice||'', vehicle:c.vehicle||'', product:productById(c.productId)?.name||'', qty:Number(c.qty)||0, amount:Number(c.amount)||0});
    });
    (e.bowserSale||[]).filter(b=>b.mode==='credit' && b.customerId===custId).forEach(b=>{
      rows.push({date:dt, invoice:b.remarks||'', vehicle:'', product:'HSD (via '+bowserName(b.bowserId)+')', qty:Number(b.qty)||0, amount:Number(b.amount)||0});
    });
  });
  if(billingMode==='daily'){
    const byDate = {};
    rows.forEach(r=>{
      if(!byDate[r.date]) byDate[r.date] = {date:r.date, invoice:'', vehicle:'', product:'Daily Credit Sales', qty:0, amount:0};
      byDate[r.date].qty += r.qty;
      byDate[r.date].amount += r.amount;
    });
    rows = Object.keys(byDate).sort().map(dt=>byDate[dt]);
  }
  const total = rows.reduce((s,r)=>s+r.amount,0);
  let discount = 0, tds = 0;
  dates.forEach(dt=>{
    const manualDisc = (DB.expenses[dt]||[]).filter(ex=>ex.category==='Discount' && ex.customerId===custId).reduce((s,ex)=>s+(Number(ex.amount)||0),0);
    discount += manualDisc + autoDiscountForCustomer(custId, dt);
    tds += autoTDSForCustomer(custId, dt);
  });
  const netTotal = total - discount - tds;
  // Account summary for the billing period (auto-computed from the customer ledger; user-editable).
  const ledgerRows = customerLedger(custId).filter(r=>r.date && (!from||r.date>=from) && (!to||r.date<=to));
  const receiptsAuto = ledgerRows.reduce((a,r)=>a+(Number(r.paymentRecd)||0),0);
  const openingAuto = from ? customerOpeningBalanceOn(custId, from) : (Number(cust.openingBalance)||0);
  const r2 = v=>Math.round((Number(v)||0)*100)/100;
  const summary = {show: showSummary!==false, opening:r2(openingAuto), purchase:r2(total), discount:r2(discount), tds:r2(tds), receipts:r2(receiptsAuto),
    closing:r2(openingAuto+total-discount-tds-receiptsAuto), closingManual:false};
  summary.auto = {opening:summary.opening, purchase:summary.purchase, discount:summary.discount, tds:summary.tds, receipts:summary.receipts, closing:summary.closing};
  lastPartyBill = {cust, billNo, billDate, from, to, rows, total, discount, tds, netTotal, billingMode, summary};
  const s = DB.settings;
  return `
  <div class="card">
    <div class="flex between no-print">
      <h2 style="margin:0;">Tax Invoice Preview</h2>
      <div class="flex gap">
        <button class="btn ghost small" onclick="window.print()">🖨 Print</button>
        <button class="btn accent small" id="exportPartyBillPdfBtn">⬇ Export to PDF</button>
        <button class="btn accent small" id="exportPartyBillBtn">Export to Excel</button>
      </div>
    </div>
    <p class="helptext no-print">${billingMode==='daily'?'Daily Sale Bill — one consolidated line per day\'s credit sales. ':'Transaction-wise Sale Bill — every credit sale listed individually. '}${rows.length>1?('This preview shows all '+rows.length+' line items in one scrollable view. The PDF export splits them across full A4 pages automatically, with page numbers and carried-forward totals.'):''}</p>
    <div class="no-print" id="pbSummaryPanel" style="border:1px dashed var(--border,#bbb);border-radius:8px;padding:10px 12px;margin:10px 0;">
      <label style="display:flex;align-items:center;gap:8px;font-weight:600;"><input type="checkbox" id="pbs_show" ${summary.show?'checked':''} style="width:auto;"> Show account summary on the invoice</label>
      <div class="grid cols-3 mt">
        <div class="field"><label>Opening Balance</label><input type="number" step="0.01" id="pbs_open" value="${summary.opening}"></div>
        <div class="field"><label>Purchase (gross credit sales)</label><input type="number" step="0.01" id="pbs_purchase" value="${summary.purchase}"></div>
        <div class="field"><label>Discount</label><input type="number" step="0.01" id="pbs_discount" value="${summary.discount}"></div>
        <div class="field"><label>TDS (shown on invoice only if not zero)</label><input type="number" step="0.01" id="pbs_tds" value="${summary.tds}"></div>
        <div class="field"><label>Receipts</label><input type="number" step="0.01" id="pbs_receipts" value="${summary.receipts}"></div>
        <div class="field"><label>Closing Balance</label><input type="number" step="0.01" id="pbs_closing" value="${summary.closing}"></div>
      </div>

      <div class="field"><label>Company Address</label><input id="set_companyaddress" value="${esc(DB.settings.companyAddress||'')}"></div>
      <div class="field"><label>Telephone Number</label><input id="set_companyphone" value="${esc(DB.settings.companyPhone||'')}"></div>
      <div class="field"><label>Email</label><input id="set_companyemail" value="${esc(DB.settings.companyEmail||'')}"></div>
    </div>
    <div class="grid cols-3 mt">
      <div class="field"><label>GST Number</label><input id="set_companygst" value="${esc(DB.settings.companyGST||'')}"></div>
      <div class="field"><label>VAT Number</label><input id="set_companyvat" value="${esc(DB.settings.companyVAT||'')}"></div>
      <div class="field"><label>Bank Name</label><input id="set_bankname" value="${esc(DB.settings.bankName||'')}"></div>
    </div>
    <div class="grid cols-3 mt">
      <div class="field"><label>Bank Account Number</label><input id="set_bankaccountno" value="${esc(DB.settings.bankAccountNo||'')}"></div>
      <div class="field"><label>IFSC Code</label><input id="set_bankifsc" value="${esc(DB.settings.bankIFSC||'')}"></div>
      <div class="field"><label>Bill Signatory's Signature (image)</label><input type="file" accept="image/*" id="set_signature">
        ${DB.settings.signatureImage?'<div class="small-note mt">Signature uploaded ✓</div>':''}
      </div>
    </div>
    <button class="btn accent mt" id="saveBillingMastersBtn">Save Billing Masters</button>
  </div>`;
};

/* ---------------------- Event binding for dynamic content ---------------------- */
function bindPageEvents(){
  const c = document.getElementById('content');

  // PURCHASES
  const addPurchaseBtn = document.getElementById('addPurchaseBtn');
  if(addPurchaseBtn) addPurchaseBtn.onclick = ()=>{
    const invoice = document.getElementById('p_inv').value;
    const supplier = document.getElementById('p_sup').value;
    const remarks = document.getElementById('p_rem').value;
    const e = ensureEntry(currentDate);
    let addedCount = 0;
    c.querySelectorAll('[data-purch-qty]').forEach(qtyInp=>{
      const qty = parseFloat(qtyInp.value);
      if(!(qty>0)) return;
      const pid = qtyInp.dataset.purchQty;
      const amtInp = c.querySelector('[data-purch-amt="'+pid+'"]');
      const amount = parseFloat(amtInp.value)||0;
      e.purchases.push({invoice, supplier, productId:pid, qty, amount, remarks});
      addedCount++;
    });
    if(!addedCount){ toast('Enter at least one product quantity'); return; }
    saveKey('dailyEntries'); render(); toast(addedCount+' purchase line'+(addedCount>1?'s':'')+' added');
  };
  c.querySelectorAll('[data-del-purchase]').forEach(b=>b.onclick=()=>{
    const e = ensureEntry(currentDate); e.purchases.splice(+b.dataset.delPurchase,1);
    saveKey('dailyEntries'); render();
  });

  // METERS
  function saveMeterReadingsFromDOM(){
    const e = ensureEntry(currentDate);
    let valid = true;
    c.querySelectorAll('[data-nozzle-closing]').forEach(inp=>{
      const nid = inp.dataset.nozzleClosing;
      const openInp = c.querySelector(`[data-nozzle-opening="${nid}"]`);
      const opening = parseFloat(openInp.value)||0;
      const closingVal = inp.value===''? null : parseFloat(inp.value);
      if(closingVal!=null && closingVal<opening){ valid=false; toast('Closing cannot be less than opening for a nozzle'); }
      e.meters[nid] = {opening, closing: closingVal};
    });
    if(!valid) return false;
    saveKey('dailyEntries');
    return true;
  }
  const saveMetersBtn = document.getElementById('saveMetersBtn');
  if(saveMetersBtn) saveMetersBtn.onclick = ()=>{
    if(saveMeterReadingsFromDOM()){ render(); toast('Meter readings saved'); }
  };
  c.querySelectorAll('[data-replace-meter]').forEach(b=>b.onclick=()=>{
    const nozzleId = b.dataset.replaceMeter;
    const closingInp = c.querySelector(`[data-nozzle-closing="${nozzleId}"]`);
    if(!closingInp || closingInp.value===''){ toast("Enter today's closing reading for this meter first"); return; }
    if(!saveMeterReadingsFromDOM()) return;
    openReplaceMeterModal(nozzleId);
  });

  // DIP (also captures the day's total Lubricant Sales Amount)
  const saveDipBtn = document.getElementById('saveDipBtn');
  if(saveDipBtn) saveDipBtn.onclick = ()=>{
    const e = ensureEntry(currentDate);
    c.querySelectorAll('[data-testing]').forEach(inp=>{
      e.testing[inp.dataset.testing] = inp.value===''?0:parseFloat(inp.value);
    });
    c.querySelectorAll('[data-dip]').forEach(inp=>{
      const pid = inp.dataset.dip;
      if(inp.value===''){ delete e.dip[pid]; return; }
      const val = parseFloat(inp.value);
      if(val<0){ toast('Dip stock cannot be negative'); return; }
      e.dip[pid] = val;
    });
    const lubeInp = document.getElementById('lube_amt');
    if(lubeInp){
      const lv = parseFloat(lubeInp.value);
      e.lubeSalesAmount = (!isNaN(lv) && lv>=0) ? lv : 0;
    }
    c.querySelectorAll('[data-bowser-dip]').forEach(inp=>{
      const bid = inp.dataset.bowserDip;
      if(inp.value===''){ delete e.bowserDip[bid]; return; }
      const val = parseFloat(inp.value);
      if(val<0){ toast('Bowser dip stock cannot be negative'); return; }
      e.bowserDip[bid] = val;
    });
    saveKey('dailyEntries'); render();
    toast('Testing, dip & lubricant sales saved');
  };

  // FUEL SALES / PRICE
  const savePriceBtn = document.getElementById('savePriceBtn');
  if(savePriceBtn) savePriceBtn.onclick = ()=>{
    const e = ensureEntry(currentDate);
    c.querySelectorAll('[data-price]').forEach(inp=>{
      e.price[inp.dataset.price] = inp.value===''?0:parseFloat(inp.value);
    });
    saveKey('dailyEntries'); render(); toast('Selling prices saved');
  };
  // Rates typed in the Selling Price boxes are only stored on "Save Selling Prices".
  // The slab buttons below redraw the screen, so first keep any rate the user has typed
  // but not yet saved (only boxes whose value was changed), otherwise it would be lost.
  function keepTypedPrices(e){
    c.querySelectorAll('[data-price]').forEach(inp=>{
      if(inp.value !== inp.defaultValue) e.price[inp.dataset.price] = inp.value===''?0:parseFloat(inp.value);
    });
  }
  c.querySelectorAll('[data-split-toggle]').forEach(box=>box.onchange=()=>{
    const pid = box.dataset.splitToggle;
    const e = ensureEntry(currentDate);
    keepTypedPrices(e);
    if(box.checked){
      if(!e.priceSlabs[pid] || !e.priceSlabs[pid].length){
        const price = e.price[pid]!=null? e.price[pid] : getSellingPrice(pid,currentDate);
        e.priceSlabs[pid] = [{qty: productMeterSale(pid,currentDate), rate: price}];
      }
    } else {
      delete e.priceSlabs[pid];
    }
    saveKey('dailyEntries'); render();
  });
  c.querySelectorAll('[data-slab-add]').forEach(b=>b.onclick=()=>{
    const pid = b.dataset.slabAdd;
    const e = ensureEntry(currentDate);
    keepTypedPrices(e);
    const price = getSellingPrice(pid,currentDate);
    e.priceSlabs[pid].push({qty:0, rate:price});
    recomputeLastSlabQty(e, pid, currentDate);
    saveKey('dailyEntries'); render();
  });
  c.querySelectorAll('[data-slab-del]').forEach(b=>b.onclick=()=>{
    const [pid,idx] = b.dataset.slabDel.split(':');
    const e = ensureEntry(currentDate);
    keepTypedPrices(e);
    e.priceSlabs[pid].splice(+idx,1);
    if(!e.priceSlabs[pid].length) e.priceSlabs[pid] = [{qty: productMeterSale(pid,currentDate), rate: getSellingPrice(pid,currentDate)}];
    else recomputeLastSlabQty(e, pid, currentDate);
    saveKey('dailyEntries'); render();
  });
  c.querySelectorAll('[data-slab-qty]').forEach(inp=>inp.onchange=()=>{
    const [pid,idx] = inp.dataset.slabQty.split(':');
    const e = ensureEntry(currentDate);
    keepTypedPrices(e);
    e.priceSlabs[pid][+idx].qty = parseFloat(inp.value)||0;
    recomputeLastSlabQty(e, pid, currentDate);
    saveKey('dailyEntries'); render();
  });
  c.querySelectorAll('[data-slab-rate]').forEach(inp=>inp.onchange=()=>{
    const [pid,idx] = inp.dataset.slabRate.split(':');
    const e = ensureEntry(currentDate);
    keepTypedPrices(e);
    e.priceSlabs[pid][+idx].rate = parseFloat(inp.value)||0;
    saveKey('dailyEntries'); render();
  });

  // CREDIT SALES
  const c_cust = document.getElementById('c_cust');
  const c_prod = document.getElementById('c_prod');
  const c_qty = document.getElementById('c_qty');
  const c_amt = document.getElementById('c_amt');
  function recalcCreditAmount(){
    const qty = parseFloat(c_qty.value);
    const pid = c_prod.value;
    if(qty>0 && pid){
      const price = getSellingPrice(pid, currentDate);
      c_amt.value = (qty*price).toFixed(2);
      document.getElementById('c_amt_hint').textContent = 'Auto: '+fmtQty(qty)+' L × ₹'+fmt(price);
    }
  }
  if(c_cust){
    c_prod.onchange = recalcCreditAmount;
    c_qty.oninput = recalcCreditAmount;
  }
  const addCreditBtn = document.getElementById('addCreditBtn');
  if(addCreditBtn) addCreditBtn.onclick = ()=>{
    const custId = resolveCustomerId(c_cust.value);
    const amt = parseFloat(c_amt.value);
    if(!custId){ toast('Select a customer'); return; }
    if(!(amt>0)){ toast('Enter valid amount'); return; }
    const e = ensureEntry(currentDate);
    e.credit.push({
      customerId: custId, vehicle: document.getElementById('c_veh').value,
      productId: c_prod.value,
      qty: parseFloat(c_qty.value)||0,
      amount: amt, invoice: document.getElementById('c_inv').value
    });
    saveKey('dailyEntries'); render(); toast('Credit sale added');
  };
  const multiSaleBtn = document.getElementById('multiSaleBtn');
  if(multiSaleBtn) multiSaleBtn.onclick = ()=>{
    const custId = resolveCustomerId(c_cust.value);
    if(!custId){ toast('Select a customer first'); return; }
    openMultiSaleModal(custId);
  };
  c.querySelectorAll('[data-edit-slip]').forEach(b=>b.onclick=()=>{
    const [source, idx] = b.dataset.editSlip.split(':');
    openEditSlipModal(source, +idx);
  });
  c.querySelectorAll('[data-del-creditrow]').forEach(b=>b.onclick=()=>{
    const [source, idx] = b.dataset.delCreditrow.split(':');
    const e = ensureEntry(currentDate);
    if(source==='credit') e.credit.splice(+idx,1);
    else if(source==='bowserPurchase') e.bowserPurchase.splice(+idx,1);
    else if(source==='bowserSale') e.bowserSale.splice(+idx,1);
    saveKey('dailyEntries'); render();
  });

  // BOWSER PURCHASE (fill from pump into bowser — treated like a credit sale to the bowser).
  // Bowsers carry HSD only, so the product is fixed — no dropdown needed.
  const bp_bowser = document.getElementById('bp_bowser');
  const bp_qty = document.getElementById('bp_qty');
  const bp_amt = document.getElementById('bp_amt');
  function recalcBowserPurchaseAmount(){
    const qty = parseFloat(bp_qty.value);
    const hp = hsdProduct();
    if(qty>0 && hp){
      const price = getSellingPrice(hp.id, currentDate);
      bp_amt.value = (qty*price).toFixed(2);
      document.getElementById('bp_amt_hint').textContent = 'Auto: '+fmtQty(qty)+' L × ₹'+fmt(price)+' (HSD)';
    }
  }
  if(bp_qty) bp_qty.oninput = recalcBowserPurchaseAmount;
  const addBowserPurchaseBtn = document.getElementById('addBowserPurchaseBtn');
  if(addBowserPurchaseBtn) addBowserPurchaseBtn.onclick = ()=>{
    const hp = hsdProduct();
    const bowserId = bp_bowser.value;
    const qty = parseFloat(bp_qty.value);
    const amt = parseFloat(bp_amt.value);
    if(!hp){ toast('No HSD/Diesel product found — add one on Products & Nozzles'); return; }
    if(!bowserId){ toast('Select a bowser'); return; }
    if(!(qty>0)){ toast('Enter valid quantity'); return; }
    if(!(amt>=0)){ toast('Enter valid amount'); return; }
    const e = ensureEntry(currentDate);
    e.bowserPurchase.push({bowserId, productId: hp.id, qty, amount:amt});
    saveKey('dailyEntries'); render(); toast('Bowser purchase added');
  };
  c.querySelectorAll('[data-del-bowserpurchase]').forEach(b=>b.onclick=()=>{
    const e = ensureEntry(currentDate); e.bowserPurchase.splice(+b.dataset.delBowserpurchase,1);
    saveKey('dailyEntries'); render();
  });

  // BOWSER SALE (bowser -> party, credit or cash). Amount auto-calculates at today's HSD rate.
  const bs_mode = document.getElementById('bs_mode');
  const bs_cust_wrap = document.getElementById('bs_cust_wrap');
  const bs_qty = document.getElementById('bs_qty');
  const bs_amt = document.getElementById('bs_amt');
  function recalcBowserSaleAmount(){
    const qty = parseFloat(bs_qty.value);
    const hp = hsdProduct();
    if(qty>0 && hp){
      const price = getSellingPrice(hp.id, currentDate);
      bs_amt.value = (qty*price).toFixed(2);
      const hint = document.getElementById('bs_amt_hint');
      if(hint) hint.textContent = 'Auto: '+fmtQty(qty)+' L × ₹'+fmt(price)+' (HSD)';
    }
  }
  if(bs_qty) bs_qty.oninput = recalcBowserSaleAmount;
  if(bs_mode) bs_mode.onchange = ()=>{ bs_cust_wrap.style.display = bs_mode.value==='credit' ? 'block' : 'none'; };
  const addBowserSaleBtn = document.getElementById('addBowserSaleBtn');
  if(addBowserSaleBtn) addBowserSaleBtn.onclick = ()=>{
    const bowserId = document.getElementById('bs_bowser').value;
    const mode = bs_mode.value;
    const customerId = resolveCustomerId(document.getElementById('bs_cust').value);
    const qty = parseFloat(document.getElementById('bs_qty').value)||0;
    const amt = parseFloat(document.getElementById('bs_amt').value);
    if(!bowserId){ toast('Select a bowser'); return; }
    if(mode==='credit' && !customerId){ toast('Select the customer (party) for a credit bowser sale'); return; }
    if(!(amt>0)){ toast('Enter valid amount'); return; }
    const outstanding = bowserOutstanding(bowserId);
    if(amt>outstanding){ if(!confirmDialog('This exceeds '+bowserName(bowserId)+"'s current outstanding (₹"+fmt(outstanding)+'). Continue anyway?')) return; }
    const e = ensureEntry(currentDate);
    e.bowserSale.push({bowserId, mode, customerId: mode==='credit'?customerId:'', qty, amount:amt, remarks:document.getElementById('bs_rem').value});
    saveKey('dailyEntries'); render(); toast('Bowser sale added');
  };
  c.querySelectorAll('[data-del-bowsersale]').forEach(b=>b.onclick=()=>{
    const e = ensureEntry(currentDate); e.bowserSale.splice(+b.dataset.delBowsersale,1);
    saveKey('dailyEntries'); render();
  });

  // RECEIPTS
  const r_type = document.getElementById('r_type');
  const r_type_new = document.getElementById('r_type_new');
  const r_mode = document.getElementById('r_mode');
  const r_submode_wrap = document.getElementById('r_submode_wrap');
  const r_submode = document.getElementById('r_submode');
  const r_submode_new = document.getElementById('r_submode_new');
  const r_bank_wrap = document.getElementById('r_bank_wrap');
  const r_bank = document.getElementById('r_bank');
  const r_bank_new = document.getElementById('r_bank_new');
  if(r_type) r_type.onchange = ()=>{ r_type_new.style.display = r_type.value==='__new__' ? 'block' : 'none'; };
  if(r_submode) r_submode.onchange = ()=>{ r_submode_new.style.display = r_submode.value==='__new__' ? 'block' : 'none'; };
  if(r_bank) r_bank.onchange = ()=>{ r_bank_new.style.display = r_bank.value==='__new__' ? 'block' : 'none'; };
  if(r_mode) r_mode.onchange = ()=>{
    const isCash = r_mode.value==='cash';
    r_submode_wrap.style.display = isCash? 'block':'none';
    r_bank_wrap.style.display = isCash? 'none':'block';
  };
  const addReceiptBtn = document.getElementById('addReceiptBtn');
  if(addReceiptBtn) addReceiptBtn.onclick = ()=>{
    const amt = parseFloat(document.getElementById('r_amt').value);
    if(!(amt>0)){ toast('Enter valid amount'); return; }
    let head = r_type.value;
    if(head==='__new__'){
      head = r_type_new.value.trim();
      if(!head){ toast('Enter the new income head'); return; }
      if(!DB.settings.receiptHeads.includes(head)){ DB.settings.receiptHeads.push(head); saveKey('settings'); }
    }
    const mode = r_mode.value;
    let subMode = '', bankId = '';
    if(mode==='cash'){
      subMode = r_submode.value;
      if(subMode==='__new__'){
        subMode = r_submode_new.value.trim();
        if(!subMode){ toast('Enter the new cash sub-mode'); return; }
        if(!DB.settings.cashSubModes.includes(subMode)){ DB.settings.cashSubModes.push(subMode); saveKey('settings'); }
      }
    } else {
      bankId = r_bank.value;
      if(bankId==='__new__'){
        const nm = r_bank_new.value.trim();
        if(!nm){ toast('Enter the new bank name'); return; }
        let b = DB.banks.find(x=>x.name.toLowerCase()===nm.toLowerCase());
        if(!b){ b = {id:uid(), name:nm}; DB.banks.push(b); saveKey('banks'); }
        bankId = b.id;
      }
    }
    if(!DB.receipts[currentDate]){ DB.receipts[currentDate]=[]; bumpDateIndexVersion(); }
    DB.receipts[currentDate].push({
      type: head,
      customerId: resolveCustomerId(document.getElementById('r_cust').value),
      payerName: document.getElementById('r_part').value,
      amount: amt, mode, subMode, bankId,
      remarks: document.getElementById('r_rem').value
    });
    saveKey('receipts'); render(); toast('Receipt added');
  };
  c.querySelectorAll('[data-del-receiptrow]').forEach(b=>b.onclick=()=>{
    const [source, idx] = b.dataset.delReceiptrow.split(':');
    if(source==='receipt'){ DB.receipts[currentDate].splice(+idx,1); saveKey('receipts'); }
    else if(source==='bowserSale'){ const e = ensureEntry(currentDate); e.bowserSale.splice(+idx,1); saveKey('dailyEntries'); }
    render();
  });

  // EXPENSES
  const ex_cat = document.getElementById('ex_cat');
  const ex_cust_wrap = document.getElementById('ex_cust_wrap');
  function toggleExCustWrap(){ ex_cust_wrap.style.display = ex_cat.value.trim()==='Discount' ? 'block' : 'none'; }
  if(ex_cat){ ex_cat.oninput = toggleExCustWrap; toggleExCustWrap(); }
  const addExpenseBtn = document.getElementById('addExpenseBtn');
  if(addExpenseBtn) addExpenseBtn.onclick = ()=>{
    const amt = parseFloat(document.getElementById('ex_amt').value);
    if(!(amt>0)){ toast('Enter valid amount'); return; }
    const category = ex_cat.value.trim();
    if(!category){ toast('Enter or pick an expense category'); return; }
    if(!DB.settings.expenseCategories.includes(category)){
      DB.settings.expenseCategories.push(category);
      DB.settings.expenseCategories.sort((a,b)=>a.localeCompare(b));
      saveKey('settings');
    }
    let customerId = '';
    if(category==='Discount'){
      customerId = resolveCustomerId(document.getElementById('ex_cust').value);
      if(!customerId){ toast('Select the customer this discount was given to'); return; }
    }
    if(!DB.expenses[currentDate]){ DB.expenses[currentDate]=[]; bumpDateIndexVersion(); }
    DB.expenses[currentDate].push({category, customerId, amount:amt, remarks:document.getElementById('ex_rem').value});
    saveKey('expenses'); render(); toast('Expense added');
  };
  c.querySelectorAll('[data-del-expense]').forEach(b=>b.onclick=()=>{
    DB.expenses[currentDate].splice(+b.dataset.delExpense,1);
    saveKey('expenses'); render();
  });

  // PAYMENTS
  const pay_mode = document.getElementById('pay_mode');
  const pay_bank_wrap = document.getElementById('pay_bank_wrap');
  const pay_bank = document.getElementById('pay_bank');
  const pay_bank_new = document.getElementById('pay_bank_new');
  if(pay_mode) pay_mode.onchange = ()=>{ pay_bank_wrap.style.display = pay_mode.value==='Cash' ? 'none' : 'block'; };
  if(pay_bank) pay_bank.onchange = ()=>{ pay_bank_new.style.display = pay_bank.value==='__new__' ? 'block' : 'none'; };
  const addPaymentBtn = document.getElementById('addPaymentBtn');
  if(addPaymentBtn) addPaymentBtn.onclick = ()=>{
    const amt = parseFloat(document.getElementById('pay_amt').value);
    if(!(amt>0)){ toast('Enter valid amount'); return; }
    const mode = document.getElementById('pay_mode').value;
    let bankId = '';
    if(mode!=='Cash' && pay_bank){
      bankId = pay_bank.value;
      if(bankId==='__new__'){
        const nm = pay_bank_new.value.trim();
        if(!nm){ toast('Enter the new bank name'); return; }
        let b = DB.banks.find(x=>x.name.toLowerCase()===nm.toLowerCase());
        if(!b){ b = {id:uid(), name:nm}; DB.banks.push(b); saveKey('banks'); }
        bankId = b.id;
      }
    }
    if(!DB.payments[currentDate]){ DB.payments[currentDate]=[]; bumpDateIndexVersion(); }
    DB.payments[currentDate].push({party:document.getElementById('pay_party').value, type:document.getElementById('pay_type').value, amount:amt, mode, bankId, remarks:document.getElementById('pay_rem').value});
    saveKey('payments'); render(); toast('Payment added');
  };
  c.querySelectorAll('[data-del-payment]').forEach(b=>b.onclick=()=>{
    DB.payments[currentDate].splice(+b.dataset.delPayment,1);
    saveKey('payments'); render();
  });

  // DEPOSITS
  const d_bank = document.getElementById('d_bank');
  const d_bank_new = document.getElementById('d_bank_new');
  if(d_bank) d_bank.onchange = ()=>{ d_bank_new.style.display = d_bank.value==='__new__' ? 'block' : 'none'; };
  const addDepositBtn = document.getElementById('addDepositBtn');
  if(addDepositBtn) addDepositBtn.onclick = ()=>{
    const amt = parseFloat(document.getElementById('d_amt').value);
    if(!(amt>0)){ toast('Enter valid amount'); return; }
    let bankId = d_bank ? d_bank.value : '';
    if(bankId==='__new__'){
      const nm = d_bank_new.value.trim();
      if(!nm){ toast('Enter the new bank name'); return; }
      let b = DB.banks.find(x=>x.name.toLowerCase()===nm.toLowerCase());
      if(!b){ b = {id:uid(), name:nm}; DB.banks.push(b); saveKey('banks'); }
      bankId = b.id;
    }
    if(!bankId){ toast('Select or add a bank'); return; }
    const avail = totalCashAvailable(currentDate) - cashExpensesTotal(currentDate) - paymentsTotal(currentDate) - depositsTotal(currentDate);
    if(amt>avail){ if(!confirmDialog('Deposit amount exceeds available cash ('+fmt(avail)+'). Continue anyway?')) return; }
    if(!DB.deposits[currentDate]){ DB.deposits[currentDate]=[]; bumpDateIndexVersion(); }
    DB.deposits[currentDate].push({bankId, amount:amt, mode:document.getElementById('d_mode').value, ref:document.getElementById('d_ref').value});
    saveKey('deposits'); render(); toast('Deposit added');
  };
  c.querySelectorAll('[data-del-deposit]').forEach(b=>b.onclick=()=>{
    DB.deposits[currentDate].splice(+b.dataset.delDeposit,1);
    saveKey('deposits'); render();
  });

  // CUSTOMERS
  const addCustomerBtn = document.getElementById('addCustomerBtn');
  const cu_name = document.getElementById('cu_name');
  if(addCustomerBtn) addCustomerBtn.onclick = ()=>{
    const name = document.getElementById('cu_name').value.trim();
    if(!name){ toast('Enter customer name'); return; }
    DB.customers.push({
      id:uid(), name,
      openingBalance:parseFloat(document.getElementById('cu_ob').value)||0,
