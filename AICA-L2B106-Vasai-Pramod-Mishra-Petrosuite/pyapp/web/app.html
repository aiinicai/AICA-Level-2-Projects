function exportToExcel(rows, filename, sheetName){
  if(!rows || !rows.length){ toast('Nothing to export'); return; }
  const ws = XLSX.utils.json_to_sheet(rows);
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, (sheetName||'Sheet1').slice(0,31));
  XLSX.writeFile(wb, filename+'.xlsx');
}
/* ---------------------- PDF export helper ---------------------- */
// Renders a DOM node to a paginated A4 PDF, client-side (no server involved).
async function exportNodeToPDF(elId, filename){
  const node = document.getElementById(elId);
  if(!node){ toast('Nothing to export'); return; }
  toast('Preparing PDF…');
  try{
    const canvas = await html2canvas(node, {scale:2, useCORS:true, backgroundColor:'#ffffff'});
    const imgData = canvas.toDataURL('image/jpeg', 0.95);
    const { jsPDF } = window.jspdf;
    const pdf = new jsPDF('p','mm','a4');
    const pageW = pdf.internal.pageSize.getWidth();
    const pageH = pdf.internal.pageSize.getHeight();
    const imgW = pageW;
    const imgH = (canvas.height * imgW) / canvas.width;
    let heightLeft = imgH;
    let position = 0;
    pdf.addImage(imgData, 'JPEG', 0, position, imgW, imgH);
    heightLeft -= pageH;
    while(heightLeft > 0){
      position = heightLeft - imgH;
      pdf.addPage();
      pdf.addImage(imgData, 'JPEG', 0, position, imgW, imgH);
      heightLeft -= pageH;
    }
    pdf.save(filename+'.pdf');
    toast('PDF downloaded');
  }catch(e){
    console.error(e);
    toast('Could not generate PDF — please use Print instead.');
  }
}
// Renders the Tax Invoice to a properly paginated A4 PDF: line items are measured in a hidden
// off-screen container so each page break falls *between* rows (never splitting one), each page
// is filled to capacity, pages are numbered "Page X of N", and — from page 2 onward — a banner
// at the top shows the cumulative total carried forward from all prior pages.
async function exportInvoicePDF(){
  if(!lastPartyBill){ toast('Generate an invoice first'); return; }
  const { cust, billNo, billDate, from, to, rows, total, discount, tds } = lastPartyBill;
  const filename = 'Invoice_'+(billNo||cust.name).replace(/\s+/g,'_');
  if(!rows.length){
    // Nothing to paginate — just export the single preview node as-is.
    return exportNodeToPDF('taxInvoiceNode', filename);
  }
  toast('Preparing PDF…');
  try{
    const s = DB.settings;
    const { jsPDF } = window.jspdf;
    const pdf = new jsPDF('p','mm','a4');
    const pageWmm = pdf.internal.pageSize.getWidth();
    const pageHmm = pdf.internal.pageSize.getHeight();
    const marginMm = 6;
    const contentWmm = pageWmm - marginMm*2;
    const contentHmm = pageHmm - marginMm*2;
    const PX_PER_MM = 96/25.4;
    const scale = 2;
    const contentWpx = Math.round(contentWmm * PX_PER_MM);
    const contentHpx = Math.round(contentHmm * PX_PER_MM);

    // Hidden measuring container — real width, natural (unconstrained) height.
    const measure = document.createElement('div');
    measure.className = 'invoice-content';
    measure.style.cssText = 'position:fixed;left:-99999px;top:0;background:#fff;';
    measure.style.width = contentWpx+'px';
    document.body.appendChild(measure);

    const fullHeaderHTML = invoiceHeaderBlockHTML(s, cust, billNo, billDate, from, to);
    const contHeaderHTML = invoiceContinuationHeaderHTML(s, cust, billNo);
    const footerHTML = invoiceFooterBlockHTML(s, total, discount, tds, lastPartyBill.summary);
    const cfBanner = (label)=>`<div style="border:1px solid #999;padding:6px 10px;margin-bottom:8px;font-weight:700;">${label}</div>`;
    const pageTotalLine = (label)=>`<div class="right" style="font-weight:700;margin-top:6px;">${label}</div>`;
    const pageNumLine = (label)=>`<div class="right small-note mt">${label}</div>`;

    measure.innerHTML = fullHeaderHTML;
    const fullHeaderH = measure.offsetHeight;
    measure.innerHTML = contHeaderHTML;
    const contHeaderH = measure.offsetHeight;
    measure.innerHTML = footerHTML;
    const footerH = measure.offsetHeight;
    measure.innerHTML = cfBanner('Total of Page 1: Rs. 0.00');
    const cfBannerH = measure.offsetHeight;
    measure.innerHTML = pageTotalLine('Page 1 Total: Rs. 0.00');
    const pageTotalH = measure.offsetHeight;
    measure.innerHTML = pageNumLine('Page 1 of 1');
    const pageNumH = measure.offsetHeight;

    measure.innerHTML = `<table class="data" style="width:100%;">${invoiceTheadHTML()}<tbody>${rows.map(invoiceRowHTML).join('')}</tbody></table>`;
    const theadH = measure.querySelector('thead').offsetHeight;
    const rowHeights = Array.from(measure.querySelectorAll('tbody tr')).map(tr=>tr.offsetHeight);
    document.body.removeChild(measure);

    // ---- Decide which rows go on which page. Pack every page to full capacity (no footer
    // reserved) — only the very last page needs room for the footer, so we check that after
    // packing and, if it doesn't fit, spill rows off the end of the last page onto a fresh
    // trailing page. This means every non-final page is genuinely filled before moving on. ----
    function pageAvailable(pageIndex){
      const isFirst = pageIndex===0;
      const headerH = isFirst? fullHeaderH : contHeaderH;
      const cfH = isFirst? 0 : cfBannerH;
      return contentHpx - headerH - cfH - theadH - pageTotalH - pageNumH;
    }
    const pages = [];
    {
      let idx = 0;
      while(idx < rows.length){
        const available = pageAvailable(pages.length);
        let used = 0, count = 0;
        while(idx+count < rows.length && (used + rowHeights[idx+count] <= available || count===0)){
          used += rowHeights[idx+count]; count++;
        }
        pages.push({start:idx, end:idx+count});
        idx += count;
      }
      // Ensure the footer actually fits alongside the last page's rows; if not, spill rows
      // (in order, from the end) onto a new trailing page that ends with the footer.
      const last = pages[pages.length-1];
      const avail = pageAvailable(pages.length-1);
      let rowsH = 0;
      for(let i=last.start;i<last.end;i++) rowsH += rowHeights[i];
      let spillFrom = null;
      while(rowsH + footerH > avail && last.end > last.start){
        last.end -= 1;
        rowsH -= rowHeights[last.end];
        spillFrom = last.end;
      }
      if(spillFrom!==null){
        pages.push({start:spillFrom, end:rows.length});
      }
    }

    // ---- Render and capture each page individually, then compose the PDF. ----
    let cumulative = 0;
    for(let p=0; p<pages.length; p++){
      const {start,end} = pages[p];
      const pageRows = rows.slice(start,end);
      const pageTotal = pageRows.reduce((s2,r)=>s2+r.amount,0);
      const isFirst = p===0;
      const isLast = p===pages.length-1;

      let html = `<div style="position:relative;z-index:1;">`;
      html += isFirst ? fullHeaderHTML : contHeaderHTML;
      if(!isFirst){
        const label = p===1 ? ('Total of Page 1: Rs. '+fmt(cumulative)) : ('Total of Page 1 to '+p+': Rs. '+fmt(cumulative));
        html += cfBanner(label);
      }
      html += `<table class="data" style="width:100%;">${invoiceTheadHTML()}<tbody>${pageRows.map((r,i)=>invoiceRowHTML(r,start+i)).join('')}</tbody></table>`;
      html += pageTotalLine('Page '+(p+1)+' Total: Rs. '+fmt(pageTotal));
      if(isLast){
        html += pageTotalLine('Gross Total: Rs. '+fmt(total));
        html += footerHTML;
      }
      html += pageNumLine('Page '+(p+1)+' of '+pages.length);
      html += '</div>';

      cumulative += pageTotal;

      const pageEl = document.createElement('div');
      pageEl.className = 'invoice-content';
      pageEl.style.cssText = 'position:fixed;left:-99999px;top:0;background:#fff;';
      pageEl.style.width = contentWpx+'px';
      pageEl.innerHTML = html;
      document.body.appendChild(pageEl);
      const canvas = await html2canvas(pageEl, {scale, useCORS:true, backgroundColor:'#ffffff'});
      document.body.removeChild(pageEl);

      const imgData = canvas.toDataURL('image/jpeg', 0.95);
      const imgHmm = (canvas.height * contentWmm) / canvas.width;
      if(p>0) pdf.addPage();
      pdf.addImage(imgData, 'JPEG', marginMm, marginMm, contentWmm, imgHmm);
    }

    pdf.save(filename+'.pdf');
    toast('PDF downloaded — '+pages.length+' page'+(pages.length>1?'s':''));
  }catch(e){
    console.error(e);
    toast('Could not generate PDF — please use Print instead.');
  }
}

/* ---- Styled Excel export (ExcelJS) — the xlsx.js build above can't write cell styling,
   so formatted reports (colors, bold, borders, number formats) use ExcelJS instead. ---- */
const XL_CURRENCY_FMT = '#,##0.00;[Red]-#,##0.00';
// Blue header palette: dark blue for top-level section titles, a lighter/medium blue for
// ordinary column-header rows, and a pale light-blue for totals/sub-header rows.
const XL_BLUE_DARK = {type:'pattern', pattern:'solid', fgColor:{argb:'FF1F4E78'}};
const XL_BLUE_LIGHTER = {type:'pattern', pattern:'solid', fgColor:{argb:'FF4472C4'}};
const XL_BLUE_LIGHT = {type:'pattern', pattern:'solid', fgColor:{argb:'FFDCE6F1'}};
const XL_HEADER_FILL = XL_BLUE_LIGHTER;
const XL_TOTAL_FILL = XL_BLUE_LIGHT;
const XL_WHITE_FONT = {color:{argb:'FFFFFFFF'}, bold:true};
const XL_DARK_FONT = {color:{argb:'FF1F1F1F'}, bold:true};
const XL_THIN_BORDER = {top:{style:'thin'}, left:{style:'thin'}, bottom:{style:'thin'}, right:{style:'thin'}};
const XL_DOUBLE_BORDER = {top:{style:'double'}, left:{style:'double'}, bottom:{style:'double'}, right:{style:'double'}};

// Writes a plain array-of-arrays into a worksheet with sensible, automatic formatting:
// thin borders + currency format on numeric cells throughout; bold+filled header row for any
// row that looks like column titles (several short text cells in a row); bold+filled row for
// any row whose first cell contains "TOTAL". This keeps every existing report's data untouched
// while giving it a consistent, readable, formatted look without hand-styling every sheet.
function writeFormattedAOASheet(workbook, sheetName, aoa, pageSetup, flags){
  const ws = workbook.addWorksheet(sheetName.slice(0,31));
  ws.pageSetup = Object.assign({
    paperSize: 9, orientation: 'portrait', fitToPage: true, fitToWidth: 1, fitToHeight: 0,
    horizontalCentered: true,
    margins: {left:0.3, right:0.3, top:0.4, bottom:0.4, header:0.2, footer:0.2}
  }, pageSetup||{});
  if(!aoa || !aoa.length){ ws.addRow(['No data']); return ws; }
  let maxCols = 1;
  aoa.forEach((rowArr,idx)=>{
    if(!rowArr || !rowArr.length) { ws.addRow([]); return; }
    maxCols = Math.max(maxCols, rowArr.length);
    const row = ws.addRow(rowArr);
    const nonEmpty = rowArr.filter(v=>v!==''&&v!=null);
    const firstCell = String(rowArr[0]||'');
    const isTotalRow = /TOTAL/i.test(firstCell);
    const isHeaderRow = nonEmpty.length>=3 && rowArr.every(v=>v===''||v==null||typeof v==='string') && !isTotalRow;
    row.eachCell({includeEmpty:false}, (cell)=>{
      cell.border = isTotalRow ? XL_THIN_BORDER : XL_THIN_BORDER;
      if(typeof cell.value === 'number') cell.numFmt = XL_CURRENCY_FMT;
    });
    if(isTotalRow){
      row.font = XL_DARK_FONT;
      row.eachCell({includeEmpty:false}, cell=>{ cell.fill = XL_TOTAL_FILL; });
    } else if(isHeaderRow){
      row.font = XL_WHITE_FONT;
      row.eachCell({includeEmpty:false}, cell=>{ cell.fill = XL_HEADER_FILL; });
    }
  });
  for(let i=1;i<=maxCols;i++){
    const col = ws.getColumn(i);
    let maxLen = 8;
    col.eachCell({includeEmpty:false}, cell=>{ maxLen = Math.max(maxLen, String(cell.value).length); });
    col.width = Math.min(32, maxLen+2);
  }
  (flags||[]).forEach(f=> markDiscrepancyCell(ws.getCell(f.r+1, f.c+1), f));
  return ws;
}

/* ---- Monthly report integrity checks: nil-sheet detection + total re-verification ---- */
const XL_RED_FONT = {color:{argb:'FFFF0000'}, bold:true};
const XL_RED_FILL = {type:'pattern', pattern:'solid', fgColor:{argb:'FFFFC7CE'}};
const TOTALS_TOLERANCE = 0.005;
function markDiscrepancyCell(cell, f){
  cell.font = XL_RED_FONT;
  cell.fill = XL_RED_FILL;
  cell.note = 'TOTAL MISMATCH ('+f.kind+')\nShown in report: '+Number(f.stated).toFixed(2)+'\nRe-computed: '+Number(f.expected).toFixed(2)+'\nDifference: '+(Number(f.stated)-Number(f.expected)).toFixed(2);
}
function monthlyHeaderRowIdx(aoa){
  return aoa.findIndex(r=> r && /^(date|sl no)$/i.test(String(r[0]||'').trim()));
}
function isMonthlyTotalRow(r){
  return !!r && r.some(v=> typeof v==='string' && /^(grand )?total$/i.test(v.trim()));
}
// A sheet is "nil" when every numeric data cell below the column-header row is zero/blank.
// Excluded: the first column (day number / serial no.), TOTAL rows, and 'Rate' columns (a price
// list is not transactional data).
function isNilMonthlySheet(aoa){
  const h = monthlyHeaderRowIdx(aoa);
  if(h<0) return !aoa.some(r=>r && r.some(v=>typeof v==='number' && Math.abs(v)>TOTALS_TOLERANCE));
  const header = aoa[h]||[];
  for(let r=h+1; r<aoa.length; r++){
    const row = aoa[r];
    if(!row || isMonthlyTotalRow(row)) continue;
    for(let c=1; c<row.length; c++){
      if(/rate/i.test(String(header[c]||''))) continue;
      if(typeof row[c]==='number' && Math.abs(row[c])>TOTALS_TOLERANCE) return false;
    }
  }
  return true;
}
// Row-wise "total = sum of parts" rules, resolved from each sheet's column headings.
function monthlyRowRules(name, header){
  const idx = (fn)=> header.map((h,i)=>fn(String(h||''),i)?i:-1).filter(i=>i>=0);
  const last = header.length-1;
  const allMiddle = ()=> Array.from({length:Math.max(0,last-1)},(_,i)=>i+1);
  if(name.startsWith('METER-')){
    return [{label:'Total Sale = sum of nozzle sales', total:last, plus:idx(h=>h==='Sale')}];
  }
  if(name==='TOTAL CASH'){
    const col = (lbl)=> header.findIndex(h=>String(h)===lbl);
    const totalSale=col('Total Sale'), direct=col('Direct Credit Sales'), bowP=col('Bowser Purchase'),
          totCredit=col('Total Credit Sales'), cashSales=col('Cash Sales'), lube=col('Lubricant Sales');
    const rules=[];
    if(totalSale>=0) rules.push({label:'Total Sale = fuel amounts + lubricants', total:totalSale, plus:[...idx(h=>/ Sale Amount$/.test(h)), lube].filter(i=>i>=0)});
    if(totCredit>=0) rules.push({label:'Total Credit = direct + bowser purchase', total:totCredit, plus:[direct,bowP].filter(i=>i>=0)});
    if(cashSales>=0 && totalSale>=0 && totCredit>=0) rules.push({label:'Cash Sales = Total Sale - Total Credit', total:cashSales, plus:[totalSale], minus:[totCredit]});
    return rules;
  }
  if(['PAYMENT','CASH RECEIPTS','NON-CASH RECEIPTS','CREDIT','DISCOUNT','CUSTOMER TDS','BOWSER SALE','BOWSER SALE (LTR)'].includes(name)){
    return [{label:'Row total = sum of columns', total:last, plus:allMiddle()}];
  }
  if(name==='EXPENSES'){
    return [{label:'Total = sum of expense heads (testing columns excluded)', total:last, plus:allMiddle().filter(i=>!/^Testing Expense/i.test(String(header[i]||'')))}];
  }
  if(name==='PURCHASE'){
    return [{label:'Total = sum of product amounts', total:last, plus:idx((h,i)=>i!==last && / Amount$/.test(h))}];
  }
  return [];
}
// Re-computes every TOTAL in a monthly AOA sheet from the figures actually printed on it.
// Returns [{r,c,stated,expected,kind}] (0-based) for every mismatch.
function verifyMonthlySheet(name, aoa){
  const flags = [];
  const num = v=> typeof v==='number' ? v : 0;
  const bad = (a,b)=> Math.abs(a-b) > TOTALS_TOLERANCE;
  // (a) Column totals: each TOTAL row against the sum of the rows of its own table.
  aoa.forEach((row,ri)=>{
    if(!isMonthlyTotalRow(row)) return;
    let start = -1;
    for(let k=ri-1;k>=0;k--){ if(aoa[k] && /^(date|sl no|supplier)$/i.test(String(aoa[k][0]||'').trim())){ start=k; break; } }
    if(start<0) return;
    for(let c=1;c<row.length;c++){
      if(typeof row[c]!=='number') continue;
      let sum=0;
      for(let k=start+1;k<ri;k++){ if(aoa[k] && !isMonthlyTotalRow(aoa[k])) sum+=num(aoa[k][c]); }
      if(bad(row[c],sum)) flags.push({r:ri,c,stated:row[c],expected:sum,kind:'column total'});
    }
  });
  // (b) Row totals (also applied to the TOTAL row = cross-foot).
  const h = monthlyHeaderRowIdx(aoa);
  if(h>=0){
    const rules = monthlyRowRules(name, aoa[h]||[]);
    for(let ri=h+1; ri<aoa.length; ri++){
      const row = aoa[ri];
      if(!row || !row.length) continue;
      const isTot = isMonthlyTotalRow(row);
      if(!isTot && typeof row[0]!=='number') continue;
      rules.forEach(rule=>{
        if(typeof row[rule.total]!=='number') return;
        const exp = rule.plus.reduce((s,i)=>s+num(row[i]),0) - (rule.minus||[]).reduce((s,i)=>s+num(row[i]),0);
        if(bad(row[rule.total],exp) && !flags.some(f=>f.r===ri && f.c===rule.total))
          flags.push({r:ri,c:rule.total,stated:row[rule.total],expected:exp,kind:(isTot?'cross-foot: ':'row total: ')+rule.label});
      });
    }
  }
  // (c) TDS: supplier-wise total must tie to the day-wise total.
  if(name==='TDS'){
    const tr = aoa.map((r,i)=>isMonthlyTotalRow(r)?i:-1).filter(i=>i>=0);
    if(tr.length>=2){
      for(let c=1;c<=2;c++){
        const a=aoa[tr[0]][c], b=aoa[tr[1]][c];
        if(typeof a==='number' && typeof b==='number' && bad(a,b))
          flags.push({r:tr[1],c,stated:b,expected:a,kind:'supplier-wise total vs day-wise total'});
      }
    }
  }
  return flags;
}
const GST_RATE_LUBRICANT = 0.18; // standard GST rate on lubricants in India
const GST_HSN = { ms:'27101242', msPurchase:'27101243', cng:'27112100', hsd:'27101944', lube:'271019', e85:'22072000' };
function buildGSTReportSheet(workbook, mk, issues){
  let ws = null;
  const monthKeys = fiscalYearMonths(mk);
  const ms = msProduct(), prem = premiumPetrolProduct(), cng = cngProduct(), hsd = hsdProduct(), e85 = e85Product();
  const lubeIds = lubeProducts().map(p=>p.id);

  function monthAmountRow(m){
    const days = daysInMonthArr(m);
    const salesAmt = (p)=> p? days.reduce((s,d)=>s+fuelSaleAmount(p.id,d),0) : 0;
    const testAmt = (p)=> p? days.reduce((s,d)=>s+testingQty(p.id,d)*getSellingPrice(p.id,d),0) : 0;
    const purchAmt = (p)=> p? days.reduce((s,d)=>s+purchaseAmount(p.id,d),0) : 0;
    const msSales=salesAmt(ms), msTest=testAmt(ms), premSales=salesAmt(prem), premTest=testAmt(prem);
    const msTotal = (msSales-msTest)+(premSales-premTest);
    const cngSales = salesAmt(cng);
    const hsdSales=salesAmt(hsd), hsdTest=testAmt(hsd);
    const hsdTotal = hsdSales-hsdTest;
    const totalTaxfree = msTotal+cngSales+hsdTotal;
    const lubeGross = days.reduce((s,d)=>s+lubeSalesAmount(d),0);
    // E85 gross sales and testing shown as their own columns (same pattern
    // as MS/HSD above), with testing still netted out for the NET/TAX calc.
    const e85SalesGross = salesAmt(e85), e85TestAmt = testAmt(e85);
    const e85NetOfTest = e85SalesGross - e85TestAmt;
    // E85 is taxed at 18% GST, same rate as lubricants, so it shares the
    // same NET/TAX formula base rather than getting its own tax columns.
    const taxableGross = lubeGross + e85NetOfTest;
    const lubeNet = taxableGross/(1+GST_RATE_LUBRICANT);
    const lubeTax = taxableGross-lubeNet;
    const msPurch=purchAmt(ms), premPurch=purchAmt(prem);
    const msPurchTotal = msPurch+premPurch;
    const cngPurch = purchAmt(cng), hsdPurch = purchAmt(hsd);
    const purchTaxfree = msPurchTotal+cngPurch+hsdPurch;
    const lubePurchGross = days.reduce((s,d)=>s+lubeIds.reduce((s2,pid)=>s2+purchaseAmount(pid,d),0),0);
    const e85PurchGross = purchAmt(e85);
    const taxablePurchGross = lubePurchGross + e85PurchGross;
    const lubePurchNet = taxablePurchGross/(1+GST_RATE_LUBRICANT);
    const lubePurchTax = taxablePurchGross-lubePurchNet;
    return [msSales,msTest,premSales,premTest,msTotal,cngSales,hsdSales,hsdTest,hsdTotal,totalTaxfree,
            lubeGross,e85SalesGross,e85TestAmt,lubeNet,lubeTax,
            msPurch,premPurch,msPurchTotal,cngPurch,hsdPurch,purchTaxfree,lubePurchGross,e85PurchGross,lubePurchNet,lubePurchTax];
  }
  function monthQtyRow(m){
    const days = daysInMonthArr(m);
    const salesQty = (p)=> p? days.reduce((s,d)=>s+productMeterSale(p.id,d),0) : 0;
    const testQty_ = (p)=> p? days.reduce((s,d)=>s+testingQty(p.id,d),0) : 0;
    const purchQty = (p)=> p? days.reduce((s,d)=>s+purchaseQty(p.id,d),0) : 0;
    const msSales=salesQty(ms), msTest=testQty_(ms), premSales=salesQty(prem), premTest=testQty_(prem);
    const msTotal=(msSales-msTest)+(premSales-premTest);
    const cngSales=salesQty(cng);
    const hsdSales=salesQty(hsd), hsdTest=testQty_(hsd);
    const hsdTotal=hsdSales-hsdTest;
    const totalTaxfree=msTotal+cngSales+hsdTotal;
    // E85 physical litres sold and tested — nozzle-delivered like petrol,
    // so it's tracked in quantity too (unlike lubricants, amount-only).
    const e85SalesQty = salesQty(e85), e85TestQty = testQty_(e85);
    const msPurch=purchQty(ms), premPurch=purchQty(prem);
    const msPurchTotal=msPurch+premPurch;
    const cngPurch=purchQty(cng), hsdPurch=purchQty(hsd);
    const purchTaxfree=msPurchTotal+cngPurch+hsdPurch;
    const e85PurchQty = purchQty(e85);
    return [msSales,msTest,premSales,premTest,msTotal,cngSales,hsdSales,hsdTest,hsdTotal,totalTaxfree,
            0,e85SalesQty,e85TestQty,0,0, msPurch,premPurch,msPurchTotal,cngPurch,hsdPurch,purchTaxfree,0,e85PurchQty,0,0];
  }

  function writeHeaderBlock(){
    const r1 = ws.addRow(['', 'SALES']);
    ws.mergeCells(r1.number,2,r1.number,16);
    const r1b = r1.getCell(17); r1b.value = 'PURCHASE'; ws.mergeCells(r1.number,17,r1.number,26);
    [2,17].forEach(col=>{ const cell=r1.getCell(col); cell.font=XL_WHITE_FONT; cell.fill=XL_BLUE_DARK; cell.alignment={horizontal:'center'}; });

      'TOTAL TAX FREE', 'TAXABLE SALES', '', '', '', '',
      'MS ('+GST_HSN.msPurchase+')', '', '', 'CNG('+GST_HSN.cng+') Purchase', 'HSD('+GST_HSN.hsd+') Purchase', 'TOTAL TAX FREE',
      'Lubricants TAXABLE('+GST_HSN.lube+')', '', '', '']);
    ws.mergeCells(r2.number,2,r2.number,6);   // MS group: Sales,Test,Premium Sales,Premium Test,TOTAL

    const r3 = ws.addRow(['MONTH','Sales','Test','Premium Sales','Premium Test','TOTAL','Sales','Sales','Test','TOTAL','',
      'Lubricant ('+GST_HSN.lube+')','E85 ('+GST_HSN.e85+')','E85 Testing','NET','TAX',
      'Purchase','Premium Purchase','TOTAL','','','',
      'Lubricant ('+GST_HSN.lube+')','E85 ('+GST_HSN.e85+')','NET','TAX']);
    r3.eachCell(cell=>{ cell.font=XL_WHITE_FONT; cell.fill=XL_BLUE_LIGHTER; cell.border=XL_THIN_BORDER; cell.alignment={horizontal:'center'}; });

  function writeSection(rowFn, numFmt, rules, sectionName){

      vals.forEach((v,i)=> totals[i]+=(Number(v)||0));
    });
    const totalRow = ws.addRow(['Grand Total', ...totals]);
    totalRow.font = XL_DARK_FONT;
    totalRow.eachCell((cell,colNum)=>{
      cell.fill = XL_TOTAL_FILL;
      cell.border = XL_DOUBLE_BORDER;
      if(colNum>1 && typeof cell.value==='number') cell.numFmt = numFmt;
    });
    verifyGSTSection(firstRowNo, lastMonthRowNo, totalRow.number, rules, sectionName);
  }
  function monthLabelShort(mk){
    const [y,m] = mk.split('-').map(Number);
    return new Date(y,m-1,1).toLocaleDateString('en-IN',{month:'long'});
  }

  // Nil check first: if every month's figures are zero in both sections, the sheet is omitted.
  const hasData = monthKeys.some(m=> monthAmountRow(m).concat(monthQtyRow(m)).some(v=>Math.abs(Number(v)||0)>TOTALS_TOLERANCE));
  if(!hasData) return null;
  ws = workbook.addWorksheet('GST Report');
  ws.pageSetup = {
    paperSize: 9, orientation: 'landscape', fitToPage: true, fitToWidth: 1, fitToHeight: 0,
    horizontalCentered: true,
    margins: {left:0.3, right:0.3, top:0.4, bottom:0.4, header:0.2, footer:0.2}
  };

  // Re-verifies the month rows and Grand Total row of one section, reading the figures back
  // from the worksheet itself. Indices are positions in the 25-value row (sheet column = idx+2).
  const GST_AMT_RULES = [
    {label:'MS Total = (Sales-Test) + (Premium Sales-Premium Test)', t:4, plus:[0,2], minus:[1,3]},
    {label:'HSD Total = Sales - Test', t:8, plus:[6], minus:[7]},
    {label:'Total Tax Free = MS + CNG + HSD', t:9, plus:[4,5,8]},
    {label:'Taxable NET + TAX = Lubricant + E85 Sales - E85 Testing', t:-1, plus:[13,14], expPlus:[10,11], expMinus:[12]},
    {label:'Purchase MS Total = Purchase + Premium', t:17, plus:[15,16]},
    {label:'Purchase Total Tax Free = MS + CNG + HSD', t:20, plus:[17,18,19]},
    {label:'Purchase Lubricant NET + TAX = Lubricant + E85', t:-1, plus:[23,24], expPlus:[21,22]}
  ];
  const GST_QTY_RULES = GST_AMT_RULES.filter(r=>r.t>=0);
  function verifyGSTSection(firstRow, lastMonthRow, totalRowNo, rules, sectionName){
    const val = (r,i)=>{ const v = ws.getCell(r, i+2).value; return typeof v==='number'? v : 0; };
    const flag = (r,col,stated,expected,kind)=>{
      markDiscrepancyCell(ws.getCell(r,col), {stated,expected,kind:sectionName+' - '+kind});
      if(issues) issues.push({sheet:'GST Report', cell:ws.getCell(r,col).address, kind:sectionName+' - '+kind, stated, expected});
    };
    // Grand Total vs. sum of the 12 month rows, column by column
    for(let i=0;i<25;i++){
      let sum=0; for(let r=firstRow;r<=lastMonthRow;r++) sum+=val(r,i);
      const st = val(totalRowNo,i);
      if(Math.abs(st-sum)>TOTALS_TOLERANCE) flag(totalRowNo,i+2,st,sum,'Grand Total column');
    }
    // Row-wise sub-totals on every month row and on the Grand Total row (cross-foot)
    for(let r=firstRow;r<=totalRowNo;r++){
      rules.forEach(rule=>{
        const sumOf = (arr)=>(arr||[]).reduce((s,i)=>s+val(r,i),0);
        if(rule.t>=0){
          const exp = sumOf(rule.plus) - sumOf(rule.minus);
          const st = val(r,rule.t);
          if(Math.abs(st-exp)>TOTALS_TOLERANCE) flag(r,rule.t+2,st,exp,(r===totalRowNo?'cross-foot: ':'row: ')+rule.label);
        } else {
          const st = sumOf(rule.plus);
          const exp = sumOf(rule.expPlus) - sumOf(rule.expMinus);
          // NET+TAX is derived from the gross, so the pair is compared as one figure
          if(Math.abs(st-exp)>TOTALS_TOLERANCE){
            flag(r,rule.plus[0]+2,val(r,rule.plus[0]),val(r,rule.plus[0])-(st-exp),(r===totalRowNo?'cross-foot: ':'row: ')+rule.label);
          }
        }
      });
    }
  }

  writeSection(monthAmountRow, XL_CURRENCY_FMT, GST_AMT_RULES, 'Amount section');
  ws.addRow([]);
  const qtyTitle = ws.addRow(['QUANTITATIVE']);
  qtyTitle.font = {bold:true, size:12, color:{argb:'FF1F4E78'}};
  writeSection(monthQtyRow, '#,##0.00', GST_QTY_RULES, 'Quantity section');

  ws.columns.forEach((col,i)=>{ col.width = i===0? 12 : 13; });
  if(!ms && !hsd && !cng){
    ws.getCell(1,1).note = 'No matching MS/HSD/CNG products were found by name — check Products & Nozzles naming.';
  }
  return ws;
}

async function exportMonthlyExcel(mk){
  const wb = new ExcelJS.Workbook();
  const sheetsObjAOA = buildMonthlyWorkbookAOA(mk);
  const omitted = [], issues = [];
  let written = 0;
  Object.keys(sheetsObjAOA).forEach(name=>{
    const aoa = sheetsObjAOA[name];
    if(isNilMonthlySheet(aoa)){ omitted.push(name); return; }
    const flags = verifyMonthlySheet(name, aoa);
    flags.forEach(f=> issues.push({sheet:name, r:f.r, c:f.c, kind:f.kind, stated:f.stated, expected:f.expected}));
    writeFormattedAOASheet(wb, name, aoa, {fitToHeight:0}, flags);
    written++;
  });
  // GST Report covers the full April-March fiscal year containing the selected month.
  const gst = buildGSTReportSheet(wb, mk, issues);
  if(gst) written++; else omitted.push('GST Report');
  if(!written){
    wb.addWorksheet('No Data').addRow(['No data recorded for '+mk+' — every report sheet was nil.']);
  }
  const buf = await wb.xlsx.writeBuffer();
  const blob = new Blob([buf], {type:'application/octet-stream'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = 'Monthly_Report_'+mk+'.xlsx';
  a.click(); URL.revokeObjectURL(url);
  window.__lastMonthlyExportInfo = {omitted, issues};
  toast('Monthly Excel exported — '+written+' sheet(s)'+(omitted.length?', '+omitted.length+' nil sheet(s) omitted':'')+
        (issues.length? '. '+issues.length+' total mismatch(es) marked in RED' : '. All totals verified'));
}

function buildDailySheetAOA(d){
  const rows = [];

  });
  DB.bowsers.forEach(b=>{
    const ad = bowserActualDip(b.id,d);
    rows.push([b.name+' (Bowser) Opening', bowserOpeningStock(b.id,d), '', b.name+' (Bowser) Closing Dip', ad!=null? ad : bowserExpectedStock(b.id,d)]);
  });
  rows.push([]);
  fuelProducts().forEach(p=>{
    const nozs = nozzlesForProduct(p.id, d);
    rows.push(['READING '+p.name.toUpperCase(), ...nozs.map(n=>n.name), 'TOTAL']);
    rows.push(['Closing', ...nozs.map(n=>{const m=getMeterEntry(n.id,d); return m.closing!=null?m.closing:'';}), productMeterSale(p.id,d)]);
    rows.push(['Opening', ...nozs.map(n=>getOpeningMeter(n.id,d)), '']);

    rows.push([]);
  });
  rows.push(['TOTAL SALE', 'Litres', 'Testing Litres', 'Rate', 'Sale Amount Rs.']);
  fuelProducts().forEach(p=>{
    rows.push([p.name, productMeterSale(p.id,d), testingQty(p.id,d), getSellingPrice(p.id,d), fuelSaleAmount(p.id,d)]);
  });
  rows.push(['Lubricants / Oil', '', '', '', lubeSalesAmount(d)]);
  rows.push(['TOTAL SALE', '', '', '', totalSalesAmount(d)]);
  rows.push([]);
  rows.push(['PAYMENT / RECEIPT MODE REPORT']);
  rows.push(['Mode', 'Amount']);

    const amt = (DB.receipts[d]||[]).filter(r=>r.mode==='cash' && r.subMode===sm).reduce((s,r)=>s+(Number(r.amount)||0),0);
    rows.push(['Cash — '+sm, amt]);
  });
  rows.push(['Bank', receiptsModeTotal(d,'bank')]);
  rows.push(['Digital', receiptsModeTotal(d,'digital')]);
  rows.push(['IOCL Receipts', receiptsModeTotal(d,'iocl')]);
  rows.push(['TOTAL RECEIPTS', receiptsTotal(d)]);
  rows.push([]);
  rows.push(['DIGITAL PAYMENT SUMMARY']);
  rows.push(['Sl No', 'Mode', 'Sub Mode / Bank', 'Party / Customer / Income / Nature', 'Customer Name', 'Credit Party', 'Remarks', 'Amount']);
  {
    // Unify actual digital/bank/IOCL receipts AND credit sales to Digital-Payment-flagged
    // customers into one list of row descriptors, then group/sort/total bank-wise.
    const descriptors = [];
    (DB.receipts[d]||[]).filter(isDigitalReceipt).forEach(r=>{
      descriptors.push({
        bank: receiptSubModeLabel(r) || '(No Bank)',
        mode: RECEIPT_MODE_LABEL[r.mode]||r.mode,
        nature: receiptNatureLabel(r),
        customerName: receiptCustomerName(r),
        creditParty: receiptCreditParty(r),
        remarks: r.remarks||'',
        amount: Number(r.amount)||0
      });
    });
    digitalCreditSaleRows(d).forEach(cs=>{
      descriptors.push({
        bank: '(Credit Sale)',
        mode: '',
        nature: 'Credit Sale',
        customerName: cs.customerName,
        creditParty: cs.customerName,
        remarks: '',
        amount: cs.amount
      });
    });
    const byBank = {};
    descriptors.forEach(desc=>{
      if(!byBank[desc.bank]) byBank[desc.bank] = [];
      byBank[desc.bank].push(desc);
    });
    const bankNames = Object.keys(byBank).sort();
    let sl = 1, grand = 0;
    bankNames.forEach(bank=>{
      let bankTotal = 0;
      byBank[bank].forEach(desc=>{
        rows.push([sl++, desc.mode, bank, desc.nature, desc.customerName, desc.creditParty, desc.remarks, desc.amount]);
        bankTotal += desc.amount;
      });
      rows.push(['', '', bank+' Total', '', '', '', '', bankTotal]);
      grand += bankTotal;
    });
    if(!bankNames.length) rows.push(['—', 'No digital payments recorded today', '', '', '', '', '', 0]);
    rows.push(['', '', 'GRAND TOTAL', '', '', '', '', grand]);
  }
  rows.push([]);
  rows.push(['CASH REPORT']);
  rows.push(['Opening Cash', getOpeningCash(d)]);
  rows.push(['Total Sale', totalSalesAmount(d)]);
  rows.push(['Direct Credit Sales', directCreditSalesAmount(d)]);
  rows.push(['Bowser Purchase (treated as credit sale)', bowserPurchaseAmount(d)]);
  rows.push(['Total Credit Sales', creditSalesAmount(d)]);
  rows.push(['Cash Sales', cashSalesAmount(d)]);
  rows.push(['Cash-mode Receipts', receiptsCashTotal(d)]);
  rows.push(['Bowser Sales — Cash', bowserSaleCashAmount(d)]);
  rows.push(['Bowser Sales — Credit to Party (no cash effect)', bowserSaleCreditAmount(d)]);
  rows.push(['Bank/Digital/IOCL Receipts (excluded from cash)', receiptsBankTotal(d)]);
  rows.push(['Total Cash Available', totalCashAvailable(d)]);
  rows.push(['Expenses (Cash — excl. Discount)', cashExpensesTotal(d)]);
  rows.push(['Payments', paymentsTotal(d)]);
  rows.push(['Bank Deposits', depositsTotal(d)]);
  rows.push(['Testing Litres (treated as cash expense)', testingCashExpense(d)]);
  rows.push(['CLOSING CASH', closingCash(d)]);
  rows.push([]);
  rows.push(['EXPENSE REPORT']);
  rows.push(['Category', 'Amount']);
  const expList = DB.expenses[d]||[];
  const expByCatMap = {};
  expList.forEach(e=>{ expByCatMap[e.category] = (expByCatMap[e.category]||0)+(Number(e.amount)||0); });
  expByCatMap['Discount'] = (expByCatMap['Discount']||0) + autoDiscountTotal(d);
  Object.keys(expByCatMap).forEach(cat=> rows.push([cat, expByCatMap[cat]]));
  rows.push(['TOTAL EXPENSES (incl. Discount)', expensesTotal(d)]);
  rows.push([]);
  rows.push(['BOWSER REPORT']);
  rows.push(['Bowser', 'Bowser Purchase Today', 'Sold Today — Cash', 'Sold Today — Credit to Party', 'Outstanding (as of today)']);
  DB.bowsers.forEach(b=>{
    const e = getEntry(d);
    const purchToday = e? (e.bowserPurchase||[]).filter(r=>r.bowserId===b.id).reduce((s,r)=>s+(Number(r.amount)||0),0) : 0;
    const cashToday = e? (e.bowserSale||[]).filter(r=>r.bowserId===b.id && r.mode==='cash').reduce((s,r)=>s+(Number(r.amount)||0),0) : 0;
    const creditToday = e? (e.bowserSale||[]).filter(r=>r.bowserId===b.id && r.mode==='credit').reduce((s,r)=>s+(Number(r.amount)||0),0) : 0;
    rows.push([b.name, purchToday, cashToday, creditToday, bowserOutstanding(b.id)]);
  });
  return rows;
}

/* ---- Daily Credit Report sheet (ExcelJS — richly formatted, matches the pump's standard
   Party/Digital-Payment credit report layout: segregated sections, Pump vs Bowser credit
   split, Bowser Litres, Discount and TDS columns, sub-totals and a grand total). ---- */
function customerCreditReportRow(cu, d){
  const opening = customerOpeningBalanceOn(cu.id, d);
  const pumpCredit = customerPumpCreditForDay(cu.id, d);
  const bowserCredit = customerBowserCreditForDay(cu.id, d);
  const bowserLtrs = customerBowserCreditQtyForDay(cu.id, d);
  const amountRecd = customerReceiptsForDay(cu.id, d);
  const modeOfReceipt = customerReceiptModesForDay(cu.id, d);
  const manualDisc = (DB.expenses[d]||[]).filter(ex=>ex.category==='Discount' && ex.customerId===cu.id).reduce((s,ex)=>s+(Number(ex.amount)||0),0);
  const discount = manualDisc + autoDiscountForCustomer(cu.id, d);
  const tds = autoTDSForCustomer(cu.id, d);
  const closing = opening + pumpCredit + bowserCredit - amountRecd - discount - tds;
  return {opening, pumpCredit, bowserCredit, bowserLtrs, amountRecd, modeOfReceipt, discount, tds, closing};
}
function buildDailyCreditReportSheet(workbook, d){
  const ws = workbook.addWorksheet('Credit Report');
  ws.pageSetup = {
    paperSize: 9, orientation: 'landscape', fitToPage: true, fitToWidth: 1, fitToHeight: 1,
    horizontalCentered: true,
    margins: {left:0.3, right:0.3, top:0.4, bottom:0.4, header:0.2, footer:0.2}
  };
  const headers = ['Sl No.','Party Name','Opening','Pump Credit','Bowser Credit','Bowser Ltrs','Amount Recd','Mode of Receipt','Discount','TDS','Closing amount'];
  const headerRow = ws.addRow(headers);
  headerRow.eachCell(cell=>{ cell.font=XL_WHITE_FONT; cell.fill=XL_HEADER_FILL; cell.border=XL_THIN_BORDER; });

  function relevant(data){
    return data.opening || data.pumpCredit || data.bowserCredit || data.bowserLtrs || data.amountRecd || data.discount || data.tds;
  }
  function addSection(customers){
    let sl = 1;
    const sums = {opening:0, pumpCredit:0, bowserCredit:0, bowserLtrs:0, amountRecd:0, discount:0, tds:0, closing:0};
    let any = false;
    customers.forEach(cu=>{
      const data = customerCreditReportRow(cu, d);
      if(!relevant(data)) return;
      any = true;
      const row = ws.addRow([sl++, cu.name, data.opening, data.pumpCredit, data.bowserCredit, data.bowserLtrs||'', data.amountRecd, data.modeOfReceipt, data.discount||'', data.tds||'', data.closing]);
      row.eachCell((cell,colNum)=>{
        cell.border = XL_THIN_BORDER;
        if(typeof cell.value==='number' && colNum!==1 && colNum!==6) cell.numFmt = XL_CURRENCY_FMT;
        if(typeof cell.value==='number' && colNum===6) cell.numFmt = '#,##0.00';
      });
      Object.keys(sums).forEach(k=>{ if(k!=='closing') sums[k]+=data[k]; });
      sums.closing += data.closing;
    });
    return {sums, any};
  }
  function addTotalRow(label, sums, border){
    const row = ws.addRow([label, '', sums.opening, sums.pumpCredit, sums.bowserCredit, sums.bowserLtrs||'', sums.amountRecd, '', sums.discount||'', sums.tds||'', sums.closing]);
    row.font = XL_DARK_FONT;
    row.eachCell((cell,colNum)=>{
      cell.fill = XL_TOTAL_FILL;
      cell.border = border || XL_THIN_BORDER;
      if(typeof cell.value==='number' && colNum!==1 && colNum!==6) cell.numFmt = XL_CURRENCY_FMT;
      if(typeof cell.value==='number' && colNum===6) cell.numFmt = '#,##0.00';
    });
    ws.mergeCells(row.number, 1, row.number, 2);
    row.getCell(1).alignment = {horizontal:'center'};
    return row;
  }

  const partyCustomers = DB.customers.filter(c=>!c.isDigitalPaymentMethod);
  const digitalCustomers = DB.customers.filter(c=>c.isDigitalPaymentMethod);

  const partyResult = addSection(partyCustomers);
  addTotalRow('PARTY TOTAL', partyResult.sums);

  const digitalResult = addSection(digitalCustomers);
  addTotalRow('Digital Payment TOTAL', digitalResult.sums);

  ws.addRow([]);
  const grandSums = {};
  Object.keys(partyResult.sums).forEach(k=> grandSums[k] = (partyResult.sums[k]||0) + (digitalResult.sums[k]||0));
  addTotalRow('GRAND TOTAL', grandSums, XL_DOUBLE_BORDER);

  // Payment Report — one row gap after the Credit Report's Grand Total, then a listing of
  // that day's Payments: who was paid, why, how much, by what mode, and any remarks.
  ws.addRow([]);
  const payHeaderRow = ws.addRow(['PAYMENT REPORT']);
  payHeaderRow.font = {bold:true, size:12, color:{argb:'FF1F4E78'}};
  const payColHeaderRow = ws.addRow(['Party', 'Reason', 'Amount', 'Mode', 'Remarks']);
  payColHeaderRow.eachCell(cell=>{ cell.font=XL_WHITE_FONT; cell.fill=XL_HEADER_FILL; cell.border=XL_THIN_BORDER; });
  const payments = DB.payments[d]||[];
  let payTotal = 0;
  payments.forEach(p=>{
    const modeLabel = (p.mode!=='Cash' && p.bankId) ? (p.mode+' — '+bankName(p.bankId)) : p.mode;
    const row = ws.addRow([p.party||'', p.type||'', Number(p.amount)||0, modeLabel||'', p.remarks||'']);
    row.eachCell((cell,colNum)=>{
      cell.border = XL_THIN_BORDER;
      if(typeof cell.value==='number') cell.numFmt = XL_CURRENCY_FMT;
    });
    payTotal += Number(p.amount)||0;
  });
  if(!payments.length){
    const row = ws.addRow(['No payments recorded today.', '', '', '', '']);
    row.eachCell(cell=>{ cell.border = XL_THIN_BORDER; });
  } else {
    const totalRow = ws.addRow(['TOTAL PAYMENTS', '', payTotal, '', '']);
    totalRow.font = XL_DARK_FONT;
    totalRow.eachCell((cell,colNum)=>{
      cell.fill = XL_TOTAL_FILL;
      cell.border = XL_THIN_BORDER;
      if(typeof cell.value==='number') cell.numFmt = XL_CURRENCY_FMT;
    });
    ws.mergeCells(totalRow.number, 1, totalRow.number, 2);
  }

  ws.columns.forEach((col,i)=>{ col.width = [8,20,12,13,14,12,12,16,10,10,14][i] || 14; });
  return ws;
}

/* ---- Monthly workbook export (mirrors the pump's traditional monthly sheet set) ---- */
/* Appends a 'TOTAL' row to an Array-of-Arrays sheet, summing every numeric
   column found in the data rows below headerRowIdx — except columns whose
   header label matches skipLabels (case-insensitive substring match). This
   is used for columns that are balances/snapshots/rates rather than flows
   (e.g. 'Dip', 'Closing Cash', 'Rate', 'Opening', 'Variance'), which cannot
   be meaningfully summed across a month. */
function appendMonthlyTotalRow(rows, headerRowIdx, opts){
  opts = opts || {};
  const skipLabels = opts.skipLabels || [];
  const labelCol = opts.labelCol != null ? opts.labelCol : 0;
  const header = rows[headerRowIdx] || [];
  const totals = new Array(header.length).fill('');
  totals[labelCol] = opts.label || 'TOTAL';
  for(let c=0; c<header.length; c++){
    if(c===labelCol) continue;
    const h = String(header[c]||'');
    if(skipLabels.some(s=>h.toLowerCase().includes(s.toLowerCase()))) continue;
    let sum = 0, any = false;
    for(let r=headerRowIdx+1; r<rows.length; r++){
      const v = rows[r][c];
      if(typeof v === 'number'){ sum += v; any = true; }
    }
    if(any) totals[c] = sum;
  }
  rows.push(totals);
}

function buildMonthlyWorkbookAOA(mk){
  const days = daysInMonthArr(mk);
  const pumpName = DB.settings.companyName || '';
  const sheets = {};

  // STOCK
  {
    const rows = [];
    rows.push(['PUMP', pumpName]);
    rows.push(['MONTH', mk]);
    const groupRow = [''];
    const headRow = ['DATE'];
    fuelProducts().forEach(p=>{
      groupRow.push(p.name,'','','');
      headRow.push('Meter Sale','Testing','Purchase','Dip');
    });
    rows.push(groupRow);
    rows.push(headRow);
    const openingRow = ['Opening'];
    fuelProducts().forEach(p=>{ openingRow.push('','','', getOpeningStock(p.id, days[0])); });
    rows.push(openingRow);
    days.forEach(dt=>{
      const day = Number(dt.slice(-2));
      const r = [day];
      fuelProducts().forEach(p=>{
        const dip = actualDip(p.id,dt);
        r.push(productMeterSale(p.id,dt), testingQty(p.id,dt), purchaseQty(p.id,dt), dip!=null?dip:expectedStock(p.id,dt));
      });
      rows.push(r);
    });
    appendMonthlyTotalRow(rows, 3, {skipLabels:['Dip']});
    sheets['STOCK'] = rows;
  }

  // METER READINGS — one sheet per fuel product: date-wise rows, nozzle-wise columns
  // (Opening / Closing / Sale per nozzle), with a Total Sale column and a monthly total row.
  fuelProducts().forEach(p=>{
    const nozzleIds = new Set();
    days.forEach(dt=>nozzlesForProduct(p.id, dt).forEach(n=>nozzleIds.add(n.id)));
    const nozzles = Array.from(nozzleIds).map(id=>DB.nozzles.find(n=>n.id===id)).filter(Boolean);
    const rows = [];
    rows.push(['PUMP', pumpName]);
    rows.push(['METER READINGS — '+p.name.toUpperCase()+' FOR THE MONTH OF', mk]);
    const groupRow = [''];
    const headRow = ['Date'];
    nozzles.forEach(n=>{ groupRow.push(n.name,'',''); headRow.push('Opening','Closing','Sale'); });
    groupRow.push('');
    headRow.push('Total Sale');
    rows.push(groupRow);
    rows.push(headRow);
    days.forEach(dt=>{
      const day = Number(dt.slice(-2));
      const r = [day];
      let dayTotal = 0;
      const activeToday = nozzlesForProduct(p.id, dt);
      nozzles.forEach(n=>{
        if(activeToday.some(x=>x.id===n.id)){
          const m = getMeterEntry(n.id, dt);
          const opening = m.opening!=null? Number(m.opening) : getOpeningMeter(n.id,dt);
          const closing = m.closing!=null? Number(m.closing) : '';
          const sale = nozzleSale(n.id, dt);
          r.push(opening, closing, sale);
          dayTotal += sale;
        } else {
          r.push('','','');
        }
      });
      r.push(dayTotal);
      rows.push(r);
    });
    const totalRow = ['TOTAL'];
    nozzles.forEach(n=>{
      const nozTotal = days.reduce((s,dt)=> s + (nozzlesForProduct(p.id,dt).some(x=>x.id===n.id)? nozzleSale(n.id,dt) : 0), 0);
      totalRow.push('','', nozTotal);
    });
    totalRow.push(days.reduce((s,dt)=>s+productMeterSale(p.id,dt),0));
    rows.push(totalRow);
    const sheetName = ('METER-'+p.name).replace(/[:\\\/\?\*\[\]]/g,'').slice(0,31);
    sheets[sheetName] = rows;
  });

  // TOTAL CASH
  {
    const rows = [];
    rows.push(['PUMP', pumpName]);
    rows.push(['MONTH', mk]);
    rows.push(['Opening Cash Balance', '', 'AMOUNT RS', getOpeningCash(days[0])]);
    const head = ['Date'];
    fuelProducts().forEach(p=>head.push(p.name+' Sale Litres', p.name+' Rate', p.name+' Sale Amount'));
    head.push('Lubricant Sales','Total Sale','Direct Credit Sales','Bowser Purchase','Total Credit Sales','Cash Sales','Cash Receipts','Bowser Cash Sales','Bank/Digital/IOCL Receipts','Expenses (Cash)','Payments','Bank Deposits','Testing Expense','Closing Cash');
    rows.push(head);
    days.forEach(dt=>{
      const day = Number(dt.slice(-2));
      const r = [day];
      fuelProducts().forEach(p=>{ r.push(productMeterSale(p.id,dt), getSellingPrice(p.id,dt), fuelSaleAmount(p.id,dt)); });
      r.push(lubeSalesAmount(dt), totalSalesAmount(dt), directCreditSalesAmount(dt), bowserPurchaseAmount(dt), creditSalesAmount(dt), cashSalesAmount(dt), receiptsCashTotal(dt), bowserSaleCashAmount(dt), receiptsBankTotal(dt), cashExpensesTotal(dt), paymentsTotal(dt), depositsTotal(dt), testingCashExpense(dt), closingCash(dt));
      rows.push(r);
    });
    appendMonthlyTotalRow(rows, 3, {skipLabels:['Rate','Closing Cash']});
    sheets['TOTAL CASH'] = rows;
  }

  // PAYMENT (pivoted by Paid To / Party Name, falling back to Type if no party name was entered)
  {
    const parties = Array.from(new Set(days.flatMap(dt=>(DB.payments[dt]||[]).map(paymentPartyLabel))));
    const rows = [];
    rows.push(['PUMP', pumpName]);
    rows.push(['PAYMENT FOR THE MONTH OF', mk]);
    rows.push(['Date', ...parties, 'TOTAL PAYMENT']);
    days.forEach(dt=>{
      const day = Number(dt.slice(-2));
      const list = DB.payments[dt]||[];
      const perParty = parties.map(pt=>list.filter(p=>paymentPartyLabel(p)===pt).reduce((s,p)=>s+(Number(p.amount)||0),0));
      rows.push([day, ...perParty, paymentsTotal(dt)]);
    });
    appendMonthlyTotalRow(rows, 2);
    sheets['PAYMENT'] = rows;
  }

  // CASH RECEIPTS (pivoted by Customer — Cash mode only)
  {
    const cols = receiptCustomerColumns();
    const rows = [];
    rows.push(['PUMP', pumpName]);
    rows.push(['CASH RECEIPTS FOR THE MONTH OF', mk]);
    rows.push(['Date', ...cols.map(c=>c.label), 'Total']);
    days.forEach(dt=>{
      const day = Number(dt.slice(-2));
      const perCol = cols.map(c=>receiptAmountByCustomer(dt,'cash',c.key));
      rows.push([day, ...perCol, receiptsModeTotal(dt,'cash')]);
    });
    appendMonthlyTotalRow(rows, 2);
    sheets['CASH RECEIPTS'] = rows;
  }

  // NON-CASH RECEIPTS (pivoted by Customer — Bank + Digital + IOCL Receipts combined)
  {
    const cols = receiptCustomerColumns();
    const rows = [];
    rows.push(['PUMP', pumpName]);
    rows.push(['NON-CASH RECEIPTS (BANK / DIGITAL / IOCL) FOR THE MONTH OF', mk]);
    rows.push(['Date', ...cols.map(c=>c.label), 'Total']);
    days.forEach(dt=>{
      const day = Number(dt.slice(-2));
      const perCol = cols.map(c=>receiptAmountByCustomer(dt,'noncash',c.key));
      rows.push([day, ...perCol, receiptsBankTotal(dt)]);
    });
    appendMonthlyTotalRow(rows, 2);
    sheets['NON-CASH RECEIPTS'] = rows;
  }

  // PAYMENTS RECEIVED (flat register of every receipt this month, all modes — Cash, Bank,
  // Digital, IOCL — including transactions of any customer flagged as a Digital Payment Method)
  {
    const rows = [];
    rows.push(['PUMP', pumpName]);
    rows.push(['ALL PAYMENTS RECEIVED FOR THE MONTH OF', mk]);
    rows.push(['Sl No', 'Date', 'Mode', 'Sub Mode / Bank', 'Party / Customer / Income / Nature', 'Customer Name', 'Credit Party', 'Remarks', 'Amount']);
    let sl = 1, grand = 0;
    days.forEach(dt=>{
      (DB.receipts[dt]||[]).forEach(r=>{
        const amt = Number(r.amount)||0;
        rows.push([sl++, dt, RECEIPT_MODE_LABEL[r.mode]||r.mode, receiptSubModeLabel(r), receiptNatureLabel(r), receiptCustomerName(r), receiptCreditParty(r), r.remarks||'', amt]);
        grand += amt;
      });
      digitalCreditSaleRows(dt).forEach(cs=>{
        rows.push([sl++, dt, '', '(Credit Sale)', 'Credit Sale', cs.customerName, cs.customerName, '', cs.amount]);
        grand += cs.amount;
      });
    });
    rows.push(['', '', '', '', '', '', '', 'GRAND TOTAL', grand]);
    sheets['PAYMENTS RECEIVED'] = rows;
  }

  // CREDIT (pivoted by party name) — Customers (direct Credit Sales + Bowser-to-Party credit sales)
  // AND Bowsers (Bowser Purchase, treated just like any other customer's credit sale, per policy).
  {
    const rows = [];
    rows.push(['PUMP', pumpName]);
    rows.push(['CREDIT SALE FOR THE MONTH OF', mk]);
    rows.push(['Date', ...DB.customers.map(c=>c.name), ...DB.bowsers.map(b=>b.name+' (Bowser)'), 'TOTAL CREDIT']);
    days.forEach(dt=>{
      const day = Number(dt.slice(-2));
      const e = getEntry(dt);
      const perCust = DB.customers.map(cu=> e? (
        (e.credit||[]).filter(c=>c.customerId===cu.id).reduce((s,c)=>s+(Number(c.amount)||0),0) +
        (e.bowserSale||[]).filter(b=>b.mode==='credit' && b.customerId===cu.id).reduce((s,b)=>s+(Number(b.amount)||0),0)
      ) : 0);
      const perBowser = DB.bowsers.map(bw=> e? (e.bowserPurchase||[]).filter(x=>x.bowserId===bw.id).reduce((s,x)=>s+(Number(x.amount)||0),0) : 0);
      const total = directCreditSalesAmount(dt) + bowserSaleCreditAmount(dt) + bowserPurchaseAmount(dt);
      rows.push([day, ...perCust, ...perBowser, total]);
    });
    appendMonthlyTotalRow(rows, 2);
    sheets['CREDIT'] = rows;
  }

  // DISCOUNT (pivoted by customer name — manual Discount expenses + auto-calculated discount
  // on customers with a standing Discount Rate) — mirrors the CREDIT sheet layout.
  {
    const rows = [];
    rows.push(['PUMP', pumpName]);
    rows.push(['DISCOUNT FOR THE MONTH OF', mk]);
    rows.push(['Date', ...DB.customers.map(c=>c.name), 'TOTAL DISCOUNT']);
    days.forEach(dt=>{
      const day = Number(dt.slice(-2));
      const list = DB.expenses[dt]||[];
      const perCust = DB.customers.map(cu=>{
        const manual = list.filter(e=>e.category==='Discount' && e.customerId===cu.id).reduce((s,e)=>s+(Number(e.amount)||0),0);
        return manual + autoDiscountForCustomer(cu.id, dt);
      });
      rows.push([day, ...perCust, discountTotal(dt)]);
    });
    appendMonthlyTotalRow(rows, 2);
    sheets['DISCOUNT'] = rows;
  }

  // CUSTOMER TDS (pivoted by customer name — auto-calculated TDS at each customer's own rate,
  // applied to total credit sale net of discount) — mirrors the DISCOUNT sheet layout. Distinct from the existing
  // 'TDS' sheet below, which is about TDS deducted on PURCHASES from suppliers, a separate concept.
  {
    const rows = [];
    rows.push(['PUMP', pumpName]);
    rows.push(['CUSTOMER TDS FOR THE MONTH OF', mk]);
    rows.push(['Date', ...DB.customers.map(c=>c.name), 'TOTAL CUSTOMER TDS']);
    days.forEach(dt=>{
      const day = Number(dt.slice(-2));
      const perCust = DB.customers.map(cu=>autoTDSForCustomer(cu.id, dt));
      rows.push([day, ...perCust, autoTDSTotal(dt)]);
    });
    appendMonthlyTotalRow(rows, 2);
    sheets['CUSTOMER TDS'] = rows;
  }

  // BOWSER SALE (pivoted by customer name — sales effected BY the bowsers to parties, on credit,
  // plus a Bowser Cash Sale column for cash collections) — mirrors the CREDIT sheet layout.
  {
    const rows = [];
    rows.push(['PUMP', pumpName]);
    rows.push(['BOWSER SALE FOR THE MONTH OF', mk]);
    rows.push(['Date', ...DB.customers.map(c=>c.name), 'Bowser Cash Sale', 'TOTAL BOWSER SALE']);
    days.forEach(dt=>{
      const day = Number(dt.slice(-2));
      const e = getEntry(dt);
      const perCust = DB.customers.map(cu=> e? (e.bowserSale||[]).filter(b=>b.mode==='credit' && b.customerId===cu.id).reduce((s,b)=>s+(Number(b.amount)||0),0) : 0);
      const cashSale = bowserSaleCashAmount(dt);
      rows.push([day, ...perCust, cashSale, bowserSaleCreditAmount(dt)+cashSale]);
    });
    appendMonthlyTotalRow(rows, 2);
    sheets['BOWSER SALE'] = rows;
  }

  // BOWSER SALE (LITRES) — same layout as BOWSER SALE above, but quantities (litres) instead
  // of amounts: customer columns + a Bowser Cash Sale Litres column.
  {
    const rows = [];
    rows.push(['PUMP', pumpName]);
    rows.push(['BOWSER SALE (LITRES) FOR THE MONTH OF', mk]);
    rows.push(['Date', ...DB.customers.map(c=>c.name), 'Bowser Cash Sale (Ltrs)', 'TOTAL BOWSER SALE (Ltrs)']);
    days.forEach(dt=>{
      const day = Number(dt.slice(-2));
      const e = getEntry(dt);
      const perCust = DB.customers.map(cu=> e? (e.bowserSale||[]).filter(b=>b.mode==='credit' && b.customerId===cu.id).reduce((s,b)=>s+(Number(b.qty)||0),0) : 0);
      const cashQty = bowserSaleCashQty(dt);
      rows.push([day, ...perCust, cashQty, bowserSaleCreditQty(dt)+cashQty]);
    });
    appendMonthlyTotalRow(rows, 2);
    sheets['BOWSER SALE (LTR)'] = rows;
  }

  // BOWSER STOCK (pivoted by bowser name — Opening / Purchase Qty / Sale Qty / Closing Qty / Dip Qty / Variance)
  {
    const rows = [];
    rows.push(['PUMP', pumpName]);
    rows.push(['BOWSER STOCK (QUANTITY, LITRES) FOR THE MONTH OF', mk]);
    const head = ['Date'];
    DB.bowsers.forEach(b=>head.push(b.name+' Opening', b.name+' Purchase', b.name+' Sale', b.name+' Closing', b.name+' Dip', b.name+' Variance'));
    rows.push(head);
    days.forEach(dt=>{
      const day = Number(dt.slice(-2));
      const r = [day];
      DB.bowsers.forEach(b=>{
        const opening = bowserOpeningStock(b.id,dt);
        const purch = bowserPurchaseQty(b.id,dt);
        const sale = bowserSaleQty(b.id,dt);
        const expected = bowserExpectedStock(b.id,dt);
        const dip = bowserActualDip(b.id,dt);
        const variance = bowserStockVariance(b.id,dt);
        r.push(opening, purch, sale, dip!=null?dip:expected, dip!=null?dip:'', variance!=null?variance:'');
      });
      rows.push(r);
    });
    appendMonthlyTotalRow(rows, 2, {skipLabels:['Opening','Closing','Dip','Variance']});
    sheets['BOWSER STOCK'] = rows;
  }

  // EXPENSES (pivoted by category head)
  {
    const cats = DB.settings.expenseCategories || [];
    // Testing (dip testing) value per product — shown as informational columns
    // alongside the manually-entered expense categories, same non-cash
    // treatment as the 'Testing Expense' column on the TOTAL CASH sheet.
    const testProducts = [
      {label:'Testing Expense - Petrol', p: msProduct()},
      {label:'Testing Expense - HSD', p: hsdProduct()},
      {label:'Testing Expense - E85', p: e85Product()},
      {label:'Testing Expense - Premium Petrol', p: premiumPetrolProduct()},
    ];
    const rows = [];
    rows.push(['PUMP', pumpName]);
    rows.push(['EXPENSES FOR THE MONTH OF', mk]);
    rows.push(['Date', ...cats, ...testProducts.map(t=>t.label), 'TOTAL EXPENSES']);
    days.forEach(dt=>{
      const day = Number(dt.slice(-2));
      const list = DB.expenses[dt]||[];
      const perCat = cats.map(cat=>{
        const manual = list.filter(e=>e.category===cat).reduce((s,e)=>s+(Number(e.amount)||0),0);
        return cat==='Discount' ? manual+autoDiscountTotal(dt) : manual;
      });
      const perTest = testProducts.map(t=> t.p ? testingQty(t.p.id,dt)*getSellingPrice(t.p.id,dt) : 0);
      rows.push([day, ...perCat, ...perTest, expensesTotal(dt)]);
    });
    appendMonthlyTotalRow(rows, 2);
    sheets['EXPENSES'] = rows;
  }

  // PURCHASE (pivoted by product: Qty & Amount per day)
  {
    const rows = [];
    rows.push(['PUMP', pumpName]);
    rows.push(['PURCHASE FOR THE MONTH OF', mk]);
    const head = ['Date'];
    enabledProducts().forEach(p=>head.push(p.name+' Qty', p.name+' Amount'));
    head.push('Total Purchase Amount');
    rows.push(head);
    let grandTotal = 0;
    days.forEach(dt=>{
      const day = Number(dt.slice(-2));
      const list = getEntry(dt)?.purchases || [];
      const r = [day];
      let dayTotal = 0;
      enabledProducts().forEach(p=>{
        const rowsForProd = list.filter(x=>x.productId===p.id);
        const qty = rowsForProd.reduce((s,x)=>s+(Number(x.qty)||0),0);
        const amt = rowsForProd.reduce((s,x)=>s+(Number(x.amount)||0),0);
        dayTotal += amt;
        r.push(qty, amt);
      });
      r.push(dayTotal);
      grandTotal += dayTotal;
      rows.push(r);
    });
    appendMonthlyTotalRow(rows, 2);
    sheets['PURCHASE'] = rows;
  }

  // TDS (TDS = Total Purchase Amount × 0.10%, as specified)
  {
    const rows = [];
    rows.push(['PUMP', pumpName]);
    rows.push(['TDS REPORT FOR THE MONTH OF', mk]);
    rows.push(['TDS Rate', '0.10%']);
    rows.push([]);
    rows.push(['Date', 'Purchase Amount', 'TDS @ 0.10%']);
    let totalPurchase = 0, totalTds = 0;
    days.forEach(dt=>{
      const day = Number(dt.slice(-2));
      const list = getEntry(dt)?.purchases || [];
      const amt = list.reduce((s,x)=>s+(Number(x.amount)||0),0);
      const tds = amt*0.001;
      totalPurchase += amt; totalTds += tds;
      rows.push([day, amt, tds]);
    });
    rows.push(['TOTAL', totalPurchase, totalTds]);
    rows.push([]);
    rows.push(['Supplier-wise Purchase & TDS (for reference)']);
    rows.push(['Supplier', 'Purchase Amount', 'TDS @ 0.10%']);
    const supplierTotals = {};
    days.forEach(dt=>{
      (getEntry(dt)?.purchases || []).forEach(x=>{
        const sup = x.supplier || '(Unspecified)';
        supplierTotals[sup] = (supplierTotals[sup]||0) + (Number(x.amount)||0);
      });
    });
    Object.keys(supplierTotals).forEach(sup=>{
      rows.push([sup, supplierTotals[sup], supplierTotals[sup]*0.001]);
    });
    if(Object.keys(supplierTotals).length){
      const stp = Object.values(supplierTotals).reduce((a,b)=>a+b,0);
      rows.push(['TOTAL', stp, stp*0.001]);
    }
    sheets['TDS'] = rows;
  }

  // Party-wise pivot sheets: drop any party column that has no non-zero entry in the month.
  // The trailing summary columns (e.g. TOTAL, Bowser Cash Sale) are always kept.
  const PARTY_SHEET_TAIL = {'CREDIT':1,'CASH RECEIPTS':1,'NON-CASH RECEIPTS':1,'DISCOUNT':1,'CUSTOMER TDS':1,'BOWSER SALE':2,'BOWSER SALE (LTR)':2,'EXPENSES':1};
  Object.keys(PARTY_SHEET_TAIL).forEach(name=>{
    const rows = sheets[name];
    if(!rows) return;
    const h = monthlyHeaderRowIdx(rows);
    if(h<0) return;
    const width = rows[h].length, tail = PARTY_SHEET_TAIL[name];
    const keep = [0];
    for(let c=1; c<width; c++){
      if(c >= width-tail){ keep.push(c); continue; }
      let any = false;
      for(let r=h+1; r<rows.length && !any; r++){
        if(isMonthlyTotalRow(rows[r])) continue;
        const v = rows[r][c];
        if(typeof v==='number' && Math.abs(v)>TOTALS_TOLERANCE) any = true;
      }
      if(any) keep.push(c);
    }
    if(keep.length===width) return;
    sheets[name] = rows.map(r=> r.length ? keep.map(c=>r[c]===undefined?'':r[c]) : r);
  });

  return sheets;
}

/* ---------------------- Replace Meter (meter-change) modal ---------------------- */
function openReplaceMeterModal(oldNozzleId){
  const oldNoz = DB.nozzles.find(n=>n.id===oldNozzleId);
  if(!oldNoz) return;
  const root = document.getElementById('modalRoot');
  root.innerHTML = `<div class="modal-overlay"><div class="modal">
    <h2>Replace Meter — ${esc(oldNoz.name)}</h2>
    <p class="helptext">Today's closing reading for "${esc(oldNoz.name)}" has been saved as its final reading (as of ${fmtDateHuman(currentDate)}). Enter the details of the new meter being installed in its place.</p>
    <div class="grid cols-2">
      <div class="field"><label>New Meter Name</label><input id="rm_name" value="Nozzle ${DB.nozzles.filter(n=>n.productId===oldNoz.productId).length+1}"></div>
      <div class="field"><label>New Meter Opening Reading</label><input type="number" step="0.01" id="rm_opening"></div>
    </div>
    <div class="mt right flex gap" style="justify-content:flex-end;">
      <button class="btn ghost" id="rmCancel">Cancel</button>
      <button class="btn accent" id="rmConfirm">Confirm Replacement</button>
    </div>
  </div></div>`;
  document.getElementById('rmCancel').onclick = ()=>{ root.innerHTML=''; };
  document.getElementById('rmConfirm').onclick = ()=>{
    const newName = document.getElementById('rm_name').value.trim() || 'New Meter';
    const newOpening = parseFloat(document.getElementById('rm_opening').value)||0;
    oldNoz.deactivatedDate = currentDate;
    oldNoz.active = false;
    DB.nozzles.push({
      id: uid(), productId: oldNoz.productId, name: newName,
      openingReading: newOpening, createdDate: currentDate, deactivatedDate: null, active: true
    });
    saveKey('nozzles');
    root.innerHTML = '';
    render();
    toast('Meter replaced — "'+esc(oldNoz.name)+'" deactivated, "'+esc(newName)+'" now active');
  };
}

/* ---------------------- Edit Invoice/Slip No. modal (Credit Sales) ----------------------
   Slip numbers for credit sales are sometimes not available at the time of entry (the
   physical slip arrives from the customer a few days later), so this lets the number be
   corrected afterwards without deleting and re-entering the whole row. */
function openEditSlipModal(source, idx){
  const e = ensureEntry(currentDate);
  let record, currentValue, label;
  if(source==='credit'){
    record = e.credit[idx];
    if(!record) return;
    currentValue = record.invoice||'';
    label = (DB.customers.find(c=>c.id===record.customerId)?.name||'Credit Sale');
  } else if(source==='bowserSale'){
    record = e.bowserSale[idx];
    if(!record) return;
    currentValue = record.remarks||'';
    label = (DB.customers.find(c=>c.id===record.customerId)?.name||'Bowser Sale');
  } else {
    return; // bowserPurchase rows have no invoice/slip field
  }
  const root = document.getElementById('modalRoot');
  root.innerHTML = `<div class="modal-overlay"><div class="modal">
    <h2>Edit Invoice / Slip No.</h2>
    <p class="helptext">${esc(label)} — ${fmtDateHuman(currentDate)}</p>
    <div class="field"><label>Invoice / Slip No.</label><input id="es_val" value="${esc(currentValue)}" autofocus></div>
    <div class="mt right flex gap" style="justify-content:flex-end;">
      <button class="btn ghost" id="esCancel">Cancel</button>
      <button class="btn accent" id="esSave">Save</button>
    </div>
  </div></div>`;
  const input = document.getElementById('es_val');
  input.focus(); input.select();
  document.getElementById('esCancel').onclick = ()=>{ root.innerHTML=''; };
  document.getElementById('esSave').onclick = ()=>{
    const newValue = input.value;
    if(source==='credit') record.invoice = newValue;
    else if(source==='bowserSale') record.remarks = newValue;
    saveKey('dailyEntries');
    root.innerHTML = '';
    render();
    toast('Invoice / Slip No. updated');
  };
  input.onkeydown = (ev)=>{ if(ev.key==='Enter') document.getElementById('esSave').click(); };
}

/* ---------------------- Multi Sale Entry modal (Credit Sales) ---------------------- */
function openMultiSaleModal(customerId){
  const cust = DB.customers.find(c=>c.id===customerId);
  if(!cust) return;
  const root = document.getElementById('modalRoot');
  const initialRows = 6;
  let nextIdx = 0;
  function rowHTML(i){
    return `<tr data-ms-row="${i}">
      <td><input value="${esc(fmtDateHuman(currentDate))}" disabled style="min-width:100px;background:var(--surface-2,#eee);"></td>
      <td><input value="${esc(cust.name)}" disabled style="min-width:130px;background:var(--surface-2,#eee);"></td>
      <td><input data-ms-invoice="${i}" style="width:100px;"></td>
      <td><input data-ms-vehicle="${i}" style="width:110px;"></td>
      <td><select data-ms-product="${i}">${enabledProducts().map(p=>`<option value="${p.id}" ${/hsd|diesel/i.test(p.name)?'selected':''}>${esc(p.name)}</option>`).join('')}</select></td>
      <td><input type="number" step="0.01" data-ms-qty="${i}" style="width:90px;text-align:right;"></td>
      <td><input type="number" step="0.01" data-ms-amount="${i}" style="width:110px;text-align:right;"></td>
    </tr>`;
  }
  function recalcTotals(){
    let totalQty = 0, totalAmt = 0;
    root.querySelectorAll('#msTable tbody tr').forEach(tr=>{
      const qtyInp = tr.querySelector('[data-ms-qty]');
      const amtInp = tr.querySelector('[data-ms-amount]');
      if(!qtyInp || !amtInp) return;
      const qty = parseFloat(qtyInp.value);
      const amt = parseFloat(amtInp.value);
      if(qty>0){ totalQty += qty; totalAmt += (amt>0? amt : 0); }
    });
    const qtyCell = document.getElementById('msTotalQty');
    const amtCell = document.getElementById('msTotalAmt');
    if(qtyCell) qtyCell.textContent = fmtQty(totalQty);
    if(amtCell) amtCell.textContent = fmt(totalAmt);
  }
  function bindRowAutocalc(i){
    const qtyInp = root.querySelector('[data-ms-qty="'+i+'"]');
    const prodSel = root.querySelector('[data-ms-product="'+i+'"]');
    const amtInp = root.querySelector('[data-ms-amount="'+i+'"]');
    function recalc(){
      const qty = parseFloat(qtyInp.value);
      const pid = prodSel.value;
      if(qty>0 && pid){ amtInp.value = (qty*getSellingPrice(pid,currentDate)).toFixed(2); }
      recalcTotals();
    }
    if(qtyInp){ qtyInp.oninput = recalc; prodSel.onchange = recalc; amtInp.oninput = recalcTotals; }
  }
  let rowsHTML = '';
  for(; nextIdx<initialRows; nextIdx++) rowsHTML += rowHTML(nextIdx);
  root.innerHTML = `<div class="modal-overlay"><div class="modal" style="max-width:920px;">
    <h2>Multi Sale Entry — ${esc(cust.name)}</h2>
    <p class="helptext">Enter several credit sale transactions for this party on ${fmtDateHuman(currentDate)} in one go. Date and Party are locked to your current selection — rows left with no Quantity are ignored.</p>
    <div class="table-wrap"><table class="data" id="msTable">
      <thead><tr><th>Date</th><th>Party</th><th>Invoice / Slip No.</th><th>Vehicle No.</th><th>Product</th><th class="right">Quantity</th><th class="right">Amount</th></tr></thead>
      <tbody>${rowsHTML}</tbody>
      <tfoot><tr style="font-weight:700;"><td colspan="5">Total</td><td class="right num" id="msTotalQty">0.00</td><td class="right num" id="msTotalAmt">0.00</td></tr></tfoot>
    </table></div>
    <button class="btn ghost small mt" id="msAddRowBtn">+ Add Row</button>
    <div class="mt right flex gap" style="justify-content:flex-end;">
      <button class="btn ghost" id="msCancel">Cancel</button>
      <button class="btn accent" id="msSaveAll">Save All</button>
    </div>
  </div></div>`;
  for(let i=0;i<initialRows;i++) bindRowAutocalc(i);
  document.getElementById('msAddRowBtn').onclick = ()=>{
    document.querySelector('#msTable tbody').insertAdjacentHTML('beforeend', rowHTML(nextIdx));
    bindRowAutocalc(nextIdx);
    nextIdx++;
  };
  document.getElementById('msCancel').onclick = ()=>{ root.innerHTML=''; };
  document.getElementById('msSaveAll').onclick = ()=>{
    const e = ensureEntry(currentDate);
    let count = 0;
    root.querySelectorAll('#msTable tbody tr').forEach(tr=>{
      const qtyInp = tr.querySelector('[data-ms-qty]');
      if(!qtyInp) return;
      const qty = parseFloat(qtyInp.value);
      if(!(qty>0)) return;
      const amount = parseFloat(tr.querySelector('[data-ms-amount]').value)||0;
      const invoice = tr.querySelector('[data-ms-invoice]').value;
      const vehicle = tr.querySelector('[data-ms-vehicle]').value;
      const productId = tr.querySelector('[data-ms-product]').value;
      e.credit.push({customerId, vehicle, productId, qty, amount, invoice});
      count++;
    });
    if(!count){ toast('Enter at least one row with a quantity'); return; }
    saveKey('dailyEntries');
    root.innerHTML = '';
    render();
    toast(count+' credit sale'+(count>1?'s':'')+' added for '+cust.name);
  };
}

}

      <p class="helptext">Logos are stored locally in this browser and printed on every report. We can't bundle the official Indian Oil / HPCL / BPCL artwork ourselves (it's their trademark) — please upload your own copy of the corporation's logo file here, and it'll be used exactly like the dealer logo. You can skip this and add logos later from Backup & Restore → Settings.</p>

function bindWizardEvents(){
  const wizChooseNew = document.getElementById('wizChooseNew');
  if(wizChooseNew) wizChooseNew.onclick = ()=>{ wizardState.step=1; showWizardStep(); };
  const wizChooseImport = document.getElementById('wizChooseImport');
  const wizImportFileInput = document.getElementById('wizImportFileInput');
  if(wizChooseImport) wizChooseImport.onclick = ()=>{ wizImportFileInput.click(); };
  if(wizImportFileInput) wizImportFileInput.onchange = (ev)=>{
    const file = ev.target.files[0];
    if(!file) return;
    restoreBackupFile(file, {firstRun:true, skipConfirm:true, onDone:(ok)=>{
      ev.target.value='';
      if(ok){
        document.getElementById('modalRoot').innerHTML='';
        applyTheme(); buildNav(); renderLogos();
        currentDate = lastDateWithData() || DB.settings.startDate || todayStr();
        const dateInput = document.getElementById('globalDate');
        if(dateInput) dateInput.value = currentDate;
        render();
        toast('Backup restored — welcome back!');
      } else {
        toast('Could not restore — please check the file and try again.');
      }
    }});
  };
  const wizBack0 = document.getElementById('wizBack0');
  if(wizBack0) wizBack0.onclick = ()=>{ wizardState.step=0; showWizardStep(); };
  const wizNext1 = document.getElementById('wizNext1');
  if(wizNext1) wizNext1.onclick = ()=>{
    wizardState.company = document.getElementById('w_company').value;
    wizardState.month = document.getElementById('w_month').value;
    wizardState.startDate = document.getElementById('w_startdate').value;
    wizardState.openingCash = parseFloat(document.getElementById('w_openingcash').value)||0;
    wizardState.step=2; showWizardStep();
  };
  const wizBack1b = document.getElementById('wizBack1b');
  if(wizBack1b) wizBack1b.onclick = ()=>{ wizardState.step=1; showWizardStep(); };
  const wizNext1b = document.getElementById('wizNext1b');
  if(wizNext1b) wizNext1b.onclick = async ()=>{
    wizardState.brand = document.getElementById('w_brand').value;
    const clFile = document.getElementById('w_companylogo').files[0];
    const dlFile = document.getElementById('w_dealerlogo').files[0];
    if(clFile) wizardState.companyLogo = await fileToDataURL(clFile);
    if(dlFile) wizardState.dealerLogo = await fileToDataURL(dlFile);
    wizardState.companyAddress = document.getElementById('w_companyaddress').value;
    wizardState.companyPhone = document.getElementById('w_companyphone').value;
    wizardState.companyEmail = document.getElementById('w_companyemail').value;
    wizardState.companyGST = document.getElementById('w_companygst').value;
    wizardState.companyVAT = document.getElementById('w_companyvat').value;
    wizardState.bankName = document.getElementById('w_bankname').value;
    wizardState.bankAccountNo = document.getElementById('w_bankaccountno').value;
    wizardState.bankIFSC = document.getElementById('w_bankifsc').value;
    const sigFile = document.getElementById('w_signature').files[0];
    if(sigFile) wizardState.signatureImage = await fileToDataURL(sigFile);
    wizardState.step=3; showWizardStep();
  };
  const wizBack2 = document.getElementById('wizBack2');
  if(wizBack2) wizBack2.onclick = ()=>{ wizardState.step=2; showWizardStep(); };
  const wizNext2 = document.getElementById('wizNext2');
  if(wizNext2) wizNext2.onclick = ()=>{
    document.querySelectorAll('[data-w-enabled]').forEach(inp=>wizardState.products[+inp.dataset.wEnabled].enabled=inp.checked);
    document.querySelectorAll('[data-w-name]').forEach(inp=>wizardState.products[+inp.dataset.wName].name=inp.value);
    document.querySelectorAll('[data-w-opening]').forEach(inp=>wizardState.products[+inp.dataset.wOpening].openingStock=parseFloat(inp.value)||0);
    wizardState.step=4; showWizardStep();
  };
  const wizBack3 = document.getElementById('wizBack3');
  if(wizBack3) wizBack3.onclick = ()=>{ wizardState.step=3; showWizardStep(); };
  document.querySelectorAll('[data-add-nozzle-w]').forEach(b=>b.onclick=()=>{
    const p = wizardState.products.find(x=>x.id===b.dataset.addNozzleW);
    p.nozzles.push({name:'Nozzle '+(p.nozzles.length+1), opening:0});
    showWizardStep();
  });
  document.querySelectorAll('[data-wn-del]').forEach(b=>b.onclick=()=>{
    const [pid,ni] = b.dataset.wnDel.split(':');
    const p = wizardState.products.find(x=>x.id===pid);
    p.nozzles.splice(+ni,1);
    showWizardStep();
  });
  document.querySelectorAll('[data-wn-name]').forEach(inp=>inp.onchange=()=>{
    const [pid,ni] = inp.dataset.wnName.split(':');
    wizardState.products.find(x=>x.id===pid).nozzles[+ni].name = inp.value;
  });
  document.querySelectorAll('[data-wn-opening]').forEach(inp=>inp.onchange=()=>{
    const [pid,ni] = inp.dataset.wnOpening.split(':');
    wizardState.products.find(x=>x.id===pid).nozzles[+ni].opening = parseFloat(inp.value)||0;
  });
  const wizFinish = document.getElementById('wizFinish');
  if(wizFinish) wizFinish.onclick = ()=>{
    document.querySelectorAll('[data-wn-name]').forEach(inp=>{
      const [pid,ni] = inp.dataset.wnName.split(':');
      wizardState.products.find(x=>x.id===pid).nozzles[+ni].name = inp.value;
    });
    document.querySelectorAll('[data-wn-opening]').forEach(inp=>{
      const [pid,ni] = inp.dataset.wnOpening.split(':');
      wizardState.products.find(x=>x.id===pid).nozzles[+ni].opening = parseFloat(inp.value)||0;
    });
    // commit to DB
    DB.settings.companyName = wizardState.company||'';
    DB.settings.month = wizardState.month;
    DB.settings.year = (wizardState.month||todayStr().slice(0,7)).split('-')[0];
    DB.settings.startDate = wizardState.startDate||todayStr();
    DB.settings.openingCash = wizardState.openingCash||0;
    DB.settings.brand = wizardState.brand||'';
    DB.settings.companyLogo = wizardState.companyLogo||'';
    DB.settings.dealerLogo = wizardState.dealerLogo||'';
    DB.settings.companyAddress = wizardState.companyAddress||'';
    DB.settings.companyPhone = wizardState.companyPhone||'';
    DB.settings.companyEmail = wizardState.companyEmail||'';
    DB.settings.companyGST = wizardState.companyGST||'';
    DB.settings.companyVAT = wizardState.companyVAT||'';
    DB.settings.bankName = wizardState.bankName||'';
    DB.settings.bankAccountNo = wizardState.bankAccountNo||'';
    DB.settings.bankIFSC = wizardState.bankIFSC||'';
    DB.settings.signatureImage = wizardState.signatureImage||'';
    DB.settings.setupDone = true;
    DB.products = wizardState.products.map(p=>({
      id:p.id, name:p.name, type:p.type, enabled:p.enabled,
      openingStock:p.openingStock||0, sellingPrice:0
    }));
    DB.nozzles = [];
    wizardState.products.filter(p=>p.type==='fuel'&&p.enabled).forEach(p=>{
      (p.nozzles||[]).forEach(n=>{
        DB.nozzles.push({id:uid(), productId:p.id, name:n.name, openingReading:n.opening||0, createdDate:null, deactivatedDate:null, active:true});
      });
    });
    saveAll();
    document.getElementById('modalRoot').innerHTML='';
    currentDate = DB.settings.startDate || todayStr();
    document.getElementById('globalDate').value = currentDate;
    buildNav();
    renderLogos();
    navigate('dashboard');
    toast('Setup complete');
  };
}

/* ---------------------- Init ---------------------- */
/* Surface unexpected JS errors as a visible toast instead of silently doing nothing —
   this makes it obvious (and reportable) if a button or save action ever fails. */
window.addEventListener('error', (ev)=>{
  try{ toast('Something went wrong: '+(ev.message||'unknown error')+'. Please refresh and try again, or report this.'); }catch(e){}
});

/* Disable up/down arrow key (and scroll-wheel) increment/decrement on number inputs —
   not needed for this data-entry workflow and prevents accidental value changes. */
document.addEventListener('keydown', (ev)=>{
  if(ev.target && ev.target.tagName==='INPUT' && ev.target.type==='number' && (ev.key==='ArrowUp'||ev.key==='ArrowDown')){
    ev.preventDefault();
  }
});
document.addEventListener('wheel', (ev)=>{
  if(ev.target && ev.target.tagName==='INPUT' && ev.target.type==='number' && document.activeElement===ev.target){
    ev.target.blur();
  }
}, {passive:true});

/* Remind the user to export a backup before leaving the page.
   Browsers do not allow a silent/automatic file download on tab-close for security reasons,
   and modern browsers show their own generic message instead of custom text — but the native
   "leave site?" confirmation still gives the user a chance to go back and export first. */
window.addEventListener('beforeunload', function(e){
  e.preventDefault();
  e.returnValue = 'Have you exported a backup of your data? Go to Backup & Restore to save a copy before leaving.';
  return e.returnValue;
});

function init(){
  loadDB();
  applyTheme();
  buildNav();
  renderLogos();

  document.getElementById('menuBtn').onclick = ()=> document.getElementById('sidebar').classList.toggle('open');
  document.getElementById('navlist').addEventListener('click', (ev)=>{
    const a = ev.target.closest('a[data-route]');
    if(a){ ev.preventDefault(); navigate(a.dataset.route); }
  });

  const dateInput = document.getElementById('globalDate');
  currentDate = (location.hash && DB.settings.setupDone) ? currentDate : (lastDateWithData() || DB.settings.startDate || todayStr());
  dateInput.value = currentDate;
  dateInput.onchange = ()=>{ currentDate = dateInput.value; render(); };

  const hashRoute = location.hash.replace('#','');
  if(hashRoute && ROUTES.some(g=>g.items.some(i=>i.id===hashRoute))) currentRoute = hashRoute;

  if(!DB.settings.setupDone){
    runSetupWizard();
  } else {
    render();
  }
}
init();
</script>
