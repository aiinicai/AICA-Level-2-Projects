<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGrad" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#1e3a8a" />
      <stop offset="60%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </radialGradient>

    <!-- Gold Gradients -->
    <linearGradient id="goldLight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="30%" stop-color="#f59e0b" />
      <stop offset="70%" stop-color="#d97706" />
      <stop offset="100%" stop-color="#78350f" />
    </linearGradient>

    <linearGradient id="goldShine" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#b45309" />
      <stop offset="40%" stop-color="#fbbf24" />
      <stop offset="60%" stop-color="#fffbeb" />
      <stop offset="80%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#92400e" />
    </linearGradient>

    <linearGradient id="ribbonGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#b91c1c" />
      <stop offset="50%" stop-color="#dc2626" />
      <stop offset="100%" stop-color="#7f1d1d" />
    </linearGradient>

    <!-- Drop Shadow -->
    <filter id="dropShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- App Rounded Squircle Container -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />

  <!-- Outer Golden Royal Ring -->
  <circle cx="256" cy="240" r="190" fill="none" stroke="url(#goldShine)" stroke-width="5" opacity="0.4"/>
  <circle cx="256" cy="240" r="176" fill="#091224" stroke="url(#goldLight)" stroke-width="8" filter="url(#dropShadow)"/>
  <circle cx="256" cy="240" r="162" fill="none" stroke="url(#goldShine)" stroke-width="2.5" stroke-dasharray="8 6"/>
  <circle cx="256" cy="240" r="148" fill="#0b1730" stroke="url(#goldLight)" stroke-width="4"/>

  <!-- Royal Stars around the circle -->
  <g fill="url(#goldShine)">
    <polygon points="256,104 259,112 267,112 261,117 263,125 256,120 249,125 251,117 245,112 253,112" />
    <polygon points="176,128 179,134 186,134 181,139 183,146 176,142 169,146 171,139 166,134 173,134" transform="scale(0.8) translate(50, 40)" />
    <polygon points="336,128 339,134 346,134 341,139 343,146 336,142 329,146 331,139 326,134 333,134" transform="scale(0.8) translate(70, 40)" />
  </g>

  <!-- Scales of Justice Symbol in Top Center of Emblem -->
  <g stroke="url(#goldShine)" stroke-width="2.5" fill="none" stroke-linecap="round">
    <!-- Center balance beam pole -->
    <line x1="256" y1="135" x2="256" y2="175" stroke-width="3.5" />
    <!-- Horizontal beam -->
    <line x1="228" y1="145" x2="284" y2="145" stroke-width="3" />
    <!-- Center finial -->
    <circle cx="256" cy="133" r="3.5" fill="url(#goldLight)" />
    <!-- Left Pan Strings & Pan -->
    <line x1="228" y1="145" x2="220" y2="160" stroke-width="1.5" />
    <line x1="228" y1="145" x2="236" y2="160" stroke-width="1.5" />
    <path d="M216 160 Q228 166 240 160 Z" fill="url(#goldLight)" />
    <!-- Right Pan Strings & Pan -->
    <line x1="284" y1="145" x2="276" y2="160" stroke-width="1.5" />
    <line x1="284" y1="145" x2="292" y2="160" stroke-width="1.5" />
    <path d="M272 160 Q284 166 296 160 Z" fill="url(#goldLight)" />
  </g>

  <!-- Central Partnership Handshake (Bold, Royal Gold) -->
  <g filter="url(#dropShadow)">
    <!-- Left Partner Arm / Sleeve -->
    <path d="M142 270 L188 235 L215 255 L170 295 Z" fill="#1e3a8a" stroke="url(#goldLight)" stroke-width="3"/>
    <!-- Left Partner Cuff -->
    <rect x="180" y="235" width="10" height="42" transform="rotate(38 185 256)" fill="url(#goldShine)" rx="3"/>

    <!-- Right Partner Arm / Sleeve -->
    <path d="M370 270 L324 235 L297 255 L342 295 Z" fill="#0f172a" stroke="url(#goldLight)" stroke-width="3"/>
    <!-- Right Partner Cuff -->
    <rect x="322" y="235" width="10" height="42" transform="rotate(-38 327 256)" fill="url(#goldShine)" rx="3"/>

    <!-- Left Hand Clasping -->
    <path d="M205 252 
             C218 240, 238 238, 252 248 
             L274 264 
             C280 268, 278 276, 270 280 
             L246 292 
             C232 298, 218 288, 210 278 Z" 
          fill="url(#goldLight)" stroke="#92400e" stroke-width="2"/>

    <!-- Right Hand Clasping (Fingers wrapping over) -->
    <path d="M305 252 
             C295 242, 275 238, 260 250 
             L244 262 
             C236 268, 238 278, 248 282 
             L272 292 
             C286 298, 298 288, 305 278 Z" 
          fill="url(#goldShine)" stroke="#78350f" stroke-width="2"/>

    <!-- Interlocked Finger Creases -->
    <path d="M246 256 C255 264, 265 270, 274 278" stroke="#78350f" stroke-width="3" stroke-linecap="round" fill="none"/>
    <path d="M240 266 C248 273, 258 279, 266 286" stroke="#78350f" stroke-width="3" stroke-linecap="round" fill="none"/>
    <path d="M234 276 C242 282, 250 288, 258 294" stroke="#78350f" stroke-width="2.5" stroke-linecap="round" fill="none"/>
  </g>

  <!-- Laurel Wreath of Legal Trust (Flanking Left & Right) -->
  <g fill="url(#goldLight)" opacity="0.85">
    <!-- Left Leaves -->
    <ellipse cx="140" cy="205" rx="14" ry="7" transform="rotate(-35 140 205)"/>
    <ellipse cx="132" cy="235" rx="14" ry="7" transform="rotate(-15 132 235)"/>
    <ellipse cx="135" cy="265" rx="14" ry="7" transform="rotate(15 135 265)"/>
    <ellipse cx="148" cy="295" rx="14" ry="7" transform="rotate(35 148 295)"/>
    <!-- Right Leaves -->
    <ellipse cx="372" cy="205" rx="14" ry="7" transform="rotate(35 372 205)"/>
    <ellipse cx="380" cy="235" rx="14" ry="7" transform="rotate(15 380 235)"/>
    <ellipse cx="377" cy="265" rx="14" ry="7" transform="rotate(-15 377 265)"/>
    <ellipse cx="364" cy="295" rx="14" ry="7" transform="rotate(-35 364 295)"/>
  </g>

  <!-- Legal Deed Ribbon Banner Below Emblem -->
  <g filter="url(#dropShadow)">
    <!-- Red Seal Ribbon Tails -->
    <polygon points="215,395 190,465 220,445 250,465 240,395" fill="url(#ribbonGrad)"/>
    <polygon points="297,395 272,465 302,445 332,465 322,395" fill="url(#ribbonGrad)"/>

    <!-- Wax Seal Gold Medallion Center Bottom -->
    <circle cx="256" cy="385" r="38" fill="url(#goldShine)" stroke="#78350f" stroke-width="3"/>
    <circle cx="256" cy="385" r="30" fill="#7f1d1d" stroke="url(#goldLight)" stroke-width="2"/>
    <!-- Indian Emblem / Scales Monogram in Seal -->
    <text x="256" y="394" font-family="'Cinzel', serif" font-size="24" font-weight="900" fill="url(#goldLight)" text-anchor="middle">⚖</text>
  </g>

  <!-- Bottom Arch Text: PARTNERSHIP DEED -->
  <text x="256" y="342" font-family="'Cinzel', 'Times New Roman', serif" font-size="19" font-weight="800" letter-spacing="4" fill="url(#goldShine)" text-anchor="middle">LEGAL CONVEYANCE</text>
</svg>