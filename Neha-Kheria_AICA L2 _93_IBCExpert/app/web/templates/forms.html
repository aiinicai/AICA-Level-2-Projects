{% extends "base.html" %}{% block content %}<h1>Forms</h1><div class="grid-2"><section class="card"><h2>Add local template</h2><form method="post" action="/forms/templates"><input type="hidden" name="csrf_token" value="{{csrf_token}}"><label>Name<input name="name" required></label><label>Code<input name="form_code"></label><label>Classification<select name="classification"><option>PRACTITIONER_TEMPLATE</option><option>DRAFT_UNVERIFIED</option></select></label><label>Content<textarea name="template_content" rows="10" required></textarea></label><button>Save template</button></form></section><section class="card"><h2>Generate</h2><form method="post" action="/forms/generate"><input type="hidden" name="csrf_token" value="{{csrf_token}}"><select name="form_id">{% for f in forms %}<option value="{{f.id}}">{{f.name}}</option>{% endfor %}</select><select name="matter_id">{% for m in matters %}<option value="{{m.id}}">{{m.client_name}} · {{m.title}}</option>{% endfor %}</select><button>Generate</button></form></section></div><section class="card"><h2>Generated versions</h2>{% for v in versions %}<p><a href="/forms/{{v.id}}">{{v.form_name}} v{{v.version_number}}</a> · {{v.matter_title or ''}}</p>{% else %}<p>No generated forms.</p>{% endfor %}</section>{% endblock %}
