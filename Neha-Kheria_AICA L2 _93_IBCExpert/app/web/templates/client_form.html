{% extends "base.html" %}
{% block title %}{{ 'Edit' if mode=='edit' else 'Add' }} Client · IBC Expert{% endblock %}
{% block content %}
<div class="page-heading"><div><p class="eyebrow">Client Master</p><h1>{{ 'Edit client' if mode=='edit' else 'Add client' }}</h1></div><a class="button secondary" href="{{ '/clients/' ~ client.id if client else '/clients' }}">Cancel</a></div>
<form method="post" action="{{ '/clients/' ~ client.id ~ '/edit' if client else '/clients/new' }}" class="panel form-grid">
  <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
  {% if client %}<input type="hidden" name="row_version" value="{{ client.row_version }}">{% endif %}
  <label>Client name<input name="name" maxlength="300" required value="{{ client.name if client else '' }}"></label>
  <label>Corporate debtor<input name="corporate_debtor" value="{{ client.corporate_debtor or '' if client else '' }}"></label>
  <label>CIN<input name="cin" value="{{ client.cin or '' if client else '' }}"></label>
  <label>PAN<input name="pan" value="{{ client.pan or '' if client else '' }}"></label>
  <label>GST<input name="gst" value="{{ client.gst or '' if client else '' }}"></label>
  <label>Industry<input name="industry" value="{{ client.industry or '' if client else '' }}"></label>
  <label>Email<input type="email" name="primary_email" value="{{ client.primary_email or '' if client else '' }}"></label>
  <label>Phone<input name="primary_phone" value="{{ client.primary_phone or '' if client else '' }}"></label>
  <label class="wide">Registered office<textarea name="registered_office" rows="3">{{ client.registered_office or '' if client else '' }}</textarea></label>
  <label class="wide">Notes<textarea name="notes" rows="5">{{ client.notes or '' if client else '' }}</textarea></label>
  <label class="wide">Custom fields (JSON)<textarea name="custom_fields" rows="4">{{ client.custom_fields|tojson if client else '{}' }}</textarea></label>
  <div class="wide actions"><button class="primary" type="submit">{{ 'Save changes' if mode=='edit' else 'Create client' }}</button></div>
</form>
{% endblock %}
