{% extends "base.html" %}
{% block title %}First setup · IBC Expert{% endblock %}
{% block auth_content %}
<section class="auth-card">
  <div class="brand auth-brand">IBC <span>EXPERT</span></div>
  <h1>First-time secure setup</h1>
  <p class="muted">Create the local owner account. Your password is not stored in plaintext.</p>
  <form method="post" action="/setup" class="stack-form">
    <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
    <label>User ID<input name="username" minlength="3" maxlength="64" required autocomplete="username"></label>
    <label>Display name<input name="display_name" maxlength="120" required autocomplete="name"></label>
    <label>Master password<input type="password" name="password" minlength="12" required autocomplete="new-password"></label>
    <label>Confirm password<input type="password" name="password_confirm" minlength="12" required autocomplete="new-password"></label>
    <button class="primary" type="submit">Create secure account</button>
  </form>
</section>
{% endblock %}
