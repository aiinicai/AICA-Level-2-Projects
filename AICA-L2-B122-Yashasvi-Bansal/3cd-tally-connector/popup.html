<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <style>
    body { font: 13px system-ui, sans-serif; width: 300px; margin: 0; padding: 14px; color: #0f172a; }
    h1 { font-size: 14px; margin: 0 0 8px; }
    label { display: block; font-size: 12px; color: #475569; margin: 10px 0 4px; }
    input { width: 100%; box-sizing: border-box; padding: 6px 8px; border: 1px solid #cbd5e1; border-radius: 6px; }
    button { margin-top: 10px; width: 100%; padding: 8px; border: 0; border-radius: 6px; background: #0b1f44; color: #fff; font-weight: 600; cursor: pointer; }
    #status { margin-top: 10px; font-size: 12px; white-space: pre-line; }
    .ok { color: #047857; } .bad { color: #b91c1c; }
    p { font-size: 11px; color: #64748b; }
  </style>
</head>
<body>
  <h1>3CD Helper – Tally Connector</h1>
  <label for="url">Tally address on this computer</label>
  <input id="url" placeholder="http://localhost:9000" />
  <button id="test">Save &amp; check Tally</button>
  <div id="status"></div>
  <p>In TallyPrime: F1 Help → Settings → Connectivity → "TallyPrime acts as" Server (or Both), port 9000. Keep the company open.
     Then click <b>Tally से लाएँ</b> in the Clause 31 upload screen of 3CD Helper. The connector only reads from Tally.</p>
  <script src="tally-lib.js"></script>
  <script src="popup.js"></script>
</body>
</html>
