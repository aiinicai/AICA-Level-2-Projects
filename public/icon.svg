<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a192f"/>
      <stop offset="100%" stop-color="#0f2b48"/>
    </linearGradient>
    <linearGradient id="tealGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe"/>
      <stop offset="100%" stop-color="#4facfe"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
  </defs>
  <!-- Background with rounded squircle safe zone -->
  <rect width="512" height="512" rx="110" fill="url(#bg)"/>
  
  <!-- Subtle tech grid circles -->
  <circle cx="256" cy="256" r="180" stroke="rgba(20, 184, 166, 0.15)" stroke-width="2" fill="none"/>
  <circle cx="256" cy="256" r="130" stroke="rgba(20, 184, 166, 0.25)" stroke-width="1.5" stroke-dasharray="8 6" fill="none"/>
  
  <!-- Modern Fintech Shield & Dirham Emblem -->
  <path d="M256 90 L370 140 V260 C370 340 256 410 256 410 C256 410 142 340 142 260 V140 Z" fill="#0d253f" stroke="url(#tealGrad)" stroke-width="8"/>
  
  <!-- Inner Dynamic Chart & Dirham 'د.إ' / AED Symbol Motif -->
  <!-- Ascending growth bar 1 -->
  <rect x="200" y="270" width="22" height="60" rx="6" fill="#14b8a6"/>
  <!-- Ascending growth bar 2 -->
  <rect x="235" y="230" width="22" height="100" rx="6" fill="#2dd4bf"/>
  <!-- Ascending growth bar 3 -->
  <rect x="270" y="190" width="22" height="140" rx="6" fill="url(#tealGrad)"/>
  
  <!-- Trendline pulse -->
  <path d="M190 290 L230 250 L270 200 L315 165" fill="none" stroke="#38bdf8" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="315" cy="165" r="9" fill="#38bdf8"/>
  
  <!-- AED Emblem Currency Badge -->
  <circle cx="256" cy="380" r="32" fill="#0a192f" stroke="url(#tealGrad)" stroke-width="3"/>
  <text x="256" y="388" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="800" fill="#2dd4bf" text-anchor="middle">AED</text>
</svg>
