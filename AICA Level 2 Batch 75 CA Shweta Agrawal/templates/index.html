<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tally MCP Multi-Source Import Tool</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<style>
  :root {
    --navy: #1a3558; --brand-2: #1d4ed8;
    --grad: linear-gradient(135deg,#1a3558 0%,#1d4ed8 100%);
    --text-1: #1a2b42; --text-2: #5a6a80; --bg: #f1f5f9;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; font-family: -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
    background: var(--bg); color: var(--text-1); font-size: 14px;
  }
  header {
    background: var(--grad); color: #fff; padding: 18px 24px;
    display: flex; align-items: center; justify-content: space-between;
  }
  header h1 { font-size: 18px; margin: 0; font-weight: 700; }
  header p { margin: 2px 0 0; font-size: 12px; opacity: .85; }
  main { padding: 20px; max-width: 1400px; margin: 0 auto; }
  .card { background: #fff; border-radius: 10px; padding: 20px; box-shadow: 0 1px 4px rgba(0,0,0,.06); margin-bottom: 18px; }
  .card h4 { font-size: 14px; font-weight: 700; color: var(--navy); margin: 0 0 14px; }
  .btn {
    display: inline-flex; align-items: center; gap: 5px; padding: 7px 14px;
    border-radius: 8px; border: none; background: #eef2ff; color: #1a2b42;
    font-size: 13px; font-weight: 600; cursor: pointer;
  }
  .btn:disabled { opacity: .5; cursor: not-allowed; }
  .btn:hover:not(:disabled) { filter: brightness(0.96); }
  .btn-primary { background: var(--grad); color: #fff; }
  .btn-sm { padding: 5px 11px; font-size: 12px; }
  input, select {
    font-family: inherit; font-size: 13px; padding: 6px 8px;
    border: 1px solid #d8dee8; border-radius: 6px; background: #fff; color: var(--text-1);
  }
  table { border-collapse: collapse; }
  a { color: inherit; }
</style>
</head>
<body>
  <header>
    <div>
      <h1>Tally MCP Multi-Source Import Tool</h1>
      <p>Bank Statement (Excel/CSV/PDF) &middot; Journal &middot; GSTR-2B &middot; GSTR-1 &rarr; Tally Prime vouchers</p>
    </div>
  </header>
  <main>
    <div id="tally-root"></div>
  </main>

  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="{{ url_for('static', filename='js/tools_tally.js') }}"></script>
</body>
</html>
