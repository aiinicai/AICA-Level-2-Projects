# CLI use: set WP_DATABASE_URL (or edit below) then run `alembic upgrade head` / `alembic revision --autogenerate -m "..."`.
# The desktop app runs migrations automatically on start-up.
[alembic]
script_location = weddingplanner/migrations
sqlalchemy.url = sqlite:///wedding_planner_dev.db

[loggers]
keys = root
[handlers]
keys = console
[formatters]
keys = generic
[logger_root]
level = WARNING
handlers = console
[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic
[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
