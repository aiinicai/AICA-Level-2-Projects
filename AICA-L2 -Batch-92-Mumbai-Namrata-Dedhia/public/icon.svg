<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>

    <!-- Gold Accent Gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="35%" stop-color="#f59e0b" />
      <stop offset="70%" stop-color="#d97706" />
      <stop offset="100%" stop-color="#92400e" />
    </linearGradient>

    <!-- Cyan AI Glow Gradient -->
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>

    <!-- Emerald Tax Shield Gradient -->
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Dark Luxury Rounded Base -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)" />

  <!-- Outer Glowing Orbit Ring -->
  <circle cx="256" cy="256" r="230" fill="none" stroke="url(#goldGrad)" stroke-width="6" opacity="0.4" />
  <circle cx="256" cy="256" r="218" fill="none" stroke="url(#cyanGrad)" stroke-width="2" stroke-dasharray="8 8" opacity="0.6" />

  <!-- AI Assistant Character Silhouette & Gear -->

  <!-- Shoulders & Advisor Collar -->
  <path d="M128 420 C128 340 180 300 256 300 C332 300 384 340 384 420 V440 H128 Z" fill="#1e293b" stroke="url(#goldGrad)" stroke-width="8" stroke-linejoin="round"/>
  <!-- Suit Lapel Cutout -->
  <path d="M220 300 L256 370 L292 300 L320 440 H192 Z" fill="#0f172a"/>
  <!-- Tie / Badge Line -->
  <path d="M256 350 L266 420 L256 440 L246 420 Z" fill="url(#goldGrad)"/>

  <!-- Assistant Head & Face Contour -->
  <ellipse cx="256" cy="210" rx="72" ry="84" fill="#1e293b" stroke="url(#goldGrad)" stroke-width="6"/>
  <!-- Friendly Eyes / Smart Glass Visor -->
  <path d="M204 195 Q256 185 308 195 C316 215 296 225 256 225 C216 225 196 215 204 195 Z" fill="url(#cyanGrad)" filter="url(#glow)"/>
  <!-- Friendly Visor Glow Points (Eyes) -->
  <circle cx="230" cy="206" r="6" fill="#ffffff"/>
  <circle cx="282" cy="206" r="6" fill="#ffffff"/>

  <!-- Hair / Crown Silhouette -->
  <path d="M184 190 C180 130 220 110 256 110 C292 110 332 130 328 190 C310 160 280 150 256 150 C232 150 202 160 184 190 Z" fill="url(#goldGrad)"/>

  <!-- Professional Headset Microphone -->
  <!-- Headset Band -->
  <path d="M180 200 C170 140 342 140 332 200" fill="none" stroke="url(#cyanGrad)" stroke-width="7" stroke-linecap="round"/>
  <!-- Ear Cushion Left -->
  <rect x="172" y="190" width="16" height="36" rx="8" fill="url(#goldGrad)"/>
  <!-- Ear Cushion Right -->
  <rect x="324" y="190" width="16" height="36" rx="8" fill="url(#goldGrad)"/>
  <!-- Mic Boom Arm -->
  <path d="M332 215 Q340 255 290 265" fill="none" stroke="url(#cyanGrad)" stroke-width="5" stroke-linecap="round"/>
  <!-- Mic Tip Orb -->
  <circle cx="284" cy="266" r="10" fill="url(#goldGrad)" filter="url(#glow)"/>

  <!-- Floating Legal & Tax Badge Icons (Left Rupee ₹, Right Balance Scale) -->

  <!-- Left Floating Badge: Rupee ₹ -->
  <g transform="translate(85, 170)">
    <circle cx="30" cy="30" r="28" fill="#0f172a" stroke="url(#emeraldGrad)" stroke-width="4" filter="url(#glow)"/>
    <text x="30" y="38" font-family="'Segoe UI', sans-serif" font-weight="900" font-size="26" fill="#ffffff" text-anchor="middle">₹</text>
  </g>

  <!-- Right Floating Badge: FEMA Balance Scale -->
  <g transform="translate(365, 170)">
    <circle cx="30" cy="30" r="28" fill="#0f172a" stroke="url(#goldGrad)" stroke-width="4" filter="url(#glow)"/>
    <path d="M18 24 Q30 18 42 24 M30 18 V38 M22 38 H38 M18 28 L14 36 H22 Z M42 28 L38 36 H46 Z" stroke="url(#goldGrad)" stroke-width="2.5" stroke-linecap="round" fill="none"/>
  </g>

  <!-- Sparkles of AI Knowledge -->
  <path d="M130 90 L134 102 L146 106 L134 110 L130 122 L126 110 L114 106 L126 102 Z" fill="url(#goldGrad)"/>
  <path d="M380 90 L384 102 L396 106 L384 110 L380 122 L376 110 L364 106 L376 102 Z" fill="url(#cyanGrad)"/>
</svg>
