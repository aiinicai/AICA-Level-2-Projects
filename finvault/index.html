<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>FinVault – Personal Finance Records</title>
<meta name="theme-color" content="#0b2545">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg">
<link rel="stylesheet" href="style.css?v=11">
</head>
<body>
<div class="app">
  <aside class="side" id="side">
    <div class="brand"><img src="icon.svg" width="34" height="34" alt=""><div><b>FinVault</b><small>Private · On your device</small></div></div>
    <nav id="nav"></nav>
    <div class="side-foot">
      <button class="btn ghost" id="btnInstall" hidden>⬇ Install app</button>
    </div>
  </aside>
  <main class="main">
    <header class="top">
      <button class="menu" id="menu" aria-label="Menu">☰</button>
      <h1 id="title">Dashboard</h1>
      <input id="search" type="search" placeholder="Search everything…">
    <button class="btn primary" id="btnAdd">+ Add</button>
    </header>
    <section id="view"></section>
  </main>
</div>

<div class="modal" id="modal" hidden><div class="sheet" id="sheet"></div></div>
<div class="toast" id="toast" hidden></div>

<script>
/* Excel library: CDN first, local copy as fallback (loaded before app.js either way) */
(function(){var s=document.createElement('script');s.async=false;s.src='https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js';
s.onerror=function(){var l=document.createElement('script');l.src='vendor/xlsx.full.min.js';document.head.appendChild(l)};document.head.appendChild(s)})();
</script>
<script src="app.js?v=11"></script>
</body>
</html>
