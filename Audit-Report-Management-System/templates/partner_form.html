{% extends 'base.html' %}{% block content %}
<h1>{%if edit_mode%}Edit Signing Partner{%else%}Add Signing Partner{%endif%}</h1>
<form method="post" class="card"><div class="grid">
<label>Partner ID<input name="PartnerID" value="{{partner.PartnerID if partner else ''}}" {%if edit_mode%}readonly{%endif%}></label>
<label>Firm*<select name="FirmID" required><option value="">Select</option>
{%for f in firms%}<option value="{{f.FirmID}}" {%if partner and partner.FirmID==f.FirmID%}selected{%endif%}>{{f.FirmName}} — {{f.FRN}}</option>{%endfor%}</select></label>
<label>Partner / CA Name*<input name="PartnerName" value="{{partner.PartnerName if partner else ''}}" required></label>
<label>Membership No.*<input name="MembershipNo" value="{{partner.MembershipNo if partner else ''}}" required></label>
<label>Default Place<input name="DefaultPlace" value="{{partner.DefaultPlace if partner else 'Nashik'}}"></label>
<label>Active<select name="Active"><option value="Yes" {%if not partner or partner.Active=='Yes'%}selected{%endif%}>Yes</option><option value="No" {%if partner and partner.Active=='No'%}selected{%endif%}>No</option></select></label>
</div><div class="actions"><button type="submit">{%if edit_mode%}Update Partner{%else%}Save Partner{%endif%}</button>
<a class="button secondary" href="{{url_for('masters')}}">Cancel</a></div></form>{%endblock%}
