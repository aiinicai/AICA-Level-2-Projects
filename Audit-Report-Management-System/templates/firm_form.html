{% extends 'base.html' %}{% block content %}
<h1>{%if edit_mode%}Edit CA Firm{%else%}Add CA Firm{%endif%}</h1>
<form method="post" class="card"><div class="grid">
<label>Firm ID<input name="FirmID" value="{{firm.FirmID if firm else ''}}" {%if edit_mode%}readonly{%endif%}></label>
<label>Firm Name*<input name="FirmName" value="{{firm.FirmName if firm else ''}}" required></label>
<label>FRN*<input name="FRN" value="{{firm.FRN if firm else ''}}" required></label>
<label>Address<input name="Address" value="{{firm.Address if firm else ''}}"></label>
<label>Default Place<input name="DefaultPlace" value="{{firm.DefaultPlace if firm else 'Nashik'}}"></label>
<label>Active<select name="Active"><option value="Yes" {%if not firm or firm.Active=='Yes'%}selected{%endif%}>Yes</option><option value="No" {%if firm and firm.Active=='No'%}selected{%endif%}>No</option></select></label>
</div><div class="actions"><button type="submit">{%if edit_mode%}Update Firm{%else%}Save Firm{%endif%}</button>
<a class="button secondary" href="{{url_for('masters')}}">Cancel</a></div></form>{%endblock%}
