{% extends 'base.html' %}{% block content %}<h1>{% if edit_mode %}Edit Client{% else %}Add Client{% endif %}</h1><form method="post" class="card"><div class="grid"><label>Client ID<input name="ClientID" value="{{client.ClientID if client else ''}}" {% if edit_mode %}readonly{% endif %}></label><label>Client Legal Name*<input name="ClientName" value="{{client.ClientName if client else ''}}" required></label><label>CIN<input name="CIN" value="{{client.CIN if client else ''}}"></label><label>PAN<input name="PAN" value="{{client.PAN if client else ''}}"></label><label>City<input name="City" value="{{client.City if client else ''}}"></label><label>Registered / Principal Address<input name="Address" value="{{client.Address if client else ''}}"></label><label>Default Entity Type*<select name="EntityType" required>{% for k,v in entity_options.items() %}<option value="{{k}}" {% if (client and client.EntityType==k) or (not client and k=='private_ltd') %}selected{% endif %}>{{v}}</option>{% endfor %}</select></label><label>Default Small Company<select name="SmallCompany"><option value="No" {% if not client or client.SmallCompany!='Yes' %}selected{% endif %}>No</option><option value="Yes" {% if client and client.SmallCompany=='Yes' %}selected{% endif %}>Yes</option></select></label><label>Active<select name="Active"><option value="Yes" {% if not client or client.Active=='Yes' %}selected{% endif %}>Yes</option><option value="No" {% if client and client.Active=='No' %}selected{% endif %}>No</option></select></label></div><div class="actions"><button type="submit">{% if edit_mode %}Update Client{% else %}Save Client{% endif %}</button><a class="button secondary" href="{{url_for('clients')}}">Cancel</a></div></form>{% endblock %}
