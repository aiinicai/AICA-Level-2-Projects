<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DTRS prototype – Department Task &amp; Review System</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#F4F6F8}
a{color:#1F4E78}a:hover{color:#163A5A}
button{font-family:inherit}
button:focus-visible,a:focus-visible,textarea:focus-visible{outline:2px solid #1F4E78;outline-offset:2px}
table{border-collapse:collapse;width:100%}
th{text-align:left;font-size:12px;font-weight:600;color:#5B6576;padding:10px 12px;border-bottom:1px solid #DDE2E8;white-space:nowrap;text-transform:uppercase;letter-spacing:.03em}
td{font-size:14px;color:#1A2230;padding:10px 12px;border-bottom:1px solid #EEF1F4;vertical-align:top}
</style>
</head>
<body>
<!-- Standalone clickable prototype. Fictitious company and dummy data only. Open this file in any modern browser. -->
<div id="app"></div>
<template id="dc-template">
<div style="min-height: 100vh; background: #F4F6F8; font-family: 'IBM Plex Sans', system-ui, sans-serif; color: #1A2230">

<header style="background: #1F4E78; color: #FFFFFF; padding: 14px 24px; display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px">
<div style="display: flex; align-items: center; gap: 14px">
<div style="width: 40px; height: 40px; border-radius: 10px; background: #FFFFFF; color: #1F4E78; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 15px">DT</div>
<div>
<div style="font-size: 18px; font-weight: 700; letter-spacing: .01em">Department Task &amp; Review System</div>
<div style="font-size: 13px; color: #D6E2EE">Sample Manufacturing Industries Pvt Ltd · prototype with dummy data · as of 22-Oct-2026</div>
</div>
</div>
<div style="display: flex; align-items: center; gap: 10px">
<div style="text-align: right">
<div style="font-size: 14px; font-weight: 600">{{me.n}}</div>
<div style="font-size: 12px; color: #D6E2EE">{{me.d}}</div>
</div>
<div style="width: 38px; height: 38px; border-radius: 50%; background: #D6E2EE; color: #1F4E78; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 14px">{{me.ini}}</div>
</div>
</header>

<div style="background: #FFFFFF; border-bottom: 1px solid #DDE2E8; padding: 10px 24px; display: flex; flex-wrap: wrap; align-items: center; gap: 8px">
<span style="font-size: 13px; font-weight: 600; color: #5B6576; margin-right: 4px">View as:</span>
<template data-sc="for" list="{{roles}}" as="r" hint-placeholder-count="6">
<button type="button" onClick="{{r.pick}}" style="{{r.style}}">{{r.label}} <span style="font-weight: 400; opacity: .8">· {{r.who}}</span></button>
</template>
</div>

<template data-sc="if" value="{{hasToast}}" hint-placeholder-val="{{ false }}">
<div style="background: #E3F2E8; color: #1B6B3A; padding: 10px 24px; font-size: 14px; display: flex; justify-content: space-between; align-items: center; gap: 12px; border-bottom: 1px solid #BFE0CB">
<span>{{toast}}</span>
<button type="button" onClick="{{clearToast}}" aria-label="Dismiss message" style="border: 0; background: transparent; color: #1B6B3A; font-size: 18px; cursor: pointer; min-width: 44px; min-height: 32px">×</button>
</div>
</template>

<div style="display: flex; flex-wrap: wrap; gap: 24px; padding: 24px; max-width: 1440px; margin: 0 auto; box-sizing: border-box">

<nav aria-label="Main" style="flex: 1 1 200px; max-width: 240px; display: flex; flex-direction: column; gap: 4px">
<template data-sc="for" list="{{nav}}" as="n" hint-placeholder-count="6">
<template data-sc="if" value="{{n.isHead}}" hint-placeholder-val="{{ false }}"><div style="font-size: 11px; font-weight: 700; color: #5B6576; text-transform: uppercase; letter-spacing: .08em; padding: 14px 14px 4px">{{n.label}}</div></template>
<template data-sc="if" value="{{n.isBtn}}" hint-placeholder-val="{{ true }}"><button type="button" onClick="{{n.go}}" style="{{n.style}}">{{n.label}}</button></template>
</template>
<div style="margin-top: 16px; padding: 12px; background: #FFFFFF; border: 1px solid #DDE2E8; border-radius: 10px; font-size: 12px; color: #5B6576; line-height: 1.5">
<div style="font-weight: 600; color: #1A2230; margin-bottom: 4px">Access in this view</div>
<div>{{accessNote}}</div>
</div>
</nav>

<main style="flex: 999 1 560px; min-width: 0; display: flex; flex-direction: column; gap: 20px">

<template data-sc="if" value="{{canCreate}}" hint-placeholder-val="{{ true }}">
<div style="display: flex; flex-wrap: wrap; gap: 8px; justify-content: flex-end">
<button type="button" onClick="{{openTask}}" style="border: 0; background: #1F4E78; color: #FFFFFF; border-radius: 8px; padding: 10px 16px; font-size: 14px; font-weight: 600; cursor: pointer; min-height: 44px">+ New task</button>
<button type="button" onClick="{{openReq}}" style="border: 1px solid #1F4E78; background: #FFFFFF; color: #1F4E78; border-radius: 8px; padding: 10px 16px; font-size: 14px; font-weight: 600; cursor: pointer; min-height: 44px">+ Raise request to another department</button>
</div>
</template>

<template data-sc="if" value="{{tf.open}}" hint-placeholder-val="{{ false }}">
<section style="background: #FFFFFF; border: 2px solid #1F4E78; border-radius: 12px; padding: 20px; display: flex; flex-direction: column; gap: 16px">
<div>
<h2 style="margin: 0 0 4px; font-size: 18px; font-weight: 700">New task or request</h2>
<p style="margin: 0; font-size: 13px; color: #5B6576">{{tf.rule}}</p>
</div>
<div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 14px">
<div style="display: flex; flex-direction: column; gap: 6px; grid-column: 1 / -1">
<label for="nt-title" style="font-size: 13px; font-weight: 600">Title</label>
<input id="nt-title" type="text" value="{{tf.title}}" onChange="{{tf.onTitle}}" placeholder="e.g. Reconcile GST input credit for October" style="font-family: inherit; font-size: 14px; padding: 10px; border: 1px solid #C9D0D8; border-radius: 8px; min-height: 24px">
</div>
<div style="display: flex; flex-direction: column; gap: 6px">
<label for="nt-cat" style="font-size: 13px; font-weight: 600">Category</label>
<select id="nt-cat" value="{{tf.cat}}" onChange="{{tf.onCat}}" style="font-family: inherit; font-size: 14px; padding: 10px; border: 1px solid #C9D0D8; border-radius: 8px; background: #FFFFFF; min-height: 44px">
<template data-sc="for" list="{{cats}}" as="o" hint-placeholder-count="6">
<option value="{{o.v}}">{{o.label}}</option>
</template>
</select>
<span style="font-size: 12px; color: #5B6576">{{tf.catHint}}</span>
</div>
<div style="display: flex; flex-direction: column; gap: 6px">
<label for="nt-form" style="font-size: 13px; font-weight: 600">Raise as</label>
<select id="nt-form" value="{{tf.form}}" onChange="{{tf.onForm}}" style="font-family: inherit; font-size: 14px; padding: 10px; border: 1px solid #C9D0D8; border-radius: 8px; background: #FFFFFF; min-height: 44px">
<option value="Task">Task – work to be done; a senior reviews it</option>
<option value="Request">Request – ask for data, confirmation or approval; you confirm closure</option>
</select>
</div>
<div style="display: flex; flex-direction: column; gap: 6px">
<label for="nt-assignee" style="font-size: 13px; font-weight: 600">Assign to</label>
<select id="nt-assignee" value="{{tf.assignee}}" onChange="{{tf.onAssignee}}" style="font-family: inherit; font-size: 14px; padding: 10px; border: 1px solid #C9D0D8; border-radius: 8px; background: #FFFFFF; min-height: 44px">
<template data-sc="for" list="{{assignees}}" as="o" hint-placeholder-count="4">
<option value="{{o.v}}">{{o.label}}</option>
</template>
</select>
</div>
<div style="display: flex; flex-direction: column; gap: 6px">
<label for="nt-prio" style="font-size: 13px; font-weight: 600">Priority</label>
<select id="nt-prio" value="{{tf.prio}}" onChange="{{tf.onPrio}}" style="font-family: inherit; font-size: 14px; padding: 10px; border: 1px solid #C9D0D8; border-radius: 8px; background: #FFFFFF; min-height: 44px">
<option value="Critical">Critical – accept same day</option>
<option value="High">High – accept in 1 working day</option>
<option value="Medium">Medium – accept in 2 working days</option>
<option value="Low">Low – accept in 3 working days</option>
</select>
</div>
<div style="display: flex; flex-direction: column; gap: 6px">
<label for="nt-due" style="font-size: 13px; font-weight: 600">{{tf.dueLabel}}</label>
<input id="nt-due" type="date" value="{{tf.due}}" onChange="{{tf.onDue}}" style="font-family: inherit; font-size: 14px; padding: 10px; border: 1px solid #C9D0D8; border-radius: 8px; min-height: 24px">
</div>
<div style="display: flex; flex-direction: column; gap: 6px">
<span style="font-size: 13px; font-weight: 600">Reviewer (set by the system)</span>
<div style="font-size: 14px; padding: 10px; background: #F4F6F8; border-radius: 8px">{{tf.reviewer}}</div>
</div>
<div style="display: flex; flex-direction: column; gap: 6px; grid-column: 1 / -1">
<label for="nt-desc" style="font-size: 13px; font-weight: 600">Description and expected output</label>
<textarea id="nt-desc" rows="3" value="{{tf.desc}}" onChange="{{tf.onDesc}}" style="font-family: inherit; font-size: 14px; padding: 10px; border: 1px solid #C9D0D8; border-radius: 8px; resize: vertical"></textarea>
</div>
<label for="nt-conf" style="display: flex; gap: 10px; align-items: center; font-size: 14px; grid-column: 1 / -1">
<input id="nt-conf" type="checkbox" checked="{{tf.conf}}" onChange="{{tf.onConf}}" style="width: 20px; height: 20px">
Confidential – visible only to the doer, the reviewer, the HOD and Management Viewers
</label>
</div>
<template data-sc="if" value="{{tf.hasErr}}" hint-placeholder-val="{{ false }}">
<div style="background: #FBE6E4; color: #A8231B; padding: 10px 12px; border-radius: 8px; font-size: 14px">{{tf.err}}</div>
</template>
<div style="display: flex; flex-wrap: wrap; gap: 8px">
<button type="button" onClick="{{tf.create}}" style="border: 0; background: #1F4E78; color: #FFFFFF; border-radius: 8px; padding: 10px 16px; font-size: 14px; font-weight: 600; cursor: pointer; min-height: 44px">Create and assign</button>
<button type="button" onClick="{{tf.cancel}}" style="border: 1px solid #C9D0D8; background: #FFFFFF; color: #1A2230; border-radius: 8px; padding: 10px 16px; font-size: 14px; font-weight: 600; cursor: pointer; min-height: 44px">Cancel</button>
</div>
</section>
</template>

<template data-sc="if" value="{{rf.open}}" hint-placeholder-val="{{ false }}">
<section style="background: #FFFFFF; border: 2px solid #1F4E78; border-radius: 12px; padding: 20px; display: flex; flex-direction: column; gap: 16px">
<div>
<h2 style="margin: 0 0 4px; font-size: 18px; font-weight: 700">Raise a request to another department</h2>
<p style="margin: 0; font-size: 13px; color: #5B6576">The receiving HOD or SPOC must accept it and commit a date within the acceptance time for its priority. It closes only when {{myDeptName}} confirms.</p>
</div>
<div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 14px">
<div style="display: flex; flex-direction: column; gap: 6px">
<label for="rq-to" style="font-size: 13px; font-weight: 600">To department</label>
<select id="rq-to" value="{{rf.to}}" onChange="{{rf.onTo}}" style="font-family: inherit; font-size: 14px; padding: 10px; border: 1px solid #C9D0D8; border-radius: 8px; background: #FFFFFF; min-height: 44px">
<template data-sc="for" list="{{deptOptions}}" as="o" hint-placeholder-count="6">
<option value="{{o.v}}">{{o.label}}</option>
</template>
</select>
</div>
<div style="display: flex; flex-direction: column; gap: 6px">
<label for="rq-cat" style="font-size: 13px; font-weight: 600">Category</label>
<select id="rq-cat" value="{{rf.cat}}" onChange="{{rf.onCat}}" style="font-family: inherit; font-size: 14px; padding: 10px; border: 1px solid #C9D0D8; border-radius: 8px; background: #FFFFFF; min-height: 44px">
<template data-sc="for" list="{{cats}}" as="o" hint-placeholder-count="6">
<option value="{{o.v}}">{{o.label}}</option>
</template>
</select>
</div>
<div style="display: flex; flex-direction: column; gap: 6px">
<label for="rq-prio" style="font-size: 13px; font-weight: 600">Priority</label>
<select id="rq-prio" value="{{rf.prio}}" onChange="{{rf.onPrio}}" style="font-family: inherit; font-size: 14px; padding: 10px; border: 1px solid #C9D0D8; border-radius: 8px; background: #FFFFFF; min-height: 44px">
<option value="Critical">Critical</option>
<option value="High">High</option>
<option value="Medium">Medium</option>
<option value="Low">Low</option>
</select>
</div>
<div style="display: flex; flex-direction: column; gap: 6px">
<label for="rq-need" style="font-size: 13px; font-weight: 600">Need-by date</label>
<input id="rq-need" type="date" value="{{rf.need}}" onChange="{{rf.onNeed}}" style="font-family: inherit; font-size: 14px; padding: 10px; border: 1px solid #C9D0D8; border-radius: 8px; min-height: 24px">
</div>
<div style="display: flex; flex-direction: column; gap: 6px; grid-column: 1 / -1">
<label for="rq-text" style="font-size: 13px; font-weight: 600">What do you need?</label>
<textarea id="rq-text" rows="3" value="{{rf.text}}" onChange="{{rf.onText}}" placeholder="e.g. Share GRN copies for invoices pending over 30 days" style="font-family: inherit; font-size: 14px; padding: 10px; border: 1px solid #C9D0D8; border-radius: 8px; resize: vertical"></textarea>
</div>
</div>
<template data-sc="if" value="{{rf.hasErr}}" hint-placeholder-val="{{ false }}">
<div style="background: #FBE6E4; color: #A8231B; padding: 10px 12px; border-radius: 8px; font-size: 14px">{{rf.err}}</div>
</template>
<div style="display: flex; flex-wrap: wrap; gap: 8px">
<button type="button" onClick="{{rf.create}}" style="border: 0; background: #1F4E78; color: #FFFFFF; border-radius: 8px; padding: 10px 16px; font-size: 14px; font-weight: 600; cursor: pointer; min-height: 44px">Send request</button>
<button type="button" onClick="{{rf.cancel}}" style="border: 1px solid #C9D0D8; background: #FFFFFF; color: #1A2230; border-radius: 8px; padding: 10px 16px; font-size: 14px; font-weight: 600; cursor: pointer; min-height: 44px">Cancel</button>
</div>
</section>
</template>

<template data-sc="if" value="{{rsn.open}}" hint-placeholder-val="{{ false }}">
<section role="dialog" aria-labelledby="rsn-title" style="background: #FFFFFF; border: 2px solid #A8231B; border-radius: 12px; padding: 20px; display: flex; flex-direction: column; gap: 12px">
<h2 id="rsn-title" style="margin: 0; font-size: 18px; font-weight: 700">{{rsn.title}}</h2>
<p style="margin: 0; font-size: 13px; color: #5B6576">Mandatory. The reason is saved in the history and sent with the alert to {{rsn.notify}}.</p>
<label for="rsn-text" style="font-size: 13px; font-weight: 600">Reason (at least 10 characters)</label>
<textarea id="rsn-text" rows="3" autoFocus="{{ true }}" value="{{rsn.text}}" onChange="{{rsn.onText}}" style="font-family: inherit; font-size: 14px; padding: 10px; border: 1px solid #C9D0D8; border-radius: 8px; resize: vertical"></textarea>
<template data-sc="if" value="{{rsn.hasErr}}" hint-placeholder-val="{{ false }}"><div style="background: #FBE6E4; color: #A8231B; padding: 8px 12px; border-radius: 8px; font-size: 14px">{{rsn.err}}</div></template>
<div style="display: flex; flex-wrap: wrap; gap: 8px"><button type="button" onClick="{{rsn.confirm}}" style="border: 0; background: #A8231B; color: #FFFFFF; border-radius: 8px; padding: 10px 16px; font-size: 14px; font-weight: 600; cursor: pointer; min-height: 44px">Confirm and send</button><button type="button" onClick="{{rsn.cancel}}" style="border: 1px solid #C9D0D8; background: #FFFFFF; color: #1A2230; border-radius: 8px; padding: 10px 16px; font-size: 14px; font-weight: 600; cursor: pointer; min-height: 44px">Cancel</button></div>
</section>
</template>

<template data-sc="if" value="{{show.work}}" hint-placeholder-val="{{ true }}">
<div style="display: flex; flex-direction: column; gap: 20px">
<h1 style="margin: 0; font-size: 24px; font-weight: 700">Good morning, {{me.first}}</h1>
<div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 16px">
<template data-sc="for" list="{{tiles}}" as="t" hint-placeholder-count="4">
<div style="background: #FFFFFF; border: 1px solid #DDE2E8; border-radius: 12px; padding: 16px">
<div style="font-size: 13px; color: #5B6576; font-weight: 500">{{t.label}}</div>
<div style="{{t.numStyle}}">{{t.value}}</div>
<div style="font-size: 12px; color: #5B6576">{{t.sub}}</div>
</div>
</template>
</div>
<section style="background: #FFFFFF; border: 1px solid #DDE2E8; border-radius: 12px; padding: 4px 0 8px">
<h2 style="margin: 12px 16px 8px; font-size: 16px; font-weight: 600">My open tasks</h2>
<template data-sc="if" value="{{noMyTasks}}" hint-placeholder-val="{{ false }}">
<p style="margin: 8px 16px 12px; color: #5B6576; font-size: 14px">No open tasks assigned to you.</p>
</template>
<div style="overflow-x: auto">
<table>
<thead><tr><th>Task</th><th>Reviewer</th><th>Priority</th><th>Raised on</th><th>Due</th><th>Status</th></tr></thead>
<tbody>
<template data-sc="for" list="{{myTasks}}" as="t" hint-placeholder-count="4">
<tr>
<td><button type="button" onClick="{{t.open}}" style="border: 0; background: transparent; padding: 0; color: #1F4E78; font-size: 14px; font-weight: 600; cursor: pointer; text-align: left">{{t.title}}</button><div style="font-size: 12px; color: #5B6576">{{t.id}} · {{t.type}}</div></td>
<td>{{t.revName}}</td>
<td><span style="{{t.prioStyle}}">{{t.prio}}</span></td>
<td style="white-space: nowrap"><div>{{t.raisedText}}</div><div style="font-size: 12px; color: #5B6576">by {{t.byName}}</div></td>
<td><div>{{t.dueText}}</div><div style="{{t.dueNoteStyle}}">{{t.dueNote}}</div></td>
<td><span style="{{t.statusStyle}}">{{t.status}}</span></td>
</tr>
</template>
</tbody>
</table>
</div>
</section>
<template data-sc="if" value="{{hasReviews}}" hint-placeholder-val="{{ true }}">
<section style="background: #FFFFFF; border: 1px solid #DDE2E8; border-radius: 12px; padding: 4px 0 8px">
<h2 style="margin: 12px 16px 8px; font-size: 16px; font-weight: 600">Waiting for my review</h2>
<div style="overflow-x: auto">
<table>
<thead><tr><th>Task</th><th>Doer</th><th>Priority</th><th>Raised on</th><th>Due</th><th>Status</th></tr></thead>
<tbody>
<template data-sc="for" list="{{reviewQ}}" as="t" hint-placeholder-count="2">
<tr>
<td><button type="button" onClick="{{t.open}}" style="border: 0; background: transparent; padding: 0; color: #1F4E78; font-size: 14px; font-weight: 600; cursor: pointer; text-align: left">{{t.title}}</button><div style="font-size: 12px; color: #5B6576">{{t.id}}</div></td>
<td>{{t.doerName}}</td>
<td><span style="{{t.prioStyle}}">{{t.prio}}</span></td>
<td style="white-space: nowrap">{{t.raisedText}}</td>
<td>{{t.dueText}}</td>
<td><span style="{{t.statusStyle}}">{{t.status}}</span></td>
</tr>
</template>
</tbody>
</table>
</div>
</section>
</template>
</div>
</template>

<template data-sc="if" value="{{show.dashAny}}" hint-placeholder-val="{{ false }}">
<div style="display: flex; flex-direction: column; gap: 20px">
<div>
<h1 style="margin: 0 0 4px; font-size: 24px; font-weight: 700">{{dashTitle}}</h1>
<p style="margin: 0; color: #5B6576; font-size: 14px">{{dashSub}}</p>
</div>
<template data-sc="if" value="{{show.dash}}" hint-placeholder-val="{{ true }}">
<div style="display: flex; flex-direction: column; gap: 20px">
<div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px">
<template data-sc="for" list="{{dTiles}}" as="t" hint-placeholder-count="7">
<div style="background: #FFFFFF; border: 1px solid #DDE2E8; border-radius: 12px; padding: 14px">
<div style="font-size: 13px; color: #5B6576; font-weight: 500">{{t.label}}</div>
<div style="{{t.numStyle}}">{{t.value}}</div>
<div style="font-size: 12px; color: #5B6576">{{t.sub}}</div>
</div>
</template>
</div>
<template data-sc="if" value="{{noMyItems}}" hint-placeholder-val="{{ false }}"><p style="margin: 0; font-size: 14px; color: #5B6576">No items are assigned to you in the prototype data, so the breakdowns below are empty.</p></template>
<div style="display: flex; flex-wrap: wrap; gap: 16px">
<section style="flex: 1 1 240px; background: #FFFFFF; border: 1px solid #DDE2E8; border-radius: 12px; padding: 16px; display: flex; flex-direction: column; gap: 10px">
<h2 style="margin: 0; font-size: 15px; font-weight: 600">My items by status</h2>
<template data-sc="for" list="{{byStatus}}" as="b" hint-placeholder-count="4">
<div><div style="display: flex; justify-content: space-between; font-size: 13px; margin-bottom: 4px"><span>{{b.label}}</span><strong style="font-weight: 600">{{b.n}}</strong></div><div style="height: 10px; background: #EEF1F4; border-radius: 5px"><div style="{{b.bar}}"></div></div></div>
</template>
</section>
<section style="flex: 1 1 240px; background: #FFFFFF; border: 1px solid #DDE2E8; border-radius: 12px; padding: 16px; display: flex; flex-direction: column; gap: 10px">
<h2 style="margin: 0; font-size: 15px; font-weight: 600">My items by category</h2>
<template data-sc="for" list="{{byCat}}" as="b" hint-placeholder-count="4">
<div><div style="display: flex; justify-content: space-between; font-size: 13px; margin-bottom: 4px"><span>{{b.label}}</span><strong style="font-weight: 600">{{b.n}}</strong></div><div style="height: 10px; background: #EEF1F4; border-radius: 5px"><div style="{{b.bar}}"></div></div></div>
</template>
</section>
<section style="flex: 1 1 240px; background: #FFFFFF; border: 1px solid #DDE2E8; border-radius: 12px; padding: 16px; display: flex; flex-direction: column; gap: 10px">
<h2 style="margin: 0; font-size: 15px; font-weight: 600">My items by priority</h2>
<template data-sc="for" list="{{byPrio}}" as="b" hint-placeholder-count="3">

  var roles = ROLES.map(function(r){ var on = r.k===s.role; return {label:r.label, who: person(r.code).n, pick:function(){ self.setState({role:r.k, screen:NAV[r.k].filter(function(k){ return k.charAt(0)!=='#'; })[0], sel:null, teamPick:null, filter:'open', tf:{open:false}, rf:{open:false}, ext:{open:false}, fl:{}}); }, style:'border:1px solid '+(on?'#1F4E78':'#C9D0D8')+';background:'+(on?'#1F4E78':'#FFFFFF')+';color:'+(on?'#FFFFFF':'#1A2230')+';border-radius:999px;padding:8px 14px;font-size:13px;font-weight:600;cursor:pointer;min-height:36px'}; });
  var nav = NAV[s.role].map(function(k){ if (k.charAt(0)==='#') return {isHead:true, isBtn:false, label:k.slice(1)}; var on = k===screen; return {isHead:false, isBtn:true, label:(k==='tasks' && s.role==='ceo') ? 'Task Drill-down' : NAVLBL[k], go:go(k), style:'text-align:left;border:0;border-radius:8px;padding:12px 14px;font-size:14px;cursor:pointer;min-height:44px;font-weight:'+(on?'600':'500')+';background:'+(on?'#1F4E78':'transparent')+';color:'+(on?'#FFFFFF':'#1A2230')}; });
  var show = {}; ['work','dash','teamdash','team','deptsum','tasks','requests','dept','cockpit','admin','it'].forEach(function(k){ show[k] = k===screen; }); show.dashAny = show.dash || show.teamdash;

  return {
   me: {n:me.n, d:me.d, first:me.n.split(' ')[0], ini: me.n.split(' ').map(function(w){ return w[0]; }).join('')},
   roles: roles, nav: nav, show: show, accessNote: ACCESS[s.role],
   toast: s.toast, hasToast: !!s.toast, clearToast: function(){ self.setState({toast:''}); },

   team: team, hasTeamPick: !!s.teamPick, teamPickName: s.teamPick ? person(s.teamPick).n : '', teamTasks: teamTasks,
   taskScope: s.role==='ceo' ? 'Drill-down across departments. Start from Department Summary or use the column filters.' : (s.role==='hod' ? 'All of Finance & Accounts, plus tasks you review.' : (s.role==='exec' ? 'Your own tasks, plus items you raised to others.' : 'Your tasks, your sub-tree, and items you raised to others.')),
   teamNote: s.role==='ceo' ? 'Open and overdue counts for each HOD cover their whole department.' : 'Counts are each person’s own open items.',
   filters: filters, taskRows: taskRows, noTaskRows: taskRows.length===0,
   hasSel: !!selT, sel: selT || {log:[],actions:[]}, closeSel: function(){ self.setState({sel:null}); },
   myDeptName: s.role==='ceo' ? 'all departments' : DEPT[myDept], inbox: inbox, outbox: outbox,
   kpis: kpis, trend: trend, ageing: ageing,
   selfText: s.selfText, selfOpen: !s.selfDone, selfDone: s.selfDone,
   onSelf: function(e){ self.setState({selfText: e.target.value}); },
   submitSelf: function(){ self.setState({selfDone:true, toast:'Self-review submitted to management'}); },
   cockRows: cockRows, cockTiles: cockTiles,
   adminTabs: adminTabs, adm: {hier: s.adminTab==='hier', cal: s.adminTab==='cal', kpi: s.adminTab==='kpi', esc: s.adminTab==='esc'}, hierRows: hierRows, kpiRows: kpiRows, escRows: escRows,
   itTiles: itTiles, itUsers: itUsers,
   rsn: rsn, rfl: rfl,
   teamDashOn: screen==='teamdash' && teamDash.length>0, dashTitle: screen==='teamdash' ? 'Team Dashboard' : 'My Dashboard',
   dTiles: dTiles, byStatus: byStatus, byCat: byCat, byPrio: byPrio, dMeas: dMeas, myScore: myScore, scoreNote: scoreNote, teamDash: teamDash, hasTeamDash: teamDash.length>0, teamTiles: teamTiles, ceoDashNote: s.role==='ceo', noMyItems: ms.total===0,
   dashSub: screen==='teamdash' ? 'Everyone below '+me.n+' in the reporting tree · October 2026 to date · working days · prototype data' : me.n+' · '+(LVN[me.l]||'')+' ('+me.l+') · October 2026 to date · counted in working days · prototype data',
   fl: fl, fopt: fopt, deptRows: deptRows, weekDays: weekDays, holRows: holRows, hf: hf, workCount: workCount,
   noRowsMsg: (s.role==='ceo' && fls.dept && fls.dept!=='FIN') ? 'No task data for this department in the prototype – dummy tasks exist for Finance only.' : 'No tasks match these filters.',
   ext: ext, reasons: REASONS.map(function(r){ return {v:r, label:r}; }), showDoer: showDoer, noDoerCol: !showDoer,
   cats: CATOPTS, canCreate: canCreate, openTask: openTask, openReq: openReq, tf: tf, rf: rf, assignees: assignees, deptOptions: deptOptions
  };
 }
