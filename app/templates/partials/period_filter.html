<div class="form-group">
    <label class="form-label">Period</label>
    <select id="{{ period_prefix }}PeriodType" class="form-select" onchange="onPeriodFilterChange('{{ period_prefix }}', '{{ period_reload }}')">
        <option value="month">Specific month</option>
        <option value="year">Financial year</option>
        <option value="date">Custom range</option>
    </select>
</div>
<div class="form-group" id="{{ period_prefix }}MonthWrap">
    <label class="form-label" id="{{ period_prefix }}MonthLabel">Month</label>
    <input type="month" id="{{ period_prefix }}Month" class="form-control" onchange="{{ period_reload }}()">
</div>
<div class="form-group" id="{{ period_prefix }}YearWrap" style="display: none;">
    <label class="form-label">FY starting April</label>
    <input type="number" id="{{ period_prefix }}Year" class="form-control" min="2020" max="2100" title="1 April to 31 March" onchange="{{ period_reload }}()">
</div>
<div class="form-group" id="{{ period_prefix }}DateWrap" style="display: none;">
    <label class="form-label">From date</label>
    <input type="date" id="{{ period_prefix }}Date" class="form-control" onchange="{{ period_reload }}()">
</div>
<div class="form-group" id="{{ period_prefix }}DateEndWrap" style="display: none;">
    <label class="form-label">To date</label>
    <input type="date" id="{{ period_prefix }}DateEnd" class="form-control" onchange="{{ period_reload }}()">
</div>
