<div class="import-panel" data-perm="daybook.enter">
    <h3><i class="fa-solid fa-cloud-arrow-up"></i> Import daily branch sales</h3>
    <form id="dailySalesForm" class="import-grid" onsubmit="uploadDailySales(event)">
        <div class="form-group">
            <label class="form-label">Branch</label>
            <select id="impDailyBranch" class="form-select" required>
                {% for b in branches %}
                <option value="{{ b.id }}">{{ b.name }} ({{ b.code }})</option>
                {% endfor %}
            </select>
        </div>
        <div class="form-group">
            <label class="form-label">File (.xlsx, .csv, or 1–5 same-day photos)</label>
            <input type="file" id="impDailyFile" class="form-control" accept=".xlsx, .xls, .csv, .png, .jpg, .jpeg, .bmp, .webp" multiple required>
            <p class="field-source" style="margin-top: 0.35rem;">Photos: cash book + POS + card machine for the same day. Up to 5 images.</p>
            <input type="password" id="impGeminiKey" class="form-control" placeholder="Gemini API key (paste once)" autocomplete="off" style="margin-top: 0.45rem; display: none;">
        </div>
        <button type="submit" class="btn btn-primary"><i class="fa-solid fa-upload"></i> Upload</button>
    </form>
</div>
{% include "partials/import_modals.html" %}
