<div class="import-panel" data-perm="aggregators.enter">
    <h3><i class="fa-solid fa-file-invoice-dollar"></i> Import aggregator settlement</h3>
    <form id="aggForm" class="import-grid agg" onsubmit="uploadAggregatorSettlement(event)">
        <div class="form-group">
            <label class="form-label">Aggregator</label>
            <select id="impAggregatorId" class="form-select" required>
                {% for a in aggregators %}
                <option value="{{ a.id }}">{{ a.name }}</option>
                {% endfor %}
            </select>
        </div>
        <div class="form-group">
            <label class="form-label">Branch</label>
            <select id="impAggBranchId" class="form-select" required>
                {% for b in branches %}
                <option value="{{ b.id }}">{{ b.name }}</option>
                {% endfor %}
            </select>
        </div>
        <div class="form-group">
            <label class="form-label">Period start</label>
            <input type="date" id="impAggStart" class="form-control" required>
        </div>
        <div class="form-group">
            <label class="form-label">Period end</label>
            <input type="date" id="impAggEnd" class="form-control" required>
        </div>
        <div class="form-group" style="grid-column: span 3;">
            <label class="form-label">Settlement file (.xlsx, .csv, or photo)</label>
            <input type="file" id="impAggFile" class="form-control" accept=".xlsx, .xls, .csv, .png, .jpg, .jpeg, .bmp, .webp" required>
        </div>
        <button type="submit" class="btn btn-primary"><i class="fa-solid fa-upload"></i> Process</button>
    </form>
</div>
