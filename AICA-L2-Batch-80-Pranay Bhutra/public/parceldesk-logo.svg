<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="50%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>

    <!-- Top Gloss Gradient -->
    <linearGradient id="topGloss" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
    </linearGradient>

    <!-- Box Face Gradients -->
    <linearGradient id="boxTop" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#f8fafc" />
    </linearGradient>
    <linearGradient id="boxLeft" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f1f5f9" />
      <stop offset="100%" stop-color="#e2e8f0" />
    </linearGradient>
    <linearGradient id="boxRight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e2e8f0" />
      <stop offset="100%" stop-color="#cbd5e1" />
    </linearGradient>

    <!-- Blue Ribbon Tape Gradient -->
    <linearGradient id="tapeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>

    <!-- Speed Streak Gradient -->
    <linearGradient id="streakGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0" />
      <stop offset="40%" stop-color="#ffffff" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.95" />
    </linearGradient>

    <!-- Pin Gradient -->
    <linearGradient id="pinGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#f1f5f9" />
    </linearGradient>

    <!-- Shadow filter -->
    <filter id="dropShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#0f172a" flood-opacity="0.35" />
    </filter>
    <filter id="softShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#0284c7" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Squircle Base with Soft Lighting -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />
  <rect width="512" height="512" rx="112" fill="url(#topGloss)" />

  <!-- Speed Streaks on Left -->
  <!-- Top Streak -->
  <path d="M72 196 L164 196" stroke="url(#streakGrad)" stroke-width="14" stroke-linecap="round" />
  <!-- Middle Streak (Longest) -->
  <path d="M102 240 L176 240" stroke="url(#streakGrad)" stroke-width="14" stroke-linecap="round" />
  <!-- Bottom Streak -->
  <path d="M134 276 L158 276" stroke="url(#streakGrad)" stroke-width="12" stroke-linecap="round" />

  <!-- Box Cast Ambient Shadow -->
  <ellipse cx="276" cy="340" rx="120" ry="32" fill="#0f172a" fill-opacity="0.3" />

  <!-- 3D Parcel Box Group -->
  <g filter="url(#dropShadow)">
    <!-- Box Top Face -->
    <path d="M260 118 L366 160 L274 216 L168 174 Z" fill="url(#boxTop)" />

    <!-- Box Right Face -->
    <path d="M274 216 L366 160 L366 288 L274 340 Z" fill="url(#boxRight)" />

    <!-- Box Left Face -->
    <path d="M168 174 L274 216 L274 340 L168 298 Z" fill="url(#boxLeft)" />

    <!-- Blue Tape Stripe Top & Front -->
    <!-- Top face tape -->
    <path d="M204 140 L238 154 L308 195 L274 216 Z" fill="url(#tapeGrad)" />
    <!-- Front/Left Face Tape Tag (v-notch ribbon) -->
    <path d="M204 188 L232 200 L232 232 L218 220 L204 232 Z" fill="url(#tapeGrad)" />

    <!-- Shipping Docket Lines on Left Face -->
    <path d="M188 266 L226 280" stroke="#1e293b" stroke-width="6" stroke-linecap="round" stroke-opacity="0.75" />
    <path d="M188 282 L216 292" stroke="#1e293b" stroke-width="6" stroke-linecap="round" stroke-opacity="0.75" />
  </g>

  <!-- Location Pin with Soft Shadow -->
  <!-- Pin Base Shadow on Box -->
  <ellipse cx="356" cy="330" rx="38" ry="12" fill="#1e3a8a" fill-opacity="0.45" />

  <g filter="url(#softShadow)">
    <!-- White Pin Teardrop Body -->
    <path d="M356 220 C322 220 296 246 296 280 C296 322 356 338 356 338 C356 338 416 322 416 280 C416 246 390 220 356 220 Z" fill="url(#pinGrad)" />
    <!-- Circular Cutout / Dot -->
    <circle cx="356" cy="268" r="18" fill="#1d4ed8" />
  </g>

  <!-- Brand Typography at Bottom -->
  <g id="brandText">
    <!-- "Parcel" in Bold White -->
    <text x="96" y="416" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Plus Jakarta Sans', 'Inter', sans-serif" font-weight="800" font-size="62" letter-spacing="-1.5">Parcel</text>
    <!-- "Desk" in Cyan-Blue -->
    <text x="290" y="416" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Plus Jakarta Sans', 'Inter', sans-serif" font-weight="800" font-size="62" letter-spacing="-1.5">Desk</text>
  </g>
</svg>
