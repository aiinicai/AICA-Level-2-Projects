version: '3.8'

services:
  app:
    build: .
    container_name: finkpi_analyzer_app
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=sqlite:///./finkpi.db
      - SECRET_KEY=finkpi-secret-key-2024-change-in-production
    restart: always

  redis:
    image: redis:7-alpine
    container_name: finkpi_redis_cache
    ports:
      - "6379:6379"
    restart: always
