function hm(n){return Math.floor(n/60)+'h '+String(n%60).padStart(2,'0')+'m';}
function assignmentName(id){if(id==='IDLE')return 'Idle time';const a=app.data.Assignments.find(a=>a.id===id);return a?label('Clients',a.client)+' — '+label('WorkTypes',a.work)+' — '+a.period+' '+a.financialYear+' ('+a.id+')':id;}
function renderTimesheets(){timeEditing={};const now=app.today;$('content').innerHTML='<section class="panel"><h2>Enter your timesheet</h2><p class="muted">Enter start and end times in 24-hour HH:MM format, for example 09:30–10:30. Duration is calculated automatically. Daily expectation: 9 hours including idle time. Idle above 1 hour is highlighted and can still be saved. Backdated entries are allowed.</p><form id="timeForm"><div class="grid"><label>Work date<input name="date" type="date" value="'+now+'" required></label><label>Assignment<select name="assignment" required onchange="timeBilling()">'+options([['IDLE','Idle time'],...app.data.Assignments.filter(a=>a.employee===app.user.id).map(a=>[a.id,assignmentName(a.id)])],'','Select…')+'</select></label><label>Billing classification<select name="billing" required>'+options(simple(['Billable','Non-billable']),'','Select…')+'</select></label><label id="startLabel">From (HH:MM, 24-hour)<input name="startTime" type="text" placeholder="09:30" inputmode="numeric" pattern="([01][0-9]|2[0-3]):[0-5][0-9]" maxlength="5" required oninput="timeDuration()"></label><label id="endLabel">To (HH:MM, 24-hour)<input name="endTime" type="text" placeholder="10:30" inputmode="numeric" pattern="([01][0-9]|2[0-3]):[0-5][0-9]" maxlength="5" required oninput="timeDuration()"></label><div><label>Calculated duration</label><div id="durationDisplay" class="time-result">—</div></div><label id="legacyHoursLabel" style="display:none">Original hours<input name="hours" type="number" min="0" max="24" value="0"></label><label id="legacyMinutesLabel" style="display:none">Original minutes<input name="minutes" type="number" min="0" max="59" value="0"></label><label class="wide">Work performed / Idle-time explanation<textarea name="note" maxlength="4000" required></textarea></label></div><p id="legacyNotice" class="muted" style="display:none">This earlier entry uses duration only. Its original time format is retained.</p><div class="actions"><button type="submit">Save time entry</button><button type="button" class="secondary" onclick="clearTimeEdit()">Clear / Cancel edit</button></div></form></section><section class="panel" style="margin-top:20px"><h2>Timesheet register</h2><div class="toolbar"><label>From<input id="timeFrom" type="date" value="'+now.slice(0,8)+'01" onchange="filterTime()"></label><label>To<input id="timeTo" type="date" value="'+now+'" onchange="filterTime()"></label>'+(app.user.admin?'<label>Employee<select id="timeEmployee" onchange="filterTime()">'+options(app.data.Employees.map(e=>[e.id,e.name]),'','All employees')+'</select></label>':'')+'</div><div id="timeTotals"></div><div class="tablewrap"><table><thead><tr><th>Date</th><th>Staff</th><th>Assignment / Client</th><th>From–To</th><th>Duration</th><th>Billing</th><th>Details</th><th></th></tr></thead><tbody id="timeRows"></tbody></table></div><h3>Daily hours and explanations</h3><div id="dayRows"></div></section>';
 $('timeForm').onsubmit=e=>{e.preventDefault();const v=Object.fromEntries(new FormData(e.target)),legacy=!!timeEditing.id&&!timeEditing.startTime&&!timeEditing.endTime;rpc('saveTime',[{...timeEditing,date:v.date,assignment:v.assignment,startTime:legacy?'':v.startTime,endTime:legacy?'':v.endTime,minutes:legacy?Number(v.hours)*60+Number(v.minutes):null,billing:v.assignment==='IDLE'?'Non-billable':v.billing,note:v.note}],receive);};filterTime();}
function timeBilling(){const f=$('timeForm').elements,idle=f.assignment.value==='IDLE';f.billing.disabled=idle;f.billing.required=!idle&&!(timeEditing.id&&!timeEditing.startTime&&!timeEditing.endTime);if(idle)f.billing.value='Non-billable';}
function timeDuration(){const f=$('timeForm').elements,valid=x=>/^([01]\d|2[0-3]):[0-5]\d$/.test(x),n=x=>Number(x.slice(0,2))*60+Number(x.slice(3));const d=valid(f.startTime.value)&&valid(f.endTime.value)?n(f.endTime.value)-n(f.startTime.value):0;$('durationDisplay').textContent=d>0?hm(d):'—';}
function timeMode(legacy){const f=$('timeForm').elements;for(const k of ['start','end']){$(k+'Label').style.display=legacy?'none':'';f[k+'Time'].required=!legacy;f[k+'Time'].disabled=legacy;}for(const k of ['Hours','Minutes']){$('legacy'+k+'Label').style.display=legacy?'':'none';f[k.toLowerCase()].disabled=!legacy;}$('legacyNotice').style.display=legacy?'':'none';}
function clearTimeEdit(){timeEditing={};$('timeForm').reset();$('timeForm').elements.date.value=app.today;timeMode(false);timeBilling();timeDuration();}
function editTime(id){const t=app.data.Timesheets.find(t=>t.id===id);if(!t||t.employee!==app.user.id)return;timeEditing={...t};const f=$('timeForm').elements,legacy=!t.startTime&&!t.endTime;f.date.value=t.date;f.assignment.value=t.assignment;f.startTime.value=t.startTime||'';f.endTime.value=t.endTime||'';f.hours.value=Math.floor(Number(t.minutes)/60);f.minutes.value=Number(t.minutes)%60;f.billing.value=t.billing||'';f.note.value=t.note;timeMode(legacy);timeBilling();if(legacy){f.billing.required=false;$('durationDisplay').textContent=hm(Number(t.minutes));}else timeDuration();$('timeForm').scrollIntoView({behavior:'smooth'});}
function filterTime(){const from=$('timeFrom').value,to=$('timeTo').value,employee=$('timeEmployee')?$('timeEmployee').value:app.user.id;const rows=app.data.Timesheets.filter(t=>(!from||t.date>=from)&&(!to||t.date<=to)&&(!employee||t.employee===employee)).sort((a,b)=>b.date.localeCompare(a.date)||a.employee.localeCompare(b.employee));const total=rows.reduce((n,t)=>n+Number(t.minutes),0),idle=rows.filter(t=>t.assignment==='IDLE').reduce((n,t)=>n+Number(t.minutes),0);$('timeTotals').innerHTML='<p><b>Total: '+hm(total)+'</b> · Assignment time: '+hm(total-idle)+' · Idle: '+hm(idle)+'</p>';$('timeRows').innerHTML=rows.map(t=>'<tr><td>'+esc(t.date)+'</td><td>'+esc(label('Employees',t.employee))+'</td><td>'+esc(assignmentName(t.assignment))+'</td><td>'+esc(t.startTime&&t.endTime?t.startTime+'–'+t.endTime:'Earlier duration entry')+'</td><td>'+hm(Number(t.minutes))+'</td><td>'+esc(t.billing||'Unclassified')+'</td><td>'+esc(t.note)+'</td><td>'+(t.employee===app.user.id?'<button onclick="editTime(\''+t.id+'\')">Edit</button>':'')+'</td></tr>').join('')||'<tr><td colspan="8">No time entries.</td></tr>';
 const days={};rows.forEach(t=>{const key=t.employee+'|'+t.date;if(!days[key])days[key]={employee:t.employee,date:t.date,total:0,idle:0};days[key].total+=Number(t.minutes);if(t.assignment==='IDLE')days[key].idle+=Number(t.minutes);});app.data.TimeQueries.filter(q=>(!from||q.date>=from)&&(!to||q.date<=to)&&(!employee||q.employee===employee)).forEach(q=>{const key=q.employee+'|'+q.date;if(!days[key])days[key]={employee:q.employee,date:q.date,total:0,idle:0};});$('dayRows').innerHTML=Object.values(days).sort((a,b)=>b.date.localeCompare(a.date)).map(d=>{const q=app.data.TimeQueries.find(q=>q.employee===d.employee&&q.date===d.date);return '<div class="notice"><b>'+esc(d.date)+' · '+esc(label('Employees',d.employee))+'</b><p>Total '+hm(d.total)+' / 9h · '+(d.total<540?'Short '+hm(540-d.total):d.total>540?'Extra '+hm(d.total-540):'Complete')+' · <span class="'+(d.idle>60?'late':'')+'">Idle '+hm(d.idle)+(d.idle>60?' — exceeds 1 hour':'')+'</span></p>'+(q?'<p>Owner question: '+esc(q.question)+'</p><p>Staff response: '+esc(q.answer||'Awaiting response')+'</p>':'')+(app.user.admin?'<button onclick="askTime(\''+d.employee+'\',\''+d.date+'\')">'+(q?'New question':'Ask for explanation')+'</button>':'')+(q&&d.employee===app.user.id?'<button class="secondary" onclick="answerTime(\''+q.id+'\')">Respond</button>':'')+'</div>';}).join('')||'<p>No recorded days in this period.</p>';}
function askTime(employee,date){const q=app.data.TimeQueries.find(q=>q.employee===employee&&q.date===date),question=prompt('Question for '+label('Employees',employee)+' on '+date,q?q.question:'Please explain the idle time recorded.');if(question&&question.trim())rpc('timeQuestion',[employee,date,question,q?q.version:''],receive);}
function answerTime(id){const q=app.data.TimeQueries.find(q=>q.id===id),answer=prompt(q.question,q.answer||'');if(answer&&answer.trim())rpc('timeAnswer',[id,answer,q.version],receive);}
function renderReports(){$('content').innerHTML='<section class="panel"><h2>Timesheet reports</h2><div class="grid"><label>Report type<select id="reportType" onchange="reportChoices()"><option>Staff</option><option>Client</option></select></label><label>From<input id="reportFrom" type="date" value="'+app.today.slice(0,8)+'01"></label><label>To<input id="reportTo" type="date" value="'+app.today+'"></label><label id="reportEmployeeLabel">Employee<select id="reportEmployee">'+options(app.data.Employees.map(e=>[e.id,e.name]),'','Select employee')+'</select></label><label>Client<select id="reportClient" onchange="reportAssignmentChoices()"></select></label><label id="reportAssignmentLabel">Assignment<select id="reportAssignment"></select></label></div><div class="actions"><button onclick="previewReport()">Preview report</button><button onclick="downloadReport(\'docx\')">Download Word</button><button onclick="downloadReport(\'pdf\')">Download PDF</button></div><div id="reportPreview"></div><p>Select one staff member or one client and an inclusive date range. All-client staff reports include idle time. Client-filtered reports exclude idle time. Entries are grouped by date; client reports also identify the staff member.</p></section>';reportChoices();}
function reportChoices(){const staff=$('reportType').value==='Staff';$('reportEmployeeLabel').style.display=staff?'block':'none';$('reportAssignmentLabel').style.display=staff?'none':'block';$('reportClient').innerHTML=options(app.data.Clients.map(c=>[c.id,c.name]),'',staff?'All clients (includes idle time)':'Select client');reportAssignmentChoices();}
function reportAssignmentChoices(){const client=$('reportClient').value;$('reportAssignment').innerHTML=options(app.data.Assignments.filter(a=>a.client===client).map(a=>[a.id,assignmentName(a.id)]),'','All assignments');}
function reportFilters(){return {type:$('reportType').value,from:$('reportFrom').value,to:$('reportTo').value,employee:$('reportEmployee').value,client:$('reportClient').value,assignment:$('reportType').value==='Client'?$('reportAssignment').value:''};}
function reportHours(m){return Math.floor(m/60)+':'+String(m%60).padStart(2,'0');}
function previewReport(){rpc('previewTimeReport',[reportFilters()],r=>{
 const columns=['Name of Client','Types of Work','Time From','Time To','Hours worked (HH:MM)','Billable or Non-billable'];
 $('reportPreview').innerHTML='<h3>'+esc(r.heading)+'</h3><p><b>Name of '+esc(r.type)+':</b> '+esc(r.name)+'<br><b>Time Period:</b> '+esc(r.from)+' to '+esc(r.to)+'</p>'+r.groups.map(g=>'<h3>Date: '+esc(g.date)+(r.type==='Client'?' · Staff: '+esc(g.staff):'')+'</h3><div class="tablewrap"><table><thead><tr>'+columns.map(c=>'<th>'+esc(c)+'</th>').join('')+'</tr></thead><tbody>'+g.rows.map(row=>'<tr>'+row.map(value=>'<td>'+esc(value)+'</td>').join('')+'</tr>').join('')+'<tr><td><b>TOTAL</b></td><td></td><td></td><td></td><td><b>'+reportHours(g.minutes)+'</b></td><td></td></tr></tbody></table></div>').join('')+(r.groups.length?'':'<p>No entries found for this selection.</p>')+'<div class="notice" style="margin-top:18px"><b>PERIOD TOTAL: '+reportHours(r.minutes)+'</b><br>Billable: '+reportHours(r.billable)+' · Non-billable: '+reportHours(r.nonBillable)+' · Billing not recorded: '+reportHours(r.unclassified)+'<br>Idle time included: '+reportHours(r.idle)+'</div><p class="muted">Hours are HH:MM. Earlier entries retain their duration with blank From/To fields.</p>';
 });}
function downloadReport(format){$('reportPreview').textContent='Preparing report…';rpc('exportTimeReport',[reportFilters(),format],r=>{const raw=atob(r.base64),bytes=new Uint8Array(raw.length);for(let i=0;i<raw.length;i++)bytes[i]=raw.charCodeAt(i);const url=URL.createObjectURL(new Blob([bytes],{type:r.mime}));$('reportPreview').innerHTML='<a id="reportDownload">Download '+esc(r.filename)+'</a>';$('reportDownload').href=url;$('reportDownload').download=r.filename;$('reportDownload').click();setTimeout(()=>URL.revokeObjectURL(url),300000);});}

function showWelcome(){if(app)return;$('nav').innerHTML='';$('content').innerHTML='<section class="welcome"><span class="badge">ABC CHARTERED ACCOUNTANTS</span><h2>WELCOME TEAM</h2><p>Your workspace for assignments, timesheets and office updates.</p><button onclick="showAuth(\'login\')">Sign in to your account</button></section>';}
function renderCommunications(){const news=app.data.Communications||[];$('content').innerHTML='<section class="panel"><h2>Office Communication and Updates</h2><p class="muted">Latest office news and announcements. Checks for updates every 15 seconds while this page is open. <span id="newsSync"></span></p>'+(app.user.admin?'<button onclick="editCommunication()">+ Publish update</button>':'')+'<div id="newsList"></div></section>';drawNews();}
function drawNews(){if(!$('newsList'))return;const news=[...(app.data.Communications||[])].sort((a,b)=>b.updatedAt.localeCompare(a.updatedAt));$('newsList').innerHTML=news.map(n=>'<article class="news"><span class="badge '+esc(n.priority)+'">'+esc(n.priority)+'</span>'+(n.active==='No'?' <span class="badge">Archived</span>':'')+'<h3>'+esc(n.title)+'</h3><p>'+esc(n.message)+'</p><small>Published by '+esc(n.createdBy)+' · '+esc(new Date(n.createdAt).toLocaleString('en-IN'))+'<br>Last updated by '+esc(n.updatedBy)+' · '+esc(new Date(n.updatedAt).toLocaleString('en-IN'))+'</small>'+(app.user.admin?'<div class="actions"><button class="secondary" onclick="editCommunication(\''+n.id+'\')">Edit / Archive</button></div>':'')+'</article>').join('')||'<p>No office updates have been published.</p>';$('newsSync').textContent='Last checked: '+new Date().toLocaleTimeString('en-IN');}
function editCommunication(id){const o=app.data.Communications.find(n=>n.id===id)||{priority:'Normal',active:'Yes'};begin('Communications',o);$('title').textContent=o.id?'Edit office update':'Publish office update';$('fields').innerHTML=field('title','Title','text',null,true)+field('priority','Priority','text',simple(['Normal','Important','Urgent']),true)+field('active','Visible to staff','text',simple(['Yes','No']),true)+field('message','Message','textarea');$('form').querySelector('button[type=submit]').style.display='';$('editor').showModal();}
function pollNews(){if(!app||!authToken||newsBusy||document.hidden||view!=='Office Communication and Updates'||$('editor').open)return;newsBusy=true;google.script.run.withSuccessHandler(rows=>{newsBusy=false;if(!app)return;app.data.Communications=rows;drawNews();}).withFailureHandler(e=>{newsBusy=false;if($('newsSync'))$('newsSync').textContent='Update check failed. Use Refresh to reconnect.';if(/Session expired|Please log in/.test(e.message||'')){authToken='';storeToken('');app=null;showAuth('login');}}).getCommunications(authToken);}
newsTimer=setInterval(pollNews,15000);
function showAuth(mode){authMode=mode;const titles={login:'WELCOME TEAM',forgot:'Request password reset',change:'Change password',recovery:'Set a new password',reset:'Employee password reset',setup:'Create office administrator',owner:'Recover owner account'};$('authTitle').textContent=titles[mode];$('authError').style.display='none';let h='';
 if(mode==='login'||mode==='forgot'||mode==='setup'||mode==='owner')h+='<label>Username<input name="username" required autocomplete="username"></label>';
 if(mode==='setup')h+='<label>Your name<input name="name" required maxlength="200"></label><label>Contact email<input name="email" type="email" required></label><label>Password<input name="password" type="password" minlength="12" maxlength="128" required></label><label>Confirm password<input name="setupConfirm" type="password" required></label>';
 if(mode==='owner')h+='<label>Owner recovery key<input name="recoveryCode" required autocomplete="off"></label>';
 if(mode==='login')h+='<label>Password<input name="password" type="password" required autocomplete="current-password"></label>';
 if(mode==='change')h+='<label>Current / temporary password<input name="currentPassword" type="password" required autocomplete="current-password"></label>';
 if(['change','recovery','reset','owner'].includes(mode))h+='<label>New '+(mode==='reset'?'temporary ':'')+'password<input name="newPassword" type="password" minlength="12" maxlength="128" required autocomplete="new-password"></label><label>Confirm password<input name="confirmPassword" type="password" minlength="12" required autocomplete="new-password"></label>';
 if(mode==='reset')h+='<label class="wide"><input name="verified" type="checkbox" required style="width:auto">I have verified the employee requesting this reset.</label>';
 if(mode==='login'||mode==='setup'||mode==='owner')showWelcome();$('authFields').innerHTML=h;$('authNote').textContent=mode==='forgot'?'Offline mode: ask an administrator or manager to approve your reset. The owner can use the saved owner recovery key.':mode==='reset'?'Give the temporary password privately to the verified employee. Existing sessions will be invalidated.':'Offline office · Your login session expires after one hour. Each employee uses their own username and password.';if(mode==='forgot')$('authNote').insertAdjacentHTML('beforeend',' <button type="button" class="secondary" onclick="showAuth(\'owner\')">Owner recovery</button>');if(mode==='setup')$('authNote').textContent='Create the first administrator. A recovery key will be shown once; keep it privately. All data and passwords remain on this computer.';if(!$('authDialog').open)$('authDialog').showModal();
}
function authBack(){if(window.FIRST_RUN){showAuth('setup');return;}if(app&&authMode!=='recovery'){$('authDialog').close();return;}showAuth('login');}
function authCall(fn,args,done){$('authError').style.display='none';$('authSubmit').disabled=true;try{google.script.run.withSuccessHandler(r=>{$('authSubmit').disabled=false;try{done(r);}catch(e){authError(e.message);}}).withFailureHandler(e=>{$('authSubmit').disabled=false;authError(e.message||String(e));})[fn](...args);}catch(e){$('authSubmit').disabled=false;authError(e.message);}}
function authError(message){$('authError').textContent=message;$('authError').style.display='block';}
function acceptLogin(r){window.FIRST_RUN=false;authToken=r.token;storeToken(authToken);$('authForm').reset();if(r.user.needsChange){showAuth('change');$('authNote').textContent='You must change your temporary password before accessing assignments.';}else{$('authDialog').close();refresh();}if(r.recoveryCode)showRecoveryCode(r.recoveryCode);}
function startReset(id){resetId=id;showAuth('reset');}
function signOut(){const old=authToken;authToken='';storeToken('');app=null;$('nav').innerHTML='';$('content').innerHTML='';$('identity').textContent='WELCOME TEAM';if($('editor').open)$('editor').close();authCall('logout',[old],()=>showAuth('login'));showAuth('login');}
$('authDialog').addEventListener('cancel',e=>{if(!app)e.preventDefault();});
$('authForm').onsubmit=e=>{e.preventDefault();const v=Object.fromEntries(new FormData(e.target));if(v.newPassword&&v.newPassword!==v.confirmPassword){authError('Passwords do not match.');return;}
 if(authMode==='setup'){if(v.password!==v.setupConfirm){authError('Passwords do not match.');return;}authCall('createAdministrator',[{name:v.name,email:v.email,username:v.username,password:v.password}],acceptLogin);return;}
 if(authMode==='owner'){authCall('recoverOwner',[v.username,v.recoveryCode,v.newPassword],acceptLogin);return;}
 if(authMode==='login')authCall('login',[v.username,v.password],acceptLogin);
 if(authMode==='forgot')authCall('forgotPassword',[v.username],message=>{$('authForm').reset();showAuth('login');$('authNote').textContent=message;});
 if(authMode==='change')authCall('changePassword',[authToken,v.currentPassword,v.newPassword],acceptLogin);
 if(authMode==='recovery')authCall('recoverPassword',[recoveryHash,v.newPassword],r=>{recoveryHash='';acceptLogin(r);});
 if(authMode==='reset')authCall('resetEmployeePassword',[authToken,resetId,v.newPassword,v.verified==='on'],r=>{$('authForm').reset();$('authDialog').close();receive(r);});
};
function startApp(){if(window.FIRST_RUN){showAuth('setup');return;}if(typeof google==='undefined'||!google.script){$('error').textContent='Start ABC_Office.exe and open its local office address.';$('error').style.display='block';return;}google.script.url.getLocation(location=>{if(location.parameter.recovery){recoveryHash=location.parameter.recovery;authToken='';storeToken('');showAuth('recovery');}else if(authToken)refresh();else showAuth('login');});}

function saveLocalFile(r){const raw=atob(r.base64),bytes=new Uint8Array(raw.length);for(let i=0;i<raw.length;i++)bytes[i]=raw.charCodeAt(i);const url=URL.createObjectURL(new Blob([bytes],{type:r.mime}));const a=document.createElement('a');a.href=url;a.download=r.filename;a.click();setTimeout(()=>URL.revokeObjectURL(url),60000);}
function renderBackups(){$('content').innerHTML='<section class="panel"><h2>Office database backup</h2><p>Download a complete backup containing all registers, assignments, time entries, office updates and local accounts. Keep the backup privately on a separate drive.</p><button onclick="backupOffice()">Download database backup</button><p id="backupStatus" class="muted"></p><p class="muted">A dated backup is also made automatically whenever the office server starts on a new date. Restore instructions are in START_HERE.html.</p></section>';}
function backupOffice(){rpc('backupDatabase',[],r=>{saveLocalFile(r);$('backupStatus').textContent='Backup created. Save it in a safe location.';});}
function showRecoveryCode(code){let d=document.getElementById('recoverySave');if(!d){d=document.createElement('dialog');d.id='recoverySave';document.body.appendChild(d);}d.innerHTML='<h2>Save your owner recovery key</h2><p>This key can reset the owner account if its password is lost. Keep it privately. It is replaced whenever owner recovery is used.</p><textarea id="savedRecoveryCode" readonly></textarea><div class="actions"><button id="saveRecoveryButton">Download recovery key</button><button class="secondary" id="closeRecoveryButton">I have saved the key</button></div>';$('savedRecoveryCode').value=code;$('saveRecoveryButton').onclick=()=>{const blob=new Blob(['ABC Chartered Accountants\nOwner recovery key: '+code+'\nKeep this privately.\n'],{type:'text/plain'});const url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='ABC-Owner-Recovery-Key.txt';a.click();setTimeout(()=>URL.revokeObjectURL(url),60000);};$('closeRecoveryButton').onclick=()=>d.close();d.showModal();}

startApp();
</script></body></html>
