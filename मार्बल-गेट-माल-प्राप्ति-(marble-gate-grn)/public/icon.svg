<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f766e" />
      <stop offset="100%" stop-color="#134e4a" />
    </linearGradient>
    <linearGradient id="marble" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc" />
      <stop offset="100%" stop-color="#cbd5e1" />
    </linearGradient>
    <linearGradient id="amber" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
  </defs>
  <!-- Background with safe zone padding -->
  <rect width="512" height="512" rx="100" fill="url(#bg)" />
  
  <!-- Factory Gate & Marble Block Icon -->
  <g transform="translate(56, 56) scale(0.78)">
    <!-- 3D Isometric Marble Block -->
    <!-- Top Face -->
    <polygon points="256,70 410,150 256,230 102,150" fill="#f1f5f9" stroke="#94a3b8" stroke-width="6" stroke-linejoin="round" />
    <!-- Left Face -->
    <polygon points="102,150 256,230 256,380 102,300" fill="#cbd5e1" stroke="#94a3b8" stroke-width="6" stroke-linejoin="round" />
    <!-- Right Face -->
    <polygon points="256,230 410,150 410,300 256,380" fill="#94a3b8" stroke="#64748b" stroke-width="6" stroke-linejoin="round" />
    
    <!-- Veins on Marble Block -->
    <path d="M 160 120 Q 220 180 320 185" stroke="#64748b" stroke-width="4" fill="none" opacity="0.6" stroke-linecap="round" />
    <path d="M 140 200 Q 180 270 200 340" stroke="#64748b" stroke-width="4" fill="none" opacity="0.6" stroke-linecap="round" />
    
    <!-- Factory Gate Badge -->
    <rect x="76" y="380" width="360" height="70" rx="16" fill="url(#amber)" stroke="#b45309" stroke-width="4" />
    <text x="256" y="428" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="36" fill="#1e293b" text-anchor="middle" letter-spacing="2">
      गेट माल प्राप्ति
    </text>
    
    <!-- Checkmark Badge -->
    <circle cx="390" cy="120" r="42" fill="#22c55e" stroke="#ffffff" stroke-width="6" />
    <path d="M 374 120 L 386 132 L 408 108" fill="none" stroke="#ffffff" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" />
  </g>
</svg>
