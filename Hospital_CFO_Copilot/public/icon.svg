<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="primary" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0ea5e9"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="104" fill="url(#bg)"/>
  
  <!-- Outer Shield Ring -->
  <path d="M256 64 C352 64, 400 96, 400 192 C400 320, 256 432, 256 448 C256 432, 112 320, 112 192 C112 96, 160 64, 256 64 Z" 
        fill="none" stroke="url(#primary)" stroke-width="16" stroke-linecap="round" stroke-linejoin="round"/>
  
  <!-- Hospital Cross with Financial Bars -->
  <!-- Vertical Cross Beam -->
  <rect x="236" y="148" width="40" height="152" rx="8" fill="url(#primary)"/>
  <!-- Horizontal Cross Beam -->
  <rect x="180" y="204" width="152" height="40" rx="8" fill="url(#primary)"/>
  
  <!-- Financial Upward Trendline & Node -->
  <polyline points="160,340 220,300 270,324 352,240" fill="none" stroke="#f8fafc" stroke-width="14" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="352" cy="240" r="12" fill="#38bdf8"/>
  
  <!-- Financial Indicator Dot -->
  <circle cx="256" cy="224" r="10" fill="#ffffff"/>
  
  <!-- Subtle CFO Text at Bottom of Shield -->
  <text x="256" y="388" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="34" font-weight="800" fill="#94a3b8" text-anchor="middle" letter-spacing="4">CFO COPILOT</text>
</svg>
