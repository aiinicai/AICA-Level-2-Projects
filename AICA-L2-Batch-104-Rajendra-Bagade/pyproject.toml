[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "auditlens"
version = "1.0.0"
description = "Statutory audit analytical review for Indian companies — Schedule III, SA 240, SA 320, SA 530 and CARO 2020."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "CA Rajendra Bagade" }]
keywords = ["audit", "schedule-iii", "caro-2020", "sa-240", "companies-act", "india"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Intended Audience :: Financial and Insurance Industry",
    "Topic :: Office/Business :: Financial :: Accounting",
]

dependencies = [
    "pandas>=2.0",
    "numpy>=1.24",
    "openpyxl>=3.1",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",          # FastAPI's TestClient needs it for the API tests
]

[project.scripts]
auditlens = "auditlens.cli:main"
auditlens-app = "auditlens.launch:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q --strict-markers"
