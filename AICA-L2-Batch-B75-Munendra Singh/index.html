<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FinAudit AI — Ind AS Statutory Disclosure Auditor & Consistency Verifier</title>
    <meta name="description" content="Offline statutory financial statement disclosure verification and note-by-note proofreading engine for Chartered Accountants & Auditors." />
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#141414" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      if ('serviceWorker' in navigator && window.location.protocol.startsWith('http')) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js').catch((err) => {
            console.log('ServiceWorker registration omitted or not supported:', err);
          });
        });
      }
    </script>
  </body>
</html>
