<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Task Tracker</title>
<meta name="theme-color" content="#132139">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@100..125,500..800&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
:root{
  --ground:#F2F4F8; --surface:#FFFFFF; --surface-2:#EBEEF4; --line:#DCE1EA; --line-2:#E8EBF1;
  --ink:#14203A; --ink-2:#4A556C; --ink-3:#7A8498;
  --navy:#1F3864; --navy-ink:#FFFFFF; --navy-soft:#E3E9F4;
  --ochre:#A8770A; --ochre-band:#BF9000; --ochre-ink:#1C1606; --ochre-soft:#F6ECD2;
  --ok:#1D7446; --ok-soft:#DDF0E4; --bad:#B3261E; --bad-soft:#FBE4E1; --warn:#8F5B00; --warn-soft:#FCEFD2;
  --focus:#2F6FEB; --shadow:0 10px 40px rgba(20,32,58,.18);
  --display:"Archivo","Arial Narrow",system-ui,sans-serif;
  --body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Consolas,monospace;
}
:root,:root[data-theme]{color-scheme:light}
*{box-sizing:border-box}
html,body{background:var(--ground);color:var(--ink)}
body{font-family:var(--body);font-size:14px;line-height:1.45;-webkit-text-size-adjust:100%}
button,input,select,textarea{font:inherit;color:inherit}
input[type=text],input[type=search],input[type=number],input[type=date],textarea,select{color:#14203A!important;-webkit-text-fill-color:#14203A;caret-color:#1F3864;background-color:#FFFFFF;color-scheme:light;-webkit-appearance:none;appearance:none;opacity:1}
input::placeholder,textarea::placeholder{color:#7A8498;-webkit-text-fill-color:#7A8498;opacity:1}
input[type=search]::-webkit-search-decoration{-webkit-appearance:none}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}

/* ---------- shell ---------- */
.app{display:grid;grid-template-columns:232px minmax(0,1fr);min-height:100vh}
.side{background:var(--surface);border-right:1px solid var(--line);padding:20px 12px;position:sticky;top:0;height:100vh;overflow:auto;display:flex;flex-direction:column;gap:18px}
.brand{padding:0 8px;display:grid;gap:2px}
.brand h1{margin:0;font-family:var(--display);font-stretch:112%;font-weight:800;font-size:21px;letter-spacing:-.01em;line-height:1.1}
.brand .fy{font-family:var(--mono);font-size:11.5px;color:var(--ink-3);letter-spacing:.02em}
.navgroup{display:grid;gap:1px}
.navlabel{font-size:10.5px;text-transform:uppercase;letter-spacing:.09em;color:var(--ink-3);font-weight:600;padding:0 8px 6px}
.nav{display:flex;align-items:center;gap:8px;width:100%;border:0;background:transparent;text-align:left;padding:7px 8px;border-radius:6px;color:var(--ink-2);font-weight:500}
.nav:hover{background:var(--surface-2);color:var(--ink)}
.nav[aria-current="true"]{background:var(--navy-soft);color:var(--ink);font-weight:600}
.nav .sw{width:8px;height:8px;border-radius:2px;background:var(--navy);flex:none}
.nav .sw.ochre{background:var(--ochre-band)}
.nav .n{margin-left:auto;font-family:var(--mono);font-size:11.5px;color:var(--ink-3)}
.nav .n.bad{color:var(--bad);font-weight:500}
.side-foot{margin-top:auto;display:grid;gap:2px}

.main{min-width:0;padding:22px 28px 120px}
.top{display:flex;flex-wrap:wrap;align-items:center;gap:12px 16px;margin-bottom:18px}
.top .date{font-family:var(--display);font-stretch:105%;font-weight:700;font-size:22px;letter-spacing:-.01em}
.top .date small{display:block;font-family:var(--body);font-weight:400;font-size:12.5px;color:var(--ink-3);letter-spacing:0}
.top .tools{margin-left:auto;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.top .date{line-height:1.15}
.search{position:relative;min-width:180px}
.search input{-webkit-user-select:text;user-select:text;-webkit-touch-callout:default;touch-action:manipulation;width:300px;height:36px;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:0 34px 0 32px;font-size:13.5px}
.search input::-webkit-search-cancel-button{display:none}
.search input:focus{border-color:var(--navy);outline:none;box-shadow:0 0 0 3px rgba(31,56,100,.12)}
.search svg{position:absolute;left:10px;top:10px;color:var(--ink-3);pointer-events:none}
.search kbd{position:absolute;right:8px;top:9px;font:11px var(--mono);color:var(--ink-3);border:1px solid var(--line);border-radius:4px;padding:0 5px;line-height:16px;background:var(--surface-2);pointer-events:none}
.search .clr{position:absolute;right:5px;top:5px;width:26px;height:26px;border:0;background:transparent;color:var(--ink-3);border-radius:6px;display:none;font-size:12px}
.search .clr:hover{background:var(--surface-2);color:var(--ink)}
.search.has kbd,.search:focus-within kbd{display:none}
.search.has .clr{display:grid;place-items:center}
@media (pointer:coarse){.search kbd{display:none}}
.switch{display:inline-flex;align-items:center;gap:9px;height:36px;padding:0 12px 0 10px;border:1px solid var(--line);background:var(--surface);border-radius:8px;font-size:13px;color:var(--ink-2);cursor:pointer;user-select:none;white-space:nowrap}
.switch:hover{background:var(--surface-2)}
.switch input{appearance:none;-webkit-appearance:none;width:30px;height:18px;border-radius:999px;background:var(--line);position:relative;margin:0;transition:background .15s;cursor:pointer;flex:none}
.switch input::after{content:"";position:absolute;top:2px;left:2px;width:14px;height:14px;border-radius:50%;background:#FFFFFF;box-shadow:0 1px 2px rgba(0,0,0,.25);transition:transform .15s}
.switch input:checked{background:var(--navy)}
.switch input:checked::after{transform:translateX(12px)}
.switch input:checked+span{color:var(--ink)}
.switch input:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.btn{height:36px;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:0 12px;font-weight:500;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.btn:hover{background:var(--surface-2)}
.btn.primary{background:var(--navy);border-color:var(--navy);color:var(--navy-ink)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.danger{color:var(--bad)}
.btn.ghost{border-color:transparent;background:transparent}
.toggle{display:inline-flex;align-items:center;gap:7px;font-size:13px;color:var(--ink-2);user-select:none;cursor:pointer}
.toggle input{accent-color:var(--navy);width:15px;height:15px}

/* ---------- summary ---------- */
.summary{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px;margin-bottom:10px}
.stat{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:11px 14px;text-align:left;display:grid;gap:1px}
.stat:hover{border-color:var(--ink-3)}
.stat b{font-family:var(--display);font-stretch:108%;font-size:26px;font-weight:700;line-height:1.1;font-variant-numeric:tabular-nums}
.stat span{font-size:12.5px;color:var(--ink-2)}
.stat.bad b{color:var(--bad)} .stat.warn b{color:var(--warn)} .stat.ok b{color:var(--ok)} .stat.navy b{color:var(--navy)}
.stat.zero b{color:var(--ink-3)}

/* ---------- sections ---------- */
.sec{background:var(--surface);border:1px solid var(--line);border-radius:10px;overflow:hidden;margin-bottom:18px}
.band{display:flex;align-items:center;gap:10px;background:var(--navy);color:var(--navy-ink);padding:8px 10px 8px 14px;min-height:40px}
.band.ochre{background:var(--ochre-band);color:var(--ochre-ink)}
.band.bad{background:var(--bad);color:#FFFFFF}
.notice.allclear{display:flex;align-items:center;gap:14px;color:var(--ok)}
.notice.allclear svg{width:34px;height:34px;flex:none}
.notice.allclear h2{color:var(--ok)}
.notice.allclear div{color:var(--ink-2)}
.band h2{margin:0;font-family:var(--display);font-stretch:110%;font-weight:700;font-size:14.5px;letter-spacing:.01em}
.band .cnt{font-family:var(--mono);font-size:11.5px;opacity:.8}
.band .rb{margin-left:auto;border:1px solid rgba(255,255,255,.4);background:transparent;color:inherit;border-radius:6px;height:28px;padding:0 10px;font-size:12.5px;font-weight:500}
.band.ochre .rb{border-color:rgba(28,22,6,.35)}
.band .rb:hover{background:rgba(255,255,255,.14)}
.band .rb[aria-pressed="true"]{background:#FFFFFF;border-color:#FFFFFF;color:#1F3864;font-weight:600}
.band .rb+.ic{margin-left:0}
.band .ic{margin-left:auto;border:0;background:transparent;color:inherit;opacity:.85;width:30px;height:28px;border-radius:6px;display:grid;place-items:center}
.band .ic:hover,.band .ic[aria-expanded="true"]{opacity:1;background:rgba(255,255,255,.14)}
.band .rb+.ic{margin-left:0}
.cols,.row{display:grid;grid-template-columns:44px minmax(220px,2.3fr) minmax(90px,.8fr) 84px minmax(120px,.9fr) minmax(110px,1.2fr) 138px 140px;align-items:center}
.cols{font-size:10.5px;text-transform:uppercase;letter-spacing:.08em;color:var(--ink-3);font-weight:600;background:var(--surface-2);border-bottom:1px solid var(--line)}
.cols>div{padding:6px 10px}
.row{border-bottom:1px solid var(--line-2);min-height:44px;cursor:pointer}
.row:last-of-type{border-bottom:0}
.row:hover{background:var(--surface-2)}
.row>div{padding:8px 10px;min-width:0}
.row .title{font-weight:500;overflow-wrap:anywhere}
.row .star{color:var(--ochre);margin-right:4px}
.row .tag{display:inline-block;font-size:10.5px;font-weight:600;letter-spacing:.03em;padding:1px 8px;border-radius:999px;margin-left:7px;vertical-align:1px;white-space:nowrap}
.chips .ldot{width:9px;height:9px;border-radius:50%;margin-right:7px;flex:none}
.chips input:checked+span .ldot{box-shadow:0 0 0 2px rgba(255,255,255,.8)}
.row .src{display:inline-block;font-size:11px;color:var(--ink-3);margin-right:6px}
.row .srcline{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;color:var(--ink-3);margin-top:3px}
.sdot{width:7px;height:7px;border-radius:2px;background:var(--navy);flex:none}
.sdot.ochre{background:var(--ochre-band)}
.row .subs{font-size:12px;color:var(--ink-3);margin-top:1px}
.row .cell-due{font-family:var(--mono);font-size:12.5px;font-variant-numeric:tabular-nums}
.row .cell-due small{display:block;color:var(--ink-3);font-size:11px}
.row .cell-freq,.row .cell-with{font-size:13px;color:var(--ink-2)}
.row .cell-rem{font-size:13px;color:var(--ink-2);overflow-wrap:anywhere;line-height:1.35;white-space:pre-line}
.row .cell-with .who{display:inline-flex;align-items:flex-start;white-space:normal;line-height:1.3}
.row .cell-with .who i{margin-top:0}
.row .cell-with .who i{flex:none}
.row .meta{display:none}
.row.is-done .title{color:var(--ink-3);text-decoration:line-through;text-decoration-color:var(--line)}
.row.is-done.recur .title{text-decoration:none}
.subhead{display:flex;width:100%;align-items:center;gap:6px;padding:5px 10px 5px 10px;font-size:10.5px;text-transform:uppercase;letter-spacing:.08em;color:var(--ink-3);font-weight:600;background:var(--surface-2);border:0;border-bottom:1px solid var(--line-2);text-align:left;cursor:pointer}
.subhead:hover{color:var(--ink);background:var(--line-2)}
.subhead svg{width:12px;height:12px;flex:none;transition:transform .15s;stroke-width:2.2}
.subhead[aria-expanded="false"] svg{transform:rotate(-90deg)}
.subhead[aria-expanded="false"]{border-bottom-color:var(--line)}
.row.grp-hidden{display:none!important}
.subhead .sn{font-family:var(--mono);font-weight:500;letter-spacing:0}
.row+.subhead{border-top:1px solid var(--line-2)}

.chk{width:22px;height:22px;border-radius:6px;border:1.5px solid var(--ink-3);background:var(--surface);display:grid;place-items:center;margin-left:12px;padding:0;color:transparent}
.chk:hover{border-color:var(--ok)}
.chk svg{width:14px;height:14px}
.is-done .chk{background:var(--ok);border-color:var(--ok);color:var(--surface)}
.chk-wrap{display:flex;align-items:center;padding:0!important;align-self:stretch}

.pill{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:500;padding:2px 8px;border-radius:999px;white-space:nowrap;background:var(--surface-2);color:var(--ink-2)}
.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor;opacity:.8}
.pill.done{background:var(--ok-soft);color:var(--ok)}
.pill.overdue{background:var(--bad-soft);color:var(--bad)}
.pill.soon{background:var(--warn-soft);color:var(--warn)}
.pill.later,.pill.open{background:transparent;color:var(--ink-3);padding-left:0}
.row.s-overdue{box-shadow:inset 3px 0 0 var(--bad)}
.row.s-soon{box-shadow:inset 3px 0 0 var(--warn)}
.row.is-done{box-shadow:none}
.row.is-free .title{color:var(--ink-2);font-weight:400}
.row.is-free .cell-due,.row.is-free .cell-rem,.row.is-free .cell-with{opacity:.7}
.pill.free{background:var(--surface-2);color:var(--ink-3)}
i.lg,i.sm{font-style:normal}
i.sm{display:none}
.groupby{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.groupby .lb{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--ink-3);font-weight:600}
.groupby .seg span{padding:6px 14px}
.groupby .btn.sm svg{width:14px;height:14px}
.groupby .btn.sm{margin-left:auto}
.pill.checked{background:var(--navy-soft);color:var(--navy)}
.pill.checked::before{display:none}
.pill.checked svg{width:12px;height:12px}
.row.is-checked{box-shadow:none}
.row.is-checked .title{color:var(--ink-3)}
.row.is-checked .cell-due,.row.is-checked .cell-rem,.row.is-checked .cell-with,.row.is-checked .meta{opacity:.65}
.row.is-checked .chk{border-color:var(--navy);background:var(--navy-soft);color:var(--navy)}
.pill.free::before{display:none}
.pill.free svg{width:12px;height:12px}
.starbtn.free{margin-left:0}
.starbtn.free:hover{border-color:var(--navy);color:var(--navy)}
.starbtn.free[aria-pressed="true"]{background:var(--navy-soft);border-color:var(--navy);color:var(--navy)}
.starbtn.free[aria-pressed="true"] svg{fill:none}
.freq{display:inline-block;font-size:10.5px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;padding:1px 6px;border-radius:4px;background:var(--navy-soft);color:var(--navy);white-space:nowrap}
.who{display:inline-flex;align-items:center;gap:6px;font-size:13px;color:var(--ink-2);max-width:100%}
.who i{width:20px;height:20px;border-radius:50%;display:grid;place-items:center;font-style:normal;font-size:10.5px;font-weight:700;color:#FFFFFF;flex:none}
.meta .who{font-size:12.5px}
.meta .who i{width:16px;height:16px;font-size:9px}
.band .chev{border:0;background:transparent;color:inherit;width:22px;height:22px;border-radius:5px;display:grid;place-items:center;padding:0;opacity:.85;margin-left:-6px}
.band .chev:hover{opacity:1;background:rgba(255,255,255,.14)}
.band .chev svg{width:14px;height:14px;transition:transform .15s}
.sec.collapsed .chev svg{transform:rotate(-90deg)}
.sec.collapsed>:not(.band){display:none}
.band h2[data-collapse]{cursor:pointer}
.band .sub{font-size:12px;opacity:.85;display:inline-flex;align-items:center;gap:8px;white-space:nowrap}
.band .bar{width:64px;height:5px;border-radius:3px;background:rgba(255,255,255,.25);overflow:hidden;display:inline-block}
.band .bar i{display:block;height:100%;background:#FFFFFF;border-radius:3px}
.band.ochre .bar{background:rgba(28,22,6,.2)}
.band.ochre .bar i{background:#1C1606}
.cycle{margin-bottom:22px;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:10px 14px;display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:12px;font-size:12.5px;color:var(--ink-2)}
.cycle b{font-family:var(--display);font-stretch:108%;font-size:13.5px;color:var(--ink);font-weight:700;white-space:nowrap}
.cycle .track{height:8px;border-radius:4px;background:var(--surface-2);overflow:hidden}
.cycle .track i{display:block;height:100%;background:var(--navy);border-radius:4px;transition:width .3s}
.cycle .track i.full{background:var(--ok)}
.cycle .val{font-family:var(--mono);color:var(--ink-3);white-space:nowrap}

.inline-add{display:flex;align-items:center;gap:8px;border-top:1px solid var(--line-2);padding:4px 10px 4px 12px}
.inline-add .plus{color:var(--ink-3);width:22px;text-align:center;font-size:18px;line-height:1}
.inline-add input{flex:1;border:0;background:transparent;height:36px;outline:none}
.inline-add input::placeholder{color:var(--ink-3)}
.inline-add:focus-within{background:var(--surface-2)}
.empty{padding:16px 14px;color:var(--ink-3);font-size:13px}
.notice{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:18px;color:var(--ink-2);max-width:60ch}
.notice h2{margin:0 0 4px;font-family:var(--display);font-size:17px;color:var(--ink)}

.fab{display:none}

/* ---------- sheet / dialog ---------- */
.scrim{position:fixed;inset:0;background:rgba(8,14,28,.45);display:flex;align-items:center;justify-content:center;padding:20px;z-index:40}
.sheet{background:var(--surface);color:var(--ink);width:min(620px,100%);max-height:calc(100vh - 40px);overflow:auto;border-radius:14px;box-shadow:var(--shadow);display:flex;flex-direction:column}
.sheet header{display:flex;align-items:center;gap:8px;padding:14px 18px 6px}
.sheet header h3{margin:0;font-family:var(--display);font-stretch:108%;font-size:17px;font-weight:700}
.sheet header .btn{margin-left:auto}
.sheet .body{padding:8px 18px 16px;display:grid;gap:14px}
.sheet footer{display:flex;gap:8px;padding:12px 18px;border-top:1px solid var(--line);position:sticky;bottom:0;background:var(--surface)}
.sheet footer .spacer{flex:1}
.f{display:grid;gap:5px}
.f>label,.f .lb{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--ink-3);font-weight:600}
.f input[type=text],.f input[type=date],.f input[type=number],.f select,.f textarea{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 10px;min-height:38px}
.f textarea{resize:vertical;min-height:62px}
.f .big{font-size:16px;font-weight:500}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips label{position:relative}
.chips input{position:absolute;opacity:0;pointer-events:none}
.chips span{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:999px;padding:5px 11px;font-size:13px;cursor:pointer;background:var(--surface)}
.chips .dot{width:8px;height:8px;border-radius:2px;background:var(--navy);margin-right:7px;flex:none}
.chips .dot.ochre{background:var(--ochre-band)}
.chips input:checked+span .dot{background:#FFFFFF}
.chips input:checked+span .dot.ochre{background:#F3CB57}
.chips .av{display:inline-grid;place-items:center;width:18px;height:18px;border-radius:50%;font-size:9.5px;font-weight:700;font-style:normal;color:#FFFFFF;margin:-2px 7px -2px -4px;flex:none}
.chips .av.none{border:1.5px dashed var(--ink-3);background:transparent}
.chips input:checked+span .av.none{border-color:rgba(255,255,255,.7)}
.chips input:checked+span{background:var(--navy);border-color:var(--navy);color:var(--navy-ink)}
.chips input:focus-visible+span{outline:2px solid var(--focus);outline-offset:2px}
.duebox{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.duebox input[type=number]{width:74px}
.duebox .muted{color:var(--ink-3);font-size:13px}
.subtask{display:flex;align-items:center;gap:8px}
.subtask input[type=checkbox]{accent-color:var(--ok);width:17px;height:17px;flex:none}
.subtask input[type=text]{flex:1;min-height:34px!important}
.subtask .x{border:0;background:transparent;color:var(--ink-3);width:28px;height:28px;border-radius:6px}
.subtask .x:hover{background:var(--surface-2);color:var(--bad)}
.history{font-size:12.5px;color:var(--ink-2);display:flex;flex-wrap:wrap;gap:6px}
.history span{font-family:var(--mono);background:var(--ok-soft);color:var(--ok);padding:1px 7px;border-radius:5px;font-size:11.5px}

.steps-head{display:flex;align-items:center}

.band-preview{border:1px solid var(--line);border-radius:10px;overflow:hidden}

.secstats{font-size:12.5px;color:var(--ink-3);margin-top:6px}
.chips .sw2{width:14px;height:14px;border-radius:4px;margin-right:8px;flex:none;box-shadow:inset 0 0 0 1px rgba(0,0,0,.12)}
.chips input:checked+span .sw2{box-shadow:0 0 0 2px #FFFFFF}
.f .hint{font-size:12px;color:var(--ink-3);margin-top:2px}
.pos{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.pos .posv{font-size:13px;color:var(--ink-2);margin-right:4px}

.chk.sel{border-color:var(--navy);color:transparent;border-radius:6px}

body.selecting .row{cursor:pointer}

.sbar{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--ink);color:#FFFFFF;border-radius:12px;padding:8px 8px 8px 14px;display:flex;align-items:center;gap:6px;flex-wrap:wrap;justify-content:center;z-index:45;box-shadow:var(--shadow);max-width:calc(100vw - 24px)}

.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:var(--surface);padding:9px 10px 9px 16px;border-radius:10px;display:flex;align-items:center;gap:12px;box-shadow:var(--shadow);z-index:60;font-size:13.5px;max-width:calc(100vw - 32px)}

.picker{display:flex;align-items:center;gap:10px;width:100%;min-height:44px;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:6px 10px 6px 12px;text-align:left;color:var(--ink);font-size:14.5px;font-weight:500}

.picker .ldot{width:10px;height:10px;border-radius:50%;flex:none}
.pk-scrim{z-index:70}
.pk-sheet{width:min(440px,100%);max-height:min(560px,calc(100vh - 40px))}
.pk-sheet header{padding:12px 16px 8px}

.tform{gap:12px;padding:14px 16px 22px}

.tform .preview{margin-top:10px;font-size:13px}

.chip-add{border:1px dashed var(--ink-3);background:transparent;border-radius:999px;padding:5px 11px;font-size:13px;color:var(--ink-2)}

.addline{display:flex;gap:8px;margin-top:8px;align-items:center}

.person-row{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--line-2);min-height:44px}

.hint{margin:0;color:var(--ink-3);font-size:12.5px}
.row .cell-more{padding:0 6px 0 0!important;display:flex;justify-content:flex-end;gap:2px}
.more.today,.more.mug,.more.starb{color:var(--ink-3)}
.more.today svg,.more.mug svg,.more.starb svg{width:17px;height:17px}

@media (hover:hover){.row .more.today:not(.on),.row .more.mug:not(.on),.row .more.starb:not(.on){opacity:.45}.row:hover .more.today,.row:hover .more.mug,.row:hover .more.starb{opacity:1}}
.more{width:32px;height:32px;border:0;background:transparent;border-radius:7px;color:var(--ink-3);display:grid;place-items:center;padding:0}
.more:hover,.more[aria-expanded="true"]{background:var(--line);color:var(--ink)}
.menu{position:fixed;z-index:50;background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);padding:5px;min-width:200px}

.reordering .cols,.reordering .row{grid-template-columns:44px minmax(220px,2.6fr) minmax(96px,.9fr) 84px minmax(70px,.7fr) minmax(110px,1.2fr) 138px 44px}

.reordering .row:hover{background:transparent}
.menu .del.armed{background:var(--bad);color:#FFFFFF}
.menu .del.armed svg{color:#FFFFFF}
.btn.sm{height:30px;padding:0 10px;font-size:12.5px}
.srow,.prow{background:var(--surface);position:relative}

.handle:hover{background:var(--surface-2);color:var(--ink)}
.dragging .handle{cursor:grabbing;color:var(--navy);background:var(--navy-soft)}

.row{position:relative}

<script>
const MONTHS=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const DAYS=['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
const CHECK='<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M3.5 8.5l3 3 6-7"/></svg>';
const NAV_ICONS={
  all:'<svg class="ic" viewBox="0 0 16 16"><path d="M2.5 4h11M2.5 8h11M2.5 12h7"/></svg>',
  attn:'<svg class="ic" viewBox="0 0 16 16"><path d="M3.5 14V2.5h8.5l-2 3 2 3H3.5"/></svg>',
  noone:'<svg class="ic" viewBox="0 0 16 16"><circle cx="8" cy="8" r="5" stroke-dasharray="2.2 2.2"/></svg>',
  today:'<svg class="ic" viewBox="0 0 16 16"><rect x="2.5" y="3.5" width="11" height="10" rx="2"/><path d="M2.5 6.5h11M5.5 2v2.5M10.5 2v2.5M5.8 10l1.6 1.6 3-3.2"/></svg>',
  free:'<svg class="ic" viewBox="0 0 16 16"><path d="M3 6h8v3.5A3.5 3.5 0 0 1 7.5 13h-1A3.5 3.5 0 0 1 3 9.5z"/><path d="M11 7h1.2a1.5 1.5 0 0 1 0 3H11"/><path d="M5.5 2.5v1.5M8.5 2.5v1.5"/></svg>',
  plus:'<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M8 3v10M3 8h10"/></svg>',
  edit:'<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"><path d="M11 2.5l2.5 2.5L6 12.5H3.5V10z"/></svg>'
};
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const $=s=>document.querySelector(s);

let db=null, downloads=null;
let tasks=[], sections=[], loadedT=false, loadedS=false, failed=null;
let view='all', showDone=false, showChecked=false, query='';
let peopleList=[], adding=null, reorderSec=null;
let selectMode=false, selected=new Set();
let attnBy='status';try{attnBy=localStorage.getItem('dr.attnBy')==='section'?'section':'status'}catch(e){}

/* ---------- dates & cycles ---------- */
function today(){const d=new Date();d.setHours(0,0,0,0);return d}
function todayISO(){const d=today();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function ordinal(n){const s=['th','st','nd','rd'],v=n%100;return n+(s[(v-20)%10]||s[v]||s[0])}
function clampDay(y,m,day){const last=new Date(y,m+1,0).getDate();return new Date(y,m,Math.min(day,last))}
function secondSaturday(y,m){const f=new Date(y,m,1);return new Date(y,m,1+((6-f.getDay()+7)%7)+7)}
function parseISO(s){if(!s)return null;const [y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d)}
function fmt(d,withYear){if(!d)return'';const s=d.getDate()+' '+MONTHS[d.getMonth()];return withYear||d.getFullYear()!==today().getFullYear()?s+' '+d.getFullYear():s}
function fyStart(d){return d.getMonth()>=3?d.getFullYear():d.getFullYear()-1}
function fyLabel(fy){return 'FY '+fy+'-'+String((fy+1)%100).padStart(2,'0')}
const FREQS=['Daily','Weekly','Monthly','Quarterly','Annual','One-time'];
const FREQ_LABEL={'Daily':'Daily','Weekly':'Weekly','Monthly':'Monthly','Quarterly':'Quarterly','Annual':'Annual','One-time':'Once'};
const WD=['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];
const isRecurring=t=>['Daily','Weekly','Monthly','Quarterly','Annual'].includes(t.frequency);
const isoOf=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
/* Cycle, due date and status of every task are calculated in Python (cycles.py)
   and arrive with each task as t._info. */
const NOINFO={c:{key:null,label:null,deadline:null,start:null},done:false,state:'open',days:null,free:false,checked:false,dueText:'',pill:''};
function info(t){return t._info||NOINFO}
function dueText(t){return info(t).dueText}
function pillText(t,i){return i.pill}

/* ---------- filtering ---------- */
function matches(t){
  if(!query)return true;
  const hay=[t.title,t.remarks,t.owner,t.tag,(t.subtasks||[]).map(s=>s.text).join(' ')].join(' ').toLowerCase();
  return query.toLowerCase().split(/\s+/).every(w=>hay.includes(w));
}
function visible(t,i){
  if(!matches(t))return false;
  if(!showDone&&i.done)return false;
  if(!showChecked&&i.checked)return false;
  return true;
}
const secById=id=>sections.find(s=>s.id===id);
const byOrder=(a,b)=>(a.order??0)-(b.order??0)||String(a.title).localeCompare(String(b.title));

function allPeople(){
  const listed=peopleList.filter(Boolean);
  const extra=[...new Set(tasks.map(t=>(t.owner||'').trim()).filter(x=>x&&!listed.includes(x)))].sort((a,b)=>a.localeCompare(b));
  return [...new Set([...listed,...extra])];
}

/* ---------- render ---------- */
function render(){
  if(drag){pendingRender=true;return}
  const now=today();
  $('#today').innerHTML=esc(DAYS[now.getDay()])+', '+esc(fmt(now,true))+'<small>'+esc(fyLabel(fyStart(now)))+' · '+esc(MONTHS[now.getMonth()])+' compliance cycle</small>';
  $('#fyLabel').textContent=fyLabel(fyStart(now));
  if(failed){$('#content').innerHTML='<div class="notice"><h2>Your worksheet can\'t load here</h2>'+esc(failed)+'</div>';$('#summary').innerHTML='';renderNav({});return}
  if(!(loadedT&&loadedS))return;

  const infos=new Map(tasks.map(t=>[t.id,info(t)]));
  const open=tasks.filter(t=>!infos.get(t.id).done);
  const overdue=open.filter(t=>{const i=infos.get(t.id);return i.state==='overdue'&&!i.checked});
  const week=open.filter(t=>{const i=infos.get(t.id);return !i.free&&!i.checked&&i.days!=null&&i.days>=0&&i.days<=7});
  const rank=t=>{const i=infos.get(t.id);return i.done?4:i.free?3:i.checked?2:t.starred?0:1};
  const dl=t=>{const d=infos.get(t.id).c.deadline;return d?d.getTime():Infinity};
  const byFree=(a,b)=>rank(a)-rank(b)||dl(a)-dl(b)||byOrder(a,b);
  const freeCount=open.filter(t=>infos.get(t.id).free).length;
  const doneMonth=tasks.filter(t=>{const i=infos.get(t.id);if(!i.done)return false;const d=t.doneAt?new Date(t.doneAt):null;return d&&d.getMonth()===now.getMonth()&&d.getFullYear()===now.getFullYear()});
  const SHORT={'Overdue':'Overdue','Due in 7 days':'Due 7d','Open tasks':'Open','Pending today':'Pending',['Done in '+MONTHS[now.getMonth()]]:'Done '+MONTHS[now.getMonth()]};
  const stat=(n,label,cls,v)=>'<button class="stat '+(n?cls:'zero')+'" data-view="'+v+'"><b>'+n+'</b><span><i class="lg">'+label+'</i><i class="sm">'+(SHORT[label]||label)+'</i></span></button>';
  const monthly=tasks.filter(t=>isRecurring(t)),mDone=monthly.filter(t=>infos.get(t.id).done).length;
  const cycle=monthly.length?'<div class="cycle"><b><i class="lg">Repeating tasks · current cycle</i><i class="sm">Repeating</i></b><span class="track" aria-hidden="true"><i class="'+(mDone===monthly.length?'full':'')+'" style="width:'+Math.round(mDone/monthly.length*100)+'%"></i></span><span class="val">'+mDone+' / '+monthly.length+' done</span></div>':'';
  const leftToday=open.filter(t=>{const i=infos.get(t.id);return !i.checked&&!i.free}).length;
  $('#summary').innerHTML=stat(overdue.length,'Overdue','bad','attention')+stat(week.length,'Due in 7 days','warn','attention')+stat(open.length,'Open tasks','','all')+stat(leftToday,'Pending today','navy','pending')+stat(doneMonth.length,'Done in '+MONTHS[now.getMonth()],'ok','all');
  $('#cycleHost').innerHTML=cycle;

  const people=allPeople();
  renderNav({infos,overdue,people,freeCount});

  const active=document.activeElement;
  const refocus=active&&active.closest&&active.closest('.inline-add')?active.closest('.inline-add').dataset.sec:null;

  let html='';
  if(view==='all'){
    if(!sections.length)html='<div class="notice"><h2>No sections yet</h2>Create a section to start adding tasks.</div>';
    for(const s of sections){
      const list=tasks.filter(t=>t.section===s.id&&visible(t,infos.get(t.id))).sort(byFree);
      if(query&&!list.length)continue;
      html+=sectionBlock(s,list,infos,false);
    }
  }else if(view.startsWith('sec:')){
    const s=secById(view.slice(4));
    if(s)html=sectionBlock(s,tasks.filter(t=>t.section===s.id&&visible(t,infos.get(t.id))).sort(byFree),infos,false);
  }else if(view==='attention'){
    const att=open.filter(t=>{const i=infos.get(t.id);return matches(t)&&!i.checked&&(i.state==='overdue'||(i.days!=null&&i.days<=7&&!i.free)||t.starred)});
    const byDeadline=(a,b)=>{const x=infos.get(a.id).c.deadline,y=infos.get(b.id).c.deadline;return (x?x.getTime():9e15)-(y?y.getTime():9e15)||byOrder(a,b)};
    const gStar=att.filter(t=>t.starred).sort(byDeadline);
    const gOver=att.filter(t=>!t.starred&&infos.get(t.id).state==='overdue').sort(byDeadline);
    const gSoon=att.filter(t=>!t.starred&&infos.get(t.id).state!=='overdue').sort(byDeadline);
    const todayN=gSoon.filter(t=>infos.get(t.id).days===0).length;
    html='<div class="groupby"><span class="lb">Group by</span><div class="seg" role="radiogroup"><label><input type="radio" name="attnBy" value="status"'+(attnBy==='status'?' checked':'')+'><span>Status</span></label><label><input type="radio" name="attnBy" value="section"'+(attnBy==='section'?' checked':'')+'><span>Section</span></label></div></div>';
    if(attnBy==='section'){
      const rk=t=>{const i=infos.get(t.id);return t.starred?0:i.state==='overdue'?1:2};
      for(const sc of sections){
        const items=att.filter(t=>t.section===sc.id).sort((a,b)=>rk(a)-rk(b)||byDeadline(a,b));if(!items.length)continue;
        const st=items.filter(t=>t.starred).length,ov=items.filter(t=>!t.starred&&infos.get(t.id).state==='overdue').length,sn=items.length-st-ov;
        const sub=[st?st+' starred':'',ov?ov+' overdue':'',sn?sn+' due soon':''].filter(Boolean).join(' · ');
        html+=sectionBlock({id:'',name:sc.name,color:sc.color,virtual:true,sub,secId:sc.id},items,infos,false);
      }
      if(!att.length)html='';
    }else{
    if(gStar.length)html+=sectionBlock({id:'',name:'Starred',color:'navy',virtual:true,hideStar:true,sub:'Pinned by you — stays here until you unstar it'},gStar,infos,true);
    if(gOver.length)html+=sectionBlock({id:'',name:'Overdue',color:'bad',virtual:true,sub:gOver.length+' past due'},gOver,infos,true);
    if(gSoon.length)html+=sectionBlock({id:'',name:'Due in the next 7 days',color:'ochre',virtual:true,sub:todayN?todayN+' due today':''},gSoon,infos,true);
    if(!att.length)html='';
    }
    if(!html)html='<div class="notice allclear"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="8" cy="8" r="6.5"/><path d="M5 8.3l2 2 4-4.5"/></svg><div><h2>All clear</h2>'+(query?'Nothing matching your search needs attention.':'Nothing overdue, nothing due this week, nothing starred.')+'</div></div>';
  }else if(view==='pending'){
    const list=open.filter(t=>{const i=infos.get(t.id);return !i.checked&&!i.free&&matches(t)});
    html='<div class="groupby"><span class="lb">Pending today · '+list.length+' task'+(list.length===1?'':'s')+'</span></div>';
    for(const sc of sections){
      const items=list.filter(t=>t.section===sc.id).sort(byFree);if(!items.length)continue;
      const ov=items.filter(t=>infos.get(t.id).state==='overdue').length;
      html+=sectionBlock({id:'',name:sc.name,color:sc.color,virtual:true,sub:items.length+' pending'+(ov?' · '+ov+' overdue':'')},items,infos,false);
    }
    if(!list.length)html='<div class="notice allclear"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="8" cy="8" r="6.5"/><path d="M5 8.3l2 2 4-4.5"/></svg><div><h2>Nothing pending today</h2>'+(query?'No matching tasks are pending.':'Every open task has been checked for today.')+'</div></div>';
  }else if(view==='free'){
    const list=open.filter(t=>{const i=infos.get(t.id);return i.free&&matches(t)&&(showChecked||!i.checked)}).sort((a,b)=>(secById(a.section)?.order??0)-(secById(b.section)?.order??0)||byOrder(a,b));
    html=sectionBlock({id:'',name:'When free',color:'navy',virtual:true,sub:'Kept for a quiet hour — left out of Needs attention'},list,infos,true);
  }else if(view.startsWith('person:')){
    const p=view.slice(7);
    const list=tasks.filter(t=>(t.owner||'').trim()===p&&visible(t,infos.get(t.id)));
    html='<div class="groupby"><span class="lb">'+(p?'With '+esc(p):'With no one')+' · '+list.length+' task'+(list.length===1?'':'s')+'</span></div>';
    for(const sc of sections){
      const items=list.filter(t=>t.section===sc.id).sort(byFree);if(!items.length)continue;
      const ov=items.filter(t=>infos.get(t.id).state==='overdue').length;
      html+=sectionBlock({id:'',name:sc.name,color:sc.color,virtual:true,sub:items.length+' task'+(items.length===1?'':'s')+(ov?' · '+ov+' overdue':'')},items,infos,false);
    }
    if(!list.length)html+='<div class="notice"><h2>Nothing here</h2>'+(query?'No matching tasks.':(p?esc(p)+' has no open tasks.':'Every open task has someone handling it.'))+'</div>';
  }
  $('#content').innerHTML=html;
  renderSelbar();
  if(refocus!=null){const inp=document.querySelector('.inline-add[data-sec="'+CSS.escape(refocus)+'"] input');if(inp)inp.focus()}
}

const WHO_COLORS=['#3B5BA5','#2E7D5B','#A0561B','#7A4EA3','#B0742A','#2A7A8C'];
const LABEL_COLORS=[['#E3E9F4','#1F3864'],['#DDF0E4','#1D6A40'],['#F6ECD2','#7A5A08'],['#EDE3F7','#5B3B87'],['#FBE4E1','#8F2A21'],['#D9EFF3','#1F5F6B']];
function labelColor(name){let h=0;for(const c of String(name).toLowerCase())h=(h*31+c.charCodeAt(0))>>>0;return LABEL_COLORS[h%LABEL_COLORS.length]}
function labelPill(name){if(!name)return'';const [bg,fg]=labelColor(name);return '<span class="tag" style="background:'+bg+';color:'+fg+'">'+esc(name)+'</span>'}
function whoColor(name){let h=0;for(const c of name)h=(h*31+c.charCodeAt(0))>>>0;return WHO_COLORS[h%WHO_COLORS.length]}
function who(name){
  if(!name)return'';
  return '<span class="who"><i style="background:'+whoColor(name)+'">'+esc(name.trim()[0].toUpperCase())+'</i>'+esc(name)+'</span>';
}
function bandSub(s,list){
  if(s.virtual)return s.sub?'<span class="sub">'+esc(s.sub)+'</span>':'';
  if(query)return '<span class="sub">'+list.length+' matching</span>';
  const all=tasks.filter(t=>t.section===s.id),rec=all.filter(isRecurring);
  const openN=all.filter(t=>!info(t).done).length,chkN=all.filter(t=>info(t).checked).length;
  if(rec.length){
    const d=rec.filter(t=>info(t).done).length,pct=Math.round(d/rec.length*100),extra=openN-(rec.length-d);
    return '<span class="sub"><span class="bar" aria-hidden="true"><i style="width:'+pct+'%"></i></span>'+d+' of '+rec.length+'<i class="lg"> done this cycle</i><i class="sm"> done</i>'+(extra>0?' · '+extra+'<i class="lg"> one-time open</i><i class="sm"> open</i>':'')+(chkN?' · '+chkN+'<i class="lg"> checked today</i><i class="sm"> checked</i>':'')+'</span>';
  }
  const freeN=all.filter(t=>info(t).free).length;
  return '<span class="sub">'+(openN?openN+' open'+(chkN?' · '+chkN+'<i class="lg"> checked today</i><i class="sm"> checked</i>':'')+(freeN?' · '+freeN+'<i class="lg"> when free</i><i class="sm"> free</i>':''):all.length?'All done':'Empty')+'</span>';
}

const ICON_CHEV='<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6l4 4 4-4"/></svg>';
function sectionBlock(s,list,infos,showSource){
  const ro=!s.virtual&&reorderSec===s.id;
  const col=!s.virtual&&!ro&&!query&&collapsed.has(s.id);
  let h='<section class="sec'+(ro?' reordering':'')+(col?' collapsed':'')+'" data-secid="'+esc(s.id||'')+'"><div class="band'+(s.color==='ochre'?' ochre':s.color==='bad'?' bad':'')+'">'+
    (s.virtual?'':'<button class="chev" data-collapse="'+esc(s.id)+'" aria-expanded="'+(!col)+'" aria-label="'+(col?'Expand':'Collapse')+' '+esc(s.name)+'">'+ICON_CHEV+'</button>')+
    '<h2'+(s.virtual?'':' data-collapse="'+esc(s.id)+'"')+'>'+esc(s.name)+'</h2>'+bandSub(s,list)+(ro?'<span class="cnt ro-hint">· Drag ⠿ to reorder</span>':'')+
    (selectMode&&list.length?'<button class="rb" data-select-all>'+(list.every(t=>selected.has(t.id))?'Deselect all':'Select all')+'</button>':'')+
    (s.virtual?'':(ro&&!selectMode?'<button class="rb" data-reorder="'+esc(s.id)+'" aria-pressed="true">Done</button>':'')+'<button class="ic" data-sec-menu="'+esc(s.id)+'" aria-haspopup="menu" aria-expanded="false" aria-label="Options for section '+esc(s.name)+'"><svg width="16" height="16" viewBox="0 0 16 16" fill="currentColor"><circle cx="3" cy="8" r="1.4"/><circle cx="8" cy="8" r="1.4"/><circle cx="13" cy="8" r="1.4"/></svg></button>')+'</div>';
  h+='<div class="cols"><div></div><div>Particulars</div><div>Due</div><div>Repeats</div><div>With</div><div>Remarks</div><div>Status</div><div></div></div>';
  if(!list.length)h+='<div class="empty">'+(query?'No matching tasks.':s.virtual?'Nothing here right now.':'No open tasks. Add one below.')+'</div>';
  const canDrag=!selectMode&&!ro&&list.length>0&&(s.virtual||canMoveInView());
  let seq=list;
  if(!s.virtual){
    const groups=FREQS.map(k=>[k,list.filter(t=>(t.frequency||'One-time')===k)]).filter(g=>g[1].length);
    if(groups.length>1)seq=groups.flatMap(([label,items])=>[{head:label,n:items.length,key:s.id+'|'+label},...items]);
  }
  let grpHidden=false;
  for(const [idx,t] of seq.entries()){
    if(t.head){grpHidden=!query&&!ro&&!selectMode&&subCollapsed.has(t.key);h+='<button type="button" class="subhead" data-subcol="'+esc(t.key)+'" aria-expanded="'+(!grpHidden)+'">'+ICON_CHEV+'<span class="sl">'+esc(t.head)+'</span><span class="sn">'+t.n+'</span></button>';continue}
    const i=infos.get(t.id),due=dueText(t),subs=t.subtasks||[];
    const srcSec=showSource?secById(t.section):null;
    const srcLine=srcSec?'<div class="srcline"><i class="sdot'+(srcSec.color==='ochre'?' ochre':'')+'"></i>'+esc(srcSec.name)+'</div>':'';
    const subLine=subs.length?'<div class="subs">'+subs.filter(x=>x.done).length+'/'+subs.length+' steps done</div>':'';
    const freq=t.frequency&&t.frequency!=='One-time'?t.frequency:'';
    const metaBits=[due?'<span class="m">'+esc(due)+'</span>':'',freq?'<span class="freq">'+esc(freq)+'</span>':'',t.owner?who(t.owner):'',t.remarks?'<span class="rem">'+esc(t.remarks)+'</span>':''].filter(Boolean).join('');
    const pt=pillText(t,i);
    const isSel=selectMode&&selected.has(t.id);
    h+='<div class="row s-'+i.state+(i.done?' is-done':'')+(i.free?' is-free':'')+(i.checked?' is-checked':'')+(isSel?' is-selected':'')+(grpHidden?' grp-hidden':'')+(isRecurring(t)?' recur':'')+(canDrag?' can-drag':'')+'" data-id="'+esc(t.id)+'" tabindex="0">'+(canDrag?'<span class="grip" aria-hidden="true">'+ICON_GRIP+'</span>':'')+
      '<div class="chk-wrap">'+(selectMode?'<button type="button" class="chk sel" data-select="'+esc(t.id)+'" aria-pressed="'+isSel+'" aria-label="'+(isSel?'Deselect':'Select')+': '+esc(t.title)+'">'+CHECK+'</button>':ro?'<button type="button" class="handle" data-drag aria-label="Drag to reorder '+esc(t.title)+' (or use arrow keys)">'+ICON_GRIP+'</button>':'<button class="chk" data-toggle="'+esc(t.id)+'" aria-pressed="'+i.done+'" aria-label="'+(i.done?'Mark not done':'Mark done')+': '+esc(t.title)+'">'+CHECK+'</button>')+'</div>'+
      '<div class="cell-main"><div class="title">'+(t.starred&&!s.hideStar&&(ro||selectMode)?'<span class="star" aria-label="Starred">★</span>':'')+esc(t.title)+labelPill(t.tag)+'</div>'+srcLine+subLine+(metaBits?'<div class="meta">'+metaBits+'</div>':'')+'</div>'+
      '<div class="cell-due">'+esc(due)+(i.c.deadline&&t.frequency!=='One-time'?'<small>'+esc(fmt(i.c.deadline))+'</small>':'')+'</div>'+
      '<div class="cell-freq">'+(freq?'<span class="freq">'+esc(freq)+'</span>':'')+'</div>'+
      '<div class="cell-with">'+who(t.owner)+'</div>'+
      '<div class="cell-rem"'+(t.remarks?' title="'+esc(t.remarks)+'"':'')+'>'+esc(t.remarks||'')+'</div>'+
      '<div class="cell-stat">'+(pt?'<span class="pill '+(i.checked?'checked':i.free?'free':i.state)+'">'+(i.checked?ICON_TODAY:i.free?ICON_MUG:'')+esc(pt)+'</span>':'')+'</div>'+
      '<div class="cell-more">'+((ro||selectMode||i.done)?'':'<button class="more starb'+(t.starred?' on':'')+'" data-star="'+esc(t.id)+'" aria-pressed="'+!!t.starred+'" title="'+(t.starred?'Unstar':'Star')+'" aria-label="'+(t.starred?'Unstar':'Star')+': '+esc(t.title)+'">'+ICON_STAR+'</button>')+((ro||selectMode||i.done)?'':'<button class="more mug'+(t.later?' on':'')+'" data-free="'+esc(t.id)+'" aria-pressed="'+!!t.later+'" title="'+(t.later?'Back to normal':'Do when free')+'" aria-label="'+(t.later?'Back to normal':'Do when free')+': '+esc(t.title)+'">'+ICON_MUG+'</button>')+((ro||selectMode||i.done)?'':'<button class="more today'+(i.checked?' on':'')+'" data-check="'+esc(t.id)+'" aria-pressed="'+i.checked+'" title="'+(i.checked?'Uncheck for today':'Checked for today')+'" aria-label="'+(i.checked?'Uncheck for today':'Check for today')+': '+esc(t.title)+'">'+ICON_TODAY+'</button>')+((ro||selectMode)?'':'<button class="more" data-more="'+esc(t.id)+'" aria-haspopup="menu" aria-expanded="false" aria-label="Options for '+esc(t.title)+'"><svg width="18" height="18" viewBox="0 0 16 16" fill="currentColor"><circle cx="3" cy="8" r="1.5"/><circle cx="8" cy="8" r="1.5"/><circle cx="13" cy="8" r="1.5"/></svg></button>')+'</div></div>';
  }
  if(!s.virtual)h+='<form class="inline-add" data-sec="'+esc(s.id)+'"><span class="plus">+</span><input type="text" placeholder="Add to '+esc(s.name)+' — type and press Enter" aria-label="Add task to '+esc(s.name)+'"></form>';
  return h+'</section>';
}

/* ---------- writes ---------- */
const clean=o=>JSON.parse(JSON.stringify(o));
function body(t){const {id,_info,_hist,...rest}=t;return clean(rest)}
async function write(fn,okMsg){
  try{await fn();if(okMsg)toast(okMsg)}
  catch(e){toast('Couldn\'t save. Check that the Python server (app.py) is still running.')}
  await refresh();
}
function toggle(id){
  const t=tasks.find(x=>x.id===id);if(!t)return;
  const before=body(t),i=info(t),next=body(t),now=new Date().toISOString();
  if(isRecurring(t)){
    next.history=next.history||{};
    if(i.done){next.doneFor=null;delete next.history[i.c.key];next.doneAt=null}
    else{next.doneFor=i.c.key;next.history[i.c.key]=now;next.doneAt=now}
  }else{next.status=i.done?'open':'done';next.doneAt=i.done?null:now}
  const ref=db.collection('tasks').doc(id);
  write(()=>ref.set(next));
  toast(i.done?'Marked not done':(isRecurring(t)?'Done for '+i.c.label:'Marked done'),()=>ref.set(before));
}
function selIds(){return [...selected].filter(id=>tasks.some(t=>t.id===id))}
function enterSelect(ids){selectMode=true;reorderSec=null;closeMenu();(ids||[]).forEach(id=>selected.add(id));render()}
function exitSelect(){selectMode=false;selected=new Set();render()}

  const pplOpts='<option value="">Assign to…</option><option value="-">No one</option>'+allPeople().map(x=>'<option value="'+esc(x)+'">'+esc(x)+'</option>').join('');

    const sdata={name,color:'navy',defaultFrequency:'One-time',order:Math.max(0,...sections.map(x=>x.order||0))+10};
    sections=[...sections,{id:ref.id,...sdata}];

  pickValue(name);
}

function readTaskForm(){

  d.starred=$('#fStar')?.getAttribute('aria-pressed')==='true';

  if(d.frequency==='Monthly'){
    const r=(document.querySelector('input[name=rule]:checked')||{}).value;
    if(r==='2nd-sat'){d.dueRule='2nd-sat';d.dueFrom=null;d.dueDay=null}
    else{d.dueRule=null;if(v('fFrom')!==undefined){const f=parseInt(v('fFrom'),10),dd=parseInt(v('fDay'),10);d.dueFrom=f>=1&&f<=31?f:null;d.dueDay=dd>=1&&dd<=31?dd:null}}

    const w=(document.querySelector('input[name=wd]:checked')||{}).value;d.dueWeekday=w?+w:null;d.dueDate=null;d.dueRule=null;d.dueFrom=null;d.dueDay=null;
  }else if(d.frequency==='Quarterly'){
    const dd=parseInt(v('fQDay'),10);d.dueDay=dd>=1&&dd<=31?dd:null;d.dueQOffset=(document.querySelector('input[name=qoff]:checked')||{}).value==='1'?1:0;d.dueDate=null;d.dueRule=null;d.dueFrom=null;
  }else if(d.frequency==='Daily'){d.dueDate=null;d.dueRule=null;d.dueFrom=null;d.dueDay=null;
  }else if(v('fDate')!==undefined){d.dueDate=v('fDate')||null;d.dueRule=null;d.dueFrom=null;d.dueDay=null}
  document.querySelectorAll('[data-st]').forEach(el=>{d.subtasks[+el.dataset.st].text=el.value});
  document.querySelectorAll('[data-si]').forEach(el=>{d.subtasks[+el.dataset.si].done=el.checked});

function renamePerson(oldName,raw){

  const names=[...new Set(allPeople().map(p=>p===oldName?name:p))];

function deletePerson(name){

    for(const t of affected)await db.collection('tasks').doc(t.id).update({owner:null});

let drag=null,pendingRender=false;
const itemSel=kind=>kind==='sec'?'.srow':kind==='person'?'.prow':kind==='nav'?'.navsec':kind==='navp'?'.navperson':'.row';
const kindOf=row=>row.classList.contains('srow')?'sec':row.classList.contains('prow')?'person':'task';
const idOf=x=>x.dataset.sid||x.dataset.pname||x.dataset.id;
function dragItems(list,kind){return [...list.children].filter(x=>x.matches(itemSel(kind))&&!x.classList.contains('grp-hidden'))}
document.addEventListener('pointerdown',e=>{
  const h=e.target.closest('[data-drag]');if(!h||e.button>0)return;
  const row=h.closest('.srow,.prow,.row');if(!row)return;
  e.preventDefault();
  try{h.setPointerCapture(e.pointerId)}catch(_){}
  const kind=kindOf(row);
  const r=row.getBoundingClientRect();
  drag={kind,row,list:row.parentElement,offset:e.clientY-r.top,ty:0,startX:e.clientX};
  drag.before=dragItems(drag.list,kind).map(idOf).join(',');
  row.classList.add('dragging');document.body.classList.add('is-dragging');
});
function dragMove(cx,cy){
  if(!drag)return;
  if(drag.kind==='task'){
    const drawerHidden=isPhone()&&!$('#side').classList.contains('open');
    const hit=[...document.querySelectorAll('.navsec,.navperson,.navnoone,.navattn,.navfree,.navall')].filter(n=>!drawerHidden||!n.closest('#side')).find(n=>{const r=n.getBoundingClientRect();return cx>=r.left-4&&cx<=r.right+4&&cy>=r.top-4&&cy<=r.bottom+4})||null;
    if(hit!==drag.navTarget){
      if(drag.navTarget)drag.navTarget.classList.remove('nav-drop');
      drag.navTarget=hit;
      if(hit)hit.classList.add('nav-drop');
      drag.row.classList.toggle('over-nav',!!hit);
    }
    const sd=document.querySelector('.side').getBoundingClientRect();
    if(hit||(!drawerHidden&&cx>=sd.left&&cx<=sd.right&&cy>=sd.top&&cy<=sd.bottom)){
      const nat=drag.row.getBoundingClientRect().top-drag.ty;
      drag.ty=cy-drag.offset-nat;
      drag.row.style.transform='translate('+(cx-(drag.startX??cx))+'px,'+drag.ty+'px)';
      return;
    }
    if(!drag.list.dataset.secid){
      const nat=drag.row.getBoundingClientRect().top-drag.ty;
      drag.ty=cy-drag.offset-nat;
      drag.row.style.transform='translate('+(cx-(drag.startX??cx))+'px,'+drag.ty+'px)';
      return;
    }
  }
  if(drag.kind==='task'&&drag.cross){
    const secs=[...document.querySelectorAll('#content .sec')].filter(x=>x.dataset.secid&&!x.classList.contains('reordering')&&!x.classList.contains('collapsed'));
    let over=null,best=Infinity;
    for(const sc of secs){
      const r=sc.getBoundingClientRect();
      if(cy>=r.top&&cy<=r.bottom){over=sc;break}
      const d=cy<r.top?r.top-cy:cy-r.bottom;if(d<best){best=d;over=sc}
    }
    if(over&&over!==drag.list){
      over.insertBefore(drag.row,over.querySelector(':scope > .inline-add'));
      drag.row.style.transform='';drag.ty=0;drag.list=over;
      secs.forEach(sc=>sc.classList.toggle('drop-target',sc===over&&sc.dataset.secid!==drag.fromSec));
    }
  }
  const {row,list,kind}=drag,x=drag.axis==='x',y=x?cx:cy;
  const lead=r=>x?r.left:r.top,size=r=>x?r.width:r.height;
  const sibs=dragItems(list,kind).filter(el=>el!==row);
  let target=null;
  for(const sb of sibs){const r=sb.getBoundingClientRect();if(y<lead(r)+size(r)/2){target=sb;break}}
  const anchor=target||(sibs.length?sibs[sibs.length-1].nextSibling:(kind==='task'?list.querySelector(':scope > .inline-add'):null));
  if(anchor!==row&&row.nextSibling!==anchor){list.insertBefore(row,anchor);row.style.transform='';drag.ty=0}
  const nat=lead(row.getBoundingClientRect())-drag.ty;
  drag.ty=y-drag.offset-nat;
  row.style.transform=kind==='task'?'translate('+(cx-(drag.startX??cx))+'px,'+drag.ty+'px)':(x?'translateX(':'translateY(')+drag.ty+'px)';
}
function dragScrollStep(){
  if(!drag||!drag.last)return;
  const {kind,row}=drag,x=drag.axis==='x',cx=drag.last.x,cy=drag.last.y,y=x?cx:cy;
  let moved=false;
  if(kind==='nav'||kind==='navp'){
    const sc=row.closest('.side');
    if(sc){const sr=sc.getBoundingClientRect(),before=x?sc.scrollLeft:sc.scrollTop;
      if(x){if(y<sr.left+40)sc.scrollLeft-=8;else if(y>sr.right-40)sc.scrollLeft+=8}
      else{if(y<sr.top+50)sc.scrollTop-=8;else if(y>sr.bottom-50)sc.scrollTop+=8}
      moved=before!==(x?sc.scrollLeft:sc.scrollTop)}
  }else{
    const sheet=row.closest('.sheet');
    if(sheet){const sr=sheet.getBoundingClientRect(),b=sheet.scrollTop;if(y<sr.top+50)sheet.scrollTop-=8;else if(y>sr.bottom-70)sheet.scrollTop+=8;moved=b!==sheet.scrollTop}
    else{
      const sd=document.querySelector('.side').getBoundingClientRect(),phone=innerWidth<=860;
      if(kind==='task'&&!(phone&&!$('#side').classList.contains('open'))&&cx>=sd.left&&cx<=sd.right&&cy>=sd.top&&cy<=sd.bottom){
        if(phone){const sd2=document.querySelector('.side'),b=sd2.scrollTop;if(cy<sd.top+50)sd2.scrollTop-=8;else if(cy>sd.bottom-50)sd2.scrollTop+=8;if(b!==sd2.scrollTop)dragMove(cx,cy)}
        return;
      }
      const top=(phone&&kind==='task'&&$('#side').classList.contains('open')?Math.max(0,sd.bottom):0)+80,b=window.scrollY;
      if(y<top)window.scrollBy(0,-12);else if(y>innerHeight-100)window.scrollBy(0,12);
      moved=b!==window.scrollY;
    }
  }
  if(moved)dragMove(cx,cy);

  const vw=t.closest('[data-view]');if(vw){const inSide=!!vw.closest('#side');view=vw.dataset.view;render();window.scrollTo({top:0});if(isPhone()&&inSide)closeDrawerSoon();return}
  const es=t.closest('[data-edit-sec]');if(es){if(db)openSection(es.dataset.editSec);return}
  if(picker){
    if(t.closest('[data-pk-close]')&&!t.closest('.pk-sheet')){closePicker();return}
    if(t.closest('.pk-x')){closePicker();return}
    const pi=t.closest('[data-pk]');if(pi){pickValue(pi.dataset.pk);return}
    if(t.closest('[data-pk-add]')){pickAdd();return}
    if(t.closest('#pickerHost'))return;
  }
  const pk=t.closest('[data-picker]');if(pk&&draft){openPicker(pk.dataset.picker);return}
  const cl=t.closest('[data-collapse]');if(cl){toggleCollapse(cl.dataset.collapse);return}
  const sc=t.closest('[data-subcol]');if(sc){toggleSub(sc.dataset.subcol);return}
  const fb=t.closest('#fFree');if(fb){fb.setAttribute('aria-pressed',fb.getAttribute('aria-pressed')!=='true');return}
  const sb=t.closest('#fStar');if(sb){const on=sb.getAttribute('aria-pressed')!=='true';sb.setAttribute('aria-pressed',on);sb.querySelector('span').textContent=on?'Starred':'Star';return}
  const qk=t.closest('[data-quick]');if(qk&&draft){readTaskForm();draft.dueDate=qk.dataset.quick||null;paintTask(!!draft.id);return}
  if(t.closest('[data-close-btn]')||t.matches('[data-close]')){closeModal();return}
  if(t.closest('#delTask')){const id=draft.id;closeModal();deleteTask(id);return}
  if(t.closest('#delSec')){openSectionDelete(secDraft.id);return}
  if(t.closest('#secUp')){moveSection(-1);return}
  if(t.closest('#secDown')){moveSection(1);return}
  const sx=t.closest('[data-sx]');if(sx){readTaskForm();draft.subtasks.splice(+sx.dataset.sx,1);paintTask(!!draft.id);return}
  const rb=t.closest('[data-reorder]');if(rb){reorderSec=reorderSec===rb.dataset.reorder?null:rb.dataset.reorder;render();return}
  const mvb=t.closest('[data-mv]');if(mvb){if(db&&!mvb.disabled){const [mid,dir]=mvb.dataset.mv.split('|');moveTask(mid,dir)}return}
  const row=t.closest('.row');if(row&&db){if(row.closest('.reordering'))return;if(selectMode){const id=row.dataset.id;if(selected.has(id))selected.delete(id);else selected.add(id);render();return}openTask(row.dataset.id);return}
});
document.addEventListener('input',e=>{
  if(e.target.id==='pkQ'&&picker){picker.q=e.target.value;const list=$('#pickerHost .pk-list');const scrollTop=list?list.scrollTop:0;paintPicker();const q=$('#pkQ');q.focus({preventScroll:true});q.setSelectionRange(q.value.length,q.value.length)}
  if(e.target.id==='sName'){const h=$('#secPreview h2');if(h)h.innerHTML=esc(e.target.value.trim())||'<span class="ph">Section name</span>'}
  if(draft&&(e.target.id==='fDay'||e.target.id==='fFrom'||e.target.id==='fQDay'||e.target.id==='fDate')){readTaskForm();refreshPreview()}
});
document.addEventListener('change',e=>{
  if(e.target.name==='attnBy'){attnBy=e.target.value;try{localStorage.setItem('dr.attnBy',attnBy)}catch(x){}render();return}
  if(e.target.id==='selMove'&&e.target.value){bulkMove(e.target.value);return}
  if(e.target.id==='selWith'&&e.target.value){bulkAssign(e.target.value);return}
  if(e.target.name==='scol'){const b=$('#secPreview');if(b)b.classList.toggle('ochre',e.target.value==='ochre')}
  if(e.target.name==='sfreq'){const h=$('#sfreqHint');if(h)h.textContent=SEC_FREQ_HINT[e.target.value]}
  if(draft&&e.target.matches('[data-si]')){e.target.closest('.subtask').classList.toggle('done',e.target.checked);const n=document.querySelectorAll('[data-si]').length,k=document.querySelectorAll('[data-si]:checked').length;const c=$('#taskForm .steps-head .cnt');if(c)c.textContent=k+' / '+n+' done';}
  if(draft&&(e.target.name==='wd'||e.target.name==='qoff')){readTaskForm();refreshPreview();return}
  if(draft&&(e.target.name==='freq'||e.target.name==='rule')){
    readTaskForm();
    if(e.target.name==='freq')draft.frequency=e.target.value;
    else draft.dueRule=e.target.value==='2nd-sat'?'2nd-sat':null;
    paintTask(!!draft.id);
  }
});
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'&&$('#menuHost .menu')){closeMenu();return}
  if(e.target.id==='pRename'){
    if(e.key==='Enter'){e.preventDefault();renamePerson(pplEdit.name,e.target.value);return}
    if(e.key==='Escape'){e.preventDefault();pplEdit=null;paintPeople();return}
  }
  if(e.target.id==='fNewSec'||e.target.id==='fNewOwner'||e.target.id==='fNewTag'){
    if(e.key==='Enter'){e.preventDefault();confirmAdd(e.target.id==='fNewSec'?'sec':e.target.id==='fNewTag'?'tag':'owner');return}
    if(e.key==='Escape'){e.preventDefault();readTaskForm();adding=null;paintTask(!!draft.id);return}
  }
  if(e.key==='Escape'&&picker){e.preventDefault();closePicker();return}
  if(e.key==='Enter'&&e.target.id==='pkQ'&&picker){e.preventDefault();const first=$('#pickerHost .pk-item:not(.add)');const add=$('#pickerHost [data-pk-add]');if(picker.q.trim()&&add&&!(first&&first.querySelector('span').textContent.toLowerCase()===picker.q.trim().toLowerCase()))pickAdd();else if(first)pickValue(first.dataset.pk);return}
  if(e.key==='Escape'&&$('#side').classList.contains('open')){closeDrawer();return}
  if(e.key==='Escape'&&$('#modal').innerHTML){closeModal();return}
  if(e.key==='Escape'&&selectMode&&!$('#menuHost .menu')){exitSelect();return}
  if(e.target.id==='newSub'&&e.key==='Enter'){e.preventDefault();const v=e.target.value.trim();if(!v)return;readTaskForm();draft.subtasks.push({text:v,done:false});paintTask(!!draft.id);$('#newSub').focus();return}
  if(e.key==='Enter'&&e.target.classList.contains('row')){const id=e.target.dataset.id;if(selectMode){if(selected.has(id))selected.delete(id);else selected.add(id);render()}else openTask(id)}
});
document.addEventListener('submit',e=>{
  e.preventDefault();
  if(e.target.id==='taskForm')saveTask();
  else if(e.target.id==='secForm')saveSection();
  else if(e.target.id==='peopleForm'){addPerson($('#pName').value);paintPeople();$('#pName').focus()}
  else if(e.target.classList.contains('inline-add')){
    const inp=e.target.querySelector('input'),v=inp.value.trim();
    if(v&&db){addQuick(e.target.dataset.sec,v);inp.value=''}
  }
});
let qTimer=null;
function applySearch(now){const q=$('#q');const v=q.value;q.closest('.search').classList.toggle('has',!!v);const next=v.trim();clearTimeout(qTimer);const run=()=>{if(next!==query){query=next;render()}};if(now)run();else qTimer=setTimeout(run,140)}
['input','keyup','change','search','compositionend'].forEach(ev=>$('#q').addEventListener(ev,()=>applySearch(ev!=='input')));
$('#qClr').addEventListener('click',()=>{const q=$('#q');q.value='';applySearch(true);q.focus()});
document.addEventListener('keydown',e=>{
  if(e.key==='/'&&!e.ctrlKey&&!e.metaKey&&!e.altKey&&!/^(INPUT|TEXTAREA|SELECT)$/.test(document.activeElement?.tagName||'')&&!$('#modal').innerHTML){e.preventDefault();$('#q').focus();$('#q').select()}
  if(e.key==='Escape'&&document.activeElement===$('#q')){const q=$('#q');if(q.value){q.value='';applySearch(true)}else q.blur()}
  if(e.key==='Enter'&&document.activeElement===$('#q')){e.preventDefault();applySearch(true);$('#q').blur()}
});
$('#showDone').addEventListener('change',e=>{showDone=e.target.checked;render()});
$('#showChecked').addEventListener('change',e=>{showChecked=e.target.checked;render()});
$('#newBtn').onclick=()=>db&&openTask(null);
$('#fab').onclick=()=>db&&openTask(null);
$('#exportBtn').onclick=exportCsv;
const isPhone=()=>innerWidth<=860;
function openDrawer(){if(!isPhone())return;$('#side').classList.add('open');const sc=$('#drawerScrim');sc.hidden=false;requestAnimationFrame(()=>sc.classList.add('show'));$('#menuBtn').setAttribute('aria-expanded','true');document.body.classList.add('drawer-open')}
function closeDrawer(){$('#side').classList.remove('open');const sc=$('#drawerScrim');sc.classList.remove('show');setTimeout(()=>{if(!sc.classList.contains('show'))sc.hidden=true},400);$('#menuBtn').setAttribute('aria-expanded','false');document.body.classList.remove('drawer-open')}
const closeDrawerSoon=()=>closeDrawer();
$('#menuBtn').onclick=()=>$('#side').classList.contains('open')?closeDrawer():openDrawer();
$('#drawerClose').onclick=closeDrawer;
$('#drawerScrim').onclick=closeDrawer;
window.addEventListener('resize',()=>{if(!isPhone()&&$('#side').classList.contains('open'))closeDrawer()});
(function(){let sx=null,sy=null;const side=$('#side');
  side.addEventListener('touchstart',e=>{if(drag||navPending)return;sx=e.touches[0].clientX;sy=e.touches[0].clientY},{passive:true});
  side.addEventListener('touchend',e=>{if(sx==null)return;const dx=e.changedTouches[0].clientX-sx,dy=Math.abs(e.changedTouches[0].clientY-sy);sx=null;if(dx<-60&&dy<50&&!drag)closeDrawer()},{passive:true});
})();
$('#pdfBtn').onclick=exportReportPdf;
function exportReportPdf(){saveFile('/api/report.pdf');toast('Report saved')}
render();

/* ---------- connect to the Python server (app.py) ---------- */
const newId=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,10);
async function call(method,url,data){
  const r=await fetch(url,{method,headers:{'Content-Type':'application/json'},body:data===undefined?undefined:JSON.stringify(data)});
  if(!r.ok)throw new Error('HTTP '+r.status);
  return r.json();
}
const docRef=(kind,id)=>({id,set:d=>call('PUT','/api/'+kind+'/'+id,d),update:d=>call('PATCH','/api/'+kind+'/'+id,d),delete:()=>call('DELETE','/api/'+kind+'/'+id)});
const server={collection:kind=>({doc:id=>docRef(kind,id||newId())}),doc:()=>({set:d=>call('PUT','/api/people',d)})};
let refreshSeq=0;
async function refresh(){
  const n=++refreshSeq;
  try{
    const s=await call('GET','/api/state');
    if(n!==refreshSeq)return;
    for(const t of s.tasks){const c=t._info.c;c.deadline=parseISO(c.deadline);c.start=parseISO(c.start)}
    sections=s.sections;peopleList=s.people;tasks=s.tasks;loadedS=loadedT=true;failed=null;db=server;
  }catch(e){
    if(n!==refreshSeq)return;
    failed='The Python server is not responding. Start it with "python app.py", then reload this page.';
  }
  render();
}
downloads=true;$('#exportBtn').hidden=false;$('#pdfBtn').hidden=false;
setInterval(refresh,10*60*1000);
window.addEventListener('focus',refresh);
refresh();
</script>
