{% for field in form %}
<div class="{% if field.widget_type == 'textarea' or field.name in full_width %}sm:col-span-2{% endif %}">
  {% if field.widget_type == 'checkbox' %}
    <label class="flex items-center gap-2 pt-1 text-sm text-slate-600">{{ field }} {{ field.label }}</label>
  {% else %}
    <label for="{{ field.id_for_label }}" class="label">{{ field.label }}{% if field.field.required %} *{% endif %}</label>
    {{ field }}
  {% endif %}
  {% if field.help_text %}<p class="mt-1 text-xs text-slate-400">{{ field.help_text }}</p>{% endif %}
  {% for e in field.errors %}<p class="mt-1 text-xs text-red-600">{{ e }}</p>{% endfor %}
</div>
{% endfor %}
