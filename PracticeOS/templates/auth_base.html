<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Sign in{% endblock %} · PracticeOS</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>tailwind.config = { theme: { extend: { fontFamily: { sans: ['Inter', 'ui-sans-serif', 'system-ui', 'sans-serif'] }, colors: { brand: { 50: '#eef2ff', 100: '#e0e7ff', 500: '#4f46e5', 600: '#4338ca', 700: '#3730a3' } } } } }</script>
  <style type="text/tailwindcss">
    @layer components {
      .input { @apply w-full rounded-lg border border-slate-300 bg-white px-3 py-2 text-sm outline-none transition focus:border-brand-500 focus:ring-2 focus:ring-brand-100; }
      .label { @apply mb-1 block text-xs font-medium text-slate-600; }
      .btn { @apply inline-flex items-center justify-center gap-1.5 rounded-lg px-3.5 py-2 text-sm font-medium transition disabled:opacity-50; }
      .btn-primary { @apply btn bg-brand-500 text-white hover:bg-brand-600; }
      .card { @apply rounded-xl border border-slate-200 bg-white shadow-sm; }
      .badge { @apply inline-flex items-center rounded-full px-2 py-0.5 text-xs font-medium; }
    }
  </style>
</head>
<body class="bg-slate-50 font-sans text-slate-800 antialiased">
  <div class="flex min-h-screen items-center justify-center p-4">
    <div class="w-full {% block width %}max-w-md{% endblock %}">
      <div class="mb-6 text-center"><div class="text-2xl font-bold text-brand-600">PracticeOS</div>
        <p class="mt-1 text-sm text-slate-500">Practice management for CAs &amp; tax professionals</p></div>
      {% block content %}{% endblock %}
    </div>
  </div>
  {% block scripts %}{% endblock %}
</body>
</html>
