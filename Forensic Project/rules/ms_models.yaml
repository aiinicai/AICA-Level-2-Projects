- id: MS-01
  name: Beneish M-Score Earnings Manipulation Index
  module: MS
  status: implemented
  requires: [trial_balance]
  min_years: 2
  branch: fraudulent_statements
  scheme: 1
  flag: red
  weight: 5
  confidence: 0.9
  source: "External model — Beneish (1999) 8-variable probabilistic manipulation model"
  params:
    threshold: -1.78
  hypothesis: >
    Beneish M-Score of {observed_value} in {fy} exceeds threshold of -1.78.
    An elevated M-Score indicates statistical profiles consistent with companies engaging in financial statement manipulation, driven by component indices: {components}.
  procedure:
    - Review the primary driver indices among DSRI, GMI, AQI, SGI, DEPI, SGAI, LVGI, and TATA
    - Check accruals quality and cut-off testing on revenue recognition
    - Verify asset capitalisation and depreciation rate changes

- id: MS-02
  name: Altman Z"-Score Financial Distress Indicator
  module: MS
  status: implemented
  requires: [trial_balance]
  min_years: 1
  branch: fraudulent_statements
  scheme: 2
  flag: yellow
  weight: 3
  confidence: 0.9
  source: "External model — Altman (1983/2000) 4-variable private entity distress model"
  params:
    distress_threshold: 1.10
    grey_threshold: 2.60
  hypothesis: >
    Altman Z"-Score of {observed_value} in {fy} places the entity in the {zone} zone.
    Financial distress creates acute management pressure (the pressure leg of the fraud triangle) to manipulate reported performance.
  procedure:
    - Evaluate liquidity and short-term debt servicing capability
    - Check covenant compliance with lending banks
    - Assess going concern assumptions and cash flow forecasts

- id: MS-03
  name: Sloan Accrual Anomaly Ratio
  module: MS
  status: implemented
  requires: [trial_balance]
  min_years: 2
  branch: fraudulent_statements
  scheme: 1
  flag: red
  weight: 4
  confidence: 0.9
  source: "External model — Sloan (1996) balance-sheet accrual anomaly"
  params:
    threshold: 0.10
  hypothesis: >
    Sloan balance-sheet accrual ratio of {observed_value} in {fy} exceeds the 0.10 threshold.
    High positive accruals relative to total assets indicate low-quality earnings vulnerable to sudden future reversals.
  procedure:
    - Inspect non-cash working capital balance increases
    - Analyze receivables ageing and inventory holding periods
    - Compare net income trend against cash from operating activities

- id: MS-04
  name: Piotroski F-Score Divergence (Weak Fundamentals vs Strong Growth)
  module: MS
  status: implemented
  requires: [trial_balance]
  min_years: 2
  branch: fraudulent_statements
  scheme: 2
  flag: yellow
  weight: 3
  confidence: 0.8
  source: "External model — Piotroski (2000) fundamental health index"
  params:
    score_threshold: 3
    revenue_growth_threshold: 0.15
  hypothesis: >
    Piotroski F-Score of {observed_value}/9 in {fy} accompanied by rapid revenue growth ({rev_growth}%).
    Divergence between weak operational/financial fundamentals and high reported revenue growth points to unsustainable or artificial expansion.
  procedure:
    - Analyze the 9 fundamental binary signals (profitability, leverage/liquidity, operational efficiency)
    - Investigate why high sales growth fails to generate operational cash flows or improve profit margins
    - Verify debt additions and equity dilution history
