- id: FS-14
  name: Reporting period irregularity or extreme internal ratio anomaly
  module: FS
  status: implemented
  requires: [trial_balance]
  min_years: 3
  branch: fraudulent_statements
  scheme: 12
  flag: yellow
  weight: 3
  confidence: 0.7
  source: "ICAI Ch. 6.1.1 — Financial reporting period and ratio irregularities"
  params:
    sigma_threshold: 3.0
  hypothesis: >
    Financial statement ratio '{metric_name}' in {fy} ({observed_value}) deviated by > 3σ from company's own 3-year baseline.
    Internal statistical outliers indicate structural breaks in operational efficiency, sudden accounting method changes, or isolated manipulation.
  procedure:
    - Inquire about changes in accounting estimates, depreciation rates, or classifications
    - Review minutes of board meetings regarding exceptional operational changes
    - Check if period covers more or less than 12 months

- id: FS-15
  name: Repeated prior-period adjustments across consecutive years
  module: FS
  status: implemented
  requires: [trial_balance, prior_adjustments]
  min_years: 2
  branch: fraudulent_statements
  scheme: 13
  flag: red
  weight: 4
  confidence: 1.0
  source: "ICAI Ch. 6.1.1 — Chronic prior period error corrections"
  params: {}
  hypothesis: >
    Prior period adjustments of similar nature ('{description}') appeared in consecutive years ({fy_prev} and {fy_curr}).
    Recurring prior-period adjustments indicate chronic internal control failures or deliberate deferral of expenses to restated historical periods.
  procedure:
    - Review root-cause analysis for each prior-period correction
    - Inspect statutory audit qualification notes from prior years
    - Check whether errors were known to management prior to closing

- id: FS-16
  name: Asymmetric provision movements matching earnings management pattern (Cookie Jar)
  module: FS
  status: implemented
  requires: [trial_balance]
  min_years: 3
  branch: fraudulent_statements
  scheme: 14
  flag: red
  weight: 4
  confidence: 0.8
  source: "ICAI Ch. 4.2.2 Scheme 6 — Cookie-jar provisioning and earnings smoothing"
  params: {}
  hypothesis: >
    Provisions were increased in peak profit year ({peak_fy}) and drawn down / decreased in lowest profit year ({trough_fy}).
    Asymmetric provision maneuvers consistent with income smoothing obscure true operating volatility and mislead stakeholders regarding profitability.
  procedure:
    - Obtain actuarial reports and provisioning computation worksheets
    - Scrutinise justification for releasing provisions in low-profit years
    - Review consistency of provisioning methodology under applicable accounting standards
