<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Working Paper Tools - Directory Launchpad</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/modules/working_papers/style.css">
</head>
<body>
  <!-- Header -->
  <div class="module-header">
    <div class="title-container">
      <div class="header-icon">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
          <polyline points="14 2 14 8 20 8"></polyline>
          <line x1="16" y1="13" x2="8" y2="13"></line>
          <line x1="16" y1="17" x2="8" y2="17"></line>
          <polyline points="10 9 9 9 8 9"></polyline>
        </svg>
      </div>
      <div>
        <h1 class="module-title">Working Paper Tools</h1>
        <p class="module-subtitle">FD Working Paper Generator & Advanced Statutory Classification</p>
      </div>
    </div>
  </div>

  <!-- Client Directory Screen -->
  <div class="screen active" id="screen-directory">
    <div class="directory-controls">
      <input type="text" id="input-search-client" class="search-input" placeholder="Search entity by name...">
      <button class="btn-primary" id="btn-open-add-client-modal">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <line x1="12" y1="5" x2="12" y2="19"></line>
          <line x1="5" y1="12" x2="19" y2="12"></line>
        </svg>
        Add New Entity
      </button>
    </div>

    <!-- Client Cards Grid -->
    <div class="client-grid" id="client-grid">
      <!-- Dynamic Client Cards Rendered via JS -->
    </div>
  </div>

  <!-- MODAL: ADD / EDIT ENTITY -->
  <div class="modal-overlay" id="modal-client">
    <div class="modal-card">
      <h2 class="modal-title" id="modal-client-title">Add New Entity</h2>
      <form id="form-client">
        <input type="hidden" id="input-client-id">
        
        <div class="form-group">
          <label>Entity Name *</label>
          <input type="text" id="input-client-name" required placeholder="e.g. Acme Enterprises Private Limited">
        </div>

        <div class="modal-actions">
          <button type="button" class="btn-secondary" id="btn-close-client-modal">Cancel</button>
          <button type="submit" class="btn-primary">Save Entity</button>
        </div>
      </form>
    </div>
  </div>

  <script src="/modules/working_papers/script.js"></script>
</body>
</html>
