<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GST Management Tool - Directory Launchpad</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/modules/gst_tool/style.css">
</head>
<body>
  <!-- Header -->
  <div class="module-header">
    <div class="title-container">
      <div class="header-icon">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M9 3H5a2 2 0 0 0-2 2v4m6-6h10a2 2 0 0 1 2 2v4M9 3v18m0 0h10a2 2 0 0 0 2-2V9M9 21H5a2 2 0 0 1-2-2V9m0 0h18"></path>
        </svg>
      </div>
      <div>
        <h1 class="module-title">GST Management Tool</h1>
        <p class="module-subtitle">Client Directory Launchpad & Profile Management</p>
      </div>
    </div>
  </div>

  <!-- Client Directory Screen -->
  <div class="screen active" id="screen-directory">
    <div class="directory-controls">
      <input type="text" id="input-search-client" class="search-input" placeholder="Search client by legal name, trade name, or GSTIN...">
      <button class="btn-primary" id="btn-open-add-client-modal">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <line x1="12" y1="5" x2="12" y2="19"></line>
          <line x1="5" y1="12" x2="19" y2="12"></line>
        </svg>
        Add New Client
      </button>
    </div>

    <!-- Client Cards Grid -->
    <div class="client-grid" id="client-grid">
      <!-- Dynamic Client Cards Rendered via JS -->
    </div>
  </div>

  <!-- MODAL: ADD / EDIT CLIENT -->
  <div class="modal-overlay" id="modal-client">
    <div class="modal-card">
      <h2 class="modal-title" id="modal-client-title">Add New Client Profile</h2>
      <form id="form-client">
        <input type="hidden" id="input-client-id">
        
        <div class="form-group">
          <label>Legal Name (as per PAN/GSTIN) *</label>
          <input type="text" id="input-client-name" required placeholder="e.g. Acme Enterprises Private Limited">
        </div>

        <div class="form-group">
          <label>Trade Name (if any)</label>
          <input type="text" id="input-client-trade-name" placeholder="e.g. Acme Solutions">
        </div>

        <div class="form-group">
          <label>GSTIN Number *</label>
          <input type="text" id="input-client-gstin" required placeholder="e.g. 27AAAAA0000A1Z5" maxlength="15" style="text-transform: uppercase;">
        </div>

        <div class="form-group">
          <label>Registration Status</label>
          <select id="select-client-status">
            <option value="Active">Active</option>
            <option value="Inactive">Inactive</option>
          </select>
        </div>

        <div class="modal-actions">
          <button type="button" class="btn-secondary" id="btn-close-client-modal">Cancel</button>
          <button type="submit" class="btn-primary">Save Client Profile</button>
        </div>
      </form>
    </div>
  </div>

  <script src="/modules/gst_tool/script.js"></script>
</body>
</html>
