<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hello World Module</title>
  <style>
    :root {
      /* Dark Theme */
      --bg-gradient: #0f172a;
      --card-bg: #1e293b;
      --card-border: #334155;
      --accent: #0ea5e9;
      --accent-hover: #0284c7;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --success: #10b981;
      --code-bg: #090d16;
      --code-text: #38bdf8;
    }

    [data-theme="light"] {
      /* Light Theme */
      --bg-gradient: #f8fafc;
      --card-bg: #ffffff;
      --card-border: #e2e8f0;
      --accent: #0284c7;
      --accent-hover: #0369a1;
      --text-main: #0f172a;
      --text-muted: #64748b;
      --success: #059669;
      --code-bg: #f1f5f9;
      --code-text: #0284c7;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      min-height: 100vh;
      background: var(--bg-gradient);
      color: var(--text-main);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2rem;
      transition: background-color 0.25s ease, color 0.25s ease;
    }

    .container {
      max-width: 650px;
      width: 100%;
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 16px;
      padding: 2.5rem;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1);
      animation: fadeIn 0.4s ease-out;
      transition: background-color 0.25s ease, border-color 0.25s ease;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 6px 14px;
      border-radius: 9999px;
      background: rgba(14, 165, 233, 0.12);
      border: 1px solid rgba(14, 165, 233, 0.25);
      color: var(--accent);
      font-size: 0.85rem;
      font-weight: 600;
      margin-bottom: 1.5rem;
    }

    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--success);
      box-shadow: 0 0 8px var(--success);
    }

    h1 {
      font-size: 1.85rem;
      font-weight: 700;
      margin-bottom: 0.75rem;
      color: var(--text-main);
      letter-spacing: -0.01em;
    }

    p {
      color: var(--text-muted);
      line-height: 1.6;
      margin-bottom: 2rem;
      font-size: 0.95rem;
    }

    .test-box {
      background: var(--code-bg);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      padding: 1.25rem;
      margin-bottom: 1rem;
    }

    .test-box-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 1rem;
    }

    .endpoint-tag {
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: 0.85rem;
      color: var(--code-text);
      background: rgba(14, 165, 233, 0.1);
      padding: 4px 10px;
      border-radius: 6px;
      font-weight: 500;
    }

    button {
      background: var(--accent);
      color: white;
      border: none;
      padding: 10px 18px;
      border-radius: 8px;
      font-weight: 600;
      font-size: 0.85rem;
      cursor: pointer;
      transition: all 0.2s ease;
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }

    button:hover {
      background: var(--accent-hover);
      transform: translateY(-1px);
    }

    pre {
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: 0.875rem;
      color: var(--text-main);
      background: rgba(0, 0, 0, 0.15);
      padding: 1rem;
      border-radius: 8px;
      overflow-x: auto;
      min-height: 80px;
      border: 1px solid var(--card-border);
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="badge">
      <span class="status-dot"></span> Dynamic Module Active
    </div>
    <h1>Hello World Tool</h1>
    <p>This is a test module loaded inside the Office Suite sandbox iframe. It automatically adapts to parent dashboard theme changes and connects to <code>/api/hello_world/</code>.</p>

    <div class="test-box">
      <div class="test-box-header">
        <span class="endpoint-tag">GET /api/hello_world/</span>
        <button id="btn-test">
          <svg width="16" height="16" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path>
          </svg>
          Test API Route
        </button>
      </div>
      <pre id="api-output">Click "Test API Route" to fetch backend JSON...</pre>
    </div>
  </div>

  <script>
    const btn = document.getElementById('btn-test');
    const output = document.getElementById('api-output');

    // Theme sync listener from parent shell
    window.addEventListener('message', (event) => {
      if (event.data && event.data.type === 'THEME_CHANGE') {
        document.documentElement.setAttribute('data-theme', event.data.theme);
      }
    });

    async function fetchApi() {
      output.textContent = 'Fetching /api/hello_world/...';
      try {
        const res = await fetch('/api/hello_world/');
        if (!res.ok) throw new Error(`HTTP Error ${res.status}`);
        const data = await res.json();
        output.textContent = JSON.stringify(data, null, 2);
      } catch (err) {
        output.textContent = `Error connecting to API: ${err.message}`;
      }
    }

    btn.addEventListener('click', fetchApi);
    fetchApi();
  </script>
</body>
</html>
