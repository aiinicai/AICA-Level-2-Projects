<!DOCTYPE html>
<html lang="en" data-profile="senior" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#14535c" />
  <meta name="description" content="Connecting isolated seniors with children through shared stories, games, and daily health routines." />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="Generations Connect" />
  <link rel="manifest" href="./manifest.json" />
  <link rel="icon" type="image/png" sizes="192x192" href="./icon-192.png" />
  <link rel="apple-touch-icon" href="./icon-192.png" />
  <title>Generations Connect</title>
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <!-- Header Bar -->
  <header class="app-header">
    <div class="brand-wrapper">
      <div class="brand-icon">🤝</div>
      <div>
        <div class="brand-title">Generations Connect</div>
        <div class="brand-subtitle" id="profileBadgeText">Senior Mode • Eleanor (73)</div>
      </div>
    </div>

    <div class="header-actions">
      <!-- PWA Install Button -->
      <button id="installAppBtn" class="header-btn" style="display: none;" onclick="triggerPWAInstall()">
        📲 Install App
      </button>

      <!-- Theme Switcher -->
      <button class="header-btn" id="themeToggleBtn" onclick="toggleTheme()" aria-label="Toggle Theme">
        🌙
      </button>

      <!-- Profile Switcher Dropdown -->
      <select class="header-btn" id="profileSelect" onchange="setProfile(this.value)" style="background: rgba(255,255,255,0.2); color: #fff; border: 1px solid rgba(255,255,255,0.3); border-radius: 9999px; padding: 6px 12px; cursor: pointer;">
        <option value="senior" style="color: #000;">👴 Senior Profile</option>
        <option value="child" style="color: #000;">🧒 Child Profile</option>
        <option value="parent" style="color: #000;">🛡️ Parent Dashboard</option>
      </select>
    </div>
  </header>

  <!-- App Body Layout -->
  <div class="app-container">
    <!-- Desktop / Tablet Navigation Rail -->
    <nav class="nav-rail" id="desktopNav">
      <button class="nav-link active" onclick="renderSeniorHome()">
        <span class="nav-icon">🏠</span> Home
      </button>
      <button class="nav-link" onclick="renderSeniorMedicines()">
        <span class="nav-icon">💊</span> Medicines
      </button>
      <button class="nav-link" onclick="renderSeniorStories()">
        <span class="nav-icon">✨</span> Stories
      </button>
      <button class="nav-link" onclick="renderSeniorGames()">
        <span class="nav-icon">🎨</span> Games & Art
      </button>
      <button class="nav-link" onclick="renderSeniorSleep()">
        <span class="nav-icon">🌙</span> Sleep Log
      </button>
      <button class="nav-link" onclick="renderSeniorPhoto()">
        <span class="nav-icon">📷</span> Photo Studio
      </button>
      <button class="nav-link" onclick="renderSeniorBreathing()">
        <span class="nav-icon">🧘</span> Calm Breathing
      </button>
    </nav>

    <!-- Main Dynamic Content -->
    <main class="main-content" id="appContent">
      <!-- Dynamic views rendered via app.js -->
    </main>
  </div>

  <!-- Mobile Bottom Tab Bar -->
  <nav class="bottom-bar" id="mobileNav">
    <button class="bottom-tab active" onclick="renderSeniorHome()">
      <span style="font-size: 22px;">🏠</span> Home
    </button>
    <button class="bottom-tab" onclick="renderSeniorMedicines()">
      <span style="font-size: 22px;">💊</span> Meds
    </button>
    <button class="bottom-tab" onclick="renderSeniorStories()">
      <span style="font-size: 22px;">✨</span> Stories
    </button>
    <button class="bottom-tab" onclick="renderSeniorGames()">
      <span style="font-size: 22px;">🎨</span> Games
    </button>
    <button class="bottom-tab" onclick="renderSeniorBreathing()">
      <span style="font-size: 22px;">🧘</span> Breathe
    </button>
  </nav>

  <!-- Toast Notification Pill -->
  <div class="toast-notice" id="toastNotice"></div>

  <script src="./app.js"></script>
  <script>
    function triggerPWAInstall() {
      if (deferredInstallPrompt) {
        deferredInstallPrompt.prompt();
        deferredInstallPrompt.userChoice.then((choice) => {
          if (choice.outcome === 'accepted') {
            showToast('Thank you for installing Generations Connect!');
          }
          deferredInstallPrompt = null;
          document.getElementById('installAppBtn').style.display = 'none';
        });
      }
    }
  </script>
</body>
</html>
