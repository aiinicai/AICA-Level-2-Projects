<!DOCTYPE html>
<html lang="en" data-profile="senior" data-theme="light" data-palette="sage">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#14535c" />
  <meta name="description" content="Connecting isolated seniors with children through shared stories, games, and daily health routines." />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="Generations Connect" />
  <link rel="manifest" href="./manifest.json" />
  <link rel="icon" type="image/png" sizes="192x192" href="./icon-192.png" />
  <link rel="apple-touch-icon" href="./icon-192.png" />
  <title>Generations Connect</title>
  <link rel="stylesheet" href="./styles.css" />
</head>
<body class="logged-out">
  <!-- Header Bar -->
  <header class="app-header">
    <div style="display: flex; align-items: center; gap: 14px;">
      <!-- HOME BUTTON ALWAYS APPEARS ON TOP LEFT CORNER -->
      <button class="header-btn" id="topLeftHomeBtn" onclick="goHome()" style="background: rgba(255,255,255,0.25); font-size: 16px; font-weight: 800; border-radius: 14px; padding: 8px 14px; border: 2px solid rgba(255,255,255,0.4);">
        🏠 Home
      </button>

      <div class="brand-wrapper">
        <div class="brand-icon">🤝</div>
        <div>
          <div class="brand-title">Generations Connect</div>
          <div class="brand-subtitle" id="profileBadgeText">Welcome</div>
        </div>
      </div>
    </div>

    <div class="header-actions">
      <!-- Voice commands are ON by default: the app listens for spoken instructions -->
      <button class="header-btn" id="voiceCmdBtn" onclick="toggleVoiceCommands()" aria-pressed="true" style="font-weight: 700;">
        🎤 <span>Voice cmds ON</span>
      </button>

      <!-- Voice Mode Toggle (Default is ON, user can manually toggle OFF/ON) -->
      <button class="header-btn" id="voiceToggleBtn" onclick="toggleWebVoiceMode()" style="background: rgba(255,255,255,0.2); font-weight: 700;">
        🔊 Voice: ON
      </button>

      <!-- Colour palette picker (the old Login button was a duplicate of the "Security & Locks" tile) -->
      <div style="position: relative;">
        <button class="header-btn" id="paletteBtn" onclick="togglePaletteMenu()" aria-haspopup="true" aria-expanded="false" style="font-weight: 700;">
          🎨 Colors
        </button>
        <div class="palette-menu" id="paletteMenu" hidden role="menu" aria-label="Choose app colours"></div>
      </div>

      <!-- PWA Install Button -->
      <button id="installAppBtn" class="header-btn" style="display: none;" onclick="triggerPWAInstall()">
        📲 Install
      </button>

      <!-- Theme Switcher -->
      <button class="header-btn" id="themeToggleBtn" onclick="toggleTheme()" aria-label="Toggle Theme">
        🌙
      </button>

      <!-- Profile is now chosen automatically from the age typed at login -->
    </div>
  </header>

  <!-- App Body Layout -->
  <div class="app-container">
    <!-- Main Dynamic Content (All options stacked in rows of 3 below) -->
    <main class="main-content" style="width: 100%; max-width: 900px;">
      <!-- Dynamic views rendered via app.js -->
      <div id="appContent"></div>

      <!-- Navigation buttons: part of the scrolling page (not fixed), 3 in a row -->
      <nav class="shortcut-grid page-actions" id="pageActions" aria-label="Page navigation">
        <button class="shortcut-tile" onclick="historyBackOrHome()">
          <span class="tile-icon">←</span>
          <div><div class="tile-title">Back</div><div class="tile-sub">Previous page</div></div>
        </button>
        <button class="shortcut-tile" onclick="window.scrollTo({ top: 0, behavior: 'smooth' })">
          <span class="tile-icon">⬆️</span>
          <div><div class="tile-title">Top</div><div class="tile-sub">Scroll to top</div></div>
        </button>
        <button class="shortcut-tile" onclick="webLogOff()">
          <span class="tile-icon">🚪</span>
          <div><div class="tile-title">Log Off</div><div class="tile-sub">Switch account</div></div>
        </button>
      </nav>
    </main>
  </div>


  <!-- Toast Notification Pill -->
  <div class="toast-notice" id="toastNotice"></div>

  <script src="./app.js"></script>
  <script>
    function triggerPWAInstall() {
      if (deferredInstallPrompt) {
        deferredInstallPrompt.prompt();
        deferredInstallPrompt.userChoice.then((choice) => {
          if (choice.outcome === 'accepted') {
            showToast('Thank you for installing Generations Connect!');
          }
          deferredInstallPrompt = null;
          document.getElementById('installAppBtn').style.display = 'none';
        });
      }
    }
  </script>
</body>
</html>
