# AUTHORED to the partner's instruction of 20 Aug 2026, from the firm's own
# precedent. See mgt9_header.yaml for the position on whether MGT-9 is
# required at all.

id: mgt9.indebtedness
document: mgt9
order: 90
number: ""
title: "V. Indebtedness"
clause_ref: "s.92(3)"
effective_from: "2014-04-01"
effective_to: null
render_as: section

needs_review: false

input:
  key: mgt9.indebtedness
  label: "Indebtedness of the Company"
  datatype: select
  carry_forward: prompt
  mandatory: true
  options:
    - { value: "given", label: "Give the particulars" }
    - { value: "nil", label: "Nil" }

  defaults:
    - { value: "given" }

repeating_block:
  when: "value == 'given'"
  entity: mgt9_indebtedness
  min_rows: 1
  carry_forward: prompt
  columns:
    - { key: particulars, label: "Particulars", datatype: text, required: true }
    - { key: secured, label: "Secured loans excluding deposits", datatype: text }
    - { key: unsecured, label: "Unsecured loans", datatype: text }
    - { key: deposits, label: "Deposits", datatype: text }
    - { key: total, label: "Total indebtedness", datatype: text }

variants:
  - when: "value == 'given'"
    body: >
      V. INDEBTEDNESS


      Indebtedness of the Company including interest outstanding or accrued but not due for payment:
    render_block: table

  - when: "value == 'nil'"
    body: >
      V. INDEBTEDNESS


      Nil
