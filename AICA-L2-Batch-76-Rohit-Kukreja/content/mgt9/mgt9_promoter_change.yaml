# AUTHORED to the partner's instruction of 20 Aug 2026, from the firm's own
# precedent. See mgt9_header.yaml for the position on whether MGT-9 is
# required at all.

id: mgt9.shareholding.change
document: mgt9
order: 60
number: ""
title: "IV(C). Change in Promoters' Shareholding"
clause_ref: "s.92(3)"
effective_from: "2014-04-01"
effective_to: null
render_as: section

needs_review: false

input:
  key: mgt9.shareholding.change
  label: "Change in the promoters' shareholding during the year"
  datatype: select
  carry_forward: prompt
  mandatory: true
  options:
    - { value: "no_change", label: "No change" }
    - { value: "changed", label: "Changed — give the particulars" }

  defaults:
    - { value: "no_change" }

variants:
  - when: "value == 'no_change'"
    body: >
      C. Change in Promoters' Shareholding


      There was no change in the promoters' shareholding during the financial year.

  - when: "value == 'changed'"
    body: >
      C. Change in Promoters' Shareholding


      The changes in the promoters' shareholding during the financial year are set out
      below:
    requires_narrative: true
