# AUTHORED to the partner's instruction of 20 Aug 2026, from the firm's own
# precedent.
#
# ON WHETHER THIS IS REQUIRED AT ALL. Rule 12(1) of the Companies (Management
# and Administration) Rules, 2014 was amended twice. The 2020 amendment made
# the MGT-9 extract conditional -- not required where the web link of the
# annual return was disclosed in the Board's report. The Companies (Management
# and Administration) Amendment Rules, 2021, dated 5 March 2021, substituted
# Rule 12 and removed the attachment requirement altogether, including for
# companies with no website.
#
# The partner has directed, with that in front of them, that the annexure is
# attached by default. Nothing prohibits giving more than the rules require,
# and the firm's members expect this format. Recorded here so the position is
# visible to whoever reads the file next, not to reopen it.

id: mgt9.activities
document: mgt9
order: 20
number: ""
title: "II. Principal Business Activities"
clause_ref: "s.92(3)"
effective_from: "2014-04-01"
effective_to: null
render_as: section

needs_review: false

input:
  key: mgt9.activities
  label: "Business activities contributing 10% or more of turnover"
  datatype: select
  carry_forward: prompt
  mandatory: true
  options:
    - { value: "listed", label: "Give the activities" }

  defaults:
    - { value: "listed" }

repeating_block:
  when: "value == 'listed'"
  entity: mgt9_business_activity
  min_rows: 1
  carry_forward: prompt
  columns:
    - { key: activity_name, label: "Name and description of main products / services", datatype: text, required: true }
    - { key: nic_code, label: "NIC code of the product / service", datatype: text }
    - { key: turnover_pct, label: "% to total turnover of the Company", datatype: number }

variants:
  - when: "value == 'listed'"
    body: >
      II. PRINCIPAL BUSINESS ACTIVITIES OF THE COMPANY


      All the business activities contributing 10% or more of the total turnover of the
      Company are stated below:
    render_block: table
