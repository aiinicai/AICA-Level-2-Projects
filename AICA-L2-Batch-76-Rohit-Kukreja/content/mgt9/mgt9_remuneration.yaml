# AUTHORED to the partner's instruction of 20 Aug 2026, from the firm's own
# precedent. See mgt9_header.yaml for the position on whether MGT-9 is
# required at all.

id: mgt9.remuneration
document: mgt9
order: 100
number: ""
title: "VI. Remuneration of Directors and Key Managerial Personnel"
clause_ref: "s.92(3); s.197"
effective_from: "2014-04-01"
effective_to: null
render_as: section

needs_review: false

input:
  key: mgt9.remuneration
  label: "Remuneration to directors and key managerial personnel"
  datatype: select
  carry_forward: prompt
  mandatory: true
  options:
    - { value: "none", label: "No managerial remuneration paid" }
    - { value: "paid", label: "Remuneration paid — give the particulars" }

  # Defaulted to the nil case, which is the firm's precedent for the class of
  # company this tool serves. Where a managing director or whole-time director
  # is in office and is paid, the answer is changed.
  defaults:
    - { value: "none" }

variants:
  - when: "value == 'none'"
    body: >
      VI. REMUNERATION OF DIRECTORS AND KEY MANAGERIAL PERSONNEL


      A. Remuneration to Managing Director, Whole-time Directors and / or Manager: Not
      applicable. The Company has no Managing Director, Whole-time Director or Manager.


      B. Remuneration to other directors: Nil. No sitting fee, commission or other
      remuneration was paid to the directors during the year.


      C. Remuneration to Key Managerial Personnel other than the Managing Director, Manager
      or Whole-time Director: Nil.

  - when: "value == 'paid'"
    body: >
      VI. REMUNERATION OF DIRECTORS AND KEY MANAGERIAL PERSONNEL


      The remuneration paid to the Directors and Key Managerial Personnel during the year is
      set out below:
    requires_narrative: true
