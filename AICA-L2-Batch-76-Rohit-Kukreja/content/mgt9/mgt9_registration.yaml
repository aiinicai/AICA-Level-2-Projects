      I. REGISTRATION AND OTHER DETAILS


      CIN: {{ cin }}


      Registration Date: {{ date_of_incorp_long }}


      Name of the Company: {{ company_name }}


      Category / Sub-category of the Company: Company Limited by Shares / Indian
      Non-Government Company


      Address of the Registered Office and contact details: {{ registered_addr }}


      Whether listed company: No


      Name, Address and Contact details of Registrar and Transfer Agent, if any: Not
      applicable
