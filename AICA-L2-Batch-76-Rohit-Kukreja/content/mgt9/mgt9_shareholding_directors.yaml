# AUTHORED to the partner's instruction of 20 Aug 2026, from the firm's own
# precedent. See mgt9_header.yaml for the position on whether MGT-9 is
# required at all.

id: mgt9.shareholding.directors
document: mgt9
order: 80
number: ""
title: "IV(E). Shareholding of Directors and Key Managerial Personnel"
clause_ref: "s.92(3)"
effective_from: "2014-04-01"
effective_to: null
render_as: section

needs_review: false

input:
  key: mgt9.shareholding.directors
  label: "Shareholding of directors and key managerial personnel"
  datatype: select
  carry_forward: prompt
  mandatory: true
  options:
    - { value: "given", label: "Give the particulars" }
    - { value: "nil", label: "Nil" }

  defaults:
    - { value: "given" }

repeating_block:
  when: "value == 'given'"
  entity: mgt9_director_holding
  min_rows: 1
  carry_forward: prompt
  columns:
    - { key: person_name, label: "Name of Director / KMP", datatype: text, required: true }
    - { key: shares_begin, label: "Shares at beginning of year / %", datatype: text }
    - { key: change, label: "Increase / decrease, with reasons", datatype: text }
    - { key: shares_end, label: "Shares at end of year / %", datatype: text }

variants:
  - when: "value == 'given'"
    body: >
      E. Shareholding of Directors and Key Managerial Personnel


      The shareholding of the Directors and Key Managerial Personnel is set out below:
    render_block: table

  - when: "value == 'nil'"
    body: >
      E. Shareholding of Directors and Key Managerial Personnel


      Nil
