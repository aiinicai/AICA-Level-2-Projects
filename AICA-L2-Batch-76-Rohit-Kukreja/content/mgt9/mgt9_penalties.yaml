# AUTHORED to the partner's instruction of 20 Aug 2026, from the firm's own
# precedent. See mgt9_header.yaml for the position on whether MGT-9 is
# required at all.

id: mgt9.penalties
document: mgt9
order: 110
number: ""
title: "VII. Penalties, Punishment and Compounding of Offences"
clause_ref: "s.92(3)"
effective_from: "2014-04-01"
effective_to: null
render_as: section

needs_review: false

input:
  key: mgt9.penalties
  label: "Penalties, punishment or compounding of offences during the year"
  datatype: select
  carry_forward: never
  mandatory: true
  options:
    - { value: "none", label: "None" }
    - { value: "some", label: "There were — give the particulars" }

  defaults:
    - { value: "none" }

variants:
  - when: "value == 'none'"
    body: >
      VII. PENALTIES / PUNISHMENT / COMPOUNDING OF OFFENCES


      There were no penalties, punishment or compounding of offences against the Company,
      its Directors or other officers in default during the year under review.

  - when: "value == 'some'"
    body: >
      VII. PENALTIES / PUNISHMENT / COMPOUNDING OF OFFENCES


      The penalties, punishment and compounding of offences during the year under review are
      set out below:
    requires_narrative: true
    severity: exception
