# AUTHORED to the partner's instruction of 20 Aug 2026, from the firm's own
# precedent. See mgt9_header.yaml for the position on whether MGT-9 is
# required at all.

id: mgt9.shareholding.category
document: mgt9
order: 40
number: ""
title: "IV(A). Category-wise Shareholding"
clause_ref: "s.92(3)"
effective_from: "2014-04-01"
effective_to: null
render_as: section

needs_review: false

input:
  key: mgt9.shareholding.category
  label: "Category-wise shareholding"
  datatype: select
  carry_forward: prompt
  mandatory: true
  options:
    - { value: "given", label: "Give the particulars" }
    - { value: "nil", label: "Nil" }

  defaults:
    - { value: "given" }

repeating_block:
  when: "value == 'given'"
  entity: mgt9_shareholding
  min_rows: 1
  carry_forward: prompt
  columns:
    - { key: category, label: "Category of shareholders", datatype: text, required: true }
    - { key: shares_begin, label: "Shares at the beginning of the year", datatype: text }
    - { key: shares_end, label: "Shares at the end of the year", datatype: text }

variants:
  - when: "value == 'given'"
    body: >
      IV. SHARE HOLDING PATTERN (Equity Share Capital Breakup as percentage of Total Equity)


      A. Category-wise Shareholding
    render_block: table

  - when: "value == 'nil'"
    body: >
      IV. SHARE HOLDING PATTERN (Equity Share Capital Breakup as percentage of Total Equity)


      Nil
