# AUTHORED to the partner's instruction of 20 Aug 2026, from the firm's own
# precedent. See mgt9_header.yaml for the position on whether MGT-9 is
# required at all.

id: mgt9.shareholding.promoters
document: mgt9
order: 50
number: ""
title: "IV(B). Shareholding of Promoters"
clause_ref: "s.92(3)"
effective_from: "2014-04-01"
effective_to: null
render_as: section

needs_review: false

input:
  key: mgt9.shareholding.promoters
  label: "Shareholding of promoters"
  datatype: select
  carry_forward: prompt
  mandatory: true
  options:
    - { value: "given", label: "Give the particulars" }
    - { value: "nil", label: "Nil" }

  defaults:
    - { value: "given" }

repeating_block:
  when: "value == 'given'"
  entity: mgt9_promoter_holding
  min_rows: 1
  carry_forward: prompt
  columns:
    - { key: shareholder_name, label: "Shareholder's name", datatype: text, required: true }
    - { key: shares_begin, label: "No. of shares (beginning of year)", datatype: number }
    - { key: pct_begin, label: "% of total shares (beginning)", datatype: number }
    - { key: shares_end, label: "No. of shares (end of year)", datatype: number }
    - { key: pct_end, label: "% of total shares (end)", datatype: number }

variants:
  - when: "value == 'given'"
    body: >
      B. Shareholding of Promoters


      The shareholding of the promoters of the Company is set out below:
    render_block: table

  - when: "value == 'nil'"
    body: >
      B. Shareholding of Promoters


      Nil
