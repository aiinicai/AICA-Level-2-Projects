# AUTHORED from the firm's own report format.
#
# NOT PRODUCED BY THE SCAFFOLDER. `scripts/scaffold_clauses.py` carries a
# hand-written clause table rather than reading the approved register, and
# this row was never transcribed into it — so the document simply had no
# such paragraph. tests/test_register_reconciliation.py now fails if any
# approved row is missing.

# SETTLED — the split stands, 16 August 2026. Decision 6 in
# docs/GATE_A_DECISIONS.md.
#
# The original divergence:
# The firm's format runs the addressee and the first heading together on one
# line: "To the Members of ABC Private Limited on the Audit of Financial
# Statements". SA 700 treats them as separate elements — the addressee, then
# a "Report on the Audit of the Financial Statements" heading which is
# required only when the report also carries the other-legal-and-regulatory
# section. Since this report always carries that section, both are kept and
# they are separate here. The partner confirmed the split rather than the
# firm's single line.

id: iar.addressee
document: auditors_report
order: 20
number: ""
title: "Addressee"
clause_ref: "SA 700 para 22"
effective_from: "2014-04-01"
effective_to: null

needs_review: false

variants:
  # Firm wording, with the company name interpolated rather than typed.
  # THE CIN, added 21 Aug 2026 on the firm's team's observation.
  #
  # It identifies the company being reported on beyond doubt, which a name
  # alone does not: two companies may share a name across states, and a
  # report is read years later by people who were not in the room.
  #
  # ON WHETHER IT IS REQUIRED. Section 12(3)(c) puts the obligation on the
  # COMPANY, to print its CIN on its own letters, billheads and official
  # publications; it does not on its face bind the auditor. Quoting it in
  # the auditor's report is settled practice rather than a duty imposed on
  # the auditor. The firm asked for it and nothing is lost by including it.
  - body: >
      To the Members of {{ company_name }}


      CIN: {{ cin }}
