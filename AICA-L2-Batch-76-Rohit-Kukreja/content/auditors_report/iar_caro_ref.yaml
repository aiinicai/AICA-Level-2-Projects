# AUTHORED from the firm's own report format.
#
# NOT PRODUCED BY THE SCAFFOLDER. `scripts/scaffold_clauses.py` carries a
# hand-written clause table rather than reading the approved register, and
# this row was never transcribed into it — so the document simply had no
# such paragraph. tests/test_register_reconciliation.py now fails if any
# approved row is missing.

# The firm numbers this paragraph "1." and the section 143(3) lead-in "2.",
# and those two numbers are fixed — unlike the lettered sub-paragraphs
# beneath, nothing conditional sits between them. They are authored into the
# text rather than generated.
#
# Driven by the `caro` flag from the applicability engine, so the
# report cannot reference an annexure the tool did not produce.

id: iar.caro.ref
document: auditors_report
order: 160
number: ""
title: "Reference to the CARO 2020 Annexure"
clause_ref: "s.143(11); CARO 2020"
effective_from: "2021-04-01"
effective_to: null

needs_review: false

input:
  key: iar.caro.ref
  label: "CARO 2020 applicability"
  datatype: select
  carry_forward: prompt
  mandatory: true
  options:
    - { value: "applicable", label: "CARO applies — Annexure A attached" }
    - { value: "exempt", label: "CARO does not apply" }

variants:
  # Firm wording, followed by its lead-in to the section 143(3) paragraphs.
  - when: "value == 'applicable'"
    body: >
      1. As required by the Companies (Auditor's Report) Order, 2020 ("the Order"), issued
      by the Central Government of India in terms of sub-section (11) of section 143 of the
      Companies Act, 2013, we give in the "Annexure A" a statement on the matters specified
      in paragraphs 3 and 4 of the Order, to the extent applicable.

      2. As required by Section 143(3) of the Act, we report that:

  # AUTHORED — the precedent is a company to which the Order applies, so it
  # shows no exempt case. Paragraph 2 of the Order lists the companies
  # excluded from it.
  - when: "value == 'exempt'"
    body: >
      1. The Companies (Auditor's Report) Order, 2020 issued by the Central Government of
      India in terms of sub-section (11) of section 143 of the Companies Act, 2013 is not
      applicable to the Company, and accordingly no statement on the matters specified in
      paragraphs 3 and 4 of the Order is given.

      2. As required by Section 143(3) of the Act, we report that:
