# AUTHORED from the firm's own report format.
#
# NOT PRODUCED BY THE SCAFFOLDER. `scripts/scaffold_clauses.py` carries a
# hand-written clause table rather than reading the approved register, and
# this row was never transcribed into it — so the document simply had no
# such paragraph. tests/test_register_reconciliation.py now fails if any
# approved row is missing.

id: iar.other.info
document: auditors_report
order: 120
number: ""
title: "Information Other than the Financial Statements and Auditor's Report Thereon"
clause_ref: "SA 720 (Revised)"
effective_from: "2018-04-01"
effective_to: null
render_as: section

needs_review: false

input:
  key: iar.other.info
  label: "Other information obtained before the date of this report"
  datatype: select
  carry_forward: prompt
  mandatory: true
  options:
    - { value: "nothing_to_report", label: "Obtained — nothing to report" }
    - { value: "misstatement", label: "Obtained — uncorrected material misstatement" }
    - { value: "not_obtained", label: "Not obtained at the date of this report" }

variants:
  # Firm wording — the four paragraphs of its precedent, kept as four
  # paragraphs. "The Company's management and Board of Directors are
  # responsible" is the firm's phrasing.
  - when: "value == 'nothing_to_report'"
    body: >
      Information Other than the Financial Statements and Auditor's Report Thereon

      The Company's management and Board of Directors are responsible for the other
      information. The other information comprises the information included in the
      Company's annual report, but does not include the financial statements and our
      auditor's report thereon.

      Our opinion on the financial statements does not cover the other information and we
      do not express any form of assurance conclusion thereon.

      In connection with our audit of the financial statements, our responsibility is to
      read the other information and, in doing so, consider whether the other information
      is materially inconsistent with the financial statements or our knowledge obtained
      in the audit, or otherwise appears to be materially misstated. If, based on the work
      we have performed on the other information obtained prior to the date of this
      auditor's report, we conclude that there is a material misstatement of this other
      information, we are required to report that fact.

      We have nothing to report in this regard.

  # AUTHORED — the firm's precedent ends "We have nothing to report in this
  # regard" and shows no other case.
  - when: "value == 'misstatement'"
    body: >
      Information Other than the Financial Statements and Auditor's Report Thereon

      The Company's management and Board of Directors are responsible for the other
      information. The other information comprises the information included in the
      Company's annual report, but does not include the financial statements and our
      auditor's report thereon.

      Our opinion on the financial statements does not cover the other information and we
      do not express any form of assurance conclusion thereon.

      In connection with our audit of the financial statements, our responsibility is to
      read the other information and, in doing so, consider whether the other information
      is materially inconsistent with the financial statements or our knowledge obtained
      in the audit, or otherwise appears to be materially misstated. Based on the work we
      have performed, we conclude that there is a material misstatement of this other
      information, as described below:
    requires_narrative: true
    severity: exception

  # AUTHORED — SA 720 (Revised) para 22 covers other information expected
  # after the date of the report, which is the usual case for a company whose
  # Board's Report is approved later.
  - when: "value == 'not_obtained'"
    body: >
      Information Other than the Financial Statements and Auditor's Report Thereon

      The Company's management and Board of Directors are responsible for the other
      information. The other information comprises the information included in the
      Company's annual report, but does not include the financial statements and our
      auditor's report thereon. The annual report is expected to be made available to us
      after the date of this auditor's report.

      Our opinion on the financial statements does not cover the other information and we
      will not express any form of assurance conclusion thereon.

      In connection with our audit of the financial statements, our responsibility is to
      read the other information identified above when it becomes available and, in doing
      so, consider whether the other information is materially inconsistent with the
      financial statements or our knowledge obtained in the audit, or otherwise appears to
      be materially misstated.
