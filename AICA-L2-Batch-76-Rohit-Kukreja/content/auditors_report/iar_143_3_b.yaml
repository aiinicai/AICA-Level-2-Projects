# AUTHORED from the firm's own report format. See iar_143_3_a.yaml for why
# `number` is positional rather than a literal letter.
#
# Section 143(3)(b) has two limbs: proper books of account, AND proper
# returns adequate for the audit received from branches not visited. The
# firm's precedent is a single-location private company, so it shows only
# the first limb. The branch limb below is AUTHORED.
#
# QUESTION REMOVED ON THE PARTNER'S INSTRUCTION, 17 August 2026.
# "Do not ask this question, assume it as there is no branch."
#
# CONSEQUENCE. The second limb of section 143(3)(b) --- proper returns adequate for the audit
# received from branches not visited --- can no longer be reported, and neither can a
# failure to keep proper books of account. The removed wording is kept at the foot of
# this file.

id: iar.143.3.b
document: auditors_report
order: 180
number: "auto:alpha"
title: "Proper Books of Account Kept"
clause_ref: "s.143(3)(b)"
effective_from: "2014-04-01"
effective_to: null

needs_review: false

variants:
  # The firm's wording for a single-location company, which is now the only case.
  - body: >
      In our opinion, proper books of account as required by law have been kept by the
      Company so far as it appears from our examination of those books.

