# AUTHORED — this paragraph does NOT appear in the firm's report format at
# all, because the precedent company has no branches.
#
# It is kept in the repository, and omitted from the document unless a branch
# actually exists, for two reasons. Section 143(3)(c) is a mandatory
# reporting requirement whenever a branch is audited under section 143(8) by
# someone other than the company's auditor — a format that has no paragraph
# for it simply cannot produce a correct report for such a company. And its
# presence is exactly what makes the firm's lettering shift: with this
# paragraph printed, the paragraph the firm calls (c) becomes (d) and so on
# down. That is why every paragraph in this group is lettered positionally.
#
# SETTLED — 16 August 2026. See docs/GATE_A_DECISIONS.md, decision 4.
#
# The partner directed that the standard case is a company with no branch and
# no branch auditor, and left the call on whether to keep the clause to me.
# THE CLAUSE STAYS, and nothing about the standard case changes: the first
# option is "no branch offices", it carries `omit: true`, and the paragraph
# does not print. A clean report is lettered (a) to (h) exactly as the firm's
# precedent is.
#
# It stays because section 143(3)(c) is not optional when the facts arise.
# Where a branch is audited under section 143(8) by someone other than the
# company's auditor, the report must state that the branch auditor's report
# was sent and how it was dealt with. Deleting the clause would leave the
# tool unable to produce a lawful report for such a company, and would leave
# whoever met that case editing a signed document by hand — which is the
# failure mode this tool exists to remove. Keeping it costs one dropdown that
# already defaults to the right answer.
#
# QUESTION REMOVED ON THE PARTNER'S INSTRUCTION, 17 August 2026.
# "Do not ask this question, assume it as there is no branch and no paragraph is
# required for this."
#
# CONSEQUENCE. THIS REVERSES A CALL I MADE ON 16 AUGUST. When the partner delegated it (Gate A
# decision 4, "take call as per law") I kept the clause, because section 143(3)(c) is
# mandatory whenever a branch is audited under section 143(8) by another auditor and
# their report is dealt with in preparing this one. The partner has now decided
# otherwise, expressly. The paragraph never prints, and an engagement with a branch
# auditor cannot be reported on by this tool. See docs/GATE_A_DECISIONS.md decision 4,
# which is superseded by decision 26.

id: iar.143.3.c
document: auditors_report
order: 190
number: "auto:alpha"
title: "Branch Audit Reports Received and Dealt With"
clause_ref: "s.143(3)(c); s.143(8)"
effective_from: "2014-04-01"
effective_to: null

needs_review: false

variants:
  # Never printed. The clause is kept in the repository rather than deleted, so that the
  # decision is visible where the statute is, and so the auto:alpha lettering of the
  # section 143(3) group continues to close up over it exactly as it did before.
  - body: >
      The Company has no branch office, so no reporting under section 143(3)(c) of the Act
      arises and this paragraph is not printed.
    omit: true

