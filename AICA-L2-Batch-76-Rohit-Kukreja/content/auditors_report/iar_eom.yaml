# AUTHORED from the firm's own report format.
#
# NOT PRODUCED BY THE SCAFFOLDER. `scripts/scaffold_clauses.py` carries a
# hand-written clause table rather than reading the approved register, and
# this row was never transcribed into it — so the document simply had no
# such paragraph. tests/test_register_reconciliation.py now fails if any
# approved row is missing.

# The firm's format carries the line "Emphasis of Matter (if there are any
# qualifications or other remarks)" as an instruction to whoever fills the
# template in, not as report text. It is not reproduced.
#
# ACKNOWLEDGED BY THE PARTNER, 16 August 2026 — decision 7 in
# docs/GATE_A_DECISIONS.md.
#
# An Emphasis of Matter is not for qualifications. SA 706 para 7 defines it
# as a matter appropriately presented or disclosed in the financial
# statements that is fundamental to users' understanding — a qualification is
# the opposite case, where the matter is NOT appropriately dealt with, and
# belongs in the Basis for Qualified Opinion.
#
# The instruction line in the firm's own template conflates the two. It is
# not reproduced here, and the firm's template should be corrected
# separately — this tool cannot do that for it.

id: iar.eom
document: auditors_report
order: 100
number: ""
title: "Emphasis of Matter"
clause_ref: "SA 706 (Revised) paras 8-9"
effective_from: "2014-04-01"
effective_to: null
render_as: section

needs_review: false

input:
  key: iar.eom
  label: "Emphasis of Matter paragraph"
  datatype: select
  carry_forward: prompt
  mandatory: true
  options:
    - { value: "none", label: "None" }
    - { value: "eom", label: "Emphasis of Matter — describe" }

variants:
  - when: "value == 'none'"
    body: >
      There is no Emphasis of Matter, so this section is not printed.
    omit: true

  # AUTHORED — SA 706 (Revised) para 9(c) requires the paragraph to state
  # that the opinion is not modified in respect of the matter.
  - when: "value == 'eom'"
    body: >
      Emphasis of Matter
    requires_narrative: true
