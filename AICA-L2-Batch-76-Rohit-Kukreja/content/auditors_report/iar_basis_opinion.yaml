# AUTHORED from the firm's own report format.
#
# NOT PRODUCED BY THE SCAFFOLDER. `scripts/scaffold_clauses.py` carries a
# hand-written clause table rather than reading the approved register, and
# this row was never transcribed into it — so the document simply had no
# such paragraph. tests/test_register_reconciliation.py now fails if any
# approved row is missing.

# ORDER CHANGED FROM THE REGISTER — flagged for Gate A.
# The register puts `iar.basis.opinion` (order 60) ahead of
# `iar.basis.modified` (order 70). Under SA 705 the description of the matter
# giving rise to the modification comes FIRST, and the standard "We conducted
# our audit in accordance with the SAs" paragraph follows it. Rendered in the
# register's order the report would state the audit was conducted in
# accordance with the Standards and then, underneath, describe the
# qualification — which reverses the argument the section makes.
#
# So `iar.basis.modified` is order 60 here and this clause is order 70.
#
# The heading belongs to whichever clause comes first: when the opinion is
# modified `iar.basis.modified` prints "Basis for Qualified Opinion" and this
# clause prints no heading; when it is clean this clause prints "Basis for
# Opinion" itself.

id: iar.basis.opinion
document: auditors_report
order: 70
number: ""
title: "Basis for Opinion — Standards, Independence and Sufficiency of Evidence"
clause_ref: "SA 700 paras 28-29; SA 705 para 21"
effective_from: "2014-04-01"
effective_to: null
render_as: section

needs_review: false

variants:
  # AUTHORED — SA 705 para 19 and SA 200: an auditor who disclaims an opinion
  # must NOT state that the audit was conducted in accordance with the SAs,
  # because that would assert an audit was completed. The precedent has no
  # disclaimer case.
  - when: "opinion_type == 'disclaimer'"
    # The heading was printed by iar.basis.modified; this is its body.
    render_as: para
    body: >
      We are independent of the Company in accordance with the Code of Ethics issued by
      the Institute of Chartered Accountants of India together with the ethical
      requirements that are relevant to our audit of the financial statements under the
      provisions of the Companies Act, 2013 and the Rules thereunder, and we have
      fulfilled our other ethical responsibilities in accordance with these requirements
      and the Code of Ethics. We believe that the audit evidence we have obtained is not
      sufficient and appropriate to provide a basis for an audit opinion on these
      financial statements.

  # Firm wording, with the closing phrase changed to name the modification as
  # SA 705 para 21 requires: "a basis for our qualified opinion".
  - when: "opinion_type == 'qualified' or opinion_type == 'adverse'"
    render_as: para
    body: >
      We conducted our audit in accordance with the Standards on Auditing (SAs) specified
      under section 143(10) of the Companies Act, 2013. Our responsibilities under those
      Standards are further described in the Auditor's Responsibilities for the Audit of
      the Financial Statements section of our report. We are independent of the Company in
      accordance with the Code of Ethics issued by the Institute of Chartered Accountants
      of India together with the ethical requirements that are relevant to our audit of
      the financial statements under the provisions of the Companies Act, 2013 and the
      Rules thereunder, and we have fulfilled our other ethical responsibilities in
      accordance with these requirements and the Code of Ethics. We believe that the audit
      evidence we have obtained is sufficient and appropriate to provide a basis for our
      modified opinion.

  # Firm wording, preceded by the heading this clause owns in the clean case.
  - body: >
      Basis for Opinion

      We conducted our audit in accordance with the Standards on Auditing (SAs) specified
      under section 143(10) of the Companies Act, 2013. Our responsibilities under those
      Standards are further described in the Auditor's Responsibilities for the Audit of
      the Financial Statements section of our report. We are independent of the Company in
      accordance with the Code of Ethics issued by the Institute of Chartered Accountants
      of India together with the ethical requirements that are relevant to our audit of
      the financial statements under the provisions of the Companies Act, 2013 and the
      Rules thereunder, and we have fulfilled our other ethical responsibilities in
      accordance with these requirements and the Code of Ethics. We believe that the audit
      evidence we have obtained is sufficient and appropriate to provide a basis for our
      opinion.
