# AUTHORED from the firm's own report format.
#
# NOT PRODUCED BY THE SCAFFOLDER. `scripts/scaffold_clauses.py` carries a
# hand-written clause table rather than reading the approved register, and
# this row was never transcribed into it — so the document simply had no
# such paragraph. tests/test_register_reconciliation.py now fails if any
# approved row is missing.

# Key Audit Matters are required by SA 701 for listed entities and for any
# entity where the auditor decides to communicate them. The applicability
# engine computes the `kam` flag; this clause is driven by it.
#
# The firm's format has no KAM section — its precedent is an unlisted private
# company, for which SA 701 does not apply. Both variants are AUTHORED.

id: iar.kam
document: auditors_report
order: 90
number: ""
title: "Key Audit Matters"
clause_ref: "SA 701"
effective_from: "2017-04-01"
effective_to: null
render_as: section

applicability:
  requires: [kam]

needs_review: false

repeating_block:
  entity: key_audit_matter
  min_rows: 1
  carry_forward: never
  columns:
    - { key: matter, label: "Key audit matter", datatype: longtext, required: true }
    - { key: response, label: "How the matter was addressed in our audit", datatype: longtext, required: true }

variants:
  # AUTHORED — SA 701 para 11.
  - body: >
      Key Audit Matters

      Key audit matters are those matters that, in our professional judgment, were of most
      significance in our audit of the financial statements of the current period. These
      matters were addressed in the context of our audit of the financial statements as a
      whole, and in forming our opinion thereon, and we do not provide a separate opinion
      on these matters.
    render_block: table
