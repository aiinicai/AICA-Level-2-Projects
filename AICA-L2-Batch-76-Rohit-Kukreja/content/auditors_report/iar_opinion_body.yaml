# AUTHORED from the firm's own report format.
#
# NOT PRODUCED BY THE SCAFFOLDER. `scripts/scaffold_clauses.py` carries a
# hand-written clause table rather than reading the approved register, and
# this row was never transcribed into it — so the document simply had no
# such paragraph. tests/test_register_reconciliation.py now fails if any
# approved row is missing.

# See iar_opinion_scope.yaml: the sentence identifying the financial
# statements has been split out of this clause, leaving the opinion itself.
# This clause branches on `opinion_type` from the engagement, not on an
# answer of its own — see iar_opinion_type.yaml.

id: iar.opinion.body
document: auditors_report
order: 50
number: ""
title: "Opinion Paragraph"
clause_ref: "SA 700 para 25; SA 705 paras 17-19"
effective_from: "2014-04-01"
effective_to: null

needs_review: false

# CASH FLOW STATEMENT, 20 August 2026 (decision 49). Section 2(40) first
# proviso: a small company or OPC need not include one, so the OPINION must not
# say the statements give a true and fair view of cash flows that do not exist.
# The `cash_flow_required` variant of each pair comes first, so a company of
# unknown type receives the fuller opinion.

variants:
  # AUTHORED — SA 705 para 17. The precedent shows only the clean opinion.
  - when: "cash_flow_required and opinion_type == 'qualified'"
    body: >
      In our opinion and to the best of our information and according to the explanations
      given to us, except for the effects of the matter described in the Basis for
      Qualified Opinion section of our report, the aforesaid financial statements give the
      information required by the Companies Act, 2013 in the manner so required and give a
      true and fair view in conformity with the accounting principles generally accepted
      in India, of the state of affairs of the Company as at {{ fy_end_long }}, and its
      profit or loss and its cash flows for the year ended on that date.

  # AUTHORED — SA 705 para 18.

  # A small company or OPC: the statements include no cash flow statement
  # (s.2(40) proviso), so the opinion does not extend to cash flows.
  - when: "opinion_type == 'qualified'"
    body: >
      In our opinion and to the best of our information and according to the explanations
      given to us, except for the effects of the matter described in the Basis for
      Qualified Opinion section of our report, the aforesaid financial statements give the
      information required by the Companies Act, 2013 in the manner so required and give a
      true and fair view in conformity with the accounting principles generally accepted
      in India, of the state of affairs of the Company as at {{ fy_end_long }}, and its
      profit or loss for the year ended on that date.

  # AUTHORED — SA 705 para 18.
  - when: "cash_flow_required and opinion_type == 'adverse'"
    body: >
      In our opinion and to the best of our information and according to the explanations
      given to us, because of the significance of the matter described in the Basis for
      Adverse Opinion section of our report, the aforesaid financial statements do not
      give the information required by the Companies Act, 2013 in the manner so required
      and do not give a true and fair view in conformity with the accounting principles
      generally accepted in India, of the state of affairs of the Company as at
      {{ fy_end_long }}, and its profit or loss and its cash flows for the year ended on
      that date.

  # AUTHORED — SA 705 para 19.

  # A small company or OPC: the statements include no cash flow statement
  # (s.2(40) proviso), so the opinion does not extend to cash flows.
  - when: "opinion_type == 'adverse'"
    body: >
      In our opinion and to the best of our information and according to the explanations
      given to us, because of the significance of the matter described in the Basis for
      Adverse Opinion section of our report, the aforesaid financial statements do not
      give the information required by the Companies Act, 2013 in the manner so required
      and do not give a true and fair view in conformity with the accounting principles
      generally accepted in India, of the state of affairs of the Company as at
      {{ fy_end_long }}, and its profit or loss for the year ended on that date.

  # AUTHORED — SA 705 para 19.
  - when: "opinion_type == 'disclaimer'"
    body: >
      We do not express an opinion on the accompanying financial statements of the
      Company. Because of the significance of the matter described in the Basis for
      Disclaimer of Opinion section of our report, we have not been able to obtain
      sufficient appropriate audit evidence to provide a basis for an audit opinion on
      these financial statements.

  # Firm wording, with the date interpolated. The precedent says "its
  # financial performance"; "its profit or loss" is the phrase used in the
  # ICAI illustrative format for a company reporting under Accounting
  # Standards, and is kept consistent with the modified variants above.
  - when: "cash_flow_required"
    body: >
      In our opinion and to the best of our information and according to the explanations
      given to us, the aforesaid financial statements give the information required by the
      Companies Act, 2013 in the manner so required and give a true and fair view in
      conformity with the accounting principles generally accepted in India, of the state
      of affairs of the Company as at {{ fy_end_long }}, and its profit or loss and its
      cash flows for the year ended on that date.

  # A small company or OPC: the statements include no cash flow statement
  # (s.2(40) proviso), so the opinion does not extend to cash flows.
  - body: >
      In our opinion and to the best of our information and according to the explanations
      given to us, the aforesaid financial statements give the information required by the
      Companies Act, 2013 in the manner so required and give a true and fair view in
      conformity with the accounting principles generally accepted in India, of the state
      of affairs of the Company as at {{ fy_end_long }}, and its profit or loss for the
      year ended on that date.
