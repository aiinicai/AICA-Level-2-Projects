# AUTHORED from the firm's own report format. THIS IS THE FIRM'S PARAGRAPH
# (c) and the statute's (d) — see iar_143_3_a.yaml on the lettering.
#
# The firm names three statements: Balance Sheet, Statement of Profit and
# Loss, Cash Flow Statement. That is right under Accounting Standards. A
# company reporting under Ind AS must also name the Statement of Changes in
# Equity, so the wording is split by framework rather than fixed.

id: iar.143.3.d
document: auditors_report
order: 200
number: "auto:alpha"
title: "Financial Statements in Agreement with the Books"
clause_ref: "s.143(3)(d)"
effective_from: "2014-04-01"
effective_to: null

needs_review: false

# CASH FLOW STATEMENT, added 20 August 2026 (decision 49).
# Section 2(40) first proviso: a One Person Company, a small company, a dormant
# company and a start-up private company need not include a cash flow statement
# in their financial statements. The partner confirmed this tool is used for
# small companies and OPCs.
#
# The `cash_flow_required` variant comes FIRST, so the fuller wording is what a
# company of unknown type receives -- a document must not silently lose a
# statement because nobody set the company type.

variants:
  # AUTHORED — the Ind AS statement list, which the precedent does not carry.
  - when: "framework == 'indas'"
    body: >
      The Balance Sheet, the Statement of Profit and Loss including Other Comprehensive
      Income, the Statement of Changes in Equity and the Statement of Cash Flows dealt
      with by this Report are in agreement with the books of account.

  # Firm wording.
  - when: "cash_flow_required"
    body: >
      The Balance Sheet, the Statement of Profit and Loss, and the Cash Flow Statement
      dealt with by this Report are in agreement with the books of account.

  # A small company or OPC: no cash flow statement (s.2(40) proviso).
  - body: >
      The Balance Sheet and the Statement of Profit and Loss dealt with by this Report
      are in agreement with the books of account.

