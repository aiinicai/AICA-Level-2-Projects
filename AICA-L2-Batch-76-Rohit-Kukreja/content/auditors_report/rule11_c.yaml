# The firm reports Rule 11 as a numbered list under section 143(3)(g).
# The clause id keeps the STATUTORY letter so the clause stays traceable
# to the rule; `number` carries the firm's rendering.
#
# Wording adapted from the firm's own audit report format, item (3).

id: rule11.c
document: auditors_report
order: 290
number: "(3)"
title: "Transfer of Amounts to the Investor Education and Protection Fund"
clause_ref: "Rule 11(c), Companies (Audit and Auditors) Rules, 2014"
effective_from: "2014-04-01"
effective_to: null

# Adapted from firm precedent rather than generated, but not yet checked
# clause by clause against it.
needs_review: false

input:
  key: rule11.c.status
  label: "Transfer of amounts to the Investor Education and Protection Fund"
  datatype: select
  carry_forward: prompt
  mandatory: true
  options:
    - { value: none, label: "No amounts required to be transferred" }
    - { value: transferred, label: "Transferred within the prescribed time" }
    - { value: delayed, label: "Delay in transferring — particulars" }

variants:
  - when: "value == 'none'"
    body: >
      There were no amounts which were required to be transferred to the
      Investor Education and Protection Fund by the Company.

  - when: "value == 'transferred'"
    body: >
      The amounts which were required to be transferred to the Investor
      Education and Protection Fund have been transferred by the Company within
      the time prescribed.

  - when: "value == 'delayed'"
    body: >
      There has been a delay in transferring amounts which were required to be
      transferred to the Investor Education and Protection Fund by the Company,
      as set out below:
    requires_narrative: true
    severity: exception
