# AUTHORED from the firm's own report format. The firm's paragraph (d),
# the statute's (e) — see iar_143_3_a.yaml on the lettering.
#
# The firm cited Rule 7 of the Companies (Accounts) Rules, 2014 for the
# Accounting Standards route; corrected to the Companies (Accounting Standards)
# Rules, 2021 -- see the note below. An Ind AS company takes section 133 read
# with the Companies (Indian Accounting Standards) Rules, 2015 instead, so the
# citation is split by framework rather than fixed.
#
# QUESTION REMOVED ON THE PARTNER'S INSTRUCTION, 17 August 2026.
# "Always assume it is in agreement / always complied."
#
# This clause no longer asks anything: it has no `input` and prints the
# compliant wording, choosing between the Accounting Standards and Ind AS
# forms from the client's framework.
#
# CONSEQUENCE, WHICH THE PARTNER SHOULD KNOW IS REAL. Section 143(3)(d) and
# (e) are mandatory reporting. If the financial statements do NOT agree with
# the books, or do NOT comply with the standards, the auditor must say so —
# and this tool can no longer produce that report. The exception wording is
# preserved in the comment at the foot of this file, so restoring it is a
# five-minute edit rather than re-authoring.

id: iar.143.3.e
document: auditors_report
order: 210
number: "auto:alpha"
title: "Compliance with the Accounting Standards"
clause_ref: "s.143(3)(e); s.133"
effective_from: "2014-04-01"
effective_to: null

needs_review: false
#
# CITATION CORRECTED, 20 August 2026 (decision 51), on the partner's
# instruction. This clause cited "Rule 7 of the Companies (Accounts) Rules,
# 2014", which was the TRANSITIONAL provision -- it deemed the standards
# notified under the Companies Act, 1956 to be the accounting standards until
# new ones were prescribed. The Accounting Standards are now prescribed by the
# Companies (Accounting Standards) Rules, 2021, and that is what section 133
# is read with.
#
# Ind AS is unaffected: it is section 133 read with the Companies (Indian
# Accounting Standards) Rules, 2015, which is already what the Ind AS variant
# says.

variants:
  # AUTHORED — the Ind AS citation, which the precedent does not carry.
  - when: "framework == 'indas'"
    body: >
      In our opinion, the aforesaid financial statements comply with the Indian Accounting
      Standards specified under Section 133 of the Act, read with the Companies (Indian
      Accounting Standards) Rules, 2015, as amended.

  # Firm wording.
  - body: >
      In our opinion, the aforesaid financial statements comply with the Accounting
      Standards specified under Section 133 of the Act, read with the Companies (Accounting
      Standards) Rules, 2021, as amended.

