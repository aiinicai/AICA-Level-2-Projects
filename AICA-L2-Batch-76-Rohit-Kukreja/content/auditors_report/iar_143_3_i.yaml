# AUTHORED from the firm's own report format. The firm's paragraph (f),
# the statute's (i) — see iar_143_3_a.yaml on the lettering.
#
# SETTLED — the partner confirmed "with reference to financial statements"
# on 16 August 2026. See docs/GATE_A_DECISIONS.md, decision 1.
#
# The firm's format gave two alternatives which used different statutory
# language for the same thing:
#
#   exempt case:     "internal financial controls WITH REFERENCE TO FINANCIAL
#                     STATEMENTS"
#   applicable case: "Internal Financial Controls OVER FINANCIAL REPORTING"
#
# Section 143(3)(i) said "over financial reporting" until the Companies
# (Amendment) Act, 2017 replaced it. Both branches below now use the current
# phrase, and it matches the Annexure B heading and the engagement letter.
# The precedent's own strings are kept above so nothing is lost.
#
# The precedent's applicable-case sentence is also incomplete: "With respect
# to the adequacy ... and operating effectiveness of such controls are given
# in separate Annexure-B" has no subject for "are given". The fragment is not
# reproduced; the variants below are AUTHORED.

id: iar.143.3.i
document: auditors_report
order: 250
number: "auto:alpha"
title: "Adequacy and Operating Effectiveness of Internal Financial Controls"
clause_ref: "s.143(3)(i)"
effective_from: "2014-04-01"
effective_to: null

needs_review: false

input:
  key: iar.143.3.i
  label: "Internal financial controls reporting"
  datatype: select
  carry_forward: prompt
  mandatory: true
  options:
    - { value: "exempt", label: "Exempt private company — no IFC opinion" }
    - { value: "unmodified", label: "Reporting applicable — unmodified opinion, Annexure B" }
    - { value: "modified", label: "Reporting applicable — modified opinion, Annexure B" }

variants:
  # Firm wording, tidied only to name the exemption's source. The firm's
  # sentence is otherwise reproduced.
  - when: "value == 'exempt'"
    body: >
      With respect to the adequacy of the internal financial controls with reference to
      financial statements of the Company and the operating effectiveness of such
      controls, the Company is exempt from the reporting requirement under Section
      143(3)(i) of the Act, being a private company covered by the notification dated
      13th June, 2017 issued by the Ministry of Corporate Affairs.

  # AUTHORED — the precedent's fragment rewritten in the post-2017 language,
  # with the second sentence added because a cross-reference alone does not
  # tell the reader what the annexed opinion actually says.
  - when: "value == 'unmodified'"
    body: >
      With respect to the adequacy of the internal financial controls with reference to
      financial statements of the Company and the operating effectiveness of such
      controls, refer to our separate Report in "Annexure B" to this report. Our report
      expresses an unmodified opinion on the adequacy and operating effectiveness of the
      Company's internal financial controls with reference to financial statements.

  # AUTHORED — not sourced.
  - when: "value == 'modified'"
    body: >
      With respect to the adequacy of the internal financial controls with reference to
      financial statements of the Company and the operating effectiveness of such
      controls, refer to our separate Report in "Annexure B" to this report. Our report
      expresses a modified opinion on the adequacy and operating effectiveness of the
      Company's internal financial controls with reference to financial statements.
    severity: exception
