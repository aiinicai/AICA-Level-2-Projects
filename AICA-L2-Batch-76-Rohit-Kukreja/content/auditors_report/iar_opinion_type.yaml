# AUTHORED from the firm's own report format.
#
# NOT PRODUCED BY THE SCAFFOLDER. `scripts/scaffold_clauses.py` carries a
# hand-written clause table rather than reading the approved register, and
# this row was never transcribed into it — so the document simply had no
# such paragraph. tests/test_register_reconciliation.py now fails if any
# approved row is missing.

# DIVERGENCE FROM THE REGISTER, DELIBERATE.
# The register gives this row `input type: select`, which would ask the user
# for the opinion here. The opinion is already a typed column on the
# engagement — `engagement.opinion_type` — and the consistency engine, the
# year-on-year comparison and the Excel export all read it from there.
# Asking again would create a second place to set the opinion and therefore a
# second place for the two to disagree, which is exactly what §9 exists to
# stop. So this clause has no input: it branches on `opinion_type` from the
# render context.

id: iar.opinion.type
document: auditors_report
order: 40
number: ""
title: "Heading — Opinion"
clause_ref: "SA 700 para 24; SA 705 para 16"
effective_from: "2014-04-01"
effective_to: null
render_as: heading

needs_review: false

variants:
  # AUTHORED — SA 705 para 16 requires the heading to name the modification.
  - when: "opinion_type == 'qualified'"
    body: "Qualified Opinion"
  - when: "opinion_type == 'adverse'"
    body: "Adverse Opinion"
  - when: "opinion_type == 'disclaimer'"
    body: "Disclaimer of Opinion"
  # Firm wording.
  - body: "Opinion"
