# The firm reports Rule 11 as a numbered list under section 143(3)(g).
# The clause id keeps the STATUTORY letter so the clause stays traceable
# to the rule; `number` carries the firm's rendering. Both are needed:
# a reviewer checks the statute by id and the document by number.
# Rule 11(e) is ONE clause with three parts (i), (ii) and (iii).
# Build Prompt v2 §4.2 and §19: do not split this into two clauses, and do not
# create a clause (d) for it. The three parts are sub-paragraphs of a single
# clause body, which is why they are one file with one input, not three.

id: rule11.e
document: auditors_report
order: 310
number: "(4)"
title: "Funds Advanced, Loaned or Received with an Understanding as to Ultimate Beneficiaries"
clause_ref: "Rule 11(e), Companies (Audit and Auditors) Rules, 2014"
effective_from: "2021-04-01"
effective_to: null

needs_review: false

input:
  key: rule11.e.status
  label: "Rule 11(e) — intermediaries, funding parties and ultimate beneficiaries"
  datatype: select
  carry_forward: prompt
  mandatory: true
  options:
    - { value: nil_both,      label: "Representations obtained — no transactions under (i) or (ii)" }
    - { value: transactions,  label: "Transactions exist under (i) and/or (ii)" }
    - { value: misstatement,  label: "Matters noted causing belief that representations are materially misstated" }

variants:
  # AUTHORED — not sourced. The three numbered parts below are parts (i), (ii)
  # and (iii) of the single clause (e), not separate clauses.
  - when: "value == 'nil_both'"
    body: >
      (i) The Management has represented that, to the best of its knowledge and belief,
      no funds have been advanced or loaned or invested (either from borrowed funds or
      share premium or any other sources or kind of funds) by the Company to or in any
      other person or entity, including foreign entities ("Intermediaries"), with the
      understanding, whether recorded in writing or otherwise, that the Intermediary
      shall, whether directly or indirectly, lend or invest in other persons or entities
      identified in any manner whatsoever by or on behalf of the Company ("Ultimate
      Beneficiaries") or provide any guarantee, security or the like on behalf of the
      Ultimate Beneficiaries.

      (ii) The Management has represented that, to the best of its knowledge and belief,
      no funds have been received by the Company from any person or entity, including
      foreign entities ("Funding Parties"), with the understanding, whether recorded in
      writing or otherwise, that the Company shall, whether directly or indirectly, lend
      or invest in other persons or entities identified in any manner whatsoever by or on
      behalf of the Funding Party ("Ultimate Beneficiaries") or provide any guarantee,
      security or the like on behalf of the Ultimate Beneficiaries.

      (iii) Based on such audit procedures as we considered reasonable and appropriate in
      the circumstances, nothing has come to our notice that has caused us to believe that
      the representations under sub-clauses (i) and (ii) contain any material misstatement.

  # AUTHORED — not sourced.
  - when: "value == 'transactions'"
    body: >
      (i) and (ii) The Management has represented the particulars of funds advanced,
      loaned or invested to Intermediaries, and of funds received from Funding Parties,
      with an understanding as to Ultimate Beneficiaries, as disclosed in the notes to
      the financial statements.

      (iii) Based on such audit procedures as we considered reasonable and appropriate in
      the circumstances, nothing has come to our notice that has caused us to believe that
      the representations under sub-clauses (i) and (ii) contain any material misstatement.
    requires_narrative: true
    severity: info

  # AUTHORED — not sourced.
  - when: "value == 'misstatement'"
    body: >
      (iii) Based on such audit procedures as we considered reasonable and appropriate in
      the circumstances, the following matters have come to our notice that have caused us
      to believe that the representations under sub-clauses (i) and (ii) contain a material
      misstatement:
    requires_narrative: true
    severity: exception
