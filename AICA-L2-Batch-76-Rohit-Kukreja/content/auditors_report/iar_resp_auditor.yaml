# AUTHORED from the firm's own report format.
#
# NOT PRODUCED BY THE SCAFFOLDER. `scripts/scaffold_clauses.py` carries a
# hand-written clause table rather than reading the approved register, and
# this row was never transcribed into it — so the document simply had no
# such paragraph. tests/test_register_reconciliation.py now fails if any
# approved row is missing.

# Firm wording throughout. The precedent's sub-paragraph (b) carries two
# alternatives — one for a company where IFC reporting applies and one where
# it does not — with the instruction "(for those who...)" / "(if IFCs not
# applicable)" written into the template. Those instructions are not report
# text; the alternatives are variants here, selected by the same
# applicability flag that drives the section 143(3)(i) paragraph and Annexure
# B, so the three cannot disagree.
#
# The lettering (a) to (e) inside this section is the firm's own and is
# authored into the text, not generated: it is a fixed list that does not
# move.

id: iar.resp.auditor
document: auditors_report
order: 140
number: ""
title: "Auditor's Responsibilities for the Audit of the Financial Statements"
clause_ref: "SA 700 paras 37-40"
effective_from: "2014-04-01"
effective_to: null
render_as: section

needs_review: false

input:
  key: iar.resp.auditor
  label: "Internal financial controls reporting (drives sub-paragraph (b))"
  datatype: select
  carry_forward: prompt
  mandatory: true
  options:
    - { value: "ifc_applicable", label: "IFC reporting applies" }
    - { value: "ifc_exempt", label: "IFC reporting does not apply" }

variants:
  # Firm wording, including its sub-paragraph (b) for the IFC case.
  - when: "value == 'ifc_applicable'"
    body: >
      Auditor's Responsibilities for the Audit of the Financial Statements

      Our objectives are to obtain reasonable assurance about whether the financial
      statements as a whole are free from material misstatement, whether due to fraud or
      error, and to issue an auditor's report that includes our opinion.

      Reasonable assurance is a high level of assurance, but is not a guarantee that an
      audit conducted in accordance with SAs will always detect a material misstatement
      when it exists. Misstatements can arise from fraud or error and are considered
      material if, individually or in the aggregate, they could reasonably be expected to
      influence the economic decisions of users taken on the basis of these financial
      statements.

      As part of an audit in accordance with SAs, we exercise professional judgment and
      maintain professional skepticism throughout the audit. We also:

      (a) Identify and assess the risks of material misstatement of the financial
      statements, whether due to fraud or error, design and perform audit procedures
      responsive to those risks, and obtain audit evidence that is sufficient and
      appropriate to provide a basis for our opinion. The risk of not detecting a material
      misstatement resulting from fraud is higher than for one resulting from error, as
      fraud may involve collusion, forgery, intentional omissions, misrepresentations, or
      the override of internal control.

      (b) Obtain an understanding of internal control relevant to the audit in order to
      design audit procedures that are appropriate in the circumstances. Under section
      143(3)(i) of the Companies Act, 2013, we are also responsible for expressing our
      opinion on whether the Company has adequate internal financial controls with
      reference to financial statements in place and the operating effectiveness of such
      controls.

      (c) Evaluate the appropriateness of accounting policies used and the reasonableness
      of accounting estimates and related disclosures made by management.

      (d) Conclude on the appropriateness of management's use of the going concern basis
      of accounting and, based on the audit evidence obtained, whether a material
      uncertainty exists related to events or conditions that may cast significant doubt
      on the Company's ability to continue as a going concern. If we conclude that a
      material uncertainty exists, we are required to draw attention in our auditor's
      report to the related disclosures in the financial statements or, if such
      disclosures are inadequate, to modify our opinion. Our conclusions are based on the
      audit evidence obtained up to the date of our auditor's report. However, future
      events or conditions may cause the Company to cease to continue as a going concern.

      (e) Evaluate the overall presentation, structure and content of the financial
      statements, including the disclosures, and whether the financial statements
      represent the underlying transactions and events in a manner that achieves fair
      presentation.

      We communicate with those charged with governance regarding, among other matters,
      the planned scope and timing of the audit and significant audit findings, including
      any significant deficiencies in internal control that we identify during our audit.

      We also provide those charged with governance with a statement that we have complied
      with relevant ethical requirements regarding independence, and to communicate with
      them all relationships and other matters that may reasonably be thought to bear on
      our independence, and where applicable, related safeguards.

  # Firm wording, taking the precedent's second alternative at (b).
  - when: "value == 'ifc_exempt'"
    body: >
      Auditor's Responsibilities for the Audit of the Financial Statements

      Our objectives are to obtain reasonable assurance about whether the financial
      statements as a whole are free from material misstatement, whether due to fraud or
      error, and to issue an auditor's report that includes our opinion.

      Reasonable assurance is a high level of assurance, but is not a guarantee that an
      audit conducted in accordance with SAs will always detect a material misstatement
      when it exists. Misstatements can arise from fraud or error and are considered
      material if, individually or in the aggregate, they could reasonably be expected to
      influence the economic decisions of users taken on the basis of these financial
      statements.

      As part of an audit in accordance with SAs, we exercise professional judgment and
      maintain professional skepticism throughout the audit. We also:

      (a) Identify and assess the risks of material misstatement of the financial
      statements, whether due to fraud or error, design and perform audit procedures
      responsive to those risks, and obtain audit evidence that is sufficient and
      appropriate to provide a basis for our opinion. The risk of not detecting a material
      misstatement resulting from fraud is higher than for one resulting from error, as
      fraud may involve collusion, forgery, intentional omissions, misrepresentations, or
      the override of internal control.

      (b) Obtain an understanding of internal control relevant to the audit in order to
      design audit procedures that are appropriate in the circumstances, but not for the
      purpose of expressing an opinion on the effectiveness of the Company's internal
      control.

      (c) Evaluate the appropriateness of accounting policies used and the reasonableness
      of accounting estimates and related disclosures made by management.

      (d) Conclude on the appropriateness of management's use of the going concern basis
      of accounting and, based on the audit evidence obtained, whether a material
      uncertainty exists related to events or conditions that may cast significant doubt
      on the Company's ability to continue as a going concern. If we conclude that a
      material uncertainty exists, we are required to draw attention in our auditor's
      report to the related disclosures in the financial statements or, if such
      disclosures are inadequate, to modify our opinion. Our conclusions are based on the
      audit evidence obtained up to the date of our auditor's report. However, future
      events or conditions may cause the Company to cease to continue as a going concern.

      (e) Evaluate the overall presentation, structure and content of the financial
      statements, including the disclosures, and whether the financial statements
      represent the underlying transactions and events in a manner that achieves fair
      presentation.

      We communicate with those charged with governance regarding, among other matters,
      the planned scope and timing of the audit and significant audit findings, including
      any significant deficiencies in internal control that we identify during our audit.

      We also provide those charged with governance with a statement that we have complied
      with relevant ethical requirements regarding independence, and to communicate with
      them all relationships and other matters that may reasonably be thought to bear on
      our independence, and where applicable, related safeguards.
