# AUTHORED — this paragraph does NOT appear in the firm's report format.
#
# Section 143(3)(f) requires the auditor's observations or comments on
# financial transactions or matters having an adverse effect on the
# functioning of the company. The firm's format omits it, which is common
# practice: with nothing to report there is nothing to say, and the matters
# that would trigger it are dealt with in the Basis for Opinion or in an
# Emphasis of Matter. That reasoning only holds while the answer is nil.
#
# So the nil case is omitted from the document and the adverse case prints,
# which keeps the firm's clean-case lettering identical to its precedent
# while leaving the tool able to report the matter when it arises.
#
# SETTLED — "never print" the nil case, 16 August 2026. See
# docs/GATE_A_DECISIONS.md, decision 5.
#
# The express-negative option ("there are no such observations") has been
# REMOVED, not merely left unselected. An option nobody is to choose is a
# control that can be chosen by accident, and it would print a paragraph the
# firm has decided its reports do not carry. Two options remain: nothing to
# report, which prints nothing, and observations exist, which prints them.

id: iar.143.3.f
document: auditors_report
order: 220
number: "auto:alpha"
title: "Observations Having an Adverse Effect on the Functioning of the Company"
clause_ref: "s.143(3)(f)"
effective_from: "2014-04-01"
effective_to: null

needs_review: false

input:
  key: iar.143.3.f
  label: "Observations on matters adversely affecting the functioning of the Company"
  datatype: select
  carry_forward: prompt
  mandatory: true
  options:
    - { value: "none", label: "No such observations — paragraph not printed" }
    - { value: "exist", label: "Observations exist — state the particulars" }

variants:
  - when: "value == 'none'"
    body: >
      There are no observations or comments on financial transactions or matters which
      have any adverse effect on the functioning of the Company. This paragraph is not
      printed, which follows the firm's report format.
    omit: true

  # AUTHORED — not sourced.
  - when: "value == 'exist'"
    body: >
      Our observations and comments on financial transactions and matters which have an
      adverse effect on the functioning of the Company are as follows:
    requires_narrative: true
    severity: exception
