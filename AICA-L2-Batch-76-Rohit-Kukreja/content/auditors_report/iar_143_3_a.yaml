# AUTHORED from the firm's own report format.
#
# LETTERING. The firm letters the section 143(3) paragraphs (a) to (g) down
# the list it actually prints, which is the ICAI illustrative format for a
# company with no branch audited by another auditor. That is not the
# statute's lettering: this paragraph is statutory (a), but the paragraph
# the firm calls (c) is statutory (d), its (e) is statutory (g), and its (f)
# is statutory (i).
#
# So `number` is `auto:alpha` — assigned at build time by position among the
# paragraphs that print. Hard-coding "(a)" here would be right until a client
# has a branch audited by another auditor, at which point statutory (c)
# appears and every letter below it is wrong. The clause `id` keeps the
# statutory letter, so the statute is still traceable by id and the document
# by number.
#
# QUESTION REMOVED ON THE PARTNER'S INSTRUCTION, 17 August 2026.
# "Do not ask this question, assume it as sought and obtained."
#
# CONSEQUENCE. Section 143(3)(a) requires the auditor to state the EFFECT of any information
# or explanation NOT obtained. The tool can no longer make that report. The removed
# wording is kept at the foot of this file so it can be restored without re-authoring.

id: iar.143.3.a
document: auditors_report
order: 170
number: "auto:alpha"
title: "Information and Explanations Sought and Obtained"
clause_ref: "s.143(3)(a)"
effective_from: "2014-04-01"
effective_to: null

needs_review: false

variants:
  # The firm's wording. No longer conditional.
  - body: >
      We have sought and obtained all the information and explanations which to the best of
      our knowledge and belief were necessary for the purposes of our audit.

# REMOVED 17 Aug 2026 --- kept so it can be restored without re-authoring.
#   input options were: obtained / not_obtained
#
