# AUTHORED from the firm's own report format.
#
# ORDER CHANGED. The scaffold placed this at order 590, ahead of the Rule 11
# group. The firm's format puts it last, after the Rule 11 sub-clauses, and
# letters it in the same run — its precedent reads "h)" straight after "(g)".
# Hence order 670, past rule11.g at 660, and `auto:alpha` so it picks up
# whatever letter the sequence has reached.
#
# The precedent's "h)" is missing its opening bracket. Rendered as "(h)"
# here; positional lettering makes that automatic rather than typed.
#
# Section 197(16) obliges the auditor to state whether remuneration paid by
# the company to its directors is in accordance with section 197. Section
# 197 itself applies to public companies, so for a private company the
# answer is that the section does not apply — which is what the firm's
# wording says. This used to be the third of three options, because the tool
# was not only for private company audits. It is now the only wording; see
# the instruction recorded immediately below.
#
# QUESTION REMOVED ON THE PARTNER'S INSTRUCTION, 17 August 2026.
# "This utility is for private limited companies only and assume it as always not
# applicable."
#
# CONSEQUENCE. THIS NARROWS WHAT THE TOOL MAY BE USED FOR. The paragraph now always states
# that section 197 does not apply, which is true of a private company and FALSE of a public
# one. Nothing in the tool will flag it: this clause was never gated by the `s197`
# applicability flag --- the question was what stood in for that check, and the question is
# now gone. Recorded as decision 27 in docs/GATE_A_DECISIONS.md.

id: iar.197.16
document: auditors_report
order: 355
number: "auto:alpha"
title: "Managerial Remuneration under Section 197"
clause_ref: "s.197(16)"
effective_from: "2014-04-01"
effective_to: null

needs_review: false

variants:
  # The firm's wording. A private company is outside section 197 altogether, by force of
  # section 197(1) itself, which applies to public companies.
  - body: >
      With respect to the matter to be included in the Auditors' Report under Section
      197(16) of the Act, in our opinion and according to the information and explanations
      given to us, the Company being a private limited company, the limit prescribed by
      section 197 for maximum permissible managerial remuneration is not applicable.

# REMOVED 17 Aug 2026 --- kept so it can be restored without re-authoring, should the tool
# ever be used for a public company. Restoring the variants alone is not enough: the input
# block and its three options have to come back with them, or add
# `applicability: {requires: [s197]}` so the flag decides instead of the user.
#   input options were: complied / not_complied / na
#
#   - when: "value == 'complied'"
#     body: >
#       With respect to the matter to be included in the Auditors' Report under Section
#       197(16) of the Act, in our opinion and according to the information and explanations
#       given to us, the remuneration paid by the Company to its directors during the year
#       is in accordance with the provisions of section 197 of the Act.
#
#   - when: "value == 'not_complied'"
#     body: >
#       ... the remuneration paid by the Company to its directors during the year is not in
#       accordance with the provisions of section 197 of the Act. The particulars are as
#       follows:
