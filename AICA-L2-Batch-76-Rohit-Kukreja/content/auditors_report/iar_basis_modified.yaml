# AUTHORED. The scaffolder generated this clause as a three-option skeleton
# with a mandatory select; it is rewritten here.
#
# It no longer asks for the opinion type — that lives on the engagement, and
# asking twice is how the two come to disagree (see iar_opinion_type.yaml).
# It branches on `opinion_type` from the render context and is omitted
# entirely when the opinion is clean.
#
# ORDER CHANGED: 20 -> 60. See iar_basis_opinion.yaml for why this paragraph
# has to precede the standard Basis for Opinion paragraph rather than follow
# it.

id: iar.basis.modified
document: auditors_report
order: 60
number: ""
title: "Basis for Qualified, Adverse or Disclaimer of Opinion"
clause_ref: "SA 705 paras 20-22"
effective_from: "2014-04-01"
effective_to: null
render_as: section

needs_review: false

variants:
  # AUTHORED — the heading and the lead-in. The matter itself is a narrative,
  # because no repository can hold the description of a specific
  # misstatement, and SA 705 para 20 requires it to be described.
  - when: "opinion_type == 'qualified'"
    body: >
      Basis for Qualified Opinion
    requires_narrative: true
    severity: exception

  - when: "opinion_type == 'adverse'"
    body: >
      Basis for Adverse Opinion
    requires_narrative: true
    severity: exception

  - when: "opinion_type == 'disclaimer'"
    body: >
      Basis for Disclaimer of Opinion
    requires_narrative: true
    severity: exception

  # Clean opinion: there is no modification to describe, so no paragraph.
  - body: >
      The opinion is unmodified, so there is no Basis for Modified Opinion paragraph.
    omit: true
