# AUTHORED from the firm's own report format.
#
# NOT PRODUCED BY THE SCAFFOLDER. `scripts/scaffold_clauses.py` carries a
# hand-written clause table rather than reading the approved register, and
# this row was never transcribed into it — so the document simply had no
# such paragraph. tests/test_register_reconciliation.py now fails if any
# approved row is missing.

# The firm's format has no going concern section — its precedent is a
# going-concern-clean file. Both variants below are AUTHORED.
#
# Branches on `going_concern` from the engagement, which is the same column
# the consistency engine reads, so the report and the Board's Report cannot
# take different views of it.

id: iar.gc.mu
document: auditors_report
order: 80
number: ""
title: "Material Uncertainty Related to Going Concern"
clause_ref: "SA 570 (Revised) paras 22-23"
effective_from: "2014-04-01"
effective_to: null
render_as: section

needs_review: false

variants:
  # AUTHORED — SA 570 (Revised) para 22.
  - when: "going_concern == 'material_uncertainty'"
    body: >
      Material Uncertainty Related to Going Concern
    requires_narrative: true
    severity: exception

  - body: >
      No material uncertainty related to going concern has been identified, so this
      section is not printed.
    omit: true
