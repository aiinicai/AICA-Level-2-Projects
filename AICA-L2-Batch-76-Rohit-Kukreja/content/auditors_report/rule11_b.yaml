# The firm reports Rule 11 as a numbered list under section 143(3)(g).
# The clause id keeps the STATUTORY letter so the clause stays traceable
# to the rule; `number` carries the firm's rendering.
#
# Wording adapted from the firm's own audit report format, item (2).

id: rule11.b
document: auditors_report
order: 280
number: "(2)"
title: "Provision for Material Foreseeable Losses on Long-term Contracts"
clause_ref: "Rule 11(b), Companies (Audit and Auditors) Rules, 2014"
effective_from: "2014-04-01"
effective_to: null

# Adapted from firm precedent rather than generated, but not yet checked
# clause by clause against it.
needs_review: false

input:
  key: rule11.b.status
  label: "Material foreseeable losses on long-term contracts, including derivatives"
  datatype: select
  carry_forward: prompt
  mandatory: true
  options:
    - { value: none, label: "No long-term contracts — including derivative contracts" }
    - { value: no_losses, label: "Long-term contracts exist — no material foreseeable losses" }
    - { value: provided, label: "Material foreseeable losses — provision made" }
    - { value: not_provided, label: "Material foreseeable losses — provision not made" }

variants:
  - when: "value == 'none'"
    body: >
      The Company does not have any long-term contracts including derivative
      contracts for which there were any material foreseeable losses.

  - when: "value == 'no_losses'"
    body: >
      The Company has long-term contracts, including derivative contracts, for
      which there were no material foreseeable losses.

  - when: "value == 'provided'"
    body: >
      The Company has made provision, as required under the applicable law or
      accounting standards, for material foreseeable losses on long-term
      contracts including derivative contracts.
    severity: info

  - when: "value == 'not_provided'"
    body: >
      The Company has not made provision, as required under the applicable law
      or accounting standards, for material foreseeable losses on long-term
      contracts including derivative contracts, in the following respects:
    requires_narrative: true
    severity: exception
