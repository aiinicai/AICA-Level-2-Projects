# AUTHORED from the firm's own report format. The firm's paragraph (e),
# the statute's (g) — see iar_143_3_a.yaml on the lettering.
#
# The precedent hard-codes "31st March, 2022" twice. That is the defect the
# render context exists to prevent, so both occurrences are the interpolated
# {{ fy_end_long }} here: the date is derived from the engagement's typed
# FY end column at render time, never typed and never stored as prose.
#
# QUESTION REMOVED ON THE PARTNER'S INSTRUCTION, 17 August 2026.
# "Do not ask for this question, assume it as no director is disqualified." The
# explanation field is removed with it.
#
# CONSEQUENCE. Section 143(3)(g) requires the auditor to report the fact where a director IS
# disqualified under section 164(2). That report can no longer be produced, and the
# disqualified directors can no longer be named. The removed wording is kept at the
# foot of this file.

id: iar.143.3.g
document: auditors_report
order: 230
number: "auto:alpha"
title: "Disqualification of Directors under Section 164(2)"
clause_ref: "s.143(3)(g); s.164(2)"
effective_from: "2014-04-01"
effective_to: null

needs_review: false

variants:
  # The firm's wording, with both dates interpolated from the engagement's typed FY-end
  # column rather than typed into the prose.
  - body: >
      On the basis of the written representations received from the directors as on
      {{ fy_end_long }} taken on record by the Board of Directors, none of the directors is
      disqualified as on {{ fy_end_long }} from being appointed as a director in terms of
      Section 164(2) of the Act.

