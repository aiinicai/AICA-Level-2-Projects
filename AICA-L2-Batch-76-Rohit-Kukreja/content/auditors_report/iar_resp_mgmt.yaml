id: iar.resp.mgmt
document: auditors_report
order: 130
number: ""
title: "Responsibilities of Management and Those Charged with Governance"
clause_ref: "SA 700 paras 33-36; s.134(5)"
effective_from: "2014-04-01"
effective_to: null
render_as: section

needs_review: false

# CASH FLOW STATEMENT, split into a pair of variants (partner's instruction).
# Section 2(40) proviso: a One Person Company, a small company, a dormant
# company and a start-up private company need not include a cash flow
# statement. Naming one in a document the firm signs, for a company that
# prepares none, describes work that was not done.
#
variants:
  # Firm wording — three paragraphs, reproduced as three.
  - when: "cash_flow_required"
    body: >
      Responsibilities of Management and Those Charged with Governance for the Financial
      Statements

      The Company's Board of Directors is responsible for the matters stated in section
      134(5) of the Companies Act, 2013 ("the Act") with respect to the preparation of
      these financial statements that give a true and fair view of the financial position,
      financial performance and cash flows of the Company in accordance with the
      accounting principles generally accepted in India, including the Accounting
      Standards specified under section 133 of the Act. This responsibility also includes
      maintenance of adequate accounting records in accordance with the provisions of the
      Act for safeguarding of the assets of the Company and for preventing and detecting
      frauds and other irregularities; selection and application of appropriate accounting
      policies; making judgments and estimates that are reasonable and prudent; and
      design, implementation and maintenance of adequate internal financial controls, that
      were operating effectively for ensuring the accuracy and completeness of the
      accounting records, relevant to the preparation and presentation of the financial
      statements that give a true and fair view and are free from material misstatement,
      whether due to fraud or error.

      In preparing the financial statements, the Board of Directors is responsible for
      assessing the Company's ability to continue as a going concern, disclosing, as
      applicable, matters related to going concern and using the going concern basis of
      accounting unless the Board of Directors either intends to liquidate the Company or
      to cease operations, or has no realistic alternative but to do so.

      The Board of Directors is also responsible for overseeing the Company's financial
      reporting process.

  # Firm wording — three paragraphs, reproduced as three.
  - when: "not cash_flow_required"
    body: >
