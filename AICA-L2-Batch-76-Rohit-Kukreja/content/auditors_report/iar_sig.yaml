# AUTHORED from the firm's own report format.
#
# NOT PRODUCED BY THE SCAFFOLDER. `scripts/scaffold_clauses.py` carries a
# hand-written clause table rather than reading the approved register, and
# this row was never transcribed into it — so the document simply had no
# such paragraph. tests/test_register_reconciliation.py now fails if any
# approved row is missing.

# Every line here is interpolated from Admin -> Firm & Partners and from the
# engagement. Nothing about any firm is hard-coded: the tool is meant to be
# usable by any CA firm without a code change.
#
# The UDIN comes from the DocumentInstance, not the engagement, because each
# signed document carries its own.

id: iar.sig
document: auditors_report
order: 400
number: ""
title: "Signature Block"
clause_ref: "SA 700 paras 45-49; s.145"
effective_from: "2014-04-01"
effective_to: null
render_as: signature

needs_review: false

variants:
  # Firm wording — the layout of its precedent's signature block.
  - body: >
      For {{ firm_name }}

      Chartered Accountants

      Firm's Registration No: {{ firm_frn }}

      {{ partner_name }}

      Partner

      Membership No: {{ partner_mno }}

      UDIN: {{ udin }}

      Place: {{ place }}

      Date: {{ report_date_long }}
