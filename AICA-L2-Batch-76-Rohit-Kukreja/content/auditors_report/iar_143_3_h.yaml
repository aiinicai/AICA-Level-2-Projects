# AUTHORED — this paragraph does NOT appear in the firm's report format,
# for the same reason as iar_143_3_f: with nothing to report the firm says
# nothing, and where a books-of-account qualification exists it is carried
# in the paragraph the firm letters (b) and in the Basis for Opinion.
#
# Section 143(3)(h) asks for any qualification, reservation or adverse remark
# relating to the maintenance of accounts and other matters connected
# therewith. Where there is one, most formats cross-refer to the (b)
# paragraph rather than repeat it — which is what the "refer" variant does.
#
# QUESTION REMOVED ON THE PARTNER'S INSTRUCTION, 17 August 2026.
# "Remove this, and its explanation, from the list to be filled."
#
# CONSEQUENCE. Section 143(3)(h) covers any qualification, reservation or adverse remark relating
# to the maintenance of accounts and other matters connected therewith. It is now
# never reported. The removed wording is kept at the foot of this file.

