# AUTHORED from the firm's own CARO annexure.
#
# Bodies marked "firm wording" are adapted from the supplied precedent.
# Bodies marked "AUTHORED" are mine: the precedent shows only the clean case,
# so the exception wording had to be written and has not been checked against
# anything. Those are what Gate A should read first.
#
# needs_review stays true until a partner has read every variant.

id: caro.xi.b
document: caro_2020
order: 300
number: "(xi)(b)"
title: "Report under Section 143(12) in Form ADT-4"
clause_ref: "CARO 2020, para 3(xi)(b)"
effective_from: "2021-04-01"
effective_to: null

needs_review: false

applicability:
  requires: [caro]

input:
  key: caro.xi.b
  label: "Report under Section 143(12) in Form ADT-4"
  datatype: select
  carry_forward: prompt
  mandatory: true
  options:
    - { value: "none", label: "No report filed" }
    - { value: "filed", label: "Report filed in Form ADT-4" }

variants:
  # firm wording
  - when: "value == 'none'"
    body: >
      According to the information and explanations given to us, no report
      under sub-section (12) of Section 143 of the Companies Act, 2013 has
      been filed by the auditors in Form ADT-4 as prescribed under Rule 13 of
      Companies (Audit and Auditors) Rules, 2014 with the Central Government.
  # AUTHORED — not from the precedent
  - when: "value == 'filed'"
    body: >
      According to the information and explanations given to us, a report
      under sub-section (12) of Section 143 of the Companies Act, 2013 has
      been filed by the auditors in Form ADT-4 as prescribed under Rule 13 of
      Companies (Audit and Auditors) Rules, 2014 with the Central Government.
      The particulars are as follows:
    severity: exception
    requires_narrative: true
