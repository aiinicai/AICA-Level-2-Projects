# AUTHORED from the firm's own CARO annexure.
#
# Bodies marked "firm wording" are adapted from the supplied precedent.
# Bodies marked "AUTHORED" are mine: the precedent shows only the clean case,
# so the exception wording had to be written and has not been checked against
# anything. Those are what Gate A should read first.
#
# needs_review stays true until a partner has read every variant.

id: caro.xx.a
document: caro_2020
order: 460
number: "(xx)(a)"
title: "Unspent CSR Amount Transferred to a Schedule VII Fund"
clause_ref: "CARO 2020, para 3(xx)(a)"
effective_from: "2021-04-01"
effective_to: null

needs_review: false

applicability:
  requires: [caro]

input:
  key: caro.xx.a
  label: "Unspent CSR Amount Transferred to a Schedule VII Fund"
  datatype: select
  carry_forward: prompt
  mandatory: true
  options:
    - { value: "na", label: "Section 135 not applicable" }
    - { value: "none", label: "No unspent amount" }
    - { value: "transferred", label: "Transferred to a Schedule VII fund within six months" }
    - { value: "not_transferred", label: "Not transferred within six months" }

variants:
  # AUTHORED — not from the precedent
  - when: "value == 'na'"
    body: >
      In our opinion and according to the information and explanations given
      to us, the provisions of Section 135 of the Companies Act, 2013 are not
      applicable to the Company. Accordingly, clause 3(xx)(a) of the Order is
      not applicable.
  # firm wording
  - when: "value == 'none'"
    body: >
      In our opinion and according to the information and explanations given
      to us, there is no unspent amount under sub-section (5) of Section 135
      of the Companies Act, 2013 pursuant to any project other than an ongoing
      project. Accordingly, clause 3(xx)(a) of the Order is not applicable.
  # AUTHORED — not from the precedent
  - when: "value == 'transferred'"
    body: >
      In our opinion and according to the information and explanations given
      to us, in respect of other than ongoing projects, the Company has
      transferred the unspent amount to a Fund specified in Schedule VII to
      the Companies Act within a period of six months of the expiry of the
      financial year in compliance with the second proviso to sub-section (5)
      of section 135 of the said Act.
  # firm wording
  - when: "value == 'not_transferred'"
    body: >
      In our opinion and according to the information and explanations given
      to us, in respect of other than ongoing projects, the Company has not
      transferred the unspent amount to a Fund specified in Schedule VII to
      the Companies Act within a period of six months of the expiry of the
      financial year in compliance with the second proviso to sub-section (5)
      of section 135 of the said Act. The amount involved is as follows:
    severity: exception
    requires_narrative: true
