# AUTHORED from the firm's own CARO annexure.
#
# Bodies marked "firm wording" are adapted from the supplied precedent.
# Bodies marked "AUTHORED" are mine: the precedent shows only the clean case,
# so the exception wording had to be written and has not been checked against
# anything. Those are what Gate A should read first.
#
# needs_review stays true until a partner has read every variant.

id: caro.i.a.B
document: caro_2020
order: 20
number: "(i)(a)(B)"
title: "Records of Intangible Assets"
clause_ref: "CARO 2020, para 3(i)(a)(B)"
effective_from: "2021-04-01"
effective_to: null

needs_review: false

applicability:
  requires: [caro]

input:
  key: caro.i.a.B
  label: "Records of Intangible Assets"
  datatype: select
  carry_forward: prompt
  mandatory: true
  options:
    - { value: "maintained", label: "Proper records maintained" }
    - { value: "not_maintained", label: "Proper records not maintained" }
    - { value: "none", label: "No intangible assets" }

variants:
  # firm wording
  - when: "value == 'maintained'"
    body: >
      The Company has maintained proper records showing full particulars of
      Intangible assets.
  # AUTHORED — not from the precedent
  - when: "value == 'not_maintained'"
    body: >
      The Company has not maintained proper records showing full particulars
      of Intangible assets. The particulars are as follows:
    severity: exception
    requires_narrative: true
  # AUTHORED — not from the precedent
  - when: "value == 'none'"
    body: >
      The Company does not have any Intangible assets. Accordingly, clause
      3(i)(a)(B) of the Order is not applicable.
