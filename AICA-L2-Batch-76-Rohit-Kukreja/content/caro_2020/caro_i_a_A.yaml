# AUTHORED from the firm's own CARO annexure.
#
# Bodies marked "firm wording" are adapted from the supplied precedent.
# Bodies marked "AUTHORED" are mine: the precedent shows only the clean case,
# so the exception wording had to be written and has not been checked against
# anything. Those are what Gate A should read first.
#
# needs_review stays true until a partner has read every variant.

id: caro.i.a.A
document: caro_2020
order: 10
number: "(i)(a)(A)"
title: "Records of Property, Plant and Equipment"
clause_ref: "CARO 2020, para 3(i)(a)(A)"
effective_from: "2021-04-01"
effective_to: null

needs_review: false

applicability:
  requires: [caro]

input:
  key: caro.i.a.A
  label: "Records of Property, Plant and Equipment"
  datatype: select
  carry_forward: prompt
  mandatory: true
  options:
    - { value: "maintained", label: "Proper records maintained" }
    - { value: "not_maintained", label: "Proper records not maintained" }
    - { value: "none", label: "No property, plant and equipment" }

variants:
  # firm wording
  - when: "value == 'maintained'"
    body: >
      The Company has maintained proper records showing full particulars,
      including quantitative details and situation of Property, plant and
      equipment.
  # AUTHORED — not from the precedent
  - when: "value == 'not_maintained'"
    body: >
      The Company has not maintained proper records showing full particulars,
      including quantitative details and situation of Property, plant and
      equipment. The particulars are as follows:
    severity: exception
    requires_narrative: true
  # AUTHORED — not from the precedent
  - when: "value == 'none'"
    body: >
      The Company does not have any Property, plant and equipment.
      Accordingly, clause 3(i)(a)(A) of the Order is not applicable.
