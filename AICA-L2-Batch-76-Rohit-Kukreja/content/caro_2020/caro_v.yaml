# AUTHORED from the firm's own CARO annexure.
#
# Bodies marked "firm wording" are adapted from the supplied precedent.
# Bodies marked "AUTHORED" are mine: the precedent shows only the clean case,
# so the exception wording had to be written and has not been checked against
# anything. Those are what Gate A should read first.
#
# needs_review stays true until a partner has read every variant.

id: caro.v
document: caro_2020
order: 160
number: "(v)"
title: "Deposits and Amounts Deemed to be Deposits"
clause_ref: "CARO 2020, para 3(v)"
effective_from: "2021-04-01"
effective_to: null

needs_review: false

applicability:
  requires: [caro]

input:
  key: caro.v
  label: "Deposits and Amounts Deemed to be Deposits"
  datatype: select
  carry_forward: prompt
  mandatory: true
  options:
    - { value: "none", label: "No deposits accepted" }
    - { value: "complied", label: "Deposits accepted — directives and provisions complied with" }
    - { value: "not_complied", label: "Deposits accepted — not complied" }

variants:
  # firm wording
  - when: "value == 'none'"
    body: >
      The Company has not accepted any deposits or amounts which are deemed to
      be deposits from the public as per the provisions of sections 73 to 76
      or any other relevant provisions of the Companies Act and the rules made
      thereunder. Accordingly, clause 3(v) of the Order is not applicable.
  # AUTHORED — not from the precedent
  - when: "value == 'complied'"
    body: >
      The Company has accepted deposits or amounts which are deemed to be
      deposits from the public. In our opinion, the directives issued by the
      Reserve Bank of India and the provisions of sections 73 to 76 or any
      other relevant provisions of the Companies Act and the rules made
      thereunder have been complied with.
  # AUTHORED — not from the precedent
  - when: "value == 'not_complied'"
    body: >
      The Company has accepted deposits or amounts which are deemed to be
      deposits from the public. The directives issued by the Reserve Bank of
      India or the provisions of sections 73 to 76 or other relevant
      provisions of the Companies Act and the rules made thereunder have not
      been complied with in the following respects, and the details of any
      order passed by the Company Law Board, National Company Law Tribunal,
      Reserve Bank of India, any court or any other tribunal, and whether it
      has been complied with, are as follows:
    severity: exception
    requires_narrative: true
