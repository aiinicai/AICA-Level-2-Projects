# AUTHORED from the firm's own CARO annexure.
#
# Bodies marked "firm wording" are adapted from the supplied precedent.
# Bodies marked "AUTHORED" are mine: the precedent shows only the clean case,
# so the exception wording had to be written and has not been checked against
# anything. Those are what Gate A should read first.
#
# needs_review stays true until a partner has read every variant.

id: caro.ii.a
document: caro_2020
order: 70
number: "(ii)(a)"
title: "Physical Verification of Inventory"
clause_ref: "CARO 2020, para 3(ii)(a)"
effective_from: "2021-04-01"
effective_to: null

needs_review: false

applicability:
  requires: [caro]

input:
  key: caro.ii.a
  label: "Physical Verification of Inventory"
  datatype: select
  carry_forward: prompt
  mandatory: true
  options:
    - { value: "verified", label: "Verified — no discrepancy of 10% or more" }
    - { value: "discrepancy", label: "Discrepancies of 10% or more — dealt with in the books" }
    - { value: "not_verified", label: "Inventory not physically verified" }
    - { value: "none", label: "No inventory held" }

variants:
  # firm wording
  - when: "value == 'verified'"
    body: >
      The inventory has been physically verified by the management during the
      year. In our opinion, the frequency of such verification is reasonable
      and procedures and coverage as followed by management were appropriate.
      No discrepancies were noticed on verification between the physical
      stocks and the book records that were 10% or more in the aggregate for
      each class of inventory.
  # AUTHORED — not from the precedent
  - when: "value == 'discrepancy'"
    body: >
      The inventory has been physically verified by the management during the
      year. In our opinion, the frequency of such verification is reasonable
      and procedures and coverage as followed by management were appropriate.
      Discrepancies of 10% or more in the aggregate for each class of
      inventory were noticed on verification between the physical stocks and
      the book records, and have been properly dealt with in the books of
      account. The particulars are as follows:
    severity: exception
    requires_narrative: true
  # AUTHORED — not from the precedent
  - when: "value == 'not_verified'"
    body: >
      The inventory has not been physically verified by the management during
      the year.
    severity: exception
    requires_narrative: true
  # AUTHORED — not from the precedent
  - when: "value == 'none'"
    body: >
      The Company does not hold any inventory. Accordingly, clause 3(ii)(a) of
      the Order is not applicable.
