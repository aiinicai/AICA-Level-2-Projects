# AUTHORED from the firm's own CARO annexure.
#
# Bodies marked "firm wording" are adapted from the supplied precedent.
# Bodies marked "AUTHORED" are mine: the precedent shows only the clean case,
# so the exception wording had to be written and has not been checked against
# anything. Those are what Gate A should read first.
#
# needs_review stays true until a partner has read every variant.

id: caro.ix.d
document: caro_2020
order: 240
number: "(ix)(d)"
title: "Short-term Funds Used for Long-term Purposes"
clause_ref: "CARO 2020, para 3(ix)(d)"
effective_from: "2021-04-01"
effective_to: null

needs_review: false

applicability:
  requires: [caro]

input:
  key: caro.ix.d
  label: "Short-term Funds Used for Long-term Purposes"
  datatype: select
  carry_forward: prompt
  mandatory: true
  options:
    - { value: "none", label: "No funds raised on a short-term basis" }
    - { value: "not_diverted", label: "Short-term funds raised — not used for long-term purposes" }
    - { value: "diverted", label: "Short-term funds used for long-term purposes" }

variants:
  # firm wording
  - when: "value == 'none'"
    body: >
      According to the information and explanations given to us and on an
      overall examination of the balance sheet of the Company, we report that
      no funds have been raised on short term basis by the Company.
      Accordingly, clause 3(ix)(d) of the Order is not applicable.
  # AUTHORED — not from the precedent
  - when: "value == 'not_diverted'"
    body: >
      According to the information and explanations given to us and on an
      overall examination of the balance sheet of the Company, we report that
      no funds raised on short term basis have been used for long term
      purposes by the Company.
  # AUTHORED — not from the precedent
  - when: "value == 'diverted'"
    body: >
      According to the information and explanations given to us and on an
      overall examination of the balance sheet of the Company, we report that
      funds raised on short term basis have been used for long term purposes
      by the Company. The nature and amount are as follows:
    severity: exception
    requires_narrative: true
