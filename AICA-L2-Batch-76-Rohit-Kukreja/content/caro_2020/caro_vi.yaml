# AUTHORED from the firm's own CARO annexure.
#
# Bodies marked "firm wording" are adapted from the supplied precedent.
# Bodies marked "AUTHORED" are mine: the precedent shows only the clean case,
# so the exception wording had to be written and has not been checked against
# anything. Those are what Gate A should read first.
#
# needs_review stays true until a partner has read every variant.

id: caro.vi
document: caro_2020
order: 170
number: "(vi)"
title: "Maintenance of Cost Records under Section 148(1)"
clause_ref: "CARO 2020, para 3(vi)"
effective_from: "2021-04-01"
effective_to: null

needs_review: false

applicability:
  requires: [caro]

input:
  key: caro.vi
  label: "Maintenance of Cost Records under Section 148(1)"
  datatype: select
  carry_forward: prompt
  mandatory: true
  options:
    - { value: "na", label: "Cost records not prescribed" }
    - { value: "maintained", label: "Cost records prescribed and maintained" }
    - { value: "not_maintained", label: "Cost records prescribed but not maintained" }

variants:
  # firm wording
  - when: "value == 'na'"
    body: >
      According to the information and explanations given to us, the Central
      Government has not prescribed the maintenance of cost records under
      Section 148(1) of the Companies Act, 2013 for the products manufactured
      by it and/or services provided by it. Accordingly, clause 3(vi) of the
      Order is not applicable.
  # firm wording
  - when: "value == 'maintained'"
    body: >
      According to the information and explanations given to us, the Company
      is maintaining Cost accounts and Records as specified by the Central
      Government under sub-section (1) of Section 148 of the Companies Act,
      2013 for the products manufactured by it and/or services provided by it.
  # AUTHORED — not from the precedent
  - when: "value == 'not_maintained'"
    body: >
      According to the information and explanations given to us, the
      maintenance of cost accounts and records has been specified by the
      Central Government under sub-section (1) of Section 148 of the Companies
      Act, 2013. We have broadly reviewed the books of account maintained by
      the Company and are of the opinion that the prescribed accounts and
      records have not been made and maintained.
    severity: exception
    requires_narrative: true
