# AUTHORED from the firm's own CARO annexure.
#
# Bodies marked "firm wording" are adapted from the supplied precedent.
# Bodies marked "AUTHORED" are mine: the precedent shows only the clean case,
# so the exception wording had to be written and has not been checked against
# anything. Those are what Gate A should read first.
#
# needs_review stays true until a partner has read every variant.

id: caro.xvi.a
document: caro_2020
order: 390
number: "(xvi)(a)"
title: "Registration under Section 45-IA of the Reserve Bank of India Act, 1934"
clause_ref: "CARO 2020, para 3(xvi)(a)"
effective_from: "2021-04-01"
effective_to: null

needs_review: false

applicability:
  requires: [caro]

input:
  key: caro.xvi.a
  label: "Registration under Section 45-IA of the Reserve Bank of India Act, 1934"
  datatype: select
  carry_forward: prompt
  mandatory: true
  options:
    - { value: "na", label: "Registration not required" }
    - { value: "obtained", label: "Registration required and obtained" }
    - { value: "not_obtained", label: "Registration required but not obtained" }

variants:
  # firm wording
  - when: "value == 'na'"
    body: >
      The Company is not required to be registered under Section 45-IA of the
      Reserve Bank of India Act, 1934. Accordingly, clause 3(xvi)(a) of the
      Order is not applicable.
  # AUTHORED — not from the precedent
  - when: "value == 'obtained'"
    body: >
      The Company is required to be registered under Section 45-IA of the
      Reserve Bank of India Act, 1934 and has obtained the Certificate of
      Registration.
  # AUTHORED — not from the precedent
  - when: "value == 'not_obtained'"
    body: >
      The Company is required to be registered under Section 45-IA of the
      Reserve Bank of India Act, 1934 but has not obtained the Certificate of
      Registration.
    severity: exception
    requires_narrative: true
