# AUTHORED from the firm's own CARO annexure.
#
# Bodies marked "firm wording" are adapted from the supplied precedent.
# Bodies marked "AUTHORED" are mine: the precedent shows only the clean case,
# so the exception wording had to be written and has not been checked against
# anything. Those are what Gate A should read first.
#
# needs_review stays true until a partner has read every variant.

id: caro.i.c
document: caro_2020
order: 40
number: "(i)(c)"
title: "Title Deeds of Immovable Properties"
clause_ref: "CARO 2020, para 3(i)(c)"
effective_from: "2021-04-01"
effective_to: null

needs_review: false

applicability:
  requires: [caro]

input:
  key: caro.i.c
  label: "Title Deeds of Immovable Properties"
  datatype: select
  carry_forward: prompt
  mandatory: true
  options:
    - { value: "held", label: "Title deeds held in the name of the Company" }
    - { value: "not_held", label: "Title deeds not held in the name of the Company" }
    - { value: "none", label: "No immovable property" }

variants:
  # firm wording
  - when: "value == 'held'"
    body: >
      According to the information and explanations given to us and on the
      basis of our examination of the records of the Company, the title deeds
      of immovable properties (other than immovable properties where the
      Company is the lessee and the lease agreements are duly executed in
      favour of the lessee) disclosed in the financial statements are held in
      the name of the Company.
  # AUTHORED — not from the precedent
  - when: "value == 'not_held'"
    body: >
      According to the information and explanations given to us and on the
      basis of our examination of the records of the Company, the title deeds
      of the following immovable properties (other than immovable properties
      where the Company is the lessee and the lease agreements are duly
      executed in favour of the lessee) disclosed in the financial statements
      are not held in the name of the Company:
    severity: exception
    requires_narrative: true
  # AUTHORED — not from the precedent
  - when: "value == 'none'"
    body: >
      The Company does not hold any immovable property. Accordingly, clause
      3(i)(c) of the Order is not applicable.
