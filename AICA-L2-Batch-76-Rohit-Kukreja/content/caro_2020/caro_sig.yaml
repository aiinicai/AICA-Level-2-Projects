# AUTHORED on the firm's team's observation of 21 August 2026 (decision 72).
#
# CARO 2020 is an annexure to the auditor's report, and paragraph 1 of the
# Order requires the matters specified in it to be included in the auditor's
# report. It is part of that report and carries the same signature: the same
# firm, the same partner, the same place and date.
#
# It had none. The IFC annexure (Annexure B) has carried a signature block
# since the first build; this one was simply never written, so CARO printed
# ending on clause 3(xxi) with nothing beneath it. Nobody noticed because the
# document renders, validates and exports perfectly well without it.
#
# UDIN. Like Annexure B, this carries its own -- ICAI requires a separate UDIN
# for each certificate or report signed, and the same field is used, so an
# engagement's annexures cannot end up quoting the main report's number.
#
# Every value comes from Admin -> Firm & Partners and the engagement, so
# nothing about any firm is fixed here.

id: caro.sig
document: caro_2020
order: 490
number: ""
title: "Signature Block"
clause_ref: "CARO 2020, paragraph 1; SA 700 paras 45-49; s.145"
effective_from: "2021-04-01"
effective_to: null
render_as: signature

applicability:
  requires: [caro]

needs_review: false

variants:
  - body: >
      For {{ firm_name }}

      Chartered Accountants

      Firm's Registration No: {{ firm_frn }}

      {{ partner_name }}

      Partner

      Membership No: {{ partner_mno }}

      UDIN: {{ udin }}

      Place: {{ place }}

      Date: {{ report_date_long }}
