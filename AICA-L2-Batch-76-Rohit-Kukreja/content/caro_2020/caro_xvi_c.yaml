# AUTHORED from the firm's own CARO annexure.
#
# Bodies marked "firm wording" are adapted from the supplied precedent.
# Bodies marked "AUTHORED" are mine: the precedent shows only the clean case,
# so the exception wording had to be written and has not been checked against
# anything. Those are what Gate A should read first.
#
# needs_review stays true until a partner has read every variant.

id: caro.xvi.c
document: caro_2020
order: 410
number: "(xvi)(c)"
title: "Core Investment Company Criteria"
clause_ref: "CARO 2020, para 3(xvi)(c)"
effective_from: "2021-04-01"
effective_to: null

needs_review: false

applicability:
  requires: [caro]

input:
  key: caro.xvi.c
  label: "Core Investment Company Criteria"
  datatype: select
  carry_forward: prompt
  mandatory: true
  options:
    - { value: "na", label: "Not a Core Investment Company" }
    - { value: "fulfils", label: "Is a CIC and fulfils the criteria" }
    - { value: "not_fulfils", label: "Is a CIC and does not fulfil the criteria" }

variants:
  # firm wording
  - when: "value == 'na'"
    body: >
      The Company is not a Core Investment Company (CIC) as defined in the
      regulations made by the Reserve Bank of India. Accordingly, clause
      3(xvi)(c) of the Order is not applicable.
  # AUTHORED — not from the precedent
  - when: "value == 'fulfils'"
    body: >
      The Company is a Core Investment Company (CIC) as defined in the
      regulations made by the Reserve Bank of India and fulfils the criteria
      of a CIC.
  # AUTHORED — not from the precedent
  - when: "value == 'not_fulfils'"
    body: >
      The Company is a Core Investment Company (CIC) as defined in the
      regulations made by the Reserve Bank of India but does not fulfil the
      criteria of a CIC.
    severity: exception
    requires_narrative: true
