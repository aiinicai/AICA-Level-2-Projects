# AUTHORED from the firm's own CARO annexure.
#
# Bodies marked "firm wording" are adapted from the supplied precedent.
# Bodies marked "AUTHORED" are mine: the precedent shows only the clean case,
# so the exception wording had to be written and has not been checked against
# anything. Those are what Gate A should read first.
#
# needs_review stays true until a partner has read every variant.

id: caro.ix.c
document: caro_2020
order: 230
number: "(ix)(c)"
title: "Term Loans Applied for the Purpose Obtained"
clause_ref: "CARO 2020, para 3(ix)(c)"
effective_from: "2021-04-01"
effective_to: null

needs_review: false

applicability:
  requires: [caro]

input:
  key: caro.ix.c
  label: "Term Loans Applied for the Purpose Obtained"
  datatype: select
  carry_forward: prompt
  mandatory: true
  options:
    - { value: "none", label: "No term loans obtained" }
    - { value: "applied", label: "Term loans applied for the purpose obtained" }
    - { value: "diverted", label: "Term loans not applied for the purpose obtained" }

variants:
  # firm wording
  - when: "value == 'none'"
    body: >
      According to the information and explanations given to us by the
      management, the Company has not obtained any term loans. Accordingly,
      clause 3(ix)(c) of the Order is not applicable.
  # AUTHORED — not from the precedent
  - when: "value == 'applied'"
    body: >
      According to the information and explanations given to us by the
      management, the term loans were applied for the purpose for which the
      loans were obtained.
  # AUTHORED — not from the precedent
  - when: "value == 'diverted'"
    body: >
      According to the information and explanations given to us by the
      management, the term loans were not applied for the purpose for which
      the loans were obtained. The amount so diverted and the purpose for
      which it was used are as follows:
    severity: exception
    requires_narrative: true
