# AUTHORED from the firm's own CARO annexure.
#
# Bodies marked "firm wording" are adapted from the supplied precedent.
# Bodies marked "AUTHORED" are mine: the precedent shows only the clean case,
# so the exception wording had to be written and has not been checked against
# anything. Those are what Gate A should read first.
#
# needs_review stays true until a partner has read every variant.

id: caro.ii.b
document: caro_2020
order: 80
number: "(ii)(b)"
title: "Working Capital Limits against Security of Current Assets"
clause_ref: "CARO 2020, para 3(ii)(b)"
effective_from: "2021-04-01"
effective_to: null

needs_review: false

applicability:
  requires: [caro]

input:
  key: caro.ii.b
  label: "Working Capital Limits against Security of Current Assets"
  datatype: select
  carry_forward: prompt
  mandatory: true
  options:
    - { value: "none", label: "No working capital limits sanctioned in excess of five crore rupees" }
    - { value: "agree", label: "Quarterly returns agree with the books of account" }
    - { value: "differ", label: "Quarterly returns do not agree with the books of account" }

variants:
  # AUTHORED — not from the precedent
  - when: "value == 'none'"
    body: >
      According to the information and explanations given to us and on the
      basis of our examination of the records of the Company, the Company has
      not been sanctioned working capital limits in excess of five crore
      rupees, in aggregate, from banks or financial institutions on the basis
      of security of current assets. Accordingly, clause 3(ii)(b) of the Order
      is not applicable.
  # firm wording
  - when: "value == 'agree'"
    body: >
      According to the information and explanations given to us and on the
      basis of our examination of the records of the Company, the Company has
      been sanctioned working capital limits in excess of five crore rupees,
      in aggregate, from banks on the basis of security of current assets. In
      our opinion, the quarterly returns or statements filed by the Company
      with such banks are in agreement with the books of account of the
      Company.
  # AUTHORED — not from the precedent
  - when: "value == 'differ'"
    body: >
      According to the information and explanations given to us and on the
      basis of our examination of the records of the Company, the Company has
      been sanctioned working capital limits in excess of five crore rupees,
      in aggregate, from banks on the basis of security of current assets. The
      quarterly returns or statements filed by the Company with such banks are
      not in agreement with the books of account of the Company. The
      particulars are as follows:
    severity: exception
    requires_narrative: true
