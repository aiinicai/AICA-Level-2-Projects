# AUTHORED from the firm's own CARO annexure.
#
# Bodies marked "firm wording" are adapted from the supplied precedent.
# Bodies marked "AUTHORED" are mine: the precedent shows only the clean case,
# so the exception wording had to be written and has not been checked against
# anything. Those are what Gate A should read first.
#
# needs_review stays true until a partner has read every variant.

id: caro.ix.f
document: caro_2020
order: 260
number: "(ix)(f)"
title: "Loans Raised on Pledge of Securities of Subsidiaries, Joint Ventures or Associates"
clause_ref: "CARO 2020, para 3(ix)(f)"
effective_from: "2021-04-01"
effective_to: null

needs_review: false

applicability:
  requires: [caro]

input:
  key: caro.ix.f
  label: "Loans Raised on Pledge of Securities of Subsidiaries, Joint Ventures or Associates"
  datatype: select
  carry_forward: prompt
  mandatory: true
  options:
    - { value: "none", label: "No such loans raised" }
    - { value: "raised", label: "Loans raised on such pledge — particulars" }

variants:
  # firm wording
  - when: "value == 'none'"
    body: >
      According to the information and explanations given to us and procedures
      performed by us, we report that the Company has not raised loans during
      the year on the pledge of securities held in its subsidiaries, joint
      ventures or associate companies as defined under the Companies Act,
      2013. Accordingly, clause 3(ix)(f) of the Order is not applicable.
  # AUTHORED — not from the precedent
  - when: "value == 'raised'"
    body: >
      According to the information and explanations given to us and procedures
      performed by us, we report that the Company has raised loans during the
      year on the pledge of securities held in its subsidiaries, joint
      ventures or associate companies as defined under the Companies Act,
      2013. The particulars, and details of any default in repayment of such
      loans, are as follows:
    severity: exception
    requires_narrative: true
