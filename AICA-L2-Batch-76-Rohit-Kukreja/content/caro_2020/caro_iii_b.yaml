# AUTHORED from the firm's own CARO annexure.
#
# Bodies marked "firm wording" are adapted from the supplied precedent.
# Bodies marked "AUTHORED" are mine: the precedent shows only the clean case,
# so the exception wording had to be written and has not been checked against
# anything. Those are what Gate A should read first.
#
# needs_review stays true until a partner has read every variant.

id: caro.iii.b
document: caro_2020
order: 100
number: "(iii)(b)"
title: "Terms and Conditions Not Prejudicial to the Company's Interest"
clause_ref: "CARO 2020, para 3(iii)(b)"
effective_from: "2021-04-01"
effective_to: null

needs_review: false

applicability:
  requires: [caro]

input:
  key: caro.iii.b
  label: "Terms and Conditions Not Prejudicial to the Company's Interest"
  datatype: select
  carry_forward: prompt
  mandatory: true
  options:
    - { value: "not_prejudicial", label: "Not prejudicial to the Company's interest" }
    - { value: "prejudicial", label: "Prejudicial to the Company's interest" }
    - { value: "na", label: "Not applicable" }

  # Follows the transactions, not the preparer (decision 78). Paragraph 3(iii)
  # opens "... IF SO, --", so every limb below it is conditional on there being
  # something to report. Before this the clause defaulted to its positive
  # wording, and a company that had granted nothing still issued an annexure
  # asserting things about loans it had never made.
  #
  # An UNANSWERED (a)(A)/(a)(B) does not reach this: `caro_no_loans_granted` is
  # false until both are answered "none", so the nil case is a determination
  # somebody made, not a question nobody reached.
  defaults:
    - { when: "caro_nothing_under_iii", value: "na" }

variants:
  # firm wording
  - when: "value == 'not_prejudicial'"
    body: >
      According to the information and explanations given to us and based on
      the audit procedures conducted by us, we are of the opinion that
      investments made, guarantees provided, security given and the terms and
      conditions of the grant of all loans and advances in the nature of loans
      and guarantees provided are, prima facie, not prejudicial to the
      interest of the Company.
  # AUTHORED — not from the precedent
  - when: "value == 'prejudicial'"
    body: >
      According to the information and explanations given to us and based on
      the audit procedures conducted by us, we are of the opinion that the
      terms and conditions of the following are, prima facie, prejudicial to
      the interest of the Company:
    severity: exception
    requires_narrative: true
  # AUTHORED — not from the precedent
  - when: "value == 'na'"
    body: >
      The Company has not made any investments, provided any guarantee or
      security or granted any loans or advances in the nature of loans during
      the year. Accordingly, clause 3(iii)(b) of the Order is not applicable.
