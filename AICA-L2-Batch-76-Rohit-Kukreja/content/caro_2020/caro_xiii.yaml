# AUTHORED from the firm's own CARO annexure.
#
# Bodies marked "firm wording" are adapted from the supplied precedent.
# Bodies marked "AUTHORED" are mine: the precedent shows only the clean case,
# so the exception wording had to be written and has not been checked against
# anything. Those are what Gate A should read first.
#
# needs_review stays true until a partner has read every variant.

id: caro.xiii
document: caro_2020
order: 350
number: "(xiii)"
title: "Related Party Transactions — Sections 177 and 188"
clause_ref: "CARO 2020, para 3(xiii)"
effective_from: "2021-04-01"
effective_to: null

needs_review: false

applicability:
  requires: [caro]

input:
  key: caro.xiii
  label: "Related Party Transactions — Sections 177 and 188"
  datatype: select
  carry_forward: prompt
  mandatory: true
  options:
    - { value: "complied", label: "Complied and disclosed" }
    - { value: "none", label: "No related party transactions" }
    - { value: "not_complied", label: "Not complied — particulars" }

variants:
  # firm wording
  - when: "value == 'complied'"
    body: >
      In our opinion and according to the information and explanations given
      to us, the transactions with related parties are in compliance with
      Sections 177 and 188 of the Companies Act, 2013, where applicable, and
      the details of the related party transactions have been disclosed in the
      financial statements as required by the applicable accounting standards.
  # AUTHORED — not from the precedent
  - when: "value == 'none'"
    body: >
      In our opinion and according to the information and explanations given
      to us, the Company has not entered into any transactions with related
      parties during the year. Accordingly, clause 3(xiii) of the Order is not
      applicable.
  # AUTHORED — not from the precedent
  - when: "value == 'not_complied'"
    body: >
      In our opinion and according to the information and explanations given
      to us, the following transactions with related parties are not in
      compliance with Sections 177 and 188 of the Companies Act, 2013, or have
      not been disclosed in the financial statements as required by the
      applicable accounting standards:
    severity: exception
    requires_narrative: true
