# AUTHORED from the firm's own CARO annexure.
#
# Bodies marked "firm wording" are adapted from the supplied precedent.
# Bodies marked "AUTHORED" are mine: the precedent shows only the clean case,
# so the exception wording had to be written and has not been checked against
# anything. Those are what Gate A should read first.
#
# needs_review stays true until a partner has read every variant.

id: caro.iv
document: caro_2020
order: 150
number: "(iv)"
title: "Compliance with Sections 185 and 186"
clause_ref: "CARO 2020, para 3(iv)"
effective_from: "2021-04-01"
effective_to: null

needs_review: false

applicability:
  requires: [caro]

input:
  key: caro.iv
  label: "Compliance with Sections 185 and 186"
  datatype: select
  carry_forward: prompt
  mandatory: true
  options:
    - { value: "complied", label: "Complied with sections 185 and 186" }
    - { value: "na", label: "No such loans, investments, guarantees or security" }
    - { value: "not_complied", label: "Not complied — particulars" }

variants:
  # firm wording
  - when: "value == 'complied'"
    body: >
      According to the information and explanations given to us and on the
      basis of our examination of the records, the Company has complied with
      the provisions of Section 185 and 186 of the Companies Act, 2013 in
      relation to loans given, investments made, and guarantees and security
      provided.
  # firm wording
  - when: "value == 'na'"
    body: >
      According to the information and explanations given to us and on the
      basis of our examination of the records, the Company has not given any
      loans, made any investments or provided any guarantee or security as
      specified under Section 185 and Section 186 of the Companies Act, 2013.
      Accordingly, clause 3(iv) of the Order is not applicable.
  # AUTHORED — not from the precedent
  - when: "value == 'not_complied'"
    body: >
      According to the information and explanations given to us and on the
      basis of our examination of the records, the Company has not complied
      with the provisions of Section 185 or Section 186 of the Companies Act,
      2013 in the following respects:
    severity: exception
    requires_narrative: true
