# AUTHORED from the firm's own CARO annexure.
#
# Bodies marked "firm wording" are adapted from the supplied precedent.
# Bodies marked "AUTHORED" are mine: the precedent shows only the clean case,
# so the exception wording had to be written and has not been checked against
# anything. Those are what Gate A should read first.
#
# needs_review stays true until a partner has read every variant.

id: caro.xix
document: caro_2020
order: 450
number: "(xix)"
title: "Material Uncertainty on Meeting Liabilities within One Year"
clause_ref: "CARO 2020, para 3(xix)"
effective_from: "2021-04-01"
effective_to: null

needs_review: false

applicability:
  requires: [caro]

input:
  key: caro.xix
  label: "Material Uncertainty on Meeting Liabilities within One Year"
  datatype: select
  carry_forward: prompt
  mandatory: true
  options:
    - { value: "none", label: "No material uncertainty exists" }
    - { value: "exists", label: "Material uncertainty exists — particulars" }

variants:
  # firm wording
  - when: "value == 'none'"
    body: >
      According to the information and explanations given to us and on the
      basis of the financial ratios, ageing and expected dates of realisation
      of financial assets and payment of financial liabilities, other
      information accompanying the financial statements, our knowledge of the
      Board of Directors and management plans and based on our examination of
      the evidence supporting the assumptions, nothing has come to our
      attention, which causes us to believe that any material uncertainty
      exists as on the date of the audit report that the Company is not
      capable of meeting its liabilities existing at the date of balance sheet
      as and when they fall due within a period of one year from the balance
      sheet date. We, however, state that this is not an assurance as to the
      future viability of the Company. We further state that our reporting is
      based on the facts up to the date of the audit report and we neither
      give any guarantee nor any assurance that all liabilities falling due
      within a period of one year from the balance sheet date, will get
      discharged by the Company as and when they fall due.
  # AUTHORED — not from the precedent
  - when: "value == 'exists'"
    body: >
      According to the information and explanations given to us and on the
      basis of the financial ratios, ageing and expected dates of realisation
      of financial assets and payment of financial liabilities, other
      information accompanying the financial statements, our knowledge of the
      Board of Directors and management plans and based on our examination of
      the evidence supporting the assumptions, we are of the opinion that a
      material uncertainty exists as on the date of the audit report that the
      Company is not capable of meeting its liabilities existing at the date
      of balance sheet as and when they fall due within a period of one year
      from the balance sheet date. The particulars are as follows:
    severity: exception
    requires_narrative: true
