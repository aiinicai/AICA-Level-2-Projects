# AUTHORED from the firm's own CARO annexure.
#
# Bodies marked "firm wording" are adapted from the supplied precedent.
# Bodies marked "AUTHORED" are mine: the precedent shows only the clean case,
# so the exception wording had to be written and has not been checked against
# anything. Those are what Gate A should read first.
#
# needs_review stays true until a partner has read every variant.

id: caro.xiv.a
document: caro_2020
order: 360
number: "(xiv)(a)"
title: "Internal Audit System Commensurate with Size and Nature of Business"
clause_ref: "CARO 2020, para 3(xiv)(a)"
effective_from: "2021-04-01"
effective_to: null

needs_review: false

applicability:
  requires: [caro]

input:
  key: caro.xiv.a
  label: "Internal Audit System Commensurate with Size and Nature of Business"
  datatype: select
  carry_forward: prompt
  mandatory: true
  options:
    - { value: "commensurate", label: "System commensurate with size and nature of business" }
    - { value: "not_commensurate", label: "System not commensurate" }
    - { value: "na", label: "Internal audit not applicable" }

variants:
  # firm wording
  - when: "value == 'commensurate'"
    body: >
      Based on information and explanations provided to us and our audit
      procedures, in our opinion, the Company has an internal audit system
      commensurate with the size and nature of its business.
  # AUTHORED — not from the precedent
  - when: "value == 'not_commensurate'"
    body: >
      Based on information and explanations provided to us and our audit
      procedures, in our opinion, the Company does not have an internal audit
      system commensurate with the size and nature of its business.
    severity: exception
    requires_narrative: true
  # AUTHORED — not from the precedent
  - when: "value == 'na'"
    body: >
      The Company is not required to have an internal audit system under
      Section 138 of the Companies Act, 2013. Accordingly, clause 3(xiv)(a) of
      the Order is not applicable.
