# AUTHORED from the firm's own CARO annexure.
#
# Bodies marked "firm wording" are adapted from the supplied precedent.
# Bodies marked "AUTHORED" are mine: the precedent shows only the clean case,
# so the exception wording had to be written and has not been checked against
# anything. Those are what Gate A should read first.
#
# needs_review stays true until a partner has read every variant.

id: caro.xvi.d
document: caro_2020
order: 420
number: "(xvi)(d)"
title: "Number of Core Investment Companies in the Group"
clause_ref: "CARO 2020, para 3(xvi)(d)"
effective_from: "2021-04-01"
effective_to: null

needs_review: false

applicability:
  requires: [caro]

input:
  key: caro.xvi.d
  label: "Number of Core Investment Companies in the Group"
  datatype: select
  carry_forward: prompt
  mandatory: true
  options:
    - { value: "none", label: "The Group has no Core Investment Company" }
    - { value: "has_cic", label: "The Group has one or more Core Investment Companies" }

variants:
  # firm wording
  - when: "value == 'none'"
    body: >
      According to the information and explanations provided to us during the
      course of audit, the Group does not have any CIC. Accordingly, the
      requirements of clause 3(xvi)(d) are not applicable.
  # AUTHORED — not from the precedent
  - when: "value == 'has_cic'"
    body: >
      According to the information and explanations provided to us during the
      course of audit, the Group has Core Investment Companies. The number of
      CICs forming part of the Group is as follows:
    requires_narrative: true
