# AUTHORED from the firm's own CARO annexure.
#
# Bodies marked "firm wording" are adapted from the supplied precedent.
# Bodies marked "AUTHORED" are mine: the precedent shows only the clean case,
# so the exception wording had to be written and has not been checked against
# anything. Those are what Gate A should read first.
#
# needs_review stays true until a partner has read every variant.

id: caro.xiv.b
document: caro_2020
order: 370
number: "(xiv)(b)"
title: "Internal Audit Reports Considered by the Statutory Auditor"
clause_ref: "CARO 2020, para 3(xiv)(b)"
effective_from: "2021-04-01"
effective_to: null

needs_review: false

applicability:
  requires: [caro]

input:
  key: caro.xiv.b
  label: "Internal Audit Reports Considered by the Statutory Auditor"
  datatype: select
  carry_forward: prompt
  mandatory: true
  options:
    - { value: "considered", label: "Internal audit reports considered" }
    - { value: "not_available", label: "Internal audit reports not made available" }
    - { value: "na", label: "Internal audit not applicable" }

variants:
  # firm wording
  - when: "value == 'considered'"
    body: >
      We have considered the internal audit reports of the Company issued till
      date for the period under audit.
  # AUTHORED — not from the precedent
  - when: "value == 'not_available'"
    body: >
      The internal audit reports of the Company for the period under audit
      were not made available to us.
    severity: exception
    requires_narrative: true
  # AUTHORED — not from the precedent
  - when: "value == 'na'"
    body: >
      The Company is not required to have an internal audit system under
      Section 138 of the Companies Act, 2013. Accordingly, clause 3(xiv)(b) of
      the Order is not applicable.
