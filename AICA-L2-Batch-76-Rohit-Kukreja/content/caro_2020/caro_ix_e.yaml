# AUTHORED from the firm's own CARO annexure.
#
# Bodies marked "firm wording" are adapted from the supplied precedent.
# Bodies marked "AUTHORED" are mine: the precedent shows only the clean case,
# so the exception wording had to be written and has not been checked against
# anything. Those are what Gate A should read first.
#
# needs_review stays true until a partner has read every variant.

id: caro.ix.e
document: caro_2020
order: 250
number: "(ix)(e)"
title: "Funds Taken to Meet Obligations of Subsidiaries, Associates or Joint Ventures"
clause_ref: "CARO 2020, para 3(ix)(e)"
effective_from: "2021-04-01"
effective_to: null

needs_review: false

applicability:
  requires: [caro]

input:
  key: caro.ix.e
  label: "Funds Taken to Meet Obligations of Subsidiaries, Associates or Joint Ventures"
  datatype: select
  carry_forward: prompt
  mandatory: true
  options:
    - { value: "none", label: "No such funds taken" }
    - { value: "taken", label: "Funds taken — particulars" }

variants:
  # firm wording
  - when: "value == 'none'"
    body: >
      According to the information and explanations given to us and on an
      overall examination of the financial statements of the Company, we
      report that the Company has not taken any funds from any entity or
      person on account of or to meet the obligations of its subsidiaries,
      associates or joint ventures as defined under the Companies Act, 2013.
      Accordingly, clause 3(ix)(e) of the Order is not applicable.
  # AUTHORED — not from the precedent
  - when: "value == 'taken'"
    body: >
      According to the information and explanations given to us and on an
      overall examination of the financial statements of the Company, we
      report that the Company has taken funds from an entity or person on
      account of or to meet the obligations of its subsidiaries, associates or
      joint ventures as defined under the Companies Act, 2013. The nature and
      amount are as follows:
    severity: exception
    requires_narrative: true
