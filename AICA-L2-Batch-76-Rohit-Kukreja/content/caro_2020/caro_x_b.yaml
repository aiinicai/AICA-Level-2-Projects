# AUTHORED from the firm's own CARO annexure.
#
# Bodies marked "firm wording" are adapted from the supplied precedent.
# Bodies marked "AUTHORED" are mine: the precedent shows only the clean case,
# so the exception wording had to be written and has not been checked against
# anything. Those are what Gate A should read first.
#
# needs_review stays true until a partner has read every variant.

id: caro.x.b
document: caro_2020
order: 280
number: "(x)(b)"
title: "Preferential Allotment or Private Placement"
clause_ref: "CARO 2020, para 3(x)(b)"
effective_from: "2021-04-01"
effective_to: null

needs_review: false

applicability:
  requires: [caro]

input:
  key: caro.x.b
  label: "Preferential Allotment or Private Placement"
  datatype: select
  carry_forward: prompt
  mandatory: true
  options:
    - { value: "none", label: "No preferential allotment or private placement" }
    - { value: "complied", label: "Made — requirements complied with and funds used for the stated purpose" }
    - { value: "not_complied", label: "Made — requirements not complied with" }

variants:
  # firm wording
  - when: "value == 'none'"
    body: >
      According to the information and explanations given to us and on the
      basis of our examination of the records of the Company, the Company has
      not made any preferential allotment or private placement of shares or
      fully or partly convertible debentures during the year as per
      requirements of the section 42 and section 62 of the Companies Act,
      2013. Accordingly, clause 3(x)(b) of the Order is not applicable.
  # AUTHORED — not from the precedent
  - when: "value == 'complied'"
    body: >
      According to the information and explanations given to us and on the
      basis of our examination of the records of the Company, the Company has
      made a preferential allotment or private placement of shares or fully or
      partly convertible debentures during the year, the requirements of
      section 42 and section 62 of the Companies Act, 2013 have been complied
      with, and the funds raised have been used for the purposes for which
      they were raised.
  # AUTHORED — not from the precedent
  - when: "value == 'not_complied'"
    body: >
      According to the information and explanations given to us and on the
      basis of our examination of the records of the Company, the Company has
      made a preferential allotment or private placement of shares or fully or
      partly convertible debentures during the year in respect of which the
      requirements of section 42 and section 62 of the Companies Act, 2013
      have not been complied with. The particulars are as follows:
    severity: exception
    requires_narrative: true
