# AUTHORED from the firm's own CARO annexure.
#
# Bodies marked "firm wording" are adapted from the supplied precedent.
# Bodies marked "AUTHORED" are mine: the precedent shows only the clean case,
# so the exception wording had to be written and has not been checked against
# anything. Those are what Gate A should read first.
#
# needs_review stays true until a partner has read every variant.

id: caro.xxi
document: caro_2020
order: 480
number: "(xxi)"
title: "Qualifications or Adverse Remarks in the CARO Reports of Companies Included in the Consolidated Financial Statements"
clause_ref: "CARO 2020, para 3(xxi)"
effective_from: "2021-04-01"
effective_to: null

needs_review: false

applicability:
  requires: [caro]

input:
  key: caro.xxi
  label: "Qualifications or Adverse Remarks in the CARO Reports of Companies Included in the Consolidated Financial Statements"
  datatype: select
  carry_forward: prompt
  mandatory: true
  options:
    - { value: "na", label: "Consolidated financial statements not applicable" }
    - { value: "none", label: "No qualifications or adverse remarks" }
    - { value: "exist", label: "Qualifications or adverse remarks — particulars" }

variants:
  # firm wording
  - when: "value == 'na'"
    body: >
      Consolidated financial statements are not applicable to the Company.
      Accordingly, clause 3(xxi) of the Order is not applicable.
  # AUTHORED — not from the precedent
  - when: "value == 'none'"
    body: >
      There have been no qualifications or adverse remarks by the respective
      auditors in the Companies (Auditor's Report) Order reports of the
      companies included in the consolidated financial statements.
  # AUTHORED — not from the precedent
  - when: "value == 'exist'"
    body: >
      The following companies included in the consolidated financial
      statements have qualifications or adverse remarks in their respective
      Companies (Auditor's Report) Order reports:
    severity: exception
    requires_narrative: true
