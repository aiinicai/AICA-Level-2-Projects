# AUTHORED from the firm's own CARO annexure.
#
# Bodies marked "firm wording" are adapted from the supplied precedent.
# Bodies marked "AUTHORED" are mine: the precedent shows only the clean case,
# so the exception wording had to be written and has not been checked against
# anything. Those are what Gate A should read first.
#
# needs_review stays true until a partner has read every variant.

id: caro.ix.b
document: caro_2020
order: 220
number: "(ix)(b)"
title: "Declared Wilful Defaulter"
clause_ref: "CARO 2020, para 3(ix)(b)"
effective_from: "2021-04-01"
effective_to: null

needs_review: false

applicability:
  requires: [caro]

input:
  key: caro.ix.b
  label: "Declared Wilful Defaulter"
  datatype: select
  carry_forward: prompt
  mandatory: true
  options:
    - { value: "none", label: "Not a declared wilful defaulter" }
    - { value: "declared", label: "Declared a wilful defaulter — particulars" }

variants:
  # firm wording
  - when: "value == 'none'"
    body: >
      According to the information and explanations given to us and on the
      basis of our examination of the records of the Company, the Company has
      not been declared a wilful defaulter by any bank or financial
      institution or government or government authority.
  # AUTHORED — not from the precedent
  - when: "value == 'declared'"
    body: >
      According to the information and explanations given to us and on the
      basis of our examination of the records of the Company, the Company has
      been declared a wilful defaulter by a bank or financial institution or
      government or government authority. The particulars are as follows:
    severity: exception
    requires_narrative: true
