# AUTHORED from the firm's own CARO annexure.
#
# Bodies marked "firm wording" are adapted from the supplied precedent.
# Bodies marked "AUTHORED" are mine: the precedent shows only the clean case,
# so the exception wording had to be written and has not been checked against
# anything. Those are what Gate A should read first.
#
# needs_review stays true until a partner has read every variant.

id: caro.xii.b
document: caro_2020
order: 330
number: "(xii)(b)"
title: "Nidhi Company — Unencumbered Term Deposits"
clause_ref: "CARO 2020, para 3(xii)(b)"
effective_from: "2021-04-01"
effective_to: null

needs_review: false

applicability:
  requires: [caro]

input:
  key: caro.xii.b
  label: "Nidhi Company — Unencumbered Term Deposits"
  datatype: select
  carry_forward: prompt
  mandatory: true
  options:
    - { value: "na", label: "Not a Nidhi Company" }
    - { value: "maintained", label: "Ten per cent unencumbered term deposits maintained" }
    - { value: "not_maintained", label: "Not maintained" }

variants:
  # AUTHORED — not from the precedent
  - when: "value == 'na'"
    body: >
      According to the information and explanations given to us, the Company
      is not a Nidhi Company. Accordingly, clause 3(xii)(b) of the Order is
      not applicable.
  # AUTHORED — not from the precedent
  - when: "value == 'maintained'"
    body: >
      According to the information and explanations given to us, the Company
      is a Nidhi Company and is maintaining ten per cent unencumbered term
      deposits as specified in the Nidhi Rules, 2014 to meet out the
      liability.
  # AUTHORED — not from the precedent
  - when: "value == 'not_maintained'"
    body: >
      According to the information and explanations given to us, the Company
      is a Nidhi Company and is not maintaining ten per cent unencumbered term
      deposits as specified in the Nidhi Rules, 2014 to meet out the
      liability.
    severity: exception
    requires_narrative: true
