# AUTHORED from the firm's own CARO annexure.
#
# Bodies marked "firm wording" are adapted from the supplied precedent.
# Bodies marked "AUTHORED" are mine: the precedent shows only the clean case,
# so the exception wording had to be written and has not been checked against
# anything. Those are what Gate A should read first.
#
# needs_review stays true until a partner has read every variant.

id: caro.viii
document: caro_2020
order: 200
number: "(viii)"
title: "Unrecorded Income Surrendered or Disclosed in Tax Assessments"
clause_ref: "CARO 2020, para 3(viii)"
effective_from: "2021-04-01"
effective_to: null

needs_review: false

applicability:
  requires: [caro]

input:
  key: caro.viii
  label: "Unrecorded Income Surrendered or Disclosed in Tax Assessments"
  datatype: select
  carry_forward: prompt
  mandatory: true
  options:
    - { value: "none", label: "No such transactions" }
    - { value: "recorded", label: "Surrendered or disclosed — properly recorded" }
    - { value: "not_recorded", label: "Surrendered or disclosed — not properly recorded" }

variants:
  # firm wording
  - when: "value == 'none'"
    body: >
      According to the information and explanations given to us and on the
      basis of our examination of the records of the Company, the Company has
      not surrendered or disclosed any transactions, previously unrecorded as
      income in the books of account, in the tax assessments under the
      Income-tax Act, 1961 as income during the year.
  # AUTHORED — not from the precedent
  - when: "value == 'recorded'"
    body: >
      According to the information and explanations given to us and on the
      basis of our examination of the records of the Company, the Company has
      surrendered or disclosed transactions, previously unrecorded as income
      in the books of account, in the tax assessments under the Income-tax
      Act, 1961 as income during the year, and such previously unrecorded
      income has been properly recorded in the books of account during the
      year.
    severity: info
    requires_narrative: true
  # AUTHORED — not from the precedent
  - when: "value == 'not_recorded'"
    body: >
      According to the information and explanations given to us and on the
      basis of our examination of the records of the Company, the Company has
      surrendered or disclosed transactions, previously unrecorded as income
      in the books of account, in the tax assessments under the Income-tax
      Act, 1961 as income during the year, and such previously unrecorded
      income has not been properly recorded in the books of account during the
      year. The particulars are as follows:
    severity: exception
    requires_narrative: true
