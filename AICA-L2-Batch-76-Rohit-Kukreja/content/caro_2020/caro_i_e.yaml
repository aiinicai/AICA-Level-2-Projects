# AUTHORED from the firm's own CARO annexure.
#
# Bodies marked "firm wording" are adapted from the supplied precedent.
# Bodies marked "AUTHORED" are mine: the precedent shows only the clean case,
# so the exception wording had to be written and has not been checked against
# anything. Those are what Gate A should read first.
#
# needs_review stays true until a partner has read every variant.

id: caro.i.e
document: caro_2020
order: 60
number: "(i)(e)"
title: "Proceedings under the Benami Transactions (Prohibition) Act, 1988"
clause_ref: "CARO 2020, para 3(i)(e)"
effective_from: "2021-04-01"
effective_to: null

needs_review: false

applicability:
  requires: [caro]

input:
  key: caro.i.e
  label: "Proceedings under the Benami Transactions (Prohibition) Act, 1988"
  datatype: select
  carry_forward: prompt
  mandatory: true
  options:
    - { value: "none", label: "No proceedings initiated or pending" }
    - { value: "pending", label: "Proceedings initiated or pending — particulars" }

variants:
  # firm wording
  - when: "value == 'none'"
    body: >
      According to the information and explanations given to us and on the
      basis of our examination of the records of the Company, there are no
      proceedings initiated or pending against the Company for holding any
      benami property under the Prohibition of Benami Property Transactions
      Act, 1988 and rules made thereunder.
  # AUTHORED — not from the precedent
  - when: "value == 'pending'"
    body: >
      According to the information and explanations given to us and on the
      basis of our examination of the records of the Company, proceedings have
      been initiated or are pending against the Company for holding benami
      property under the Prohibition of Benami Property Transactions Act, 1988
      and rules made thereunder. The particulars, and whether the Company has
      appropriately disclosed the details in its financial statements, are as
      follows:
    severity: exception
    requires_narrative: true
