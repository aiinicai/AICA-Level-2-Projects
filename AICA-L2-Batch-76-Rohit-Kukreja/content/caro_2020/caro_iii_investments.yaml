# AUTHORED on the firm's instruction of 21 August 2026 (decision 78).
#
# A WORKING QUESTION, NOT A DISCLOSURE. Its only variant is `omit: true`, so it
# is asked in the workspace and prints nothing: CARO does not require a
# paragraph saying whether investments exist, only the reporting that follows
# if they do.
#
# WHY IT EXISTS. Paragraph 3(iii) opens "whether during the year the company
# has made investments in, provided any guarantee or security or granted any
# loans or advances in the nature of loans ... IF SO, --". Everything from (a)
# to (f) hangs off that chapeau.
#
# Clauses 3(iii)(a)(A) and (a)(B) already establish the loans, advances,
# guarantees and security. Investments were the one limb of the chapeau nothing
# asked about, and clause 3(iii)(b) reports on "the INVESTMENTS made, guarantees
# provided, security given and the terms and conditions of the grant of all
# loans" -- so without this, (b) could not be defaulted without asserting
# something about investments that nobody had established.

id: caro.iii.investments
document: caro_2020
order: 94
number: ""
title: "Investments Made During the Year"
clause_ref: "CARO 2020, para 3(iii) chapeau"
effective_from: "2021-04-01"
effective_to: null

needs_review: false

applicability:
  requires: [caro]

input:
  key: caro.iii.investments
  label: "Investments made during the year (CARO 3(iii) chapeau)"
  datatype: select
  carry_forward: prompt
  mandatory: true
  options:
    - { value: "none", label: "No investments made during the year" }
    - { value: "made", label: "Investments made during the year" }

variants:
  # Prints nothing either way. The answer decides whether clause 3(iii)(b) can
  # report "not applicable"; it is not itself a matter the Order asks to be
  # stated.
  - when: "value == 'none'"
    body: >
      The Company has not made any investments during the year.
    omit: true
  - when: "value == 'made'"
    body: >
      The Company has made investments during the year.
    omit: true
