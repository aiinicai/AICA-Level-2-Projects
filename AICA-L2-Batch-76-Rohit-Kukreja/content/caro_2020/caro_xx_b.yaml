# AUTHORED from the firm's own CARO annexure.
#
# Bodies marked "firm wording" are adapted from the supplied precedent.
# Bodies marked "AUTHORED" are mine: the precedent shows only the clean case,
# so the exception wording had to be written and has not been checked against
# anything. Those are what Gate A should read first.
#
# needs_review stays true until a partner has read every variant.

id: caro.xx.b
document: caro_2020
order: 470
number: "(xx)(b)"
title: "Unspent Amount for Ongoing Projects Transferred to a Special Account"
clause_ref: "CARO 2020, para 3(xx)(b)"
effective_from: "2021-04-01"
effective_to: null

needs_review: false

applicability:
  requires: [caro]

input:
  key: caro.xx.b
  label: "Unspent Amount for Ongoing Projects Transferred to a Special Account"
  datatype: select
  carry_forward: prompt
  mandatory: true
  options:
    - { value: "na", label: "Section 135 not applicable" }
    - { value: "none", label: "No ongoing projects with an unspent amount" }
    - { value: "transferred", label: "Transferred to a special account within thirty days" }
    - { value: "not_transferred", label: "Not transferred to a special account" }

variants:
  # AUTHORED — not from the precedent
  - when: "value == 'na'"
    body: >
      In our opinion and according to the information and explanations given
      to us, the provisions of Section 135 of the Companies Act, 2013 are not
      applicable to the Company. Accordingly, clause 3(xx)(b) of the Order is
      not applicable.
  # firm wording
  - when: "value == 'none'"
    body: >
      In our opinion and according to the information and explanations given
      to us, there is no amount remaining unspent under sub-section (5) of
      Section 135 of the Companies Act, 2013 pursuant to any ongoing project.
      Accordingly, clause 3(xx)(b) of the Order is not applicable.
  # AUTHORED — not from the precedent
  - when: "value == 'transferred'"
    body: >
      In our opinion and according to the information and explanations given
      to us, the amount remaining unspent under sub-section (5) of section 135
      of the Companies Act, pursuant to an ongoing project, has been
      transferred to a special account in compliance with the provisions of
      sub-section (6) of section 135 of the said Act.
  # firm wording
  - when: "value == 'not_transferred'"
    body: >
      In our opinion and according to the information and explanations given
      to us, the amount remaining unspent under sub-section (5) of section 135
      of the Companies Act, pursuant to an ongoing project, has not been
      transferred to a special account in compliance with the provisions of
      sub-section (6) of section 135 of the said Act. The amount involved is
      as follows:
    severity: exception
    requires_narrative: true
