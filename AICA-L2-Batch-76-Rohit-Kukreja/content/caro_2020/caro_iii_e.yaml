# AUTHORED from the firm's own CARO annexure.
#
# Bodies marked "firm wording" are adapted from the supplied precedent.
# Bodies marked "AUTHORED" are mine: the precedent shows only the clean case,
# so the exception wording had to be written and has not been checked against
# anything. Those are what Gate A should read first.
#
# needs_review stays true until a partner has read every variant.

id: caro.iii.e
document: caro_2020
order: 130
number: "(iii)(e)"
title: "Loans Renewed, Extended or Settled by Fresh Loans"
clause_ref: "CARO 2020, para 3(iii)(e)"
effective_from: "2021-04-01"
effective_to: null

needs_review: false

applicability:
  requires: [caro]

input:
  key: caro.iii.e
  label: "Loans Renewed, Extended or Settled by Fresh Loans"
  datatype: select
  carry_forward: prompt
  mandatory: true
  options:
    - { value: "none", label: "No such renewal, extension or settlement" }
    - { value: "renewed", label: "Renewed, extended or settled by fresh loans — particulars" }
    - { value: "na", label: "Not applicable" }

  # Follows the transactions, not the preparer (decision 78). Paragraph 3(iii)
  # opens "... IF SO, --", so every limb below it is conditional on there being
  # something to report. Before this the clause defaulted to its positive
  # wording, and a company that had granted nothing still issued an annexure
  # asserting things about loans it had never made.
  #
  # An UNANSWERED (a)(A)/(a)(B) does not reach this: `caro_no_loans_granted` is
  # false until both are answered "none", so the nil case is a determination
  # somebody made, not a question nobody reached.
  defaults:
    - { when: "caro_no_loans_granted", value: "na" }

variants:
  # AUTHORED 21 Aug 2026 -- see (d).
  - when: "value == 'na'"
    body: >
      The Company has not granted any loans or advances in the nature of loans
      during the year. Accordingly, clause 3(iii)(e) of the Order is not
      applicable.
  # firm wording
  - when: "value == 'none'"
    body: >
      According to the information and explanations given to us and on the
      basis of our examination of the records of the Company, there is no loan
      granted which has fallen due during the year and which has been renewed
      or extended, and no fresh loans have been granted to settle the overdues
      of existing loans given to the same party.
  # AUTHORED — not from the precedent
  - when: "value == 'renewed'"
    body: >
      According to the information and explanations given to us and on the
      basis of our examination of the records of the Company, loans falling
      due during the year have been renewed or extended, or fresh loans have
      been granted to settle the overdues of existing loans given to the same
      party. The aggregate amount of such dues renewed, extended or settled by
      fresh loans, and the percentage of that aggregate to the total loans or
      advances in the nature of loans granted during the year, are as follows:
    severity: exception
    requires_narrative: true
