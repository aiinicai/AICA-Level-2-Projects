# AUTHORED from the firm's own CARO annexure.
#
# Bodies marked "firm wording" are adapted from the supplied precedent.
# Bodies marked "AUTHORED" are mine: the precedent shows only the clean case,
# so the exception wording had to be written and has not been checked against
# anything. Those are what Gate A should read first.
#
# needs_review stays true until a partner has read every variant.

id: caro.xvi.b
document: caro_2020
order: 400
number: "(xvi)(b)"
title: "Non-Banking Financial or Housing Finance Activity without a Valid Certificate of Registration"
clause_ref: "CARO 2020, para 3(xvi)(b)"
effective_from: "2021-04-01"
effective_to: null

needs_review: false

applicability:
  requires: [caro]

input:
  key: caro.xvi.b
  label: "Non-Banking Financial or Housing Finance Activity without a Valid Certificate of Registration"
  datatype: select
  carry_forward: prompt
  mandatory: true
  options:
    - { value: "none", label: "No such activity conducted" }
    - { value: "with_cor", label: "Conducted with a valid Certificate of Registration" }
    - { value: "without_cor", label: "Conducted without a valid Certificate of Registration" }

variants:
  # AUTHORED — not from the precedent
  - when: "value == 'none'"
    body: >
      The Company has not conducted any Non-Banking Financial or Housing
      Finance activities during the year. Accordingly, clause 3(xvi)(b) of the
      Order is not applicable.
  # AUTHORED — not from the precedent
  - when: "value == 'with_cor'"
    body: >
      The Company has conducted Non-Banking Financial or Housing Finance
      activities during the year with a valid Certificate of Registration from
      the Reserve Bank of India.
  # AUTHORED — not from the precedent
  - when: "value == 'without_cor'"
    body: >
      The Company has conducted Non-Banking Financial or Housing Finance
      activities during the year without a valid Certificate of Registration
      from the Reserve Bank of India.
    severity: exception
    requires_narrative: true
