# AUTHORED from the firm's own CARO annexure.
#
# Bodies marked "firm wording" are adapted from the supplied precedent.
# Bodies marked "AUTHORED" are mine: the precedent shows only the clean case,
# so the exception wording had to be written and has not been checked against
# anything. Those are what Gate A should read first.
#
# needs_review stays true until a partner has read every variant.

id: caro.i.b
document: caro_2020
order: 30
number: "(i)(b)"
title: "Physical Verification of Property, Plant and Equipment"
clause_ref: "CARO 2020, para 3(i)(b)"
effective_from: "2021-04-01"
effective_to: null

needs_review: false

applicability:
  requires: [caro]

input:
  key: caro.i.b
  label: "Physical Verification of Property, Plant and Equipment"
  datatype: select
  carry_forward: prompt
  mandatory: true
  options:
    - { value: "verified", label: "Verified in a phased manner — no material discrepancies" }
    - { value: "discrepancy", label: "Material discrepancies noticed — dealt with in the books" }
    - { value: "not_verified", label: "Not physically verified" }
    - { value: "none", label: "No property, plant and equipment" }

variants:
  # firm wording
  - when: "value == 'verified'"
    body: >
      According to the information and explanations given to us and on the
      basis of our examination of the records of the Company, the Company has
      a regular programme of physical verification of its property, plant and
      equipment by which all Property, plant and equipment are verified in a
      phased manner over a period of three years. In accordance with this
      programme, certain Property, plant and equipment were verified during
      the year. In our opinion, this periodicity of physical verification is
      reasonable having regard to the size of the Company and the nature of
      its assets. No material discrepancies were noticed on such verification.
  # AUTHORED — not from the precedent
  - when: "value == 'discrepancy'"
    body: >
      According to the information and explanations given to us and on the
      basis of our examination of the records of the Company, the Company has
      a regular programme of physical verification of its property, plant and
      equipment. In our opinion, this periodicity of physical verification is
      reasonable having regard to the size of the Company and the nature of
      its assets. Material discrepancies were noticed on such verification and
      have been properly dealt with in the books of account. The particulars
      are as follows:
    severity: exception
    requires_narrative: true
  # AUTHORED — not from the precedent
  - when: "value == 'not_verified'"
    body: >
      According to the information and explanations given to us and on the
      basis of our examination of the records of the Company, the Company does
      not have a regular programme of physical verification of its property,
      plant and equipment.
    severity: exception
    requires_narrative: true
  # AUTHORED — not from the precedent
  - when: "value == 'none'"
    body: >
      The Company does not have any Property, plant and equipment.
      Accordingly, clause 3(i)(b) of the Order is not applicable.
