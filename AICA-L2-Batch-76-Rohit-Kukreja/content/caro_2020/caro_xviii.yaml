# AUTHORED from the firm's own CARO annexure.
#
# Bodies marked "firm wording" are adapted from the supplied precedent.
# Bodies marked "AUTHORED" are mine: the precedent shows only the clean case,
# so the exception wording had to be written and has not been checked against
# anything. Those are what Gate A should read first.
#
# needs_review stays true until a partner has read every variant.

id: caro.xviii
document: caro_2020
order: 440
number: "(xviii)"
title: "Resignation of the Statutory Auditors"
clause_ref: "CARO 2020, para 3(xviii)"
effective_from: "2021-04-01"
effective_to: null

needs_review: false

applicability:
  requires: [caro]

input:
  key: caro.xviii
  label: "Resignation of the Statutory Auditors"
  datatype: select
  carry_forward: prompt
  mandatory: true
  options:
    - { value: "none", label: "No resignation during the year" }
    - { value: "no_issues", label: "Resignation — no issues, objections or concerns raised" }
    - { value: "considered", label: "Resignation — issues taken into consideration" }

variants:
  # firm wording
  - when: "value == 'none'"
    body: >
      There has been no resignation of the statutory auditors during the year.
      Accordingly, clause 3(xviii) of the Order is not applicable.
  # AUTHORED — not from the precedent
  - when: "value == 'no_issues'"
    body: >
      There has been a resignation of the statutory auditors during the year.
      The outgoing auditors did not raise any issues, objections or concerns.
  # AUTHORED — not from the precedent
  - when: "value == 'considered'"
    body: >
      There has been a resignation of the statutory auditors during the year.
      We have taken into consideration the issues, objections or concerns
      raised by the outgoing auditors, which are as follows:
    severity: exception
    requires_narrative: true
