# AUTHORED from the firm's own CARO annexure.
#
# Bodies marked "firm wording" are adapted from the supplied precedent.
# Bodies marked "AUTHORED" are mine: the precedent shows only the clean case,
# so the exception wording had to be written and has not been checked against
# anything. Those are what Gate A should read first.
#
# needs_review stays true until a partner has read every variant.

id: caro.xv
document: caro_2020
order: 380
number: "(xv)"
title: "Non-cash Transactions with Directors — Section 192"
clause_ref: "CARO 2020, para 3(xv)"
effective_from: "2021-04-01"
effective_to: null

needs_review: false

applicability:
  requires: [caro]

input:
  key: caro.xv
  label: "Non-cash Transactions with Directors — Section 192"
  datatype: select
  carry_forward: prompt
  mandatory: true
  options:
    - { value: "none", label: "No non-cash transactions with directors" }
    - { value: "complied", label: "Non-cash transactions entered into — section 192 complied with" }
    - { value: "not_complied", label: "Non-cash transactions entered into — not complied" }

variants:
  # firm wording
  - when: "value == 'none'"
    body: >
      In our opinion and according to the information and explanations given
      to us, the Company has not entered into any non-cash transactions with
      its directors or persons connected to its directors and hence,
      provisions of Section 192 of the Companies Act, 2013 are not applicable
      to the Company.
  # AUTHORED — not from the precedent
  - when: "value == 'complied'"
    body: >
      In our opinion and according to the information and explanations given
      to us, the Company has entered into non-cash transactions with its
      directors or persons connected to its directors, and has complied with
      the provisions of Section 192 of the Companies Act, 2013.
  # AUTHORED — not from the precedent
  - when: "value == 'not_complied'"
    body: >
      In our opinion and according to the information and explanations given
      to us, the Company has entered into non-cash transactions with its
      directors or persons connected to its directors and has not complied
      with the provisions of Section 192 of the Companies Act, 2013. The
      particulars are as follows:
    severity: exception
    requires_narrative: true
