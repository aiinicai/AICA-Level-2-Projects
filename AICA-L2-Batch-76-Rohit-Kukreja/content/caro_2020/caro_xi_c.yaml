# AUTHORED from the firm's own CARO annexure.
#
# Bodies marked "firm wording" are adapted from the supplied precedent.
# Bodies marked "AUTHORED" are mine: the precedent shows only the clean case,
# so the exception wording had to be written and has not been checked against
# anything. Those are what Gate A should read first.
#
# needs_review stays true until a partner has read every variant.

id: caro.xi.c
document: caro_2020
order: 310
number: "(xi)(c)"
title: "Whistle-blower Complaints Considered"
clause_ref: "CARO 2020, para 3(xi)(c)"
effective_from: "2021-04-01"
effective_to: null

needs_review: false

applicability:
  requires: [caro]

input:
  key: caro.xi.c
  label: "Whistle-blower Complaints Considered"
  datatype: select
  carry_forward: prompt
  mandatory: true
  options:
    - { value: "none", label: "No whistle-blower complaints received" }
    - { value: "received", label: "Complaints received and taken into consideration" }

variants:
  # AUTHORED — not from the precedent
  - when: "value == 'none'"
    body: >
      According to the information and explanations given to us, the Company
      has not received any whistle blower complaints during the year.
  # firm wording
  - when: "value == 'received'"
    body: >
      We have taken into consideration the whistle blower complaints received
      by the Company during the year while determining the nature, timing and
      extent of our audit procedures.
