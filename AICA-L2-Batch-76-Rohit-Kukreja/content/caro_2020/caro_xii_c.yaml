# AUTHORED from the firm's own CARO annexure.
#
# Bodies marked "firm wording" are adapted from the supplied precedent.
# Bodies marked "AUTHORED" are mine: the precedent shows only the clean case,
# so the exception wording had to be written and has not been checked against
# anything. Those are what Gate A should read first.
#
# needs_review stays true until a partner has read every variant.

id: caro.xii.c
document: caro_2020
order: 340
number: "(xii)(c)"
title: "Nidhi Company — Default in Payment of Interest or Repayment of Deposits"
clause_ref: "CARO 2020, para 3(xii)(c)"
effective_from: "2021-04-01"
effective_to: null

needs_review: false

applicability:
  requires: [caro]

input:
  key: caro.xii.c
  label: "Nidhi Company — Default in Payment of Interest or Repayment of Deposits"
  datatype: select
  carry_forward: prompt
  mandatory: true
  options:
    - { value: "na", label: "Not a Nidhi Company" }
    - { value: "none", label: "No default" }
    - { value: "default", label: "Default — particulars" }

variants:
  # AUTHORED — not from the precedent
  - when: "value == 'na'"
    body: >
      According to the information and explanations given to us, the Company
      is not a Nidhi Company. Accordingly, clause 3(xii)(c) of the Order is
      not applicable.
  # AUTHORED — not from the precedent
  - when: "value == 'none'"
    body: >
      According to the information and explanations given to us, the Company
      is a Nidhi Company and there has been no default in payment of interest
      on deposits or repayment thereof for any period.
  # AUTHORED — not from the precedent
  - when: "value == 'default'"
    body: >
      According to the information and explanations given to us, the Company
      is a Nidhi Company and there has been a default in payment of interest
      on deposits or repayment thereof. The particulars are as follows:
    severity: exception
    requires_narrative: true
