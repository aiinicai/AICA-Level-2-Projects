# AUTHORED from the firm's own CARO annexure.
#
# Bodies marked "firm wording" are adapted from the supplied precedent.
# Bodies marked "AUTHORED" are mine: the precedent shows only the clean case,
# so the exception wording had to be written and has not been checked against
# anything. Those are what Gate A should read first.
#
# needs_review stays true until a partner has read every variant.

id: caro.vii.a
document: caro_2020
order: 180
number: "(vii)(a)"
title: "Regularity in Depositing Undisputed Statutory Dues"
clause_ref: "CARO 2020, para 3(vii)(a)"
effective_from: "2021-04-01"
effective_to: null

needs_review: false

applicability:
  requires: [caro]

input:
  key: caro.vii.a
  label: "Regularity in Depositing Undisputed Statutory Dues"
  datatype: select
  carry_forward: prompt
  mandatory: true
  options:
    - { value: "regular", label: "Regular — no arrears beyond six months" }
    - { value: "arrears", label: "Arrears outstanding for more than six months" }
    - { value: "none", label: "No liability in respect of statutory dues" }

variants:
  # firm wording
  - when: "value == 'regular'"
    body: >
      According to the information and explanations given to us and on the
      basis of our examination of the records of the Company, amounts deducted
      or accrued in the books of account in respect of undisputed statutory
      dues including Goods and Services Tax, Provident fund, Employees' State
      Insurance, Income-tax, Duty of Customs, Cess and other material
      statutory dues have generally been regularly deposited with the
      appropriate authorities. Further, no undisputed amounts payable in
      respect of such dues were in arrears as at the balance sheet date for a
      period of more than six months from the date they became payable.
  # AUTHORED — not from the precedent
  - when: "value == 'arrears'"
    body: >
      According to the information and explanations given to us and on the
      basis of our examination of the records of the Company, amounts deducted
      or accrued in the books of account in respect of undisputed statutory
      dues have not been regularly deposited with the appropriate authorities.
      The undisputed amounts payable which were in arrears as at the balance
      sheet date for a period of more than six months from the date they
      became payable are as follows:
    severity: exception
    requires_narrative: true
  # firm wording
  - when: "value == 'none'"
    body: >
      The Company does not have any liability in respect of undisputed
      statutory dues including Goods and Services Tax, provident fund,
      employees' state insurance, income-tax, duty of customs, duty of excise,
      value added tax, cess and any other statutory dues to the appropriate
      authorities during the year.
