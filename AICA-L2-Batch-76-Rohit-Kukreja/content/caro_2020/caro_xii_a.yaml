# AUTHORED from the firm's own CARO annexure.
#
# Bodies marked "firm wording" are adapted from the supplied precedent.
# Bodies marked "AUTHORED" are mine: the precedent shows only the clean case,
# so the exception wording had to be written and has not been checked against
# anything. Those are what Gate A should read first.
#
# needs_review stays true until a partner has read every variant.

id: caro.xii.a
document: caro_2020
order: 320
number: "(xii)(a)"
title: "Nidhi Company — Net Owned Funds to Deposits Ratio"
clause_ref: "CARO 2020, para 3(xii)(a)"
effective_from: "2021-04-01"
effective_to: null

needs_review: false

applicability:
  requires: [caro]

input:
  key: caro.xii.a
  label: "Nidhi Company — Net Owned Funds to Deposits Ratio"
  datatype: select
  carry_forward: prompt
  mandatory: true
  options:
    - { value: "na", label: "Not a Nidhi Company" }
    - { value: "maintained", label: "Ratio of 1:20 maintained" }
    - { value: "not_maintained", label: "Ratio not maintained" }

variants:
  # firm wording
  - when: "value == 'na'"
    body: >
      According to the information and explanations given to us, the Company
      is not a Nidhi Company. Accordingly, clause 3(xii)(a) of the Order is
      not applicable.
  # AUTHORED — not from the precedent
  - when: "value == 'maintained'"
    body: >
      According to the information and explanations given to us, the Company
      is a Nidhi Company and has complied with the Net Owned Funds to Deposits
      in the ratio of 1:20 to meet out the liability.
  # AUTHORED — not from the precedent
  - when: "value == 'not_maintained'"
    body: >
      According to the information and explanations given to us, the Company
      is a Nidhi Company and has not complied with the Net Owned Funds to
      Deposits in the ratio of 1:20 to meet out the liability.
    severity: exception
    requires_narrative: true
