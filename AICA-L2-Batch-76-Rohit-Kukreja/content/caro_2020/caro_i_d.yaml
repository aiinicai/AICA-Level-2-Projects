# AUTHORED from the firm's own CARO annexure.
#
# Bodies marked "firm wording" are adapted from the supplied precedent.
# Bodies marked "AUTHORED" are mine: the precedent shows only the clean case,
# so the exception wording had to be written and has not been checked against
# anything. Those are what Gate A should read first.
#
# needs_review stays true until a partner has read every variant.

id: caro.i.d
document: caro_2020
order: 50
number: "(i)(d)"
title: "Revaluation of Property, Plant and Equipment or Intangible Assets"
clause_ref: "CARO 2020, para 3(i)(d)"
effective_from: "2021-04-01"
effective_to: null

needs_review: false

applicability:
  requires: [caro]

input:
  key: caro.i.d
  label: "Revaluation of Property, Plant and Equipment or Intangible Assets"
  datatype: select
  carry_forward: prompt
  mandatory: true
  options:
    - { value: "none", label: "No revaluation during the year" }
    - { value: "below_10", label: "Revalued by a registered valuer — change below 10%" }
    - { value: "above_10", label: "Revalued — change of 10% or more" }

variants:
  # firm wording
  - when: "value == 'none'"
    body: >
      According to the information and explanations given to us and on the
      basis of our examination of the records of the Company, the Company has
      not revalued its Property, plant and equipment (including Right-of-use
      assets) or Intangible assets or both during the year.
  # AUTHORED — not from the precedent
  - when: "value == 'below_10'"
    body: >
      According to the information and explanations given to us and on the
      basis of our examination of the records of the Company, the Company has
      revalued its Property, plant and equipment (including Right-of-use
      assets) or Intangible assets or both during the year. The revaluation is
      based on the valuation by a Registered Valuer, and the change is not 10%
      or more in the aggregate of the net carrying value of each class of
      Property, plant and equipment or Intangible assets.
  # AUTHORED — not from the precedent
  - when: "value == 'above_10'"
    body: >
      According to the information and explanations given to us and on the
      basis of our examination of the records of the Company, the Company has
      revalued its Property, plant and equipment (including Right-of-use
      assets) or Intangible assets or both during the year. The revaluation is
      based on the valuation by a Registered Valuer, and the change is 10% or
      more in the aggregate of the net carrying value of each class of
      Property, plant and equipment or Intangible assets. The particulars are
      as follows:
    severity: info
    requires_narrative: true
