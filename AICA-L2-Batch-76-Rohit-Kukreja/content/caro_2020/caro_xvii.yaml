# AUTHORED from the firm's own CARO annexure.
#
# Bodies marked "firm wording" are adapted from the supplied precedent.
# Bodies marked "AUTHORED" are mine: the precedent shows only the clean case,
# so the exception wording had to be written and has not been checked against
# anything. Those are what Gate A should read first.
#
# needs_review stays true until a partner has read every variant.

id: caro.xvii
document: caro_2020
order: 430
number: "(xvii)"
title: "Cash Losses in the Current and Immediately Preceding Financial Year"
clause_ref: "CARO 2020, para 3(xvii)"
effective_from: "2021-04-01"
effective_to: null

needs_review: false

applicability:
  requires: [caro]

input:
  key: caro.xvii
  label: "Cash Losses in the Current and Immediately Preceding Financial Year"
  datatype: select
  carry_forward: prompt
  mandatory: true
  options:
    - { value: "none", label: "No cash losses in either year" }
    - { value: "incurred", label: "Cash losses incurred — amounts for both years" }

variants:
  # firm wording
  - when: "value == 'none'"
    body: >
      The Company has not incurred cash losses in the current and in the
      immediately preceding financial year. Accordingly, clause 3(xvii) of the
      Order is not applicable.
  # AUTHORED — not from the precedent
  - when: "value == 'incurred'"
    body: >
      The Company has incurred cash losses in the current financial year
      and/or in the immediately preceding financial year. The amounts are as
      follows:
    severity: exception
    requires_narrative: true
