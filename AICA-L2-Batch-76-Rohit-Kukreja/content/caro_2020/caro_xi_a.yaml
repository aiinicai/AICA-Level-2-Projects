# AUTHORED from the firm's own CARO annexure.
#
# Bodies marked "firm wording" are adapted from the supplied precedent.
# Bodies marked "AUTHORED" are mine: the precedent shows only the clean case,
# so the exception wording had to be written and has not been checked against
# anything. Those are what Gate A should read first.
#
# needs_review stays true until a partner has read every variant.

id: caro.xi.a
document: caro_2020
order: 290
number: "(xi)(a)"
title: "Fraud by the Company or on the Company"
clause_ref: "CARO 2020, para 3(xi)(a)"
effective_from: "2021-04-01"
effective_to: null

needs_review: false

applicability:
  requires: [caro]

input:
  key: caro.xi.a
  label: "Fraud by the Company or on the Company"
  datatype: select
  carry_forward: prompt
  mandatory: true
  options:
    - { value: "none", label: "No fraud noticed or reported" }
    - { value: "noticed", label: "Fraud noticed or reported — nature and amount" }

variants:
  # firm wording
  - when: "value == 'none'"
    body: >
      Based on examination of the books and records of the Company and
      according to the information and explanations given to us, considering
      the principles of materiality outlined in Standards on Auditing, we
      report that no fraud by the Company or on the Company has been noticed
      or reported during the course of the audit.
  # AUTHORED — not from the precedent
  - when: "value == 'noticed'"
    body: >
      Based on examination of the books and records of the Company and
      according to the information and explanations given to us, considering
      the principles of materiality outlined in Standards on Auditing, we
      report that the following fraud by the Company or on the Company has
      been noticed or reported during the course of the audit:
    severity: exception
    requires_narrative: true
