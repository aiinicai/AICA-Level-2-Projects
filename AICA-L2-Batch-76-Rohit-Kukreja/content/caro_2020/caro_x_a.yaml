# AUTHORED from the firm's own CARO annexure.
#
# Bodies marked "firm wording" are adapted from the supplied precedent.
# Bodies marked "AUTHORED" are mine: the precedent shows only the clean case,
# so the exception wording had to be written and has not been checked against
# anything. Those are what Gate A should read first.
#
# needs_review stays true until a partner has read every variant.

id: caro.x.a
document: caro_2020
order: 270
number: "(x)(a)"
title: "Money Raised by Initial or Further Public Offer"
clause_ref: "CARO 2020, para 3(x)(a)"
effective_from: "2021-04-01"
effective_to: null

needs_review: false

applicability:
  requires: [caro]

input:
  key: caro.x.a
  label: "Money Raised by Initial or Further Public Offer"
  datatype: select
  carry_forward: prompt
  mandatory: true
  options:
    - { value: "none", label: "No money raised by public offer" }
    - { value: "applied", label: "Raised and applied for the purposes for which they were raised" }
    - { value: "not_applied", label: "Raised — not applied for the stated purposes" }

variants:
  # firm wording
  - when: "value == 'none'"
    body: >
      The Company has not raised any moneys by way of initial public offer or
      further public offer (including debt instruments) during the year.
      Accordingly, clause 3(x)(a) of the Order is not applicable.
  # AUTHORED — not from the precedent
  - when: "value == 'applied'"
    body: >
      The Company has raised moneys by way of initial public offer or further
      public offer (including debt instruments) during the year, and such
      moneys were applied for the purposes for which they were raised.
  # AUTHORED — not from the precedent
  - when: "value == 'not_applied'"
    body: >
      The Company has raised moneys by way of initial public offer or further
      public offer (including debt instruments) during the year which were not
      applied for the purposes for which they were raised. The details,
      together with any delay or default and the subsequent use of those
      funds, are as follows:
    severity: exception
    requires_narrative: true
