# AUTHORED from the firm's own CARO annexure.
#
# Bodies marked "firm wording" are adapted from the supplied precedent.
# Bodies marked "AUTHORED" are mine: the precedent shows only the clean case,
# so the exception wording had to be written and has not been checked against
# anything. Those are what Gate A should read first.
#
# needs_review stays true until a partner has read every variant.

id: caro.iii.d
document: caro_2020
order: 120
number: "(iii)(d)"
title: "Amounts Overdue for More than Ninety Days"
clause_ref: "CARO 2020, para 3(iii)(d)"
effective_from: "2021-04-01"
effective_to: null

needs_review: false

applicability:
  requires: [caro]

input:
  key: caro.iii.d
  label: "Amounts Overdue for More than Ninety Days"
  datatype: select
  carry_forward: prompt
  mandatory: true
  options:
    - { value: "none", label: "No amount overdue for more than ninety days" }
    - { value: "overdue", label: "Overdue — particulars and steps taken" }
    - { value: "na", label: "Not applicable" }

  # Follows the transactions, not the preparer (decision 78). Paragraph 3(iii)
  # opens "... IF SO, --", so every limb below it is conditional on there being
  # something to report. Before this the clause defaulted to its positive
  # wording, and a company that had granted nothing still issued an annexure
  # asserting things about loans it had never made.
  #
  # An UNANSWERED (a)(A)/(a)(B) does not reach this: `caro_no_loans_granted` is
  # false until both are answered "none", so the nil case is a determination
  # somebody made, not a question nobody reached.
  defaults:
    - { when: "caro_no_loans_granted", value: "na" }

variants:
  # AUTHORED 21 Aug 2026 -- there was no way to say this. "No amount is
  # overdue" is a statement about loans; a company that granted none has
  # nothing that could be overdue, and saying so positively reads as a finding
  # about a portfolio that does not exist.
  - when: "value == 'na'"
    body: >
      The Company has not granted any loans or advances in the nature of loans
      during the year. Accordingly, clause 3(iii)(d) of the Order is not
      applicable.
  # firm wording
  - when: "value == 'none'"
    body: >
      According to the information and explanations given to us and on the
      basis of our examination of the records of the Company, there is no
      overdue amount for more than ninety days in respect of loans given.
      Hence, reasonable steps are not required to be taken by the Company for
      recovery of the principal and interest.
  # AUTHORED — not from the precedent
  - when: "value == 'overdue'"
    body: >
      According to the information and explanations given to us and on the
      basis of our examination of the records of the Company, the following
      amounts are overdue for more than ninety days in respect of loans given,
      together with the reasonable steps taken by the Company for recovery of
      the principal and interest:
    severity: exception
    requires_narrative: true
