# AUTHORED from the firm's own CARO annexure.
#
# Bodies marked "firm wording" are adapted from the supplied precedent.
# Bodies marked "AUTHORED" are mine: the precedent shows only the clean case,
# so the exception wording had to be written and has not been checked against
# anything. Those are what Gate A should read first.
#
# needs_review stays true until a partner has read every variant.

id: caro.ix.a
document: caro_2020
order: 210
number: "(ix)(a)"
title: "Default in Repayment of Borrowings or Interest"
clause_ref: "CARO 2020, para 3(ix)(a)"
effective_from: "2021-04-01"
effective_to: null

needs_review: false

applicability:
  requires: [caro]

input:
  key: caro.ix.a
  label: "Default in Repayment of Borrowings or Interest"
  datatype: select
  carry_forward: prompt
  mandatory: true
  options:
    - { value: "no_borrowings", label: "No loans or borrowings from any lender during the year" }
    - { value: "no_default", label: "Borrowings exist — no default" }
    - { value: "default", label: "Default in repayment or interest — particulars" }

variants:
  # firm wording
  - when: "value == 'no_borrowings'"
    body: >
      According to the information and explanations given to us and on the
      basis of our examination of the records of the Company, the Company did
      not have any loans or borrowings from any lender during the year.
      Accordingly, clause 3(ix)(a) of the Order is not applicable.
  # AUTHORED — not from the precedent
  - when: "value == 'no_default'"
    body: >
      According to the information and explanations given to us and on the
      basis of our examination of the records of the Company, the Company has
      not defaulted in the repayment of loans or other borrowings or in the
      payment of interest thereon to any lender.
  # AUTHORED — not from the precedent
  - when: "value == 'default'"
    body: >
      According to the information and explanations given to us and on the
      basis of our examination of the records of the Company, the Company has
      defaulted in the repayment of loans or other borrowings or in the
      payment of interest thereon to lenders, as follows:
    severity: exception
    requires_narrative: true
