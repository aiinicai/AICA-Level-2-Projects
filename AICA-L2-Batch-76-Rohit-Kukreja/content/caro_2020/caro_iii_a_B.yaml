# AUTHORED from the firm's own CARO annexure.
#
# Bodies marked "firm wording" are adapted from the supplied precedent.
# Bodies marked "AUTHORED" are mine: the precedent shows only the clean case,
# so the exception wording had to be written and has not been checked against
# anything. Those are what Gate A should read first.
#
# needs_review stays true until a partner has read every variant.

id: caro.iii.a.B
document: caro_2020
order: 95
number: "(iii)(a)(B)"
title: "Loans, Advances, Guarantees and Security Granted to Parties Other than Subsidiaries, Joint Ventures and Associates"
clause_ref: "CARO 2020, para 3(iii)(a)(B)"
effective_from: "2021-04-01"
effective_to: null

needs_review: false

applicability:
  requires: [caro]

input:
  key: caro.iii.a.B
  label: "Loans, Advances, Guarantees and Security Granted to Parties Other than Subsidiaries, Joint Ventures and Associates"
  datatype: select
  carry_forward: prompt
  mandatory: true
  options:
    - { value: "none", label: "None granted to other parties" }
    - { value: "granted", label: "Granted — aggregate amount and balance outstanding" }

variants:
  # firm wording
  - when: "value == 'none'"
    body: >
      Based on the audit procedures carried on by us and as per the
      information and explanations given to us, the Company has not granted
      any loans or advances in the nature of loans and guarantees or security
      to parties other than subsidiaries, joint ventures and associates.
  # AUTHORED — not from the precedent
  - when: "value == 'granted'"
    body: >
      Based on the audit procedures carried on by us and as per the
      information and explanations given to us, the Company has granted loans
      or advances in the nature of loans and guarantees or security to parties
      other than subsidiaries, joint ventures and associates. The aggregate
      amount during the year and the balance outstanding at the balance sheet
      date are as follows:
    requires_narrative: true
