# Clause repository manifest. Build Prompt v2 §3.3.
# template_version is stamped into every generated document and must change
# whenever any clause body changes.

template_version: "1.0.0-approved"

# Gate A. Recorded here because clearing `needs_review` on 189 clauses is
# otherwise an unattributed act — a blanket sign-off and a clause-by-clause
# reading leave identical traces in the files themselves.
review:
  # NOT `on:` — YAML 1.1 parses that key as the boolean true.
  date: "2026-08-16"
  by: "Signing partner"
  method: >
    Blanket sign-off on the partner's instruction, after the thirteen
    questions in gate_a_pack/QUESTIONS.md were answered individually. The
    partner directed that all 189 clauses be treated as reviewed. This was
    NOT a clause-by-clause reading, and the Review and Sign-Off Protocol
    contemplates one. Recorded as it happened.

changelog:
  - "1.0.0-approved — Gate A. `needs_review` cleared on all 189 clauses on the
     partner's instruction; see the `review` block above for how that sign-off
     was actually conducted, and docs/GATE_A_DECISIONS.md for the fourteen
     decisions taken. Wording itself is unchanged from 0.3.0-authored."
  - "0.3.0-authored — Phase 2 COMPLETE. All 189 clauses across every document
     carry authored wording and resolve for every option; no authoring marker
     remains. Sources are named in every file: the firm's own precedents for the
     auditor's report, CARO annexure, IFC annexure, MRL and Board's Report, and
     ICAI's SA 210 Appendix 1 and Implementation Guide (Jan 2022) Chapter 3 for
     the engagement letter. EVERY CLAUSE REMAINS needs_review: authored is not
     approved, and Gate A has not happened."
  - "0.2.0-skeleton — Phase 2 STRUCTURE only. Every document now exists with
     every clause present: correct id, number, statutory reference, effective
     dates, applicability flags and option set. NO STATUTORY WORDING HAS BEEN
     WRITTEN. Each variant body is an authoring marker, so §18.4's pre-export
     scan blocks every unauthored clause from reaching a signed document.
     Authoring proceeds clause by clause against the approved Clause Register
     and the firm's own precedents — see docs/CONTENT_AUTHORING.md."
  - "0.1.0-phase1 — six sample clauses across two documents."

