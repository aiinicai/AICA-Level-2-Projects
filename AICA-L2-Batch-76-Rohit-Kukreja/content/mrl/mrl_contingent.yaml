# AUTHORED from the firm's own MRL precedent.
#
# The precedent is a live client file. Wording is adapted; nothing specific
# to that client is carried over. See scripts note in the authoring script.
#
# The precedent's contingent liabilities section carries a long
# client-specific analysis of an indirect tax exposure, with amounts and a
# holding company support letter. None of that is carried.

id: mrl.contingent
document: mrl
order: 170
number: ""
title: "Contingent Liabilities and Commitments"
clause_ref: "AS 29 / Ind AS 37; Schedule III"
effective_from: "2014-04-01"
effective_to: null
render_as: section

needs_review: false

input:
  key: mrl.contingent
  label: "Contingent liabilities and commitments"
  datatype: select
  carry_forward: prompt
  mandatory: true
  options:
    - { value: "none", label: "None other than as disclosed" }
    - { value: "described", label: "Describe the material items" }

variants:
  - when: "value == 'none'"
    body: >
      Contingent Liabilities and Commitments

      All known material liabilities and provisions are included in the financial
      statements. Full provision has been made for all known liabilities at the balance
      sheet date, including guarantees, commitments and contingencies, and provisions are
      measured at the present value of our best estimate of the expenditure required to
      settle the present obligation at the end of the reporting period.

      There are no contingent liabilities, potential liabilities, threatened litigation or
      capital commitments of material amounts other than those disclosed in the notes to
      the financial statements. There are no onerous contracts, no losses arising from sale
      and purchase commitments, and no other agreements outside the ordinary course of
      business.

  - when: "value == 'described'"
    body: >
      Contingent Liabilities and Commitments

      All known material liabilities and provisions are included in the financial
      statements, and full provision has been made for all known liabilities at the balance
      sheet date. The material contingent liabilities and commitments, and the basis on
      which they have been assessed, are set out below:
    requires_narrative: true
