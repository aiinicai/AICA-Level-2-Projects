id: mrl.title.assets
document: mrl
order: 160
number: ""
title: "Title to Assets and Absence of Liens"
clause_ref: "SA 580 para 10; Schedule II, Companies Act, 2013"
effective_from: "2014-04-01"
effective_to: null
render_as: section

needs_review: false

variants:
  - body: >
      Property, Plant and Equipment

      The Company has satisfactory title to all assets recorded in the financial
      statements, and the title deeds of all immovable properties are held in the name of
      the Company. There are no liens or encumbrances on the Company's assets, and no
      assets have been pledged as collateral, except as disclosed in the notes to the
      financial statements.

      The expenditure charged to the capital account wholly represents additions or
      improvements to the existing capital assets of the Company, and the amounts so
      charged do not include any expenditure of a revenue nature. The Company has adopted
      the useful lives prescribed under Schedule II to the Companies Act, 2013 to determine
      the useful lives of its fixed assets; for assets whose lives are not specified in
      Schedule II, the useful lives have been determined by the management and are
      supported by technical assessment. Provision for depreciation, including
      obsolescence, has been made against property, plant and equipment at rates calculated
      to reduce the net book amount of each asset to its estimated residual value over its
      remaining useful life.

      There are no agreements or options to buy back assets previously sold, including
      sales with recourse.
