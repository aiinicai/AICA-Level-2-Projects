id: mrl.subsequent.events
document: mrl
order: 80
number: ""
title: "Events Subsequent to the Balance Sheet Date"
clause_ref: "SA 560; AS 4 / Ind AS 10"
effective_from: "2014-04-01"
effective_to: null

needs_review: false

variants:
  - body: >
      All events subsequent to the date of the financial statements, and for which the
      applicable accounting standards in India require adjustment or disclosure, have been
      adjusted or disclosed. No subsequent events have been identified that require
      adjustment to the assumptions and disclosures included in the financial statements.
      There are no prior period items which need to be disclosed in the financial
      statements.
