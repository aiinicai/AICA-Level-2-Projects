# AUTHORED from the firm's own MRL precedent.
#
# The precedent is a live client file. Wording is adapted; nothing specific
# to that client is carried over. See scripts note in the authoring script.

id: mrl.laws
document: mrl
order: 120
number: ""
title: "Compliance with Laws and Regulations"
clause_ref: "SA 250 para 16"
effective_from: "2014-04-01"
effective_to: null
render_as: section

needs_review: false

input:
  key: mrl.laws
  label: "Non-compliance or suspected non-compliance with laws and regulations"
  datatype: select
  carry_forward: prompt
  mandatory: true
  options:
    - { value: "none", label: "None" }
    - { value: "identified", label: "Instances identified — describe them" }

variants:
  - when: "value == 'none'"
    body: >
      Compliance with Laws and Regulations

      There have been no communications from regulatory agencies, governmental
      representatives, tax authorities, employees or others concerning investigations or
      allegations of non-compliance with laws and regulations. To the best of our knowledge
      and belief, the Company has not made any improper payments, or payments which are
      illegal or against public policy. The Company has complied with all aspects of
      contractual agreements which could have a material effect on the financial statements
      in the event of non-compliance.

      There are no instances of non-compliance or suspected non-compliance with laws and
      regulations or contractual agreements, whether or not discussed with legal counsel,
      whose effects should be considered when preparing the financial statements.

      No payment has been made during the year, whether directly or indirectly, by way of
      advertisement or otherwise, to any political party in contravention of the provisions
      of the Companies Act, 2013.

  - when: "value == 'identified'"
    body: >
      Compliance with Laws and Regulations

      Except as described below, there are no instances of non-compliance or suspected
      non-compliance with laws and regulations or contractual agreements, whether or not
      discussed with legal counsel, whose effects should be considered when preparing the
      financial statements:
    requires_narrative: true
    severity: exception
