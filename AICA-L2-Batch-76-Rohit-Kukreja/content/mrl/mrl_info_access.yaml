id: mrl.info.access
document: mrl
order: 40
number: ""
title: "Provision of Information and Access to Records"
clause_ref: "SA 580 para 11"
effective_from: "2014-04-01"
effective_to: null
render_as: section

needs_review: false

variants:
  - body: >
      Information Provided

      We have provided you with the financial records and related data comprising all books
      of account and supporting documentation, which are agreed and reconciled; access to
      all information, whether kept at the head office or elsewhere, of which the
      management is aware that is relevant to the preparation of the financial statements,
      including books of account maintained in electronic mode; additional information that
      you have requested from us for the purpose of the audit; all minutes of meetings of
      the shareholders and of the Board of Directors, and summaries of meetings held after
      the end of the reporting period for which minutes have been prepared; and
      unrestricted access to persons within the Company from whom you determined it
      necessary to obtain evidence.

      We have also informed you of the effect of changes in the Company's business
      activities, and of significant changes in commitments, contractual obligations, debt
      covenants and laws, and in liabilities including litigation or claims.
