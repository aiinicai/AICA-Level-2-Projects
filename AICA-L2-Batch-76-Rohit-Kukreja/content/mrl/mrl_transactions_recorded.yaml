id: mrl.transactions.recorded
document: mrl
order: 50
number: ""
title: "All Transactions Recorded and Reflected in the Financial Statements"
clause_ref: "SA 580 para 11(b)"
effective_from: "2014-04-01"
effective_to: null

needs_review: false

variants:
  - body: >
      All transactions have been recorded in the accounting records and are reflected in the
      financial statements. We confirm that all transactions and events have been carried
      out in accordance with relevant legislation or under proper authority, that all
      transactions undertaken by the Company have satisfactory commercial substance, and
      that there are no transactions of the Company which are represented merely by book
      entries.
