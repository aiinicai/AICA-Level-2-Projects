# AUTHORED from the firm's own MRL precedent.
#
# The precedent is a live client file. Wording is adapted; nothing specific
# to that client is carried over. See scripts note in the authoring script.
#
# The precedent cross-refers to a numbered note for the pending litigation
# disclosure. Note numbers do not survive a move to a different set of
# financial statements and are not carried; the schedule of litigation is
# the child table already held for CARO and Rule 11(a).

id: mrl.litigation
document: mrl
order: 130
number: ""
title: "Litigation and Claims"
clause_ref: "SA 501 paras 9-10; Rule 11(a)"
effective_from: "2014-04-01"
effective_to: null

needs_review: false

input:
  key: mrl.litigation
  label: "Actual or possible litigation and claims"
  datatype: select
  carry_forward: prompt
  mandatory: true
  options:
    - { value: "none", label: "None" }
    - { value: "disclosed", label: "Disclosed in the financial statements" }

variants:
  - when: "value == 'none'"
    body: >
      The Company does not have any pending litigation which would impact its financial
      position. The Company did not have any long-term contracts, including derivative
      contracts, for which there were any material foreseeable losses. There were no
      amounts which were required to be transferred to the Investor Education and
      Protection Fund by the Company.

  - when: "value == 'disclosed'"
    body: >
      All known actual or possible litigation and claims, whose effects should be
      considered when preparing the financial statements, have been disclosed to you and
      accounted for and disclosed in accordance with the applicable financial reporting
      framework. The impact of the pending litigation on the Company's financial position
      has been disclosed in the notes to the financial statements.
