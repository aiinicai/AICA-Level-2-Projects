# AUTHORED from the firm's own MRL precedent.
#
# The precedent is a live client file. Wording is adapted; nothing specific
# to that client is carried over. See scripts note in the authoring script.
#
# The precedent writes "AS financial statements" in most paragraphs and
# "Ind AS financial statements" in one — a leftover from an Ind AS template.
# Rather than reproduce either, every clause here says "the financial
# statements" and the framework is named once, in mrl.framework.

id: mrl.framework
document: mrl
order: 30
number: ""
title: "Financial Statements Prepared in Accordance with the Applicable Framework"
clause_ref: "SA 580 para 10; s.133"
effective_from: "2014-04-01"
effective_to: null

needs_review: false
#
# CITATION CORRECTED, 20 August 2026 (decision 51), on the partner's
# instruction. This clause cited "Rule 7 of the Companies (Accounts) Rules,
# 2014", which was the TRANSITIONAL provision -- it deemed the standards
# notified under the Companies Act, 1956 to be the accounting standards until
# new ones were prescribed. The Accounting Standards are now prescribed by the
# Companies (Accounting Standards) Rules, 2021, and that is what section 133
# is read with.
#
# Ind AS is unaffected: it is section 133 read with the Companies (Indian
# Accounting Standards) Rules, 2015, which is already what the Ind AS variant
# says.

variants:
  - when: "framework == 'indas'"
    body: >
      The financial statements have been prepared in accordance with the Indian Accounting
      Standards specified under Section 133 of the Companies Act, 2013. The financial
      statements and the notes appended thereto include all material disclosures necessary
      to show a true and fair view of the state of affairs, profit or loss, other
      comprehensive income, changes in equity and cash flows of the Company, and the
      disclosures required to be made therein under the Companies Act, 2013.

      There is no change in the accounting policies during the year. We have reviewed the
      Company's accounting policies and estimation techniques used in the preparation of
      the financial statements and confirm that they are appropriate to give a true and
      fair view in the Company's particular circumstances.

  - body: >
      The financial statements have been prepared in accordance with the Accounting
      Standards specified under Section 133 of the Companies Act, 2013 read with the
      Companies (Accounting Standards) Rules, 2021, as amended. The financial statements and the notes appended
      thereto include all material disclosures necessary to show a true and fair view of
      the state of affairs, profit or loss and cash flows of the Company, and the
      disclosures required to be made therein under the Companies Act, 2013.
    when: "cash_flow_required"

  # Section 2(40) proviso: a small company and a One Person Company prepare no
  # cash flow statement, so the representation must not say the statements show
  # one. Same wording otherwise.
  - body: >
      Basis of Preparation

      The financial statements have been prepared in accordance with the Accounting
      Standards specified under Section 133 of the Companies Act, 2013 read with the
      Companies (Accounting Standards) Rules, 2021, as amended. The financial statements and the notes appended
      thereto include all material disclosures necessary to show a true and fair view of
      the state of affairs and profit or loss of the Company, and the
      disclosures required to be made therein under the Companies Act, 2013.

      There is no change in the accounting policies during the year. We have reviewed the
      Company's accounting policies and estimation techniques used in the preparation of
      the financial statements and confirm that they are appropriate to give a true and
      fair view in the Company's particular circumstances.
