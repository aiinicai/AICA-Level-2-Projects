# AUTHORED from the firm's own MRL precedent.
#
# The precedent is a live client file. Wording is adapted; nothing specific
# to that client is carried over. See scripts note in the authoring script.

id: mrl.charges
document: mrl
order: 300
number: ""
title: "Registration and Satisfaction of Charges"
clause_ref: "s.77; s.82; Schedule III"
effective_from: "2021-04-01"
effective_to: null

needs_review: false

input:
  key: mrl.charges
  label: "Charges or satisfaction pending registration with the Registrar"
  datatype: select
  carry_forward: prompt
  mandatory: true
  options:
    - { value: "none", label: "None pending" }
    - { value: "pending", label: "Pending registration — describe" }

variants:
  - when: "value == 'none'"
    body: >
      There are no charges, or satisfaction of charges, which are required to be registered
      with the Registrar of Companies and which remain unregistered beyond the statutory
      period.

  - when: "value == 'pending'"
    body: >
      The charges, or the satisfaction of charges, which are required to be registered with
      the Registrar of Companies and which remain unregistered beyond the statutory period,
      together with the reasons, are described below:
    requires_narrative: true
    severity: exception
