# AUTHORED from the firm's own MRL precedent.
#
# The precedent is a live client file. Wording is adapted; nothing specific
# to that client is carried over. See scripts note in the authoring script.

id: mrl.crypto
document: mrl
order: 250
number: ""
title: "Crypto Currency and Virtual Digital Assets"
clause_ref: "Schedule III, Division I/II, General Instructions"
effective_from: "2022-03-31"
effective_to: null

needs_review: false

input:
  key: mrl.crypto
  label: "Crypto currency or virtual currency transactions"
  datatype: select
  carry_forward: prompt
  mandatory: true
  options:
    - { value: "none", label: "None traded or invested in" }
    - { value: "held", label: "Traded or invested in — disclosures made" }

variants:
  - when: "value == 'none'"
    body: >
      The Company has not traded or invested in crypto currency or virtual currency during
      the financial year.

  - when: "value == 'held'"
    body: >
      The Company has traded or invested in crypto currency or virtual currency during the
      financial year, and the profit or loss on such transactions, the amount held as at
      the balance sheet date, and any deposits or advances from any person for the purpose
      of trading or investing in crypto currency or virtual currency, have been disclosed in
      the financial statements.
