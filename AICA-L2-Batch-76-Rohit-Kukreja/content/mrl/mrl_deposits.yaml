# AUTHORED from the firm's own MRL precedent.
#
# The precedent is a live client file. Wording is adapted; nothing specific
# to that client is carried over. See scripts note in the authoring script.
#
# AUTHORED — the precedent has no deposits representation, its client having
# accepted none and the point not being separately covered.

id: mrl.deposits
document: mrl
order: 200
number: ""
title: "Deposits under Sections 73 to 76"
clause_ref: "s.73 to s.76; Companies (Acceptance of Deposits) Rules, 2014"
effective_from: "2014-04-01"
effective_to: null

needs_review: false

input:
  key: mrl.deposits
  label: "Deposits and amounts deemed to be deposits"
  datatype: select
  carry_forward: prompt
  mandatory: true
  options:
    - { value: "none", label: "None accepted" }
    - { value: "accepted", label: "Accepted — directives and rules complied with" }
    - { value: "not_complied", label: "Accepted — non-compliance to be described" }

variants:
  - when: "value == 'none'"
    body: >
      The Company has not accepted any deposits, or amounts which are deemed to be
      deposits, from the public within the meaning of Sections 73 to 76 of the Companies
      Act, 2013 and the Companies (Acceptance of Deposits) Rules, 2014.

  - when: "value == 'accepted'"
    body: >
      In respect of the deposits accepted by the Company, or amounts which are deemed to be
      deposits, the directives issued by the Reserve Bank of India and the provisions of
      Sections 73 to 76 or any other relevant provisions of the Companies Act, 2013 and the
      rules made thereunder, have been complied with.

  - when: "value == 'not_complied'"
    body: >
      In respect of the deposits accepted by the Company, or amounts which are deemed to be
      deposits, the following instances of non-compliance with the directives issued by the
      Reserve Bank of India or with Sections 73 to 76 of the Companies Act, 2013 have
      arisen:
    requires_narrative: true
    severity: exception
