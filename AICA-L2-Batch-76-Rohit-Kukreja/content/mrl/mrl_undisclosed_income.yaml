# AUTHORED from the firm's own MRL precedent.
#
# The precedent is a live client file. Wording is adapted; nothing specific
# to that client is carried over. See scripts note in the authoring script.

id: mrl.undisclosed.income
document: mrl
order: 260
number: ""
title: "Undisclosed Income Surrendered in Tax Assessments"
clause_ref: "Income-tax Act, 1961; CARO 2020 para 3(viii)"
effective_from: "2021-04-01"
effective_to: null

needs_review: false

input:
  key: mrl.undisclosed.income
  label: "Transactions surrendered or disclosed as income in tax assessments"
  datatype: select
  carry_forward: prompt
  mandatory: true
  options:
    - { value: "none", label: "None" }
    - { value: "surrendered", label: "Surrendered or disclosed — describe" }

variants:
  - when: "value == 'none'"
    body: >
      There are no transactions which are not recorded in the books of account that have
      been surrendered or disclosed as income during the year in the tax assessments under
      the Income-tax Act, 1961.

  - when: "value == 'surrendered'"
    body: >
      Transactions which were not recorded in the books of account have been surrendered or
      disclosed as income during the year in the tax assessments under the Income-tax Act,
      1961, as described below, and have been properly recorded in the books of account
      during the year:
    requires_narrative: true
    severity: exception
