# AUTHORED from the firm's own MRL precedent.
#
# The precedent is a live client file. Wording is adapted; nothing specific
# to that client is carried over. See scripts note in the authoring script.
#
# The precedent names the client's accounting package. The name of the
# software is client data and is not carried; where the firm wants it named
# in a particular letter it is a narrative.
#
# SETTLED — the partner fixed the commencement at 1 April 2023 on 16 August
# 2026. See docs/GATE_A_DECISIONS.md, decision 2.
#
# The date below is the FY END that corresponds to a year commencing
# 01-04-2023, because the loader filters on FY end. It moves with
# `rule11.g`; changing one without the other would let the auditor's report
# and the representation letter disagree about which years the audit trail
# requirement covers. Pinned by TestGateADecisions.

id: mrl.audit.trail
document: mrl
order: 230
number: ""
title: "Audit Trail in the Accounting Software"
clause_ref: "Rule 3(1), Companies (Accounts) Rules, 2014; Rule 11(g)"
effective_from: "2024-03-31"
effective_to: null
render_as: section

needs_review: false

input:
  key: mrl.audit.trail
  label: "Audit trail feature — use, operation and preservation"
  datatype: select
  carry_forward: prompt
  mandatory: true
  options:
    - { value: "throughout", label: "Enabled and operated throughout the year; not tampered with" }
    - { value: "exception", label: "Exception — describe it" }

variants:
  - when: "value == 'throughout'"
    body: >
      Audit Trail

      We are responsible for establishing and maintaining adequate and effective controls
      for identifying, maintaining, controlling and monitoring audit trails on a consistent
      basis. We have performed an evaluation and made an assessment of the adequacy and
      effectiveness of the audit trail feature of the Company's accounting software in
      recording an audit trail of each and every transaction, and of creating an edit log
      of each change made in the books of account along with the date when such changes were
      made.

      Based on that assessment we conclude that the Company uses accounting software for
      maintaining its books of account which has a feature of recording audit trail, that
      the feature has operated throughout the year for all relevant transactions recorded in
      the software, that the audit trail has been preserved by the Company as per the
      statutory requirements for record retention, and that we have not come across any
      instance of the audit trail feature being tampered with. No one is able to change the
      date and time of the system.

      We have disclosed to you all deficiencies identified as part of our evaluation,
      including separately disclosing those we believe to be significant deficiencies. We
      have not used the procedures performed by you during the audit as part of the basis
      for our own assessment. With respect to compliance with the Companies (Accounts)
      Rules, 2014 we have provided you with all information, records and documentation
      relevant to your assessment of the accounting software, any additional information
      you have requested, and unrestricted access to those within the Company. There are no
      changes in the accounting software from the balance sheet date to the date of this
      letter.

  - when: "value == 'exception'"
    body: >
      Audit Trail

      We are responsible for establishing and maintaining adequate and effective controls
      for identifying, maintaining, controlling and monitoring audit trails on a consistent
      basis, and we have performed an evaluation of the audit trail feature of the
      Company's accounting software. The exceptions arising from that evaluation are
      described below:
    requires_narrative: true
    severity: exception
