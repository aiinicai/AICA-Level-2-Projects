# AUTHORED.
#
# NOT PRODUCED BY THE SCAFFOLDER. `scripts/scaffold_clauses.py` carries a
# hand-written clause table rather than reading the approved register, and
# this row was never transcribed into it — so the document had no such
# paragraph at all. tests/test_register_reconciliation.py now fails if any
# approved row is missing.

# Firm wording — the layout of the precedent MRL, which opens with the
# auditor's name and address, the date, "Dear Sir," and three paragraphs
# before the representations begin.
#
# The letter is FROM the company TO the auditor, so the addressee is the
# firm. Every value is interpolated: the precedent is a live client file and
# no name from it appears anywhere in this tool.
#
# SETTLED — no engagement letter date, 16 August 2026. Decision 12 in
# docs/GATE_A_DECISIONS.md.
#
# The firm's precedent cites it ("the audit engagement letter dated __").
# The partner directed that the date be left out, so no field was added to
# the engagement and the reference below names the engagement letter
# without a date. Do not add one back without asking.

id: mrl.header
document: mrl
order: 10
number: ""
title: "Letterhead, Date, Addressee and Reference to the Audit"
clause_ref: "SA 580 paras 10-11"
effective_from: "2014-04-01"
effective_to: null

needs_review: false

# CASH FLOW STATEMENT and SUBJECT LINE, 20 August 2026 (decision 49).
# s.2(40) first proviso for the cash flow statement; the subject line was
# reported missing by the firm's team and sits above the salutation, the
# standard order for a professional letter.

variants:
  # AUTHORED note on structure: this clause has no input. The reporting
  # framework is a typed column on the client profile, and `mrl.framework`
  # already branches on it — asking again here would be a second place for
  # the two to disagree about which statements the letter covers.
  - when: "framework == 'indas'"
    body: >
      {{ firm_name }}

      Chartered Accountants

      {{ firm_address }}

      {{ report_date_long }}

      Sub: Management Representation Letter in connection with the Statutory Audit of the
      Financial Statements for the year ended {{ fy_end_long }}

      Dear Sir,

      This representation letter is provided in connection with your audit of the financial
      statements of {{ company_name }} ("the Company") which comprise the Balance Sheet as
      at {{ fy_end_long }}, the Statement of Profit and Loss (including Other Comprehensive
      Income), the Statement of Changes in Equity and the Statement of Cash Flows for the
      year then ended, and notes to the financial statements, including a summary of
      material accounting policies and other explanatory information.

      We acknowledge our responsibility, as set out in the terms of the audit engagement
      letter, for preparing the financial statements of the Company which give a true and
      fair view of the state of affairs of the Company as at
      {{ fy_end_long }} and of its profit or loss, other comprehensive income, changes in
      equity and cash flows for the year then ended, in accordance with the Indian
      Accounting Standards.

      We confirm that, to the best of our knowledge and belief, having made such inquiries
      as we considered necessary for the purpose of appropriately informing ourselves, we
      provide the following representations:

  # Firm wording — the precedent is an Accounting Standards company.
  - when: "cash_flow_required"
    body: >
      {{ firm_name }}

      Chartered Accountants

      {{ firm_address }}

      {{ report_date_long }}

