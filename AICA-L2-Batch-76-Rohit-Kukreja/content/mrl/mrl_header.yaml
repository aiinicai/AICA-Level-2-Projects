      at {{ fy_end_long }}, the Statement of Profit and Loss and the Statement of Cash
      Flows for the year then ended, and notes to the financial statements, including a
      summary of significant accounting policies and other explanatory information.

      We acknowledge our responsibility, as set out in the terms of the audit engagement
