# AUTHORED from the firm's own MRL precedent.
#
# The precedent is a live client file. Wording is adapted; nothing specific
# to that client is carried over. See scripts note in the authoring script.
#
# The precedent's going concern paragraph refers to an assessment covering
# at least twelve months from the balance sheet date, which is the period
# the accounting standards require to be taken into account.

id: mrl.going.concern
document: mrl
order: 140
number: ""
title: "Going Concern"
clause_ref: "SA 570 (Revised) para 16(e)"
effective_from: "2014-04-01"
effective_to: null
render_as: section

needs_review: false

input:
  key: mrl.going.concern
  label: "Going concern assessment"
  datatype: select
  carry_forward: prompt
  mandatory: true
  options:
    - { value: "appropriate", label: "Going concern basis appropriate — no material uncertainty" }
    - { value: "uncertainty", label: "Material uncertainty exists — describe the plans" }

variants:
  - when: "value == 'appropriate'"
    body: >
      Going Concern

      We have made an assessment of the Company's ability to continue as a going concern,
      taking into account all available information about the future covering a period of
      at least twelve months from the balance sheet date. We are satisfied that the going
      concern basis of accounting is appropriate, and we are not aware of any material
      uncertainties related to events or conditions that may cast significant doubt upon
      the Company's ability to continue as a going concern.

  - when: "value == 'uncertainty'"
    body: >
      Going Concern

      We have made an assessment of the Company's ability to continue as a going concern,
      taking into account all available information about the future covering a period of
      at least twelve months from the balance sheet date. A material uncertainty exists
      which may cast significant doubt upon the Company's ability to continue as a going
      concern. Our plans for future actions, and our assessment of the feasibility of those
      plans, are set out below, and the relevant disclosures have been made in the
      financial statements:
    requires_narrative: true
    severity: exception
