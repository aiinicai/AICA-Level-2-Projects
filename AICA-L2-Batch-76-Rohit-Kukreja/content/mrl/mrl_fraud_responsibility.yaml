id: mrl.fraud.responsibility
document: mrl
order: 100
number: ""
title: "Responsibility for Internal Control to Prevent and Detect Fraud"
clause_ref: "SA 240 para 39(a); s.177(9)"
effective_from: "2014-04-01"
effective_to: null
render_as: section

needs_review: false

variants:
  - body: >
      Fraud — Our Responsibility

      We acknowledge our responsibility for the preparation of financial statements that are
      free from material misstatement, whether due to fraud or error. In particular, we
      confirm that we are responsible for designing, implementing and maintaining internal
      controls relevant to the preparation and fair presentation of the financial
      statements which are free from material misstatement, whether due to fraud or error;
      for setting up a vigil mechanism for reporting suspected fraud and administering that
      mechanism effectively; for taking appropriate action to detect fraud and any wrongful
      gain or loss incurred on account of fraud; for taking appropriate action against
      those responsible; and for addressing the control weaknesses which were the root
      cause of any fraud and strengthening the internal control system.
