# AUTHORED from the firm's own MRL precedent.
#
# The precedent is a live client file. Wording is adapted; nothing specific
# to that client is carried over. See scripts note in the authoring script.
#
# The register makes this a free-text row, and rightly: the significant
# assumptions are specific to the year. The standing sentences are fixed and
# the assumptions themselves are a narrative.

id: mrl.estimates
document: mrl
order: 60
number: ""
title: "Significant Assumptions Used in Making Accounting Estimates"
clause_ref: "SA 540; SA 580 para 10"
effective_from: "2014-04-01"
effective_to: null

needs_review: false

input:
  key: mrl.estimates
  label: "Significant accounting estimates"
  datatype: select
  carry_forward: prompt
  mandatory: true
  options:
    - { value: "standard", label: "Standard representation only" }
    - { value: "described", label: "Describe the significant assumptions" }

variants:
  - when: "value == 'standard'"
    body: >
      The methods, the data and the significant assumptions used in making accounting
      estimates, and their related disclosures, are appropriate to achieve recognition,
      measurement and disclosure that is reasonable in the context of the applicable
      financial reporting framework. The disclosures related to accounting estimates are
      complete and appropriate. There is neither any plan nor any intention that may affect
      the carrying value or classification of assets or liabilities reflected in the
      financial statements.

  - when: "value == 'described'"
    body: >
      The methods, the data and the significant assumptions used in making accounting
      estimates, and their related disclosures, are appropriate to achieve recognition,
      measurement and disclosure that is reasonable in the context of the applicable
      financial reporting framework. The significant assumptions used are set out below:
    requires_narrative: true
