# AUTHORED from the firm's own MRL precedent.
#
# The precedent is a live client file. Wording is adapted; nothing specific
# to that client is carried over. See scripts note in the authoring script.
#
# The precedent's "Accounting records" list, which tracks section 134(5).
# Its eight-year retention sentence follows section 128(5) and is kept.

id: mrl.resp.fs
document: mrl
order: 20
number: ""
title: "Management's Responsibility for the Financial Statements"
clause_ref: "SA 580 para 10; s.134(5), s.128(5)"
effective_from: "2014-04-01"
effective_to: null
render_as: section

needs_review: false

# CASH FLOW STATEMENT, split into a pair of variants (partner's instruction).
# Section 2(40) proviso: a One Person Company, a small company, a dormant
# company and a start-up private company need not include a cash flow
# statement. Naming one in a document the firm signs, for a company that
# prepares none, describes work that was not done.
#
variants:
  - when: "cash_flow_required"
    body: >
      Accounting Records

      We acknowledge our responsibility for the preparation of the annual accounts in
      accordance with the applicable accounting standards, and for providing proper
      explanation relating to any material departures from those standards; for the
      selection of accounting policies and applying them consistently, and making
      judgements and estimates that are reasonable and prudent so as to give a true and
      fair view of the state of affairs of the Company at the end of the financial year and
      of its profit or loss and cash flows for that period; for taking proper and
      sufficient care for the maintenance of adequate accounting records for safeguarding
      the assets of the Company and for preventing and detecting fraud and other
      irregularities; for laying down internal financial controls to be followed by the
      Company and ensuring that such internal financial controls are adequate and were
      operating effectively; and for devising proper systems to ensure compliance with the
      provisions of all applicable laws and that such systems were adequate and operating
      effectively.

      Further, we maintain all the books of account for a period of not less than eight
      financial years immediately preceding the current financial year, together with the
      underlying documents relevant to support the books of account, and the back-up of the
      books of account maintained in electronic mode is kept in servers physically located
      in India on a daily basis.

  - when: "not cash_flow_required"
    body: >
      Accounting Records

      We acknowledge our responsibility for the preparation of the annual accounts in
      accordance with the applicable accounting standards, and for providing proper
      explanation relating to any material departures from those standards; for the
      selection of accounting policies and applying them consistently, and making
      judgements and estimates that are reasonable and prudent so as to give a true and
      fair view of the state of affairs of the Company at the end of the financial year and
      of its profit or loss for that period; for taking proper and
      sufficient care for the maintenance of adequate accounting records for safeguarding
      the assets of the Company and for preventing and detecting fraud and other
      irregularities; for laying down internal financial controls to be followed by the
      Company and ensuring that such internal financial controls are adequate and were
      operating effectively; and for devising proper systems to ensure compliance with the
      provisions of all applicable laws and that such systems were adequate and operating
      effectively.

      Further, we maintain all the books of account for a period of not less than eight
      financial years immediately preceding the current financial year, together with the
      underlying documents relevant to support the books of account, and the back-up of the
      books of account maintained in electronic mode is kept in servers physically located
      in India on a daily basis.
