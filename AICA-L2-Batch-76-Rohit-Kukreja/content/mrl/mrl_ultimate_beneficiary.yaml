# AUTHORED from the firm's own MRL precedent.
#
# The precedent is a live client file. Wording is adapted; nothing specific
# to that client is carried over. See scripts note in the authoring script.
#
# The precedent's two paragraphs on intermediaries and funding parties,
# which correspond to Rule 11(e)(i) and (ii). The letter and the report
# clause must say the same thing, so both are driven from the same answer.

id: mrl.ultimate.beneficiary
document: mrl
order: 270
number: ""
title: "Intermediaries, Funding Parties and Ultimate Beneficiaries"
clause_ref: "Rule 11(e), Companies (Audit and Auditors) Rules, 2014"
effective_from: "2022-03-31"
effective_to: null
render_as: section

needs_review: false

input:
  key: mrl.ultimate.beneficiary
  label: "Funds advanced to intermediaries or received from funding parties"
  datatype: select
  carry_forward: prompt
  mandatory: true
  options:
    - { value: "nil_both", label: "None advanced and none received" }
    - { value: "transactions", label: "Such transactions exist — describe them" }

variants:
  - when: "value == 'nil_both'"
    body: >
      Intermediaries and Funding Parties

      No funds have been advanced or loaned or invested, either from borrowed funds or
      share premium or any other sources or kind of funds, by the Company to or in any
      other person or entity, including foreign entities ("Intermediaries"), with the
      understanding, whether recorded in writing or otherwise, that the Intermediary shall
      directly or indirectly lend or invest in other persons or entities identified in any
      manner whatsoever by or on behalf of the Company ("Ultimate Beneficiaries"), or
      provide any guarantee, security or the like on behalf of the Ultimate Beneficiaries.

      No funds have been received by the Company from any person or entity, including
      foreign entities ("Funding Parties"), with the understanding, whether recorded in
      writing or otherwise, that the Company shall directly or indirectly lend or invest in
      other persons or entities identified in any manner whatsoever by or on behalf of the
      Funding Party ("Ultimate Beneficiaries"), or provide any guarantee, security or the
      like on behalf of the Ultimate Beneficiaries.

  - when: "value == 'transactions'"
    body: >
      Intermediaries and Funding Parties

      Other than as disclosed in the notes to the financial statements and described below,
      no funds have been advanced or loaned or invested by the Company to or in any
      Intermediary, and no funds have been received by the Company from any Funding Party,
      with the understanding referred to in Rule 11(e) of the Companies (Audit and
      Auditors) Rules, 2014:
    requires_narrative: true
    severity: exception
