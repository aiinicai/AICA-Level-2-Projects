id: mrl.bank.balances
document: mrl
order: 180
number: ""
title: "Completeness of Bank Accounts and Balances"
clause_ref: "SA 505; SA 580 para 10"
effective_from: "2014-04-01"
effective_to: null
render_as: section

needs_review: false

variants:
  - body: >
      Cash and Bank Balances

      The Balance Sheet includes all cash and bank balances of the Company. Cash balances
      have been physically verified at the balance sheet date and no discrepancies have
      been found. There are no old or unusual reconciling items between the bank balances
      as per the books of account and the bank statements as at the year end which would
      result in any adjustment to the financial statements.

      We have disclosed to you all earmarked balances with banks, and all balances held as
      margin money or as security against borrowings, guarantees or other commitments. As
      at the balance sheet date there are no bank accounts of the Company other than those
      disclosed in the financial statements.
