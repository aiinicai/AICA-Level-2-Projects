# AUTHORED from the firm's own MRL precedent.
#
# The precedent is a live client file. Wording is adapted; nothing specific
# to that client is carried over. See scripts note in the authoring script.

id: mrl.layers
document: mrl
order: 310
number: ""
title: "Number of Layers of Subsidiaries"
clause_ref: "s.2(87); Companies (Restriction on Number of Layers) Rules, 2017"
effective_from: "2021-04-01"
effective_to: null

needs_review: false

input:
  key: mrl.layers
  label: "Compliance with the restriction on the number of layers"
  datatype: select
  carry_forward: prompt
  mandatory: true
  options:
    - { value: "complied", label: "Complied with" }
    - { value: "na", label: "Not applicable — no subsidiaries" }
    - { value: "not_complied", label: "Not complied with — describe" }

variants:
  - when: "value == 'complied'"
    body: >
      The Company has complied with the restriction on the number of layers prescribed under
      clause (87) of Section 2 of the Companies Act, 2013 read with the Companies
      (Restriction on Number of Layers) Rules, 2017.

  - when: "value == 'na'"
    body: >
      The Company does not have any subsidiary, and accordingly the restriction on the
      number of layers prescribed under clause (87) of Section 2 of the Companies Act, 2013
      read with the Companies (Restriction on Number of Layers) Rules, 2017 does not apply.

  - when: "value == 'not_complied'"
    body: >
      The Company has not complied with the restriction on the number of layers prescribed
      under clause (87) of Section 2 of the Companies Act, 2013 read with the Companies
      (Restriction on Number of Layers) Rules, 2017, as described below:
    requires_narrative: true
    severity: exception
