# AUTHORED from the firm's own MRL precedent.
#
# The precedent is a live client file. Wording is adapted; nothing specific
# to that client is carried over. See scripts note in the authoring script.

id: mrl.csr
document: mrl
order: 220
number: ""
title: "Corporate Social Responsibility under Section 135"
clause_ref: "s.135; Companies (Corporate Social Responsibility Policy) Rules, 2014"
effective_from: "2014-04-01"
effective_to: null

needs_review: false

input:
  key: mrl.csr
  label: "Corporate social responsibility"
  datatype: select
  carry_forward: prompt
  mandatory: true
  options:
    - { value: "na", label: "Section 135 not applicable" }
    - { value: "complied", label: "Applicable — complied with" }
    - { value: "unspent", label: "Applicable — unspent amount to be described" }

variants:
  - when: "value == 'na'"
    body: >
      The provisions of Section 135 of the Companies Act, 2013 relating to corporate social
      responsibility are not applicable to the Company.

  - when: "value == 'complied'"
    body: >
      The Company has complied with the provisions relating to corporate social
      responsibility as prescribed under Section 135 of the Companies Act, 2013 read with
      the Companies (Corporate Social Responsibility Policy) Rules, 2014, and the amount
      required to be spent has been spent during the year.

  - when: "value == 'unspent'"
    body: >
      The Company is required to comply with Section 135 of the Companies Act, 2013. The
      unspent amount, the reason for it, and the transfer of that amount to the fund
      specified in Schedule VII or to a special account as required by sub-sections (5) and
      (6) of Section 135, are described below:
    requires_narrative: true
    severity: exception
