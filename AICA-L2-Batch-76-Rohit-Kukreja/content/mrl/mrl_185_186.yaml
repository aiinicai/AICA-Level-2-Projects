# AUTHORED from the firm's own MRL precedent.
#
# The precedent is a live client file. Wording is adapted; nothing specific
# to that client is carried over. See scripts note in the authoring script.

id: mrl.185.186
document: mrl
order: 210
number: ""
title: "Loans, Investments, Guarantees and Security under Sections 185 and 186"
clause_ref: "s.185; s.186"
effective_from: "2014-04-01"
effective_to: null

needs_review: false

input:
  key: mrl.185.186
  label: "Loans, investments, guarantees and security"
  datatype: select
  carry_forward: prompt
  mandatory: true
  options:
    - { value: "none", label: "None given or made" }
    - { value: "complied", label: "Given or made — sections 185 and 186 complied with" }
    - { value: "not_complied", label: "Non-compliance to be described" }

variants:
  - when: "value == 'none'"
    body: >
      No loans have been given, no investments made, and no guarantee or security provided
      by the Company during the year in respect of which the provisions of Sections 185 and
      186 of the Companies Act, 2013 apply.

  - when: "value == 'complied'"
    body: >
      In respect of the loans given, investments made, and guarantees and security
      provided by the Company, the provisions of Sections 185 and 186 of the Companies Act,
      2013 have been complied with.

  - when: "value == 'not_complied'"
    body: >
      In respect of the loans given, investments made, and guarantees and security provided
      by the Company, the following instances of non-compliance with Sections 185 and 186 of
      the Companies Act, 2013 have arisen:
    requires_narrative: true
    severity: exception
