# AUTHORED from the firm's own MRL precedent.
#
# The precedent is a live client file. Wording is adapted; nothing specific
# to that client is carried over. See scripts note in the authoring script.
#
# Condensed from the precedent's inventory section. Its client-specific
# sentences — the plans for particular product lines and the named locations
# — are not carried.

id: mrl.inventory
document: mrl
order: 150
number: ""
title: "Inventory — Existence, Condition, Quantities and Valuation"
clause_ref: "SA 501 paras 4-8; AS 2 / Ind AS 2"
effective_from: "2014-04-01"
effective_to: null
render_as: section

needs_review: false

input:
  key: mrl.inventory
  label: "Inventory held by the Company"
  datatype: select
  carry_forward: prompt
  mandatory: true
  options:
    - { value: "held", label: "Inventory held" }
    - { value: "none", label: "No inventory held" }

variants:
  - when: "value == 'held'"
    body: >
      Inventories

      The whole of the inventory was the property of the Company as at the balance sheet
      date, and all inventory owned by the Company, wherever located, has been recorded,
      including goods sent on consignment. The inventory does not include goods purchased
      for which liabilities have not been provided, goods returned by customers without
      credit to their accounts, or goods billed to customers in advance of delivery.

      Inventory quantities at the year end were determined from the Company's inventory
      records after adjusting for the differences identified during physical verification.
      Inventories are valued at the lower of cost and net realisable value, and the cost of
      inventories includes all expenditure incurred in bringing the product to its present
      location and condition.

      We have no plans to abandon product lines, and no other plans or intentions, that
      will result in any excess or obsolete inventory. Provision has been made, where
      material, for losses arising from damaged, unusable or obsolete inventories, to
      reduce them to their estimated net realisable value.

  - when: "value == 'none'"
    body: >
      Inventories

      The Company did not hold any inventory as at the balance sheet date or at any time
      during the year.
