# AUTHORED from the firm's own MRL precedent.
#
# The precedent is a live client file. Wording is adapted; nothing specific
# to that client is carried over. See scripts note in the authoring script.
#
# The precedent lists the client's related parties by name in a table. That
# list is client data and is not carried. The list of related parties for
# each engagement comes from the client's own related party register, so
# this clause represents the completeness of that list rather than restating
# it in prose.

id: mrl.related.parties
document: mrl
order: 70
number: ""
title: "Related Party Relationships and Transactions"
clause_ref: "SA 550; s.188; AS 18 / Ind AS 24"
effective_from: "2014-04-01"
effective_to: null
render_as: section

needs_review: false

variants:
  - body: >
      Related Parties

      We have disclosed to you the identity of the Company's related parties and all
      related party relationships and transactions of which we are aware. The financial
      statements are free from material misstatement, including omissions, with regard to
      related parties and transactions with related parties, and all such relationships and
      transactions have been appropriately accounted for and disclosed.

      All related party transactions were conducted on terms equivalent to those prevailing
      in an arm's length transaction and in the ordinary course of business, and do not
      involve any undisclosed side agreements. The approvals required under Section 188 of
      the Companies Act, 2013 have been obtained where applicable.

      We have maintained proper information and documentation, along with supporting
      workings and justification, as required under the transfer pricing provisions of the
      Income-tax Act, 1961, in respect of the Company's international and specified
      domestic transactions.
