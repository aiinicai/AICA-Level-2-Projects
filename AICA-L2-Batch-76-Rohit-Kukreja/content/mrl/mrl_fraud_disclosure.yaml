# AUTHORED from the firm's own MRL precedent.
#
# The precedent is a live client file. Wording is adapted; nothing specific
# to that client is carried over. See scripts note in the authoring script.
#
# The precedent sets out two identified fraud matters in detail. Those are
# that client's facts and are NOT carried here — the exception variant asks
# for the matters to be described instead.

id: mrl.fraud.disclosure
document: mrl
order: 110
number: ""
title: "Disclosure of Known or Suspected Fraud"
clause_ref: "SA 240 paras 39(b)-(d); s.143(12)"
effective_from: "2014-04-01"
effective_to: null
render_as: section

needs_review: false

input:
  key: mrl.fraud.disclosure
  label: "Known or suspected fraud, and allegations of fraud"
  datatype: select
  carry_forward: never
  mandatory: true
  options:
    - { value: "none", label: "None known, suspected or alleged" }
    - { value: "identified", label: "Matters identified — describe them" }

variants:
  - when: "value == 'none'"
    body: >
      Fraud — Disclosure

      We have disclosed to you the results of our assessment of the risk that the financial
      statements may be materially misstated as a result of fraud. We have disclosed to you
      all information in relation to fraud or suspected fraud that we are aware of and that
      affects the Company and involves management, employees who have significant roles in
      internal control, or others where the fraud could have a material effect on the
      financial statements; and all information in relation to allegations of fraud or
      suspected fraud affecting the Company's financial statements communicated by
      employees, former employees, analysts, regulators or others.

      There are no such matters to report. We have not withheld from you any relevant
      information of which we are aware that would have an implication on the discharge of
      your responsibility to report fraud under the Companies Act, 2013. We have disclosed
      to you all information regarding investigations into possible fraud, or into
      non-compliance or suspected non-compliance with laws and regulations including
      illegal acts, that we have undertaken or that have been undertaken on our behalf.

  - when: "value == 'identified'"
    body: >
      Fraud — Disclosure

      We have disclosed to you the results of our assessment of the risk that the financial
      statements may be materially misstated as a result of fraud, and all information in
      relation to fraud or suspected fraud that we are aware of and that affects the
      Company, and to allegations of fraud or suspected fraud communicated by employees,
      former employees, analysts, regulators or others. We have not withheld from you any
      relevant information of which we are aware that would have an implication on the
      discharge of your responsibility to report fraud under the Companies Act, 2013. The
      matters identified during the year are described below:
    requires_narrative: true
    severity: exception
