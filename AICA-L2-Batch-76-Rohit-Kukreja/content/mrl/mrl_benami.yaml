# AUTHORED from the firm's own MRL precedent.
#
# The precedent is a live client file. Wording is adapted; nothing specific
# to that client is carried over. See scripts note in the authoring script.

id: mrl.benami
document: mrl
order: 240
number: ""
title: "Benami Property Proceedings"
clause_ref: "Benami Transactions (Prohibition) Act, 1988; CARO 2020 para 3(i)(e)"
effective_from: "2021-04-01"
effective_to: null

needs_review: false

input:
  key: mrl.benami
  label: "Proceedings for holding benami property"
  datatype: select
  carry_forward: prompt
  mandatory: true
  options:
    - { value: "none", label: "None initiated or pending" }
    - { value: "pending", label: "Initiated or pending — describe them" }

variants:
  - when: "value == 'none'"
    body: >
      No proceedings have been initiated or are pending against the Company for holding any
      benami property under the Benami Transactions (Prohibition) Act, 1988 (45 of 1988) and
      the rules made thereunder.

  - when: "value == 'pending'"
    body: >
      Proceedings have been initiated or are pending against the Company for holding benami
      property under the Benami Transactions (Prohibition) Act, 1988 (45 of 1988) and the
      rules made thereunder, as described below, and the disclosures required have been made
      in the financial statements:
    requires_narrative: true
    severity: exception
