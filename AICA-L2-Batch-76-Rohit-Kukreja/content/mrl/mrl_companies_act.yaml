variants:
  - body: >
      Compliance with the Companies Act, 2013

      Loans and advances, if any, made by the Company on the basis of security have been
      properly secured, and the terms on which they have been made are not prejudicial to
      the interests of the Company or its members. Assets of the Company consisting of
      shares, debentures and other securities have not been sold at a price less than that
      at which they were purchased. Loans and advances, if any, made by the Company have
      not been shown as deposits. No expenses of a personal nature, other than those
      payable under contractual obligations or in accordance with generally accepted
      business practice, and no expenses unrelated to the Company's business, have been
      charged to the financial statements.

      Where it is stated in the books and documents of the Company that any shares have
      been allotted for cash, cash has actually been received in respect of such allotment,
      and the position as stated in the books of account and the Balance Sheet is correct,
      regular and not misleading.

      None of the directors is disqualified as on {{ fy_end_long }} from being appointed as
      a director in terms of Section 164(2) of the Companies Act, 2013.
