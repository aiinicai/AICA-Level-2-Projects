# AUTHORED from the firm's own MRL precedent.
#
# The precedent is a live client file. Wording is adapted; nothing specific
# to that client is carried over. See scripts note in the authoring script.

id: mrl.wilful.defaulter
document: mrl
order: 280
number: ""
title: "Wilful Defaulter"
clause_ref: "CARO 2020 para 3(ix)(b); Schedule III"
effective_from: "2021-04-01"
effective_to: null

needs_review: false

input:
  key: mrl.wilful.defaulter
  label: "Declaration as a wilful defaulter"
  datatype: select
  carry_forward: prompt
  mandatory: true
  options:
    - { value: "none", label: "Not declared a wilful defaulter" }
    - { value: "declared", label: "Declared a wilful defaulter — describe" }

variants:
  - when: "value == 'none'"
    body: >
      The Company has not been declared a wilful defaulter by any bank or financial
      institution or other lender, and has not received any show cause notice in that regard
      up to the date of this letter.

  - when: "value == 'declared'"
    body: >
      The Company has been declared a wilful defaulter by a bank or financial institution or
      other lender, as described below, and the disclosures required have been made in the
      financial statements:
    requires_narrative: true
    severity: exception
