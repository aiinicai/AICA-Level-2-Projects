# AUTHORED from the firm's own MRL precedent.
#
# The precedent is a live client file. Wording is adapted; nothing specific
# to that client is carried over. See scripts note in the authoring script.

id: mrl.struck.off
document: mrl
order: 290
number: ""
title: "Transactions with Companies Struck Off"
clause_ref: "s.248; s.560, Companies Act, 1956; Schedule III"
effective_from: "2021-04-01"
effective_to: null

needs_review: false

input:
  key: mrl.struck.off
  label: "Transactions or balances with struck-off companies"
  datatype: select
  carry_forward: prompt
  mandatory: true
  options:
    - { value: "none", label: "None" }
    - { value: "exist", label: "Transactions or balances exist — disclosed" }

variants:
  - when: "value == 'none'"
    body: >
      There are no transactions with, or balances outstanding in respect of, companies
      struck off under Section 248 of the Companies Act, 2013 or Section 560 of the
      Companies Act, 1956.

  - when: "value == 'exist'"
    body: >
      The transactions with, and balances outstanding in respect of, companies struck off
      under Section 248 of the Companies Act, 2013 or Section 560 of the Companies Act,
      1956 have been disclosed in the notes to the financial statements.
