# AUTHORED from the firm's own Board's Report precedent (FY 2023-24).
#
# The precedent is a live client file. Wording is adapted; nothing specific
# to that client is carried over.
#
# Driven by the `secretarial_audit` applicability flag, the same flag that
# governs bdr.secretarial.remarks. The precedent states the Company is not
# required to obtain a secretarial audit report but cites the Appointment
# and Remuneration of Managerial Personnel Rules for the proposition; the
# citation is corrected to section 204 read with Rule 9.

# NOT IN RULE 8A. Rule 8(6) -- "This rule shall not apply to One Person Company
# or Small Company" -- and Rule 8A then prescribes a closed, exhaustive list of
# what the abridged Board's Report shall contain. s.204 has no counterpart in
# that list, so this paragraph is not required for an OPC or a small company.
# Partner's decision of 20 Aug 2026: for those companies the clause is omitted
# outright -- not defaulted, not left as a placeholder.

id: bdr.secretarial.audit
document: directors_report
order: 360
number: ""
title: "Secretarial Audit Report"
clause_ref: "s.204; Rule 9, Companies (Appointment and Remuneration of Managerial Personnel) Rules, 2014"
effective_from: "2014-04-01"
effective_to: null
render_as: section

applicability:
  requires: [full_board_report]

needs_review: false

input:
  key: bdr.secretarial.audit
  label: "Secretarial audit"
  datatype: select
  carry_forward: prompt
  mandatory: true
  options:
    - { value: "na", label: "Not required to obtain a secretarial audit report" }
    - { value: "annexed", label: "Obtained — annexed in Form MR-3" }

variants:
  - when: "value == 'na'"
    body: >
      Secretarial Audit Report

      The Company is not required to obtain a Secretarial Audit Report under Section 204 of
      the Companies Act, 2013 read with Rule 9 of the Companies (Appointment and
      Remuneration of Managerial Personnel) Rules, 2014.

  - when: "value == 'annexed'"
    body: >
      Secretarial Audit Report

      A Secretarial Audit Report in Form MR-3, issued by a Company Secretary in practice
      under Section 204 of the Companies Act, 2013 read with Rule 9 of the Companies
      (Appointment and Remuneration of Managerial Personnel) Rules, 2014, is annexed to this
      Report.
