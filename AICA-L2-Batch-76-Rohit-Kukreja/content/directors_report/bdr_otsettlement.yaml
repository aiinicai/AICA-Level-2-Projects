# AUTHORED from the firm's own Board's Report precedent (FY 2023-24).
#
# The precedent is a live client file. Wording is adapted; nothing specific
# to that client is carried over.

# NOT IN RULE 8A. Rule 8(6) -- "This rule shall not apply to One Person Company
# or Small Company" -- and Rule 8A then prescribes a closed, exhaustive list of
# what the abridged Board's Report shall contain. Rule 8(5)(xii) has no counterpart in
# that list, so this paragraph is not required for an OPC or a small company.
# Partner's decision of 20 Aug 2026: for those companies the clause is omitted
# outright -- not defaulted, not left as a placeholder.

id: bdr.otsettlement
document: directors_report
order: 350
number: ""
title: "Difference in Valuation on One-Time Settlement"
clause_ref: "Rule 8(5)(xii), Companies (Accounts) Rules, 2014"
effective_from: "2021-03-31"
effective_to: null
render_as: section

applicability:
  requires: [full_board_report]

needs_review: false

input:
  key: bdr.otsettlement
  label: "One-time settlement with banks or financial institutions"
  datatype: select
  carry_forward: never
  mandatory: true
  options:
    - { value: "none", label: "No one-time settlement during the year" }
    - { value: "settled", label: "Settlement made — give the details" }

  # Defaulted to the nil case, unconditionally, and overridable.
  #
  # Asked to derive this from master data, and there is nothing to derive it
  # from: no field records a settlement with a bank, and none should -- a
  # one-time settlement is an event in the year, not an attribute of the
  # company. `borrowings` would only prove the negative case (no loans, so no
  # settlement) and would leave every borrowing company unanswered, which is
  # what made this disclosure vanish from drafts in the first place.
  #
  # So the common answer is assumed and the auditor overrides it. Note this
  # is an assertion the BOARD makes about its own year: where a settlement
  # did occur, the answer must be changed, and the firm-wide default sheet at
  # Admin -> Default Answers is the place to reverse the assumption if the
  # firm would rather be asked every time.
  defaults:
    - { value: "none" }

variants:
  # Firm wording.
  - when: "value == 'none'"
    body: >
      One-Time Settlement with Banks and Financial Institutions

      During the year under review there has been no one-time settlement of loans taken from
      banks or financial institutions.

  - when: "value == 'settled'"
    body: >
      One-Time Settlement with Banks and Financial Institutions

      The details of the difference between the amount of the valuation done at the time of
      one-time settlement and the valuation done while taking the loan from the banks or
      financial institutions, together with the reasons for the difference, are set out
      below:
    requires_narrative: true
    severity: exception
