# AUTHORED from the firm's own Board's Report precedent (FY 2023-24).
#
# The precedent is a live client file. Wording is adapted; nothing specific
# to that client is carried over.

id: bdr.material.changes
document: directors_report
order: 160
number: ""
title: "Material Changes and Commitments After the Year End"
clause_ref: "s.134(3)(l)"
effective_from: "2014-04-01"
effective_to: null
render_as: section

needs_review: false

input:
  key: bdr.material.changes
  label: "Material changes and commitments after the balance sheet date"
  datatype: select
  carry_forward: never
  mandatory: true
  options:
    - { value: "none", label: "None" }
    - { value: "occurred", label: "Occurred — describe them" }

variants:
  - when: "value == 'none'"
    body: >
      Material Changes and Commitments

      There have been no material changes and commitments affecting the financial position
      of the Company which have occurred between the end of the financial year to which the
      financial statements relate and the date of this Report.

  - when: "value == 'occurred'"
    body: >
      Material Changes and Commitments

      The material changes and commitments affecting the financial position of the Company
      which have occurred between the end of the financial year to which the financial
      statements relate and the date of this Report are set out below:
    requires_narrative: true
    severity: exception
