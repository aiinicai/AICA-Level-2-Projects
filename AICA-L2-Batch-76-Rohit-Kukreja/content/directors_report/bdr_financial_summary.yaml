# AUTHORED from the firm's own Board's Report precedent (FY 2023-24).
#
# The precedent is a live client file. Wording is adapted; nothing specific
# to that client is carried over.
#
# The precedent puts a financial table here under "Financial Performance of
# the Company". The figures are a child table so that they are typed once as
# numbers and grouped in the Indian style at render time, rather than pasted
# in as text.

id: bdr.financial.summary
document: directors_report
order: 10
number: ""
title: "Financial Summary or Highlights"
clause_ref: "Rule 8(5)(i), Companies (Accounts) Rules, 2014"
effective_from: "2014-04-01"
effective_to: null
render_as: section

needs_review: false

# FIXED SCHEDULE from 21 August 2026, on the firm's team's instruction
# (decision 73).
#
# The particulars used to be typed. Eight article assistants produced eight
# different sets of line items in eight different orders, and a Board's Report
# that reads differently every year is a Board's Report nobody can compare.
# The lines and their order are the firm's, and are now prescribed here; only
# the figures are entered.
#
# THE THREE SUB-TOTALS are calculated, not typed, so they cannot be left
# disagreeing with the lines above them.
#
# SIGN CONVENTION. "Provision for Tax" and "Provision for Deferred Tax" are
# charges, and are subtracted. A deferred tax CREDIT is therefore entered as a
# negative figure -- in brackets, the way it is written in a set of accounts,
# which the amount parser reads (decision 71).

repeating_block:
  entity: financial_summary
  min_rows: 1
  carry_forward: never
  columns:
    - { key: particulars, label: "Particulars", datatype: text, required: true }
    - { key: current_year, label: "Current year", datatype: amount, required: true }
    - { key: previous_year, label: "Previous year", datatype: amount }

  fixed_rows:
    - { key: revenue,      particulars: "Revenue" }
    - { key: expenses,     particulars: "Expenses" }
    - { key: pbd,          particulars: "Profit/(Loss) before depreciation",
        computed: "revenue - expenses" }
    - { key: depreciation, particulars: "Less: Depreciation" }
    - { key: pad,          particulars: "Profit/(Loss) after depreciation",
        computed: "pbd - depreciation" }
    - { key: tax,          particulars: "Provision for Tax" }
    - { key: deferred_tax, particulars: "Provision for Deferred Tax Asset/(Liability)" }
    - { key: padt,         particulars: "Profit/(Loss) after Depreciation & Tax",
        computed: "pad - tax - deferred_tax" }

variants:
  - body: >
      Financial Summary

      The financial performance of the Company for the financial year ended
      {{ fy_end_long }}, together with the figures for the previous year, is summarised
      below:
    render_block: table
