# AUTHORED.
#
# NOT PRODUCED BY THE SCAFFOLDER. `scripts/scaffold_clauses.py` carries a
# hand-written clause table rather than reading the approved register, and
# this row was never transcribed into it — so the document had no such
# paragraph at all. tests/test_register_reconciliation.py now fails if any
# approved row is missing.

# Section 134(3)(f)(ii) requires the Board to explain in full any
# qualification, reservation or adverse remark made by the company secretary
# in practice in the secretarial audit report.
#
# Driven by the same `secretarial_audit` flag as the secretarial audit clause
# itself, so a company with no secretarial audit is not asked to comment on
# one.

# NOT IN RULE 8A. Rule 8(6) -- "This rule shall not apply to One Person Company
# or Small Company" -- and Rule 8A then prescribes a closed, exhaustive list of
# what the abridged Board's Report shall contain. s.134(3)(f)(ii) has no counterpart in
# that list, so this paragraph is not required for an OPC or a small company.
# Partner's decision of 20 Aug 2026: for those companies the clause is omitted
# outright -- not defaulted, not left as a placeholder.

id: bdr.secretarial.remarks
document: directors_report
order: 335
number: ""
title: "Board's Explanation on Secretarial Audit Remarks"
clause_ref: "s.134(3)(f)(ii); s.204(3)"
effective_from: "2014-04-01"
effective_to: null
render_as: section

applicability:
  requires: [secretarial_audit, full_board_report]

needs_review: false

input:
  key: bdr.secretarial.remarks
  label: "Qualifications or adverse remarks in the secretarial audit report"
  datatype: select
  carry_forward: prompt
  mandatory: true
  options:
    - { value: "none", label: "None" }
    - { value: "remarks", label: "Remarks made — explain" }

variants:
  # AUTHORED — not sourced. The firm's precedent Board's Report is for a
  # company with no secretarial audit.
  - when: "value == 'none'"
    body: >
      Explanations or Comments on Secretarial Audit Remarks

      The Secretarial Audit Report issued by the Company Secretary in practice does not
      contain any qualification, reservation, adverse remark or disclaimer.

  - when: "value == 'remarks'"
    body: >
      Explanations or Comments on Secretarial Audit Remarks

      The Board's explanation, in full, on the qualifications, reservations, adverse
      remarks or disclaimers made by the Company Secretary in practice in the Secretarial
      Audit Report is set out below:
    requires_narrative: true
    severity: exception
