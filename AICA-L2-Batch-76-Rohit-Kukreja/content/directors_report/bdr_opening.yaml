# AUTHORED from the firm's own Board's Report precedent (FY 2023-24).
#
# The precedent is a live client file. Wording is adapted; nothing specific
# to that client is carried over.
#
# NEW CLAUSE, NOT IN THE REGISTER — flagged for Gate A.
# The register has no row for the addressee or the sentence that presents
# the report, so the document would have begun at the financial summary with
# nothing addressed to anyone.
#
# The precedent presents "their Twelfth Report". The ordinal is not printed:
# there is no field holding the number of the report, and counting it from
# the incorporation date is not safe — it depends on when the first annual
# general meeting was held. Raised rather than guessed.

id: bdr.opening
document: directors_report
order: 8
number: ""
title: "Addressee and Presentation of the Report"
clause_ref: "s.134(3)"
effective_from: "2014-04-01"
effective_to: null

needs_review: false

variants:
  - body: >
      To,

      The Members,

      {{ company_name }}

      Your Directors have pleasure in presenting their Report on the business and operations
      of the Company, together with the audited financial statements, for the financial year
      ended {{ fy_end_long }}.
