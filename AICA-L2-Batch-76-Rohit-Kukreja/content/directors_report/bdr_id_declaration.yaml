# AUTHORED from the firm's own Board's Report precedent (FY 2023-24).
#
# The precedent is a live client file. Wording is adapted; nothing specific
# to that client is carried over.
#
# The precedent says the Company is not required to appoint an independent
# director. Both that case and the case where independent directors are on
# the Board are here.

# NOT IN RULE 8A. Rule 8(6) -- "This rule shall not apply to One Person Company
# or Small Company" -- and Rule 8A then prescribes a closed, exhaustive list of
# what the abridged Board's Report shall contain. s.134(3)(d) has no counterpart in
# that list, so this paragraph is not required for an OPC or a small company.
# Partner's decision of 20 Aug 2026: for those companies the clause is omitted
# outright -- not defaulted, not left as a placeholder.

id: bdr.id.declaration
document: directors_report
order: 70
number: ""
title: "Declaration by Independent Directors"
clause_ref: "s.134(3)(d); s.149(6); s.149(7)"
effective_from: "2014-04-01"
effective_to: null
render_as: section

applicability:
  requires: [full_board_report]

needs_review: false

input:
  key: bdr.id.declaration
  label: "Independent directors"
  datatype: select
  carry_forward: prompt
  mandatory: true
  options:
    - { value: "na", label: "Not required to appoint independent directors" }
    - { value: "received", label: "Declarations received" }
    - { value: "not_received", label: "Declaration not received from one or more — explain" }

variants:
  - when: "value == 'na'"
    body: >
      Declaration by Independent Directors

      The Company is not required to appoint an independent director under Section 149 of
      the Companies Act, 2013, and accordingly no declaration under sub-section (7) of that
      section arises.

  - when: "value == 'received'"
    body: >
      Declaration by Independent Directors

      The Company has received declarations from each of the independent directors under
      sub-section (7) of Section 149 of the Companies Act, 2013 confirming that they meet
      the criteria of independence laid down in sub-section (6) of that section. In the
      opinion of the Board, the independent directors fulfil the conditions specified in the
      Act and the rules made thereunder and are independent of the management.

  - when: "value == 'not_received'"
    body: >
      Declaration by Independent Directors

      A declaration under sub-section (7) of Section 149 of the Companies Act, 2013 has not
      been received from every independent director. The particulars are set out below:
    requires_narrative: true
    severity: exception
