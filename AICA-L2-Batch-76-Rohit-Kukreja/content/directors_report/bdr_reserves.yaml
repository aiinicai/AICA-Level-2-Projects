# AUTHORED from the firm's own Board's Report precedent (FY 2023-24).
#
# The precedent is a live client file. Wording is adapted; nothing specific
# to that client is carried over.

# NOT IN RULE 8A. Rule 8(6) -- "This rule shall not apply to One Person Company
# or Small Company" -- and Rule 8A then prescribes a closed, exhaustive list of
# what the abridged Board's Report shall contain. s.134(3)(j) has no counterpart in
# that list, so this paragraph is not required for an OPC or a small company.
# Partner's decision of 20 Aug 2026: for those companies the clause is omitted
# outright -- not defaulted, not left as a placeholder.

id: bdr.reserves
document: directors_report
order: 140
number: ""
title: "Amounts Carried to Reserves"
clause_ref: "s.134(3)(j)"
effective_from: "2014-04-01"
effective_to: null
render_as: section

applicability:
  requires: [full_board_report]

needs_review: false

input:
  key: bdr.reserves
  label: "Transfer to reserves"
  datatype: select
  carry_forward: prompt
  mandatory: true
  options:
    - { value: "none", label: "No amount transferred" }
    - { value: "transferred", label: "Amount transferred — state it" }

variants:
  - when: "value == 'none'"
    body: >
      Reserves

      The Company has not transferred any amount from the Statement of Profit and Loss to
      the general reserve during the year under review.

  - when: "value == 'transferred'"
    body: >
      Reserves

      The amount proposed to be carried to reserves is set out below:
    requires_narrative: true
