# AUTHORED from the firm's own Board's Report precedent (FY 2023-24).
#
# The precedent is a live client file. Wording is adapted; nothing specific
# to that client is carried over.

# NOT IN RULE 8A. Rule 8(6) -- "This rule shall not apply to One Person Company
# or Small Company" -- and Rule 8A then prescribes a closed, exhaustive list of
# what the abridged Board's Report shall contain. s.134(3)(o) has no counterpart in
# that list, so this paragraph is not required for an OPC or a small company.
# Partner's decision of 20 Aug 2026: for those companies the clause is omitted
# outright -- not defaulted, not left as a placeholder.

id: bdr.csr
document: directors_report
order: 190
number: ""
title: "Corporate Social Responsibility"
clause_ref: "s.134(3)(o); s.135; Rule 9, Companies (CSR Policy) Rules, 2014"
effective_from: "2014-04-01"
effective_to: null
render_as: section

applicability:
  requires: [full_board_report]

needs_review: false

input:
  key: bdr.csr
  label: "Corporate social responsibility"
  datatype: select
  carry_forward: prompt
  mandatory: true
  options:
    - { value: "na", label: "Section 135 not applicable" }
    - { value: "annexed", label: "Applicable — annual report on CSR annexed" }

variants:
  - when: "value == 'na'"
    body: >
      Corporate Social Responsibility

      The Company is not required to constitute a Corporate Social Responsibility Committee
      under Section 135 of the Companies Act, 2013, and accordingly no disclosure under
      clause (o) of sub-section (3) of Section 134 is applicable.

  - when: "value == 'annexed'"
    body: >
      Corporate Social Responsibility

      The Company has constituted a Corporate Social Responsibility Committee in accordance
      with Section 135 of the Companies Act, 2013. The annual report on Corporate Social
      Responsibility activities, containing the particulars specified in Rule 9 of the
      Companies (Corporate Social Responsibility Policy) Rules, 2014, is annexed to this
      Report.
