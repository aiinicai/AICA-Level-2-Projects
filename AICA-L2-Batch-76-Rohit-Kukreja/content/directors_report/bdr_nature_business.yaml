# AUTHORED from the firm's own Board's Report precedent (FY 2023-24).
#
# The precedent is a live client file. Wording is adapted; nothing specific
# to that client is carried over.

# NOT IN RULE 8A. Rule 8(6) -- "This rule shall not apply to One Person Company
# or Small Company" -- and Rule 8A then prescribes a closed, exhaustive list of
# what the abridged Board's Report shall contain. Rule 8(5)(ii) has no counterpart in
# that list, so this paragraph is not required for an OPC or a small company.
# Partner's decision of 20 Aug 2026: for those companies the clause is omitted
# outright -- not defaulted, not left as a placeholder.

id: bdr.nature.business
document: directors_report
order: 250
number: ""
title: "Change in the Nature of Business"
clause_ref: "Rule 8(5)(ii), Companies (Accounts) Rules, 2014"
effective_from: "2014-04-01"
effective_to: null
render_as: section

applicability:
  requires: [full_board_report]

needs_review: false

input:
  key: bdr.nature.business
  label: "Change in the nature of business"
  datatype: select
  carry_forward: prompt
  mandatory: true
  options:
    - { value: "none", label: "No change" }
    - { value: "changed", label: "Changed — describe" }

variants:
  # Firm wording.
  - when: "value == 'none'"
    body: >
      Change in the Nature of Business

      There is no change in the nature of the business of the Company during the year under
      review.

  - when: "value == 'changed'"
    body: >
      Change in the Nature of Business

      The change in the nature of the business of the Company during the year under review is
      described below:
    requires_narrative: true
