# AUTHORED from the firm's own Board's Report precedent (FY 2023-24).
#
# The precedent is a live client file. Wording is adapted; nothing specific
# to that client is carried over.

id: bdr.regulator.orders
document: directors_report
order: 300
number: ""
title: "Significant and Material Orders Passed by Regulators or Courts"
clause_ref: "Rule 8(5)(vii), Companies (Accounts) Rules, 2014"
effective_from: "2014-04-01"
effective_to: null
render_as: section

needs_review: false

input:
  key: bdr.regulator.orders
  label: "Significant and material orders"
  datatype: select
  carry_forward: never
  mandatory: true
  options:
    - { value: "none", label: "None" }
    - { value: "passed", label: "Orders passed — give the details" }

variants:
  # Firm wording.
  - when: "value == 'none'"
    body: >
      Significant and Material Orders

      During the financial year under review there have been no significant or material
      orders passed by any regulator, court or tribunal impacting the going concern status
      of the Company or its operations in future.

  - when: "value == 'passed'"
    body: >
      Significant and Material Orders

      The significant and material orders passed by regulators, courts or tribunals
      impacting the going concern status of the Company or its operations in future are set
      out below:
    requires_narrative: true
    severity: exception
