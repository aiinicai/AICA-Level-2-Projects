# AUTHORED from the firm's own Board's Report precedent (FY 2023-24).
#
# The precedent is a live client file. Wording is adapted; nothing specific
# to that client is carried over.
#
# AUTHORED — the precedent has no such paragraph. Section 118(10) requires
# every company to observe Secretarial Standards SS-1 and SS-2 on Board and
# general meetings, and the statement of compliance is standard in a Board's
# Report.

# NOT IN RULE 8A. Rule 8(6) -- "This rule shall not apply to One Person Company
# or Small Company" -- and Rule 8A then prescribes a closed, exhaustive list of
# what the abridged Board's Report shall contain. s.118(10) has no counterpart in
# that list, so this paragraph is not required for an OPC or a small company.
# Partner's decision of 20 Aug 2026: for those companies the clause is omitted
# outright -- not defaulted, not left as a placeholder.

id: bdr.secretarial.standards
document: directors_report
order: 370
number: ""
title: "Compliance with Secretarial Standards"
clause_ref: "s.118(10); SS-1 and SS-2 issued by the ICSI"
effective_from: "2015-07-01"
effective_to: null
render_as: section

applicability:
  requires: [full_board_report]

needs_review: false

input:
  key: bdr.secretarial.standards
  label: "Compliance with Secretarial Standards SS-1 and SS-2"
  datatype: select
  carry_forward: prompt
  mandatory: true
  options:
    - { value: "complied", label: "Complied with" }
    - { value: "not_complied", label: "Not complied with — explain" }

variants:
  - when: "value == 'complied'"
    body: >
      Secretarial Standards

      The Company has complied with the applicable Secretarial Standards on Meetings of the
      Board of Directors (SS-1) and on General Meetings (SS-2) issued by the Institute of
      Company Secretaries of India and approved by the Central Government under sub-section
      (10) of Section 118 of the Companies Act, 2013.

  - when: "value == 'not_complied'"
    body: >
      Secretarial Standards

      The Company has not complied with the applicable Secretarial Standards issued by the
      Institute of Company Secretaries of India in the following respects:
    requires_narrative: true
    severity: exception
