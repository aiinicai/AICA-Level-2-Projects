# AUTHORED from the firm's own Board's Report precedent (FY 2023-24).
#
# The precedent is a live client file. Wording is adapted; nothing specific
# to that client is carried over.
#
# The precedent copies the statutory lead-in verbatim, including the words
# "shall state that", which leaves the report quoting the section at itself
# rather than the Board making the statement. Reworded so the Board states
# it. The five limbs are section 134(5)(a) to (e) and the sixth is (f).
#
# Section 134(5)(e) — internal financial controls — applies only to a listed
# company. The precedent includes it for an unlisted private company. Both
# forms are here, selected rather than assumed.

id: bdr.drs
document: directors_report
order: 50
number: ""
title: "Directors' Responsibility Statement"
clause_ref: "s.134(3)(c); s.134(5)"
effective_from: "2014-04-01"
effective_to: null
render_as: section

needs_review: false

input:
  key: bdr.drs
  label: "Internal financial controls limb — s.134(5)(e)"
  datatype: select
  carry_forward: prompt
  mandatory: true
  options:
    - { value: "with_ifc", label: "Include the internal financial controls limb" }
    - { value: "without_ifc", label: "Omit it — not a listed company" }

  # Derived from the company class, not asked. Clause (e) of s.134(5) applies
  # by its own words only "in the case of a listed company", so for every other
  # company the limb is omitted. This was a dropdown nobody had answered, and an
  # unanswered input drops its clause -- but the dev database carried the
  # `with_ifc` answer, so an unlisted private company's Board's Report was
  # printing that its directors had laid down internal financial controls and
  # that those controls were operating effectively. That is a statement the
  # directors sign, and the Act does not ask an unlisted company to make it.
  defaults:
    - { when: "is_listed_company", value: "with_ifc" }
    - { value: "without_ifc" }

variants:
  - when: "value == 'with_ifc'"
    body: >
      Directors' Responsibility Statement

      In terms of clause (c) of sub-section (3) of Section 134 of the Companies Act, 2013,
      your Directors state that:

      (a) in the preparation of the annual accounts, the applicable accounting standards
      have been followed along with proper explanation relating to material departures;

      (b) the Directors have selected such accounting policies and applied them consistently
      and made judgements and estimates that are reasonable and prudent so as to give a true
      and fair view of the state of affairs of the Company at the end of the financial year
      and of the profit or loss of the Company for that period;

      (c) the Directors have taken proper and sufficient care for the maintenance of
      adequate accounting records in accordance with the provisions of this Act for
      safeguarding the assets of the Company and for preventing and detecting fraud and
      other irregularities;

      (d) the Directors have prepared the annual accounts on a going concern basis;

      (e) the Directors have laid down internal financial controls to be followed by the
      Company and such internal financial controls are adequate and were operating
      effectively; and

      (f) the Directors have devised proper systems to ensure compliance with the provisions
      of all applicable laws and that such systems were adequate and operating effectively.

  - when: "value == 'without_ifc'"
    body: >
      Directors' Responsibility Statement

      In terms of clause (c) of sub-section (3) of Section 134 of the Companies Act, 2013,
      your Directors state that:

      (a) in the preparation of the annual accounts, the applicable accounting standards
      have been followed along with proper explanation relating to material departures;

      (b) the Directors have selected such accounting policies and applied them consistently
      and made judgements and estimates that are reasonable and prudent so as to give a true
      and fair view of the state of affairs of the Company at the end of the financial year
      and of the profit or loss of the Company for that period;

      (c) the Directors have taken proper and sufficient care for the maintenance of
      adequate accounting records in accordance with the provisions of this Act for
      safeguarding the assets of the Company and for preventing and detecting fraud and
      other irregularities;

      (d) the Directors have prepared the annual accounts on a going concern basis; and

      (e) the Directors have devised proper systems to ensure compliance with the provisions
      of all applicable laws and that such systems were adequate and operating effectively.


      The Company not being a listed company, clause (e) of sub-section (5) of Section 134
      of the Companies Act, 2013, relating to the laying down of internal financial
      controls, does not apply.
