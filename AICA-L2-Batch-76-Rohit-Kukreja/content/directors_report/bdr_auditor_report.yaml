# AUTHORED to the firm's instruction of 20 Aug 2026, from their own precedent.
#
# A short statement of what the auditors concluded, sitting immediately before
# the Board's comments on the report. Driven by the engagement's own opinion
# type, so the Board's Report cannot describe an unmodified opinion while the
# auditor's report is qualified.
#
# ON "UNQUALIFIED". The precedent says "Unqualified Opinion". SA 700 (Revised)
# and the Act's own reporting language use "unmodified" -- "unqualified" is the
# pre-revision term. The modern term is used here. Ask and it goes back.

id: bdr.auditor.report
document: directors_report
order: 88
number: ""
title: "Auditors' Report"
clause_ref: "s.134(3); SA 700 (Revised)"
effective_from: "2014-04-01"
effective_to: null
render_as: section

needs_review: false

variants:
  - when: "opinion_type == 'clean'"
    body: >
      Auditors' Report


      The Statutory Auditors have expressed an unmodified opinion and have concluded that
      the financial statements give a true and fair view in accordance with the financial
      reporting framework used for the preparation and presentation of the financial
      statements.

  # NO UNCONDITIONAL FALLBACK. Every variant names the opinions it covers, so
  # an engagement whose opinion type has not been set yet resolves to NOTHING
  # -- recorded as unanswered, which blocks export and shows on the workspace.
  #
  # It used to fall through to this paragraph, so a Board's Report drafted
  # before the opinion was decided told the directors their audit report was
  # qualified. Found by the firm's team on 21 Aug 2026. An adverse statement is
  # the worst possible default: it is wrong about the client, and it reads as
  # deliberate.
  - when: "opinion_type in ('qualified', 'adverse', 'disclaimer')"
    body: >
      Auditors' Report


      The Statutory Auditors have expressed a modified opinion on the financial statements
      of the Company. The Board's explanation on the matters giving rise to the
      modification is set out in the following paragraph.
    severity: exception
