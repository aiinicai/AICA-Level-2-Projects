# AUTHORED.
#
# NOT PRODUCED BY THE SCAFFOLDER. `scripts/scaffold_clauses.py` carries a
# hand-written clause table rather than reading the approved register, and
# this row was never transcribed into it — so the document had no such
# paragraph at all. tests/test_register_reconciliation.py now fails if any
# approved row is missing.

# Firm wording — the closing block of the precedent Board's Report.
#
# The two signing directors, their DINs, the place and the date of the Board
# meeting at which the report was approved are all typed fields. A Board's
# Report is signed by the chairperson where authorised by the Board, or
# otherwise by at least two directors one of whom must be a managing
# director, per section 134(6) — so the names come from the client's director
# register rather than being typed into prose.

id: bdr.sig
document: directors_report
order: 900
number: ""
title: "Signature Block"
clause_ref: "s.134(6)"
effective_from: "2014-04-01"
effective_to: null
render_as: signature

needs_review: false

variants:
  - body: >
      For and on behalf of the Board of Directors of

      {{ company_name }}

      Director

      Director

      Place: {{ place }}

      Date: {{ report_date_long }}
