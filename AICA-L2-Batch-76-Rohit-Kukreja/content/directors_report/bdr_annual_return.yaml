# AUTHORED from the firm's own Board's Report precedent (FY 2023-24).
#
# The precedent is a live client file. Wording is adapted; nothing specific
# to that client is carried over.
#
# THIS IS THE PARAGRAPH THAT REPLACED FORM MGT-9.
# Section 134(3)(a) as amended requires the web address, if any, where the
# annual return referred to in section 92(3) has been placed. The precedent
# has no such paragraph and still annexes MGT-9 instead.

id: bdr.annual.return
document: directors_report
order: 20
number: ""
title: "Web Address of the Annual Return"
clause_ref: "s.134(3)(a); s.92(3)"
effective_from: "2021-03-31"
effective_to: null
render_as: section

needs_review: false

input:
  key: bdr.annual.return
  label: "Annual return web address"
  datatype: select
  carry_forward: prompt
  mandatory: true
  options:
    - { value: "placed", label: "Placed on the website — give the web address" }
    - { value: "no_website", label: "Company has no website" }

  # A company with no website has no web address to give, and the profile
  # records the website. Where there is one, the address itself still has to be
  # entered, so that case is still asked.
  defaults:
    - { when: "not has_website", value: "no_website" }

variants:
  - when: "value == 'placed'"
    body: >
      Annual Return

      The annual return referred to in sub-section (3) of Section 92 of the Companies Act,
      2013 has been placed on the website of the Company at the following web address:
    requires_narrative: true

  - when: "value == 'no_website'"
    body: >
      Annual Return

      The Company does not maintain a website, and accordingly there is no web address at
      which the annual return referred to in sub-section (3) of Section 92 of the Companies
      Act, 2013 has been placed.
