# AUTHORED from the firm's own Board's Report precedent (FY 2023-24).
#
# The precedent is a live client file. Wording is adapted; nothing specific
# to that client is carried over.
#
# The precedent states the number of Board and general meetings in prose.
# The dates are a child table instead: the number of meetings and the
# intervening gap are both facts a reader may need to check, and a sentence
# saying "Seven Board Meetings" does not let them.

id: bdr.board.meetings
document: directors_report
order: 40
number: ""
title: "Number of Meetings of the Board"
clause_ref: "s.134(3)(b); s.173"
effective_from: "2014-04-01"
effective_to: null
render_as: section

needs_review: false

repeating_block:
  entity: board_meeting
  min_rows: 1
  carry_forward: never
  columns:
    - { key: meeting_date, label: "Date of meeting", datatype: date, required: true }
    - { key: total_directors, label: "Total directors as on date", datatype: number, required: true }
    - { key: directors_present, label: "Number of directors attended", datatype: number, required: true }
    - { key: attendance_pct, label: "% of attendance", datatype: number }

variants:
  - body: >
      Meetings of the Board

      The Board of Directors met during the financial year on the dates set out below. The
      intervening gap between any two meetings was within the period prescribed under the
      Companies Act, 2013.
    render_block: table
