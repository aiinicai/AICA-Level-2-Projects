# AUTHORED from the firm's own Board's Report precedent (FY 2023-24).
#
# The precedent is a live client file. Wording is adapted; nothing specific
# to that client is carried over.
#
# The precedent sets these out as lettered items (a), (b), (c) with NIL
# against each, which follows Rule 8(5)(v). The lettering is fixed and is
# authored into the text.

# NOT IN RULE 8A. Rule 8(6) -- "This rule shall not apply to One Person Company
# or Small Company" -- and Rule 8A then prescribes a closed, exhaustive list of
# what the abridged Board's Report shall contain. Rule 8(5)(v) has no counterpart in
# that list, so this paragraph is not required for an OPC or a small company.
# Partner's decision of 20 Aug 2026: for those companies the clause is omitted
# outright -- not defaulted, not left as a placeholder.

id: bdr.deposits
document: directors_report
order: 280
number: ""
title: "Deposits Covered under Chapter V"
clause_ref: "Rule 8(5)(v), Companies (Accounts) Rules, 2014; s.73 to s.76"
effective_from: "2014-04-01"
effective_to: null
render_as: section

applicability:
  requires: [full_board_report]

needs_review: false

input:
  key: bdr.deposits
  label: "Deposits covered under Chapter V"
  datatype: select
  carry_forward: prompt
  mandatory: true
  options:
    - { value: "none", label: "None accepted, none outstanding, no default" }
    - { value: "particulars", label: "Particulars to be given" }

repeating_block:
  # The table is asked for ONLY when the answer produces one. Without this
  # guard `min_rows: 1` applied to every answer, so choosing the nil option
  # printed the correct paragraph and still blocked export with "the table
  # needs at least one row" -- which is why the firm's team typed the nil
  # sentence into a name column to get past it.
  # 'none' states the nil position for each limb of Chapter V in prose.
  when: "value == 'particulars'"
  entity: deposit_particulars
  min_rows: 1
  carry_forward: never
  columns:
    - { key: particulars, label: "Particulars", datatype: text, required: true }
    - { key: amount, label: "Amount", datatype: amount, required: true }
    - { key: remarks, label: "Remarks", datatype: longtext }

variants:
  # Firm wording, in its lettered form.
  - when: "value == 'none'"
    body: >
      Deposits

      The details relating to deposits covered under Chapter V of the Companies Act, 2013
      are as follows:

      (a) accepted during the year: Nil;

      (b) remained unpaid or unclaimed as at the end of the year: Nil;

      (c) whether there has been any default in repayment of deposits or payment of interest
      thereon during the year, and if so, the number of such cases and the total amount
      involved at the beginning of the year, the maximum during the year and at the end of
      the year: there has been no such default.

  - when: "value == 'particulars'"
    body: >
      Deposits

      The details relating to deposits covered under Chapter V of the Companies Act, 2013
      are set out below:
    render_block: table
