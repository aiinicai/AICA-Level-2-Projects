# AUTHORED from the firm's own Board's Report precedent (FY 2023-24).
#
# The precedent is a live client file. Wording is adapted; nothing specific
# to that client is carried over.
#
# The precedent gives the foreign exchange figures in prose, in rupees, with
# the previous year in brackets. They are a child table here so that the
# amounts are typed once as numbers and grouped in the Indian style at
# render time.

# NOT IN RULE 8A. Rule 8(6) -- "This rule shall not apply to One Person Company
# or Small Company" -- and Rule 8A then prescribes a closed, exhaustive list of
# what the abridged Board's Report shall contain. Rule 8(3) has no counterpart in
# that list, so this paragraph is not required for an OPC or a small company.
# Partner's decision of 20 Aug 2026: for those companies the clause is omitted
# outright -- not defaulted, not left as a placeholder.

id: bdr.conservation
document: directors_report
order: 170
number: ""
title: "Conservation of Energy, Technology Absorption and Foreign Exchange"
clause_ref: "s.134(3)(m); Rule 8(3), Companies (Accounts) Rules, 2014"
effective_from: "2014-04-01"
effective_to: null
render_as: section

applicability:
  requires: [full_board_report]

needs_review: false

input:
  key: bdr.conservation
  label: "Conservation of energy and technology absorption"
  datatype: select
  carry_forward: prompt
  mandatory: true
  options:
    - { value: "not_applicable", label: "Not applicable — no manufacturing activity" }
    - { value: "particulars", label: "Particulars to be given" }

  # Defaulted to the non-manufacturing wording, which is the firm's own text
  # for these companies and the common case for the class of company this tool
  # serves. A manufacturer's auditor changes it.
  defaults:
    - { value: "not_applicable" }

repeating_block:
  # NO `when:` guard, deliberately. BOTH answers print a table: the
  # not-applicable wording still ends "The foreign exchange earned and used
  # during the year is set out below:", so hiding the table there would
  # leave a lead-in sentence with nothing under it -- the same defect as a
  # narrative that is collected and never printed.
  entity: forex_particulars
  min_rows: 1
  carry_forward: never
  # Rule 8(3) has three limbs and only one of them carries figures:
  # (A) conservation of energy and (B) technology absorption are narrative,
  # while (C) foreign exchange earnings and outgo is an amount. One table
  # serves all three, so **the amount columns are optional**. They were
  # required, which demanded a number against a paragraph -- the firm's team
  # reported it, having left the cell blank and got a row with an empty column.
  columns:
    - { key: particulars, label: "Particulars", datatype: text, required: true }
    - { key: current_year, label: "Current year", datatype: amount }
    - { key: previous_year, label: "Previous year", datatype: amount }

variants:
  # A AND B, as Rule 8(3) itself is laid out and as the firm's precedent prints
  # it: the energy and technology particulars under Rule 8(3)(A) and (B) are
  # narrative, and the foreign exchange particulars under Rule 8(3)(C) are the
  # table. This settles the question left open on 17 Aug -- one clause, two
  # lettered parts -- because the firm's own format answers it.
  - when: "value == 'not_applicable'"
    body: >
      Conservation of Energy, Technology Absorption and Foreign Exchange Earnings & Outgo


      A. Conservation of Energy, Technology Absorption: Section 134(3)(m) read with Rule
      8(3) (A and B) of the Companies (Accounts) Rules, 2014


      Conservation of energy is of utmost significance to the Company. Operations of the
      Company are not energy intensive. However, every effort is made to ensure optimum use
      of energy by using energy-efficient computers, processes and other office equipment.
      Constant efforts are made through regular and preventive maintenance and upkeep of
      existing electrical equipment to minimise breakdowns and loss of energy.


      The Company is continuously making efforts for induction of innovative technologies
      and techniques required for the business activities.


      Steps taken by the Company for utilising alternate sources of energy: NIL


      Capital investment on energy conservation equipment: NIL


      B. Foreign Exchange Earnings and Outgo: Section 134(3)(m) read with Rule 8(3)(C) of
      the Companies (Accounts) Rules, 2014
    render_block: table

  - when: "value == 'particulars'"
    body: >
      Conservation of Energy, Technology Absorption and Foreign Exchange Earnings and Outgo

      The particulars required under clause (m) of sub-section (3) of Section 134 of the
      Companies Act, 2013 in respect of the conservation of energy, technology absorption
      and foreign exchange earnings and outgo are set out below:
    render_block: table
    requires_narrative: true
