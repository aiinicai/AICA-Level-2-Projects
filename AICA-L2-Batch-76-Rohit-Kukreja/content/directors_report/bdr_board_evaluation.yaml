# AUTHORED from the firm's own Board's Report precedent (FY 2023-24).
#
# The precedent is a live client file. Wording is adapted; nothing specific
# to that client is carried over.
#
# Section 134(3)(p) applies to a listed company and to such other classes of
# public companies as are prescribed by Rule 8(4). The precedent's company
# is neither and has no such paragraph.

# NOT IN RULE 8A. Rule 8(6) -- "This rule shall not apply to One Person Company
# or Small Company" -- and Rule 8A then prescribes a closed, exhaustive list of
# what the abridged Board's Report shall contain. Rule 8(4) has no counterpart in
# that list, so this paragraph is not required for an OPC or a small company.
# Partner's decision of 20 Aug 2026: for those companies the clause is omitted
# outright -- not defaulted, not left as a placeholder.

id: bdr.board.evaluation
document: directors_report
order: 200
number: ""
title: "Formal Annual Evaluation of the Board"
clause_ref: "s.134(3)(p); Rule 8(4), Companies (Accounts) Rules, 2014"
effective_from: "2014-04-01"
effective_to: null
render_as: section

applicability:
  requires: [full_board_report]

needs_review: false

input:
  key: bdr.board.evaluation
  label: "Formal annual evaluation"
  datatype: select
  carry_forward: prompt
  mandatory: true
  options:
    - { value: "na", label: "Not applicable" }
    - { value: "carried_out", label: "Carried out — describe the manner" }

variants:
  - when: "value == 'na'"
    body: >
      Formal Annual Evaluation

      The Company is not required to carry out a formal annual evaluation of the performance
      of the Board, its committees and the individual directors under clause (p) of
      sub-section (3) of Section 134 of the Companies Act, 2013 read with Rule 8(4) of the
      Companies (Accounts) Rules, 2014.

  - when: "value == 'carried_out'"
    body: >
      Formal Annual Evaluation

      Formal Annual Evaluation

      A formal annual evaluation of the performance of the Board, its committees and the
      individual directors has been carried out. The manner in which the evaluation was made
      is set out below:
    requires_narrative: true
