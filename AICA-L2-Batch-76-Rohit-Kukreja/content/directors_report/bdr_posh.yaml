# AUTHORED from the firm's own Board's Report precedent (FY 2023-24).
#
# The precedent is a live client file. Wording is adapted; nothing specific
# to that client is carried over.
#
# AUTHORED — THE PRECEDENT HAS NO SUCH PARAGRAPH, WHICH IS ITSELF WORTH
# RAISING. The statement is required of every company having the prescribed
# number of employees, and its absence from a Board's Report is a
# non-disclosure rather than a stylistic choice.

# NOT IN RULE 8A. Rule 8(6) -- "This rule shall not apply to One Person Company
# or Small Company" -- and Rule 8A then prescribes a closed, exhaustive list of
# what the abridged Board's Report shall contain. Rule 8(5)(x) has no counterpart in
# that list, so this paragraph is not required for an OPC or a small company.
# Partner's decision of 20 Aug 2026: for those companies the clause is omitted
# outright -- not defaulted, not left as a placeholder.

id: bdr.posh
document: directors_report
order: 330
number: ""
title: "Compliance with the Sexual Harassment of Women at Workplace Act"
clause_ref: "Rule 8(5)(x), Companies (Accounts) Rules, 2014; Sexual Harassment of Women at Workplace (Prevention, Prohibition and Redressal) Act, 2013"
effective_from: "2022-03-31"
effective_to: null
render_as: section

applicability:
  requires: [full_board_report]

needs_review: false

input:
  key: bdr.posh
  label: "Internal Complaints Committee and complaints during the year"
  datatype: select
  carry_forward: prompt
  mandatory: true
  options:
    - { value: "complied_nil", label: "Committee constituted — no complaints" }
    - { value: "complied_complaints", label: "Committee constituted — complaints received" }
    - { value: "na", label: "Not required to constitute a Committee" }

  # Defaulted to the committee-constituted, nil-complaints wording on the
  # partner's instruction of 20 Aug 2026: the employee threshold is not
  # recorded anywhere in the profile, and the firm's position is to assume it
  # is met rather than leave the disclosure out of the report.
  #
  # This asserts two things the Company must actually be able to stand behind
  # -- that a policy was adopted and that an Internal Complaints Committee was
  # duly constituted -- so where a client has neither, the answer is changed to
  # "Not required to constitute a Committee". Reversible firm-wide at
  # Admin -> Default Answers.
  defaults:
    - { value: "complied_nil" }

repeating_block:
  # Only where complaints arose. The nil case states its three particulars in
  # words, which reads better than a table of zeros and cannot be left blank.
  when: "value == 'complied_complaints'"
  entity: posh_complaint
  min_rows: 1
  carry_forward: never
  columns:
    - { key: particulars, label: "Particulars", datatype: text, required: true }
    - { key: number, label: "Number", datatype: number, required: true }

variants:
  - when: "value == 'complied_nil'"
    body: >
      Disclosures Under Sexual Harassment of Women at Workplace (Prevention, Prohibition &
      Redressal) Act, 2013


      The Company has adopted a policy for prevention of sexual harassment at the workplace,
      in line with the requirements of the Sexual Harassment of Women at Workplace
      (Prevention, Prohibition and Redressal) Act, 2013 ("POSH Act"). An Internal Complaints
      Committee ("ICC") has been duly constituted as per the provisions of the POSH Act to
      redress complaints regarding sexual harassment at the workplace.


      During the financial year under review, the Company has complied with all the
      provisions of the POSH Act and the rules framed thereunder. Further details are as
      follows:


      Number of complaints of sexual harassment received during the year: Nil


      Number of complaints disposed of during the year: Nil


      Number of cases pending for more than ninety days: Nil

  - when: "value == 'complied_complaints'"
    body: >
      Disclosures Under Sexual Harassment of Women at Workplace (Prevention, Prohibition &
      Redressal) Act, 2013


      The Company has adopted a policy for prevention of sexual harassment at the workplace,
      in line with the requirements of the Sexual Harassment of Women at Workplace
      (Prevention, Prohibition and Redressal) Act, 2013 ("POSH Act"). An Internal Complaints
      Committee ("ICC") has been duly constituted as per the provisions of the POSH Act to
      redress complaints regarding sexual harassment at the workplace.


      During the financial year under review, the Company has complied with all the
      provisions of the POSH Act and the rules framed thereunder. Further details are as
      follows:
    render_block: table

  - when: "value == 'na'"
    body: >
      Sexual Harassment of Women at Workplace

      The Company does not have the number of employees at which the constitution of an
      Internal Complaints Committee under the Sexual Harassment of Women at Workplace
      (Prevention, Prohibition and Redressal) Act, 2013 becomes mandatory. The Company is
      nonetheless committed to providing a workplace free from harassment.
