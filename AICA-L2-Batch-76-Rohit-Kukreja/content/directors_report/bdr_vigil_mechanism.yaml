# AUTHORED from the firm's own Board's Report precedent (FY 2023-24).
#
# The precedent is a live client file. Wording is adapted; nothing specific
# to that client is carried over.

# NOT IN RULE 8A. Rule 8(6) -- "This rule shall not apply to One Person Company
# or Small Company" -- and Rule 8A then prescribes a closed, exhaustive list of
# what the abridged Board's Report shall contain. s.177(10) has no counterpart in
# that list, so this paragraph is not required for an OPC or a small company.
# Partner's decision of 20 Aug 2026: for those companies the clause is omitted
# outright -- not defaulted, not left as a placeholder.

id: bdr.vigil.mechanism
document: directors_report
order: 210
number: ""
title: "Vigil Mechanism"
clause_ref: "s.177(9); s.177(10); Rule 7, Companies (Meetings of Board and its Powers) Rules, 2014"
effective_from: "2014-04-01"
effective_to: null
render_as: section

applicability:
  requires: [full_board_report]

needs_review: false

input:
  key: bdr.vigil.mechanism
  label: "Vigil mechanism / whistle-blower policy"
  datatype: select
  carry_forward: prompt
  mandatory: true
  options:
    - { value: "na", label: "Not required to establish one" }
    - { value: "established", label: "Established" }

variants:
  # Firm wording.
  - when: "value == 'na'"
    body: >
      Vigil Mechanism

      The Company is not required to establish a vigil mechanism under sub-section (9) of
      Section 177 of the Companies Act, 2013 read with Rule 7 of the Companies (Meetings of
      Board and its Powers) Rules, 2014, and accordingly no such policy has been adopted.

  - when: "value == 'established'"
    body: >
      Vigil Mechanism

      The Company has established a vigil mechanism under sub-section (9) of Section 177 of
      the Companies Act, 2013 for directors and employees to report genuine concerns. The
      mechanism provides for adequate safeguards against victimisation of persons who use
      it, and for direct access to the chairperson of the Audit Committee, or to the
      director nominated for that purpose, in appropriate or exceptional cases.
