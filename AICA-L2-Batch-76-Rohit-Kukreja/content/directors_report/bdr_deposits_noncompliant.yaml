# AUTHORED from the firm's own Board's Report precedent (FY 2023-24).
#
# The precedent is a live client file. Wording is adapted; nothing specific
# to that client is carried over.

# NOT IN RULE 8A. Rule 8(6) -- "This rule shall not apply to One Person Company
# or Small Company" -- and Rule 8A then prescribes a closed, exhaustive list of
# what the abridged Board's Report shall contain. Rule 8(5)(vi) has no counterpart in
# that list, so this paragraph is not required for an OPC or a small company.
# Partner's decision of 20 Aug 2026: for those companies the clause is omitted
# outright -- not defaulted, not left as a placeholder.

id: bdr.deposits.noncompliant
document: directors_report
order: 290
number: ""
title: "Deposits Not in Compliance with Chapter V"
clause_ref: "Rule 8(5)(vi), Companies (Accounts) Rules, 2014"
effective_from: "2014-04-01"
effective_to: null
render_as: section

applicability:
  requires: [full_board_report]

needs_review: false

input:
  key: bdr.deposits.noncompliant
  label: "Deposits not in compliance with Chapter V"
  datatype: select
  carry_forward: prompt
  mandatory: true
  options:
    - { value: "none", label: "None" }
    - { value: "exist", label: "Exist — give the details" }

variants:
  # Firm wording ("NA" in the precedent, written out here).
  - when: "value == 'none'"
    body: >
      Deposits Not in Compliance with Chapter V

      There are no deposits which are not in compliance with the requirements of Chapter V
      of the Companies Act, 2013.

  - when: "value == 'exist'"
    body: >
      Deposits Not in Compliance with Chapter V

      The details of the deposits which are not in compliance with the requirements of
      Chapter V of the Companies Act, 2013 are set out below:
    requires_narrative: true
    severity: exception
