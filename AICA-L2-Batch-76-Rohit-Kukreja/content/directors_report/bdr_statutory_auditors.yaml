# AUTHORED to the partner's instruction of 20 Aug 2026. The Board's Report had
# no paragraph naming the statutory auditors at all.
#
# The firm's name and registration number are NOT asked for: they come from
# Admin -> Firm & Partners, the same source the auditor's report signs with,
# so the Board's Report cannot name a different firm from the one that signed.
#
# ON THE TERM. The firm's own wording names only the year the term ENDS -- the
# appointment year is carried by "the said Annual General Meeting" -- so one
# field does it, and there is no second year that could fall out of step with
# the first. Entered once and carried forward, since a term runs five years.

id: bdr.statutory.auditors
document: directors_report
order: 85
number: ""
title: "Statutory Auditors"
clause_ref: "s.139 and s.141"
effective_from: "2014-04-01"
effective_to: null
render_as: section

needs_review: false

input:
  key: bdr.statutory.auditors
  label: "Year of the AGM up to which the statutory auditors are appointed"
  datatype: text
  # Entered once and carried into every later year without being asked again:
  # an appointment runs five years, so re-prompting each year would be four
  # needless questions and four chances to mistype it.
  carry_forward: always
  mandatory: true

  # No answer yet prints a visible bracket rather than dropping the paragraph.
  # An unanswered input takes its whole clause out of the document, so without
  # this the Board's Report would simply have no auditors paragraph and nothing
  # on screen would say why. The bracket is caught by the pre-export
  # placeholder scan, so it cannot reach a signed report.
  defaults:
    - { value: "[year the term ends]" }

variants:
  - body: >
      Statutory Auditors


      As per the provisions of Sections 139 and 141 of the Companies Act, 2013, the Members
      of the Company at the Annual General Meeting approved the appointment of
      {{ firm_name }}, Chartered Accountants (FRN: {{ firm_frn }}), as the Statutory
      Auditors of the Company for a term of five years, that is, from the conclusion of the
      said Annual General Meeting until the conclusion of the Annual General Meeting to be
      held in the year {{ value }}.


      The Company has received confirmation from the Auditors to the effect that their
      appointment continues to be in accordance with the provisions of Section 141 of the
      Act, that is, they are not disqualified from continuing as Statutory Auditors and are
      eligible to hold office as Statutory Auditors of your Company.
