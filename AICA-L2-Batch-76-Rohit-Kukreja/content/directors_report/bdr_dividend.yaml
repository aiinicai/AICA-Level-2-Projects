# AUTHORED from the firm's own Board's Report precedent (FY 2023-24).
#
# The precedent is a live client file. Wording is adapted; nothing specific
# to that client is carried over.

# NOT IN RULE 8A. Rule 8(6) -- "This rule shall not apply to One Person Company
# or Small Company" -- and Rule 8A then prescribes a closed, exhaustive list of
# what the abridged Board's Report shall contain. s.134(3)(k) has no counterpart in
# that list, so this paragraph is not required for an OPC or a small company.
# Partner's decision of 20 Aug 2026: for those companies the clause is omitted
# outright -- not defaulted, not left as a placeholder.

id: bdr.dividend
document: directors_report
order: 150
number: ""
title: "Dividend"
clause_ref: "s.134(3)(k); s.123"
effective_from: "2014-04-01"
effective_to: null
render_as: section

applicability:
  requires: [full_board_report]

needs_review: false

input:
  key: bdr.dividend
  label: "Dividend recommended"
  datatype: select
  carry_forward: prompt
  mandatory: true
  options:
    - { value: "none", label: "No dividend recommended" }
    - { value: "recommended", label: "Dividend recommended — state the amount" }

variants:
  - when: "value == 'none'"
    body: >
      Dividend

      The Board of Directors of your Company has decided to retain and plough back the
      profits into the business of the Company, and accordingly no dividend is being
      recommended for the year under review.

  - when: "value == 'recommended'"
    body: >
      Dividend

      Your Directors recommend a dividend for the year under review, the particulars of
      which are set out below:
    requires_narrative: true
