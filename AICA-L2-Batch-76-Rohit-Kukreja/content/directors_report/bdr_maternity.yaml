# AUTHORED.
#
# NOT PRODUCED BY THE SCAFFOLDER. `scripts/scaffold_clauses.py` carries a
# hand-written clause table rather than reading the approved register, and
# this row was never transcribed into it — so the document had no such
# paragraph at all. tests/test_register_reconciliation.py now fails if any
# approved row is missing.

# AUTHORED — not sourced. The firm's precedent Board's Report is for FY
# 2023-24 and does not carry this statement at all.
#
# SETTLED — the partner directed on 16 August 2026 that no rule number and no
# commencement year are to be cited. See docs/GATE_A_DECISIONS.md, decision 3.
#
# So `clause_ref` names the Act alone. I had first written Rule 8(5)(xi),
# which was wrong in any event — the approved register gives Rule 8(5)(xi) to
# the Insolvency and Bankruptcy Code disclosure and 8(5)(xii) to the one-time
# settlement disclosure, and two requirements cannot share a sub-clause.
#
# `effective_from` is deliberately null, which is what "no year" means here:
# the statement prints in the Board's Report for every year the tool
# generates. CONSEQUENCE, ACCEPTED BY THE PARTNER: a Board's Report produced
# for a year before the requirement existed will carry it too. The exposure
# is small — a Board's Report is prepared for one year at a time and is not
# regenerated for comparatives the way an auditor's report is — but it is a
# deliberate choice, not an oversight. Do not add a date back without asking.

# NOT IN RULE 8A. Rule 8(6) -- "This rule shall not apply to One Person Company
# or Small Company" -- and Rule 8A then prescribes a closed, exhaustive list of
# what the abridged Board's Report shall contain. Rule 8(5)(xiii) has no counterpart in
# that list, so this paragraph is not required for an OPC or a small company.
# Partner's decision of 20 Aug 2026: for those companies the clause is omitted
# outright -- not defaulted, not left as a placeholder.

# EFFECTIVE 14 JULY 2025. Rule 8(5)(xiii) was inserted by the Companies
# (Accounts) Second Amendment Rules, 2025 -- G.S.R. 357(E) dated 30 May 2025 --
# and applies to financial years ending on or after 14 July 2025. `effective_from`
# carries that, so the clause does not appear in an FY 2024-25 report.
#
# Being a Rule 8 item, it does not reach an OPC or a small company: the partner
# confirmed on 20 Aug 2026 that no 2025 notification touched Rule 8A.

id: bdr.maternity
document: directors_report
order: 345
number: ""
title: "Compliance with the Maternity Benefit Act, 1961"
clause_ref: "Rule 8(5)(xiii), Companies (Accounts) Rules, 2014; Maternity Benefit Act, 1961"
effective_from: "2025-07-14"
effective_to: null
render_as: section

applicability:
  requires: [full_board_report]

needs_review: false

input:
  key: bdr.maternity
  label: "Compliance with the Maternity Benefit Act, 1961"
  datatype: select
  carry_forward: prompt
  mandatory: true
  options:
    - { value: "complied", label: "Complied" }
    - { value: "not_complied", label: "Not complied — explain" }
    - { value: "not_applicable", label: "Not applicable — thresholds not met" }

  # The rule asks for "a statement by the company with respect to the compliance
  # of the provisions relating to the Maternity Benefit Act, 1961". Defaulted to
  # the compliance statement on the partner's instruction of 20 Aug 2026; where
  # the Act's thresholds are not met the answer is changed, since their ruling
  # was that non-applicability must then be stated expressly rather than the
  # disclosure simply being left out.
  defaults:
    - { value: "complied" }

variants:
  - when: "value == 'complied'"
    body: >
      Maternity Benefit Act, 1961

      The Company has complied with the provisions relating to the Maternity Benefit Act,
      1961.

  - when: "value == 'not_applicable'"
    body: >
      Maternity Benefit Act, 1961


      The provisions of the Maternity Benefit Act, 1961 are not applicable to the Company,
      the thresholds prescribed under that Act not having been met during the year under
      review.

  - when: "value == 'not_complied'"
    body: >
      Maternity Benefit Act, 1961

      The Company has not complied with the provisions relating to the Maternity Benefit
      Act, 1961 in the following respects:
    requires_narrative: true
    severity: exception
