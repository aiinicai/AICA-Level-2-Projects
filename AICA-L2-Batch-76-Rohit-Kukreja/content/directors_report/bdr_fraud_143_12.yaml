# AUTHORED from the firm's own Board's Report precedent (FY 2023-24).
#
# The precedent is a live client file. Wording is adapted; nothing specific
# to that client is carried over.
#
# AUTHORED — the precedent has no such paragraph, its auditor having
# reported no fraud. Section 134(3)(ca) requires details of frauds reported
# by the auditor under section 143(12) OTHER than those reportable to the
# Central Government.

id: bdr.fraud.143.12
document: directors_report
order: 60
number: ""
title: "Frauds Reported by the Auditor"
clause_ref: "s.134(3)(ca); s.143(12)"
effective_from: "2015-04-01"
effective_to: null
render_as: section

needs_review: false

input:
  key: bdr.fraud.143.12
  label: "Frauds reported by the auditor under s.143(12)"
  datatype: select
  carry_forward: never
  mandatory: true
  options:
    - { value: "none", label: "None reported" }
    - { value: "reported", label: "Reported — give the details" }

variants:
  - when: "value == 'none'"
    body: >
      Frauds Reported by the Auditor

      During the year under review, the Statutory Auditors have not reported any instance of
      fraud committed against the Company by its officers or employees under sub-section
      (12) of Section 143 of the Companies Act, 2013.

  - when: "value == 'reported'"
    body: >
      Frauds Reported by the Auditor

      The details of frauds reported by the Statutory Auditors under sub-section (12) of
      Section 143 of the Companies Act, 2013, other than those which are reportable to the
      Central Government, are set out below:
    requires_narrative: true
    severity: exception
