# AUTHORED from the firm's own Board's Report precedent (FY 2023-24).
#
# The precedent is a live client file. Wording is adapted; nothing specific
# to that client is carried over.

# NOT IN RULE 8A. Rule 8(6) -- "This rule shall not apply to One Person Company
# or Small Company" -- and Rule 8A then prescribes a closed, exhaustive list of
# what the abridged Board's Report shall contain. Rule 8(5)(xi) has no counterpart in
# that list, so this paragraph is not required for an OPC or a small company.
# Partner's decision of 20 Aug 2026: for those companies the clause is omitted
# outright -- not defaulted, not left as a placeholder.

id: bdr.ibc
document: directors_report
order: 340
number: ""
title: "Applications and Proceedings under the Insolvency and Bankruptcy Code"
clause_ref: "Rule 8(5)(xi), Companies (Accounts) Rules, 2014; Insolvency and Bankruptcy Code, 2016"
effective_from: "2021-03-31"
effective_to: null
render_as: section

applicability:
  requires: [full_board_report]

needs_review: false

input:
  key: bdr.ibc
  label: "Applications made or proceedings pending under the Code"
  datatype: select
  carry_forward: never
  mandatory: true
  options:
    - { value: "none", label: "None" }
    - { value: "pending", label: "Made or pending — give the details" }

variants:
  # Firm wording.
  - when: "value == 'none'"
    body: >
      Insolvency and Bankruptcy Code, 2016

      During the year under review there were no applications made, and no proceedings
      pending, in the name of the Company under the Insolvency and Bankruptcy Code, 2016.

  - when: "value == 'pending'"
    body: >
      Insolvency and Bankruptcy Code, 2016

      The details of the applications made, or of the proceedings pending, in the name of the
      Company under the Insolvency and Bankruptcy Code, 2016 during the year under review,
      together with their status as at the end of the financial year, are set out below:
    requires_narrative: true
    severity: exception
