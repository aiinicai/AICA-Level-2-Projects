# AUTHORED from the firm's own Board's Report precedent (FY 2023-24).
#
# The precedent is a live client file. Wording is adapted; nothing specific
# to that client is carried over.

# NOT IN RULE 8A. Rule 8(6) -- "This rule shall not apply to One Person Company
# or Small Company" -- and Rule 8A then prescribes a closed, exhaustive list of
# what the abridged Board's Report shall contain. Rule 8(5)(viii) has no counterpart in
# that list, so this paragraph is not required for an OPC or a small company.
# Partner's decision of 20 Aug 2026: for those companies the clause is omitted
# outright -- not defaulted, not left as a placeholder.

id: bdr.ifc.adequacy
document: directors_report
order: 310
number: ""
title: "Adequacy of Internal Financial Controls"
clause_ref: "Rule 8(5)(viii), Companies (Accounts) Rules, 2014"
effective_from: "2014-04-01"
effective_to: null
render_as: section

applicability:
  requires: [full_board_report]

needs_review: false

variants:
  # Firm wording.
  - body: >
      Adequacy of Internal Financial Controls with Reference to the Financial Statements

      The Board has adopted policies and procedures for ensuring the orderly and efficient
      conduct of its business, including adherence to the Company's policies, the
      safeguarding of its assets, the prevention and detection of frauds and errors, the
      accuracy and completeness of the accounting records, and the timely preparation of
      reliable financial information. The Board is of the opinion that the internal
      financial controls with reference to the financial statements are adequate and were
      operating effectively during the year under review.
