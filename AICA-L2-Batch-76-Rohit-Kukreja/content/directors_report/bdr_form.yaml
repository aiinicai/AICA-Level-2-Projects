# AUTHORED.
#
# NOT PRODUCED BY THE SCAFFOLDER. `scripts/scaffold_clauses.py` carries a
# hand-written clause table rather than reading the approved register, and
# this row was never transcribed into it — so the document had no such
# paragraph at all. tests/test_register_reconciliation.py now fails if any
# approved row is missing.

# Prints nothing: it selects which form of the report is produced. Rule 8A of
# the Companies (Accounts) Rules, 2014 lets a One Person Company or a small
# company prepare an abridged Board's Report, and the applicability engine
# computes the `abridged_board_report` flag.
#
# This clause exists so the choice is recorded in the engagement's own
# answers rather than inferred from which paragraphs happen to be present.

id: bdr.form
document: directors_report
order: 5
number: ""
title: "Report Form — Full or Abridged"
clause_ref: "Rule 8A, Companies (Accounts) Rules, 2014"
effective_from: "2018-04-01"
effective_to: null

needs_review: false

input:
  key: bdr.form
  label: "Form of the Board's Report"
  datatype: select
  carry_forward: prompt
  mandatory: true
  options:
    - { value: "full", label: "Full Board's Report — section 134(3)" }
    - { value: "abridged", label: "Abridged Board's Report — Rule 8A" }

variants:
  - when: "value == 'full'"
    body: >
      The full Board's Report under section 134(3) of the Companies Act, 2013 is prepared.
    omit: true

  - when: "value == 'abridged'"
    body: >
      An abridged Board's Report under Rule 8A of the Companies (Accounts) Rules, 2014 is
      prepared, the Company being a One Person Company or a small company.
    omit: true
