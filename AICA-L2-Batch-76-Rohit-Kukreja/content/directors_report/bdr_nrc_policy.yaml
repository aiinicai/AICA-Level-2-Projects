# AUTHORED from the firm's own Board's Report precedent (FY 2023-24).
#
# The precedent is a live client file. Wording is adapted; nothing specific
# to that client is carried over.
#
# Section 134(3)(e) applies where a Nomination and Remuneration Committee is
# required under section 178(1). The precedent's company has none.

# NOT IN RULE 8A. Rule 8(6) -- "This rule shall not apply to One Person Company
# or Small Company" -- and Rule 8A then prescribes a closed, exhaustive list of
# what the abridged Board's Report shall contain. s.134(3)(e) has no counterpart in
# that list, so this paragraph is not required for an OPC or a small company.
# Partner's decision of 20 Aug 2026: for those companies the clause is omitted
# outright -- not defaulted, not left as a placeholder.

id: bdr.nrc.policy
document: directors_report
order: 80
number: ""
title: "Policy on Directors' Appointment and Remuneration"
clause_ref: "s.134(3)(e); s.178(1); s.178(3)"
effective_from: "2014-04-01"
effective_to: null
render_as: section

applicability:
  requires: [full_board_report]

needs_review: false

input:
  key: bdr.nrc.policy
  label: "Nomination and Remuneration Committee"
  datatype: select
  carry_forward: prompt
  mandatory: true
  options:
    - { value: "na", label: "Not required to constitute a Committee" }
    - { value: "policy", label: "Committee constituted — policy in place" }

variants:
  - when: "value == 'na'"
    body: >
      Policy on Directors' Appointment and Remuneration

      The Company is not required to constitute a Nomination and Remuneration Committee
      under sub-section (1) of Section 178 of the Companies Act, 2013, and accordingly the
      disclosure under clause (e) of sub-section (3) of Section 134 does not apply.

  - when: "value == 'policy'"
    body: >
      Policy on Directors' Appointment and Remuneration

      The Company has constituted a Nomination and Remuneration Committee under sub-section
      (1) of Section 178 of the Companies Act, 2013. The Committee has formulated the
      criteria for determining qualifications, positive attributes and independence of a
      director, and has recommended a policy relating to the remuneration of the directors,
      key managerial personnel and other employees, which has been approved by the Board.
