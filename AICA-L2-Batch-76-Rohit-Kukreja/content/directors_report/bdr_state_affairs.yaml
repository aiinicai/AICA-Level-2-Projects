# AUTHORED from the firm's own Board's Report precedent (FY 2023-24).
#
# The precedent is a live client file. Wording is adapted; nothing specific
# to that client is carried over.
#
# STANDING WORDING, NO INPUT (partner's instruction, 20 Aug 2026).
#
# It previously carried `requires_narrative: true` and no `input` block. The
# catalogue built narrative fields only for clauses that also asked a
# question, so the explanation this clause demanded had no field anywhere:
# the export reported "an explanation is required" and the workspace offered
# nowhere to give one. The catalogue bug is fixed either way; this clause no
# longer needs a narrative, because the firm settled the wording.
#
# APPROVED AS DRAFTED (partner, 21 Aug 2026). The closing sentence -- "No new
# plans were discussed by the Board of Directors during the year" -- asserts
# something about board proceedings by default, for every client taking this
# wording. That was raised on 20 August and approved unchanged. Left here so the
# next reader knows it was decided rather than missed.
#
# ONE SECTION, TWO PARAGRAPHS. The request listed "State of the Company's
# Affairs" and "Brief description of the Company's working during the year /
# State of the Company's affairs" as separate disclosures. Both are section
# 134(3)(i) -- the MCA's own Board's Report format prints them as one item --
# so two headings on one subject would read as a drafting slip in a signed
# report. The two texts are kept, in the order given, under one heading.

id: bdr.state.affairs
document: directors_report
order: 130
number: ""
title: "State of the Company's Affairs"
clause_ref: "s.134(3)(i)"
effective_from: "2014-04-01"
effective_to: null
render_as: section

needs_review: false

variants:
  - body: >
      State of the Company's Affairs


      During the financial year under review, the Company continued to carry on its business
      in accordance with its main objects as set out in the Memorandum of Association. The
      Company remained focused on its core business activities and took necessary steps to
      strengthen its operations while pursuing sustainable growth.


      A review of the operations of the Company was conducted during the financial year and
      the performance was found satisfactory by the management of the Company. No new plans
      were discussed by the Board of Directors during the year.
