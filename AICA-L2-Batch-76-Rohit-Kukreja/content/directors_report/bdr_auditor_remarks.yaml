# AUTHORED from the firm's own Board's Report precedent (FY 2023-24).
#
# The precedent is a live client file. Wording is adapted; nothing specific
# to that client is carried over.
#
# The precedent says the Auditors' Report contains no qualification and that
# the notes and remarks are self-explanatory. Where there is a
# qualification, section 134(3)(f)(i) requires the Board to explain it in
# full, and the answer is driven by the engagement's own opinion type so the
# Board's Report cannot say "no qualification" while the report is
# qualified.

id: bdr.auditor.remarks
document: directors_report
order: 90
number: ""
title: "Board's Comments on the Auditor's Report"
clause_ref: "s.134(3)(f)(i)"
effective_from: "2014-04-01"
effective_to: null
render_as: section

needs_review: false

variants:
  - when: "opinion_type == 'clean'"
    body: >
      Board's Comments on the Auditors' Report

      The Statutory Auditors have not made any qualification, reservation, adverse remark or
      disclaimer in their report on the financial statements of the Company for the financial
      year ended {{ fy_end_long }}. Accordingly, no further explanation or comment by the
      Board is required in this regard.

  # NO UNCONDITIONAL FALLBACK. Every variant names the opinions it covers, so
  # an engagement whose opinion type has not been set yet resolves to NOTHING
  # -- recorded as unanswered, which blocks export and shows on the workspace.
  #
  # It used to fall through to this paragraph, so a Board's Report drafted
  # before the opinion was decided told the directors their audit report was
  # qualified. Found by the firm's team on 21 Aug 2026. An adverse statement is
  # the worst possible default: it is wrong about the client, and it reads as
  # deliberate.
  - when: "opinion_type in ('qualified', 'adverse', 'disclaimer')"
    body: >
      Board's Comments on the Auditors' Report

      The Auditors' Report contains a qualification, reservation, adverse remark or
      disclaimer. The Board's explanation, in full, is set out below:
    requires_narrative: true
    severity: exception
