# AUTHORED from the firm's own Board's Report precedent (FY 2023-24).
#
# The precedent is a live client file. Wording is adapted; nothing specific
# to that client is carried over.
#
# NEW CLAUSE, NOT IN THE REGISTER — flagged for Gate A.
# The precedent carries a "Transfer of Amounts to Investor Education and
# Protection Fund" paragraph and the register has no row for it. Section 125
# requires the transfer, and Rule 11(c) of the audit rules makes the auditor
# report on any delay, so the two documents should not disagree about it.

# NOT IN RULE 8A. Rule 8(6) -- "This rule shall not apply to One Person Company
# or Small Company" -- and Rule 8A then prescribes a closed, exhaustive list of
# what the abridged Board's Report shall contain. s.125 has no counterpart in
# that list, so this paragraph is not required for an OPC or a small company.
# Partner's decision of 20 Aug 2026: for those companies the clause is omitted
# outright -- not defaulted, not left as a placeholder.

id: bdr.iepf
document: directors_report
order: 375
number: ""
title: "Transfer of Amounts to the Investor Education and Protection Fund"
clause_ref: "s.125; Rule 11(c), Companies (Audit and Auditors) Rules, 2014"
effective_from: "2014-04-01"
effective_to: null
render_as: section

applicability:
  requires: [full_board_report]

needs_review: false

input:
  key: bdr.iepf
  label: "Amounts required to be transferred to the Fund"
  datatype: select
  carry_forward: prompt
  mandatory: true
  options:
    - { value: "none", label: "No amounts required to be transferred" }
    - { value: "transferred", label: "Transferred during the year" }
    - { value: "delayed", label: "Transfer delayed — explain" }

variants:
  # Firm wording.
  - when: "value == 'none'"
    body: >
      Investor Education and Protection Fund

      The Company did not have any funds lying unpaid or unclaimed for a period of seven
      years, and accordingly there were no amounts which were required to be transferred to
      the Investor Education and Protection Fund.

  - when: "value == 'transferred'"
    body: >
      Investor Education and Protection Fund

      The amounts which were required to be transferred to the Investor Education and
      Protection Fund under Section 125 of the Companies Act, 2013 have been transferred
      within the time prescribed.

  - when: "value == 'delayed'"
    body: >
      Investor Education and Protection Fund

      There has been a delay in transferring to the Investor Education and Protection Fund
      the amounts required to be transferred under Section 125 of the Companies Act, 2013.
      The particulars are set out below:
    requires_narrative: true
    severity: exception
