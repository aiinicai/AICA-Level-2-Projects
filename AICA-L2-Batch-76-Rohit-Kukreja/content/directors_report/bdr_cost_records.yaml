# AUTHORED from the firm's own Board's Report precedent (FY 2023-24).
#
# The precedent is a live client file. Wording is adapted; nothing specific
# to that client is carried over.
#
# Driven by the `cost_records` applicability flag, which is the same flag
# that governs CARO clause (vi). A Board's Report saying cost records are not
# required, beside a CARO annexure reporting on them, is the class of
# contradiction the single applicability engine exists to prevent.

# NOT IN RULE 8A. Rule 8(6) -- "This rule shall not apply to One Person Company
# or Small Company" -- and Rule 8A then prescribes a closed, exhaustive list of
# what the abridged Board's Report shall contain. Rule 8(5)(ix) has no counterpart in
# that list, so this paragraph is not required for an OPC or a small company.
# Partner's decision of 20 Aug 2026: for those companies the clause is omitted
# outright -- not defaulted, not left as a placeholder.

id: bdr.cost.records
document: directors_report
order: 320
number: ""
title: "Maintenance of Cost Records"
clause_ref: "Rule 8(5)(ix), Companies (Accounts) Rules, 2014; s.148(1)"
effective_from: "2021-04-01"
effective_to: null
render_as: section

applicability:
  requires: [full_board_report]

needs_review: false

input:
  key: bdr.cost.records
  label: "Maintenance of cost records under section 148(1)"
  datatype: select
  carry_forward: prompt
  mandatory: true
  options:
    - { value: "na", label: "Not required to maintain cost records" }
    - { value: "maintained", label: "Required and maintained" }
    - { value: "not_maintained", label: "Required but not maintained" }

  # Derived from the profile's own cost-records flag, which the applicability
  # engine already uses. Only a company in a specified industry is asked.
  defaults:
    - { when: "not cost_records_required", value: "na" }

variants:
  # Firm wording — the precedent states the Company is not required to
  # maintain cost records, though it cites the Audit and Auditors Rules
  # rather than the Cost Records and Audit Rules; the citation is corrected.
  - when: "value == 'na'"
    body: >
      Maintenance of Cost Records

      The maintenance of cost records as specified by the Central Government under
      sub-section (1) of Section 148 of the Companies Act, 2013 is not required by the
      Company, and accordingly such accounts and records are not made and maintained.

  - when: "value == 'maintained'"
    body: >
      Maintenance of Cost Records

      The maintenance of cost records as specified by the Central Government under
      sub-section (1) of Section 148 of the Companies Act, 2013 is required by the Company,
      and such accounts and records have been made and maintained.

  - when: "value == 'not_maintained'"
    body: >
      Maintenance of Cost Records

      The maintenance of cost records as specified by the Central Government under
      sub-section (1) of Section 148 of the Companies Act, 2013 is required by the Company,
      but such accounts and records have not been made and maintained, for the reasons set
      out below:
    requires_narrative: true
    severity: exception
