# AUTHORED from the firm's own Annexure B.
#
# SETTLED — the partner confirmed "with reference to financial statements"
# on 16 August 2026. See docs/GATE_A_DECISIONS.md, decision 1.
#
# The firm's own Annexure B says "internal financial controls over financial
# reporting" throughout, which is what section 143(3)(i) said until the
# Companies (Amendment) Act, 2017 replaced it. The current phrase is used
# here, consistently across this annexure, the auditor's report paragraph
# and the engagement letter.
#
# The ICAI's Guidance Note keeps "Over Financial Reporting" in its own title
# and is cited verbatim — that is the name of the document, not a statutory
# test, and it is the only place the older phrase appears.

# The precedent's opinion paragraph carries a copy-paste fault: "the Company
# has, in all material  the Company has, in all material respects, an
# adequate internal financial controls system". The duplicated phrase is not
# reproduced.

id: ifc.opinion
document: ifc_report
order: 80
number: ""
title: "Opinion on Internal Financial Controls"
clause_ref: "s.143(3)(i); Guidance Note on Audit of Internal Financial Controls Over Financial Reporting"
effective_from: "2014-04-01"
effective_to: null
render_as: section

applicability:
  requires: [ifc]

needs_review: false

input:
  key: ifc.opinion
  label: "Opinion on internal financial controls with reference to financial statements"
  datatype: select
  carry_forward: prompt
  mandatory: true
  options:
    - { value: "adequate", label: "Adequate and operating effectively" }
    - { value: "material_weakness", label: "Material weakness identified — qualified" }
    - { value: "disclaimer", label: "Unable to obtain sufficient appropriate evidence" }

variants:
  # Firm wording, with the duplicated phrase removed and the date
  # interpolated. The precedent writes the same date two ways in one
  # document — "31 March 2021" in the scope paragraph and "March 31, 2021"
  # here; both come from the same typed column now.
  - when: "value == 'adequate'"
    body: >
      Opinion

      In our opinion, to the best of our information and according to the explanations
      given to us, the Company has, in all material respects, an adequate internal
      financial controls system with reference to financial statements and such internal
      financial controls with reference to financial statements were operating effectively
      as at {{ fy_end_long }}, based on the internal control with reference to financial
      statements criteria established by the Company considering the essential components
      of internal control stated in the Guidance Note on Audit of Internal Financial
      Controls Over Financial Reporting issued by the Institute of Chartered Accountants of
      India.

  # AUTHORED — the precedent is a clean file and shows no modified opinion.
  - when: "value == 'material_weakness'"
    body: >
      Qualified Opinion

      In our opinion, to the best of our information and according to the explanations
      given to us, except for the possible effects of the material weakness described
      below on the achievement of the objectives of the control criteria, the Company has
      maintained, in all material respects, an adequate internal financial controls system
      with reference to financial statements and such internal financial controls with
      reference to financial statements were operating effectively as at {{ fy_end_long }},
      based on the internal control with reference to financial statements criteria
      established by the Company considering the essential components of internal control
      stated in the Guidance Note on Audit of Internal Financial Controls Over Financial
      Reporting issued by the Institute of Chartered Accountants of India.

      We have considered the material weakness identified and reported above in
      determining the nature, timing and extent of audit tests applied in our audit of the
      financial statements of the Company for the year ended {{ fy_end_long }}, and the
      material weakness does not affect our opinion on those financial statements.
    requires_narrative: true
    severity: exception

  # AUTHORED — not sourced.
  - when: "value == 'disclaimer'"
    body: >
      Disclaimer of Opinion

      We were unable to obtain sufficient appropriate audit evidence to provide a basis for
      an opinion on whether the Company had adequate internal financial controls with
      reference to financial statements and whether such controls were operating
      effectively as at {{ fy_end_long }}, for the reasons described below. Accordingly, we
      do not express an opinion on the Company's internal financial controls with reference
      to financial statements.
    requires_narrative: true
    severity: exception
