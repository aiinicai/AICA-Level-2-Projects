# AUTHORED from the firm's own Annexure B.
#
# SETTLED — the partner confirmed "with reference to financial statements"
# on 16 August 2026. See docs/GATE_A_DECISIONS.md, decision 1.
#
# The firm's own Annexure B says "internal financial controls over financial
# reporting" throughout, which is what section 143(3)(i) said until the
# Companies (Amendment) Act, 2017 replaced it. The current phrase is used
# here, consistently across this annexure, the auditor's report paragraph
# and the engagement letter.
#
# The ICAI's Guidance Note keeps "Over Financial Reporting" in its own title
# and is cited verbatim — that is the name of the document, not a statutory
# test, and it is the only place the older phrase appears.

id: ifc.scope
document: ifc_report
order: 30
number: ""
title: "Scope — Controls Audited and the Period"
clause_ref: "s.143(3)(i)"
effective_from: "2014-04-01"
effective_to: null

applicability:
  requires: [ifc]

needs_review: false

variants:
  # Firm wording. The precedent hard-codes "31 March 2021"; the date is
  # interpolated from the engagement's typed FY end column here, which is
  # also what stops this annexure and the opinion paragraph below it from
  # carrying two different spellings of the same date.
  - body: >
      We have audited the internal financial controls with reference to financial
      statements of {{ company_name }} ("the Company") as of {{ fy_end_long }} in
      conjunction with our audit of the financial statements of the Company for the year
      ended on that date.
