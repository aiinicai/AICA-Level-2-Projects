# AUTHORED from the firm's own Annexure B.
#
# SETTLED — the partner confirmed "with reference to financial statements"
# on 16 August 2026. See docs/GATE_A_DECISIONS.md, decision 1.
#
# The firm's own Annexure B says "internal financial controls over financial
# reporting" throughout, which is what section 143(3)(i) said until the
# Companies (Amendment) Act, 2017 replaced it. The current phrase is used
# here, consistently across this annexure, the auditor's report paragraph
# and the engagement letter.
#
# The ICAI's Guidance Note keeps "Over Financial Reporting" in its own title
# and is cited verbatim — that is the name of the document, not a statutory
# test, and it is the only place the older phrase appears.

# SETTLED — inline is the default and no separate paragraph is printed,
# 16 August 2026. Decision 10 in docs/GATE_A_DECISIONS.md.
#
# The register gives this row as a separate "reference to
# criteria — essential components of internal control" paragraph. The firm's
# annexure does not have one: it names the criteria inline, twice, in the
# management-responsibility paragraph and again in the opinion. Printing a
# third statement of the same criteria would be a repetition, so this clause
# prints only where the firm wants the criteria set out separately.

id: ifc.criteria.ref
document: ifc_report
order: 100
number: ""
title: "Reference to the Criteria — Essential Components of Internal Control"
clause_ref: "Guidance Note on Audit of Internal Financial Controls Over Financial Reporting"
effective_from: "2014-04-01"
effective_to: null

applicability:
  requires: [ifc]

needs_review: false

input:
  key: ifc.criteria.ref
  label: "Separate paragraph stating the control criteria"
  datatype: select
  carry_forward: always
  mandatory: true
  options:
    - { value: "inline", label: "Criteria named inline — no separate paragraph" }
    - { value: "separate", label: "Print a separate criteria paragraph" }

variants:
  - when: "value == 'inline'"
    body: >
      The control criteria are named in the management responsibility paragraph and in the
      opinion, which follows the firm's annexure. No separate paragraph is printed.
    omit: true

  # AUTHORED — not in the firm's precedent.
  - when: "value == 'separate'"
    body: >
      The internal control with reference to financial statements criteria used are those
      established by the Company considering the essential components of internal control
      stated in the Guidance Note on Audit of Internal Financial Controls Over Financial
      Reporting issued by the Institute of Chartered Accountants of India.
