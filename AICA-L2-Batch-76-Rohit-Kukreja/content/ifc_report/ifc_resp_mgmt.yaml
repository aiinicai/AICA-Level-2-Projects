# AUTHORED from the firm's own Annexure B.
#
# SETTLED — the partner confirmed "with reference to financial statements"
# on 16 August 2026. See docs/GATE_A_DECISIONS.md, decision 1.
#
# The firm's own Annexure B says "internal financial controls over financial
# reporting" throughout, which is what section 143(3)(i) said until the
# Companies (Amendment) Act, 2017 replaced it. The current phrase is used
# here, consistently across this annexure, the auditor's report paragraph
# and the engagement letter.
#
# The ICAI's Guidance Note keeps "Over Financial Reporting" in its own title
# and is cited verbatim — that is the name of the document, not a statutory
# test, and it is the only place the older phrase appears.

id: ifc.resp.mgmt
document: ifc_report
order: 40
number: ""
title: "Management's Responsibility for Internal Financial Controls"
clause_ref: "Guidance Note on Audit of Internal Financial Controls Over Financial Reporting"
effective_from: "2014-04-01"
effective_to: null
render_as: section

applicability:
  requires: [ifc]

needs_review: false

variants:
  # Firm wording. "the respective Company's policies" in the precedent is a
  # plural left over from a group template; corrected to "the Company's
  # policies".
  - body: >
      Management's Responsibility for Internal Financial Controls

      The Board of Directors of the Company is responsible for establishing and
      maintaining internal financial controls based on the internal control with reference
      to financial statements criteria established by the Company considering the
      essential components of internal control stated in the Guidance Note on Audit of
      Internal Financial Controls Over Financial Reporting issued by the Institute of
      Chartered Accountants of India. These responsibilities include the design,
      implementation and maintenance of adequate internal financial controls that were
      operating effectively for ensuring the orderly and efficient conduct of its
      business, including adherence to the Company's policies, the safeguarding of its
      assets, the prevention and detection of frauds and errors, the accuracy and
      completeness of the accounting records, and the timely preparation of reliable
      financial information, as required under the Companies Act, 2013.
