# AUTHORED from the firm's own Annexure B.
#
# SETTLED — the partner confirmed "with reference to financial statements"
# on 16 August 2026. See docs/GATE_A_DECISIONS.md, decision 1.
#
# The firm's own Annexure B says "internal financial controls over financial
# reporting" throughout, which is what section 143(3)(i) said until the
# Companies (Amendment) Act, 2017 replaced it. The current phrase is used
# here, consistently across this annexure, the auditor's report paragraph
# and the engagement letter.
#
# The ICAI's Guidance Note keeps "Over Financial Reporting" in its own title
# and is cited verbatim — that is the name of the document, not a statutory
# test, and it is the only place the older phrase appears.

id: ifc.limitations
document: ifc_report
order: 70
number: ""
title: "Inherent Limitations of Internal Financial Controls with Reference to Financial Statements"
clause_ref: "Guidance Note on Audit of Internal Financial Controls Over Financial Reporting"
effective_from: "2014-04-01"
effective_to: null
render_as: section

applicability:
  requires: [ifc]

needs_review: false

variants:
  # Firm wording.
  - body: >
      Inherent Limitations of Internal Financial Controls with Reference to Financial
      Statements

      Because of the inherent limitations of internal financial controls with reference to
      financial statements, including the possibility of collusion or improper management
      override of controls, material misstatements due to error or fraud may occur and not
      be detected. Also, projections of any evaluation of the internal financial controls
      with reference to financial statements to future periods are subject to the risk that
      the internal financial control with reference to financial statements may become
      inadequate because of changes in conditions, or that the degree of compliance with
      the policies or procedures may deteriorate.
