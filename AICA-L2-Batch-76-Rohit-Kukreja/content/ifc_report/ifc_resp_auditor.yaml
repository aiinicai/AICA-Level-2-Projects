# AUTHORED from the firm's own Annexure B.
#
# SETTLED — the partner confirmed "with reference to financial statements"
# on 16 August 2026. See docs/GATE_A_DECISIONS.md, decision 1.
#
# The firm's own Annexure B says "internal financial controls over financial
# reporting" throughout, which is what section 143(3)(i) said until the
# Companies (Amendment) Act, 2017 replaced it. The current phrase is used
# here, consistently across this annexure, the auditor's report paragraph
# and the engagement letter.
#
# The ICAI's Guidance Note keeps "Over Financial Reporting" in its own title
# and is cited verbatim — that is the name of the document, not a statutory
# test, and it is the only place the older phrase appears.

id: ifc.resp.auditor
document: ifc_report
order: 50
number: ""
title: "Auditor's Responsibility"
clause_ref: "Guidance Note on Audit of Internal Financial Controls Over Financial Reporting; SA 143(10)"
effective_from: "2014-04-01"
effective_to: null
render_as: section

applicability:
  requires: [ifc]

needs_review: false

variants:
  # Firm wording — three paragraphs, kept as three. The precedent's "internal
  # financial controls over financial reporting of the company" repeats "of
  # the company" after already naming the Company; the repetition is dropped.
  - body: >
      Auditor's Responsibility

      Our responsibility is to express an opinion on the Company's internal financial
      controls with reference to financial statements based on our audit. We conducted our
      audit in accordance with the Guidance Note on Audit of Internal Financial Controls
      Over Financial Reporting (the "Guidance Note") issued by the Institute of Chartered
      Accountants of India and the Standards on Auditing as specified under section 143(10)
      of the Companies Act, 2013, to the extent applicable to an audit of internal
      financial controls. Those Standards and the Guidance Note require that we comply with
      ethical requirements and plan and perform the audit to obtain reasonable assurance
      about whether adequate internal financial controls with reference to financial
      statements were established and maintained and if such controls operated effectively
      in all material respects.

      Our audit involves performing procedures to obtain audit evidence about the adequacy
      of the internal financial controls with reference to financial statements and their
      operating effectiveness. Our audit of internal financial controls with reference to
      financial statements included obtaining an understanding of internal financial
      controls with reference to financial statements, assessing the risk that a material
      weakness exists, and testing and evaluating the design and operating effectiveness of
      internal control based on the assessed risk. The procedures selected depend on the
      auditor's judgement, including the assessment of the risks of material misstatement
      of the financial statements, whether due to fraud or error.

      We believe that the audit evidence we have obtained is sufficient and appropriate to
      provide a basis for our audit opinion on the Company's internal financial controls
      with reference to financial statements.
