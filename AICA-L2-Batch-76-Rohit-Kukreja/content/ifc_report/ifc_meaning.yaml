# on 16 August 2026. See docs/GATE_A_DECISIONS.md, decision 1.
#
# The firm's own Annexure B says "internal financial controls over financial
# reporting" throughout, which is what section 143(3)(i) said until the
# Companies (Amendment) Act, 2017 replaced it. The current phrase is used
# here, consistently across this annexure, the auditor's report paragraph
# and the engagement letter.
#
# The ICAI's Guidance Note keeps "Over Financial Reporting" in its own title
# and is cited verbatim — that is the name of the document, not a statutory
# test, and it is the only place the older phrase appears.

id: ifc.meaning
document: ifc_report
order: 60
number: ""
title: "Meaning of Internal Financial Controls with Reference to Financial Statements"
clause_ref: "Guidance Note on Audit of Internal Financial Controls Over Financial Reporting"
effective_from: "2014-04-01"
effective_to: null
render_as: section

applicability:
  requires: [ifc]

needs_review: false

variants:
  # Firm wording. The precedent runs limbs (1), (2) and (3) together with a
  # missing space after the first semicolon; spacing corrected, wording not.
  - body: >
      Meaning of Internal Financial Controls with Reference to Financial Statements

      A company's internal financial control with reference to financial statements is a
      process designed to provide reasonable assurance regarding the reliability of
      financial reporting and the preparation of financial statements for external purposes
      in accordance with generally accepted accounting principles. A company's internal
      financial control with reference to financial statements includes those policies and
      procedures that (1) pertain to the maintenance of records that, in reasonable detail,
      accurately and fairly reflect the transactions and dispositions of the assets of the
      company; (2) provide reasonable assurance that transactions are recorded as necessary
      to permit preparation of financial statements in accordance with generally accepted
      accounting principles, and that receipts and expenditures of the company are being
      made only in accordance with authorisations of management and directors of the
      company; and (3) provide reasonable assurance regarding prevention or timely
      detection of unauthorised acquisition, use, or disposition of the company's assets
      that could have a material effect on the financial statements.
