# Source B — Implementation Guide to SA 210, Jan 2022, Chapter 3.
#
# The appointment term itself is now stated in eng.header, which Chapter 3
# gives proper wording for. What remains here is the standing of this letter
# in later years — SA 210 para 13 and Chapter 1's list of circumstances in
# which the terms should be revised or the client reminded of them.
#
# VOICE NORMALISED — ONE GATE A DECISION, NOT TWENTY-ONE.
# Both ICAI sources are written "I / we", "my / our" so that a sole
# practitioner and a firm can use the same template. Every clause here says
# "we" and "our", which is what all of the firm's own precedents use.
# Carrying both forms would mean two variants of all twenty-one clauses to
# keep in step. If a proprietor needs the singular it is one decision applied
# across content/engagement_letter/, not a per-clause option.

id: eng.duration
document: engagement_letter
order: 170
number: ""
title: "Continuing Nature of the Engagement"
clause_ref: "SA 210 paras 13-14; s.139"
effective_from: "2014-04-01"
effective_to: null

needs_review: false

variants:
  # AUTHORED — assembled from SA 210 paras 13 and 14 rather than quoted from
  # either source, neither of which gives a standing-terms clause.
  - body: >
      This letter will remain effective for future years unless it is terminated, amended or
      superseded. We will consider whether circumstances require the terms of the engagement
      to be revised, and whether it is appropriate to remind you of the existing terms, in
      each subsequent year. Where there is a change in legal or regulatory requirements, in
      the financial reporting framework, in the nature or size of the Company's business, or
      in the ownership or management of the Company, a revised letter may be issued.
