# Source A — SA 210 Appendix 1, Illustration 1 (the base letter).
#
# The base letter comes in two versions in firm_precedents — one for where
# reporting under Section 143(3)(i) applies and one for where it does not.
# Both are here, selected by the same `ifc` flag that drives Annexure B, so
# the letter cannot promise an IFC opinion the report will not give.
#
# The base letter says "internal financial controls over financial
# reporting". The post-2017 phrase is used below: the partner settled this on
# 16 August 2026 — see docs/GATE_A_DECISIONS.md, decision 1. The letter, the
# report paragraph and the annexure all now say the same thing.
#
# VOICE NORMALISED — ONE GATE A DECISION, NOT TWENTY-ONE.
# Both ICAI sources are written "I / we", "my / our" so that a sole
# practitioner and a firm can use the same template. Every clause here says
# "we" and "our", which is what all of the firm's own precedents use.
# Carrying both forms would mean two variants of all twenty-one clauses to
# keep in step. If a proprietor needs the singular it is one decision applied
# across content/engagement_letter/, not a per-clause option.

id: eng.ifc.scope
document: engagement_letter
order: 80
number: ""
title: "Reporting on Internal Financial Controls"
clause_ref: "s.143(3)(i)"
effective_from: "2014-04-01"
effective_to: null

needs_review: false

input:
  key: eng.ifc.scope
  label: "Internal financial controls reporting"
  datatype: select
  carry_forward: prompt
  mandatory: true
  options:
    - { value: "applicable", label: "Reporting under s.143(3)(i) applies" }
    - { value: "exempt", label: "Exempt private company" }

variants:
  - when: "value == 'applicable'"
    body: >
      Our audit will, inter alia, include reporting on whether the Company has an adequate
      internal financial controls system with reference to financial statements in place and
      on the operating effectiveness of such controls. The terms of reference for our audit
      of internal financial controls, carried out in conjunction with our audit of the
      Company's financial statements, will be as stated in the separate engagement letter
      for conducting such audit and should be read in conjunction with this letter, in
      respect of which separate fees have been fixed or will be mutually agreed.

  - when: "value == 'exempt'"
    body: >
      The Company is exempt from the reporting requirement under Section 143(3)(i) of the
      2013 Act, being a private company covered by the notification dated 13th June, 2017
      issued by the Ministry of Corporate Affairs. Accordingly, our audit will not include
      an opinion on the adequacy or operating effectiveness of the Company's internal
      financial controls with reference to financial statements. We will nonetheless obtain
      an understanding of internal control relevant to the audit in order to design audit
      procedures that are appropriate in the circumstances.
