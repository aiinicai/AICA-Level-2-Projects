# Source A — SA 210 Appendix 1, Illustration 1 (the base letter).
#
# AUTHORED — NEITHER SOURCE HAS A CARO PARAGRAPH.
# The base letter does not mention the Order or Rule 11 at all, and Chapter 3
# adds no clause for them. Both are mandatory reporting for a company the
# Order applies to, and a letter that sets out the scope of the engagement
# without naming them understates what the auditor is undertaking to do.
# Driven by the `caro` flag so it cannot promise an annexure the tool will
# not produce.
#
# SETTLED — the partner confirmed on 16 August 2026 that the paragraph
# stays, notwithstanding that ICAI's own template omits it. Decision 8 in
# docs/GATE_A_DECISIONS.md.
#
# VOICE NORMALISED — ONE GATE A DECISION, NOT TWENTY-ONE.
# Both ICAI sources are written "I / we", "my / our" so that a sole
# practitioner and a firm can use the same template. Every clause here says
# "we" and "our", which is what all of the firm's own precedents use.
# Carrying both forms would mean two variants of all twenty-one clauses to
# keep in step. If a proprietor needs the singular it is one decision applied
# across content/engagement_letter/, not a per-clause option.

id: eng.caro.scope
document: engagement_letter
order: 70
number: ""
title: "Reporting under CARO 2020 and Rule 11"
clause_ref: "s.143(11); CARO 2020; Rule 11, Companies (Audit and Auditors) Rules, 2014"
effective_from: "2021-04-01"
effective_to: null

applicability:
  requires: [caro]

needs_review: false

variants:
  - body: >
      Our report will also include a statement on the matters specified in paragraphs 3 and
      4 of the Companies (Auditor's Report) Order, 2020, issued by the Central Government in
      terms of sub-section (11) of Section 143 of the 2013 Act, to the extent applicable,
      and on the other matters to be included in the auditor's report in accordance with
      Rule 11 of the Companies (Audit and Auditors) Rules, 2014. We will require the
      information, explanations and records necessary for that reporting to be made
      available to us.
