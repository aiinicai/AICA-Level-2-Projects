# Source B — Implementation Guide to SA 210, Jan 2022, Chapter 3.
#
# REPLACES THE EARLIER VERSION OF THIS CLAUSE, AND CORRECTS IT.
#
# I previously authored this clause without a monetary cap, on the reasoning
# that an auditor's liability under Section 147 is statutory and cannot be
# contracted away. The first half of that is right and stays. But Chapter 3
# of the Implementation Guide has a "Limitation on Damages" section that
# does cap liability to the client at the fees paid, with carve-outs for
# fraud or bad faith and for liabilities that cannot lawfully be limited.
# That is ICAI's own illustrative wording, so it is used here in place of
# mine.
#
# The carve-outs are what make it consistent with Section 147: the cap binds
# the client contractually and does not touch statutory or third-party
# liability.
#
# VOICE NORMALISED — ONE GATE A DECISION, NOT TWENTY-ONE.
# Both ICAI sources are written "I / we", "my / our" so that a sole
# practitioner and a firm can use the same template. Every clause here says
# "we" and "our", which is what all of the firm's own precedents use.
# Carrying both forms would mean two variants of all twenty-one clauses to
# keep in step. If a proprietor needs the singular it is one decision applied
# across content/engagement_letter/, not a per-clause option.

id: eng.liability
document: engagement_letter
order: 180
number: ""
title: "Limitation on Damages"
clause_ref: "s.147, Companies Act, 2013; Chartered Accountants Act, 1949"
effective_from: "2014-04-01"
effective_to: null
render_as: section

needs_review: false

variants:
  - body: >
      Limitation on Damages

      Nothing in this engagement letter shall exclude or restrict or prevent a claim being
      brought in respect of (i) any liability finally judicially determined to arise
      primarily from fraud or bad faith by us as auditor, or (ii) any other liabilities
      which cannot lawfully be limited or excluded, save to the extent permitted by law.

      The Company agrees that the auditor shall not be liable to the Company for any losses
      for an aggregate amount in excess of the fees paid by the Company to the auditor under
      this engagement.

      We will not be liable for losses arising as a result of the provision of false,
      misleading or incomplete information or documentation, or the withholding,
      concealment or misrepresentation of information or documentation, by any person or by
      the Company.
