variants:
  - body: >
      We also wish to invite your attention to the fact that our audit process is subject to
      peer review or quality review under the Chartered Accountants Act, 1949. The reviewers
      may inspect, examine or take an abstract of our working papers during the course of
      the peer review or quality review.
