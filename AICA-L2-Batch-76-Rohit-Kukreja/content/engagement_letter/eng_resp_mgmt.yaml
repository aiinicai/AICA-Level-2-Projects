      Responsibilities of Management and Those Charged with Governance

      Our audit will be conducted on the basis that the management and those charged with
      governance acknowledge and understand that they have the responsibility:

      (a) For the preparation of financial statements that give a true and fair view in
      accordance with the applicable financial reporting standards and other generally
      accepted accounting principles in India. This includes compliance with the applicable
      provisions of the 2013 Act; proper maintenance of accounts and other matters
      connected therewith; the preparation of the financial statements on a going concern
      basis; the preparation of the annual accounts in accordance with the applicable
      accounting standards and providing proper explanation relating to any material
      departures from those standards; selection of accounting policies and applying them
      consistently, and making judgements and estimates that are reasonable and prudent;
      taking proper and sufficient care for the maintenance of adequate accounting records
      in accordance with the provisions of the 2013 Act for safeguarding the assets of the
      Company and for preventing and detecting fraud and other irregularities; laying down
      internal financial controls to be followed by the Company and ensuring that such
      controls are adequate and were operating effectively; and devising proper systems to
      ensure compliance with the provisions of all applicable laws and that such systems
      were adequate and operating effectively.

      (b) Identifying and informing us of financial transactions or matters that may have
      any adverse effect on the functioning of the Company.

      (c) Identifying and informing us of all pending litigations and confirming that the
      impact of the pending litigations on the Company's financial position has been
      disclosed in its financial statements; all material foreseeable losses, if any, on
      long-term contracts including derivative contracts and the accrual for such losses as
      required under any law or accounting standards; and any delay in transferring amounts
      required to be transferred to the Investor Education and Protection Fund by the
      Company.

      (d) Informing us of facts that may affect the financial statements, of which
      management may become aware during the period from the date of our report to the date
      the financial statements are issued.

      (e) Identifying and informing us as to whether any director is disqualified as on
      {{ fy_end_long }} from being appointed as a director in terms of Section 164(2) of the
      2013 Act. This should be supported by written representations received from the
      directors as on {{ fy_end_long }} and taken on record by the Board of Directors.

      (f) To provide us, inter alia, with access, at all times, to all information,
      including the books, accounts, vouchers and other records and documentation of the
      Company, whether kept at the head office or elsewhere, that are relevant to the
      preparation of the financial statements, including books of account maintained in
      electronic mode; access, at all times, to the records of all the subsidiaries
      (including associate companies and joint ventures as per the Explanation to Section
      129(3) of the 2013 Act) of the Company in so far as it relates to the consolidation of
      its financial statements; access to reports, if any, relating to internal reporting on
      frauds, including those submitted by a cost accountant or company secretary in
      practice to the extent it relates to their reporting on frauds in accordance with the
      requirements of Section 143(12) of the 2013 Act; additional information that we may
      request from the management for the purposes of our audit; unrestricted access to
      persons within the Company from whom we deem it necessary to obtain audit evidence,
      including our entitlement to require from the officers of the Company such information
      and explanations as we may think necessary for the performance of our duties as the
      auditors of the Company; and all the required support to discharge our duties as the
      statutory auditors as stipulated under the Companies Act, 2013, the ICAI Standards on
      Auditing and applicable guidance.
