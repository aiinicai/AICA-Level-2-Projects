  - body: >
      Independence Matters

      In connection with this engagement, we, the management and those charged with
      governance will assume certain roles and responsibilities in an effort to assist us in
      maintaining independence and ensuring compliance with the applicable independence
      requirements. We will communicate to our partners and employees that the Company is an
      audit client. The management will ensure that the Company, together with its related
      entities, has policies and procedures in place for the purpose of ensuring that
      neither the Company nor any of its related entities will act to engage us, or accept
      from us any service, that has not been subjected to the pre-approval process where
      required, or that would impair our independence.

      The management will coordinate with us to ensure that our independence is not impaired
      by the hiring of former or current partners or professional employees who were part of
      the audit engagement team into a position as a director or officer, or as an employee
      in a position to exert significant influence over the preparation of the Company's
      accounting records or financial statements. Any such employment opportunity should be
      discussed with us before entering into substantive employment conversations.

      The management will likewise coordinate with us to ensure that our independence is not
      impaired by the appointment of a relative of a partner of the firm as a director, or
      the hiring of such a relative as key managerial personnel as defined under Section
      2(51) of the 2013 Act. Any such opportunity should be discussed with the audit
      engagement partner before entering into substantive conversations.
