# Source B — Implementation Guide to SA 210, Jan 2022, Chapter 3.
#
# REPLACES THE EARLIER VERSION OF THIS CLAUSE, AND CORRECTS IT.
#
# I previously offered a choice between the courts at the place of the
# engagement and arbitration, both authored by me. Chapter 3's protective
# clauses give ICAI's own wording: an indemnity against third-party claims
# other than those from the auditor's wilful misconduct or negligence, and
# exclusive jurisdiction in the Courts in India. No arbitration option is
# offered, and none is authored here.
#
# VOICE NORMALISED — ONE GATE A DECISION, NOT TWENTY-ONE.
# Both ICAI sources are written "I / we", "my / our" so that a sole
# practitioner and a firm can use the same template. Every clause here says
# "we" and "our", which is what all of the firm's own precedents use.
# Carrying both forms would mean two variants of all twenty-one clauses to
# keep in step. If a proprietor needs the singular it is one decision applied
# across content/engagement_letter/, not a per-clause option.

id: eng.governing.law
document: engagement_letter
order: 190
number: ""
title: "Indemnity and Jurisdiction"
clause_ref: "Companies Act, 2013; Chartered Accountants Act, 1949"
effective_from: "2014-04-01"
effective_to: null

needs_review: false

variants:
  - body: >
      The Company, by executing this letter, agrees to indemnify and hold us harmless from
      all third-party claims, damages, liabilities and costs other than those resulting from
      our wilful misconduct or negligence. It is hereby irrevocably agreed and accepted that
      the Courts in India shall have exclusive jurisdiction to settle any claim, difference
      or dispute resulting from our wilful misconduct or negligence.

      Nothing in this clause affects the jurisdiction of the Institute of Chartered
      Accountants of India or of any regulatory authority in respect of matters of
      professional conduct.
