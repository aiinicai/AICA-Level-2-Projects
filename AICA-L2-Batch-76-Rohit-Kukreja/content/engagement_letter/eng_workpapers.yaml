# Source B — Implementation Guide to SA 210, Jan 2022, Chapter 3.
#
# Source B, "Reference to Protective clauses on data transfer, workpapers
# etc." — the consent to data transfer, the ownership of working papers, the
# "as is" basis on which software tools are made available, and the
# electronic communication paragraph.
#
# The indemnity and jurisdiction sentences that appear in the middle of the
# same Chapter 3 section are NOT here: they are terms about liability, not
# about working papers, and they belong in eng.liability and
# eng.governing.law where a reviewer will look for them.
#
# VOICE NORMALISED — ONE GATE A DECISION, NOT TWENTY-ONE.
# Both ICAI sources are written "I / we", "my / our" so that a sole
# practitioner and a firm can use the same template. Every clause here says
# "we" and "our", which is what all of the firm's own precedents use.
# Carrying both forms would mean two variants of all twenty-one clauses to
# keep in step. If a proprietor needs the singular it is one decision applied
# across content/engagement_letter/, not a per-clause option.

id: eng.workpapers
document: engagement_letter
order: 140
number: ""
title: "Ownership and Retention of Working Papers; Data and Electronic Communication"
clause_ref: "SA 230; ICAI Code of Ethics"
effective_from: "2014-04-01"
effective_to: null
render_as: section

needs_review: false

variants:
  - body: >
      Working Papers, Data and Electronic Communication

      The Company consents to the use, maintenance and, where necessary, transfer of the
      data and information provided or made available by the Company, including personal
      information, and represents that it has the lawful right to provide them to us. You
      agree that on request you will promptly provide us with supporting documents to
      corroborate the foregoing.

      The working papers and files for this engagement created by us during the course of
      the audit, including electronic documents and files, are our sole property. We may
      develop software, including spreadsheets, documents, databases and other electronic
      tools, to assist us with our engagement. In some cases these aids may be provided to
      the Company upon request. As these tools were developed specifically for our purposes
      and without consideration of any purpose for which the Company might use them, they
      are made available on an "as is" basis for the Company's use only and should not be
      distributed to or shared with any third party. Further, we make no representations or
      warranties as to the sufficiency or appropriateness of the software tools for any
      purpose for which the Company may use them.

      During the engagement we may from time to time communicate with you electronically.
      However, the electronic transmission of information cannot be guaranteed to be secure
      or error free, and such information could be intercepted, corrupted, lost, destroyed,
      arrive late or incomplete, or otherwise be adversely affected or unsafe to use.
      Accordingly, while we will use reasonable procedures to check for the most commonly
      known viruses before sending information electronically, we shall not have any
      liability to you arising from or in connection with the electronic communication of
      information to you.
