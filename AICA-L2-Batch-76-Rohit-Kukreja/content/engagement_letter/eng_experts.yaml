# Source A — SA 210 Appendix 1, Illustration 1 (the base letter).
#
# Two sentences from Source A (specialists and affiliated network firms) and
# Source B's "Reference to reliance of other auditors if any — like for
# branch auditors".
#
# VOICE NORMALISED — ONE GATE A DECISION, NOT TWENTY-ONE.
# Both ICAI sources are written "I / we", "my / our" so that a sole
# practitioner and a firm can use the same template. Every clause here says
# "we" and "our", which is what all of the firm's own precedents use.
# Carrying both forms would mean two variants of all twenty-one clauses to
# keep in step. If a proprietor needs the singular it is one decision applied
# across content/engagement_letter/, not a per-clause option.

id: eng.experts
document: engagement_letter
order: 120
number: ""
title: "Auditor's Experts, Network Firms and Reliance on Other Auditors"
clause_ref: "SA 620; SA 600; s.143(8)"
effective_from: "2014-04-01"
effective_to: null

needs_review: false

input:
  key: eng.experts
  label: "Reliance on other auditors"
  datatype: select
  carry_forward: prompt
  mandatory: true
  options:
    - { value: "none", label: "No other auditors" }
    - { value: "branch", label: "Branch auditors" }
    - { value: "components", label: "Subsidiary, associate and joint venture auditors" }

variants:
  - when: "value == 'none'"
    body: >
      We may involve specialists and staff from our affiliated network firms to perform
      certain specific audit procedures during the course of our audit.

  - when: "value == 'branch'"
    body: >
      We may involve specialists and staff from our affiliated network firms to perform
      certain specific audit procedures during the course of our audit.

      In forming our opinion on the financial statements, we will rely on the work of branch
      auditors appointed by the Company and our report would expressly state the fact of
      such reliance.

  - when: "value == 'components'"
    body: >
      We may involve specialists and staff from our affiliated network firms to perform
      certain specific audit procedures during the course of our audit.

      In so far as it relates to the audit and reporting on the consolidated financial
      statements, we will rely on the work of other auditors appointed by the respective
      subsidiaries, associates and jointly controlled entities or joint ventures, and our
      report would expressly state the fact of such reliance.
