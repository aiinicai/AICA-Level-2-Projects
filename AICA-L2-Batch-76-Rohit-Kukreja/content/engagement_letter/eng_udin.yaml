# Source B — Implementation Guide to SA 210, Jan 2022, Chapter 3.
# Source B, "Updating UDIN".
#
# VOICE NORMALISED — ONE GATE A DECISION, NOT TWENTY-ONE.
# Both ICAI sources are written "I / we", "my / our" so that a sole
# practitioner and a firm can use the same template. Every clause here says
# "we" and "our", which is what all of the firm's own precedents use.
# Carrying both forms would mean two variants of all twenty-one clauses to
# keep in step. If a proprietor needs the singular it is one decision applied
# across content/engagement_letter/, not a per-clause option.

id: eng.udin
document: engagement_letter
order: 160
number: ""
title: "Unique Document Identification Number"
clause_ref: "ICAI UDIN requirements"
effective_from: "2019-04-01"
effective_to: null

needs_review: false

variants:
  - body: >
      We also wish to highlight that, pursuant to the requirements of the Institute of
      Chartered Accountants of India, we are required to update certain relevant details of
      the operations of the Company in the Unique Document Identification Number (UDIN)
      Portal of the Institute for generating the UDIN reference number, which is required to
      be stated in the reports and certificates issued by us to or on behalf of the Company.
