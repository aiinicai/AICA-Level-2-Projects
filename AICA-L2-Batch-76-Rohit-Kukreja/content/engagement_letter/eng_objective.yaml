# Source A — SA 210 Appendix 1, Illustration 1 (the base letter).
#
# VOICE NORMALISED — ONE GATE A DECISION, NOT TWENTY-ONE.
# Both ICAI sources are written "I / we", "my / our" so that a sole
# practitioner and a firm can use the same template. Every clause here says
# "we" and "our", which is what all of the firm's own precedents use.
# Carrying both forms would mean two variants of all twenty-one clauses to
# keep in step. If a proprietor needs the singular it is one decision applied
# across content/engagement_letter/, not a per-clause option.

id: eng.objective
document: engagement_letter
order: 10
number: ""
title: "Objective and Scope of the Audit"
clause_ref: "SA 210 para 10(a); s.143, Companies Act, 2013"
effective_from: "2014-04-01"
effective_to: null

needs_review: false

# EXTENDED 20 August 2026 (decision 49), at the firm's request. The clause
# stated the objective and stopped; it now also names the Standards the audit
# is conducted under, the reasonable-assurance threshold, and the risk-based
# nature of the procedures -- the three things a client reading this letter is
# entitled to be told before signing it.
#
# Source is unchanged: ICAI's Implementation Guide to SA 210, Chapter 3.
#
# The clause still names the cash flow statement in its first paragraph. That
# reads correctly for a company that prepares one, and this document is the
# ENGAGEMENT letter -- what will be audited is agreed with the client rather
# than determined by the tool. Raised with the partner rather than changed.

variants:
  - when: "cash_flow_required"
    body: >
      Our audit will be conducted with the objective of our expressing an opinion whether
      the aforesaid financial statements give the information required by the 2013 Act in
      the manner so required, and give a true and fair view in conformity with the
      applicable accounting principles generally accepted in India, of the state of affairs
      of the Company as at {{ fy_end_long }}, and its profit or loss and its cash flows for
      the year ended on that date.

      We will conduct our audit in accordance with the Standards on Auditing (SAs) issued
      by the Institute of Chartered Accountants of India. Those Standards require that we
      comply with ethical requirements and plan and perform the audit to obtain reasonable
      assurance about whether the financial statements are free from material misstatement.

      An audit involves performing procedures to obtain audit evidence about the amounts
      and disclosures in the financial statements. The procedures selected depend on our
      judgment, including the assessment of the risks of material misstatement of the
      financial statements, whether due to fraud or error.

  - when: "not cash_flow_required"
    body: >
      Our audit will be conducted with the objective of our expressing an opinion whether
      the aforesaid financial statements give the information required by the 2013 Act in
      the manner so required, and give a true and fair view in conformity with the
      applicable accounting principles generally accepted in India, of the state of affairs
      of the Company as at {{ fy_end_long }} and its profit or loss for the year ended on
      that date.

      We will conduct our audit in accordance with the Standards on Auditing (SAs) issued
      by the Institute of Chartered Accountants of India. Those Standards require that we
      comply with ethical requirements and plan and perform the audit to obtain reasonable
      assurance about whether the financial statements are free from material misstatement.

      An audit involves performing procedures to obtain audit evidence about the amounts
      and disclosures in the financial statements. The procedures selected depend on our
      judgment, including the assessment of the risks of material misstatement of the
      financial statements, whether due to fraud or error.
