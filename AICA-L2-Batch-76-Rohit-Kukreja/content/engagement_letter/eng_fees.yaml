# Source A — SA 210 Appendix 1, Illustration 1 (the base letter).
#
# Source A, footnote 4, which gives both alternatives — fees fixed by the
# members at the annual general meeting, or fees to be mutually agreed with
# the Board. Both are here because which applies depends on how the Company
# fixed the remuneration under Section 142.
#
# The amount itself is a typed engagement field, not prose. A fee figure
# retyped into a letter is exactly the kind of number that goes stale.
#
# VOICE NORMALISED — ONE GATE A DECISION, NOT TWENTY-ONE.
# Both ICAI sources are written "I / we", "my / our" so that a sole
# practitioner and a firm can use the same template. Every clause here says
# "we" and "our", which is what all of the firm's own precedents use.
# Carrying both forms would mean two variants of all twenty-one clauses to
# keep in step. If a proprietor needs the singular it is one decision applied
# across content/engagement_letter/, not a per-clause option.

id: eng.fees
document: engagement_letter
order: 110
number: ""
title: "Fees and Billing"
clause_ref: "s.142, Companies Act, 2013"
effective_from: "2014-04-01"
effective_to: null

needs_review: false

input:
  key: eng.fees
  label: "How the audit fee is fixed"
  datatype: select
  carry_forward: prompt
  mandatory: true
  options:
    - { value: "agm", label: "Fixed by the members at the annual general meeting" }
    - { value: "board", label: "To be mutually agreed with the Board of Directors" }

  # The firm's standing position, on the team's instruction of 21 August 2026.
  # A fee fixed by the members at the AGM is the exception in a private company,
  # so the letter opens on the common case and the auditor changes it where the
  # members have in fact fixed it.
  defaults:
    - { value: "board" }

variants:
  - when: "value == 'agm'"
    body: >
      Our fees and out-of-pocket expenses for the audit of the financial statements for the
      year have been fixed by the members at the annual general meeting, plus out-of-pocket
      expenses and indirect taxes. We will bill as the work progresses. We will notify you
      promptly of any circumstances we encounter that could significantly affect our
      estimate of fees, and discuss with you any additional fees, as necessary.
    requires_narrative: true

  - when: "value == 'board'"
    body: >
      Our fees and out-of-pocket expenses for the audit of the financial statements for the
      year will be mutually agreed between the Board of Directors of the Company and
      ourselves, plus out-of-pocket expenses and indirect taxes. We will bill as the work
      progresses. We will notify you promptly of any circumstances we encounter that could
      significantly affect our estimate of fees, and discuss with you any additional fees,
      as necessary.
    requires_narrative: true
