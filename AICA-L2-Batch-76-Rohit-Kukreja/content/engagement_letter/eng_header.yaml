# Source B — Implementation Guide to SA 210, Jan 2022, Chapter 3.
#
# REPLACES THE EARLIER VERSION OF THIS CLAUSE. It was authored from the base
# letter's opening, which leaves the appointment blank ("the letter dated
# ___"). Chapter 3 gives proper wording for both a first appointment and a
# continuing one, including the point that ratification at each AGM is no
# longer required — which the base letter's own footnote still assumes.
#
# VOICE NORMALISED — ONE GATE A DECISION, NOT TWENTY-ONE.
# Both ICAI sources are written "I / we", "my / our" so that a sole
# practitioner and a firm can use the same template. Every clause here says
# "we" and "our", which is what all of the firm's own precedents use.
# Carrying both forms would mean two variants of all twenty-one clauses to
# keep in step. If a proprietor needs the singular it is one decision applied
# across content/engagement_letter/, not a per-clause option.

id: eng.header
document: engagement_letter
order: 5
number: ""
title: "Addressee, Date and Reference to the Appointment"
clause_ref: "SA 210 paras 9-10; s.139, Companies Act, 2013"
effective_from: "2014-04-01"
effective_to: null

needs_review: false

input:
  key: eng.header
  label: "Nature of the appointment"
  datatype: select
  carry_forward: prompt
  mandatory: true
  options:
    - { value: "first", label: "First appointment — five-year term" }
    - { value: "continuing", label: "Continuing appointment — no ratification required" }

  # On the team's instruction of 21 August 2026. Section 139(1) lost its
  # ratification proviso with the Companies (Amendment) Act, 2017, so a
  # continuing appointment needs nothing done at each AGM; a first appointment
  # is the rarer case and is chosen when it applies.
  defaults:
    - { value: "continuing" }

# SA 210 BASIS added 20 August 2026 (decision 49), at the firm's request. The
# letter was already drawn from SA 210 and its Implementation Guide; this says
# so on the page, which is what the reader needs.

variants:
  # Source B, "First time appointment".
  - when: "value == 'first'"
    body: >
      To the Board of Directors of {{ company_name }}

      {{ registered_addr }}

      Dear Sirs,

      In the annual general meeting of the Company, we were appointed as auditors of
      {{ company_name }} ("the Company") for a period of five years, covering the financial
      years beginning {{ fy_start_long }} and ending on the corresponding date in the fifth
      financial year thereafter. You have requested that we audit the financial statements
      of the Company as defined in Section 2(40) of the Companies Act, 2013 ("the 2013
      Act") for the financial year beginning {{ fy_start_long }} and ending
      {{ fy_end_long }}. We are pleased to confirm our acceptance and our understanding of
      this audit engagement by means of this letter.

  # Source B, "Continuing appointment — no ratification required in
  # accordance with the Companies Act, 2013". Note that the base letter's
  # footnote 2 still says the appointment "would need to be ratified at each
  # AGM u/s 139"; the requirement was omitted by the Companies (Amendment)
  # Act, 2017 and Chapter 3 records the current position.
  - when: "value == 'continuing'"
    body: >
      To the Board of Directors of {{ company_name }}

      {{ registered_addr }}

      Dear Sirs,

      As per the amended provisions of the Companies Act, 2013, ratification of appointment
      as auditors is not required at every following annual general meeting of the Company
      after the initial year of appointment, and accordingly our appointment is considered
      valid for the audit for the year ended {{ fy_end_long }}. You have requested that we
      audit the financial statements of the Company as defined in Section 2(40) of the
      Companies Act, 2013 ("the 2013 Act") for that year. We are pleased to confirm our
      acceptance and our understanding of this audit engagement by means of this letter.

      This letter has been prepared in accordance with the requirements of Standard on
      Auditing (SA) 210, "Agreeing the Terms of Audit Engagements", issued by the Institute
      of Chartered Accountants of India, and sets out the agreed terms and conditions
      governing the audit engagement.
