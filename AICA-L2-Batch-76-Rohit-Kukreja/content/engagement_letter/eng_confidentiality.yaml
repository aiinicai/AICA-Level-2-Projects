# Source B — Implementation Guide to SA 210, Jan 2022, Chapter 3.
#
# Source B, "Confidentiality Matters", including the anti-bribery paragraph
# that closes it.
#
# VOICE NORMALISED — ONE GATE A DECISION, NOT TWENTY-ONE.
# Both ICAI sources are written "I / we", "my / our" so that a sole
# practitioner and a firm can use the same template. Every clause here says
# "we" and "our", which is what all of the firm's own precedents use.
# Carrying both forms would mean two variants of all twenty-one clauses to
# keep in step. If a proprietor needs the singular it is one decision applied
# across content/engagement_letter/, not a per-clause option.

id: eng.confidentiality
document: engagement_letter
order: 130
number: ""
title: "Confidentiality and Handling of Client Data"
clause_ref: "ICAI Code of Ethics; Prevention of Corruption Act, 1988"
effective_from: "2014-04-01"
effective_to: null
render_as: section

needs_review: false

variants:
  - body: >
      Confidentiality Matters

      We will conduct our audit in accordance with the confidentiality requirements
      prescribed under the Code of Ethics of the Institute of Chartered Accountants of
      India, which require that client information acquired by us in the course of our audit
      is subject to strict confidentiality.

      In connection with this engagement we may access and acquire confidential and other
      sensitive information ("confidential information"). We shall preserve the
      confidentiality of confidential information in compliance with the confidentiality
      requirements of the Code of Ethics. We shall adhere to the confidentiality
      restrictions of the regulatory authorities that govern us, as well as to any
      obligations imposed on us by any applicable laws. Information relating to you, to our
      relationship with you and to this engagement, including confidential information, may
      be accessed by other parties who facilitate the administration of our business or
      support our infrastructure, and we shall remain responsible for preserving
      confidentiality where it is shared with or accessed by such parties. We may remove, or
      arrange for the removal of, names and any other identifiers from confidential
      information and then use such anonymised information for lawful purposes. This clause
      shall not prohibit disclosure of confidential information, in confidence, to our
      professional indemnity insurers or advisers, or any disclosure otherwise permitted
      under this letter, and shall not apply where confidential information properly enters
      the public domain or ceases to be confidential without our default.

      We understand that the Company may be subject to laws that prohibit bribery or the
      providing of anything of value to government officials with the intent to influence
      that person's actions in respect of the Company's business. We may be subject to
      similar laws and codes of professional conduct, and our firm has its own internal
      policies and procedures which prohibit illegal or unethical behaviour. In providing
      the services we undertake not to offer, promise or give a financial or other advantage
      to another person with the intention of inducing that person to perform improperly, or
      to reward improper behaviour, for the benefit of the Company, in violation of the
      Prevention of Corruption Act, 1988 or any other similar law to which we are subject.
