  - body: >
      Responsibilities of the Auditor

      We will conduct our audit in accordance with the Standards on Auditing (SAs) issued
      by the Institute of Chartered Accountants of India and deemed to be prescribed by the
      Central Government in accordance with Section 143(10) of the 2013 Act. Those
      Standards require that we comply with ethical requirements and plan and perform the
      audit to obtain reasonable assurance about whether the financial statements are free
      from material misstatement. An audit involves performing procedures to obtain audit
      evidence about the amounts and the disclosures in the financial statements. The
      procedures selected depend on the auditor's judgement, including the assessment of the
      risks of material misstatement of the financial statements, whether due to fraud or
      error. In making those risk assessments, the auditor considers internal financial
      control relevant to the Company's preparation of the financial statements that give a
      true and fair view in order to design audit procedures that are appropriate in the
      circumstances.

      An audit also includes evaluating the appropriateness of the accounting policies used
      and the reasonableness of accounting estimates made by the management, as well as
      evaluating the overall presentation of the financial statements.

      As part of our audit process, we will request from the management written
      confirmation concerning representations made to us in connection with our audit.

      In accordance with the requirements of Section 143(12) of the 2013 Act, if in the
      course of performance of our duties as auditor we have reason to believe that an
      offence involving fraud is being or has been committed against the Company by
      officers or employees of the Company, we will be required to report to the Central
      Government in accordance with the rules prescribed in this regard, which, inter alia,
      require us to forward our report to the Board or Audit Committee, as the case may be,
      seeking their reply or observations, to enable us to forward the same to the Central
      Government. Such reporting will be made in good faith and therefore cannot be
      considered a breach of the requirement to maintain client confidentiality, nor be
      subject to any suit, prosecution or other legal proceeding, since it is done in
      pursuance of the 2013 Act or of any rules or orders made thereunder.

      In terms of Standard on Auditing 720, we request you to provide us with a draft of the
      Annual Report containing the audited financial statements so as to enable us to read
      the same and communicate material inconsistencies, if any, with the audited financial
      statements, before issuing our report on the financial statements.

      In accordance with the Standards on Auditing specified under Section 143(10) of the
      2013 Act, we will communicate certain matters related to the conduct and results of
      the audit to you and, where applicable, to the Audit Committee. Such matters include,
      but are not limited to, our responsibility for forming and expressing an opinion on
      the financial statements and the fact that such an audit does not relieve the
      management, the Audit Committee and the Board of Directors of their responsibilities;
      significant findings from the audit, including our views about the significant
      qualitative aspects of the Company's accounting practices; and the written
      representations requested from the management.
