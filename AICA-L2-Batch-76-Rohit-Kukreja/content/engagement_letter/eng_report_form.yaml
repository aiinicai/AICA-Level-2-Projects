# Source A — SA 210 Appendix 1, Illustration 1 (the base letter).
#
# VOICE NORMALISED — ONE GATE A DECISION, NOT TWENTY-ONE.
# Both ICAI sources are written "I / we", "my / our" so that a sole
# practitioner and a firm can use the same template. Every clause here says
# "we" and "our", which is what all of the firm's own precedents use.
# Carrying both forms would mean two variants of all twenty-one clauses to
# keep in step. If a proprietor needs the singular it is one decision applied
# across content/engagement_letter/, not a per-clause option.

id: eng.report.form
document: engagement_letter
order: 50
number: ""
title: "Expected Form and Content of Reports"
clause_ref: "SA 210 para 10(c); s.143(2)"
effective_from: "2014-04-01"
effective_to: null

needs_review: false

# EXTENDED 20 August 2026 (decision 49). The firm's team reported that the
# clause named neither the reporting standard nor section 143(3), which for a
# clause titled "Expected Form and Content of Reports" was a fair criticism.
#
# Their proposed text also restated the CARO and internal-financial-controls
# scope. NOT taken: `eng.caro.scope` and `eng.ifc.scope` already carry those,
# each gated on its own applicability flag, and repeating them here would say
# CARO applies to a company the engine has ruled exempt.

variants:
  - body: >
      Our report prepared in accordance with the relevant provisions of the 2013 Act would
      be addressed to the shareholders of the Company for adoption of the accounts at the
      annual general meeting. In respect of other services, our report would be addressed to
      the Board of Directors. The form and content of our report may need to be amended in
      the light of our audit findings.

      The form and content of our report will be in accordance with SA 700 (Revised) and
      the other applicable Standards on Auditing, and will also cover the matters required
      to be reported under Section 143(3) of the 2013 Act.
