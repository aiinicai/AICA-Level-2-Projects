# Source A — SA 210 Appendix 1, Illustration 1 (the base letter).
#
# Source B, "Reference to Statement of Changes in Equity (for Companies
# adopting Ind AS framework)", supplies the second variant. The base letter
# names only three statements, which is right under Accounting Standards and
# wrong under Ind AS.
#
# POSITION — SETTLED, LEFT WHERE THE REGISTER PUT IT, 16 August 2026.
# Decision 9 in docs/GATE_A_DECISIONS.md. The register places this at order 50,
# after both responsibilities sections. In ICAI's own letter the sentence
# "You have requested that we audit the financial statements of the Company
# which comprise..." sits in the OPENING paragraph, before anything else, so
# the reader knows what is being audited before reading who is responsible
# for it. The register's order is followed here rather than changed on my
# own initiative, and the partner declined the move. It stays at 50.
#
# VOICE NORMALISED — ONE GATE A DECISION, NOT TWENTY-ONE.
# Both ICAI sources are written "I / we", "my / our" so that a sole
# practitioner and a firm can use the same template. Every clause here says
# "we" and "our", which is what all of the firm's own precedents use.
# Carrying both forms would mean two variants of all twenty-one clauses to
# keep in step. If a proprietor needs the singular it is one decision applied
# across content/engagement_letter/, not a per-clause option.

id: eng.framework
document: engagement_letter
order: 40
number: ""
title: "Applicable Financial Reporting Framework"
clause_ref: "SA 210 para 6(a); s.133, Companies Act, 2013"
effective_from: "2014-04-01"
effective_to: null

needs_review: false

# CASH FLOW STATEMENT, added 20 August 2026 (decision 49).
# Section 2(40) first proviso: a One Person Company, a small company, a dormant
# company and a start-up private company need not include a cash flow statement.
# The `cash_flow_required` variant comes FIRST, so a company of unknown type
# receives the fuller wording rather than silently losing a statement.
#
# CITATION CORRECTED, 20 August 2026 (decision 51), on the partner's
# instruction. This clause cited "Rule 7 of the Companies (Accounts) Rules,
# 2014", which was the TRANSITIONAL provision -- it deemed the standards
# notified under the Companies Act, 1956 to be the accounting standards until
# new ones were prescribed. The Accounting Standards are now prescribed by the
# Companies (Accounting Standards) Rules, 2021, and that is what section 133
# is read with.
#
# Ind AS is unaffected: it is section 133 read with the Companies (Indian
# Accounting Standards) Rules, 2015, which is already what the Ind AS variant
# says.

variants:
  - when: "framework == 'indas'"
    body: >
      You have requested that we audit the financial statements of the Company which
      comprise the Balance Sheet as at {{ fy_end_long }}, the Statement of Profit and Loss
      (including Other Comprehensive Income), the Statement of Changes in Equity and the
      Statement of Cash Flows for the year ended on the said date, prepared in accordance
      with the Indian Accounting Standards specified under Section 133 of the 2013 Act.

  - when: "cash_flow_required"
    body: >
      You have requested that we audit the financial statements of the Company which
      comprise the Balance Sheet as at {{ fy_end_long }}, the Statement of Profit and Loss
      and the Statement of Cash Flows for the year ended on the said date, prepared in
      accordance with the Accounting Standards specified under Section 133 of the 2013 Act
      read with the Companies (Accounting Standards) Rules, 2021, as amended.

  # A small company or OPC: no cash flow statement (s.2(40) proviso).
  - body: >
      You have requested that we audit the financial statements of the Company which
      comprise the Balance Sheet as at {{ fy_end_long }} and the Statement of Profit and
      Loss for the year ended on the said date, prepared in accordance with the Accounting
      Standards specified under Section 133 of the 2013 Act read with the Companies
      (Accounting Standards) Rules, 2021, as amended.
