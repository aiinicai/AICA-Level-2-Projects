# Source B — Implementation Guide to SA 210, Jan 2022, Chapter 3.
#
# Source B's "Acknowledgement" block, with Source A's closing lines above
# it. The signature side is the firm's; the acknowledgement side is the
# Company's and is left for signature rather than pre-filled.
#
# VOICE NORMALISED — ONE GATE A DECISION, NOT TWENTY-ONE.
# Both ICAI sources are written "I / we", "my / our" so that a sole
# practitioner and a firm can use the same template. Every clause here says
# "we" and "our", which is what all of the firm's own precedents use.
# Carrying both forms would mean two variants of all twenty-one clauses to
# keep in step. If a proprietor needs the singular it is one decision applied
# across content/engagement_letter/, not a per-clause option.

id: eng.acknowledgement
document: engagement_letter
order: 200
number: ""
title: "Acknowledgement by Those Charged with Governance"
clause_ref: "SA 210 paras 10-11"
effective_from: "2014-04-01"
effective_to: null
render_as: signature

needs_review: false

variants:
  - body: >
      We look forward to full cooperation from your staff during our audit.

      Please sign and return the attached copy of this letter to indicate your
      acknowledgement of, and agreement with, the arrangements for our audit of the
      financial statements, including our respective responsibilities.

      Yours faithfully,

      For {{ firm_name }}

      Chartered Accountants

      Firm's Registration No: {{ firm_frn }}

      {{ partner_name }}

      Partner

      Membership No: {{ partner_mno }}

      Place: {{ place }}

      Date: {{ report_date_long }}

      Acknowledged on behalf of {{ company_name }} in terms of the approval by the Audit
      Committee / Board of Directors / Authorised Representative on ______

      Name and Designation: ______________________

      Date: ______________________
