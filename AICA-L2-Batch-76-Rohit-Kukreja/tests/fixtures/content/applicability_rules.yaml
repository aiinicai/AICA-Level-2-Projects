# Applicability thresholds. Build Prompt v2 §7.
#
# Thresholds live here with effective dates, NEVER in Python. An amendment
# is a change to this file, not a code change.
#
# ─────────────────────────────────────────────────────────────────────────
# NEEDS REVIEW — EVERY THRESHOLD BELOW IS A DERIVATION, NOT A SOURCED FACT.
#
# These are the numbers I believe to be correct from my own knowledge of
# Indian statute. None has been checked against a primary source or against
# the firm's practice. Getting one wrong does not produce a visible error:
# it silently emits, or silently omits, an entire annexure.
#
# The protocol makes §4 and the applicability rules the signing partner's to
# approve. Confirm every line before Gate A.
# ─────────────────────────────────────────────────────────────────────────

version: "0.1.0-phase7"

# CONFIRMED by the signing partner on 17 August 2026. See
# docs/GATE_A_DECISIONS.md, decision 23, which records how that confirmation
# was given. Every threshold below was my derivation until then.
#
# BEFORE CHANGING ANY NUMBER: a wrong threshold does not produce wrong wording,
# it produces a document that should never have been generated or omits one
# that should have been, and nothing in the tool will flag it. The two easiest
# to get wrong are marked in their own notes: CARO's test is "not exceeding"
# (<=), IFC's is strictly "less than" (<), and secretarial audit reaches
# private companies at borrowings of Rs 100 crore.

rules:

  # --------------------------------------------------------------- CARO
  # ------------------------------------------------------------ CARO 2020
  # STATED BY THE AUDITOR, not inferred (partner's instruction, 20 Aug 2026).
  # No thresholds are read. The exemption turns on facts the profile's figures
  # do not carry -- a private company loses the exemption outright if it is a
  # subsidiary or holding company of a public company -- and the auditor
  # establishes the position anyway.
  caro:
    label: "CARO 2020"
    reference: "CARO 2020, para 1(2)"
    effective_from: "2021-04-01"
    needs_review: false
    declared: true
    note: >
      For the auditor's own reference, not used by the engine. Banking and
      insurance companies and companies licensed under section 8 are outside
      CARO entirely, as are One Person Companies and small companies. A private
      company is additionally exempt only if paid-up capital and reserves do not
      exceed Rs. 1 crore, borrowings do not exceed Rs. 1 crore and revenue does
      not exceed Rs. 10 crore -- all three, and the exemption is lost outright if
      the company is a subsidiary or holding company of a public company. The
      test is "not exceeding", unlike the IFC test below.

  # ----------------------------------------------- Internal financial controls
  # STATED BY THE AUDITOR, not inferred (partner's instruction, 20 Aug 2026).
  #
  # The engine used to infer this and did it wrongly in three ways -- see
  # decision 58. It read the two thresholds as "and" where G.S.R. 583(E) says
  # "or"; it put One Person Companies and small companies through the threshold
  # test when limb (i) exempts them on class alone; and it had no way to know
  # about the condition in paragraph 2A. Every error produced an annexure that
  # was not required.
  ifc:
    label: "Internal financial controls reporting"
    reference: "Proviso to s.143(3)(i); MCA notification G.S.R. 583(E) dated 13-06-2017"
    effective_from: "2017-06-13"
    needs_review: false
    declared: true
    note: >
      For the auditor's own reference, not used by the engine. Entry 9A of
      G.S.R. 583(E) exempts a private company which (i) is a One Person Company
      or a small company; OR (ii) has turnover less than Rs. 50 crore as per the
      latest audited financial statement OR aggregate borrowings from banks,
      financial institutions or any body corporate at any point in the year of
      less than Rs. 25 crore. Note "less than", not "not exceeding". Paragraph
      2A of the same notification withdraws every exemption in it from a private
      company that has defaulted in filing its financial statements under
      section 137 or its annual return under section 92.

  # ------------------------------------------------ Managerial remuneration
  s197:
    label: "Section 197 managerial remuneration"
    reference: "s.197(16)"
    effective_from: "2014-04-01"
    needs_review: false
    company_types: [pub_unlisted, pub_listed]
    note: >
      Company class, not a figure. Section 197 applies to public companies, so
      a private company is outside it whatever its size. Left computed for that
      reason — nothing here reads money.

  # ---------------------------------------------------------------- CSR
  # STATED BY THE AUDITOR (partner's instruction, 20 Aug 2026). No figures.
  csr:
    label: "Corporate social responsibility"
    reference: "s.135(1)"
    effective_from: "2014-04-01"
    needs_review: false
    declared: true
    note: >
      For the auditor's own reference, not used by the engine. Section 135(1)
      reaches a company with net worth of Rs. 500 crore or more, turnover of
      Rs. 1000 crore or more, or net profit of Rs. 5 crore or more during the
      immediately preceding financial year. Note "immediately preceding" — the
      test is not on the year under audit, which is the usual mistake.

  # -------------------------------------------------------- Cost records
  cost_records:
    label: "Cost records under s.148(1)"
    reference: "s.148(1); Companies (Cost Records and Audit) Rules, 2014"
    effective_from: "2014-04-01"
    needs_review: false
    industry_driven: true
    note: >
      Turns on the industry the company operates in, listed in Table A and
      Table B of Rule 3, not on any figure. Recorded on the client profile.

  # ------------------------------------------------------- Internal audit
  # STATED BY THE AUDITOR (partner's instruction, 20 Aug 2026). No figures.
  internal_audit:
    label: "Internal audit under s.138"
    reference: "s.138; Rule 13, Companies (Accounts) Rules, 2014"
    effective_from: "2014-04-01"
    needs_review: false
    declared: true
    note: >
      For the auditor's own reference, not used by the engine. Rule 13 reaches
      every listed company; an unlisted public company with paid-up capital of
      Rs. 50 crore or more, turnover of Rs. 200 crore or more, outstanding
      borrowings from banks or public financial institutions of Rs. 100 crore or
      more at any point in the year, or outstanding deposits of Rs. 25 crore or
      more; and a private company with turnover of Rs. 200 crore or more or
      borrowings of Rs. 100 crore or more. Any one limb is enough.

  # ---------------------------------------------------- Secretarial audit
  # STATED BY THE AUDITOR (partner's instruction, 20 Aug 2026). No figures.
  secretarial_audit:
    label: "Secretarial audit under s.204"
    reference: "s.204; Rule 9, Companies (Appointment and Remuneration) Rules"
    effective_from: "2014-04-01"
    needs_review: false
    declared: true
    note: >
      For the auditor's own reference, not used by the engine. Rule 9 reaches
      every listed company; a public company with paid-up capital of Rs. 50
      crore or more or turnover of Rs. 250 crore or more; and — by the
      amendment of 3 January 2020, for years commencing on or after 1 April
      2020 — EVERY company with outstanding loans or borrowings from banks or
      public financial institutions of Rs. 100 crore or more. That last limb
      reaches private companies, and the old "s.204 does not apply to private
      companies" shortcut is wrong.

  kam:
    label: "Key Audit Matters (SA 701)"
    reference: "SA 701"
    effective_from: "2018-04-01"
    needs_review: false
    company_types: [pub_listed]
    note: >
      Mandatory for listed companies. The firm may also report KAM
      voluntarily for unlisted engagements — that is an override, not a rule.

  # ------------------------------------------- Abridged Board's Report
  abridged_board_report:
    label: "Abridged Board's Report"
    reference: "s.134(3A); Rule 8A, Companies (Accounts) Rules, 2014"
    effective_from: "2018-07-31"
    needs_review: false
    company_types: [opc, small]

  # ------------------------------------------- Full Board's Report
  # Declared so the flag has a label and a reference in the UI. Its VALUE is
  # derived in code as the strict inverse of abridged_board_report -- see
  # app/core/applicability.py -- so nothing here computes it.
  full_board_report:
    label: "Full Board's Report — Rule 8"
    reference: "Rule 8(6), Companies (Accounts) Rules, 2014"
    effective_from: "2018-07-31"
    needs_review: false
    company_types: [pvt, pub_unlisted, pub_listed, sec8, nidhi]

  # ------------------------------------ Consolidated financial statements
  cfs_required:
    label: "Consolidated financial statements"
    reference: "s.129(3)"
    effective_from: "2014-04-01"
    needs_review: false
    # s.129(3) and its Explanation reach subsidiaries, ASSOCIATES and JOINT
    # VENTURES, not subsidiaries alone. `has_subsidiaries` on its own produces
    # false positives.
    triggers_any_of:
      - has_subsidiary
      - has_associate
      - has_joint_venture
    # Rule 6 then exempts a company where ALL of these hold. Each is a profile
    # fact, not something the engine can infer.
    rule_6_exemption:
      requires_all:
        # wholly owned, or partially owned with the other members intimated
        # and not objecting
        - is_wholly_owned_or_unopposed_partially_owned
        # securities neither listed nor in the process of listing
        - not_listed_or_in_process_of_listing
        # parent files compliant CFS with the Registrar
        - parent_files_compliant_cfs
    note: >
      Statutory CFS applicability is a separate question from whether the
      applicable accounting framework requires consolidation in a given case.
      This flag answers the first; it does not decide the second.
