# Nil reporting is MANDATORY here. Build Prompt v2 §4.2 and §19: the prototype
# suppressed this clause when no dividend was declared. That is prohibited —
# the clause renders whatever the answer, which is why `value == 'none'` has a
# body rather than being absent.

id: rule11.f
document: auditors_report
order: 650
number: "(f)"
title: "Dividend Declared or Paid during the Year"
clause_ref: "Rule 11(f), Companies (Audit and Auditors) Rules, 2014"
effective_from: "2021-04-01"
effective_to: null

needs_review: true

input:
  key: rule11.f.status
  label: "Dividend declared or paid during the year — compliance with section 123"
  datatype: select
  carry_forward: prompt
  mandatory: true
  options:
    - { value: none,        label: "No dividend declared or paid during the year" }
    - { value: complied,    label: "Dividend declared or paid — in compliance with section 123" }
    - { value: not_complied, label: "Dividend declared or paid — not in compliance with section 123" }

variants:
  # AUTHORED — not sourced.
  - when: "value == 'none'"
    body: >
      No dividend has been declared or paid during the year by the Company.

  # AUTHORED — not sourced.
  - when: "value == 'complied'"
    body: >
      The dividend declared and paid during the year by the Company is in compliance with
      section 123 of the Companies Act, 2013.

  # AUTHORED — not sourced.
  - when: "value == 'not_complied'"
    body: >
      The dividend declared and paid during the year by the Company is not in compliance
      with section 123 of the Companies Act, 2013, in the following respects:
    requires_narrative: true
    severity: exception
