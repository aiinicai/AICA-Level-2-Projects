id: caro.vii.b
document: caro_2020
order: 72
number: "(vii)(b)"
title: "Statutory Dues Not Deposited on Account of Dispute"
clause_ref: "CARO 2020, para 3(vii)(b)"
effective_from: "2021-04-01"
effective_to: null

# Both bodies authored rather than sourced from an ICAI illustrative format.
needs_review: true

applicability:
  requires: [caro]

input:
  key: caro.vii.b.status
  label: "Statutory dues not deposited on account of any dispute"
  datatype: select
  carry_forward: prompt
  mandatory: true
  options:
    - { value: none,     label: "No dues outstanding on account of dispute" }
    - { value: disputed, label: "Dues not deposited on account of dispute" }

# The prescribed disclosure is a table, never free text (§19).
repeating_block:
  when: "value == 'disputed'"
  entity: statutory_due
  min_rows: 1
  carry_forward: prompt
  columns:
    - { key: statute,     label: "Name of the Statute",   datatype: text,     required: true }
    - { key: nature,      label: "Nature of the Dues",    datatype: text,     required: true }
    - { key: amount,      label: "Amount (₹)",            datatype: amount,   required: true }
    - { key: period,      label: "Period to which the Amount Relates", datatype: text, required: true }
    - { key: forum,       label: "Forum where Dispute is Pending",     datatype: text, required: true }
    - { key: amount_paid, label: "Amount Paid under Protest (₹)",      datatype: amount }

variants:
  # AUTHORED — not sourced.
  - when: "value == 'none'"
    body: >
      According to the information and explanations given to us, there are no statutory
      dues referred to in sub-clause (a) which have not been deposited on account of any
      dispute.

  # AUTHORED — not sourced.
  - when: "value == 'disputed'"
    body: >
      According to the information and explanations given to us, the particulars of
      statutory dues referred to in sub-clause (a) which have not been deposited on
      account of a dispute are as follows:
    render_block: table
    requires_narrative: false
    severity: exception
