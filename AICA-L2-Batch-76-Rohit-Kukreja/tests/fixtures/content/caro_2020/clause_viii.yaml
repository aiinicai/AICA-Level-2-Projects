id: caro.viii
document: caro_2020
order: 80
number: "(viii)"
title: "Unrecorded Income Surrendered or Disclosed in Tax Assessments"
clause_ref: "CARO 2020, para 3(viii)"
effective_from: "2021-04-01"
effective_to: null

# Two of the three variant bodies below were authored rather than sourced.
needs_review: true

applicability:
  requires: [caro]

input:
  key: caro.viii
  label: "Unrecorded income surrendered / disclosed in tax assessments"
  datatype: select
  carry_forward: prompt
  mandatory: true
  options:
    - { value: none,         label: "No such transactions" }
    - { value: recorded,     label: "Transactions exist — properly recorded" }
    - { value: not_recorded, label: "Transactions exist — not properly recorded" }

variants:
  # Source: Build Prompt v2 §3.1, reproduced verbatim.
  - when: "value == 'none'"
    body: >
      According to the information and explanations given to us and on the basis of our
      examination of the records, there were no transactions relating to previously
      unrecorded income that have been surrendered or disclosed as income during the year
      in the tax assessments under the Income Tax Act, 1961.

  # AUTHORED — not sourced from an ICAI illustrative format or firm precedent.
  - when: "value == 'recorded'"
    body: >
      According to the information and explanations given to us and on the basis of our
      examination of the records, transactions relating to previously unrecorded income
      have been surrendered or disclosed as income during the year in the tax assessments
      under the Income Tax Act, 1961, and such previously unrecorded income has been
      properly recorded in the books of account during the year.
    severity: info

  # AUTHORED — not sourced. Requires the auditor to state the amount and the year.
  - when: "value == 'not_recorded'"
    body: >
      According to the information and explanations given to us and on the basis of our
      examination of the records, transactions relating to previously unrecorded income
      have been surrendered or disclosed as income during the year in the tax assessments
      under the Income Tax Act, 1961, and such previously unrecorded income has not been
      properly recorded in the books of account during the year.
    requires_narrative: true
    severity: exception
