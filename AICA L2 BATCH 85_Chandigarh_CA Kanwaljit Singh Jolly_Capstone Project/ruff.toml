# Ruff configuration for Task Checker.
# Lightweight lint so changes can be self-checked. Not enforced in CI (none exists).

line-length = 120
target-version = "py310"

# Only scan the live application code.
include = ["*.py"]
exclude = [
    ".git",
    "__pycache__",
    "static",
    "migrations",
]

[lint]
# A pragmatic starter set: pyflakes (F) + a subset of pycodestyle (E) + isort (I).
select = ["F", "E4", "E7", "E9", "I"]
ignore = [
    "E701",  # multiple statements on one line (colon) — common in compact guards
    "E402",  # module-level import not at top (some files set up sys.path first)
]

[lint.per-file-ignores]
"tests/*" = ["E402"]
