[project]
name = "tally-mis"
version = "1.0.0"
description = "Offline Tally MIS desktop app (AICA Level 2 capstone)"
requires-python = ">=3.15"
dependencies = ["lxml>=6.1", "httpx>=0.28", "duckdb>=2.0", "pyarrow>=26", "fastapi>=0.162", "uvicorn>=0.54", "pywebview>=6.2"]

[project.optional-dependencies]
dev = ["pytest", "pyinstaller"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]
