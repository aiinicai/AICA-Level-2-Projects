<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Offline — MGSG Lite</title>
    <style>
      body { margin: 0; min-height: 100vh; display: grid; place-items: center;
             font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
             background: #f4f6f9; color: #1e3a5f; padding: 24px; }
      .card { max-width: 22rem; text-align: center; background: #fff; padding: 32px;
              border-radius: 16px; box-shadow: 0 1px 3px rgba(0,0,0,.08); }
      h1 { font-size: 1.25rem; margin: 0 0 8px; }
      p { color: #5b6b7f; font-size: .9rem; line-height: 1.5; margin: 0 0 20px; }
      button { background: #1e3a5f; color: #fff; border: 0; border-radius: 8px;
               padding: 10px 20px; font-size: .9rem; cursor: pointer; }
    </style>
  </head>
  <body>
    <div class="card">
      <h1>You are offline</h1>
      <p>MGSG Lite needs a connection to reach the server. Anything already loaded is still available — reconnect to punch attendance or raise an invoice.</p>
      <button onclick="location.reload()">Try again</button>
    </div>
  </body>
</html>
