# DPDP Readiness Assessor - capstone edition - local configuration.
# A copy of this file placed beside DPDP_Assessor.exe overrides the bundled one.
# It holds no client data and no secrets.

ai:
  # gemini | offline
  # Gemini is used only when an API key is present in the environment:
  #   set GEMINI_API_KEY=...      (Windows, in the same console before starting the exe)
  # With no key, a wrong key or no network the app runs offline and the report
  # is still produced in full from the catalogue text.
  provider: gemini
  model: ""          # blank uses the default (gemini-2.5-flash)

assessment:
  clients_dir: clients        # created beside the exe
