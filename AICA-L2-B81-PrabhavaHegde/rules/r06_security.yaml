rule_id: R6
rule_ref: "DPDP Rules, 2025 - Rule 6 read with Section 8(5), DPDP Act, 2023"
rule_title: "Reasonable Security Safeguards"
# Not yet checked against the gazette text.
citation_status: pending

controls:
  - id: R6.1
    title: "Encryption or masking of personal data at rest"
    question: "Is personal data at rest protected by encryption, masking or obfuscation?"
    guidance: >
      Covers databases, file servers, laptops, backups and removable media. Full-disk
      encryption alone is weak evidence where files are routinely copied to shared drives.
      Look for column-level or file-level protection on the systems holding PAN, Aadhaar,
      bank and payroll data.
    evidence_required:
      - "Encryption configuration screenshot or policy extract"
      - "List of systems holding personal data with protection status"
    weight: 5
    severity_if_absent: critical
    applies_when:
      role: [fiduciary, processor]
    observation: >
      Personal data held at rest is not protected by encryption, masking or obfuscation
      across the systems identified in the data inventory.
    impact: >
      This is the single highest-penalty exposure under the Act, attracting a financial
      penalty of up to Rs. 250 crore for failure to implement reasonable security
      safeguards. Any breach of an unencrypted store is also far more likely to be
      treated as attributable to inadequate safeguards rather than to the attacker alone.
    action: >
      Encrypt personal data at rest on every system in the inventory, starting with
      payroll, KYC and banking repositories. Where legacy systems cannot support
      encryption, apply masking at the application layer and record the compensating
      control with a dated remediation plan.

  - id: R6.2
    title: "Encryption of personal data in transit"
    question: "Is personal data encrypted whenever it moves between systems, or to external parties?"
    guidance: >
      Includes portal uploads, API calls, email attachments and file transfers to
      consultants. Unencrypted attachments sent over ordinary email are the most common
      failure found in practice.
    evidence_required:
      - "TLS configuration or transfer policy"
      - "Evidence of secure transfer mechanism for external sharing"
    weight: 5
    severity_if_absent: critical
    applies_when:
      role: [fiduciary, processor]
    observation: >
      Personal data is transmitted between systems and to external parties without
      assured encryption in transit.
    impact: >
      Data is interceptable in transit, and the entity cannot demonstrate reasonable
      safeguards for the transfer leg. Exposure is the same Rs. 250 crore category as
      at-rest failures, and evidence of unencrypted transfer is easy for an investigator
      to obtain from either end of the channel.
    action: >
      Enforce TLS on all internal and external connections carrying personal data. Replace
      email attachment sharing with an access-controlled transfer channel. Where email is
      unavoidable, mandate password-protected archives with out-of-band key sharing.

  - id: R6.3
    title: "Need-to-know access control, documented"
    question: "Is access to personal data restricted on a documented need-to-know basis?"
    guidance: >
      There must be a written access matrix mapping roles to data categories, and actual
      system permissions must match it. Shared logins and blanket administrator rights
      defeat this control regardless of what the policy says.
    evidence_required:
      - "Role-to-data access matrix"
      - "User access listing from at least one system holding personal data"
    weight: 5
    severity_if_absent: critical
    applies_when:
      role: [fiduciary, processor]
    observation: >
      Access to personal data is not restricted on a documented need-to-know basis, and
      system permissions have not been reconciled to an approved access matrix.
    impact: >
      Every user becomes a potential breach vector, and the entity cannot limit the scope
      of a breach when one occurs. Excess access also defeats the data minimisation
      principle at the operational level, and makes attribution impossible after an incident.
    action: >
      Build a role-to-data access matrix and approve it at partner or management level.
      Reconcile live system permissions against it, remove excess rights, eliminate shared
      logins, and schedule a periodic access review with documented sign-off.

  - id: R6.4
    title: "Authentication controls including multi-factor"
    question: "Are authentication controls, including multi-factor authentication, applied to systems holding personal data?"
    guidance: >
      MFA on email and on the accounting or payroll system is the practical minimum.
      Password policy alone is not an authentication control for this purpose.
    evidence_required:
      - "MFA configuration screenshot"
      - "List of systems with MFA status"
    weight: 4
    severity_if_absent: high
    applies_when:
      role: [fiduciary, processor]
    observation: >
      Multi-factor authentication is not enforced on systems holding personal data.
    impact: >
      Credential compromise leads directly to data compromise. Given how routinely
      credentials are phished or reused, the absence of MFA is difficult to defend as a
      reasonable safeguard before the Board.
    action: >
      Enable MFA on email, the accounting system, the document repository and any cloud
      storage holding personal data. Prioritise accounts with administrative rights and
      accounts belonging to staff who handle KYC or payroll.

  - id: R6.5
    title: "Access logging with minimum one-year retention"
    question: "Is access to personal data logged and monitored, with logs retained for at least one year?"
    guidance: >
      Rule 6 sets a minimum retention period of one year for logs and related processing
      records, unless a longer period applies under another law. Logs that roll over at
      30 or 90 days by default will fail this control.
    evidence_required:
      - "Log retention configuration"
      - "Sample log export showing personal data access events"
    weight: 5
    severity_if_absent: critical
    applies_when:
      role: [fiduciary, processor]
    observation: >
      Access to personal data is not logged and monitored, or logs are retained for less
      than the minimum one-year period.
    impact: >
      Without logs the entity cannot detect a breach, cannot scope it, and cannot produce
      the facts, circumstances and attribution findings that the 72-hour report to the
      Board requires. A breach without logs is effectively unreportable in the prescribed
      form, converting one failure into two penalty exposures.
    action: >
      Enable access logging on all systems holding personal data and extend retention to
      at least twelve months. Define what constitutes an anomalous access pattern and
      assign a named reviewer. Test log recoverability before relying on it.

  - id: R6.6
    title: "Backup and continuity measures"
    question: "Are backups and business continuity measures in place for personal data?"
    guidance: >
      Backups must themselves be protected. An unencrypted backup on an unsecured drive
      creates a second copy of the exposure rather than a safeguard.
    evidence_required:
      - "Backup schedule or policy"
      - "Evidence of a restoration test"
    weight: 3
    severity_if_absent: medium
    applies_when:
      role: [fiduciary, processor]
    observation: >
      Backup and continuity measures for personal data are not defined, or restoration
      has not been tested.
    impact: >
      Loss of availability is itself a personal data breach under the Act. An untested
      backup provides no assurance of recovery and does not discharge the safeguard duty.
    action: >
      Define a backup schedule covering every system in the data inventory, encrypt the
      backups, and run a documented restoration test at least annually.

  - id: R6.7
    title: "Periodic vulnerability assessment or security testing"
    question: "Is periodic security testing or vulnerability assessment carried out?"
    guidance: >
      Scale the expectation to the entity. A small practice may rely on a vendor scan and
      a documented patch cycle. A larger entity should show a formal assessment report.
    evidence_required:
      - "Vulnerability assessment report or scan output"
      - "Remediation tracker"
    weight: 3
    severity_if_absent: medium
    applies_when:
      role: [fiduciary, processor]
    observation: >
      No periodic vulnerability assessment or security testing is carried out on systems
      holding personal data.
    impact: >
      Known and patchable weaknesses persist undetected. Where a breach exploits an
      unpatched vulnerability, the absence of any testing regime makes the safeguards
      difficult to characterise as reasonable.
    action: >
      Institute a periodic vulnerability scan with a defined frequency, and track findings
      to closure in a remediation register with owners and dates.

  - id: R6.8
    title: "Documented incident response procedure"
    question: "Is there a documented incident response procedure for personal data incidents?"
    guidance: >
      The document must name roles, escalation paths and decision authority. A procedure
      that exists only in the head of the IT vendor is not documented.
    evidence_required:
      - "Incident response procedure document"
      - "Evidence of a drill or a logged incident, if any"
    weight: 4
    severity_if_absent: high
    applies_when:
      role: [fiduciary, processor]
    observation: >
      No documented incident response procedure exists for personal data incidents.
    impact: >
      Response will be improvised at the worst possible moment. Because the breach clocks
      begin on awareness and run in hours rather than days, an undocumented process is the
      most common reason entities miss statutory notification deadlines.
    action: >
      Document an incident response procedure covering detection, containment, assessment,
      notification and post-incident review. Name the decision-maker for each step and run
      one tabletop drill to validate that the timelines are achievable.
