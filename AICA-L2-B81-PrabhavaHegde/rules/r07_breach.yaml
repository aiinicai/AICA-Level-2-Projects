rule_id: R7
rule_ref: "DPDP Rules, 2025 - Rule 7 read with Section 8(6), DPDP Act, 2023"
rule_title: "Personal Data Breach Intimation"
# Not yet checked against the gazette text.
citation_status: pending

controls:
  - id: R7.1
    title: "Breach detection and escalation procedure"
    question: "Is there a defined procedure to detect a personal data breach and escalate it internally?"
    guidance: >
      The statutory clocks start from awareness. Ask who becomes aware, how they report
      it, and to whom. If a junior staff member noticing a misdirected file has no defined
      route, the entity has no detection capability regardless of its tooling.
    evidence_required:
      - "Escalation procedure naming roles and timelines"
      - "Staff communication or training record on breach reporting"
    weight: 5
    severity_if_absent: critical
    applies_when:
      role: [fiduciary, processor]
    observation: >
      No defined procedure exists for detecting a personal data breach and escalating it
      to the person responsible for statutory notification.
    impact: >
      The notification clocks run from the moment of awareness, so delayed internal
      escalation consumes the response window before anyone with authority learns of the
      incident. Failure to notify attracts a penalty of up to Rs. 200 crore, stacking on
      top of any safeguard failure penalty arising from the same incident.
    action: >
      Define and circulate a one-page escalation route naming the person responsible,
      an alternate, and a maximum internal reporting time measured in hours. Train all
      staff who touch personal data on what counts as a reportable incident.

  - id: R7.2
    title: "Intimation to affected Data Principals"
    question: "Is there a template and channel to intimate affected Data Principals without delay?"
    guidance: >
      The intimation must describe the nature, extent and timing of the breach, the
      consequences for the individual, the mitigation taken, the protective steps the
      individual can take, and contact details. There is no minimum size threshold - a
      breach affecting ten records carries the same duty as one affecting ten million.
    evidence_required:
      - "Data Principal intimation template"
      - "Evidence of the communication channel maintained"
    weight: 4
    severity_if_absent: high
    applies_when:
      role: [fiduciary]
    observation: >
      No template or defined channel exists for intimating affected Data Principals of a
      personal data breach.
    impact: >
      Individual intimation is a universal obligation under the Act with no risk-based
      threshold, unlike GDPR. Drafting the communication during a live incident invites
      both delay and inaccurate disclosure, either of which worsens the regulatory position.
    action: >
      Prepare a Data Principal intimation template covering all prescribed contents, and
      confirm that current contact records are adequate to reach the data population.

  - id: R7.3
    title: "Initial intimation to the Data Protection Board"
    question: "Is there a defined process to intimate the Board without delay on becoming aware of a breach?"
    guidance: >
      This is the first of two Board communications. It carries the nature, extent, timing
      and likely impact of the breach and is due without delay, not within 72 hours.
    evidence_required:
      - "Initial Board intimation template"
      - "Procedure identifying who files it"
    weight: 4
    severity_if_absent: high
    applies_when:
      role: [fiduciary]
    observation: >
      No process exists for making the initial intimation to the Data Protection Board
      without delay on becoming aware of a personal data breach.
    impact: >
      Regulators consistently treat a delayed notification more harshly than an early one
      that acknowledges an investigation still in progress. A breach that becomes public
      before the Board is formally notified attracts additional scrutiny.
    action: >
      Prepare the initial intimation template, confirm the Board's filing channel, and
      name the person authorised to file without needing further approval.

  - id: R7.4
    title: "Detailed 72-hour report to the Board"
    question: "Is there a template covering the prescribed contents of the detailed 72-hour report?"
    guidance: >
      The detailed report must cover the updated description, the facts and circumstances
      and reasons, mitigation measures, findings on who or what caused the breach,
      remedial measures to prevent recurrence, and a report on the intimations issued to
      Data Principals. The Board may extend the period on written request.
    evidence_required:
      - "Detailed report template mapped to prescribed contents"
    weight: 5
    severity_if_absent: critical
    applies_when:
      role: [fiduciary]
    observation: >
      No template exists for the detailed report to the Data Protection Board due within
      72 hours of becoming aware of a personal data breach.
    impact: >
      The report demands root-cause analysis and attribution findings that cannot be
      assembled from scratch inside three days without logs and a prepared structure.
      Entities that begin drafting at the point of incident routinely miss the deadline.
    action: >
      Build the detailed report template with a section for each prescribed content head,
      and pre-link each section to the log source or record that will populate it.

  - id: R7.5
    title: "CERT-In six-hour obligation recognised as parallel"
    question: "Does the breach procedure recognise the separate CERT-In six-hour reporting obligation?"
    guidance: >
      The CERT-In direction of 2022 requires reporting of specified cyber incidents within
      six hours on a separate channel. It is a parallel obligation, not an alternative to
      the Board notification. Most breach plans model only one clock.
    evidence_required:
      - "Breach procedure section covering CERT-In timelines"
    weight: 3
    severity_if_absent: medium
    applies_when:
      role: [fiduciary, processor]
    observation: >
      The breach response procedure does not recognise the separate CERT-In reporting
      obligation running on a six-hour clock alongside the Board notification.
    impact: >
      A single incident can breach two distinct regulatory regimes. Meeting the Board
      timeline does not discharge the CERT-In duty, and a procedure built around one clock
      will systematically miss the shorter one.
    action: >
      Add a dual-clock section to the incident procedure setting out both the CERT-In and
      Board timelines from the point of awareness, with the applicable incident categories
      for each.
