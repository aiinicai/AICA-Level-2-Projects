# S4 means Section 4 of the DPDP Act: the grounds for processing personal data,
# which are consent or a legitimate use. "S" marks a section of the Act rather than
# a DPDP Rule; the digits order the groups in every rule-ordered view.
#
# citation_status is pending: the sections cited have not yet been checked
# against the gazette text of the Act.

rule_id: S4
rule_ref: "DPDP Act, 2023 - Section 4 read with Sections 5(2), 6 and 7"
rule_title: "Consent and Legitimate Use"
citation_status: pending

controls:
  - id: S4.1
    title: "Notice to Data Principals whose consent predates the Act"
    question: "Where personal data is processed on consent given before the Act commenced, has the entity given each Data Principal the notice required by Section 5(2)?"
    guidance: >
      Under Section 5(2), consent given before the Act commenced continues until it is
      withdrawn. The duty is to give each such Data Principal a notice as soon as
      reasonably practicable, with the Rule 3 contents: the personal data and purposes
      itemised, how to withdraw consent, how to exercise rights, and how to complain to
      the Board. A fresh consent request is not required and should not be the default:
      asking everyone again risks recording silence as a refusal of processing that was
      already lawful. The evidence is the notice actually sent and a dated record of
      dispatch, not a draft.
    evidence_required:
      - "Notice sent to Data Principals whose consent was given before the Act commenced"
      - "Dated record of dispatch showing to whom and how the notice was sent"
    weight: 4
    severity_if_absent: high
    applies_when:
      role: [fiduciary]
    observation: >
      The entity has not given the Section 5(2) notice to Data Principals whose personal
      data it still processes on consent obtained before the Act commenced.
    impact: >
      The entity cannot show that those Data Principals were told what is held, why, and
      how to withdraw consent or complain, and the burden of proving notice rests on the
      entity under Section 6(10).
    action: >
      Identify each group of Data Principals processed on earlier consent. Send them a
      notice meeting Rule 3, framed as a notice rather than a fresh consent request, and
      keep a dated dispatch record against the version of the notice sent.

  - id: S4.2
    title: "Valid consent captured and provable"
    question: "Where processing relies on consent, is consent given by a clear affirmative action for each specified purpose, and can the entity prove it for each Data Principal?"
    guidance: >
      Section 6(1) requires consent to be free, specific, informed, unconditional and
      unambiguous, given by a clear affirmative action, and limited to the personal data
      needed for the specified purpose. Pre-ticked boxes, silence, inactivity, continued
      use, email opens and delivery receipts do not count. Under Section 6(10) the burden
      of proving that notice was given and consent obtained lies on the Data Fiduciary.
      The minimum record for each Data Principal is the date and time, the notice version
      shown, the purpose agreed and the action taken. Neither the Act nor the Rules set
      an expiry period for consent, so the absence of periodic re-consent is not a gap.
    evidence_required:
      - "Consent capture screen or form showing the affirmative action and the purposes it covers"
      - "Sample of consent records showing date, notice version and purpose for each Data Principal"
    weight: 5
    severity_if_absent: critical
    applies_when:
      role: [fiduciary]
    observation: >
      The entity does not capture consent by a clear affirmative action for each specified
      purpose, or cannot produce a record of consent for each Data Principal.
    impact: >
      Consent that cannot be shown to meet Section 6(1) cannot support the processing that
      relies on it, and Section 6(10) places the burden of proof on the entity.
    action: >
      Capture consent only by an unticked, itemised affirmative action for each purpose.
      Record the date and time, notice version, purpose and action for every Data
      Principal, and keep the records retrievable by Data Principal.

  - id: S4.3
    title: "Withdrawal of consent works in practice"
    question: "Can a Data Principal withdraw consent as easily as it was given, and does processing stop, including at processors, within a reasonable time after withdrawal?"
    guidance: >
      Section 6(4) requires withdrawal to be comparably easy to giving consent: a
      one-click consent with a written-letter withdrawal fails. Under Section 6(6), on
      withdrawal the Data Fiduciary must cease processing, and cause its Data Processors
      to cease, within a reasonable time, unless processing without consent is required
      or authorised by law. Under Section 6(5) the consequences of withdrawal are borne by
      the Data Principal. Walk through one real withdrawal end to end, from the request to
      the instruction reaching each processor.
    evidence_required:
      - "Withdrawal route (link, form or setting) and where it is offered"
      - "Record of a withdrawal handled end to end, including the instruction to processors"
    weight: 4
    severity_if_absent: high
    applies_when:
      role: [fiduciary]
    observation: >
      Withdrawal of consent is harder than giving it, or the entity cannot show that
      processing, including at its processors, stops within a reasonable time after a
      withdrawal.
    impact: >
      Processing that continues after withdrawal has no consent to rest on, and a
      withdrawal route harder than the consent route does not meet Section 6(4).
    action: >
      Offer withdrawal on the same channel as consent, with no more steps. Define who acts
      on a withdrawal, by when processing stops, and the instruction sent to each Data
      Processor, and keep a dated record of each withdrawal handled.

  - id: S4.4
    title: "Legitimate use recorded where consent is not relied on"
    question: "Where personal data is processed without consent, has the entity identified and recorded the specific legitimate use under Section 7 that it relies on for each such activity?"
    guidance: >
      Section 7 lists specific legitimate uses; there is no general legitimate-interest
      ground. Section 7(i) covers employment purposes, safeguarding the employer from
      loss or liability, and benefits sought by an employee. Employee data used for these
      purposes needs a notice citing Section 7(i), not consent, and consent from an
      employee is in any case hard to show as freely given under Section 6(1). Every
      other activity processed without consent must name the clause relied on. A blanket
      statement that processing is lawful fails.
    evidence_required:
      - "Register or processing record naming the Section 7 clause relied on for each activity processed without consent"
      - "Employee notice or policy stating the employment purposes relied on under Section 7(i)"
    weight: 4
    severity_if_absent: high
    applies_when:
      role: [fiduciary]
    observation: >
      The entity processes personal data without consent but has not recorded the
      specific Section 7 legitimate use relied on for each such activity.
    impact: >
      Processing without consent and without an identified legitimate use has no ground
      under Section 4, and the entity cannot show why consent was not needed.
    action: >
      List each activity processed without consent and record the Section 7 clause relied
      on for each. Give employees a notice citing Section 7(i), and move to consent any
      activity that no clause covers.
