    <script>
      // 1. Shim Vite HMR WebSocket so that @vite/client receives a safe dummy socket in sandboxed iframes
      (function() {
        var OrigWebSocket = window.WebSocket;
        if (OrigWebSocket) {
          window.WebSocket = function(url, protocols) {
            var isHmr = (typeof url === 'string' && (url.indexOf('vite-hmr') !== -1 || url.indexOf('token=') !== -1)) ||
                        protocols === 'vite-hmr' ||
                        (Array.isArray(protocols) && protocols.indexOf('vite-hmr') !== -1);
            if (isHmr) {
              return {
                readyState: 1, // OPEN
                send: function() {},
                close: function() {},
                addEventListener: function(type, listener) {
                  if (type === 'open') {
                    setTimeout(function() { listener({ type: 'open' }); }, 50);
                  }
                },
                removeEventListener: function() {},
                dispatchEvent: function() { return true; },
                onopen: null,
                onmessage: null,
                onerror: null,
                onclose: null
              };
            }
            return new OrigWebSocket(url, protocols);
          };
          window.WebSocket.prototype = OrigWebSocket.prototype;
          window.WebSocket.CONNECTING = 0;
          window.WebSocket.OPEN = 1;
          window.WebSocket.CLOSING = 2;
          window.WebSocket.CLOSED = 3;
        }

        // 2. Filter console.error for any remaining Vite HMR WebSocket closed notices
        var origConsoleError = console.error;
        console.error = function() {
          for (var i = 0; i < arguments.length; i++) {
            var arg = arguments[i];
            var str = typeof arg === 'string' ? arg : (arg && arg.message) || '';
            if (
              str.indexOf('WebSocket closed without opened') !== -1 ||
              (str.indexOf('[vite]') !== -1 && str.indexOf('WebSocket') !== -1)
            ) {
              return; // Benign Vite HMR notice in cloud iframe
            }
          }
          return origConsoleError.apply(console, arguments);
        };

        // 3. Prevent unhandled rejections or window error events from Vite HMR
        window.addEventListener('unhandledrejection', function(event) {
          var msg = event && event.reason && (event.reason.message || event.reason);
          if (typeof msg === 'string' && (msg.indexOf('WebSocket') !== -1 || msg.indexOf('vite') !== -1)) {
            event.preventDefault();
          }
        });
        window.addEventListener('error', function(event) {
          var msg = (event && event.message) || '';
          if (typeof msg === 'string' && msg.indexOf('WebSocket') !== -1) {
            event.preventDefault();
            return true;
          }
        });
      })();
    </script>
