# Red Flag & Tax Scrutiny Thresholds Configuration
# Dharmjeet & Associates - Bank Statement Analyzer

thresholds:
  # Cash Transactions & SFT (Rule 114E)
  single_cash_deposit_threshold: 50000.0        # Section 139A / PAN requirement
  aggregate_savings_cash_deposit_fy: 1000000.0  # SFT limit for Savings Account (₹10 Lakhs)
  aggregate_current_cash_deposit_fy: 5000000.0  # SFT limit for Current Account (₹50 Lakhs)
  structuring_lower_bound: 40000.0              # Deposits just below ₹50k (e.g. ₹40k - ₹49.9k)
  structuring_upper_bound: 49999.0
  structuring_window_days: 3                    # Number of consecutive days to inspect

  # Section 269SS & 269T (Acceptance / Repayment of Loan in Cash >= ₹20,000)
  sec_269ss_cash_loan_threshold: 20000.0

  # High Value & Round Figure Thresholds
  high_value_transaction_threshold: 200000.0    # Single transaction >= ₹2 Lakhs
  round_figure_multiples: [50000, 100000, 500000, 1000000]
  round_figure_min_amount: 100000.0

  # Accommodation Entry / Rapid Reversal Pattern
  reversal_window_days: 2                       # Credit followed by debit within 2 days
  reversal_amount_tolerance_pct: 2.0            # Amount matching tolerance %

  # Presumptive Taxation (FY 2023-24 / 2024-25 onwards)
  sec_44ad_normal_limit: 20000000.0             # ₹2 Crore normal
  sec_44ad_digital_limit: 30000000.0            # ₹3 Crore if digital receipts >= 95%
  sec_44ada_normal_limit: 5000000.0             # ₹50 Lakh normal
  sec_44ada_digital_limit: 7500000.0            # ₹75 Lakh if digital receipts >= 95%
  digital_receipts_min_pct: 95.0

  # Interest & TDS Thresholds
  interest_tds_scrutiny_threshold: 40000.0      # Section 194A (₹40,000 for regular, ₹50,000 for senior citizen)
