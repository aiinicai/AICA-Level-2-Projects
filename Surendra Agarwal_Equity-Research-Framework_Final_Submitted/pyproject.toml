[project]
name = "equity-research-framework"
version = "0.1.0"
description = "AI-Enabled Equity Research & Investment Decision Framework for Indian listed companies"
requires-python = ">=3.13,<3.14"
readme = "README.md"

[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-ra -q --strict-markers"
markers = [
    "integration: end-to-end / multi-component tests",
    "edge_case: data-quality and boundary-condition tests",
]
filterwarnings = [
    # Cosmetic-only deprecation warnings originating INSIDE PyMuPDF's own
    # SWIG C-extension bindings (SwigPyPacked/SwigPyObject/swigvarlink),
    # not from any code in this project. They do not affect correctness -
    # PDF extraction is independently verified in tests/unit/test_documents.py.
    # Silenced here rather than upstream so a genuine DeprecationWarning
    # from OUR code would still surface normally.
    "ignore:.*has no __module__ attribute:DeprecationWarning",
]

[tool.black]
line-length = 100
target-version = ["py313"]

[tool.mypy]
python_version = "3.13"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
ignore_missing_imports = true

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
