[theme]
# "Midnight + Electric Teal" — a considered two-tone palette:
#
#   Midnight       #172A46  - primary (buttons, active nav, sliders, links)
#   Ledger Paper   #F6F8FA  - background
#   Slate Card     #E5EAF0  - secondary background (sidebar, inputs, tables)
#   Ink            #18212B  - text
#   Electric Teal  #00A6A6  - accent (key metric values only — see
#                              app/ui/styling.py; deliberately NOT spread
#                              across every element, since Streamlit's
#                              native theme.toml has exactly one
#                              interactive-color slot (primaryColor) and
#                              no separate "accent" slot — this keeps the
#                              teal as one deliberate, verified touch
#                              rather than a fragile blanket CSS override
#                              across dozens of sub-elements this sandbox
#                              cannot visually verify)
#
# Only keys confirmed supported by the actually-pinned streamlit==1.41.1
# are used here (verified via streamlit.config.get_options_for_section
# ("theme") against that exact version) — no custom Google Fonts or
# other newer-version-only theme keys.
base = "light"
primaryColor = "#172A46"
backgroundColor = "#F6F8FA"
secondaryBackgroundColor = "#E5EAF0"
textColor = "#18212B"
font = "sans serif"

