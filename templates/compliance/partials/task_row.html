<tr id="task-row-{{ task.id }}" class="hover:bg-slate-50 dark:hover:bg-navy-900/50 transition">
    <td class="py-3 px-3">
        <span class="font-bold text-slate-900 dark:text-white block">{{ task.title }}</span>
        <span class="text-[11px] text-slate-500 dark:text-slate-400 block mt-0.5 line-clamp-1">{{ task.description }}</span>
    </td>
    <td class="py-3 px-3 font-semibold text-emerald-600 dark:text-emerald-400 whitespace-nowrap text-xs">
        {{ task.department.get_name_display }}
    </td>
    <td class="py-3 px-3 whitespace-nowrap">
        <span class="px-2 py-0.5 rounded text-[10px] font-bold {% if task.priority == 'CRITICAL' %}bg-rose-500/20 text-rose-500 border border-rose-500/30{% elif task.priority == 'HIGH' %}bg-amber-500/20 text-amber-500 border border-amber-500/30{% else %}bg-blue-500/20 text-blue-400 border border-blue-500/30{% endif %}">
            {{ task.priority }}
        </span>
    </td>
    <td class="py-3 px-3 whitespace-nowrap font-mono text-[11px] text-slate-700 dark:text-slate-300">
        {{ task.deadline|date:"d M Y" }}
    </td>
    <td class="py-3 px-3 whitespace-nowrap">
        <button hx-post="{% url 'toggle_task_status' task.id %}" 
                hx-target="#task-row-{{ task.id }}" 
                hx-swap="outerHTML" 
                class="px-2.5 py-1 rounded text-[10px] font-bold transition flex items-center gap-1 cursor-pointer {% if task.status == 'COMPLETED' %}bg-emerald-500/20 text-emerald-500 hover:bg-emerald-500/30 border border-emerald-500/30{% elif task.status == 'IN_PROGRESS' %}bg-blue-500/20 text-blue-400 hover:bg-blue-500/30 border border-blue-500/30{% else %}bg-slate-500/20 text-slate-400 hover:bg-slate-500/30 border border-slate-500/30{% endif %}" title="Click to Cycle Status">
            {% if task.status == 'COMPLETED' %}✔ COMPLIANT{% elif task.status == 'IN_PROGRESS' %}⚡ IN PROGRESS{% else %}⏳ PENDING{% endif %}
        </button>
    </td>
    <td class="py-3 px-3 text-right whitespace-nowrap">
        <button @click="evidenceTaskId = {{ task.id }}; evidenceTaskTitle = '{{ task.title|escapejs }}'; evidenceModal = true" class="px-2.5 py-1 bg-slate-200 dark:bg-navy-700 hover:bg-slate-300 dark:hover:bg-navy-600 text-slate-700 dark:text-slate-200 text-[11px] font-semibold rounded transition">
            📎 Upload Evidence
        </button>
    </td>
</tr>
