<div id="shopping-item-{{ item.id }}" 
     class="flex items-center justify-between p-3 rounded-2xl transition-all border
     {% if item.is_bought %}bg-slate-50 border-slate-200 text-slate-400{% else %}bg-white border-slate-200 hover:border-emerald-200 shadow-xs{% endif %}">
    
    <div class="flex items-center gap-3">
        <!-- Checkbox Toggle -->
        <button type="button" 
                hx-post="{% url 'shopping_toggle' item.id %}"
                hx-target="#shopping-item-{{ item.id }}"
                hx-swap="outerHTML"
                class="w-6 h-6 rounded-lg flex items-center justify-center border transition-all text-xs font-bold
                {% if item.is_bought %}bg-emerald-500 border-emerald-500 text-white{% else %}border-slate-300 hover:border-emerald-400 bg-white text-transparent{% endif %}">
            ✓
        </button>

        <div>
            <span class="text-xs sm:text-sm font-bold block {% if item.is_bought %}line-through text-slate-400{% else %}text-slate-800{% endif %}">
                {{ item.name }}
            </span>
            
            <div class="flex items-center gap-2 mt-0.5">
                {% if item.quantity_note %}
                <span class="text-[11px] text-slate-600 font-medium">{{ item.quantity_note }}</span>
                {% endif %}

                {% if item.recipe_source %}
                <span class="text-[10px] font-semibold bg-indigo-50 text-indigo-700 px-1.5 py-0.2 rounded-md truncate max-w-[140px]">
                    For: {{ item.recipe_source.title }}
                </span>
                {% endif %}
            </div>
        </div>
    </div>

    <!-- Delete Button -->
    <button type="button"
            hx-post="{% url 'shopping_delete' item.id %}"
            hx-target="#shopping-item-{{ item.id }}"
            hx-swap="outerHTML"
            class="text-slate-300 hover:text-rose-500 p-1.5 rounded-lg transition-colors"
            title="Delete item">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" />
        </svg>
    </button>
</div>
