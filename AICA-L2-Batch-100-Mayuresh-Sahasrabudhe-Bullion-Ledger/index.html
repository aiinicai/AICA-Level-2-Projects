<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Bullion Ledger | Indian Physical Gold & Silver Portfolio Tracker</title>
    <meta name="description" content="Bullion Ledger - Disciplined physical gold and silver tracking for Indian investors. Valuation, XIRR returns, price history, and offline ledger." />
    <meta name="theme-color" content="#FAF7F2" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700&family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <script>
      // Immediate Cache Purge & Service Worker Deregistration on Localhost
      (function() {
        if (typeof window !== 'undefined' && (location.hostname === 'localhost' || location.hostname === '127.0.0.1')) {
          if ('serviceWorker' in navigator) {
            navigator.serviceWorker.getRegistrations().then(function(regs) {
              for (var i = 0; i < regs.length; i++) {
                regs[i].unregister();
                console.log('[PWA Dev] Deregistered stale Service Worker:', regs[i].scope);
              }
            });
          }
          if ('caches' in window) {
            caches.keys().then(function(names) {
              for (var j = 0; j < names.length; j++) {
                caches.delete(names[j]);
                console.log('[PWA Dev] Purged stale CacheStorage:', names[j]);
              }
            });
          }
        }
      })();
    </script>
  </head>
  <body class="bg-ivory-100 text-charcoal-900 font-sans antialiased min-h-screen selection:bg-gold-200 selection:text-gold-900">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
