<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>System Architecture — Session Quiz &amp; Feedback System</title>
<style>
  :root { color-scheme: light dark; }
  body {
    margin: 0;
    padding: 32px 16px;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: #F5F7FA;
    color: #1A2733;
    display: flex;
    flex-direction: column;
    align-items: center;
  }
  h1 { font-size: 20px; margin: 0 0 4px; }
  .sub { color: #5B6B7A; font-size: 13px; margin: 0 0 24px; }
  figure { margin: 0; max-width: 1100px; width: 100%; }
  svg { width: 100%; height: auto; display: block; }
  figcaption { font-size: 12.5px; color: #5B6B7A; margin-top: 12px; text-align: center; }
  .legend { display: flex; gap: 24px; justify-content: center; margin-top: 16px; font-size: 12px; color: #5B6B7A; }
  .legend span { display: inline-flex; align-items: center; gap: 6px; }
  .dot { width: 10px; height: 10px; border-radius: 2px; display: inline-block; }
</style>
</head>
<body>

<h1>System Architecture</h1>
<p class="sub">AI-Powered Session Quiz &amp; Feedback System — how the two built workflows share one data store</p>

<figure>
<svg viewBox="0 0 1080 560" role="img" aria-label="Two workflows, Question Bank Generator and Student Access Control, both run in n8n and read from or write to a shared Google Sheets database with six tabs; solid arrows mark built and tested steps, dashed arrows mark the planned next phase.">

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="currentColor"/>
    </marker>
    <marker id="arrowGold" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#B8860B"/>
    </marker>
  </defs>

  <!-- ===== Workflow 1 lane (top) ===== -->
  <text x="24" y="30" font-size="13" font-weight="700" fill="currentColor">Workflow 1 — Question Bank Generator (built &amp; tested)</text>

  <!-- Faculty -->
  <rect x="24" y="50" width="120" height="50" rx="8" fill="none" stroke="currentColor" stroke-width="1.4"/>
  <text x="84" y="80" font-size="12" text-anchor="middle" fill="currentColor">Faculty</text>

  <line x1="144" y1="75" x2="196" y2="75" stroke="currentColor" stroke-width="1.4" marker-end="url(#arrow)"/>
  <text x="170" y="66" font-size="10.5" text-anchor="middle" fill="currentColor">submits notes</text>

  <!-- Form Trigger -->
  <rect x="200" y="50" width="130" height="50" rx="8" fill="none" stroke="currentColor" stroke-width="1.4"/>
  <text x="265" y="72" font-size="11.5" text-anchor="middle" fill="currentColor">Form Trigger</text>
  <text x="265" y="86" font-size="10" text-anchor="middle" fill="currentColor" opacity="0.7">topic + notes</text>

  <line x1="330" y1="75" x2="382" y2="75" stroke="currentColor" stroke-width="1.4" marker-end="url(#arrow)"/>

  <!-- AI Agent -->
  <rect x="386" y="50" width="150" height="50" rx="8" fill="none" stroke="currentColor" stroke-width="1.4"/>
  <text x="461" y="72" font-size="11.5" text-anchor="middle" fill="currentColor">AI Agent</text>
  <text x="461" y="86" font-size="10" text-anchor="middle" fill="currentColor" opacity="0.7">Gemini generates Qs</text>

  <line x1="536" y1="75" x2="588" y2="75" stroke="currentColor" stroke-width="1.4" marker-end="url(#arrow)"/>
  <text x="562" y="66" font-size="10.5" text-anchor="middle" fill="currentColor">strict JSON</text>

  <!-- Structured Output Parser -->
  <rect x="592" y="50" width="150" height="50" rx="8" fill="none" stroke="currentColor" stroke-width="1.4"/>
  <text x="667" y="72" font-size="11.5" text-anchor="middle" fill="currentColor">Output Parser</text>
  <text x="667" y="86" font-size="10" text-anchor="middle" fill="currentColor" opacity="0.7">enforces schema</text>

  <line x1="742" y1="75" x2="794" y2="75" stroke="currentColor" stroke-width="1.4" marker-end="url(#arrow)"/>

  <!-- Split Out -->
  <rect x="798" y="50" width="120" height="50" rx="8" fill="none" stroke="currentColor" stroke-width="1.4"/>
  <text x="858" y="72" font-size="11.5" text-anchor="middle" fill="currentColor">Split Out</text>
  <text x="858" y="86" font-size="10" text-anchor="middle" fill="currentColor" opacity="0.7">1 batch → 12 rows</text>

  <!-- down to sheet -->
  <line x1="858" y1="100" x2="858" y2="230" stroke="currentColor" stroke-width="1.4" marker-end="url(#arrow)"/>
  <text x="868" y="170" font-size="10.5" fill="currentColor">writes rows</text>

  <!-- ===== Workflow 2 lane (bottom) ===== -->
  <text x="24" y="330" font-size="13" font-weight="700" fill="currentColor">Workflow 2 — Student Access Control (built &amp; tested)</text>

  <!-- Student -->
  <rect x="24" y="350" width="120" height="50" rx="8" fill="none" stroke="currentColor" stroke-width="1.4"/>
  <text x="84" y="380" font-size="12" text-anchor="middle" fill="currentColor">Student</text>

  <line x1="144" y1="375" x2="196" y2="375" stroke="currentColor" stroke-width="1.4" marker-end="url(#arrow)"/>
  <text x="170" y="366" font-size="10.5" text-anchor="middle" fill="currentColor">registers</text>

  <!-- Registration form -->
  <rect x="200" y="350" width="130" height="50" rx="8" fill="none" stroke="currentColor" stroke-width="1.4"/>
  <text x="265" y="372" font-size="11.5" text-anchor="middle" fill="currentColor">Registration Form</text>
  <text x="265" y="386" font-size="10" text-anchor="middle" fill="currentColor" opacity="0.7">BSP, name, email…</text>

  <line x1="330" y1="375" x2="382" y2="375" stroke="currentColor" stroke-width="1.4" marker-end="url(#arrow)"/>

  <!-- Verify Identity -->
  <rect x="386" y="350" width="150" height="50" rx="8" fill="none" stroke="currentColor" stroke-width="1.4"/>
  <text x="461" y="372" font-size="11.5" text-anchor="middle" fill="currentColor">Verify Identity</text>
  <text x="461" y="386" font-size="10" text-anchor="middle" fill="currentColor" opacity="0.7">BSP + email match</text>

  <!-- up to sheet (reads roster) -->
  <line x1="461" y1="350" x2="461" y2="300" stroke="currentColor" stroke-width="1.4" marker-end="url(#arrow)"/>
  <text x="471" y="325" font-size="10.5" fill="currentColor">reads roster</text>

  <line x1="536" y1="375" x2="588" y2="375" stroke="currentColor" stroke-width="1.4" marker-end="url(#arrow)"/>
  <text x="562" y="366" font-size="10.5" text-anchor="middle" fill="currentColor">match?</text>

  <!-- Check Attempts -->
  <rect x="592" y="350" width="150" height="50" rx="8" fill="none" stroke="currentColor" stroke-width="1.4"/>
  <text x="667" y="372" font-size="11.5" text-anchor="middle" fill="currentColor">Check Attempts</text>
  <text x="667" y="386" font-size="10" text-anchor="middle" fill="currentColor" opacity="0.7">prior attempt?</text>

  <line x1="667" y1="350" x2="667" y2="300" stroke="currentColor" stroke-width="1.4" marker-end="url(#arrow)"/>
  <text x="677" y="325" font-size="10.5" fill="currentColor">reads/writes log</text>

  <line x1="742" y1="375" x2="794" y2="375" stroke="currentColor" stroke-width="1.4" marker-end="url(#arrow)"/>
  <text x="768" y="366" font-size="10.5" text-anchor="middle" fill="currentColor">none found</text>

  <!-- Cleared -->
  <rect x="798" y="350" width="120" height="50" rx="8" fill="none" stroke="currentColor" stroke-width="1.4"/>
  <text x="858" y="372" font-size="11.5" text-anchor="middle" fill="currentColor">Cleared</text>
  <text x="858" y="386" font-size="10" text-anchor="middle" fill="currentColor" opacity="0.7">proceed to quiz</text>

  <!-- Planned dashed continuation -->
  <line x1="918" y1="375" x2="1000" y2="375" stroke="#B8860B" stroke-width="1.6" stroke-dasharray="5,4" marker-end="url(#arrowGold)"/>
  <text x="1040" y="366" font-size="10.5" text-anchor="middle" fill="#B8860B">planned:</text>
  <text x="1040" y="386" font-size="10" text-anchor="middle" fill="#B8860B">quiz + grading</text>

  <!-- ===== Central Google Sheets store ===== -->
  <rect x="758" y="230" width="200" height="70" rx="10" fill="none" stroke="currentColor" stroke-width="1.8"/>
  <text x="858" y="253" font-size="12" font-weight="700" text-anchor="middle" fill="currentColor">Google Sheets</text>
  <text x="858" y="269" font-size="9.5" text-anchor="middle" fill="currentColor" opacity="0.75">Question_Bank · Students</text>
  <text x="858" y="282" font-size="9.5" text-anchor="middle" fill="currentColor" opacity="0.75">Attempts · Settings</text>

  <!-- connectors from sheet to workflow2 boxes already drawn above -->

</svg>
<figcaption>Faculty generate an AI-written question bank (top lane); students register through a separate flow that checks the same shared spreadsheet before clearing access (bottom lane). Dashed gold marks the planned next phase — quiz delivery and grading — not yet built.</figcaption>
</figure>

<div class="legend">
  <span><span class="dot" style="background:currentColor"></span> Built &amp; tested</span>
  <span><span class="dot" style="background:#B8860B"></span> Planned next phase</span>
</div>

</body>
</html>
