<div class="table-responsive bg-white border">
<table class="table table-sm table-hover items align-middle mb-0">
  <thead class="table-light"><tr><th>Vendor</th><th>Cheque no</th><th>Voucher</th><th>Cheque date</th><th>Lot</th>
    <th class="text-end">Amount</th><th>Status</th><th class="text-end">Hold amount</th><th>Next honouring date</th>
    <th>Honour lot</th><th class="text-end">Days held</th><th style="width: 13rem">Action</th></tr></thead>
  {% for i in items %}{% include "_item.html" %}{% else %}
  <tbody><tr><td colspan="12" class="text-muted">No cheques match.</td></tr></tbody>{% endfor %}
  <tfoot><tr class="fw-semibold"><td colspan="5">{{ items|length }} cheque(s)</td><td class="text-end">{{ total|money(false) }}</td>
    <td></td><td class="text-end">{{ held_total|money }}</td><td colspan="4"></td></tr></tfoot>
</table>
</div>
