[application]
host = 127.0.0.1
port = 8080
debug = false
open_browser = true
version = 1.0.1

[paths]
output = output
logs = logs
temp = temp
profiles = profiles
database = data/bank_converter.db
backups = data/backups

[privacy]
allow_external_ai = false
allow_cloud_ocr = false

[normalization]
default_date_order = DMY

[validation]
review_confidence_threshold = 80
strict_balance_check = true

[profiles]
auto_apply = false
match_threshold = 85
backup_before_update = true

[ocr]
enabled = true
auto_ocr = true
language = en
render_dpi = 250
minimum_word_confidence = 70
limited_text_word_threshold = 20
max_pages = 250
worker_count = 1
keep_rendered_pages = false
model_dir = models/ocr

