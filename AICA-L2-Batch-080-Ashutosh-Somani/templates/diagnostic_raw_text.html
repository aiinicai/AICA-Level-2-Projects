{% extends "base.html" %}

{% block content %}
<div class="card">
    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1rem;">
        <h2>Diagnostic: Raw Text</h2>
        <a href="{{ url_for('extraction.diagnostics', job_id=job.id) }}" class="btn">Back to Diagnostics</a>
    </div>

    {% for page in result.pages %}
        <div style="margin-bottom: 2rem; border: 1px solid var(--border-color); padding: 1rem; border-radius: 4px; background: #fafafa;">
            <h4>Page {{ page.page_number }}</h4>
            <pre style="white-space: pre-wrap; font-family: monospace; font-size: 14px; background: white; padding: 1rem; border: 1px solid #ddd; overflow-x: auto;">{{ page.raw_text|e }}</pre>
        </div>
    {% endfor %}
</div>
{% endblock %}
