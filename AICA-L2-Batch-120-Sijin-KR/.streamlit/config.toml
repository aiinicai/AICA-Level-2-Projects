[server]
address = "127.0.0.1"      # local only: never listens on the network
headless = false
[browser]
gatherUsageStats = false   # no telemetry
[theme]
base = "light"
primaryColor = "#B8892B"            # gold
backgroundColor = "#F5F7FB"
secondaryBackgroundColor = "#E9EEF7"
textColor = "#0B1F3A"               # navy
font = "sans serif"
