# Legal references the TP report may cite (checklist 1.13 - "References to law, guidelines and thresholds are current").
# Maintained by the firm. as_of = date the list was last verified against official FTA / MoF publications. Edit this file when the law changes.
as_of: "2026-10-16"
current:        # pattern (regex, case-insensitive) -> note shown to the reviewer
  - {rx: 'Federal\s+Decree[- ]Law\s+(?:No\.?\s*)?\(?47\)?\s+of\s+2022', note: "Corporate Tax Law (as amended by Federal Decree-Law No. 60 of 2023)"}
  - {rx: 'Federal\s+Decree[- ]Law\s+(?:No\.?\s*)?\(?60\)?\s+of\s+2023', note: "Amendment to the Corporate Tax Law"}
  - {rx: 'Ministerial\s+Decision\s+(?:No\.?\s*)?\(?97\)?\s+of\s+2023', note: "Master File / Local File documentation conditions"}
  - {rx: 'Cabinet\s+(?:Decision|Resolution)\s+(?:No\.?\s*)?\(?44\)?\s+of\s+2020', note: "Country-by-Country Reporting"}
  - {rx: 'CTGTP1', note: "FTA Transfer Pricing Guide (October 2023)"}
  - {rx: 'CTGAPA1', note: "FTA Advance Pricing Agreements Guide (December 2025)"}
  - {rx: 'OECD\s+(?:Transfer\s+Pricing\s+)?Guidelines[^.\n]{0,40}2022', note: "OECD TP Guidelines 2022 are the current edition"}
outdated:       # pattern -> what is wrong
  - {rx: 'OECD\s+(?:Transfer\s+Pricing\s+)?Guidelines[^.\n]{0,40}(2010|2017|1995)', note: "Superseded OECD edition - the 2022 Guidelines are current"}
  - {rx: 'Federal\s+Law\s+(?:No\.?\s*)?\(?7\)?\s+of\s+2017', note: "Not a Corporate Tax instrument - check the citation"}
  - {rx: 'Cabinet\s+Decision\s+(?:No\.?\s*)?\(?(?:34|35)\)?\s+of\s+2023', note: "Check: not a transfer pricing instrument - confirm the citation"}
thresholds_aed:   # amounts that may legitimately be quoted for TP documentation / disclosure
  allowed: [40000000, 4000000, 500000, 200000000, 3150000000, 375000, 3000000, 100000000, 30000, 15000]
unknown_instrument_note: "Not in the firm's reference list (rules/law_refs.yaml) - verify the number and year against the FTA / MoF site"
