# Firm-editable parameters. Every value that a Partner may change lives here, not in code.
typography:
  font: Times New Roman
  allowed_sizes: [10, 11, 12, 14]      # FSX 0_Formatting: 14 name/address, 12 headings, 10 content, 11 auditor's report
  size_tolerance: 0.25
margins_in:
  left: 1.3                            # FSX 0_Formatting 5
  top: 1.5
  right_bottom_allowed: [1.0, 0.75, 0.5]
  tolerance: 0.03
  pdf_tolerance: 0.12                  # text-extent measurement from PDF is approximate
narrative_min_words: 25

legal_status_terms:                    # FSX Annexure II
  FZC: Company
  FZE: Establishment
  LLC: Company
  SOLE: Establishment
  LLP: Entity
  CIVIL: Entity
  OTHER: Entity

authority_tokens: [DMCC, DED, DWC, DSO, IFZA, JAFZA, DIFC, RAKEZ, ADGM, KEZAD, DAFZA, DDA, SHAMS, DIEZ]

mandatory_notes:                       # FSX 5_Word notes 13, 15, 18; RBP 16
  End of service benefits: 'end of service|terminal benefit|gratuity'
  VAT / duties and taxes: '\bVAT\b|duties and taxes|value added tax'
  PPE useful lives or nil statement: 'useful li(fe|ves)|no property, plant and equipment'
  Corporate tax: 'corporate tax'

# TECHNICAL SIGN-OFF REQUIRED each year-end: sample entries only, maintained by the technical partner.
standards_not_yet_effective_mentions:
  2024: ['IFRS 18', 'IFRS 19', 'Lack of Exchangeability']
  2025: ['IFRS 18', 'IFRS 19', 'Classification and Measurement of Financial Instruments']
  2026: ['IFRS 18', 'IFRS 19']

review_levels: [preparer, supervisor, manager]   # BRIEF z

# ---- Liquidation module ----
holidays: []        # load the official UAE holiday calendar here; deliberately not bundled to avoid a stale list
weekend: [5, 6]     # Saturday, Sunday (Monday=0)
internal_vat_dereg_days_from_br: 30     # LQW step 6 (internal rule)
fta_notification_business_days: 20      # BRIEF b3, counted from liquidator appointment letter
authorities:
  mainland: {creditor_block_days: 45, max_months_to_report: 12}
  difc:     {creditor_block_days: 45, max_months_to_report: 12}
  dso:      {min_gap_days_br_to_report: 14, expired_licence_report_days: 30}
  dmcc:     {}
  rakez:    {}
  jafza:    {workflow_missing: true}   # no JAFZA sheet in the liquidation workbook
  dda:      {workflow_missing: true}   # DDA sheet holds only a URL
facility_nocs: [telecom, utilities, chiller, landlord]
legal_nocs: [po_box, vat_deregistration, ct_deregistration, authority_portal, labour_visa, establishment_card, esr_aml, customs]

tp_report:                             # thresholds for checklist section 1.4 (formatting)
  font: Times New Roman
  sizes_pt: {body: 11, main_heading: 19.5, subheading: 12, tables: 11, header_footer: 11, editable_annexure: 11}
  page_border_pt: 1.5
  header_titles: ["Transfer Pricing Benchmark Analysis", "Transfer Pricing Benchmarking Analysis"]   # workbook uses both spellings - Partner to fix one
  page_number: right of header, dynamic field
  footer: company name per trade licence, right   # 0_Formatting says "approved firm name" - Partner to confirm which

# ---- Module D: Corporate tax working-sheet review (values to be confirmed by the technical partner each year) ----
ct:
  zero_band: 375000                 # AED, 0% band (Art. 3 FDL 47/2022; CD 116/2023)
  rate: 0.09
  loss_cap: 0.75                    # Art. 37(3)
  interest_cap_pct: 0.30            # Art. 30
  interest_safe_harbour: 12000000   # MD 126/2023
  entertainment_deductible: 0.50    # Art. 32
  return_months: 9                  # Art. 53: 9 months from end of tax period
  late_filing: {first12_per_month: 500, after_12_per_month: 1000}      # CD 75/2023 as amended
  late_payment_pct_pa: 0.14
  de_minimis: {abs: 5000000, pct: 0.05}                                 # Art. 18(3) / CD 100/2023
  sbr: {revenue_limit: 3000000, last_period_end: "2029-12-31"}          # MD 73/2023 as amended by MD 131/2026
  tolerance: 1.0                    # AED, rounding tolerance on tie-outs
  tp_disclosure: {aggregate: 40000000, category: 4000000, connected_persons: 500000}   # Disclosure Form / Art. 36
  tp_files: {own_revenue: 200000000, group_revenue: 3150000000}         # MD 97/2023 Master/Local file

# ---- Module C: TP report review ----
tp:
  quartile_method: INC              # INC = Excel QUARTILE.INC, EXC = QUARTILE.EXC. Firm to confirm; engine reports the other method as a grey-area note
  stat_tolerance_pp: 0.01           # percentage points allowed between report and workbook (rounding)
  heading_sizes: {main: 19.5, sub: 12, body: 11, table: 11, header_footer: 11}
  page_border_eighths_pt: 12        # 1.5 pt = 12 eighths of a point (w:pgBorders sz)
  titles: ["Transfer Pricing Benchmark Analysis", "Transfer Pricing Benchmarking Analysis", "TP Financial Update", "Transfer Pricing Financial Update"]
  refresh_cycle_years: 3            # a full benchmarking refresh is commonly needed every 3 years (confirm firm / FTA position)
  range_move_pct: 25                # IQR / remuneration movement above this % year-on-year must be explained in a Financial Update
  pli_columns: ["pli", "op/oc", "oc", "ncp", "net cost plus", "operating margin", "om", "ebit margin", "mark-up", "markup", "margin", "ratio", "compensation", "remuneration", "salary"]

# ---- Module E: Forensic ----
forensic:
  weekend_days: [5, 6]              # Python weekday(): Mon=0 ... Sat=5, Sun=6
  round_min_amount: 10000           # amounts >= this that end in 000 are flagged
  round_share_alert: 0.08           # share of round amounts above which the population is flagged
  just_below_pct: 0.05              # amounts within this % below an approval limit
  approval_limits: [10000, 25000, 50000, 100000]
  user_concentration_alert: 0.60    # one user posting more than this share of manual journals
  benford_mad_alert: 0.015          # mean absolute deviation (Nigrini: >0.015 non-conformity for first digits)
  benford_min_items: 300
  keywords: [cash, personal, loan, advance, adjustment, write off, write-off, gift, commission, consultancy, misc, sundry, reversal, rebate, bonus, petty]
  suspect_producers: [photoshop, canva, ilovepdf, smallpdf, sejda, pdfescape, foxit phantom, gimp, pixlr, wps, online2pdf, pdf24, nitro, sodapdf]
  modified_after_created_days: 1
  night_hours: [22, 5]              # entries created from 22:00 to 04:59 are flagged
  sig_similarity_min: 0.45          # signature vs specimen (blurred ink-map correlation): genuine variation scores 0.58+, rough forgeries below 0.30
  sig_identical_min: 0.985          # at or above = same image reused (hand signatures never repeat exactly)
  bank_material: 25000              # AED; smaller items are not listed
  bank_sweep_share: 0.60            # one transfer taking this share of the balance ...
  bank_sweep_left_share: 0.10       # ... and leaving less than this share
  bank_passthrough_days: 3
  bank_passthrough_share: 0.90
  bank_exempt_keywords: [salary, wps, payroll, fta, vat, corporate tax, bank charge, dewa, etisalat, visa, insurance]
  fs_gap_pp: 0.15                   # receivables growth minus revenue growth
  fs_margin_pp: 0.05                # gross margin change (5 percentage points)
  fs_sga_pp: 0.03                   # opex / revenue fall
  fs_accruals: 0.10                 # (net profit - operating cash flow) / total assets
  fs_dso_days: 15                   # change in inventory / payable days
  fs_gl_tol: 0.01                   # FS vs GL / stock register tolerance
  beneish_threshold: -1.78          # 8-variable M-score; above = possible manipulation
  cutoff_days: 5
  cutoff_reversal_days: 30
  cutoff_min_amount: 50000
  stock_tolerance_pct: 0.01         # shortage or surplus as a share of book value
  stock_min_value: 5000             # AED
  stock_adj_pct: 0.10
  stock_odd_locations: [third party, personal, home, unknown, staff, consignment]
