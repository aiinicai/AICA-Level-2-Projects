# AuditSignOff Suite UAE - Partner/Manager Review Automation - rule catalogue (single source of truth for the plan, the memo and the engine)
# cls: A = automatable (deterministic test)  B = assisted (extraction/NLP suggests, human confirms)  C = human judgement (platform tracks evidence + sign-off)
# src: BRIEF = capstone brief a-ff | FSX = Review_of_FS.xlsx | RBP = Review_Before_Print_Audit | TP-series = TP Updated Final Review Checklist - Managerial Remuneration (replaces TP_Review_Checklist_Excel_updated.xlsx) | LQW = Liquidation_steps workbook
# impl: true = executable in the Phase-1 prototype
checks:
# ---------------- Module A: Statutory audit FS pack ----------------
- {id: SA-01, mod: A, grp: Identity and legal documents, check: "Company name, emirate, activity and year-end agree to trade licence on cover, page 2, headers, Directors' report, FS and notes", cls: A, docs: "Trade licence; FS pack", sev: High, src: "FSX 1_Cover; RBP 1-3", impl: true}
- {id: SA-02, mod: A, grp: Identity and legal documents, check: "Legal-status wording (Company / Establishment / Entity) follows MOA and is used consistently", cls: B, docs: "MOA; notes", sev: Medium, src: "FSX Annexure II", impl: true}
- {id: SA-03, mod: A, grp: Identity and legal documents, check: "Shareholders, holding %, share capital and manager/director agree to MOA/AOA and TL", cls: B, docs: "MOA/AOA; TL; notes", sev: High, src: "FSX 5_Word notes 5-6; RBP 14", impl: true}
- {id: SA-04, mod: A, grp: Identity and legal documents, check: "Authorised signatory name spelling agrees to legal documents", cls: A, docs: "Passport/EID/MOA; FS pack", sev: High, src: "BRIEF g", impl: true}
- {id: SA-05, mod: A, grp: Identity and legal documents, check: "Number of FS signatories vs shareholders; Board Resolution on file where signatory is not all shareholders", cls: A, docs: "MOA; BR; FS pack", sev: High, src: "BRIEF m", impl: true}
- {id: SA-06, mod: A, grp: Identity and legal documents, check: "Current/previous year labels, period-end dates and stray years are consistent across the whole pack", cls: A, docs: "FS pack", sev: High, src: "BRIEF k; FSX 5_Word notes 10", impl: true}
- {id: SA-07, mod: A, grp: Auditor's report, check: "Audit report date present", cls: A, docs: "Auditor's report", sev: High, src: "BRIEF f; RBP 9", impl: true}
- {id: SA-08, mod: A, grp: Auditor's report, check: "Partner audit licence number and report reference number present", cls: A, docs: "Auditor's report", sev: High, src: "BRIEF f; RBP 9", impl: true}
- {id: SA-09, mod: A, grp: Auditor's report, check: "Licensing authority named in 'other legal and regulatory requirements' is the client's authority and no other", cls: A, docs: "Auditor's report; TL", sev: High, src: "BRIEF e; RBP 8", impl: true}
- {id: SA-10, mod: A, grp: Auditor's report, check: "Addressee singular/plural agrees to number of shareholders", cls: A, docs: "Auditor's report; MOA", sev: Low, src: "RBP 7; FSX 1_Cover", impl: true}
- {id: SA-11, mod: A, grp: Auditor's report, check: "Opinion wording, qualification, emphasis of matter, going concern, related-party and inventory paragraphs (ISA 700/705/706/570)", cls: B, docs: "Auditor's report; FS", sev: High, src: "BRIEF f; RBP 7", impl: true}
- {id: SA-12, mod: A, grp: Auditor's report, check: "Report date vs Directors' report date vs subsequent-events cut-off (ISA 560)", cls: A, docs: "Reports; sign-off log", sev: Medium, src: "RBP 4, 9", impl: true}
- {id: SA-13, mod: A, grp: Formatting, check: "Font family is Times New Roman throughout", cls: A, docs: "FS pack (DOCX)", sev: Low, src: "BRIEF d; FSX 0_Formatting", impl: true}
- {id: SA-14, mod: A, grp: Formatting, check: "Font sizes within firm standard (headings 14/12; content 10/11)", cls: A, docs: "FS pack (DOCX)", sev: Low, src: "BRIEF d; FSX 0_Formatting", impl: true}
- {id: SA-15, mod: A, grp: Formatting, check: "Margins: left 1.3 in, top 1.5 in, right/bottom 1 / 0.75 / 0.5 in", cls: A, docs: "FS pack (DOCX)", sev: Low, src: "FSX 0_Formatting 5", impl: true}
- {id: SA-16, mod: A, grp: Formatting, check: "Narrative paragraphs justified", cls: A, docs: "FS pack (DOCX)", sev: Low, src: "FSX 0_Formatting", impl: true}
- {id: SA-17, mod: A, grp: Formatting, check: "CY comparatives bold, PY regular; comma style; figures right/bottom aligned", cls: A, docs: "FS pack (DOCX)", sev: Low, src: "RBP 5, 11; FSX 0_Formatting", impl: true}
- {id: SA-18, mod: A, grp: Formatting, check: "Page numbers in sequence; index entries match headings and pages; '(continued)' labels", cls: A, docs: "FS pack", sev: Low, src: "RBP 3; FSX 1_Cover 2", impl: true}
- {id: SA-19, mod: A, grp: Formatting, check: "Line items in sentence case; spell check", cls: A, docs: "FS pack", sev: Low, src: "RBP 11; FSX AUDIT FS CHECKLIST 11", impl: true}
- {id: SA-20, mod: A, grp: Arithmetic and tie-outs, check: "Statement of financial position balances (CY and PY)", cls: A, docs: "FS pack", sev: High, src: "BRIEF b", impl: true}
- {id: SA-21, mod: A, grp: Arithmetic and tie-outs, check: "Cash flow closing cash equals cash and bank in the SOFP", cls: A, docs: "FS pack", sev: High, src: "BRIEF c; RBP 12", impl: true}
- {id: SA-22, mod: A, grp: Arithmetic and tie-outs, check: "SOCE closing equity equals SOFP equity; shareholders' current account movement ties to SOCE/cash flow", cls: A, docs: "FS pack", sev: High, src: "RBP 12-13", impl: true}
- {id: SA-23, mod: A, grp: Arithmetic and tie-outs, check: "Net profit agrees across P&L, SOCE, cash flow and Directors' report", cls: A, docs: "FS pack", sev: High, src: "RBP 6", impl: true}
- {id: SA-24, mod: A, grp: Arithmetic and tie-outs, check: "Client TB agrees to FS (assets, liabilities, equity, profit) and to lead schedule", cls: A, docs: "TB (XLSX); lead schedule", sev: High, src: "BRIEF l; RBP 11", impl: true}
- {id: SA-25, mod: A, grp: Arithmetic and tie-outs, check: "Note numbers and cross-references resolve; each FS line agrees to its note/schedule", cls: A, docs: "FS pack; schedules", sev: Medium, src: "BRIEF dd; RBP 11", impl: true}
- {id: SA-26, mod: A, grp: Arithmetic and tie-outs, check: "Directors' report results, graph and ratios agree to P&L", cls: A, docs: "Directors' report; P&L", sev: Medium, src: "RBP 5-6", impl: true}
- {id: SA-27, mod: A, grp: Arithmetic and tie-outs, check: "G&A expenses in descending order; other G&A <= 5% of gross profit; audit fee recorded", cls: A, docs: "Schedules", sev: Medium, src: "FSX Schedules 9; RBP 16", impl: true}
- {id: SA-28, mod: A, grp: Arithmetic and tie-outs, check: "Forex gain in finance income, loss in finance cost; currency-risk net exposure ties", cls: A, docs: "Schedules", sev: Low, src: "FSX Schedules 10-11", impl: true}
- {id: SA-29, mod: A, grp: Disclosures, check: "Mandatory notes present: end-of-service benefits, VAT/duties and taxes, PPE useful lives or nil statement, corporate tax", cls: A, docs: "Notes", sev: Medium, src: "FSX 5_Word notes 13, 15, 18; RBP 16", impl: true}
- {id: SA-30, mod: A, grp: Disclosures, check: "Standards adopted / issued-not-yet-effective list matches the reporting year", cls: A, docs: "Notes; standards table", sev: Medium, src: "FSX Annexure I", impl: true}
- {id: SA-31, mod: A, grp: Disclosures, check: "Statement of compliance cites the right law for the licensing authority", cls: B, docs: "Notes; TL", sev: Medium, src: "FSX 5_Word notes 8; RBP 15", impl: true}
- {id: SA-32, mod: A, grp: Disclosures, check: "Cash and bank split UAE / outside UAE; bank schedule agrees to bank statements", cls: A, docs: "Bank statements; schedule", sev: Medium, src: "RBP 16; FSX Schedules 3", impl: true}
- {id: SA-33, mod: A, grp: Disclosures, check: "Accounting policies and disclosures comply with IFRS (IFRS 9 ECL, IFRS 16, IAS 24, IAS 12)", cls: B, docs: "FS pack", sev: High, src: "BRIEF cc, s", impl: true}
- {id: SA-34, mod: A, grp: Audit evidence, check: "Every material SOFP/P&L item has a completed audit procedure and working paper saved on the server", cls: A, docs: "Audit file index", sev: High, src: "BRIEF h", impl: true}
- {id: SA-35, mod: A, grp: Audit evidence, check: "Confirmations (bank, debtors, creditors) received; bank vs book; BRS differences; stale cheques", cls: A, docs: "Confirmations; BRS", sev: High, src: "BRIEF i", impl: true}
- {id: SA-36, mod: A, grp: Audit evidence, check: "Legal cases, unusual legal fees and contingencies identified and disclosed", cls: B, docs: "Ledger; minutes; letters", sev: High, src: "BRIEF j", impl: true}
- {id: SA-37, mod: A, grp: Audit evidence, check: "Debtors ageing, post year-end collections and ECL working", cls: A, docs: "Ageing; ECL schedule", sev: High, src: "BRIEF t; FSX Schedules 1", impl: true}
- {id: SA-38, mod: A, grp: Audit evidence, check: "Bank loans: confirmation, covenants, current/non-current classification", cls: B, docs: "Loan confirmations", sev: Medium, src: "BRIEF u", impl: true}
- {id: SA-39, mod: A, grp: Audit evidence, check: "Associates, subsidiaries, JVs, branches, goodwill and related companies liquidated in year", cls: B, docs: "Registers; notes", sev: High, src: "BRIEF v, w, x, y", impl: true}
- {id: SA-40, mod: A, grp: Audit evidence, check: "Related-party balances agree to TP report and to counterparties' FS", cls: A, docs: "TP report; related FS", sev: High, src: "BRIEF q; RBP 11", impl: true}
- {id: SA-41, mod: A, grp: Audit evidence, check: "Depreciation, PPE, amortisation schedules and lease accounting under IFRS 16", cls: B, docs: "Fixed-asset schedule", sev: Medium, src: "BRIEF s", impl: true}
- {id: SA-42, mod: A, grp: Audit evidence, check: "Statutory dues, WPS status and end-of-service gratuity calculation", cls: B, docs: "Payroll; WPS reports", sev: Medium, src: "BRIEF r", impl: true}
- {id: SA-43, mod: A, grp: Tax tie-outs, check: "CT payable per FS agrees to CT working and to return", cls: A, docs: "CT working; return", sev: High, src: "BRIEF n", impl: true}
- {id: SA-44, mod: A, grp: Tax tie-outs, check: "VAT dues and CT payable agree to FTA portal statements", cls: B, docs: "FTA statements (PDF)", sev: High, src: "BRIEF o", impl: true}
- {id: SA-45, mod: A, grp: Tax tie-outs, check: "Sales per books reconcile to VAT returns, including cross-year differences", cls: A, docs: "VAT returns; ledger", sev: High, src: "BRIEF p", impl: true}
- {id: SA-46, mod: A, grp: Process gates, check: "All lower review levels completed before Partner stage", cls: A, docs: "Review log", sev: High, src: "BRIEF z", impl: true}
- {id: SA-47, mod: A, grp: Process gates, check: "'FS ready before print' checklist completed after all reviews", cls: A, docs: "Review log", sev: Medium, src: "BRIEF aa", impl: true}
- {id: SA-48, mod: A, grp: Process gates, check: "Collection status cross-checked by admin before release", cls: A, docs: "Admin confirmation", sev: Medium, src: "BRIEF bb", impl: true}
- {id: SA-49, mod: A, grp: Process gates, check: "Negative equity triggers going-concern note and report paragraph", cls: A, docs: "FS pack", sev: High, src: "RBP 11", impl: true}
- {id: SA-50, mod: A, grp: Process gates, check: "Final Review paper generated with a reference for each change", cls: A, docs: "Engine output", sev: Medium, src: "BRIEF ff", impl: true}
- {id: SA-51, mod: A, grp: Process gates, check: "Professional scepticism areas: estimates, management override, unusual transactions", cls: C, docs: "Working papers", sev: High, src: "BRIEF ee", impl: true}
# ---------------- Module B: Liquidation ----------------
- {id: LQ-01, mod: B, grp: Appointment, check: "Board Resolution passed, filed with the authority, liquidator named correctly", cls: A, docs: "BR; authority portal", sev: High, src: "BRIEF b1; LQW step 1", impl: true}
- {id: LQ-02, mod: B, grp: Appointment, check: "Liquidator appointment letter dated on/after BR and name agrees to BR", cls: A, docs: "Appointment letter; BR", sev: High, src: "BRIEF b2; LQW step 2", impl: true}
- {id: LQ-03, mod: B, grp: Clocks, check: "FTA notification within 20 business days of the appointment letter", cls: A, docs: "Appointment letter; FTA acknowledgement", sev: High, src: "BRIEF b3", impl: true}
- {id: LQ-04, mod: B, grp: Clocks, check: "VAT TRN deregistration initiated within 30 days of BR (workbook rule)", cls: A, docs: "BR; FTA acknowledgement", sev: High, src: "LQW step 6", impl: true}
- {id: LQ-05, mod: B, grp: Clocks, check: "45-day creditor block after newspaper advertisement (DIFC, Mainland) before report issue", cls: A, docs: "Advertisement copies", sev: High, src: "BRIEF b5; LQW DIFC/Mainland", impl: true}
- {id: LQ-06, mod: B, grp: Clocks, check: "Minimum 14 days between BR and report (DSO/IFZA) unless Partner approved", cls: A, docs: "BR; report", sev: Medium, src: "LQW DSO note 7", impl: true}
- {id: LQ-07, mod: B, grp: Clocks, check: "Report submitted within one year of BR (DIFC, Mainland)", cls: A, docs: "BR; report", sev: High, src: "LQW DIFC note 7; Mainland note 4", impl: true}
- {id: LQ-08, mod: B, grp: Clocks, check: "Expired trade licence: report within 30 days of expiry (DSO/IFZA)", cls: A, docs: "TL; report", sev: Medium, src: "LQW DSO note 3", impl: true}
- {id: LQ-09, mod: B, grp: Stakeholders, check: "All partners aware of the liquidation; no legal dispute between partners", cls: C, docs: "Client confirmation", sev: Medium, src: "BRIEF b4, b9", impl: true}
- {id: LQ-10, mod: B, grp: Clearances, check: "Facility NOCs: telecom, utilities, chiller, landlord", cls: A, docs: "NOC copies", sev: Medium, src: "LQW step 5", impl: true}
- {id: LQ-11, mod: B, grp: Clearances, check: "Legal NOCs: PO Box, VAT, CT, authority portal, labour/visa, establishment card, ESR/AML", cls: A, docs: "NOC copies", sev: High, src: "LQW step 6", impl: true}
- {id: LQ-12, mod: B, grp: Clearances, check: "CT and VAT deregistration status, penalties and late filing", cls: B, docs: "FTA statements", sev: High, src: "BRIEF b7, b10", impl: true}
- {id: LQ-13, mod: B, grp: Bank, check: "No-liability and closure letters for every bank account, including outside UAE", cls: A, docs: "Bank letters", sev: High, src: "BRIEF b6, b13; LQW step 7", impl: true}
- {id: LQ-14, mod: B, grp: Bank, check: "Bank account closed only after all other steps are complete", cls: A, docs: "Tracker dates", sev: High, src: "LQW note 1", impl: true}
- {id: LQ-15, mod: B, grp: Authority specifics, check: "Authority-specific conditions: DMCC physical submission, DIFC portal balance and PSA refund cleared, advertisement uploaded by liquidator as one file", cls: A, docs: "Authority checklist", sev: Medium, src: "LQW notes", impl: true}
- {id: LQ-16, mod: B, grp: Report, check: "Liquidation report built from TB, GL, SOFP and income statement after adjustments", cls: B, docs: "TB; GL", sev: High, src: "LQW step 8/9", impl: true}
- {id: LQ-17, mod: B, grp: Report, check: "FTA final communication agrees to the note in the report", cls: B, docs: "FTA letter; report", sev: High, src: "BRIEF b11", impl: true}
- {id: LQ-18, mod: B, grp: Report, check: "Legal claims and contingent liabilities settled or provided", cls: C, docs: "Legal letters", sev: High, src: "BRIEF b12", impl: true}
- {id: LQ-19, mod: B, grp: After closure, check: "Mailbox kept active for one year after completion (reminder date)", cls: A, docs: "Tracker", sev: Low, src: "LQW notes", impl: true}
- {id: LQ-20, mod: B, grp: After closure, check: "Final review comments recorded", cls: A, docs: "Engine output", sev: Medium, src: "BRIEF b14", impl: true}
- {id: LQ-21, mod: B, grp: Documents, check: "Board Resolution: company, resolution wording, liquidator, date, all shareholders/partners named and signing", cls: A, docs: "Board Resolution", sev: High, src: "BRIEF b1; user request", impl: true}
- {id: LQ-22, mod: B, grp: Documents, check: "Statement of Affairs: as-at date, totals recomputed, deficiency flagged, tax creditors, liquidator named", cls: A, docs: "Statement of Affairs", sev: High, src: "user request", impl: true}
- {id: LQ-23, mod: B, grp: Documents, check: "Liquidator's report: required sections, dates and advertisement dates agree to the tracker, figures agree to the Statement of Affairs", cls: A, docs: "Liquidator's report", sev: High, src: "user request", impl: true}
- {id: LQ-24, mod: B, grp: Documents, check: "Trial balance (optional) balances and agrees to the Statement of Affairs and report", cls: A, docs: "TB", sev: Medium, src: "user request", impl: true}
- {id: LQ-25, mod: B, grp: Documents, check: "Corporate Tax and VAT registration evidenced; deregistration initiated; final CT return addressed in the report", cls: A, docs: "CT/VAT certificates; FTA letters; report", sev: High, src: "user request; BRIEF b7", impl: true}
- {id: LQ-26, mod: B, grp: Documents, check: "Company name and liquidator name consistent across all documents", cls: A, docs: "All documents", sev: Medium, src: "user request", impl: true}
# ---------------- Module C: Transfer pricing report (source: TP Updated Final Review Checklist - Managerial Remuneration, sections 1.1-1.13; 1.14 = firm-added checks kept from the sample reports) ----------------
- {id: TP-01, mod: C, grp: "1.1 Cover Page", check: "Company name is correct and identical to engagement records, trade licence, audit report and the rest of the report.", cls: A, docs: "Trade licence; audit report; report body", sev: Medium, src: "TP Updated Final Review Checklist (Managerial Remuneration) 1.1", impl: true}
- {id: TP-02, mod: C, grp: "1.1 Cover Page", check: "Report title is correct: 'Transfer Pricing Benchmark Analysis' or 'Transfer Pricing Financial Update', matching the nature of the engagement.", cls: A, docs: "Engagement type; body headings", sev: Medium, src: "TP Updated Final Review Checklist (Managerial Remuneration) 1.1", impl: true}
- {id: TP-03, mod: C, grp: "1.1 Cover Page", check: "Financial year / period agrees with report body and audited / draft financial statements.", cls: A, docs: "Audit report FY", sev: High, src: "TP Updated Final Review Checklist (Managerial Remuneration) 1.1", impl: true}
- {id: TP-04, mod: C, grp: "1.1 Cover Page", check: "Cover picture is relevant to company activity and to the report (no generic or wrong-industry image).", cls: C, docs: "Licence activities; business description", sev: Low, src: "TP Updated Final Review Checklist (Managerial Remuneration) 1.1", impl: true}
- {id: TP-05, mod: C, grp: "1.2 Table of Contents", check: "TOC is complete: every Heading 1 / Heading 2 in the document appears in the TOC and vice versa.", cls: A, docs: "Document headings", sev: Medium, src: "TP Updated Final Review Checklist (Managerial Remuneration) 1.2", impl: true}
- {id: TP-06, mod: C, grp: "1.2 Table of Contents", check: "TOC text matches heading text exactly (spelling, numbering, case).", cls: A, docs: "Document headings", sev: Low, src: "TP Updated Final Review Checklist (Managerial Remuneration) 1.2", impl: true}
- {id: TP-07, mod: C, grp: "1.2 Table of Contents", check: "TOC page numbers equal actual page numbers in the TP Report - Part 2.", cls: A, docs: "TP Report - Part 2", sev: Medium, src: "TP Updated Final Review Checklist (Managerial Remuneration) 1.2", impl: true}
- {id: TP-08, mod: C, grp: "1.2 Table of Contents", check: "Annexure titles and start pages agree with the TP Report - Part 2.", cls: A, docs: "Annexure pages", sev: Medium, src: "TP Updated Final Review Checklist (Managerial Remuneration) 1.2", impl: true}
- {id: TP-09, mod: C, grp: "1.2 Table of Contents", check: "TOC formatting: Times New Roman; heading size 19.5; subheadings size 12; text size 11.", cls: A, docs: "TOC styles / runs", sev: Low, src: "TP Updated Final Review Checklist (Managerial Remuneration) 1.2", impl: true}
- {id: TP-10, mod: C, grp: "1.3 Company Details and Source Cross-Check", check: "Company profile in the report (business description, legal form, incorporation, activities, shareholding, ownership chart, group structure, management) agrees with the notes to accounts of the audit report.", cls: B, docs: "Audit report; notes", sev: Medium, src: "TP Updated Final Review Checklist (Managerial Remuneration) 1.3", impl: true}
- {id: TP-11, mod: C, grp: "1.3 Company Details and Source Cross-Check", check: "Company details agree with the trade licence (licence number, legal name, legal form, address, manager / owners). Licence is valid for the whole period under review and its licensed activities cover the business described in the report.", cls: A, docs: "Trade licence (issue / expiry dates, activity list)", sev: High, src: "TP Updated Final Review Checklist (Managerial Remuneration) 1.3", impl: true}
- {id: TP-12, mod: C, grp: "1.3 Company Details and Source Cross-Check", check: "Financial figures in report agree with audited / draft FS.", cls: A, docs: "Audit report", sev: High, src: "TP Updated Final Review Checklist (Managerial Remuneration) 1.3", impl: true}
- {id: TP-13, mod: C, grp: "1.3 Company Details and Source Cross-Check", check: "Financial period in audit report aligns with the period in the Word report.", cls: A, docs: "Audit report", sev: High, src: "TP Updated Final Review Checklist (Managerial Remuneration) 1.3", impl: true}
- {id: TP-14, mod: C, grp: "1.3 Company Details and Source Cross-Check", check: "Total managerial remuneration stated in report traces to the notes to accounts of the draft / final audit report.", cls: A, docs: "Audit report notes", sev: High, src: "TP Updated Final Review Checklist (Managerial Remuneration) 1.3", impl: true}
- {id: TP-15, mod: C, grp: "1.3 Company Details and Source Cross-Check", check: "Functional analysis (functions, assets, risks) of the tested party is complete and consistent with the business description, and the report explains why this entity is the tested party.", cls: C, docs: "Report functional analysis; notes", sev: Medium, src: "TP Updated Final Review Checklist (Managerial Remuneration) 1.3", impl: true}
- {id: TP-16, mod: C, grp: "1.3 Company Details and Source Cross-Check", check: "Remuneration split by component (salary, bonus, allowances, end-of-service benefits, share-based pay, benefits in kind, if any) agrees with the BIRF, and the components add up to the total in the report and notes.", cls: B, docs: "BIRF; audit report notes", sev: High, src: "TP Updated Final Review Checklist (Managerial Remuneration) 1.3", impl: true}
