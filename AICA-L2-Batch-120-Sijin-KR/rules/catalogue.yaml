- {id: TP-19, mod: C, grp: "1.4 Formatting (Template Compliance)", check: "Subheadings: Times New Roman 12; bolding, alignment, spacing, numbering per template.", cls: B, docs: "Word docx", sev: Low, src: "TP Updated Final Review Checklist (Managerial Remuneration) 1.4", impl: true}
- {id: TP-20, mod: C, grp: "1.4 Formatting (Template Compliance)", check: "Tables: Times New Roman 11; headings, alignment, borders, decimal places and units per template.", cls: B, docs: "Word docx", sev: Low, src: "TP Updated Final Review Checklist (Managerial Remuneration) 1.4", impl: true}
- {id: TP-21, mod: C, grp: "1.4 Formatting (Template Compliance)", check: "Header: 'Transfer Pricing Benchmarking Analysis'; page number at right as dynamic PAGE field. Font TNR 11.", cls: A, docs: "Word docx", sev: Low, src: "TP Updated Final Review Checklist (Managerial Remuneration) 1.4", impl: true}
