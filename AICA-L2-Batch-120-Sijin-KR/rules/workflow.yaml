# Review workflow settings (edit names to your team; roles: preparer < L1 < L2 < L3)
levels:
  - {code: L1, name: "First review (Senior / Reviewer)", role: L1}
  - {code: L2, name: "Manager review", role: L2}
  - {code: L3, name: "Partner review", role: L3}
# a review round cannot be passed forward while points of these severities are still open
blocking_severities: [High, Medium]
# only these roles may waive (accept as-is) a point, always with a reason
waive_roles: [L2, L3]
users:
  - {name: "Preparer 1", role: preparer}
  - {name: "Senior 1", role: L1}
  - {name: "Manager 1", role: L2}
  - {name: "Partner 1", role: L3}

# Teams: leave empty to stay fully offline. To get a Teams channel message at every hand-off, paste an Incoming Webhook / Workflows URL here.
# Only the reference, stage, owner and counts are sent - never client figures or documents.
teams_webhook: ""
app_url: "http://<office-pc-name>:8501"
