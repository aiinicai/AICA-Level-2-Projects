# Engagement fact sheet = the single source of truth the FS pack is checked against.
# Fill from the trade licence, MOA/AOA, passports/EID and the Board Resolution - not from the FS being reviewed.
fy: 2025                      # current reporting year
py: 2024
client:
  name: "GOLDEN CREST TRADING DMCC"      # exactly as on the trade licence, including capitalisation
  legal_status: FZC                      # FZC | FZE | LLC | SOLE | LLP | CIVIL | OTHER  (drives Company/Establishment/Entity wording)
  authority: DMCC                        # licensing authority named in the auditor's report
  emirate: Dubai
  year_end: "31 December"
  shareholders: ["Full Name 1", "Full Name 2"]          # per MOA
  signatories_legal: ["Full Name 1"]                    # names exactly as in passport/MOA
fs_signatories: ["Full Name 1"]          # who actually signed the FS
br_on_file: false                        # true if a Board Resolution authorises a signatory who is not all shareholders
allowed_years: []                        # e.g. [2021] incorporation year, so it is not flagged as a stray year
review_log:                              # fed by the firm's workflow; Partner stage is blocked until these are done
  preparer:           {done: true,  date: "2026-03-01"}
  supervisor:         {done: true,  date: "2026-03-05"}
  manager:            {done: false}
  ready_before_print: {done: false}
