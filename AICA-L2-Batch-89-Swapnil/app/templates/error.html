{% extends "base.html" %}
{% block title %}{{ title }}{% endblock %}
{% block content %}
<div class="row justify-content-center mt-5"><div class="col-md-8 col-lg-6">
  <div class="card border-{{ 'danger' if code in (403, 413) else 'warning' }} shadow-sm"><div class="card-body p-4">
    <h1 class="h4">{{ title }} <span class="small-muted">({{ code }})</span></h1>
    <p class="mb-3">{{ message }}</p>
    {% if code == 403 %}<p class="small-muted">This attempt has been recorded in the audit trail.</p>{% endif %}
    <a class="btn btn-outline-secondary btn-sm" href="{{ request.referrer or url_for('dashboard.index') }}">Go back</a>
  </div></div>
</div></div>
{% endblock %}
