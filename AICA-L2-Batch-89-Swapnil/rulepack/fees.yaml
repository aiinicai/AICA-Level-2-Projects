# Fee tables. Evidence: RULEPACK_VERIFICATION.md §7.
# Company: Companies (Registration Offices and Fees) Rules 2014, r.12 + Annexure.
# LLP: LLP Rules 2009, Annexure 'A' as substituted by G.S.R. 109(E) (w.e.f. 01-04-2022).
domain: fees
tables:
  - code: NORMAL_COMPANY
    law: "ROF Rules 2014, Annexure (Table of fees)"
    sources: ["https://ca2013.com/rule-12-companies-registration-offices-and-fees-rules-2014/"]
    effective_from: 2014-04-01
    data:
      bands:                       # by NOMINAL (authorised) share capital; 'below' is exclusive
        - {below: 100000, fee: 200}
        - {below: 500000, fee: 300}
        - {below: 2500000, fee: 400}
        - {below: 10000000, fee: 500}
        - {fee: 600}
      no_share_capital: 200        # unverified (I8)

  - code: NORMAL_LLP
    law: "LLP Rules 2009, Annexure 'A' (G.S.R. 109(E))"
    sources: ["https://taxguru.in/corporate-law/limited-liability-partnership-amendment-rules-2022.html"]
    effective_from: 2022-04-01
    data:
      bands:                       # by contribution; 'upto' is inclusive
        - {upto: 100000, fee: 50}
        - {upto: 500000, fee: 100}
        - {upto: 1000000, fee: 150}
        - {upto: 2500000, fee: 200}
        - {upto: 10000000, fee: 400}
        - {fee: 600}

  - code: PER_DAY_100
    law: "ROF Rules 2014, Annexure — documents under s.92 and s.137 (Amdt Rules 2018)"
    sources: ["https://ca2013.com/rule-12-companies-registration-offices-and-fees-rules-2014/"]
    effective_from: 2018-07-01
    data: {per_day: 100}

  - code: MULTIPLIER
    law: "ROF Rules 2014, Annexure — additional fee for delay"
    sources: ["https://ca2013.com/rule-12-companies-registration-offices-and-fees-rules-2014/"]
    effective_from: 2018-07-01
    data:
      slabs:
        - {upto_days: 30, multiple: 2}
        - {upto_days: 60, multiple: 4}
        - {upto_days: 90, multiple: 6}
        - {upto_days: 180, multiple: 10}
        - {upto_days: null, multiple: 12}

  - code: MULTIPLIER_S139
    law: "ROF Rules 2014, Annexure (Amdt Rules 2022) — forms under s.139 and s.157"
    sources: ["https://ca2013.com/rule-12-companies-registration-offices-and-fees-rules-2014/"]
    effective_from: 2022-07-01
    data:
      slabs:
        - {upto_days: 15, multiple: 1}
        - {upto_days: 30, multiple: 2}
        - {upto_days: 60, multiple: 4}
        - {upto_days: 90, multiple: 6}
        - {upto_days: 180, multiple: 10}
        - {upto_days: null, multiple: 12}

  - code: HIGHER_MULTIPLIER
    law: "ROF Rules 2014, Annexure (Amdt Rules 2022) — INC-22 / PAS-3 delayed on 2+ occasions within 365 days"
    sources: ["https://ca2013.com/rule-12-companies-registration-offices-and-fees-rules-2014/"]
    effective_from: 2022-07-01
    data:
      slabs:
        - {upto_days: 30, multiple: 3}
        - {upto_days: 60, multiple: 6}
        - {upto_days: 90, multiple: 9}
        - {upto_days: 180, multiple: 15}
        - {upto_days: null, multiple: 18}

  - code: CHARGE
    law: "s.77 (as amended 2019); ROF Rules 2014, Annexure (Third Amdt Rules 2019)"
    sources: ["https://ca2013.com/rule-12-companies-registration-offices-and-fees-rules-2014/"]
    effective_from: 2019-04-30
    data:
      additional_only_upto_days: 30     # delay beyond the first 30 days
      max_delay_days: 90                # beyond -> s.87 condonation
      small_or_opc: {multiple: 3, ad_valorem_pct: 0.025, ad_valorem_cap: 100000}
      other: {multiple: 6, ad_valorem_pct: 0.05, ad_valorem_cap: 500000}

  - code: FIXED_KYC
    law: "ROF Rules 2014, Annexure — DIR-3 KYC (Second Amdt Rules 2019)"
    sources: ["https://ca2013.com/rule-12-companies-registration-offices-and-fees-rules-2014/"]
    effective_from: 2019-04-25
    effective_to: 2026-03-30
    data: {on_time: 0, late: 5000, event: 0}

  - code: FIXED_KYC
    law: "Companies (Registration Offices and Fees) Amendment Rules 2026 (21-04-2026), Annexure item VII"
    sources: ["https://www.scconline.com/blog/post/2026/04/24/companies-registration-offices-fees-amendment-rules-2026-dir-3-kyc-fee-changes/"]
    effective_from: 2026-03-31
    data: {on_time: 0, late: 5000, event: 500}   # 31-03 to 20-04-2026 gap: I2

  - code: LLP_MATRIX
    law: "LLP Rules 2009, Annexure 'A' additional fee (G.S.R. 109(E), w.e.f. 01-04-2022)"
    sources: ["https://taxguru.in/corporate-law/limited-liability-partnership-amendment-rules-2022.html"]
    effective_from: 2022-04-01
    data:
      slabs:
        - {upto_days: 15, small: 1, other: 1}
        - {upto_days: 30, small: 2, other: 4}
        - {upto_days: 60, small: 4, other: 8}
        - {upto_days: 90, small: 6, other: 12}
        - {upto_days: 180, small: 10, other: 20}
        - {upto_days: 360, small: 15, other: 30}
        - {upto_days: null, see: beyond_360}
      annual_forms_beyond_360:           # Forms 8 and 11
        small: {multiple: 15, per_day: 10}
        other: {multiple: 30, per_day: 20}
      other_forms_beyond_360:            # correction C5
        small: {multiple: 25}
        other: {multiple: 50}
