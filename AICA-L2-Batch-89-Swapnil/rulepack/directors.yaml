# Director (DIN) obligations — per person, not per company.
# Law change handled by closing one row and opening another (brief §6.2):
# DIR3KYC_ANNUAL (to 30-03-2026) -> DIR3KYC_TRIENNIAL (from 31-03-2026).
domain: directors
rules:
  - code: DIR3KYC_ANNUAL
    form: "DIR-3 KYC / DIR-3 KYC-Web"
    title: "Annual KYC of DIN holder (historic regime)"
    entity_types: &all [PRIVATE, OPC, PUBLIC_UNLISTED, PUBLIC_LISTED, SECTION8, NIDHI, PRODUCER, FOREIGN_CO, LLP]
    anchor: DIN_FY_END
    fixed: {month: 9, day: 30}
    recurrence: din_annual
    fee_regime: FIXED_KYC
    law: "Rule 12A, Companies (Appointment and Qualification of Directors) Rules 2014 (pre-substitution)"
    penalty_summary: "DIN deactivated; reactivation fee ₹5,000"
    effective_from: 2018-03-31
    effective_to: 2026-03-30
    notes: "Due 30 September after each FY in which the DIN was held on 31 March. Amending G.S.R. for the 30-Sep date to be captured (I10)."

  - code: DIR3KYC_TRIENNIAL
    form: "DIR-3 KYC Web"
    title: "Triennial KYC of DIN holder"
    entity_types: *all
    anchor: DIN_CYCLE
    recurrence: din_cycle
    interpretation: true
    fee_regime: FIXED_KYC
    law: "Rule 12A (substituted), AQD Rules — G.S.R. 943(E) dt 31-12-2025, w.e.f. 31-03-2026"
    penalty_summary: "DIN deactivated; reactivation fee ₹5,000"
    sources:
      - "https://taxguru.in/company-law/mca-notifies-significant-amendment-director-kyc-framework-w-e-f31-03-2026.html"
      - "https://www.mca.gov.in/bin/dms/getdocument?mds=5wBuXrnw5F5hFYBugmtq1Q%3D%3D&type=open"
    effective_from: 2026-03-31
    notes: "Cycle per MCA illustration (partner decision Q1): legacy DIN -> 30-06-2028; DIN allotted in FY Y -> 30 June of Y's closing year + 3."

  - code: DIR3KYC_CHANGE
    form: "DIR-3 KYC Web"
    title: "KYC update on change of mobile, e-mail or residential address"
    entity_types: *all
    anchor: DETAIL_CHANGE
    offset: {days: 30}
    recurrence: din_event
    fee_regime: FIXED_KYC
    law: "Rule 12A(2) (substituted), AQD Rules — G.S.R. 943(E)"
    sources: ["https://www.scconline.com/blog/post/2026/04/24/companies-registration-offices-fees-amendment-rules-2026-dir-3-kyc-fee-changes/"]
    effective_from: 2026-03-31
    notes: "Does not reset the triennial cycle."
