# LLP obligations and classification thresholds. Evidence: RULEPACK_VERIFICATION.md §6.
domain: llp

thresholds:
  - code: SMALL_LLP
    values: {contribution: 2500000, turnover: 4000000}
    effective_from: 2022-04-01
    law: "s.2(1)(ta), LLP Act 2008 (inserted by LLP (Amendment) Act 2021)"
  - code: LLP_AUDIT
    values: {contribution: 2500000, turnover: 4000000}
    effective_from: 2009-03-31
    law: "Rule 24(8), LLP Rules 2009 — exempt if turnover ≤ ₹40 lakh OR contribution ≤ ₹25 lakh"

rules:
  - code: LLP_FORM3_INC
    form: "Form 3"
    title: "Information with regard to LLP agreement"
    entity_types: [LLP]
    anchor: INCORPORATION
    offset: {days: 30}
    recurrence: once
    fee_regime: LLP_MATRIX
    law: "s.23, LLP Act 2008; Rule 21, LLP Rules 2009"
    penalty_summary: "s.23(2A)"
    sources: ["https://www.indiacode.nic.in/handle/123456789/2023"]
    effective_from: 2009-03-31

  - code: LLP_FORM11
    form: "Form 11"
    title: "Annual return of LLP"
    entity_types: [LLP]
    anchor: FY_END
    offset: {days: 60}
    recurrence: annual
    fee_regime: LLP_MATRIX
    fee_slab: LLP_ANNUAL
    law: "s.35, LLP Act 2008; Rule 25, LLP Rules 2009"
    penalty_summary: "s.35(3)"
    sources: ["https://www.indiacode.nic.in/handle/123456789/2023"]
    effective_from: 2009-03-31
    notes: "No exemption for inactive LLPs."

  - code: LLP_FORM8
    form: "Form 8"
    title: "Statement of account and solvency"
    entity_types: [LLP]
    anchor: FY_END
    offset: {months: 6, days: 30}
    recurrence: annual
    fee_regime: LLP_MATRIX
    fee_slab: LLP_ANNUAL
    law: "s.34, LLP Act 2008; Rule 24, LLP Rules 2009"
    penalty_summary: "s.34(5)"
    sources: ["https://www.indiacode.nic.in/handle/123456789/2023"]
    effective_from: 2009-03-31

  - code: LLP_AUDIT
    form: "Audit of accounts (no e-form)"
    title: "Accounts audit (before Form 8)"
    entity_types: [LLP]
    applicability: [llp_audit_required]
    anchor: FY_END
    offset: {months: 6}
    recurrence: annual
    law: "Rule 24(8), LLP Rules 2009"
    effective_from: 2009-03-31
    notes: "Required only if turnover > ₹40 lakh AND contribution > ₹25 lakh (correction C3)."

  - code: LLP_FORM3_CHG
    form: "Form 3"
    title: "Change in LLP agreement"
    entity_types: [LLP]
    event_types: [LLP_AGREEMENT_CHANGED]
    anchor: EVENT_DATE
    offset: {days: 30}
    recurrence: event
    fee_regime: LLP_MATRIX
    law: "s.23, LLP Act 2008; Rule 21, LLP Rules 2009"
    effective_from: 2009-03-31

  - code: LLP_FORM4
    form: "Form 4"
    title: "Admission / cessation / change of partner or designated partner"
    entity_types: [LLP]
    event_types: [PARTNER_CHANGE]
    anchor: EVENT_DATE
    offset: {days: 30}
    recurrence: event
    fee_regime: LLP_MATRIX
    law: "s.25, LLP Act 2008; Rule 22, LLP Rules 2009"
    penalty_summary: "s.25(3)"
    effective_from: 2009-03-31

  - code: LLP_FORM15
    form: "Form 15"
    title: "Change of registered office"
    entity_types: [LLP]
    event_types: [LLP_RO_CHANGE]
    anchor: EVENT_DATE
    offset: {days: 30}
    recurrence: event
    fee_regime: LLP_MATRIX
    law: "s.13(3), LLP Act 2008; Rule 17, LLP Rules 2009"
    effective_from: 2009-03-31

  - code: LLP_BEN2
    form: "LLP BEN-2"
    title: "Return of significant beneficial owner (on receipt of LLP BEN-1)"
    entity_types: [LLP]
    event_types: [LLP_BEN1_RECEIVED]
    anchor: EVENT_DATE
    offset: {days: 30}
    recurrence: event
    fee_regime: LLP_MATRIX
    law: "s.90 Companies Act as applied to LLPs; LLP (Significant Beneficial Owners) Rules 2023"
    effective_from: 2023-11-09

  - code: LLP_4D
    form: "Form 4D"
    title: "Return of declaration of beneficial interest in contribution"
    entity_types: [LLP]
    event_types: [LLP_BENEFICIAL_DECL_RECEIVED]
    anchor: EVENT_DATE
    offset: {days: 30}
    recurrence: event
    fee_regime: LLP_MATRIX
    law: "Rules 22A–22B, LLP Rules 2009 (LLP (Third Amendment) Rules 2023, dt 27-10-2023)"
    effective_from: 2023-10-27
    notes: "Triggered by a Form 4B/4C declaration received by the LLP (correction C14)."
