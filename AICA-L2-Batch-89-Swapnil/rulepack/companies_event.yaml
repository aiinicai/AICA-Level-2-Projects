# Company — event-driven obligations (anchored to the event date).
# Evidence: RULEPACK_VERIFICATION.md §5.
domain: companies_event
rules:
  - code: DIR12
    form: "DIR-12"
    title: "Appointment / cessation / change in designation of director or KMP"
    entity_types: &companies [PRIVATE, OPC, PUBLIC_UNLISTED, PUBLIC_LISTED, SECTION8, NIDHI, PRODUCER]
    event_types: [DIRECTOR_APPOINTED, DIRECTOR_CESSATION, DIRECTOR_RESIGNED, DESIGNATION_CHANGE,
                  KMP_APPOINTED, KMP_CESSATION, MD_WTD_APPOINTED]
    anchor: EVENT_DATE
    offset: {days: 30}
    recurrence: event
    fee_regime: MULTIPLIER
    law: "s.168, s.170(2), Companies Act 2013; Rules 15 and 18, Companies (Appointment and Qualification of Directors) Rules 2014"
    penalty_summary: "s.172"
    effective_from: 2014-04-01

  - code: DIR_APPT_CHECKLIST
    form: "DIR-2 consent, DIR-8, MBP-1 (kept by company)"
    title: "Collect consent and disclosures from the new director"
    entity_types: *companies
    event_types: [DIRECTOR_APPOINTED]
    anchor: EVENT_DATE
    offset: {days: 0}
    recurrence: event
    law: "s.152(5), s.164(2), s.184(1), Companies Act 2013; Rule 14, AQD Rules"
    effective_from: 2014-04-01

  - code: DIR11
    form: "DIR-11 (by the director — optional)"
    title: "Director's own notice of resignation to ROC"
    entity_types: *companies
    event_types: [DIRECTOR_RESIGNED]
    anchor: EVENT_DATE
    offset: {days: 30}
    recurrence: event
    fee_regime: MULTIPLIER
    law: "s.168(1) proviso, Companies Act 2013; Rule 16, AQD Rules"
    effective_from: 2014-04-01
    notes: "Optional; filed by the director, not the company."

  - code: MR1
    form: "MR-1"
    title: "Return of appointment of MD / WTD / Manager"
    entity_types: [PRIVATE, PUBLIC_UNLISTED, PUBLIC_LISTED, SECTION8, NIDHI, PRODUCER]
    applicability: [public_or_private_sub_of_public]
    event_types: [MD_WTD_APPOINTED]
    anchor: EVENT_DATE
    offset: {days: 60}
    recurrence: event
    fee_regime: MULTIPLIER
    law: "s.196(4), Companies Act 2013; private companies exempt — G.S.R. 464(E) dt 05-06-2015"
    effective_from: 2014-04-01

  - code: PAS3_PP
    form: "PAS-3"
    title: "Return of allotment — private placement"
    entity_types: *companies
    applicability: [event_private_placement]
    event_types: [ALLOTMENT]
    anchor: EVENT_DATE
    offset: {days: 15}
    recurrence: event
    fee_regime: MULTIPLIER
    law: "s.42(9), Companies Act 2013 (as amended 2017)"
    penalty_summary: "s.42(10)"
    effective_from: 2018-08-07

  - code: PAS3
    form: "PAS-3"
    title: "Return of allotment — rights / bonus / ESOP / other"
    entity_types: *companies
    applicability: [{not: event_private_placement}]
    event_types: [ALLOTMENT]
    anchor: EVENT_DATE
    offset: {days: 30}
    recurrence: event
    fee_regime: MULTIPLIER
    law: "s.39(4), Companies Act 2013; Rule 12, PAS Rules"
    penalty_summary: "s.39(5)"
    effective_from: 2014-04-01

  - code: SH7
    form: "SH-7"
    title: "Notice of alteration / increase of authorised capital"
    entity_types: *companies
    event_types: [AUTH_CAPITAL_INCREASE]
    anchor: EVENT_DATE
    offset: {days: 30}
    recurrence: event
    fee_regime: MULTIPLIER
    law: "s.64(1), Companies Act 2013"
    penalty_summary: "s.64(2)"
    effective_from: 2014-04-01
    notes: "Separate Annexure line for increase in nominal capital not yet located (I9)."

  - code: MGT14
    form: "MGT-14"
    title: "Filing of special resolution / specified Board resolution"
    entity_types: *companies
    event_types: [SPECIAL_RESOLUTION, BOARD_RESOLUTION_117]
    anchor: EVENT_DATE
    offset: {days: 30}
    recurrence: event
    fee_regime: MULTIPLIER
    law: "s.117(1), Companies Act 2013"
    penalty_summary: "s.117(2)"
    effective_from: 2014-04-01

  - code: INC22
    form: "INC-22"
    title: "Change of registered office within the same city/local limits"
    entity_types: *companies
    event_types: [RO_SHIFT_SAME_CITY]
    anchor: EVENT_DATE
    offset: {days: 30}
    recurrence: event
    fee_regime: MULTIPLIER
    law: "s.12(4), Companies Act 2013 (30 days after the 2017 amendment)"
    penalty_summary: "s.12(8)"
    effective_from: 2014-04-01

  - code: CHG1
    form: "CHG-1 / CHG-9"
    title: "Registration of creation / modification of charge"
    entity_types: *companies
    event_types: [CHARGE_CREATED, CHARGE_MODIFIED]
    anchor: EVENT_DATE
    offset: {days: 30}
    recurrence: event
    fee_regime: CHARGE
    law: "s.77, s.79, Companies Act 2013 (as amended 2019)"
    penalty_summary: "s.86"
    effective_from: 2014-04-01
    notes: "ROC may allow 30 more days on additional fee, then 60 more on ad valorem fee; beyond that s.87 condonation."

  - code: CHG4
    form: "CHG-4"
    title: "Satisfaction of charge"
    entity_types: *companies
    event_types: [CHARGE_SATISFIED]
    anchor: EVENT_DATE
    offset: {days: 30}
    recurrence: event
    fee_regime: MULTIPLIER
    law: "s.82(1), Companies Act 2013"
    penalty_summary: "s.86"
    effective_from: 2014-04-01

  - code: ADT3
    form: "ADT-3 (by the auditor)"
    title: "Auditor's statement on resignation"
    entity_types: *companies
    event_types: [AUDITOR_RESIGNED]
    anchor: EVENT_DATE
    offset: {days: 30}
    recurrence: event
    law: "s.140(2), Companies Act 2013"
    penalty_summary: "s.140(3)"
    effective_from: 2014-04-01
    notes: "Obligation of the auditor; tracked for information."

  - code: CASUAL_VACANCY
    form: "Board resolution (no e-form)"
    title: "Board fills casual vacancy in the office of auditor"
    entity_types: *companies
    event_types: [AUDITOR_CASUAL_VACANCY]
    anchor: EVENT_DATE
    offset: {days: 30}
    recurrence: event
    law: "s.139(8)(i), Companies Act 2013"
    effective_from: 2014-04-01

  - code: CASUAL_VACANCY_GM
    form: "General meeting resolution"
    title: "Members approve auditor appointed in a casual vacancy caused by resignation"
    entity_types: *companies
    applicability: [event_cause_resignation]
    event_types: [AUDITOR_CASUAL_VACANCY]
    anchor: EVENT_DATE
    offset: {months: 3, days: 30}
    recurrence: event
    provisional: true
    law: "s.139(8)(i) proviso, Companies Act 2013"
    effective_from: 2014-04-01
    notes: "Within 3 months of the Board's recommendation; provisional anchor = vacancy + 30 days."

  - code: ADT1_CASUAL
    form: "ADT-1"
    title: "ADT-1 for auditor appointed in a casual vacancy"
    entity_types: *companies
    event_types: [AUDITOR_APPOINTED_CASUAL]
    anchor: EVENT_DATE
    offset: {days: 15}
    recurrence: event
    fee_regime: MULTIPLIER
    fee_slab: S139
    law: "s.139(8); Rule 4(2), Companies (Audit and Auditors) Rules 2014"
    effective_from: 2014-04-01

  - code: BEN2
    form: "BEN-2"
    title: "Return of significant beneficial owner (on receipt of BEN-1)"
    entity_types: *companies
    event_types: [BEN1_RECEIVED]
    anchor: EVENT_DATE
    offset: {days: 30}
    recurrence: event
    fee_regime: MULTIPLIER
    law: "s.90(4), Companies Act 2013; Rule 4, Companies (Significant Beneficial Owners) Rules 2018"
    penalty_summary: "s.90(11)"
    effective_from: 2018-06-13

  - code: MGT6
    form: "MGT-6"
    title: "Return on receipt of declaration of beneficial interest (MGT-4/MGT-5)"
    entity_types: *companies
    event_types: [MGT4_5_RECEIVED]
    anchor: EVENT_DATE
    offset: {days: 30}
    recurrence: event
    fee_regime: MULTIPLIER
    law: "s.89(6), Companies Act 2013; Rule 9(3), Management and Administration Rules"
    penalty_summary: "s.89(7)"
    effective_from: 2014-04-01

  - code: SH11
    form: "SH-11"
    title: "Return in respect of buy-back"
    entity_types: *companies
    event_types: [BUYBACK_COMPLETED]
    anchor: EVENT_DATE
    offset: {days: 30}
    recurrence: event
    fee_regime: MULTIPLIER
    law: "s.68(10), Companies Act 2013"
    penalty_summary: "s.68(11)"
    effective_from: 2014-04-01

  - code: MSC1
    form: "MSC-1"
    title: "Application for dormant status"
    entity_types: *companies
    event_types: [DORMANT_RESOLUTION]
    anchor: EVENT_DATE
    offset: {days: 30}
    recurrence: event
    law: "s.455, Companies Act 2013; Companies (Miscellaneous) Rules 2014"
    effective_from: 2014-04-01
    notes: "No statutory time limit; the firm's practical target is resolution + 30 days."
