# Time-boxed overlays: fee-relief schemes, "no additional fee" extensions and
# due-date extensions. Applied on the FILING date (fees) or at generation (due dates).
domain: schemes
schemes:
  - code: CCFS_2026
    kind: FEE_RELIEF
    circular_ref: "GC 01/2026 dt 24-02-2026; extended by GC 03/2026 dt 08-07-2026 and GC 04/2026 dt 31-08-2026"
    url: "https://x.com/MCA21India/status/2026661150923120877"
    window_from: 2026-04-15
    window_to: 2026-09-15
    rule_codes: [AOC4, AOC4_CFS, AOC4_OPC, MGT7, MGT7_OPC, ADT1, ADT1_FIRST, ADT1_CASUAL]
    applies_to: [COMPANY]
    additional_fee_factor: 0.10
    respects_ccfs_exclusion: true
    notes: "Normal fee + 10% of additional fee. Also MSC-1 at 50% and STK-2 at 25% of normal fee (not modelled as rules). Excludes strike-off/dormancy applicants, amalgamated and vanishing companies."

  - code: EXT_DPT3_FY2526
    kind: NO_ADDITIONAL_FEE
    circular_ref: "GC 02/2026 dt 19-06-2026 (MCA21 data-centre fire relief)"
    url: "https://www.corplawupdates.in/updates/mca-dpt3-due-date-extended-31-july-2026"
    window_from: 2026-06-30
    window_to: 2026-07-31
    rule_codes: [DPT3]
    period_keys: [FY2025-26]
    additional_fee_factor: 0.0
    notes: "Statutory due date stays 30-06-2026; no additional fee up to 31-07-2026."

  - code: EXT_ANNUAL_FY2425
    kind: NO_ADDITIONAL_FEE
    circular_ref: "GC 08/2025 dt 30-12-2025"
    url: "https://www.taxmann.com/post/blog/mca-extends-due-date-filings/"
    window_from: 2025-09-01
    window_to: 2026-01-31
    rule_codes: [AOC4, AOC4_CFS, AOC4_OPC, MGT7, MGT7_OPC]
    period_keys: [FY2024-25]
    additional_fee_factor: 0.0
    notes: "Earlier circulars in this extension chain not yet captured."

  - code: DEMAT_9B_FIRST_EXT
    kind: DUE_DATE_EXTENSION
    circular_ref: "Companies (Prospectus and Allotment of Securities) Amendment Rules 2025, dt 12-02-2025"
    url: "https://foxmandal.in/News/mca-extends-dematerialisation-deadline-for-private-companies/"
    window_from: 2025-02-12
    window_to: 2025-06-30
    rule_codes: [DEMAT_9B]
    period_keys: [FY2022-23]
    new_due_date: 2025-06-30
