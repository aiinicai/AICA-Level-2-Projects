# Company — one-time / first-year obligations (anchored to incorporation).
# Every row starts verified: false. Evidence: docs/RULEPACK_VERIFICATION.md §2.
domain: companies_onetime
rules:
  - code: FIRST_BM
    form: "Board meeting (no e-form)"
    title: "First Board meeting"
    entity_types: &companies [PRIVATE, OPC, PUBLIC_UNLISTED, PUBLIC_LISTED, SECTION8, NIDHI, PRODUCER]
    applicability: [not_single_director_opc]
    anchor: INCORPORATION
    offset: {days: 30}
    recurrence: once
    law: "s.173(1), Companies Act 2013"
    penalty_summary: "s.173(4) — officer in default"
    sources: ["https://www.indiacode.nic.in/handle/123456789/2114?locale=en"]
    effective_from: 2014-04-01

  - code: FIRST_AUDITOR
    form: "Board resolution (no e-form)"
    title: "Board appoints first auditor"
    entity_types: *companies
    anchor: INCORPORATION
    offset: {days: 30}
    recurrence: once
    law: "s.139(6), Companies Act 2013"
    penalty_summary: "s.147"
    sources: ["https://www.indiacode.nic.in/handle/123456789/2114?locale=en"]
    effective_from: 2014-04-01
    notes: "If the Board fails, members appoint at an EGM within 90 days. Government companies: C&AG within 60 days (s.139(7)) — flag only."

  - code: ADT1_FIRST
    form: "ADT-1"
    title: "ADT-1 for first auditor"
    entity_types: *companies
    applicability: [adt1_for_first_auditor_setting]
    anchor: FIRST_AUDITOR_APPOINTMENT
    offset: {days: 15}
    recurrence: once
    interpretation: true
    fee_regime: MULTIPLIER
    fee_slab: S139
    law: "s.139(6); Rule 4(2), Companies (Audit and Auditors) Rules 2014"
    penalty_summary: "s.147"
    sources: ["https://www.indiacode.nic.in/handle/123456789/2114?locale=en"]
    effective_from: 2014-04-01
    notes: "Interpretation (LEGAL_NOTES I3): firm policy is to file (partner decision Q2, 25-09-2026)."

  - code: SHARE_CERT
    form: "Share certificates (SH-1) / demat credit"
    title: "Issue share certificates to subscribers"
    entity_types: *companies
    applicability: [has_share_capital]
    anchor: INCORPORATION
    offset: {months: 2}
    recurrence: once
    law: "s.56(4)(a), Companies Act 2013"
    penalty_summary: "s.56(6)"
    sources: ["https://www.indiacode.nic.in/handle/123456789/2114?locale=en"]
    effective_from: 2014-04-01
    notes: "Two calendar months, not 60 days (correction C2). Demat-only where Rule 9A/9B applies."

  - code: MBP1_DIR8_FIRST
    form: "MBP-1, DIR-8 (kept by company)"
    title: "Collect MBP-1 and DIR-8 at the first Board meeting"
    entity_types: *companies
    applicability: [not_single_director_opc]
    anchor: INCORPORATION
    offset: {days: 30}
    recurrence: once
    law: "s.184(1); s.164(2) and Rule 14, Companies (Appointment and Qualification of Directors) Rules 2014"
    penalty_summary: "s.184(4)"
    sources: ["https://www.indiacode.nic.in/handle/123456789/2114?locale=en"]
    effective_from: 2014-04-01

  - code: REGISTERS
    form: "Statutory registers (MGT-1, CHG-7, MBP-2, MBP-4, directors & KMP)"
    title: "Open statutory registers"
    entity_types: *companies
    anchor: INCORPORATION
    offset: {days: 0}
    recurrence: once
    law: "ss.85, 88, 170, 186(9), 189, Companies Act 2013"
    penalty_summary: "s.88(5) and others"
    sources: ["https://www.indiacode.nic.in/handle/123456789/2114?locale=en"]
    effective_from: 2014-04-01

  - code: BOOKS
    form: "Books of account"
    title: "Maintain books of account at the registered office"
    entity_types: *companies
    anchor: INCORPORATION
    offset: {days: 0}
    recurrence: once
    law: "s.128(1), Companies Act 2013; Rule 2A, Companies (Accounts) Rules 2014"
    penalty_summary: "s.128(6)"
    sources: ["https://www.indiacode.nic.in/handle/123456789/2114?locale=en"]
    effective_from: 2014-04-01

  - code: INC22_VERIFY
    form: "INC-22"
    title: "Verification of registered office"
    entity_types: *companies
    applicability: [ro_not_furnished_at_incorporation]
    anchor: INCORPORATION
    offset: {days: 30}
    recurrence: once
    fee_regime: MULTIPLIER
    law: "s.12(2), Companies Act 2013"
    penalty_summary: "s.12(8)"
    sources: ["https://www.indiacode.nic.in/handle/123456789/2114?locale=en"]
    effective_from: 2014-04-01

  - code: INC20A
    form: "INC-20A"
    title: "Declaration for commencement of business"
    entity_types: *companies
    applicability: [has_share_capital]
    anchor: INCORPORATION
    offset: {days: 180}
    recurrence: once
    fee_regime: MULTIPLIER
    law: "s.10A(1)(a), Companies Act 2013 (inserted w.e.f. 02-11-2018)"
    penalty_summary: "s.10A(2) — company and every officer in default"
    sources: ["https://www.indiacode.nic.in/handle/123456789/2114?locale=en"]
    effective_from: 2018-11-02
