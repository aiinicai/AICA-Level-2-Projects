# docker compose up --build   ->  http://127.0.0.1:5000
# Needs a .env next to this file with SECRET_KEY and FERNET_KEY (see .env.example).
services:
  app:
    build: .
    ports:
      - "127.0.0.1:5000:5000"
    env_file: .env
    environment:
      # plain HTTP on localhost; set to 1 when served behind HTTPS
      SESSION_COOKIE_SECURE: "0"
    volumes:
      - instance:/app/instance      # database, uploads and backups survive rebuilds
    restart: unless-stopped

volumes:
  instance:
