appId: com.recodo.app
productName: Reco-Do
copyright: Copyright © 2026 Reco-Do
directories:
  output: release
  buildResources: build
files:
  - out/**/*
  - package.json
extraResources:
  - from: sample-data
    to: sample-data
    filter: ["**/*"]
win:
  # The installed program file is RecoDo.exe (shortcuts, uninstaller and Task Manager). productName and appId stay
  # the same, so the data folder (%APPDATA%\Reco-Do) and the existing install (upgraded in place) are unchanged.
  executableName: RecoDo
  target:
    - target: nsis
      arch: [x64]
    - target: portable
      arch: [x64]
  icon: build/icon.png
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: always
  createStartMenuShortcut: true
  shortcutName: Reco-Do
  # Open Reco-Do when the installer finishes; afterwards people use the Desktop / Start menu shortcut.
  runAfterFinish: true
  # Says "already installed, open it?" when the installer is run again (build/installer.nsh).
  include: build/installer.nsh
  # RecoDo-Setup.exe installs the app; RecoDo.exe (portable) is the app itself. No version in the names: the version
  # is in each file's Windows properties and in the app, and scripts/package.mjs keeps older builds as
  # release/previous-versions/RecoDo-Setup-v<version>.exe and RecoDo-v<version>.exe.
  artifactName: RecoDo-Setup.${ext}
portable:
  artifactName: RecoDo.${ext}
