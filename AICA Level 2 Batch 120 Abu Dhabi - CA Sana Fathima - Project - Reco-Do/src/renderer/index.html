<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!--
      The UI may not reach the network. The only external call (Smart Recon AI) is made by the main process.
      'wasm-unsafe-eval' lets the bundled OCR (tesseract) and PDF (pdf.js) WebAssembly run; workers load from the app itself.
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'none'"
    />
    <title>Reco-Do</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
