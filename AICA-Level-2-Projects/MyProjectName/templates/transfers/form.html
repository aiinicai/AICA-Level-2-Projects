{% extends "base.html" %}
{% block title %}New transfer{% endblock %}
{% block content %}
<h4>New transfer</h4>
<form method="post" class="row g-3">
  {% csrf_token %}
  <div class="col-md-4"><label class="form-label small">Asset</label>
    <select name="asset_id" class="form-select" required>{% for a in assets %}<option value="{{ a.asset_id }}">{{ a.asset_id }} — {{ a.description }}</option>{% endfor %}</select>
  </div>
  <div class="col-md-4"><label class="form-label small">To location</label>
    <select name="to_location" class="form-select" required>{% for loc in locations %}<option value="{{ loc.pk }}">{{ loc.breadcrumb }}</option>{% endfor %}</select>
  </div>
  <div class="col-md-4"><label class="form-label small">To custodian</label>
    <select name="to_custodian" class="form-select"><option value="">— unchanged —</option>{% for u in users %}<option value="{{ u.pk }}">{{ u }}</option>{% endfor %}</select>
  </div>
  <div class="col-md-4"><label class="form-label small">To department</label><input type="text" name="to_department" class="form-control"></div>
  <div class="col-md-8"><label class="form-label small">Reason</label><input type="text" name="reason" class="form-control"></div>
  <div class="col-12"><button class="btn btn-primary">Request transfer</button></div>
</form>
{% endblock %}
