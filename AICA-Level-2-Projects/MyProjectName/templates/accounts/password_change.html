{% block title %}Change password{% endblock %}
{% block content %}
<div class="col-md-5">
  <h4>Change password</h4>
  <form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit" class="btn btn-primary">Update password</button>
  </form>
</div>
{% endblock %}
