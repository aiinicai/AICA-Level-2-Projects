{% extends "base.html" %}
{% block title %}New disposal request{% endblock %}
{% block content %}
<h4>New disposal request</h4>
<form method="post" class="row g-3">
  {% csrf_token %}
  <div class="col-md-4"><label class="form-label small">Asset</label>
    <select name="asset_id" class="form-select" required>{% for a in assets %}<option value="{{ a.asset_id }}">{{ a.asset_id }} — {{ a.description }}</option>{% endfor %}</select>
  </div>
  <div class="col-md-4"><label class="form-label small">Mode</label>
    <select name="mode" class="form-select" required>{% for v,l in modes %}<option value="{{ v }}">{{ l }}</option>{% endfor %}</select>
  </div>
  <div class="col-md-4"><label class="form-label small">Requested disposal date</label><input type="date" name="requested_disposal_date" class="form-control" required></div>
  <div class="col-md-4"><label class="form-label small">Sale / scrap value (₹)</label><input type="number" step="0.01" name="sale_or_scrap_value" class="form-control" value="0"></div>
  <div class="col-md-4"><label class="form-label small">Disposal costs (₹)</label><input type="number" step="0.01" name="disposal_costs" class="form-control" value="0"></div>
  <div class="col-md-4"><label class="form-label small">Buyer / scrap vendor</label><input type="text" name="buyer_or_scrap_vendor" class="form-control"></div>
  <div class="col-md-8"><label class="form-label small">Reason</label><input type="text" name="reason" class="form-control"></div>
  <div class="col-md-4 form-check mt-4"><input type="checkbox" name="is_related_party" class="form-check-input" id="rp"><label class="form-check-label" for="rp">Buyer is a related party (Sec. 188)</label></div>
  <div class="col-12"><button class="btn btn-primary">Submit for approval</button></div>
</form>
{% endblock %}
