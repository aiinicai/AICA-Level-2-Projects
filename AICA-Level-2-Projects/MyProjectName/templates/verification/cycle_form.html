{% extends "base.html" %}
{% block title %}Plan verification cycle{% endblock %}
{% block content %}
<h4>Plan a verification cycle</h4>
<form method="post" class="row g-3">
  {% csrf_token %}
  <div class="col-md-4"><label class="form-label small">Entity</label>
    <select name="entity" class="form-select" required>{% for e in entities %}<option value="{{ e.pk }}">{{ e.name }}</option>{% endfor %}</select>
  </div>
  <div class="col-md-4"><label class="form-label small">Name</label><input type="text" name="name" class="form-control" required placeholder="FY26 Zone A rotational verification"></div>
  <div class="col-md-4"><label class="form-label small">Scope location (optional)</label>
    <select name="scope_location" class="form-select"><option value="">Whole entity</option>{% for loc in locations %}<option value="{{ loc.pk }}">{{ loc.breadcrumb }}</option>{% endfor %}</select>
  </div>
  <div class="col-md-4"><label class="form-label small">Start date</label><input type="date" name="start_date" class="form-control" required></div>
  <div class="col-md-4"><label class="form-label small">Target end date</label><input type="date" name="target_end_date" class="form-control" required></div>
  <div class="col-12"><button class="btn btn-primary">Create cycle</button></div>
</form>
{% endblock %}
