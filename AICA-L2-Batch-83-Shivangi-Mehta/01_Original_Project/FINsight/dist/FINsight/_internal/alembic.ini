[alembic]
script_location = database/migrations
prepend_sys_path = .
version_path_separator = os

# sqlalchemy.url is intentionally NOT set here — database/migrations/env.py
# sets it programmatically from config.Config.SQLALCHEMY_DATABASE_URI, so
# there is exactly one place the DB path is defined (config.py).

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
