<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>FinSight — Secure Local Access</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/design-system.css') }}">
</head>
<body>
  <div class="fs-access-page">
    <div class="fs-access-card">
      <div class="fs-access-brand">FinSight</div>
      <p class="fs-access-subtitle">Secure Local Access &mdash; enter the FinSight access password to continue.</p>

      {% if errors._login %}
        <div class="fs-empty-banner fs-empty-banner-warning" style="margin-bottom: 1rem;">
          <span>&#9432;</span>
          <span>{{ errors._login }}</span>
        </div>
      {% endif %}

      <form method="post" class="fs-form">
        {{ csrf_field() }}
        <input type="hidden" name="next" value="{{ next_path }}">
        <div class="fs-field">
          <label for="password">Password</label>
          <input type="password" id="password" name="password" autocomplete="current-password" autofocus {% if locked %}disabled{% endif %}>
        </div>
        <div class="fs-form-actions">
          <button type="submit" class="fs-btn fs-btn-primary" style="width: 100%;" {% if locked %}disabled{% endif %}>Access FinSight</button>
        </div>
      </form>

      <p class="fs-muted" style="margin-top: 1.25rem;">
        This instance is shared over your local network. Only continue if you recognise this device and network.
      </p>
    </div>
  </div>
</body>
</html>
