{% extends "base.html" %}
{% block content %}
  <div class="fs-page-header">
    <h1 class="fs-page-title">FAQ</h1>
    <p class="fs-page-subtitle">Answers to the questions you're most likely to have while using FinSight.</p>
  </div>

  <div class="fs-panel">
    <div class="fs-faq-list">
      {% for question, answer in faq_items %}
        <details class="fs-faq-item"{% if loop.first %} open{% endif %}>
          <summary class="fs-faq-question">{{ question }}</summary>
          <p class="fs-faq-answer">{{ answer | safe }}</p>
        </details>
      {% endfor %}
    </div>
  </div>
{% endblock %}
