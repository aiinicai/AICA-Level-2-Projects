{% extends "base.html" %}
{% block content %}
  <div class="fs-page-header">
    <h1 class="fs-page-title">Data Quality</h1>
    <p class="fs-page-subtitle">{{ upload.original_filename }}</p>
  </div>
  <div class="fs-empty-banner">
    <span>&#9432;</span>
    <span>
      {{ error }}
      <a href="{{ url_for('mapping.detail', file_id=upload.file_id) }}">Go to Mapping</a>.
    </span>
  </div>
  <div class="fs-form-actions">
    <a href="{{ url_for('validation.index') }}" class="fs-btn fs-btn-secondary">Back to Data Quality</a>
  </div>
{% endblock %}
