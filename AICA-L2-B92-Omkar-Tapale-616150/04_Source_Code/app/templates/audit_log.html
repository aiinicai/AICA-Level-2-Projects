{% extends "base.html" %}
{% block title %}Audit Log{% endblock %}
{% block content %}
<h1 class="text-2xl font-bold mb-4">Audit Log</h1>
<div class="card">
  <table class="w-full text-sm">
    <thead><tr class="text-left text-slate-500 border-b"><th class="py-1">When</th><th>Actor</th><th>Action</th><th>Detail</th></tr></thead>
    <tbody>
    {% for l in logs %}
      <tr class="border-b">
        <td class="py-1 whitespace-nowrap">{{ l.created_at.strftime('%Y-%m-%d %H:%M') }}</td>
        <td>{{ l.actor.employee_code if l.actor else "-" }}</td>
        <td>{{ l.action }}</td>
        <td class="text-slate-500">{{ l.detail }}</td>
      </tr>
    {% endfor %}
    </tbody>
  </table>
</div>
{% endblock %}
