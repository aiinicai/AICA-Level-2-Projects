{% extends "base.html" %}
{% block title %}Login - Company OS{% endblock %}
{% block content %}
<div class="min-h-[80vh] flex items-center justify-center">
  <div class="card w-full max-w-sm">
    <h1 class="text-2xl font-bold text-center mb-1">Company OS</h1>
    <p class="text-center text-sm text-slate-500 mb-6">Sign in with the credentials you were given</p>
    {% if error %}
    <div class="bg-red-50 text-red-700 text-sm px-3 py-2 rounded mb-4">{{ error }}</div>
    {% endif %}
    <form method="post" action="/login" class="space-y-4">
      <div>
        <label class="block text-sm font-medium mb-1">Employee Code</label>
        <input name="employee_code" required class="w-full border rounded px-3 py-2" placeholder="EMP-0001" autofocus>
      </div>
      <div>
        <label class="block text-sm font-medium mb-1">Password</label>
        <input name="password" type="password" required class="w-full border rounded px-3 py-2">
      </div>
      <button class="w-full bg-slate-900 text-white py-2 rounded hover:bg-slate-800">Sign In</button>
    </form>
    <p class="text-xs text-slate-400 text-center mt-6">Forgot password? Contact your Admin.</p>
  </div>
</div>
{% endblock %}
