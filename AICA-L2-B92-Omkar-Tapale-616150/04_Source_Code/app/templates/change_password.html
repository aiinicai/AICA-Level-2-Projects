{% extends "base.html" %}
{% block title %}Change Password{% endblock %}
{% block content %}
<div class="min-h-[70vh] flex items-center justify-center">
  <div class="card w-full max-w-sm">
    <h1 class="text-xl font-bold mb-1">Set a new password</h1>
    <p class="text-sm text-slate-500 mb-6">This is required before you can continue.</p>
    {% if error %}
    <div class="bg-red-50 text-red-700 text-sm px-3 py-2 rounded mb-4">{{ error }}</div>
    {% endif %}
    <form method="post" action="/change-password" class="space-y-4">
      <div>
        <label class="block text-sm font-medium mb-1">New Password</label>
        <input name="new_password" type="password" required minlength="8" class="w-full border rounded px-3 py-2">
      </div>
      <div>
        <label class="block text-sm font-medium mb-1">Confirm Password</label>
        <input name="confirm_password" type="password" required minlength="8" class="w-full border rounded px-3 py-2">
      </div>
      <button class="w-full bg-slate-900 text-white py-2 rounded hover:bg-slate-800">Update Password</button>
    </form>
  </div>
</div>
{% endblock %}
