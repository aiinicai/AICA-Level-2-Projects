<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>TickTrail</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Literata:opsz,wght@7..72,500;7..72,650&family=Public+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: working-paper register — fixed left index of modules, ledger rows on the right, tick-mark status column. */
:root{
  --bg:#f3f6f5; --surface:#ffffff; --sunk:#e9efed; --ink:#18282c; --muted:#5a6b6d; --line:#d6dfdc;
  --accent:#14566b; --accent-ink:#ffffff; --accent-soft:#dcebef;
  --ok:#1d7a4c; --ok-soft:#dcf1e5; --bad:#b3261e; --bad-soft:#f9e1de; --na:#6d7b7d; --na-soft:#e6ebea; --warn:#9a6200; --warn-soft:#fbeed3;
  --f-display:"Literata", Georgia, "Times New Roman", serif;
  --f-body:"Public Sans", "Segoe UI", system-ui, sans-serif;
  --f-mono:"IBM Plex Mono", ui-monospace, Consolas, monospace;
  --r:8px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#111a1c; --surface:#172326; --sunk:#0d1517; --ink:#e3ecea; --muted:#9db0b0; --line:#2a3b3e;
  --accent:#5cb3cc; --accent-ink:#06191e; --accent-soft:#183842;
  --ok:#5fcf93; --ok-soft:#163626; --bad:#ff8a7e; --bad-soft:#3d1c19; --na:#93a5a6; --na-soft:#223033; --warn:#f0b54d; --warn-soft:#3a2c10;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#111a1c; --surface:#172326; --sunk:#0d1517; --ink:#e3ecea; --muted:#9db0b0; --line:#2a3b3e;
  --accent:#5cb3cc; --accent-ink:#06191e; --accent-soft:#183842;
  --ok:#5fcf93; --ok-soft:#163626; --bad:#ff8a7e; --bad-soft:#3d1c19; --na:#93a5a6; --na-soft:#223033; --warn:#f0b54d; --warn-soft:#3a2c10;
  color-scheme:dark}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5}
*{box-sizing:border-box}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1,h2,h3{font-family:var(--f-display);font-weight:650;margin:0;text-wrap:balance;letter-spacing:-.01em}
.mono{font-family:var(--f-mono);font-size:.82em}
.muted{color:var(--muted)}
.app{display:grid;grid-template-columns:232px minmax(0,1fr);min-height:100%}
/* sidebar */
.side{background:var(--surface);border-right:1px solid var(--line);padding-block:20px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:16px;display:flex;flex-direction:column;gap:22px;position:sticky;top:0;height:100vh}
.brand{display:flex;flex-direction:column;gap:2px}
.brand b{font-family:var(--f-display);font-size:19px;line-height:1.2}
.brand span{font-size:12px;color:var(--muted);letter-spacing:.06em;text-transform:uppercase}
.nav{display:flex;flex-direction:column;gap:8px}
/* one colour per section */
:root{--n-dash:#5b5f97;--n-dash-s:#e6e7f1;--n-aud:#3f7a72;--n-aud-s:#e1ece9;--n-cli:#a0703a;--n-cli-s:#f1e8dc;--n-lib:#5a7f4f;--n-lib-s:#e5ece1;--n-thr:#9a5670;--n-thr-s:#f1e3e8;--n-team:#4d6b93;--n-team-s:#e2e8f0}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--n-dash:#9ea1cf;--n-dash-s:#2a2c3d;--n-aud:#88bcb3;--n-aud-s:#22302e;--n-cli:#d2ab7c;--n-cli-s:#352c21;--n-lib:#9fc093;--n-lib-s:#273024;--n-thr:#d39bb0;--n-thr-s:#36262c;--n-team:#97b0d2;--n-team-s:#252c37}}
:root[data-theme="dark"]{--n-dash:#9ea1cf;--n-dash-s:#2a2c3d;--n-aud:#88bcb3;--n-aud-s:#22302e;--n-cli:#d2ab7c;--n-cli-s:#352c21;--n-lib:#9fc093;--n-lib-s:#273024;--n-thr:#d39bb0;--n-thr-s:#36262c;--n-team:#97b0d2;--n-team-s:#252c37}
.nav button[data-view="dashboard"]{--c:var(--n-dash);--cs:var(--n-dash-s)}
.nav button[data-view="audits"]{--c:var(--n-aud);--cs:var(--n-aud-s)}
.nav button[data-view="clients"]{--c:var(--n-cli);--cs:var(--n-cli-s)}
.nav button[data-view="settings"]{--c:var(--n-team);--cs:var(--n-team-s)}
.nav button[data-view="library"]{--c:var(--n-lib);--cs:var(--n-lib-s)}
.nav button[data-view="thresholds"]{--c:var(--n-thr);--cs:var(--n-thr-s)}
.nav button[data-view="team"]{--c:var(--n-team);--cs:var(--n-team-s)}
.nav button{all:unset;box-sizing:border-box;cursor:pointer;display:flex;gap:12px;align-items:center;padding:10px 12px;border:1.5px solid var(--line);border-left:5px solid var(--c);border-radius:10px;background:var(--cs);
  font-weight:700;font-size:14.5px;letter-spacing:.01em;color:var(--ink);box-shadow:none;border-color:transparent;border-left-color:var(--c)}
.nav button span:not(.badge){flex:1}
.nav .nic{width:32px;height:32px;padding:6px;box-sizing:border-box;border-radius:8px;background:var(--surface);flex:none;fill:none;stroke:var(--c);stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.nav button:hover{border-color:var(--c)}
.nav button[aria-current="true"]{background:var(--c);border-color:var(--c);color:var(--surface);box-shadow:none}
.nav button[aria-current="true"] .nic{stroke:var(--c);background:var(--surface)}
.nav button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
@media (prefers-reduced-motion:no-preference){.nav button{transition:background .15s,border-color .15s}}
.nav kbd{font-family:var(--f-mono);font-size:11px;color:var(--muted);border:1px solid var(--line);border-radius:4px;padding:0 5px}
.side .me{margin-top:auto;display:flex;flex-direction:column;gap:6px;font-size:13px}
.side .me input{width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:6px;background:var(--bg);text-transform:uppercase}
.side .help{all:unset;cursor:pointer;font-size:13px;color:var(--accent);font-weight:600}
main{min-width:0;padding-block:24px 60px;padding-left:28px;padding-right:max(28px,env(safe-area-inset-right,0px))}
.head{display:flex;flex-wrap:wrap;gap:14px;align-items:flex-end;justify-content:space-between;margin-bottom:20px}
.head h1{font-size:28px}
.head p{margin:4px 0 0;color:var(--muted);max-width:62ch}
/* buttons */
.btn{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--surface);padding:9px 14px;border-radius:var(--r);font-weight:600;cursor:pointer;white-space:nowrap}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.danger{color:var(--bad)}
.btn.small{padding:6px 10px;font-size:13px}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.row-actions{display:flex;flex-wrap:wrap;gap:8px}
/* stats */
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-bottom:22px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px}
.stat b{display:block;font-family:var(--f-display);font-size:30px;font-variant-numeric:tabular-nums;line-height:1.1}
.stat span{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.stat.alert b{color:var(--bad)}
/* tables */
.tablewrap{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow-x:auto}
table{border-collapse:collapse;width:100%;min-width:640px}
th,td{text-align:left;padding:12px 14px;border-bottom:1px solid var(--line);vertical-align:middle}
th{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600;background:var(--sunk)}
tr:last-child td{border-bottom:0}
tbody tr.click{cursor:pointer}
tbody tr.click:hover td{background:var(--sunk)}
td.num{font-variant-numeric:tabular-nums;text-align:right}
.bar{height:8px;background:var(--sunk);border-radius:99px;overflow:hidden;display:flex;min-width:120px}
.bar i{display:block;height:100%}
.bar .y{background:var(--ok)}.bar .x{background:var(--bad)}.bar .n{background:var(--na)}
.pill{display:inline-block;padding:2px 9px;border-radius:99px;font-size:12px;font-weight:600;white-space:nowrap}
.pill.prog{background:var(--accent-soft);color:var(--accent)}
.pill.rev{background:var(--warn-soft);color:var(--warn)}
.pill.done{background:var(--ok-soft);color:var(--ok)}
.pill.H{background:var(--bad-soft);color:var(--bad)}
.pill.M{background:var(--warn-soft);color:var(--warn)}
.pill.L{background:var(--na-soft);color:var(--na)}
.empty{background:var(--surface);border:1px dashed var(--line);border-radius:var(--r);padding:36px 24px;text-align:center;color:var(--muted)}
.empty h3{color:var(--ink);font-size:19px;margin-bottom:6px}
.empty .btn{margin-top:14px}
/* clients */
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:10px}
.card h3{font-size:18px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font-size:12px;padding:2px 8px;border-radius:5px;background:var(--sunk);color:var(--muted);font-weight:600}
/* workspace */
.ws{display:grid;grid-template-columns:250px minmax(0,1fr);gap:20px;align-items:start}
.mods{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:8px;position:sticky;top:12px;max-height:calc(100vh - 24px);overflow:auto}
.mods button{all:unset;box-sizing:border-box;cursor:pointer;display:grid;grid-template-columns:1fr auto;gap:2px 8px;width:100%;padding:9px 10px;border-radius:6px}
.mods button:hover{background:var(--sunk)}
.mods button[aria-current="true"]{background:var(--accent-soft)}
.mods button:focus-visible{outline:2px solid var(--accent)}
.mods .nm{font-weight:600;font-size:14px}
.mods .ct{font-family:var(--f-mono);font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.mods .bar{grid-column:1/-1;height:4px;min-width:0}
.mods .xc{color:var(--bad)}
.ahead{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;margin-bottom:16px;display:flex;flex-direction:column;gap:14px}
.ahead .top{display:flex;flex-wrap:wrap;justify-content:space-between;gap:12px;align-items:flex-start}
.ahead h1{font-size:26px}
.ahead .meta{display:flex;flex-wrap:wrap;gap:14px;align-items:center;color:var(--muted);font-size:14px}
.ahead select{padding:6px 8px;border:1px solid var(--line);border-radius:6px;background:var(--bg)}
.prog{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.prog .bar{flex:1;height:10px}
.prog .legend{display:flex;gap:14px;font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.legend i{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:5px;vertical-align:0}
.tools{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:10px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:var(--r);overflow:hidden;background:var(--surface)}
.seg button{all:unset;cursor:pointer;padding:7px 12px;font-size:13px;font-weight:600;color:var(--muted);border-right:1px solid var(--line)}
.seg button:last-child{border-right:0}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--surface)}
.seg button:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
.search{flex:1;min-width:180px;padding:8px 12px;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
.modtitle{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin:6px 0 10px;flex-wrap:wrap}
.modtitle h2{font-size:21px}
.sec{font-size:12px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);font-weight:700;margin:16px 0 6px}
.items{display:flex;flex-direction:column;gap:6px}
.item{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);display:grid;grid-template-columns:44px minmax(0,1fr) auto;gap:0 12px;padding:12px 14px 12px 0;scroll-margin:80px}
.item.active{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.item .tick{display:flex;align-items:flex-start;justify-content:center;font-size:22px;font-weight:700;line-height:1;padding-top:2px}
.item.Y .tick{color:var(--ok)} .item.X .tick{color:var(--bad)} .item.N .tick{color:var(--na)}
.item.X{background:linear-gradient(90deg,var(--bad-soft),var(--surface) 60%)}
.item .body{min-width:0;display:flex;flex-direction:column;gap:4px}
.item .txt{font-weight:500;cursor:pointer}
.item .ref{display:flex;flex-wrap:wrap;gap:8px;align-items:center;color:var(--muted);font-size:13px}
.item .ref .id{font-family:var(--f-mono);font-size:12px;color:var(--accent)}
.status{display:flex;gap:4px;align-items:flex-start}
.status button{all:unset;cursor:pointer;width:34px;height:34px;display:grid;place-items:center;border:1px solid var(--line);border-radius:6px;font-weight:700;font-size:15px;color:var(--muted);background:var(--surface)}
.status button:hover{border-color:var(--ink)}
.status button:focus-visible{outline:2px solid var(--accent)}
.status button.on.Y{background:var(--ok);border-color:var(--ok);color:var(--surface)}
.status button.on.X{background:var(--bad);border-color:var(--bad);color:var(--surface)}
.status button.on.N{background:var(--na);border-color:var(--na);color:var(--surface)}
.status button.nt{font-size:11px;width:auto;padding:0 8px}
.detail{grid-column:2/-1;margin-top:10px;padding-top:12px;border-top:1px dashed var(--line);display:grid;grid-template-columns:minmax(0,1fr) 220px;gap:12px}
.detail .how{grid-column:1/-1;background:var(--sunk);border-radius:6px;padding:10px 12px;font-size:14px}
.detail .how b{font-size:11px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);display:block;margin-bottom:2px}
.detail label{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.05em}
.detail textarea,.detail input[type=text]{width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:6px;background:var(--bg);font-size:14px;text-transform:none;letter-spacing:0;font-weight:400;color:var(--ink)}
.detail textarea{min-height:78px;resize:vertical}
.detail .side2{display:flex;flex-direction:column;gap:10px}
.detail .sign{font-size:13px;color:var(--muted)}
.detail .chk{flex-direction:row;align-items:center;gap:8px;text-transform:none;letter-spacing:0;font-size:14px;color:var(--ink);font-weight:500}
.detail .py{grid-column:1/-1;font-size:13px;color:var(--muted);border-left:3px solid var(--line);padding-left:10px}
/* forms / modal */
.scrim{position:fixed;inset:0;background:rgba(10,20,22,.45);display:flex;justify-content:flex-end;z-index:50}
.panel{background:var(--surface);width:min(560px,100%);height:100%;overflow:auto;padding-block:24px;padding-left:24px;padding-right:max(24px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:16px;box-shadow:-10px 0 30px rgba(0,0,0,.15)}
.panel h2{font-size:22px}
.f{display:flex;flex-direction:column;gap:5px;font-size:13px;font-weight:600}
.f input,.f select,.f textarea{padding:9px 11px;border:1px solid var(--line);border-radius:6px;background:var(--bg);font-weight:400;font-size:15px}
.f textarea{min-height:70px;resize:vertical}
.f small{font-weight:400;color:var(--muted)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.flags{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.flag{display:flex;gap:8px;align-items:flex-start;padding:9px 10px;border:1px solid var(--line);border-radius:6px;cursor:pointer;font-size:14px;line-height:1.35}
.flag input{margin-top:2px;accent-color:var(--accent)}
.flag:has(input:checked){border-color:var(--accent);background:var(--accent-soft)}
.flag.derived{cursor:default;opacity:.85}
.panel .foot{margin-top:auto;display:flex;gap:8px;justify-content:space-between;flex-wrap:wrap;padding-top:12px;border-top:1px solid var(--line)}
.report{white-space:pre-wrap;font-family:var(--f-mono);font-size:13px;background:var(--sunk);border-radius:6px;padding:14px;max-height:55vh;overflow:auto}
.panel{width:min(760px,100%)}
.psec{font-size:12px;letter-spacing:.08em;text-transform:uppercase;font-weight:700;color:var(--accent);border-top:1px solid var(--line);padding-top:14px;margin-top:4px}
.appl{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.arow{display:grid;grid-template-columns:30px minmax(0,1fr);gap:10px;padding:10px 12px;border-bottom:1px solid var(--line);font-size:14px}
.arow:last-child{border-bottom:0}
.amark{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:13px}
.arow.on .amark{background:var(--ok-soft);color:var(--ok)} .arow.off .amark{background:var(--na-soft);color:var(--na)} .arow.info .amark{background:var(--accent-soft);color:var(--accent);font-family:var(--f-display)}
.astate{font-size:12px;font-weight:700;margin-left:6px}
.arow.on .astate{color:var(--ok)} .arow.off .astate{color:var(--na)} .arow.info .astate{color:var(--accent)}
.areason{color:var(--muted);font-size:13px;margin-top:2px}
.arow.off b{color:var(--muted)}
.tinp{width:120px;padding:6px 8px;border:1px solid var(--line);border-radius:6px;background:var(--bg);text-align:right;font-variant-numeric:tabular-nums}
.pan-good{color:var(--ok)!important}.pan-warn{color:var(--warn)!important}.pan-bad{color:var(--bad)!important}
.f a{color:var(--accent);font-weight:600}
.fgroup{display:flex;flex-direction:column;gap:10px;margin-bottom:6px}
.fgroup h3{font-size:16px;margin-top:8px}
.fq{display:grid;grid-template-columns:minmax(0,1fr) 190px;gap:14px;align-items:start;padding:12px 14px;border:1px solid var(--line);border-radius:var(--r);background:var(--bg)}
.fq.missing,.f.missing input,.f.missing select{border-color:var(--bad)}
.fq.missing{box-shadow:inset 3px 0 0 var(--bad)}
.fq-text label{font-weight:600;font-size:14.5px;display:block;margin-bottom:6px}
.guide{display:grid;grid-template-columns:max-content minmax(0,1fr);gap:3px 10px;margin:0;font-size:13px;line-height:1.45}
.guide dt{font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;font-size:11px;padding-top:2px}
.guide dd{margin:0;color:var(--muted)}
.fq-in{display:flex;flex-direction:column;gap:4px}
.fq-in select,.inunit{width:100%;border:1px solid var(--line);border-radius:6px;background:var(--surface)}
.fq-in select{padding:9px 10px;font-size:15px}
.inunit{display:flex;align-items:center;overflow:hidden}
.inunit input{flex:1;min-width:0;border:0;background:transparent;padding:9px 10px;font-size:15px;text-align:right;font-variant-numeric:tabular-nums}
.inunit .pre{background:transparent;padding:0 0 0 10px;font-size:15px;color:var(--muted)}
.tinp{width:170px}
.inunit span{padding:0 10px;font-size:12px;color:var(--muted);background:var(--sunk);align-self:stretch;display:flex;align-items:center;white-space:nowrap}
.conv{font-size:12px;color:var(--accent);text-align:right;font-variant-numeric:tabular-nums;min-height:1em}
.fyrow{display:grid;grid-template-columns:180px minmax(0,1fr);gap:14px;align-items:end}
.fillprog{display:flex;flex-direction:column;gap:6px;font-size:13px;color:var(--muted);position:sticky;top:-24px;background:var(--surface);padding:8px 0;z-index:2}
.fillprog a{color:var(--accent);font-weight:600}
.fillbar{height:6px;border-radius:99px;background:var(--sunk);overflow:hidden}
.fillbar i{display:block;height:100%;background:var(--accent)}
.savewrap{display:inline-flex;cursor:pointer}

// one write at a time per document
const chains = {};
function write(path, fn){
  if(!S.db){ toast("Saving is not available in this view."); return Promise.resolve(); }
  const p = (chains[path] || Promise.resolve()).then(() => fn(S.db.doc(path))).catch(e => {
    if(e && e.code === "invalid_argument"){ S.canWrite = false; toast("You have view-only access to this register."); }
    else if(e && e.code === "quota_exceeded"){ toast("The database is full. Delete old audits to free space."); }
    else { toast("Could not save. Check your connection and try again."); }
    console.error(e);
  });
  chains[path] = p; return p;
}

    else if(x.opc) add("caro","CARO 2020",0,"Exempt: One Person Company (para 1(2)).");
    else if(small) add("caro","CARO 2020",0,"Exempt: small company (para 1(2)).");
    else if(x.pvt && !x.holdSubPublic && nw<=t.caro_nw && n("maxBankBorr")<=t.caro_borrow && n("totalRevenue")<=t.caro_rev)

    else { const why = !x.pvt ? "Public company." : x.holdSubPublic ? "Private company that is a holding / subsidiary of a public company." :
      [nw>t.caro_nw && `capital + reserves ${money(nw)} > ${money(t.caro_nw)}`, n("maxBankBorr")>t.caro_borrow && `bank borrowings ${money(n("maxBankBorr"))} > ${money(t.caro_borrow)}`, n("totalRevenue")>t.caro_rev && `revenue ${money(n("totalRevenue"))} > ${money(t.caro_rev)}`].filter(Boolean).join("; ");

  }

    add("tp","Transfer pricing",on, n("intlAE")>0 ? `International transactions of ${money(n("intlAE"))} with associated enterprises: Form 3CEB.` : n("sdt")>t.tp_sdt ? `Specified domestic transactions ${money(n("sdt"))} > ${money(t.tp_sdt)}.` : "No international transactions; SDT within limit."); }

    add("csr","CSR (s.135)",hit.length>0, hit.length ? `Preceding year ${hit.join(", ")} meets a s.135(1) threshold.` : `Preceding-year net worth, turnover and net profit all below ${money(t.csr_nw)} / ${money(t.csr_turn)} / ${money(t.csr_np)}.`); }
  // ---- report formats, decided from the entity and the results above ----
  { const yr = fy || currentFY(); const nw = isNewAct(yr);
    const statRep = !scope.statAudit ? "" :

  return S.lib.filter(m => applies(m.need, scope)).sort((a,b)=>a.order-b.order).map(m => ({...m, items:(m.items||[]).filter(it => !it.off && applies(it.need, scope))})).filter(m => m.items.length);

function tally(audit){

// Keep every open audit file in step with the client's current figures and the current legal thresholds.
function syncOpenAudits(){ if(!(S.unlocked && S.granted && S.loaded.lib && S.loaded.clients && S.loaded.audits)) return 0; let n = 0;
  S.audits.forEach(au => { if(au.status==="Signed off" || recLocked(au)) return; const c = clientOf(au.clientId); const f = c?.figures?.[au.fy]; if(!c || !f || missingFigs(c, f).length) return;
    let res; try{ res = compute(c, f, au.fy); }catch(e){ console.error(e); return; }
    const on = sc => Object.keys(sc||{}).filter(k => sc[k]).sort();
    if(JSON.stringify(on(res.scope))===JSON.stringify(on(au.scope)) && JSON.stringify(res.rows)===JSON.stringify(au.applic||[]) && JSON.stringify(f)===JSON.stringify(au.figures||{})) return;
    const before = on(au.scope), after = on(res.scope);
    au.autoSync = {at: Date.now(), added: after.filter(k => !before.includes(k)), removed: before.filter(k => !after.includes(k)), seen: false};
    au.scope = res.scope; au.applic = res.rows; au.figures = f;
    const {id:_x, ...doc} = au; doc.updatedAt = Date.now(); write("audits/"+au.id, r => r.set(doc)); n++; });
  return n; }
function scheduleSync(){ clearTimeout(S._syncT); S._syncT = setTimeout(() => { const n = syncOpenAudits(); if(n){ toast(`${n} open audit file${n>1?"s":""} updated to the latest figures and thresholds`); rerender(); } }, 1200); }

const PIPE = ["Acceptance","Planning","Fieldwork","Review","Reporting","Records"];
function stageOf(a){
  if(!a.flow) return {i:-1, label:"Checklist only"};
  if(!a.acc?.approved) return {i:0, label:"Acceptance"};
  if(!a.plan?.approved) return {i:1, label:"Planning"};
  const g = signoffGaps(a);
  if(g.pend || g.incomplete || g.notes) return {i:2, label:"Fieldwork"};
  if(g.unrev) return {i:3, label:"Review"};
  if(!a.rep?.issued || a.status!=="Signed off") return {i:4, label:"Reporting"};
  if(!recLocked(a)) return {i:5, label:"Records"};
  return {i:6, label:"Completed"};
}
function pipeHTML(a){
  const st = stageOf(a);

  return `<div class="pipe" title="${esc(st.label)}">${PIPE.map((p,k)=>`<i class="${k<st.i?"d":k===st.i?"c":""}"></i>`).join("")}</div><div class="pipel">${esc(st.label)}</div>`;
}

    const nm = a.clientName + " · FY " + a.fy; const P = a.plan||{};

function logEv(action, ref, val){
  const aid = S.auditId; if(!aid || !S.me) return;
  const v = val==null ? "" : typeof val==="string" ? val : (typeof val==="object" && val.by) ? `by ${who(val.by)}` : (typeof val==="object" && !Array.isArray(val)) ? Object.entries(val).filter(([,x])=>x!=null && typeof x!=="object").map(([k,x])=>`${k}: ${x}`).join(", ") : JSON.stringify(val);
  (S.logBuf ||= []).push({aid, t: Date.now(), a: action, r: ref||"", v: v.length>140 ? v.slice(0,140)+"…" : v});
  clearTimeout(S._logT); S._logT = setTimeout(flushLog, 2500);
}
function flushLog(){
  const buf = S.logBuf||[]; S.logBuf = []; if(!buf.length) return;
  const byAid = {}; buf.forEach(e => (byAid[e.aid] ||= []).push(e));
  Object.entries(byAid).forEach(([aid, list]) => {
    // one document per person, day and browser session, so writers never overwrite each other
    const day = today().replace(/-/g,""); const id = day + "_" + S.me.id + "_" + (S._sess ||= uid());
    const key = aid + "/" + id; const e = [...((S._myLog ||= {})[key] || []), ...list.map(({aid:_, ...x}) => x)].slice(-1500);
    S._myLog[key] = e; if(aid===S._timeFor) S.logDocs[id] = {uid:S.me.id, day, e};
    write(`audits/${aid}/log/${id}`, r => r.set({uid:S.me.id, day, e}));
  });
}

const PAN_TYPE = {C:"Company",F:"Firm / LLP",P:"Individual",H:"HUF",T:"Trust",A:"AOP / society",B:"Body of individuals",G:"Government",J:"Artificial juridical person",L:"Local authority"};

function checkPan(pan, entity, name){

  if(!/^[A-Z]{5}[0-9]{4}[A-Z]$/.test(pan)) return {ok:false, level:"bad", msg:"PAN must be 5 letters, 4 digits, 1 letter (e.g. AAACA1234F)."};
  const t = pan[3], exp = PAN_EXPECT[entity]||"";
  if(!PAN_TYPE[t]) return {ok:false, level:"bad", msg:`4th character '${t}' is not a valid holder type.`};
  if(exp && !exp.includes(t)) return {ok:false, level:"bad", msg:`4th character '${t}' means ${PAN_TYPE[t]}, which does not match ${entity}.`};
  if(!["P","H"].includes(t) && entity!=="Proprietorship"){
    const first = (name||"").toUpperCase().replace(/^(M\/S\.?|THE)\s+/,"").replace(/[^A-Z]/g,"")[0];
    if(first && first!==pan[4]) return {ok:true, level:"warn", msg:`Format valid (${PAN_TYPE[t]}). 5th character '${pan[4]}' usually matches the first letter of the name ('${first}'): check.`};
  }
  return {ok:true, level:"good", msg:`Format valid · ${PAN_TYPE[t]}. Confirm the name on the portal.`};
}

function prevFY(fy){ const m = /^(\d{4})-(\d{2})$/.exec(fy||""); if(!m) return ""; const a=+m[1]-1; return `${a}-${String((a+1)%100).padStart(2,"0")}`; }
// Master data that normally stays the same from year to year: brought forward from the latest earlier year
const MASTER = ["holdSubAny","holdSubPublic","gstin","filingDefault","paidUp","llpContrib"];
function fyOptions(c, sel){
  const cur = currentFY(); const list = new Set([nextFY(cur), cur]); let y = cur;
  for(let i=0;i<6;i++){ y = prevFY(y); list.add(y); }
  Object.keys(c?.figures||{}).forEach(k => list.add(k)); if(sel) list.add(sel);
  return [...list].sort().reverse().map(k => `<option value="${k}" ${k===sel?"selected":""}>FY ${k}${k===cur?" (audit year)":k===nextFY(cur)?" (running year)":""}${c?.figures?.[k]?" · figures saved":""}</option>`).join("");
}
function prefill(c, fy){
  const f = {}, carried = {};
  const earlier = Object.keys(c?.figures||{}).filter(k => k < fy).sort().reverse();
  MASTER.forEach(k => { const from = earlier.find(y => c.figures[y][k]!==undefined); if(from){ f[k] = c.figures[from][k]; carried[k] = from; } });
  const pf = prevFY(fy), p = c?.figures?.[pf];
  if(p){
    if(p.turnover!==undefined){ f.prevTurnover = p.turnover; carried.prevTurnover = pf; }
    if(p.paidUp!==undefined && p.reserves!==undefined){ f.prevNetWorth = p.paidUp + p.reserves; carried.prevNetWorth = pf; }
  }
  return {f, carried};
}
function drawCarry(fy){

  if(!k.length){ el.innerHTML = ""; return; }
  const names = k.map(x => (FIG.find(d=>d.k===x)||{}).q).filter(Boolean);
  el.innerHTML = `<div class="carry"><b>Brought forward for FY ${esc(fy)}:</b> ${names.length} item${names.length>1?"s":""} of master data and last year's closing figures are filled in from earlier years (marked below). Check each one; only the year's own figures need fresh entry.</div>`;
}

function deleteClient(cid){

function createAudit(clientId, fy, opts={}){
  const c = clientOf(clientId);
  if(!/^\d{4}-\d{2}$/.test(fy)){ toast("Enter the year as 2025-26."); return null; }
  if(S.audits.some(a=>a.clientId===clientId && a.fy===fy)){ toast(`An audit for ${c.name}, ${fy} already exists.`); return null; }
  const f = c.figures?.[fy]; if(!f){ toast(`Enter FY ${fy} figures for ${c.name} first.`); return null; }
  const {scope, rows} = compute(c, f, fy);
  const id = uid();
  const data = {clientId, clientName:c.name, fy, status:"In progress", flow:true, acc:{}, scope, applic: rows, figures: f, results: opts.results || {}, createdAt:Date.now(), updatedAt:Date.now(), createdBy: initials()};
  S.audits.push({id, ...data});
  write("audits/"+id, ref => ref.set(data));
  return id;
}

// ---------- stages ----------
const STAGES = [["acc","1 · Acceptance"],["plan","2 · Planning"],["prog","3 · Audit programme"],["evid","4 · Evidence"],["rep","5 · Reporting"],["rec","6 · Records"]];
function stageTabs(a){
  const done = {acc: !!a.acc?.approved, plan: !!a.plan?.approved, rep: !!a.rep?.issued, rec: !!a.rec?.assembled};
  return `<nav class="stages" aria-label="Audit stages">${STAGES.map(([k,l]) => { const soon = false;
    return `<button data-stage="${k}" aria-current="${S.stage===k}" ${soon?`disabled title="Coming in the next update"`:""}>${esc(l)}${done[k]?` <span class="sdone">✓</span>`:""}${soon?` <span class="soon">soon</span>`:""}</button>`; }).join("")}</nav>`;
}
function stageFoot(a){
  const cur = S.stage || "prog"; const i = STAGES.findIndex(([k]) => k===cur); if(i<0) return "";
  const prev = STAGES[i-1], next = STAGES[i+1];
  const hint = TM() ? {acc:"Testing mode: the audit programme is open without approvals.", plan:"Testing mode: the audit programme is open without approvals."}[cur] || null : null;
  const hint0 = {acc: a.acc?.approved ? "Acceptance approved." : "Acceptance is not approved yet. You can prepare Planning, but the audit programme stays locked until both are approved.",
    plan: a.plan?.approved ? "Planning approved." : "Planning is not approved yet. The audit programme opens once Acceptance and Planning are approved.",
    prog: "Marks, notes and attachments save as you work.", evid: "Attach any missing PDFs from the step they belong to.",
    rep: a.rep?.issued ? "Reports issued." : "Reports are not issued yet.", rec: a.rec?.assembled ? "File assembled." : "Assemble the final file within 60 days of the report date (SA 230)."}[cur] || "";
  const hintTxt = hint || hint0;
  return `<div class="stagefoot"><div><b>Stage ${i+1} of ${STAGES.length}</b><span class="muted">${esc(hintTxt)}</span></div>
    <div class="row-actions">${prev ? `<button class="btn" data-stage="${prev[0]}">← ${esc(prev[1])}</button>` : ""}
    ${next ? `<button class="btn primary" data-stage="${next[0]}">Save & next: ${esc(next[1])} →</button>` : `<button class="btn primary" data-act="back">Save & back to audits</button>`}</div></div>`;
}
// ---------- PDF attachments ----------
function attHTML(list, key, locked){
  const items = list.map((f,k) => `<li><a href="/_blob/${esc(f.id)}" target="_blank" rel="noopener">📄 ${esc(f.name)}</a><span class="muted"> · ${(f.size/1048576).toFixed(2)} MB · ${esc(who(f.by))} · ${esc(f.at||"")}</span>${!locked && (f.by===S.me?.id || isAdmin()) ? `<button class="linkbtn" data-act="attDel" data-key="${esc(key)}" data-k="${k}">Remove</button>`:""}</li>`).join("");
  return `<div class="att"><b>Supporting documents (PDF)</b>${items?`<ul>${items}</ul>`:`<p class="muted">None attached yet.</p>`}
    ${locked ? "" : S.canUpload ? `<label class="btn small attbtn">＋ Attach PDF<input type="file" accept="application/pdf,.pdf" multiple data-att="${esc(key)}" hidden></label>` : `<p class="muted">Uploads are not available until an admin approves your access.</p>`}</div>`;
}
function getAtt(a, key){ const [kind, ref] = key.split(":"); if(kind==="pt") return a.results?.[ref]?.att || []; if(kind==="pl") return a.plan?.att?.[ref] || []; if(kind==="rp") return a.rep?.att?.[ref] || []; return a.acc?.att?.[ref] || []; }
async function uploadAtt(input){
  const a = S.audits.find(x=>x.id===S.auditId); if(!a) return; const key = input.dataset.att;
  if(a.status==="Signed off"){ toast("This file is signed off and locked."); return; }
  const files = [...input.files]; input.value = ""; if(!files.length) return;
  const assets = await claude.use("assets"); if(!assets){ toast("Uploads are not available for your access level."); return; }
  const added = [];
  for(const f of files){
    if(!(f.type==="application/pdf" || /\.pdf$/i.test(f.name))){ toast(`${f.name} is not a PDF. Scan or save it as PDF first.`); continue; }
    if(f.size > 20*1048576){ toast(`${f.name} is larger than 20 MB. Reduce the scan resolution and try again.`); continue; }
    toast(`Uploading ${f.name}…`);
    try{ const r = await assets.upload(f, {type:"application/pdf"}); added.push({id:r.id, name:f.name, size:r.sizeBytes, by:S.me.id, at:today()}); }
    catch(e){ console.error(e); toast(e?.code==="quota_or_state" ? "Storage is full. Ask an admin to remove old files." : `Could not upload ${f.name}.`); }
  }
  if(!added.length) return; logEv("att", key, added.map(f=>f.name).join(", "));
  const list = [...getAtt(a, key), ...added]; const [kind, ref] = key.split(":");
  if(kind==="pt") saveField(ref, "att", list); else if(kind==="pl") setPlan(`att.${ref}`, list, true); else if(kind==="rp") setRep(`att.${ref}`, list, true); else setAcc(`att.${ref}`, list, true);
  ensureTimer(); toast(`${added.length} file${added.length>1?"s":""} attached`); render(); focusActive(false);
}
function removeAtt(key, k){

  B.push({t:"row", l:`Ref: EL/${u(a.clientName).replace(/[^A-Z0-9]+/g,"").slice(0,10)}/${a.fy}`, r:`Date: ${dt(el.date)}`});
  gap(4);
  P_(`To\n${u(el.to)||autoAddressee(c)}\n**${u(a.clientName)}**${el.addr?`\n${u(el.addr)}`:""}${c.pan?`\nPAN: ${u(c.pan)}`:""}`);
  P_("Dear Sir / Madam,");
  P_(`**Sub: Terms of engagement for the audit of the financial statements of ${u(a.clientName)} for the financial year ${a.fy} (year ending ${ye})**`);

  H("Appointment");
  P_(ap.by && ap.date ? `We refer to the ${u(ap.by).toLowerCase()} dated ${dt(ap.date)} appointing us as auditors of ${u(a.clientName)}${co?" under section 139 of the Companies Act, 2013":""}${ap.term?` for a term of ${u(ap.term)} year${ap.term>1?"s":""}`:""}. We are pleased to accept the appointment, and this letter confirms our understanding of the terms and objectives of the engagement and the nature and limitations of the services we will provide, as required by Standard on Auditing (SA) 210, Agreeing the Terms of Audit Engagements.`
    : `You have requested that we audit the financial statements of ${u(a.clientName)} for the financial year ${a.fy}. We are pleased to confirm our acceptance and our understanding of this engagement by means of this letter, as required by Standard on Auditing (SA) 210, Agreeing the Terms of Audit Engagements.`);

  H("Objective and scope of the audit");
  P_(`We will audit the financial statements of ${the}, which comprise the ${co ? `Balance Sheet as at ${ye}, the Statement of Profit and Loss${fwKey==="indas"?" (including Other Comprehensive Income), the Statement of Changes in Equity":""} and the Statement of Cash Flows for the year then ended` : x.trust ? `Balance Sheet as at ${ye} and the Income and Expenditure Account for the year then ended` : `Balance Sheet as at ${ye} and the Profit and Loss Account for the year then ended${x.llp?", and the Statement of Cash Flows where applicable":""}`}, and the notes to the financial statements, including a summary of significant accounting policies and other explanatory information.`);
  P_(`The objective of our audit is to obtain reasonable assurance about whether the financial statements as a whole are free from material misstatement, whether due to fraud or error, and to issue an auditor's report that includes our opinion on whether they give a true and fair view in conformity with ${fw}${co?", and the other accounting principles generally accepted in India, as required by the Companies Act, 2013 (\"the Act\")":""}.`);
  P_("The engagement covers the following reports:");
  (reps.length ? reps.map(r => `**${u(r.label)}:** ${u(r.reason)}`) : ["**Audit report** on the financial statements."]).forEach(s => li("•", s));
  if(co && sc.caro) li("•", "**Companies (Auditor's Report) Order, 2020 (CARO 2020):** a statement on the matters specified in paragraphs 3 and 4 of the Order, issued under section 143(11) of the Act, as an annexure to our report.");
  if(co && sc.ifc) li("•", "**Internal financial controls with reference to financial statements:** our report under section 143(3)(i) of the Act, in accordance with the Guidance Note issued by the ICAI.");
  if(sc.taxAudit) P_("The tax audit report and any other certificate will be issued under the applicable statute and in the form prescribed for it. Where a separate engagement letter is issued for such work, its terms will apply in addition to this letter.");

  H("Our responsibilities");
  P_(`We will conduct our audit in accordance with the Standards on Auditing issued by the Institute of Chartered Accountants of India (ICAI)${co?" and specified under section 143(10) of the Act":""}. Those Standards require that we comply with ethical requirements, including the Code of Ethics issued by the ICAI, and plan and perform the audit to obtain reasonable assurance about whether the financial statements are free from material misstatement. As part of an audit, we exercise professional judgement and maintain professional scepticism throughout. We will:`);
  L(["identify and assess the risks of material misstatement of the financial statements, whether due to fraud or error, design and perform audit procedures responsive to those risks, and obtain audit evidence that is sufficient and appropriate to provide a basis for our opinion (SA 315, SA 330 and SA 240);",
    `obtain an understanding of internal control relevant to the audit in order to design audit procedures that are appropriate in the circumstances${co && sc.ifc ? ", and express an opinion on the adequacy and operating effectiveness of the internal financial controls with reference to financial statements" : ""};`,
    "evaluate the appropriateness of accounting policies used and the reasonableness of accounting estimates and related disclosures made by management;",
    `conclude on the appropriateness of management's use of the going concern basis of accounting and whether a material uncertainty exists related to events or conditions that may cast significant doubt on ${the}'s ability to continue as a going concern (SA 570);`,
    "evaluate the overall presentation, structure and content of the financial statements, including the disclosures, and whether they represent the underlying transactions and events in a manner that achieves fair presentation; and",
    "communicate to you in writing any significant deficiencies in internal control that we identify during the audit (SA 265)."]);
  if(co) P_("If, in the course of the audit, we have reason to believe that an offence of fraud involving the amount prescribed is being or has been committed against the Company by its officers or employees, we are required by section 143(12) of the Act, read with Rule 13 of the Companies (Audit and Auditors) Rules, 2014, to report it to the Central Government, or to the Audit Committee or the Board as prescribed. Such reporting will be made without further reference to you.");

  H("Inherent limitations of an audit");
  P_("Because of the inherent limitations of an audit, together with the inherent limitations of internal control, there is an unavoidable risk that some material misstatements may not be detected, even though the audit is properly planned and performed in accordance with the Standards on Auditing. Our audit is based on tests and sampling, and is not designed to detect all errors, irregularities or fraud. The primary responsibility for the prevention and detection of fraud and error rests with management and those charged with governance.");

  H(`Responsibilities of ${co?"management and the Board of Directors":x.trust?"the Trustees":"management"}`);
  P_(`Our audit will be conducted on the basis that ${who2} acknowledge and understand that they have responsibility for:`);
  L([`the preparation of financial statements that give a true and fair view in accordance with ${fw}${co?", including the matters stated in section 134(5) of the Act":""};`,
    "such internal control as is necessary to enable the preparation of financial statements that are free from material misstatement, whether due to fraud or error, and for the prevention and detection of fraud;",
    co ? "maintaining proper books of account as required by section 128 of the Act, using accounting software that records an audit trail (edit log) of each transaction that cannot be disabled, as required by Rule 3(1) of the Companies (Accounts) Rules, 2014, and preserving it for the period prescribed;" : "maintaining proper books of account and supporting records as required by the law applicable to the entity;",
    "compliance with the laws and regulations applicable to its business (SA 250), and informing us of any known or suspected non-compliance;",
    "identifying related parties and transactions with them, and disclosing them in accordance with the applicable framework (SA 550);",
    "assessing the ability of the entity to continue as a going concern, and disclosing matters related to going concern;",
    "informing us of any fraud or suspected fraud, and of events occurring after the balance sheet date that may affect the financial statements (SA 560); and",
    `providing us with (i) access to all information of which ${who2} are aware that is relevant to the preparation of the financial statements, such as records, documentation and other matters; (ii) additional information that we may request for the purpose of the audit; and (iii) unrestricted access to persons within ${the} from whom we determine it necessary to obtain audit evidence.`]);
  P_(`As part of our audit process, we will request from ${who2} written confirmation concerning representations made to us in connection with the audit (SA 580). The representation letter will be on ${the}'s letterhead, signed by those responsible, and dated on or close to the date of our report.`);

  H("Information, access and timetable");
  P_(`A list of the information and documents we will need is given in Annexure 1. ${tt.start ? `We plan to begin fieldwork on ${dt(tt.start)}${tt.end?` and complete it by ${dt(tt.end)}`:""}` : "We will agree the dates for fieldwork with you"}${tt.report ? `, with a target date for our report of ${dt(tt.report)}` : ""}${tt.statutory ? `. The statutory due date for the audited financial statements is ${dt(tt.statutory)}` : ""}. The timetable depends on the information being made available on time and in the form requested; delays may require the timetable to be revised and may affect our fees.`);

  H("Form and content of our reports");
  P_(`Our report will be in the form required by law and the Standards on Auditing (SA 700${x.listed?", SA 701 on key audit matters":""}, SA 705 and SA 706). The form and content of our report may need to be amended in the light of our audit findings. If we are unable to obtain sufficient appropriate audit evidence, or conclude that the financial statements are materially misstated, we will modify our opinion. If circumstances arise in which we cannot issue a report, or a modified opinion is required, we will discuss the reasons with you before issuing it.`);
  P_(`We will read the other information included in the annual report${co?", such as the Board's Report,":""} and report on it as required by SA 720. Please provide that information to us before the date of our report.`);
  P_("Every report and certificate we sign will carry a Unique Document Identification Number (UDIN) generated on the ICAI portal, which any user may verify at udin.icai.org.");

  H("Communication with those charged with governance");
  P_(`We will communicate with ${co?"the Board of Directors and, where constituted, the Audit Committee":who2} on the planned scope and timing of the audit, significant findings, and significant deficiencies in internal control, as required by SA 260 and SA 265. Such communication is not intended to cover all matters that may be of interest to you.`);

  H("Use of the work of others");
  P_(`Where relevant, we may use the work of internal auditors (SA 610), management's or our own experts (SA 620, SA 500)${co?", branch auditors under section 143(8) of the Act":""} and auditors of components (SA 600). We remain solely responsible for our opinion.`);

  if(p.first==="Yes"){ H("Initial audit engagement");
    P_(`As this is our first audit of ${the}, we will perform procedures on opening balances as required by SA 510. The comparative figures were audited by ${u(p.name)||"the predecessor auditor"}, and our report will refer to that fact as required by SA 710. As required by Clause (8) of Part I of the First Schedule to the Chartered Accountants Act, 1949, we have communicated in writing with the previous auditor before accepting this appointment.`); }

  H("Independence and other services");
  P_(co ? "We are required to remain independent of the Company. Section 144 of the Act prohibits us from rendering certain services to the Company, its holding company and subsidiaries, including accounting and book-keeping, internal audit, design and implementation of financial information systems, actuarial, investment advisory, investment banking, outsourced financial services and management services. Any other service will be the subject of a separate engagement, approved by the Board of Directors or the Audit Committee as required." : "We are required to remain independent of the entity in accordance with the Code of Ethics issued by the ICAI. Any service other than this audit will be the subject of a separate engagement.");

  H("Working papers and confidentiality");
  P_("Our working papers are the property of the firm (SA 230). They are confidential and will be retained for at least seven years from the date of our report, as required by the Standard on Quality Control. We will keep information about your affairs confidential, except where disclosure is required by law, by a regulator (including the ICAI's Peer Review Board and Quality Review Board" + (co?" and the National Financial Reporting Authority":"") + "), or by professional standards. Such disclosure will not require your further consent.");

  H("Fees and billing");
  P_(`Our fee for the audit will be **Rs. ${Number(el.fee||0).toLocaleString("en-IN")} (Rupees ${rupeeWords(el.fee)} only)**, exclusive of Goods and Services Tax at the applicable rate. ${u(el.terms) ? u(el.terms).replace(/\.?$/,".") : "Out-of-pocket expenses (travel, stay and communication) will be charged at actuals."} The fee is based on the time required by the individuals assigned to the engagement and is not contingent on the results of our work. Additional work arising from delays, changes in scope, or the condition of the records will be billed separately after discussion with you. Certification and other services not covered by this letter will be billed separately.`);

  H("Termination and continuation");
  P_(`We may withdraw from the engagement where the law, the Standards on Auditing or the Code of Ethics require it, including where a limitation is imposed on the scope of our work.${co?" Any resignation will be made in accordance with section 140(2) of the Act by filing Form ADT-3 with the Registrar.":""} This letter will remain effective for future years unless it is terminated, amended or superseded; we may issue a revised letter if the circumstances of the engagement change.`);

  H("Agreement of terms");
  P_("Please sign and return the enclosed copy of this letter to indicate that it is in accordance with your understanding of the arrangements for our audit, including our respective responsibilities. We look forward to full co-operation from your staff during the audit.");
  gap(6);
  P_(`Yours faithfully,\nFor **${u(F.name)||"[Firm name]"}**\nChartered Accountants${F.frn?`\nFirm Registration No. ${u(F.frn)}`:""}`);
  gap(26);
  P_(`**${u(ps.name)||"[Partner]"}**\nPartner${ps.mno?`\nMembership No. ${u(ps.mno)}`:""}\nPlace: ${u(F.city)||"____________"}`);
  gap(10);
  B.push({t:"hr"});
  P_(`**Acknowledged and agreed on behalf of ${u(a.clientName)}**`);
  P_(co ? "Authorised by resolution of the Board of Directors dated ____________" : "Signed by the authorised signatory");
  gap(26);
  P_("Signature: ______________________________\nName: ______________________________\nDesignation: ______________________________\nDate: ____________________      Seal / stamp:");

  // Annexures
  B.push({t:"pb"});
  h("Annexure 1 — Information and documents required for the audit");
  P_(`${u(a.clientName)} · Financial year ${a.fy}`);
  pbcItems(a).forEach(([, label], i) => li((i+1)+".", u(label)));
  li((pbcItems(a).length+1)+".", "Any other information or explanation we may request during the course of the audit.");
  gap(10);
  h("Annexure 2 — Engagement team and key dates");
  const t = A.team||{};
  li("•", `**Engagement partner:** ${u(who(t.partner))||"to be confirmed"}${ps.mno?` (M. No. ${u(ps.mno)})`:""}`);
  li("•", `**Engagement quality / file reviewer:** ${u(who(t.reviewer))||"to be confirmed"}`);
  li("•", `**Audit staff:** ${(t.staff||[]).map(id => u(who(id))).filter(Boolean).join(", ") || "to be confirmed"}`);
  li("•", `**Fieldwork:** ${tt.start?dt(tt.start):"to be agreed"}${tt.end?` to ${dt(tt.end)}`:""}`);
  li("•", `**Target report date:** ${tt.report?dt(tt.report):"to be agreed"}`);
  if(tt.statutory) li("•", `**Statutory due date:** ${dt(tt.statutory)}`);
  return {title:`Engagement letter — ${a.clientName} — FY ${a.fy}`, footer:`${a.clientName} · Audit engagement letter · FY ${a.fy}`, blocks:B};
}

function docHTML(d){
  const inl = s => esc(s).replace(/\*\*(.+?)\*\*/g, "<b>$1</b>").replace(/\n/g, "<br>");
  return d.blocks.map(b => b.t==="c" ? `<p style="text-align:center;margin:0 0 2pt;font-size:${b.size||12}pt">${b.bold?"<b>":""}${inl(b.s)}${b.bold?"</b>":""}</p>`
    : b.t==="hr" ? `<hr style="border:0;border-top:1px solid #444;margin:8pt 0">`
    : b.t==="row" ? `<table style="width:100%;border-collapse:collapse;margin:0 0 6pt"><tr><td style="padding:0">${inl(b.l)}</td><td style="padding:0;text-align:right">${inl(b.r)}</td></tr></table>`
    : b.t==="h" ? `<p style="margin:10pt 0 4pt"><b>${inl(b.s)}</b></p>`
    : b.t==="li" ? `<p style="margin:0 0 5pt 26pt;text-indent:-20pt;text-align:justify">${inl(b.n)}&nbsp;&nbsp;${inl(b.s)}</p>`
    : b.t==="gap" ? `<div style="height:${b.v}pt"></div>`
    : b.t==="pb" ? `<br clear="all" style="page-break-before:always">`
    : `<p style="margin:0 0 8pt;text-align:justify">${inl(b.s)}</p>`).join("\n");
}

// Minimal PDF writer: A4, Times-Roman / Times-Bold (standard fonts, WinAnsi), justified text, page numbers.
function makePDF(d){
  const W = 595.28, Hh = 841.89, ML = 64, MR = 64, MT = 58, MB = 62, CW = W-ML-MR;
  const fix = s => String(s).replace(/₹\s?(?=[\d(])/g, "Rs. ").replace(/₹/g, "Rs.").replace(/[‐‑]/g, "-").replace(/ /g, " ").replace(/[✓]/g, "");
  const wch = (ch, f) => { const c = ch.charCodeAt(0); if(c>=32 && c<=126) return PDFW[f][c-32]; return PDFX[f][ch] ?? 500; };
  const width = (s, f, sz) => { let w = 0; for(const ch of s) w += wch(ch, f); return w*sz/1000; };
  const enc = s => { let o = ""; for(const ch of s){ const c = ch.charCodeAt(0); if(c>=32 && c<=126) o += (ch==="("||ch===")"||ch==="\\") ? "\\"+ch : ch; else if(PDFX.code[ch]) o += String.fromCharCode(PDFX.code[ch]); else o += "?"; } return o; };
  const pages = []; let ops = null, y = 0;
  const newPage = () => { ops = []; pages.push(ops); y = Hh - MT; };
  newPage();
  const ensure = hgt => { if(y - hgt < MB) newPage(); };
  const runsOf = s => { const out = []; fix(s).split(/(\*\*[^*]+\*\*)/).forEach(part => { if(!part) return; const b = /^\*\*[^*]+\*\*$/.test(part); out.push({f: b?"B":"R", s: b ? part.slice(2,-2) : part}); }); return out; };
  // split runs into lines that fit maxW; returns array of lines, each = array of {f, s}
  const wrap = (runs, sz, maxW) => { const lines = []; let line = [], lw = 0;
    const words = []; runs.forEach(r => r.s.split(/(\n| )/).forEach(tok => { if(tok==="") return; words.push({f:r.f, s:tok}); }));
    words.forEach(wd => { if(wd.s==="\n"){ lines.push({w:line, hard:true}); line = []; lw = 0; return; }
      if(wd.s===" "){ if(line.length) { line.push(wd); lw += width(" ", wd.f, sz); } return; }
      const ww = width(wd.s, wd.f, sz);
      if(lw + ww > maxW && line.length){ while(line.length && line[line.length-1].s===" ") line.pop(); lines.push({w:line, hard:false}); line = []; lw = 0; }
      line.push(wd); lw += ww; });
    while(line.length && line[line.length-1].s===" ") line.pop(); lines.push({w:line, hard:true}); return lines; };
  const drawLine = (ln, x, sz, maxW, justify, center) => { const segs = []; ln.w.forEach(wd => { const last = segs[segs.length-1]; if(last && last.f===wd.f) last.s += wd.s; else segs.push({f:wd.f, s:wd.s}); });
    const nat = segs.reduce((t,sg) => t + width(sg.s, sg.f, sz), 0); const spaces = segs.reduce((t,sg) => t + (sg.s.match(/ /g)||[]).length, 0);
    const tw = justify && spaces ? Math.min((maxW - nat)/spaces, 6) : 0;
    const x0 = center ? x + Math.max(0, (maxW - nat)/2) : x;
    let o = `BT ${tw.toFixed(3)} Tw ${x0.toFixed(2)} ${y.toFixed(2)} Td `; segs.forEach(sg => { o += `/F${sg.f==="B"?2:1} ${sz} Tf (${enc(sg.s)}) Tj `; }); o += "ET"; ops.push(o); };
  const para = (s, {sz=11, lead=14.6, indent=0, label=null, after=6, justify=true, keep=0, center=false}={}) => {
    const lines = wrap(runsOf(s), sz, CW - indent); ensure(lead*Math.min(lines.length, keep||1));
    lines.forEach((ln, i) => { ensure(lead); y -= lead - 3;
      if(i===0 && label!==null){ const lb = fix(label); ops.push(`BT 0 Tw ${(ML+indent-20).toFixed(2)} ${y.toFixed(2)} Td /F1 ${sz} Tf (${enc(lb)}) Tj ET`); }
      drawLine(ln, ML+indent, sz, CW-indent, justify && !ln.hard && !center, center); y -= 3; });
    y -= after; };
  const table = b => { const sz = 9.5, lead = 12, pad = 3.5; const nc = Math.max(0, ...b.rows.map(r => r.length)); if(!nc) return;
    const nat = Array(nc).fill(1), mn = Array(nc).fill(1);
    b.rows.forEach((r, ri) => r.forEach((cs, ci) => { const f = ri < b.head ? "B" : "R"; const t = fix(cs).replace(/\*\*/g,"");
      t.split("\n").forEach(l => { nat[ci] = Math.max(nat[ci], width(l, f, sz)*1.04); }); t.split(/\s+/).forEach(w => { mn[ci] = Math.max(mn[ci], width(w, f, sz)*1.04); }); }));
    const avail = CW - nc*2*pad; const sN = nat.reduce((p,q)=>p+q,0), sM = mn.reduce((p,q)=>p+q,0); let ws;
    if(sN <= avail) ws = nat.map(v => v + (avail - sN) * v / sN); else if(sM >= avail) ws = mn.map(v => v * avail / sM); else ws = mn.map((v,i) => v + (avail - sM) * (nat[i] - v) / (sN - sM));
    const heads = b.rows.slice(0, b.head);
    const paint = (r, hdr) => { const ls = r.map((cs, ci) => wrap(hdr ? [{f:"B", s: fix(cs).replace(/\*\*/g,"")}] : runsOf(cs), sz, ws[ci]));
      const hgt = Math.max(1, ...ls.map(l => l.length)) * lead + 2*pad;
      if(y - hgt < MB){ newPage(); if(!hdr) heads.forEach(h => paint(h, true)); }
      const top = y; let x = ML;
      if(hdr) ops.push(`0.92 g ${ML.toFixed(2)} ${(top-hgt).toFixed(2)} ${CW.toFixed(2)} ${hgt.toFixed(2)} re f 0 g`);
      ws.forEach((w, ci) => { const cw = w + 2*pad; (ls[ci]||[]).forEach((ln, k) => { y = top - pad - (k+1)*lead + 3; drawLine(ln, x + pad, sz, w, false, false); });
        ops.push(`0.5 w 0.35 G ${x.toFixed(2)} ${(top-hgt).toFixed(2)} ${cw.toFixed(2)} ${hgt.toFixed(2)} re S 0 G`); x += cw; });
      y = top - hgt; };
    ensure(40); y -= 4; b.rows.forEach((r, ri) => paint(r, ri < b.head)); y -= 10; };
  d.blocks.forEach(b => {
    if(b.t==="c" && width(fix(b.s), b.bold?"B":"R", b.size||11) > CW){ para(b.bold ? "**"+b.s+"**" : b.s, {sz:b.size||11, lead:(b.size||11)*1.32, justify:false, center:true, after:2}); }
    else if(b.t==="tbl") table(b);
    else if(b.t==="c"){ const sz = b.size||11; const s = fix(b.s); const f = b.bold?"B":"R"; ensure(sz*1.4); y -= sz*1.25; ops.push(`BT 0 Tw ${((W - width(s,f,sz))/2).toFixed(2)} ${y.toFixed(2)} Td /F${f==="B"?2:1} ${sz} Tf (${enc(s)}) Tj ET`); y -= 2; }
    else if(b.t==="hr"){ ensure(14); y -= 6; ops.push(`0.4 w 0.25 G ${ML} ${y.toFixed(2)} m ${W-MR} ${y.toFixed(2)} l S 0 G`); y -= 8; }
    else if(b.t==="row"){ ensure(16); y -= 13; const l = fix(b.l), r = fix(b.r); ops.push(`BT 0 Tw ${ML} ${y.toFixed(2)} Td /F1 11 Tf (${enc(l)}) Tj ET`); ops.push(`BT ${(W-MR-width(r,"R",11)).toFixed(2)} ${y.toFixed(2)} Td /F1 11 Tf (${enc(r)}) Tj ET`); y -= 6; }
    else if(b.t==="h"){ ensure(60); y -= 5; para("**"+b.s+"**", {sz:11.5, after:2, justify:false}); }
    else if(b.t==="li") para(b.s, {indent:26, label:b.n, after:4});
    else if(b.t==="gap"){ y -= b.v; if(y < MB) newPage(); }
    else if(b.t==="pb") newPage();
    else para(b.s, {after:7, keep:2});
  });
  const N = pages.length; const foot = fix(d.footer||"");
  pages.forEach((pg, i) => { const pn = `Page ${i+1} of ${N}`; pg.push(`0.35 g BT 0 Tw ${ML} 34 Td /F1 8.5 Tf (${enc(foot)}) Tj ET BT ${(W-MR-width(pn,"R",8.5)).toFixed(2)} 34 Td /F1 8.5 Tf (${enc(pn)}) Tj ET 0 g`); });
  // assemble
  const objs = []; const add = s => { objs.push(s); return objs.length; };
  const cat = add(null), pagesId = add(null), f1 = add("<< /Type /Font /Subtype /Type1 /BaseFont /Times-Roman /Encoding /WinAnsiEncoding >>"), f2 = add("<< /Type /Font /Subtype /Type1 /BaseFont /Times-Bold /Encoding /WinAnsiEncoding >>");
  const kids = pages.map(pg => { const content = pg.join("\n"); const cs = add(`<< /Length ${content.length} >>\nstream\n${content}\nendstream`);
    return add(`<< /Type /Page /Parent ${pagesId} 0 R /MediaBox [0 0 ${W} ${Hh}] /Resources << /Font << /F1 ${f1} 0 R /F2 ${f2} 0 R >> >> /Contents ${cs} 0 R >>`); });
  objs[cat-1] = `<< /Type /Catalog /Pages ${pagesId} 0 R >>`; objs[pagesId-1] = `<< /Type /Pages /Kids [${kids.map(k=>k+" 0 R").join(" ")}] /Count ${kids.length} >>`;
  const info = add(`<< /Title (${enc(fix(d.title||""))}) /Producer (TickTrail) >>`);
  let out = "%PDF-1.4\n%\xE2\xE3\xCF\xD3\n"; const offs = [];
  objs.forEach((o, i) => { offs.push(out.length); out += `${i+1} 0 obj\n${o}\nendobj\n`; });
  const xref = out.length; out += `xref\n0 ${objs.length+1}\n0000000000 65535 f \n` + offs.map(o => String(o).padStart(10,"0")+" 00000 n \n").join("");
  out += `trailer\n<< /Size ${objs.length+1} /Root ${cat} 0 R /Info ${info} 0 R >>\nstartxref\n${xref}\n%%EOF`;
  const bytes = new Uint8Array(out.length); for(let i=0;i<out.length;i++) bytes[i] = out.charCodeAt(i) & 255;
  return new Blob([bytes], {type:"application/pdf"});

function htmlToBlocks(html){
  const root = new DOMParser().parseFromString(`<body>${html}</body>`, "text/html").body; const B = [];
  const SKIP = ["SCRIPT","STYLE","BUTTON","INPUT","SELECT","TEXTAREA","IMG"];
  const inl = (node, bold) => { let s = ""; node.childNodes.forEach(n => { if(n.nodeType===3){ s += n.nodeValue.replace(/\s+/g," "); return; } if(n.nodeType!==1 || SKIP.includes(n.tagName)) return;
      const tg = n.tagName; if(tg==="BR"){ s += "\n"; return; }
      if(tg==="B" || tg==="STRONG" || tg==="TH" || /^H[1-6]$/.test(tg)){ const inner = inl(n, true); if(bold){ s += inner; return; } const fs = (n.getAttribute("style")||"").match(/font-size:\s*([\d.]+)pt/);
        s += fs ? `\u0001${fs[1]}|${inner}\u0002` : (inner.trim() ? `**${inner}**` : inner); return; }
      s += inl(n, bold); }); return s; };
  const clean = s => s.split("\n").map(l => l.replace(/\s+/g," ").trim()).join("\n").replace(/^\n+|\n+$/g,"");
  const plain = s => s.replace(/\u0001[\d.]+\|([^\u0002]*)\u0002/g, "**$1**").replace(/\*\*\s*\*\*/g, "");
  const walk = el => el.childNodes.forEach(n => {
    if(n.nodeType===3){ const t = n.nodeValue.replace(/\s+/g," ").trim(); if(t) B.push({t:"p", s:t}); return; } if(n.nodeType!==1 || SKIP.includes(n.tagName)) return;
    const tg = n.tagName; const st = n.getAttribute("style")||"";
    if(/page-break-before:\s*always/.test(st)){ B.push({t:"pb"}); if(tg==="BR") return; }
    if(tg==="HR"){ B.push({t:"hr"}); return; }
    if(tg==="BR"){ B.push({t:"gap", v:6}); return; }
    if(tg==="TABLE"){ const rows = [...n.querySelectorAll("tr")].map(tr => [...tr.children].filter(c => c.tagName==="TD" || c.tagName==="TH").map(c => ({s: clean(plain(inl(c, c.tagName==="TH"))), h: c.tagName==="TH"})));
      if(!rows.length) return; let head = rows.findIndex(r => !r.every(c => c.h)); if(head<0) head = 0; B.push({t:"tbl", rows: rows.map(r => r.map(c => c.s)), head}); return; }
    if(tg==="OL" || tg==="UL"){ [...n.children].filter(c => c.tagName==="LI").forEach((li, i) => B.push({t:"li", n: tg==="OL" ? `${i+1}.` : "•", s: clean(plain(inl(li)))})); return; }
    if(/^H[1-6]$/.test(tg)){ B.push({t:"h", s: clean(plain(inl(n, true)))}); return; }
    if([...n.children].some(c => ["P","TABLE","OL","UL","DIV","HR","H1","H2","H3","SECTION"].includes(c.tagName))){ walk(n); return; }
    const raw = clean(inl(n)); if(!raw) return;
    if(/text-align:\s*center/.test(st) || n.getAttribute("align")==="center"){ raw.split("\n").forEach(l => { const m = l.match(/^\u0001([\d.]+)\|(.*)\u0002$/);
      if(m) B.push({t:"c", s: m[2].replace(/\*\*/g,""), size: Math.min(+m[1], 18), bold:true}); else { const q = plain(l); B.push({t:"c", s: q.replace(/\*\*/g,""), size:11, bold: /^\*\*.*\*\*$/.test(q)}); } }); return; }
    B.push({t:"p", s: plain(raw)});
  });
  walk(root); return B;
}

    const reg = (P.risks||[]).find(r => (r.area||"").toLowerCase().split(/[^a-z]+/).some(w => w.length>4 && area.toLowerCase().includes(w)));
    return {id, area, as, lvl: s.lvl || reg?.lvl || lvl, timing: s.timing || timing, ext: s.ext || "", proc: s.proc ?? proc.map(p => "• " + p).join("\n"), uid: s.uid || "", inc: s.inc || "Included", reg: reg?.area || ""}; }); }

const GC = ["No material uncertainty","Material uncertainty – adequately disclosed","Material uncertainty – not adequately disclosed","Going concern basis is inappropriate"];
const OPIN = ["Unmodified","Qualified","Adverse","Disclaimer of opinion"];
function REPORTS(a){
  const c = clientOf(a.clientId)||{}; const out = [];
  (a.applic||[]).filter(r => r.key?.startsWith("rep_")).forEach(r => out.push({key: r.key.slice(4), label: r.label + " — " + (r.short||"")}));
  if(!out.length) out.push({key:"stat", label:"Audit report"});

function setRep(path, value, now){
  const a = S.audits.find(x=>x.id===S.auditId); if(!a) return;
  if(a.status==="Signed off"){ toast("This file is signed off and locked."); return; }
  if(a.rep?.issued && path!=="issued"){ toast("Reports are marked issued and locked. An admin can withdraw this to make changes."); render(); return; }
  const parts = path.split("."); const patch = {}; let o = patch; parts.slice(0,-1).forEach(k => o = o[k] = {}); o[parts.at(-1)] = value;
  const merge = (t,src) => { Object.entries(src).forEach(([k,v]) => { if(v && typeof v==="object" && !Array.isArray(v)){ t[k] = {...(t[k]||{})}; merge(t[k], v); } else t[k] = v; }); };
  a.rep = {...(a.rep||{})}; merge(a.rep, patch);
  if(path!=="issued") ensureTimer();
  const doWrite = () => { logEv("rep", path, Array.isArray(value) ? `${value.length} item(s)` : value); return write("audits/"+a.id, r => r.update({rep: patch, updatedAt: Date.now()})).then(saveState); };
  clearTimeout(noteTimers["rp:"+path]);
  if(now) doWrite(); else noteTimers["rp:"+path] = setTimeout(doWrite, 600);
}
function setMis(i, field, value, now){ const a = S.audits.find(x=>x.id===S.auditId); const ms = (a.rep?.mis||[]).map(x=>({...x})); if(!ms[i]) return; ms[i][field] = value; setRep("mis", ms, now); }
function misTotals(a){ const ms = a.rep?.mis||[]; const unc = ms.filter(m => m.corr!=="Yes").reduce((n,m)=>n+Math.abs(Number(m.amt)||0),0); const cor = ms.filter(m => m.corr==="Yes").reduce((n,m)=>n+Math.abs(Number(m.amt)||0),0); return {unc, cor, om: matCalc(a.plan?.mat||{}).om}; }
function opinionHint(a){
  const R = a.rep||{}; const t = misTotals(a); const hints = [];
  if(t.om && t.unc >= t.om) hints.push(`Uncorrected misstatements of ${inr(t.unc)} are at or above overall materiality of ${inr(t.om)}: consider a qualified or adverse opinion.`);
  else if(t.om && t.unc >= t.om*0.5) hints.push(`Uncorrected misstatements of ${inr(t.unc)} are over half of materiality (${inr(t.om)}): consider them carefully, including qualitative factors.`);
  if(R.gc?.concl===GC[1]) hints.push("Going concern: add a 'Material uncertainty related to going concern' paragraph (SA 570). The opinion itself can remain unmodified.");
  if(R.gc?.concl===GC[2]) hints.push("Going concern uncertainty not adequately disclosed: the opinion should be qualified or adverse (SA 570).");
  if(R.gc?.concl===GC[3]) hints.push("Going concern basis inappropriate: the opinion should be adverse (SA 570).");
  const ex = []; applicable(a.scope||{}).forEach(m => m.items.forEach(it => { if(a.results?.[it.id]?.s==="X" && it.risk==="H") ex.push(it.id); }));
  if(ex.length) hints.push(`${ex.length} high-risk exception${ex.length>1?"s":""} in the programme (${ex.slice(0,5).join(", ")}${ex.length>5?"…":""}): consider whether any affects the opinion or must be reported under CARO / s.143.`);
  return hints;
}

const CARO_R = {fav:"Favourable (standard wording)", adv:"Adverse / qualified — give details", na:"Not applicable"};
// Applicability worked out from the client's profile (cannot conflict with the user's own answer; it only fills an unanswered clause)
function caroAuto(a, id){ const c = clientOf(a.clientId)||{}; const x = ctxOf(c); const sc = a.scope||{}; const f = a.figures||{};
  const noInv = !["Manufacturing","Trading"].includes(c.activity);
  if((id==="ii_a") && noInv) return {r:"na", why:"No inventory: the client's activity is " + (c.activity||"services") + "."};
  if(id==="ii_b" && Number(f.maxBankBorr||0) < 5e7) return {r:"na", why:"Highest bank borrowing for the year is below ₹5 crore."};
  if(id==="xii") return {r:"na", why:"The client is not recorded as a Nidhi company."};
  if(id.startsWith("xvi_") && x.special!=="NBFC") return {r:"fav", why:"The client is not recorded as an NBFC; standard wording applies."};
  if(id.startsWith("xx_") && !sc.csr) return {r:"na", why:"CSR (s.135) does not apply on the client's figures."};
  if(id==="xxi") return {r:"na", why:"Standalone financial statements."};
  if(id==="x_a" && !x.listed) return {r:"na", why:"Unlisted company: no public offer recorded."};
  return null; }
function caroState(a, id){ const s = a.rep?.caro?.[id]||{}; const au = caroAuto(a, id); return {r: s.r || au?.r || "", auto: !s.r && !!au, why: au?.why||"", d: s.d||"", rows: s.rows||[]}; }
function caroGaps(a){ return CARO_CL.filter(([id]) => { const s = caroState(a, id); if(!s.r) return true; if(s.r==="adv") return !((s.d||"").trim().length>=10 || s.rows.some(r => r.some(v => String(v||"").trim()))); return false; }); }
function caroText(a, cl){ const [id, num, , , fav, adv, na, cols] = cl; const s = caroState(a, id);
  if(s.r==="fav") return {p: fav + (s.d ? " " + s.d : "")};
  if(s.r==="na") return {p: s.d && na==="Not applicable." ? s.d : na};
  if(s.r==="adv") return {p: adv + (s.d ? " " + s.d : ""), cols, rows: (s.rows||[]).filter(r => r.some(v => String(v||"").trim()))};
  return {p: "[Reporting on this clause has not been completed.]"}; }

function evalAccess(){
  const me = S.me; const admin = me.isOwner || me.canEdit; const m = S.members[me.id];
  if(admin){
    if((!m || m.status!=="active" || m.role!=="admin") && !S._selfWrote){ S._selfWrote = true; write("members/"+me.id, r => r.set({status:"active", role:"admin", since: m?.since || Date.now(), designation: m?.designation || (me.isOwner?"Owner":"Admin")})); }
    S.role = "admin"; grant();
  } else if(m && m.status==="active"){ S.role = m.role==="reviewer" ? "reviewer" : "staff"; grant(); }
  else {
    revoke(); S.role = null;
    if(m && m.status==="disabled") S.gate = "disabled";
    else {
      if(!S._reqSub){ S._reqSub = S.db.doc("requests/"+me.id).onSnapshot(sn => { S.myReq = sn.exists ? sn.data() : null; S.loaded.req = true; if(!S.granted && S.gate!=="disabled"){ S.gate = S.myReq ? "waiting" : "request"; render(); } }, () => { S.gate = "request"; render(); }); }
      S.gate = S.loaded.req ? (S.myReq ? "waiting" : "request") : "checking";
    }
  }
  updateSide(); if(!S.granted || S.view==="team") render();
}

// ---------- time ----------
const fmtH = ms => { const m = Math.round(ms/60000); return `${Math.floor(m/60)}:${String(m%60).padStart(2,"0")}`; };
function durOf(t){ if(t.manual) return (t.mins||0)*60000; const stale = !t.end && Date.now()-(t.last||t.start) > IDLE + 5*60000; return Math.max(0, (t.end || (stale ? t.last : Date.now())) - t.start); }
function mySession(){ return (S.time||[]).find(t => t.uid===S.me?.id && !t.manual && !t.end && Date.now()-(t.last||t.start) <= IDLE + 5*60000); }
function watchTime(aid){
  if(S._timeFor===aid) return; if(S._timeUnsub){ S._timeUnsub(); } S.time = []; S._timeFor = aid;
  if(S._logUnsub) S._logUnsub(); S.logDocs = {};
  S._logUnsub = S.db.collection(`audits/${aid}/log`).onSnapshot(sn => { S.logDocs = Object.fromEntries(sn.docs.map(d => [d.id, d.data()])); if(S.view==="audit" && S.stage==="rec") rerender(); }, e => console.error(e));
  S._timeUnsub = S.db.collection(`audits/${aid}/time`).onSnapshot(sn => {
    S.time = sn.docs.map(d => ({id:d.id, ...d.data()}));
    S.time.filter(t => t.uid===S.me.id && !t.manual && !t.end && Date.now()-(t.last||t.start) > IDLE + 5*60000).forEach(t => { t.end = t.last; write(`audits/${aid}/time/${t.id}`, r => r.update({end: t.last})); });
    drawTimer();
  }, e => console.error(e));
}

function timePanel(){

function addManualTime(){

  const id = uid(); const doc = {uid:S.me.id, start: new Date(d+"T09:00:00").getTime(), mins, manual:true, reason, addedAt: Date.now()};
  S.time.push({id, ...doc}); write(`audits/${S.auditId}/time/${id}`, r => r.set(doc)); logEv("time", d, `${fmtH(mins*60000)} · ${reason}`); toast("Time added"); timePanel();

function signoffGaps(a){
  const r = a.results||{}; const g = {pend:0, notes:0, incomplete:0, unrev:0};
  applicable(a.scope||{}).forEach(m => m.items.forEach(it => { const x = r[it.id]||{};
    if(!x.s){ g.pend++; return; }
    if((x.s==="X"||x.s==="N") && (x.note||"").trim().length<10) g.notes++;
    if(x.s==="Y" && !reqMet(it, x).ok) g.incomplete++;
    if(!x.rv) g.unrev++; }));
  return g;
}
function changeStatus(sel){
  const a = S.audits.find(x=>x.id===S.auditId); const to = sel.value, from = a.status||"In progress";
  const back = msg => { sel.value = from; if(msg) toast(msg); };
  if(from==="Signed off" && !isAdmin()) return back("Only an admin can reopen a signed-off file.");
  if(to==="Signed off"){
    if(!isReviewer()) return back("Only a reviewer or admin can sign off.");
    flushPending(); const g = signoffGaps(a);
    if(a.flow && !TM() && !a.rep?.issued){ back(); panel(`<h2>Not ready to sign off</h2><p>The reports must be marked as issued in <b>5 · Reporting</b> first, with the UDIN and the signed copy of each report recorded.</p><div class="foot"><span></span><button class="btn primary" data-close="1">Close</button></div>`); return; }
    const parts = [g.pend&&`${g.pend} point${g.pend>1?"s":""} not marked`, g.incomplete&&`${g.incomplete} Done point${g.incomplete>1?"s":""} with incomplete steps or evidence`, g.notes&&`${g.notes} exception / N.A. point${g.notes>1?"s":""} without a note`, g.unrev&&`${g.unrev} point${g.unrev>1?"s":""} not reviewed`].filter(Boolean);
    if(parts.length && !TM()){ back(); panel(`<h2>Not ready to sign off</h2><p>Every applicable point must be marked, supported and reviewed before the file can be signed off.</p><ul class="gaps">${parts.map(p=>`<li>${esc(p)}</li>`).join("")}</ul><p class="muted">Use the Pending filter to find unmarked points.</p><div class="foot"><span></span><button class="btn primary" data-close="1">Close</button></div>`); return; }
    stopTimer(); const per = timeSummary(); const mins = {}; Object.keys(per).forEach(k => mins[k] = Math.round(per[k]/60000));
    const totalMins = Object.values(mins).reduce((n,v)=>n+v,0);
    Object.assign(a, {status:to, signedBy:S.me.id, signedAt:Date.now(), timeSummary:mins, totalMins}); logEv("status", "", `${from} → Signed off`);
    write("audits/"+a.id, r => r.update({status:to, signedBy:S.me.id, signedAt:a.signedAt, timeSummary:mins, totalMins, updatedAt:Date.now()}));
    toast("Signed off. Time recorded: " + fmtH(totalMins*60000)); render(); timePanel(); return;
  }
  if(from==="Signed off" && recLocked(a)) return back("This file has been assembled and locked under SA 230. Record an amendment in 6 · Records instead.");
  a.status = to; logEv("status", "", `${from} → ${to}`); write("audits/"+a.id, r => r.update({status:to, updatedAt:Date.now()})); toast("Status: "+to); render();
}

  S.auth = me.auth || {}; unlock(true); return;
  db.doc("auth/"+me.id).onSnapshot(sn => { S.auth = sn.exists ? sn.data() : null; S.loaded.auth = true;
    if(!S.unlocked){ if(sessionOk()) unlock(true); else { const g = S.auth ? "login" : "setpw"; if(S.gate!==g){ S.gate = g; render(); } } }
  }, () => { S.gate = "setpw"; render(); });

// ---- login ----
const SESS_KEY = () => "acr-unlocked:" + S.me.id;
function sessionOk(){ try{ const t = Number(sessionStorage.getItem(SESS_KEY())||0); return S.auth && t && Date.now()-t < IDLE; }catch(e){ return false; } }
function touchSession(){ if(!S.unlocked) return; try{ sessionStorage.setItem(SESS_KEY(), String(Date.now())); }catch(e){} }
function unlock(silent){
  S.unlocked = true; touchSession(); S.gate = "checking"; render(); updateSide();
  if(!S._memSub){ const err = e => { console.error(e); if(e?.code==="revoked"){ S.noDb=true; render(); } else loadFail(e); };
    S._memSub = S.db.collection("members").onSnapshot(s => { try{ S.members = Object.fromEntries(s.docs.map(d => [d.id, {...d.data()}])); if(S.unlocked) evalAccess(); }catch(e){ loadFail(e); } }, err); }
  else evalAccess();
  if(!silent) toast("Logged in");
}
function logout(reason){
  if(!S.unlocked) return;
  S.unlocked = false; stopTimer();
  const go = () => { location.href = "/logout" + (reason ? "?r=" + encodeURIComponent(reason) : ""); };
  Promise.race([flushPending().catch(()=>{}), new Promise(r => setTimeout(r, 4000))]).then(go, go);
  return;
  stopTimer(); flushPending(); revoke(); S.unlocked = false; S.role = null;
  try{ sessionStorage.removeItem(SESS_KEY()); }catch(e){}
  S.gate = S.auth ? "login" : "setpw"; S._loginMsg = reason || ""; S._loginInfo = true; closePanel(); updateSide(); render();
}
const b64 = buf => btoa(String.fromCharCode(...new Uint8Array(buf)));
const unb64 = str => Uint8Array.from(atob(str), c => c.charCodeAt(0));
async function hashPw(pw, saltB64){
  const salt = saltB64 ? unb64(saltB64) : crypto.getRandomValues(new Uint8Array(16));
  const key = await crypto.subtle.importKey("raw", new TextEncoder().encode(pw), "PBKDF2", false, ["deriveBits"]);
  const bits = await crypto.subtle.deriveBits({name:"PBKDF2", hash:"SHA-256", salt, iterations:150000}, key, 256);
  return {hash: b64(bits), salt: b64(salt)};
}
async function doLogin(){
  const pw = $("#lgPw").value; const btn = $("#lgBtn");
  const a = S.auth || {};
  if(a.lockUntil && Date.now() < a.lockUntil){ loginMsg(`Too many wrong attempts. Try again after ${new Date(a.lockUntil).toLocaleTimeString("en-IN",{hour:"2-digit",minute:"2-digit"})}, or ask an admin to reset your password.`); return; }
  if(!pw){ loginMsg("Enter your password."); return; }
  btn.disabled = true; btn.textContent = "Checking…";
  try{
    const h = await hashPw(pw, a.salt);
    if(h.hash === a.hash){ const prev = a.lastLogin; write("auth/"+S.me.id, r => r.update({fails:0, lockUntil:0, lastLogin: Date.now(), prevLogin: prev||null})); unlock(); }
    else { const fails = (a.fails||0) + 1; const lock = fails >= 5 ? Date.now() + 15*60000 : 0;
      write("auth/"+S.me.id, r => r.update({fails: lock ? 0 : fails, lockUntil: lock}));
      loginMsg(lock ? "Five wrong attempts. Login is locked for 15 minutes." : `Wrong password. ${5-fails} attempt${5-fails===1?"":"s"} left before a 15-minute lock.`);
      btn.disabled = false; btn.textContent = "Log in"; $("#lgPw").select(); }
  }catch(e){ console.error(e); loginMsg("Could not check the password in this browser."); btn.disabled = false; btn.textContent = "Log in"; }
}
async function doSetPw(){
  const p1 = $("#spPw").value, p2 = $("#spPw2").value;
  if(p1.length < 8 || !/[A-Za-z]/.test(p1) || !/\d/.test(p1)){ loginMsg("Use at least 8 characters with letters and numbers."); return; }
  if(p1 !== p2){ loginMsg("The two passwords do not match."); return; }
  const btn = $("#spBtn"); btn.disabled = true; btn.textContent = "Saving…";
  try{ const h = await hashPw(p1); await write("auth/"+S.me.id, r => r.set({hash:h.hash, salt:h.salt, setAt: Date.now(), fails:0, lockUntil:0}));
    S.auth = {hash:h.hash, salt:h.salt}; unlock(); toast("Password set"); }
  catch(e){ console.error(e); loginMsg("Could not save the password."); btn.disabled = false; btn.textContent = "Set password and continue"; }
}

    return;
    if(n1.length < 8 || !/[A-Za-z]/.test(n1) || !/\d/.test(n1)){ toast("Use at least 8 characters with letters and numbers."); return; }
    if(n1 !== n2){ toast("The new passwords do not match."); return; }
    const h = await hashPw(n1); write("auth/"+S.me.id, r => r.update({hash:h.hash, salt:h.salt, setAt:Date.now()})); S.auth = {...S.auth, hash:h.hash, salt:h.salt, setAt:Date.now()};

function loginMsg(t){ S._loginMsg = t; S._loginInfo = false; $("#lgMsg")?.classList.remove("info"); const el = $("#lgMsg"); if(el){ el.textContent = t; el.hidden = !t; } }

function loadFail(e){
