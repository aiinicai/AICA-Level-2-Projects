{% extends "base.html" %}{% block title %}Plant{% endblock %}
{% block content %}{% include "admin/_nav.html" %}
<h1>{{ 'Edit plant' if p else 'New plant' }}</h1>
{% if errors %}<ul class="errors">{% for e in errors %}<li>{{ e }}</li>{% endfor %}</ul>{% endif %}
<form method="post" class="card"><input type="hidden" name="_csrf" value="{{ csrf_token() }}"><div class="grid g2">
<div><label class="req">Plant code</label><input name="code" value="{{ data.get('code') or '' }}"></div>
<div><label class="req">Company name</label><input name="company_name" value="{{ data.get('company_name') or '' }}"></div>
<div style="grid-column:1/-1"><label class="req">Address</label><textarea name="address">{{ data.get('address') or '' }}</textarea></div>
<div><label class="req">GSTIN (state is taken from it)</label><input name="gstin" maxlength="15" value="{{ data.get('gstin') or '' }}"></div>
<div><label class="req">PIN</label><input name="pin" maxlength="6" value="{{ data.get('pin') or '' }}"></div>
<div><label>Phone</label><input name="phone" value="{{ data.get('phone') or '' }}"></div><div><label>Email</label><input name="email" value="{{ data.get('email') or '' }}"></div>
<div><label>Authorised signatory (printed)</label><input name="signatory" value="{{ data.get('signatory') or 'Authorised Signatory' }}"></div>
<div><label>Active</label><select name="active"><option value="1" {{ 'selected' if not p or p.active }}>Yes</option><option value="" {{ 'selected' if p and not p.active }}>No</option></select></div></div>
<p><button>Save</button></p></form>{% endblock %}
