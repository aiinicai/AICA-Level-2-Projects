{% extends "base.html" %}{% block title %}Audit{% endblock %}
{% block content %}{% include "admin/_nav.html" %}
<h1>Audit log</h1>
<form class="bar" method="get"><div><label>Entity</label><select name="entity"><option value="">All</option>{% for e in ('challan','vendor','user','plant','series','upload') %}<option {{ 'selected' if a.get('entity')==e }}>{{ e }}</option>{% endfor %}</select></div>
<div><label>User</label><input name="username" value="{{ a.get('username','') }}"></div><div><label>Reference</label><input name="ref" value="{{ a.get('ref','') }}"></div><div><button>Filter</button></div></form>
<table><tr><th>When</th><th>User</th><th>Entity</th><th>Ref</th><th>Action</th><th>Details</th></tr>
{% for r in rows %}<tr><td>{{ r.ts|dmyhm }}</td><td>{{ r.username }}</td><td>{{ r.entity }}</td><td>{{ r.ref }}</td><td>{{ r.action }}</td><td>{{ r.details }}</td></tr>{% endfor %}</table>{% endblock %}
