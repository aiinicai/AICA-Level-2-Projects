{% extends "base.html" %}{% block title %}Reports{% endblock %}
{% block content %}<h1>Reports</h1>
<div class="grid g3">{% for key, title, desc in catalog %}<div class="card"><h2 style="margin-top:0"><a href="{{ url_for('reports.show', name=key) }}">{{ title }}</a></h2><p class="muted">{{ desc }}</p>
<a class="btn sec" href="{{ url_for('reports.show', name=key, export='xlsx') }}">Excel</a></div>{% endfor %}</div>{% endblock %}
