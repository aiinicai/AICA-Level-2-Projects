{% extends "base.html" %}{% block title %}Change password{% endblock %}
{% block content %}
<div class="card login"><h1>Change password</h1>
{% if current_user.must_change_password %}<p class="muted">You must set a new password before continuing.</p>{% endif %}
<form method="post"><input type="hidden" name="_csrf" value="{{ csrf_token() }}">
<label class="req">Current password</label><input type="password" name="current">
<label class="req" style="margin-top:8px">New password (min 8 characters)</label><input type="password" name="new">
<label class="req" style="margin-top:8px">Repeat new password</label><input type="password" name="new2">
<p><button>Save</button></p></form></div>
{% endblock %}
