{% extends "base.html" %}{% block title %}Login{% endblock %}
{% block content %}
<div class="card login"><h1>Sign in</h1>
<form method="post"><input type="hidden" name="_csrf" value="{{ csrf_token() }}">
<label class="req">Username</label><input name="username" autofocus autocomplete="username">
<label class="req" style="margin-top:8px">Password</label><input type="password" name="password" autocomplete="current-password">
<p><button>Login</button></p></form></div>
{% endblock %}
