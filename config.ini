; ============================================================
;  EQUITY PORTFOLIO REPORT - DEFAULT SETTINGS   (version 3)
;  You normally do not need to edit this file: everything is
;  entered in the app. Values here are only the starting defaults.
; ============================================================
[SETTINGS]

; AI provider: anthropic (Claude), openai (ChatGPT) or gemini (Google).
; Normally chosen in the app; the app also detects it from the key.
AI_PROVIDER =
; API key and model (normally entered / chosen in the app)
ANTHROPIC_API_KEY =
AI_MODEL =

; Folder to save reports in (normally chosen in the app)
OUTPUT_FOLDER =

; Name of your holdings file kept in this same folder
; (.xlsx, .xls or .csv - any broker's format).
; If this file is not found, the program lists the files in the
; folder and lets you pick one.
PORTFOLIO_FILE = portfolio.xlsx

; Default Name of Entity. You are asked for it at every run;
; whatever is written here is offered as the default (press Enter).
ENTITY_NAME =

; Web research and highlights: yes / no
AI_RESEARCH = yes

; Read key ratios / promoter holding from Screener.in: yes / no
SCREENER_DATA = yes

; Detailed analysis (own page, Screener, web research) only for holdings
; whose invested value is at least this % of the portfolio. 0 = all.
DETAIL_MIN_PERCENT = 1

; Web searches allowed per stock (more = deeper, slower, costlier)
MAX_WEB_SEARCHES_PER_STOCK = 6

; Research is saved and reused for the same stock + valuation date.
; Set to yes to force fresh research.
REFRESH_RESEARCH = no

; Benchmark for comparison (Yahoo symbol)
; ^NSEI = NIFTY 50, ^BSESN = SENSEX, ^CRSLDX = NIFTY 500
BENCHMARK_SYMBOL = ^NSEI
BENCHMARK_NAME = NIFTY 50


[COLUMNS]
; Normally leave these blank - the program finds the columns itself.
; Fill only if your broker uses unusual column headings.
; Write the heading exactly as it appears in your file.
name =
symbol =
isin =
qty =
avg_cost =
total_cost =
