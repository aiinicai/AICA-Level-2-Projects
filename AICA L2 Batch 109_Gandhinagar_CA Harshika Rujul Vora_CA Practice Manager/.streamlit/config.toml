[theme]
base = "light"
primaryColor = "#0D9488"
backgroundColor = "#F4F6FA"
secondaryBackgroundColor = "#FFFFFF"
textColor = "#0F172A"
linkColor = "#0D9488"
baseRadius = "0.65rem"
borderColor = "#E2E8F0"
showWidgetBorder = true
showSidebarBorder = false
chartCategoricalColors = ["#0B1F3A", "#0D9488", "#F59E0B", "#6366F1", "#E11D48", "#64748B"]

[theme.sidebar]
backgroundColor = "#0B1F3A"
secondaryBackgroundColor = "#132B4D"
textColor = "#CBD5E1"
primaryColor = "#2DD4BF"
borderColor = "#1E3A5F"

[client]
toolbarMode = "minimal"
showErrorDetails = "none"

[browser]
gatherUsageStats = false

[server]
maxUploadSize = 25
