name: Refresh and publish The Living AI Book

on:
  push:
    branches:
      - main
    paths:
      - "living_ai_book.py"
      - "pwa/**"
      - ".github/workflows/publish-living-ai-book.yml"
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: living-ai-book-pages
  cancel-in-progress: false

jobs:
  refresh-and-publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out the book
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Refresh official AI feeds and build the new edition
        run: python living_ai_book.py --refresh --export-pwa-data

      - name: Save the refreshed edition for the next scheduled run
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ai_updates.json pwa/book-data.json
          if ! git diff --cached --quiet; then
            git commit -m "Refresh Living AI Book edition"
            git push
          fi

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload the installable book
        uses: actions/upload-pages-artifact@v3
        with:
          path: pwa

      - name: Publish the book
        id: deployment
        uses: actions/deploy-pages@v4
