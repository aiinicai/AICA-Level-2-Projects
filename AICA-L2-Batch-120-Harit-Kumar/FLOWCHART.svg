<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">The Living AI Book project flow</title>
  <desc id="desc">Authored educational chapters and public AI announcement feeds are assembled by a Python standard-library application into book data. The data is served by a local reader or displayed in a static installable PWA. Optionally GitHub Actions refreshes data and GitHub Pages hosts the PWA over HTTPS.</desc>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M1 1 11 6 1 11" fill="none" stroke="#52685a" stroke-width="2"/></marker>
    <style>
      .bg{fill:#f7f3e9}.title{font:700 30px 'Segoe UI',sans-serif;fill:#213d32}.sub{font:16px 'Segoe UI',sans-serif;fill:#657368}
      .box{fill:#fffdf7;stroke:#bd985d;stroke-width:2;rx:16}.green{fill:#e5eee3;stroke:#63816c;stroke-width:2;rx:16}.blue{fill:#e8eff2;stroke:#6b8790;stroke-width:2;rx:16}.gold{fill:#f5ecd9;stroke:#bd985d;stroke-width:2;rx:16}
      .h{font:700 17px 'Segoe UI',sans-serif;fill:#26382f}.t{font:14px 'Segoe UI',sans-serif;fill:#48584e}.sm{font:12px 'Segoe UI',sans-serif;fill:#657368}
      .line{fill:none;stroke:#52685a;stroke-width:2.5;marker-end:url(#arrow)}.dash{fill:none;stroke:#738879;stroke-width:2;stroke-dasharray:7 6;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect class="bg" width="1200" height="760"/>
  <text class="title" x="600" y="48" text-anchor="middle">The Living AI Book — project flow</text>
  <text class="sub" x="600" y="77" text-anchor="middle">Learning content + sourced updates → an interactive book for young readers</text>

  <rect class="gold" x="55" y="125" width="285" height="125"/>
  <text class="h" x="197" y="160" text-anchor="middle">Public AI feeds</text>
  <text class="t" x="197" y="190" text-anchor="middle">OpenAI · Google AI · Hugging Face</text>
  <text class="sm" x="197" y="220" text-anchor="middle">Publisher descriptions; not fact-checks</text>

  <rect class="box" x="455" y="125" width="300" height="125"/>
  <text class="h" x="605" y="160" text-anchor="middle">Python application</text>
  <text class="t" x="605" y="190" text-anchor="middle">Standard library · RSS/XML · JSON</text>
  <text class="sm" x="605" y="220" text-anchor="middle">Refreshes feeds and builds book data</text>

  <rect class="green" x="860" y="125" width="285" height="125"/>
  <text class="h" x="1002" y="160" text-anchor="middle">Edition data</text>
  <text class="t" x="1002" y="190" text-anchor="middle">ai_updates.json</text>
  <text class="t" x="1002" y="220" text-anchor="middle">pwa/book-data.json</text>
  <path class="line" d="M340 187H447"/><path class="line" d="M755 187H852"/>

  <rect class="box" x="455" y="320" width="300" height="125"/>
  <text class="h" x="605" y="355" text-anchor="middle">Authored chapters</text>
  <text class="t" x="605" y="385" text-anchor="middle">AI basics · timeline · applications</text>
  <text class="t" x="605" y="412" text-anchor="middle">Cartoons · activities · safe use</text>
  <path class="line" d="M605 320V258"/>

  <rect class="blue" x="150" y="530" width="380" height="130"/>
  <text class="h" x="340" y="570" text-anchor="middle">Local Python reader</text>
  <text class="t" x="340" y="600" text-anchor="middle">Run py living_ai_book.py</text>
  <text class="t" x="340" y="628" text-anchor="middle">Page turns · contents · refresh</text>

  <rect class="green" x="670" y="530" width="380" height="130"/>
  <text class="h" x="860" y="570" text-anchor="middle">Static installable PWA</text>
  <text class="t" x="860" y="600" text-anchor="middle">HTML · CSS · JavaScript · manifest · service worker</text>
  <text class="t" x="860" y="628" text-anchor="middle">Cached offline · install over HTTPS</text>

  <path class="line" d="M900 250V285H340V522"/><path class="line" d="M1000 250V285H860V522"/>
  <path class="line" d="M605 445V480H340V522"/><path class="line" d="M605 445V480H860V522"/>

  <rect class="gold" x="410" y="690" width="380" height="55"/>
  <text class="h" x="600" y="714" text-anchor="middle">Optional publication</text>
  <text class="sm" x="600" y="735" text-anchor="middle">GitHub Actions refresh → GitHub Pages HTTPS URL</text>
  <path class="dash" d="M860 660V682H790"/>
</svg>
